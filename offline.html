*\n\n\"这第三份，\"把头把纸放平，\"当初立它，是为了堵道上的嘴。老丈是坐地户——有人见他跟外来的伙进山，若没这张纸兜底，往后谁都能往他头上扣一顶'挖绝户坟'的帽子。\"\n\n\"可这张纸上，一个字都没提山。\"\n\n\"提了山，还算什么兜底？\"把头说，\"给道上看的东西，从来不是给人看的——是给人躲的。躲的是山，护的是人。\"\n\n他顿了顿：\"老丈，你要退伙，我不拦你。可这份约不能撕，我也不能收。这第三张上头本就写着你王药根的名字——你往道上一亮，谁都知道：那桩'清运旧铁'的活儿办结了。办结，就是散伙。\"\n\n\"散伙？\"\n\n\"散伙。\"把头说，\"你干干净净地走，我们也干干净净地散。往后有人问王老丈认不认识那伙人，你说不认识；问那伙人去哪儿了，你说散了。白纸黑字，你理直气壮。\"\n\n王药根盯着那张纸，盯了很久。\n\n\"你要我把这张纸亮出去。\"他说，\"是想让道上的人都知道——那伙人，散了。\"\n\n把头没答。\n\n我看出来了。\n\n药根要退伙，把头应下的不是\"退\"，是借这一退，把这伙人从道上的眼睛里\"摘\"出去。飘带封了山门，草帽人问到了老周门上，缺指人守着废品站——所有人都在盯着我们。可要是\"这伙人已经散了\"呢？\n\n散了的伙，就不值得盯了。\n\n\"老丈。\"把头又说，\"你应得的，不是一文不要。该给的辛苦钱，我不会短你。往后你带着满意过你的日子，山里头的事——\"\n\n\"山里头的事，\"王药根接过话，\"跟我王药根，再没关系。\"\n\n他把那张第三份约仔仔细细折好，跟自己的那份并在一起，收进怀里。\n\n\"鸡呢？\"他忽然问。\n\n鱼哥把那只老避龙从布兜里抱出来，放到王药根手上。老头摸了摸它的冠子，又把它放回鱼哥手心。\n\n\"鸡你留着。\"他说，\"这畜生认你。魇着的时候，别点灯，别喊魂——把镜子压在胸口，让鸡蹲在你脚边，它镇得住。\"\n\n王药根站起身，走到门口又停下，回过头来看着我。\n\n\"云峰小友。\"\n\n\"大爷。\"\n\n\"我那老屋，后墙根底下埋着一坛子老酒，还有半口袋干蛇药。\"他说，\"你们要用，自己去刨，别跟外人说是我给的。\"\n\n\"记住了。\"\n\n\"还有——\"他张了张嘴，像是想说什么，最终只摆了摆手，\"罢了。走了。\"\n\n他迈出门槛的时候，正是黄昏，一步一步往院门口走。豆芽仔追了两步：\"老爷子，我送您！\"\n\n\"不用送。\"王药根头也没回，\"路我认得。我这辈子走的都是这条路。\"\n\n他走了。\n\n我看着他的背影消失在柞树林边上，忽然觉得，这个守了半辈子山的老人，像一座终于关上了门的庙。\n\n吃过晚饭，把头把我们都叫到堂屋。\n\n\"药根走了，飘带的风头也就过去了。\"他盘腿坐在炕上，慢条斯理地卷烟，\"可咱们的活儿，没完。\"\n\n豆芽仔问：\"头儿，那咱们下一步干啥？\"\n\n\"先把这处据点挪了。\"把头说，\"飘带能送到老屋，就能送到这儿。今儿夜里，东西收拾利索，明早咱们往雅河乡那头搬。\"\n\n\"雅河乡？\"我一愣，\"那不是那俩包头客住过的地界？\"\n\n\"最危险的地方，最没人查。\"把头说，\"那俩包头客住过的地方，道上的眼睛早扫过八百遍——扫过的地方，才干净。\"\n\n他卷好烟，点上，抽了一口。\n\n\"云峰。\"\n\n\"在。\"\n\n\"药根走了，这伙人散了。可'散'是对外头散的。\"他看着我，\"对内，还有一件事没办——那口空锅。\"\n\n我心里一跳。\n\n\"那口锅，还扣在石室里。\"\n\n\"对。\"把头说，\"它扣在那儿一天，那伙人就惦记一天，早晚有人抢在咱们前头。可这锅认主——阴契在你身上，你就是消奴部认下的当家人。别人碰它，它不跟人走。\"\n\n\"您的意思是——\"\n\n\"趁着眼下所有眼睛都盯着咱们'散伙'，你挑个夜里，一个人进沟，把那口锅请出来。\"把头说，\"带上镜子，带上那只鸡。请到锅，别走原路出沟——锅走正路，人走旁路。锅先藏好，人再露面。\"\n\n\"什么时候？\"\n\n\"三天后。\"把头把烟灰磕在炕沿上，\"等把门人的带子送到了，等道上'散伙'的话传开了，等沟口的眼睛都撤了——就是时候了。\"\n\n他抬起头，看着我，目光又沉又定：\n\n\"云峰，这一趟，就你一个人。\"\n\n夜里，我躺在炕上，翻来覆去睡不着。\n\n三天。\n\n三天后，我一个人进沟。\n\n那口空锅还在石室里等着。它底下压着的东西早被我取走了，可锅还在——它会认得我吗？\n\n电话是在后半夜响起来的。\n\n我摸黑抓起手机，是老周。\n\n\"兄弟！\"他的声音发紧，\"那个戴草帽的，又来了！\"\n\n\"他来做什么？\"\n\n\"他没进门，隔着门缝跟我说——\"老周咽了口唾沫，一字一顿地学，\"'回去告诉你们那个会尝土的年轻人：那口空锅，搬得动就快搬。搬不动，就别让人烧了。'\"\n\n电话那头，老周还在絮絮叨叨地说什么，我已经听不见了。\n\n窗户纸上透着一点灰白的天光。我把手机放下，看着窗外那片慢慢亮起来的柞树林，忽然想起王药根说过的那句话——\n\n山要收账。\n\n可这账，到底是向谁收的？", "words": 3386, "html": "<p>第二天一早，豆芽仔就把那根带子带了回来。<\/p>\n<p>他跑了一夜，眼圈青着，进门把一个塑料袋放在桌上，又从怀里掏出一张纸片：\"满意天没亮就让他舅接去宽甸他姨奶家了。这是那人留下的纸包皮，上头有字。\"<\/p>\n<p>王药根接过纸片，就着天光看了很久。<\/p>\n<p>纸皮上只有一行字，铅笔写的，笔画很硬：<\/p>\n<p>\"王老爷子收。货已验，人已出，山门从此关。\"<\/p>\n<p>\"货已验，人已出。\"我念了一遍，\"什么叫货已验？\"<\/p>\n<p>\"验的就是咱们。\"鱼哥靠在门框上，声音淡淡的，\"咱们从沟里出来，一个没少。他们把咱们当'货'数过了。\"<\/p>\n<p>我后脊梁一凉。<\/p>\n<p>那夜石室里有人掀锅、有人数锅——原来数的不是锅。<\/p>\n<p>是我们。<\/p>\n<p>王药根把纸片折好，收进怀里。他没提退伙的事，只把那根红黑带子平铺在桌上，抚平，用指腹一道一道地压过去。<\/p>\n<p>\"老辈人讲，\"他开口了，\"山里把门人传信，不用纸笔。红带子横送上门，是封门——山不让你进了；黑带子竖别门框，是请——山里头有人等你。\"<\/p>\n<p>\"横的送的是红的黑的？\"<\/p>\n<p>\"红黑一道儿，是封门里的死封。\"老头说，\"意思是：往后这座山，你连望都不许望一眼。\"<\/p>\n<p>\"封的是您？\"<\/p>\n<p>\"封的是咱们这几个从沟里出来的人。\"王药根抬起头，\"进去的可以，出来的不行——这是把门人几十年的规矩。我年轻时不信，只当是老古话。今儿知道了，那不是古话，是话。\"<\/p>\n<p>他顿了顿：\"咱们破了规矩。破了规矩的人，山要收账。\"<\/p>\n<p>屋里静了一瞬。<\/p>\n<p>小萱从里屋端了茶出来，给我们一人倒了一碗，又默默地退回里屋去了。<\/p>\n<p>\"老丈。\"把头开口，\"你打算怎么走？\"<\/p>\n<p>王药根从怀里摸出一样东西，放在桌上——一张折成四方块的黄纸，纸边磨得起毛，用红绳系着。<\/p>\n<p>那是他的那一份分金约。<\/p>\n<p>\"我这一份，在这儿。\"他说，\"今儿请你们诸位做个见证：我王药根，退伙。\"<\/p>\n<p>他说完，把红绳解开，将那张黄纸在桌上摊平。纸上的字，是把头的字。行里的约，从来不叫外人写。<\/p>\n<p>\"老丈。\"我忍不住开口，\"您想清楚——\"<\/p>\n<p>\"想清楚了。\"王药根打断我，\"我这辈子进过三回山。头一回，我自个儿回来，丢了半条命；第二回，我把儿子送进去，儿子再没出得来；第三回，是你把我领进去的——我见了我想见的东西，可我也惊动了把门人。\"<\/p>\n<p>他摩挲着那张约：\"头一回我年轻，不懂退；第二回我贪，不肯退。这第三回要是再不退，第四回，就该是满意替我进了。\"<\/p>\n<p>他把约推到桌子中间。<\/p>\n<p>\"我要退伙。这份约，请把头收回去。我应的分成，一文不要。\"<\/p>\n<p>豆芽仔张了张嘴，又闭上。鱼哥抱着膀子站在门口，没动。<\/p>\n<p>把头坐在上首，看着那张摊开的约，看了很久。<\/p>\n<p>\"老丈。\"他终于开口，\"约，我不能收。\"<\/p>\n<p>\"怎么？\"<\/p>\n<p>\"你的约在我这儿留着，你在道上才算'还有人管着'。\"把头说，\"我把约收了，你前脚出门，后脚就有人敢动你——一个没约没主的蛇花子，谁都敢捏一把。\"<\/p>\n<p>\"可是——\"<\/p>\n<p>\"可是你想干干净净地退。\"把头接口道，\"这行里，没有'退伙'这个说法。只有两种走法：一种是散伙，伙没了，约自然作废；另一种是——\"他顿了一下，\"办结。\"<\/p>\n<p>\"办结？\"<\/p>\n<p>把头站起身，从贴身夹袄的暗兜里摸出一张纸来。那纸比桌上的新，折成窄窄的长条，封皮上写着三个字——\"分金约\"。<\/p>\n<p>他把它放在桌上，压在王药根那张约的旁边。<\/p>\n<p>\"老丈，你还记得签约那天，我说过一句话么？\"<\/p>\n<p>\"你说，\"王药根看着那张纸，\"咱们这约，不是两份，是三份。第三张，是给道上看。\"<\/p>\n<p>\"对。\"把头说，\"就是这张。\"<\/p>\n<p>我心里一紧。<\/p>\n<p>两份约——你一份，我们一份。可这第三份，我从来没听他提起过。<\/p>\n<p>\"三份约，\"把头把那张长纸展开，\"头两份，是咱们自己看的，写的是真话：你应几成，我们应几成，私藏者三刀六洞。这第三份——\"<\/p>\n<p>他把它转过来，冲着我们，一字一字念道：<\/p>\n<p>\"'立约人：桓仁坐地户王药根。事由：代清运旧铁杂件一宗，工讫两讫，各不相欠。事讫人散，永不追讨。'\"<\/p>\n<p>我愣住了。<\/p>\n<p>没有分成，没有三刀六洞，没有山，没有沟，没有锅。<\/p>\n<p>通篇只有八个字是实的：<strong>事讫人散，永不追讨。<\/strong><\/p>\n<p>\"这第三份，\"把头把纸放平，\"当初立它，是为了堵道上的嘴。老丈是坐地户——有人见他跟外来的伙进山，若没这张纸兜底，往后谁都能往他头上扣一顶'挖绝户坟'的帽子。\"<\/p>\n<p>\"可这张纸上，一个字都没提山。\"<\/p>\n<p>\"提了山，还算什么兜底？\"把头说，\"给道上看的东西，从来不是给人看的——是给人躲的。躲的是山，护的是人。\"<\/p>\n<p>他顿了顿：\"老丈，你要退伙，我不拦你。可这份约不能撕，我也不能收。这第三张上头本就写着你王药根的名字——你往道上一亮，谁都知道：那桩'清运旧铁'的活儿办结了。办结，就是散伙。\"<\/p>\n<p>\"散伙？\"<\/p>\n<p>\"散伙。\"把头说，\"你干干净净地走，我们也干干净净地散。往后有人问王老丈认不认识那伙人，你说不认识；问那伙人去哪儿了，你说散了。白纸黑字，你理直气壮。\"<\/p>\n<p>王药根盯着那张纸，盯了很久。<\/p>\n<p>\"你要我把这张纸亮出去。\"他说，\"是想让道上的人都知道——那伙人，散了。\"<\/p>\n<p>把头没答。<\/p>\n<p>我看出来了。<\/p>\n<p>药根要退伙，把头应下的不是\"退\"，是借这一退，把这伙人从道上的眼睛里\"摘\"出去。飘带封了山门，草帽人问到了老周门上，缺指人守着废品站——所有人都在盯着我们。可要是\"这伙人已经散了\"呢？<\/p>\n<p>散了的伙，就不值得盯了。<\/p>\n<p>\"老丈。\"把头又说，\"你应得的，不是一文不要。该给的辛苦钱，我不会短你。往后你带着满意过你的日子，山里头的事——\"<\/p>\n<p>\"山里头的事，\"王药根接过话，\"跟我王药根，再没关系。\"<\/p>\n<p>他把那张第三份约仔仔细细折好，跟自己的那份并在一起，收进怀里。<\/p>\n<p>\"鸡呢？\"他忽然问。<\/p>\n<p>鱼哥把那只老避龙从布兜里抱出来，放到王药根手上。老头摸了摸它的冠子，又把它放回鱼哥手心。<\/p>\n<p>\"鸡你留着。\"他说，\"这畜生认你。魇着的时候，别点灯，别喊魂——把镜子压在胸口，让鸡蹲在你脚边，它镇得住。\"<\/p>\n<p>王药根站起身，走到门口又停下，回过头来看着我。<\/p>\n<p>\"云峰小友。\"<\/p>\n<p>\"大爷。\"<\/p>\n<p>\"我那老屋，后墙根底下埋着一坛子老酒，还有半口袋干蛇药。\"他说，\"你们要用，自己去刨，别跟外人说是我给的。\"<\/p>\n<p>\"记住了。\"<\/p>\n<p>\"还有——\"他张了张嘴，像是想说什么，最终只摆了摆手，\"罢了。走了。\"<\/p>\n<p>他迈出门槛的时候，正是黄昏，一步一步往院门口走。豆芽仔追了两步：\"老爷子，我送您！\"<\/p>\n<p>\"不用送。\"王药根头也没回，\"路我认得。我这辈子走的都是这条路。\"<\/p>\n<p>他走了。<\/p>\n<p>我看着他的背影消失在柞树林边上，忽然觉得，这个守了半辈子山的老人，像一座终于关上了门的庙。<\/p>\n<p>吃过晚饭，把头把我们都叫到堂屋。<\/p>\n<p>\"药根走了，飘带的风头也就过去了。\"他盘腿坐在炕上，慢条斯理地卷烟，\"可咱们的活儿，没完。\"<\/p>\n<p>豆芽仔问：\"头儿，那咱们下一步干啥？\"<\/p>\n<p>\"先把这处据点挪了。\"把头说，\"飘带能送到老屋，就能送到这儿。今儿夜里，东西收拾利索，明早咱们往雅河乡那头搬。\"<\/p>\n<p>\"雅河乡？\"我一愣，\"那不是那俩包头客住过的地界？\"<\/p>\n<p>\"最危险的地方，最没人查。\"把头说，\"那俩包头客住过的地方，道上的眼睛早扫过八百遍——扫过的地方，才干净。\"<\/p>\n<p>他卷好烟，点上，抽了一口。<\/p>\n<p>\"云峰。\"<\/p>\n<p>\"在。\"<\/p>\n<p>\"药根走了，这伙人散了。可'散'是对外头散的。\"他看着我，\"对内，还有一件事没办——那口空锅。\"<\/p>\n<p>我心里一跳。<\/p>\n<p>\"那口锅，还扣在石室里。\"<\/p>\n<p>\"对。\"把头说，\"它扣在那儿一天，那伙人就惦记一天，早晚有人抢在咱们前头。可这锅认主——阴契在你身上，你就是消奴部认下的当家人。别人碰它，它不跟人走。\"<\/p>\n<p>\"您的意思是——\"<\/p>\n<p>\"趁着眼下所有眼睛都盯着咱们'散伙'，你挑个夜里，一个人进沟，把那口锅请出来。\"把头说，\"带上镜子，带上那只鸡。请到锅，别走原路出沟——锅走正路，人走旁路。锅先藏好，人再露面。\"<\/p>\n<p>\"什么时候？\"<\/p>\n<p>\"三天后。\"把头把烟灰磕在炕沿上，\"等把门人的带子送到了，等道上'散伙'的话传开了，等沟口的眼睛都撤了——就是时候了。\"<\/p>\n<p>他抬起头，看着我，目光又沉又定：<\/p>\n<p>\"云峰，这一趟，就你一个人。\"<\/p>\n<p>夜里，我躺在炕上，翻来覆去睡不着。<\/p>\n<p>三天。<\/p>\n<p>三天后，我一个人进沟。<\/p>\n<p>那口空锅还在石室里等着。它底下压着的东西早被我取走了，可锅还在——它会认得我吗？<\/p>\n<p>电话是在后半夜响起来的。<\/p>\n<p>我摸黑抓起手机，是老周。<\/p>\n<p>\"兄弟！\"他的声音发紧，\"那个戴草帽的，又来了！\"<\/p>\n<p>\"他来做什么？\"<\/p>\n<p>\"他没进门，隔着门缝跟我说——\"老周咽了口唾沫，一字一顿地学，\"'回去告诉你们那个会尝土的年轻人：那口空锅，搬得动就快搬。搬不动，就别让人烧了。'\"<\/p>\n<p>电话那头，老周还在絮絮叨叨地说什么，我已经听不见了。<\/p>\n<p>窗户纸上透着一点灰白的天光。我把手机放下，看着窗外那片慢慢亮起来的柞树林，忽然想起王药根说过的那句话——<\/p>\n<p>山要收账。<\/p>\n<p>可这账，到底是向谁收的？<\/p>", "plain": "第二天一早，豆芽仔就把那根带子带了回来。 他跑了一夜，眼圈青着，进门把一个塑料袋放在桌上，又从怀里掏出一张纸片：\"满意天没亮就让他舅接去宽甸他姨奶家了。这是那人留下的纸包皮，上头有字。\" 王药根接过纸片，就着天光看了很久。 纸皮上只有一行字，铅笔写的，笔画很硬： \"王老爷子收。货已验，人已出，山门从此关。\" \"货已验，人已出。\"我念了一遍，\"什么叫货已验？\" \"验的就是咱们。\"鱼哥靠在门框上，声音淡淡的，\"咱们从沟里出来，一个没少。他们把咱们当'货'数过了。\" 我后脊梁一凉。 那夜石室里有人掀锅、有人数锅——原来数的不是锅。 是我们。 王药根把纸片折好，收进怀里。他没提退伙的事，只把那根红黑带子平铺在桌上，抚平，用指腹一道一道地压过去。 \"老辈人讲，\"他开口了，\"山里把门人传信，不用纸笔。红带子横送上门，是封门——山不让你进了；黑带子竖别门框，是请——山里头有人等你。\" \"横的送的是红的黑的？\" \"红黑一道儿，是封门里的死封。\"老头说，\"意思是：往后这座山，你连望都不许望一眼。\" \"封的是您？\" \"封的是咱们这几个从沟里出来的人。\"王药根抬起头，\"进去的可以，出来的不行——这是把门人几十年的规矩。我年轻时不信，只当是老古话。今儿知道了，那不是古话，是话。\" 他顿了顿：\"咱们破了规矩。破了规矩的人，山要收账。\" 屋里静了一瞬。 小萱从里屋端了茶出来，给我们一人倒了一碗，又默默地退回里屋去了。 \"老丈。\"把头开口，\"你打算怎么走？\" 王药根从怀里摸出一样东西，放在桌上——一张折成四方块的黄纸，纸边磨得起毛，用红绳系着。 那是他的那一份分金约。 \"我这一份，在这儿。\"他说，\"今儿请你们诸位做个见证：我王药根，退伙。\" 他说完，把红绳解开，将那张黄纸在桌上摊平。纸上的字，是把头的字。行里的约，从来不叫外人写。 \"老丈。\"我忍不住开口，\"您想清楚——\" \"想清楚了。\"王药根打断我，\"我这辈子进过三回山。头一回，我自个儿回来，丢了半条命；第二回，我把儿子送进去，儿子再没出得来；第三回，是你把我领进去的——我见了我想见的东西，可我也惊动了把门人。\" 他摩挲着那张约：\"头一回我年轻，不懂退；第二回我贪，不肯退。这第三回要是再不退，第四回，就该是满意替我进了。\" 他把约推到桌子中间。 \"我要退伙。这份约，请把头收回去。我应的分成，一文不要。\" 豆芽仔张了张嘴，又闭上。鱼哥抱着膀子站在门口，没动。 把头坐在上首，看着那张摊开的约，看了很久。 \"老丈。\"他终于开口，\"约，我不能收。\" \"怎么？\" \"你的约在我这儿留着，你在道上才算'还有人管着'。\"把头说，\"我把约收了，你前脚出门，后脚就有人敢动你——一个没约没主的蛇花子，谁都敢捏一把。\" \"可是——\" \"可是你想干干净净地退。\"把头接口道，\"这行里，没有'退伙'这个说法。只有两种走法：一种是散伙，伙没了，约自然作废；另一种是——\"他顿了一下，\"办结。\" \"办结？\" 把头站起身，从贴身夹袄的暗兜里摸出一张纸来。那纸比桌上的新，折成窄窄的长条，封皮上写着三个字——\"分金约\"。 他把它放在桌上，压在王药根那张约的旁边。 \"老丈，你还记得签约那天，我说过一句话么？\" \"你说，\"王药根看着那张纸，\"咱们这约，不是两份，是三份。第三张，是给道上看。\" \"对。\"把头说，\"就是这张。\" 我心里一紧。 两份约——你一份，我们一份。可这第三份，我从来没听他提起过。 \"三份约，\"把头把那张长纸展开，\"头两份，是咱们自己看的，写的是真话：你应几成，我们应几成，私藏者三刀六洞。这第三份——\" 他把它转过来，冲着我们，一字一字念道： \"'立约人：桓仁坐地户王药根。事由：代清运旧铁杂件一宗，工讫两讫，各不相欠。事讫人散，永不追讨。'\" 我愣住了。 没有分成，没有三刀六洞，没有山，没有沟，没有锅。 通篇只有八个字是实的：事讫人散，永不追讨。 \"这第三份，\"把头把纸放平，\"当初立它，是为了堵道上的嘴。老丈是坐地户——有人见他跟外来的伙进山，若没这张纸兜底，往后谁都能往他头上扣一顶'挖绝户坟'的帽子。\" \"可这张纸上，一个字都没提山。\" \"提了山，还算什么兜底？\"把头说，\"给道上看的东西，从来不是给人看的——是给人躲的。躲的是山，护的是人。\" 他顿了顿：\"老丈，你要退伙，我不拦你。可这份约不能撕，我也不能收。这第三张上头本就写着你王药根的名字——你往道上一亮，谁都知道：那桩'清运旧铁'的活儿办结了。办结，就是散伙。\" \"散伙？\" \"散伙。\"把头说，\"你干干净净地走，我们也干干净净地散。往后有人问王老丈认不认识那伙人，你说不认识；问那伙人去哪儿了，你说散了。白纸黑字，你理直气壮。\" 王药根盯着那张纸，盯了很久。 \"你要我把这张纸亮出去。\"他说，\"是想让道上的人都知道——那伙人，散了。\" 把头没答。 我看出来了。 药根要退伙，把头应下的不是\"退\"，是借这一退，把这伙人从道上的眼睛里\"摘\"出去。飘带封了山门，草帽人问到了老周门上，缺指人守着废品站——所有人都在盯着我们。可要是\"这伙人已经散了\"呢？ 散了的伙，就不值得盯了。 \"老丈。\"把头又说，\"你应得的，不是一文不要。该给的辛苦钱，我不会短你。往后你带着满意过你的日子，山里头的事——\" \"山里头的事，\"王药根接过话，\"跟我王药根，再没关系。\" 他把那张第三份约仔仔细细折好，跟自己的那份并在一起，收进怀里。 \"鸡呢？\"他忽然问。 鱼哥把那只老避龙从布兜里抱出来，放到王药根手上。老头摸了摸它的冠子，又把它放回鱼哥手心。 \"鸡你留着。\"他说，\"这畜生认你。魇着的时候，别点灯，别喊魂——把镜子压在胸口，让鸡蹲在你脚边，它镇得住。\" 王药根站起身，走到门口又停下，回过头来看着我。 \"云峰小友。\" \"大爷。\" \"我那老屋，后墙根底下埋着一坛子老酒，还有半口袋干蛇药。\"他说，\"你们要用，自己去刨，别跟外人说是我给的。\" \"记住了。\" \"还有——\"他张了张嘴，像是想说什么，最终只摆了摆手，\"罢了。走了。\" 他迈出门槛的时候，正是黄昏，一步一步往院门口走。豆芽仔追了两步：\"老爷子，我送您！\" \"不用送。\"王药根头也没回，\"路我认得。我这辈子走的都是这条路。\" 他走了。 我看着他的背影消失在柞树林边上，忽然觉得，这个守了半辈子山的老人，像一座终于关上了门的庙。 吃过晚饭，把头把我们都叫到堂屋。 \"药根走了，飘带的风头也就过去了。\"他盘腿坐在炕上，慢条斯理地卷烟，\"可咱们的活儿，没完。\" 豆芽仔问：\"头儿，那咱们下一步干啥？\" \"先把这处据点挪了。\"把头说，\"飘带能送到老屋，就能送到这儿。今儿夜里，东西收拾利索，明早咱们往雅河乡那头搬。\" \"雅河乡？\"我一愣，\"那不是那俩包头客住过的地界？\" \"最危险的地方，最没人查。\"把头说，\"那俩包头客住过的地方，道上的眼睛早扫过八百遍——扫过的地方，才干净。\" 他卷好烟，点上，抽了一口。 \"云峰。\" \"在。\" \"药根走了，这伙人散了。可'散'是对外头散的。\"他看着我，\"对内，还有一件事没办——那口空锅。\" 我心里一跳。 \"那口锅，还扣在石室里。\" \"对。\"把头说，\"它扣在那儿一天，那伙人就惦记一天，早晚有人抢在咱们前头。可这锅认主——阴契在你身上，你就是消奴部认下的当家人。别人碰它，它不跟人走。\" \"您的意思是——\" \"趁着眼下所有眼睛都盯着咱们'散伙'，你挑个夜里，一个人进沟，把那口锅请出来。\"把头说，\"带上镜子，带上那只鸡。请到锅，别走原路出沟——锅走正路，人走旁路。锅先藏好，人再露面。\" \"什么时候？\" \"三天后。\"把头把烟灰磕在炕沿上，\"等把门人的带子送到了，等道上'散伙'的话传开了，等沟口的眼睛都撤了——就是时候了。\" 他抬起头，看着我，目光又沉又定： \"云峰，这一趟，就你一个人。\" 夜里，我躺在炕上，翻来覆去睡不着。 三天。 三天后，我一个人进沟。 那口空锅还在石室里等着。它底下压着的东西早被我取走了，可锅还在——它会认得我吗？ 电话是在后半夜响起来的。 我摸黑抓起手机，是老周。 \"兄弟！\"他的声音发紧，\"那个戴草帽的，又来了！\" \"他来做什么？\" \"他没进门，隔着门缝跟我说——\"老周咽了口唾沫，一字一顿地学，\"'回去告诉你们那个会尝土的年轻人：那口空锅，搬得动就快搬。搬不动，就别让人烧了。'\" 电话那头，老周还在絮絮叨叨地说什么，我已经听不见了。 窗户纸上透着一点灰白的天光。我把手机放下，看着窗外那片慢慢亮起来的柞树林，忽然想起王药根说过的那句话—— 山要收账。 可这账，到底是向谁收的？"}, {"id": "A5-076", "arc": "A5", "num": 76, "title": "断", "md": "三天后的晚上，我一个人上路。\n\n出发前，鱼哥把照魇镜从怀里掏出来，塞进我手心里，什么也没说。他把那只老避龙从布兜里放出来，让鸡蹲在他脚边，意思是——镜子借你，鸡我留着。\n\n我蹲下身，拍了拍鸡冠子，冲他咧嘴：\"你魇着的时候，可别让鸡满屋扑腾。\"\n\n鱼哥难得笑了一下：\"它认我。\"\n\n我走出院门的时候，回头看了一眼。雅河乡的这间废蜂房立在半坡上，后头是黑压压的柞树林，屋里一灯如豆。小萱站在门口，扶着门框，没说话，只朝我摆了摆手。\n\n我朝她点点头，转身走进了林子。\n\n从雅河乡到鹰嘴沟，抄小路走，要小半夜。我把那件防雨布衣裳翻过来穿，兜里揣着手电，可一路没开——路我走过两遍了，沟口那道\"龙回头\"的窄梁，我闭着眼都摸得着。\n\n今夜无月，星子也稀，天黑得像锅底。\n\n到了龙回头，我停了停。\n\n进沟的地方在梁子底下，那晚把头领着我们，就是从这儿一脚踩进雾里去的。如今雾也散了，沟口那道石梁黑黢黢地横着，上头光秃秃的——半个来月前那口吊锅被人截走的绳头，还耷拉在半空，风一吹，轻轻地晃。\n\n我看了它一眼，没停，弯腰钻进了石缝。\n\n越往深走，夜气越沉。\n\n石缝里那股子味还在——潮土、铁锈、还有一点点说不清的腥。我摸着石壁走，指腹上全是千年的凉。走到人工石缝尽头，那扇锁眼石封门墙跟前，我照老规矩，把阴契从怀里掏出来，攥在手心里，贴着门缝伸进去。\n\n没有动静。\n\n我又等了一息，才侧身挤了过去。\n\n盟坛石室还是老样子。\n\n拱顶的水滴声，一滴，一滴，像座走了一千多年的钟。五口锅，还倒扣在原处，灰扑扑的，一口不少。西南墙根那块色气发乌的空地，也还在——那是第六位，被人起走东西的地方。\n\n我打着手电，照了一圈。\n\n北墙根，那半块青砖还在。\n\n砖上干干净净。那只白纸灯笼，不在了。\n\n我心里一跳，手电光在那片墙上又扫了一遍。灯确实没了，墙槽里只留下一点竹篾刮过的白痕。砖面上也没有烟头——两个月前灯下那截\"今天抽的急烟\"，早就被人收走了。\n\n谁收的？\n\n我把这个念头压下去，走到正中那口锅跟前，蹲下。\n\n五口锅里，这一口最不起眼。陶色发灰，锅沿磕了几个口子，翻扣在地上，像一块普普通通的破瓦。可我知道，就是这一口底下，压过一块无字的银符；就是这一口，是那个被抹了名字的消奴部，在人世上留下的最后一样东西。\n\n我伸手按住锅沿。\n\n\"老兄，\"我低声说，\"跟不跟我走？\"\n\n锅当然不会答话。\n\n我把它掀起来，翻了个个儿，口朝上放稳。锅底积着一层灰，我用袖子草草擦了两把，露出底下一圈粗陶胎。锅不沉，比我预想的轻，抱在怀里，像抱着一口倒扣的钟。\n\n我拿防雨布把它裹了，又拿麻绳在锅沿上十字交叉捆紧，往背上一勒。\n\n锅上了背，人就得走。\n\n我最后看了一眼这间石室。五口锅如今只剩四口，围着当中那块圆印子，像一桌酒席被人撤走了主位。\n\n\"东西是死的，跑不了。\"把头的话在我耳边响了一遍。\n\n我背上锅，朝石缝口走去。\n\n走出七八步，我站住了。\n\n缝口那块卧牛大的青石上，坐着一个人。\n\n他背对着我，坐在石头的阴影里，灰褂子，黑布鞋，一头白发在暗处发着灰白的光。他没点灯，手里捏着根烟，烟头一明一灭，是东北烤烟那股子味儿。\n\n我的心一下子提到了嗓子眼。\n\n我进来的时候，缝口没人。这条缝只容一个人侧身走，他要是在我前头进来，我没理由看不见。要是在我后头进来的——更没理由。\n\n可他就在那儿坐着，像一截早就长在石头上的老树根。\n\n\"搬完了？\"他开口了，声音不高，带着点痰音，像很久没跟人说过话。\n\n我嗓子发紧：\"……搬完了。\"\n\n\"嗯。\"他抽了一口烟，头也没回，\"锅是死物，谁都能搬。你抱着的不是锅——是名分。名分是活的，认了主，就甩不脱。\"\n\n我后脊梁一凉。\n\n这话，把头对我说过。可这人，我今晚从没见过。\n\n\"你是谁？\"我问。\n\n\"守灯的。\"\n\n\"守什么灯？\"\n\n\"守你们这种，\"他把烟灰弹了弹，\"会自己点着的人。\"\n\n我攥着背带的手心里全是汗。费了多大的劲，才没让声音发飘：\"外头给我捎话的——那个戴草帽的，也是你的人？\"\n\n\"他不是人。\"白发老头顿了顿，补了一句，\"他是跑腿的。\"\n\n我一时没接上话。\n\n他又抽了口烟，慢吞吞地说：\"锅你带走，名分你认下。这都没什么——名分这东西，山里有的是，千年万年，认不完。可你坏了山里的规矩。\"\n\n\"什么规矩？\"\n\n\"灯的规矩。\"他把烟头掐灭在石头沿上，\"灯没点，你进来了；灯没灭，你出去了。进来的是人，出去的是客。客过山门，山要记一笔账。\"\n\n他站起来。\n\n那个头，比我预想的矮一些，瘦，可站起来那一下，石缝里那股凉气像是跟着他动了一下。\n\n\"这账，我不跟你记。\"他转过身来。\n\n就着一点天光，我看见他的脸——皱纹深得像刀刻的，眉毛全白了。可让我心里咯噔一下的，是他的左耳：耳廓齐着耳根，缺了多半截，只留一点肉桩子。\n\n缺耳。\n\n我脑子里\"嗡\"的一声。\n\n把头十九岁那年，在桓仁魇着，就是一个缺了多半截耳朵的白发老头，把照魇镜递给他的。三十七年了，那个老头要是活着，该是九十往上的年纪——可眼前这个人，看着也就是六十出头的样子。\n\n他弯腰掐烟的当口，灰褂子的袖口往上抽了一抽。\n\n袖口上，补着一块蓝布。\n\n补丁不大，针脚却细得惊人，一针压一针，齐得跟拿尺子量过似的。老周说过——两年前那个跟他红鼻头搭伙卖珍珠罐的白头发瘦子，灰褂子袖口上就补着这么一块蓝补丁，\"针脚细得比机器缝的还匀\"。\n\n我盯着那块补丁，血一下子涌上头顶。\n\n\"第五个还在沟里。\"王长顺那张画背面的铅笔字，在脑子里翻了个个儿。两年前五个人进的沟，老鼠男说四个没出来——可老周明明见过那白头发瘦子在外头撒货，猴三儿上月还见他在五女山北坡坐着等人。\n\n一个本该死在沟里的人，是怎么出去撒的货？\n\n又或者——出去的，从来就是眼前这个人？\n\n\"这账，\"他说，\"我记在你们那个领头的名下。\"\n\n\"为什么是他？\"\n\n\"因为他该还。\"缺耳老头说，\"三十七年前，我在桓仁把镜子交出去的时候，跟他说过一句话——'守字的东西，认守字的人。哪天你守不住了，把镜子送回桓仁来，我在老地方等。'\"\n\n石室里静得只剩水滴声。\n\n\"他守住了吗？\"老头看着我，目光很平，\"他要是守住了，就不该让镜子出了桓仁，跟着你们进山去照一口空锅。\"\n\n我张了张嘴，想替把头辩两句，可一个字都说不出来。\n\n因为他说的是实话——这面镜子，是照魇用的，本该压在魇症人的枕头底下。可它跟着我们进了沟，跟着我们看了锅、看了灯、看了那间石室里不该看的东西。\n\n\"我不难为你。\"老头重新坐下，摸出一根烟，又点上，\"锅你拿走，话你捎到。山里的账，一笔归一笔，我记性还不坏。\"\n\n我往缝口挪了两步，又停住。\n\n\"你还没说——'五月'是什么？\"\n\n\"我没说五月。\"老头抽着烟，\"你听岔了。\"\n\n我确实不该接这句。我咬了咬牙，侧身挤进缝口。石缝窄，背着锅，走得极慢。我一路走，一路支着耳朵听身后——没有脚步声，没有烟味跟来。\n\n可走出十几步的时候，缝里忽然响起一种声音。\n\n很轻，很慢。\n\n像有人蹲在石室的地上，拿指节，一粒一粒地敲石头。\n\n一。二。三。\n\n我浑身的汗毛一下子全竖了起来。\n\n王长顺烧了半个月的胡话，头一句是\"爹，锅是空的\"，第二句是——\"爹，第五个在数我\"。\n\n我不回头，也不敢回头，背着那口锅，在石缝里深一脚浅一脚地往外逃。那声音不紧不慢地跟在身后，敲一阵，停一阵，敲到第七下的时候，我听见它停了。\n\n停在我身后一步远的地方。\n\n我攥紧了怀里的照魇镜，猛地转过身去。\n\n身后是空的。\n\n石缝里黑黢黢的，只有我自己呼哧呼哧的喘气声。那声音，不知什么时候停了——或者说，从来就没跟着我出来过。\n\n我站了好一会儿，才继续走。\n\n出沟的时候，天边已经泛了白。\n\n我蹲在沟口的溪边，把那口锅从背上卸下来，想喘口气。锅沿磕口里积的灰，一路颠得我满脖子都是。我抹了把脸，看着溪水里那个灰头土脸的自己，忽然想起王药根说过的话——\n\n山要收账。\n\n从前我只当这是一句吓人的老话。可今儿夜里我知道了：账是真的有人记的。一笔记在把头的名下，等着哪天来收；还有一笔，记在我心里，像那阵敲石头的声音一样，敲一下，停一下，不知道什么时候，才算敲完。\n\n我背上锅，往雅河乡的方向走。\n\n身后那道石缝，在晨雾里慢慢合拢，像一张闭上的嘴。", "words": 3176, "html": "<p>三天后的晚上，我一个人上路。<\/p>\n<p>出发前，鱼哥把照魇镜从怀里掏出来，塞进我手心里，什么也没说。他把那只老避龙从布兜里放出来，让鸡蹲在他脚边，意思是——镜子借你，鸡我留着。<\/p>\n<p>我蹲下身，拍了拍鸡冠子，冲他咧嘴：\"你魇着的时候，可别让鸡满屋扑腾。\"<\/p>\n<p>鱼哥难得笑了一下：\"它认我。\"<\/p>\n<p>我走出院门的时候，回头看了一眼。雅河乡的这间废蜂房立在半坡上，后头是黑压压的柞树林，屋里一灯如豆。小萱站在门口，扶着门框，没说话，只朝我摆了摆手。<\/p>\n<p>我朝她点点头，转身走进了林子。<\/p>\n<p>从雅河乡到鹰嘴沟，抄小路走，要小半夜。我把那件防雨布衣裳翻过来穿，兜里揣着手电，可一路没开——路我走过两遍了，沟口那道\"龙回头\"的窄梁，我闭着眼都摸得着。<\/p>\n<p>今夜无月，星子也稀，天黑得像锅底。<\/p>\n<p>到了龙回头，我停了停。<\/p>\n<p>进沟的地方在梁子底下，那晚把头领着我们，就是从这儿一脚踩进雾里去的。如今雾也散了，沟口那道石梁黑黢黢地横着，上头光秃秃的——半个来月前那口吊锅被人截走的绳头，还耷拉在半空，风一吹，轻轻地晃。<\/p>\n<p>我看了它一眼，没停，弯腰钻进了石缝。<\/p>\n<p>越往深走，夜气越沉。<\/p>\n<p>石缝里那股子味还在——潮土、铁锈、还有一点点说不清的腥。我摸着石壁走，指腹上全是千年的凉。走到人工石缝尽头，那扇锁眼石封门墙跟前，我照老规矩，把阴契从怀里掏出来，攥在手心里，贴着门缝伸进去。<\/p>\n<p>没有动静。<\/p>\n<p>我又等了一息，才侧身挤了过去。<\/p>\n<p>盟坛石室还是老样子。<\/p>\n<p>拱顶的水滴声，一滴，一滴，像座走了一千多年的钟。五口锅，还倒扣在原处，灰扑扑的，一口不少。西南墙根那块色气发乌的空地，也还在——那是第六位，被人起走东西的地方。<\/p>\n<p>我打着手电，照了一圈。<\/p>\n<p>北墙根，那半块青砖还在。<\/p>\n<p>砖上干干净净。那只白纸灯笼，不在了。<\/p>\n<p>我心里一跳，手电光在那片墙上又扫了一遍。灯确实没了，墙槽里只留下一点竹篾刮过的白痕。砖面上也没有烟头——两个月前灯下那截\"今天抽的急烟\"，早就被人收走了。<\/p>\n<p>谁收的？<\/p>\n<p>我把这个念头压下去，走到正中那口锅跟前，蹲下。<\/p>\n<p>五口锅里，这一口最不起眼。陶色发灰，锅沿磕了几个口子，翻扣在地上，像一块普普通通的破瓦。可我知道，就是这一口底下，压过一块无字的银符；就是这一口，是那个被抹了名字的消奴部，在人世上留下的最后一样东西。<\/p>\n<p>我伸手按住锅沿。<\/p>\n<p>\"老兄，\"我低声说，\"跟不跟我走？\"<\/p>\n<p>锅当然不会答话。<\/p>\n<p>我把它掀起来，翻了个个儿，口朝上放稳。锅底积着一层灰，我用袖子草草擦了两把，露出底下一圈粗陶胎。锅不沉，比我预想的轻，抱在怀里，像抱着一口倒扣的钟。<\/p>\n<p>我拿防雨布把它裹了，又拿麻绳在锅沿上十字交叉捆紧，往背上一勒。<\/p>\n<p>锅上了背，人就得走。<\/p>\n<p>我最后看了一眼这间石室。五口锅如今只剩四口，围着当中那块圆印子，像一桌酒席被人撤走了主位。<\/p>\n<p>\"东西是死的，跑不了。\"把头的话在我耳边响了一遍。<\/p>\n<p>我背上锅，朝石缝口走去。<\/p>\n<p>走出七八步，我站住了。<\/p>\n<p>缝口那块卧牛大的青石上，坐着一个人。<\/p>\n<p>他背对着我，坐在石头的阴影里，灰褂子，黑布鞋，一头白发在暗处发着灰白的光。他没点灯，手里捏着根烟，烟头一明一灭，是东北烤烟那股子味儿。<\/p>\n<p>我的心一下子提到了嗓子眼。<\/p>\n<p>我进来的时候，缝口没人。这条缝只容一个人侧身走，他要是在我前头进来，我没理由看不见。要是在我后头进来的——更没理由。<\/p>\n<p>可他就在那儿坐着，像一截早就长在石头上的老树根。<\/p>\n<p>\"搬完了？\"他开口了，声音不高，带着点痰音，像很久没跟人说过话。<\/p>\n<p>我嗓子发紧：\"……搬完了。\"<\/p>\n<p>\"嗯。\"他抽了一口烟，头也没回，\"锅是死物，谁都能搬。你抱着的不是锅——是名分。名分是活的，认了主，就甩不脱。\"<\/p>\n<p>我后脊梁一凉。<\/p>\n<p>这话，把头对我说过。可这人，我今晚从没见过。<\/p>\n<p>\"你是谁？\"我问。<\/p>\n<p>\"守灯的。\"<\/p>\n<p>\"守什么灯？\"<\/p>\n<p>\"守你们这种，\"他把烟灰弹了弹，\"会自己点着的人。\"<\/p>\n<p>我攥着背带的手心里全是汗。费了多大的劲，才没让声音发飘：\"外头给我捎话的——那个戴草帽的，也是你的人？\"<\/p>\n<p>\"他不是人。\"白发老头顿了顿，补了一句，\"他是跑腿的。\"<\/p>\n<p>我一时没接上话。<\/p>\n<p>他又抽了口烟，慢吞吞地说：\"锅你带走，名分你认下。这都没什么——名分这东西，山里有的是，千年万年，认不完。可你坏了山里的规矩。\"<\/p>\n<p>\"什么规矩？\"<\/p>\n<p>\"灯的规矩。\"他把烟头掐灭在石头沿上，\"灯没点，你进来了；灯没灭，你出去了。进来的是人，出去的是客。客过山门，山要记一笔账。\"<\/p>\n<p>他站起来。<\/p>\n<p>那个头，比我预想的矮一些，瘦，可站起来那一下，石缝里那股凉气像是跟着他动了一下。<\/p>\n<p>\"这账，我不跟你记。\"他转过身来。<\/p>\n<p>就着一点天光，我看见他的脸——皱纹深得像刀刻的，眉毛全白了。可让我心里咯噔一下的，是他的左耳：耳廓齐着耳根，缺了多半截，只留一点肉桩子。<\/p>\n<p>缺耳。<\/p>\n<p>我脑子里\"嗡\"的一声。<\/p>\n<p>把头十九岁那年，在桓仁魇着，就是一个缺了多半截耳朵的白发老头，把照魇镜递给他的。三十七年了，那个老头要是活着，该是九十往上的年纪——可眼前这个人，看着也就是六十出头的样子。<\/p>\n<p>他弯腰掐烟的当口，灰褂子的袖口往上抽了一抽。<\/p>\n<p>袖口上，补着一块蓝布。<\/p>\n<p>补丁不大，针脚却细得惊人，一针压一针，齐得跟拿尺子量过似的。老周说过——两年前那个跟他红鼻头搭伙卖珍珠罐的白头发瘦子，灰褂子袖口上就补着这么一块蓝补丁，\"针脚细得比机器缝的还匀\"。<\/p>\n<p>我盯着那块补丁，血一下子涌上头顶。<\/p>\n<p>\"第五个还在沟里。\"王长顺那张画背面的铅笔字，在脑子里翻了个个儿。两年前五个人进的沟，老鼠男说四个没出来——可老周明明见过那白头发瘦子在外头撒货，猴三儿上月还见他在五女山北坡坐着等人。<\/p>\n<p>一个本该死在沟里的人，是怎么出去撒的货？<\/p>\n<p>又或者——出去的，从来就是眼前这个人？<\/p>\n<p>\"这账，\"他说，\"我记在你们那个领头的名下。\"<\/p>\n<p>\"为什么是他？\"<\/p>\n<p>\"因为他该还。\"缺耳老头说，\"三十七年前，我在桓仁把镜子交出去的时候，跟他说过一句话——'守字的东西，认守字的人。哪天你守不住了，把镜子送回桓仁来，我在老地方等。'\"<\/p>\n<p>石室里静得只剩水滴声。<\/p>\n<p>\"他守住了吗？\"老头看着我，目光很平，\"他要是守住了，就不该让镜子出了桓仁，跟着你们进山去照一口空锅。\"<\/p>\n<p>我张了张嘴，想替把头辩两句，可一个字都说不出来。<\/p>\n<p>因为他说的是实话——这面镜子，是照魇用的，本该压在魇症人的枕头底下。可它跟着我们进了沟，跟着我们看了锅、看了灯、看了那间石室里不该看的东西。<\/p>\n<p>\"我不难为你。\"老头重新坐下，摸出一根烟，又点上，\"锅你拿走，话你捎到。山里的账，一笔归一笔，我记性还不坏。\"<\/p>\n<p>我往缝口挪了两步，又停住。<\/p>\n<p>\"你还没说——'五月'是什么？\"<\/p>\n<p>\"我没说五月。\"老头抽着烟，\"你听岔了。\"<\/p>\n<p>我确实不该接这句。我咬了咬牙，侧身挤进缝口。石缝窄，背着锅，走得极慢。我一路走，一路支着耳朵听身后——没有脚步声，没有烟味跟来。<\/p>\n<p>可走出十几步的时候，缝里忽然响起一种声音。<\/p>\n<p>很轻，很慢。<\/p>\n<p>像有人蹲在石室的地上，拿指节，一粒一粒地敲石头。<\/p>\n<p>一。二。三。<\/p>\n<p>我浑身的汗毛一下子全竖了起来。<\/p>\n<p>王长顺烧了半个月的胡话，头一句是\"爹，锅是空的\"，第二句是——\"爹，第五个在数我\"。<\/p>\n<p>我不回头，也不敢回头，背着那口锅，在石缝里深一脚浅一脚地往外逃。那声音不紧不慢地跟在身后，敲一阵，停一阵，敲到第七下的时候，我听见它停了。<\/p>\n<p>停在我身后一步远的地方。<\/p>\n<p>我攥紧了怀里的照魇镜，猛地转过身去。<\/p>\n<p>身后是空的。<\/p>\n<p>石缝里黑黢黢的，只有我自己呼哧呼哧的喘气声。那声音，不知什么时候停了——或者说，从来就没跟着我出来过。<\/p>\n<p>我站了好一会儿，才继续走。<\/p>\n<p>出沟的时候，天边已经泛了白。<\/p>\n<p>我蹲在沟口的溪边，把那口锅从背上卸下来，想喘口气。锅沿磕口里积的灰，一路颠得我满脖子都是。我抹了把脸，看着溪水里那个灰头土脸的自己，忽然想起王药根说过的话——<\/p>\n<p>山要收账。<\/p>\n<p>从前我只当这是一句吓人的老话。可今儿夜里我知道了：账是真的有人记的。一笔记在把头的名下，等着哪天来收；还有一笔，记在我心里，像那阵敲石头的声音一样，敲一下，停一下，不知道什么时候，才算敲完。<\/p>\n<p>我背上锅，往雅河乡的方向走。<\/p>\n<p>身后那道石缝，在晨雾里慢慢合拢，像一张闭上的嘴。<\/p>", "plain": "三天后的晚上，我一个人上路。 出发前，鱼哥把照魇镜从怀里掏出来，塞进我手心里，什么也没说。他把那只老避龙从布兜里放出来，让鸡蹲在他脚边，意思是——镜子借你，鸡我留着。 我蹲下身，拍了拍鸡冠子，冲他咧嘴：\"你魇着的时候，可别让鸡满屋扑腾。\" 鱼哥难得笑了一下：\"它认我。\" 我走出院门的时候，回头看了一眼。雅河乡的这间废蜂房立在半坡上，后头是黑压压的柞树林，屋里一灯如豆。小萱站在门口，扶着门框，没说话，只朝我摆了摆手。 我朝她点点头，转身走进了林子。 从雅河乡到鹰嘴沟，抄小路走，要小半夜。我把那件防雨布衣裳翻过来穿，兜里揣着手电，可一路没开——路我走过两遍了，沟口那道\"龙回头\"的窄梁，我闭着眼都摸得着。 今夜无月，星子也稀，天黑得像锅底。 到了龙回头，我停了停。 进沟的地方在梁子底下，那晚把头领着我们，就是从这儿一脚踩进雾里去的。如今雾也散了，沟口那道石梁黑黢黢地横着，上头光秃秃的——半个来月前那口吊锅被人截走的绳头，还耷拉在半空，风一吹，轻轻地晃。 我看了它一眼，没停，弯腰钻进了石缝。 越往深走，夜气越沉。 石缝里那股子味还在——潮土、铁锈、还有一点点说不清的腥。我摸着石壁走，指腹上全是千年的凉。走到人工石缝尽头，那扇锁眼石封门墙跟前，我照老规矩，把阴契从怀里掏出来，攥在手心里，贴着门缝伸进去。 没有动静。 我又等了一息，才侧身挤了过去。 盟坛石室还是老样子。 拱顶的水滴声，一滴，一滴，像座走了一千多年的钟。五口锅，还倒扣在原处，灰扑扑的，一口不少。西南墙根那块色气发乌的空地，也还在——那是第六位，被人起走东西的地方。 我打着手电，照了一圈。 北墙根，那半块青砖还在。 砖上干干净净。那只白纸灯笼，不在了。 我心里一跳，手电光在那片墙上又扫了一遍。灯确实没了，墙槽里只留下一点竹篾刮过的白痕。砖面上也没有烟头——两个月前灯下那截\"今天抽的急烟\"，早就被人收走了。 谁收的？ 我把这个念头压下去，走到正中那口锅跟前，蹲下。 五口锅里，这一口最不起眼。陶色发灰，锅沿磕了几个口子，翻扣在地上，像一块普普通通的破瓦。可我知道，就是这一口底下，压过一块无字的银符；就是这一口，是那个被抹了名字的消奴部，在人世上留下的最后一样东西。 我伸手按住锅沿。 \"老兄，\"我低声说，\"跟不跟我走？\" 锅当然不会答话。 我把它掀起来，翻了个个儿，口朝上放稳。锅底积着一层灰，我用袖子草草擦了两把，露出底下一圈粗陶胎。锅不沉，比我预想的轻，抱在怀里，像抱着一口倒扣的钟。 我拿防雨布把它裹了，又拿麻绳在锅沿上十字交叉捆紧，往背上一勒。 锅上了背，人就得走。 我最后看了一眼这间石室。五口锅如今只剩四口，围着当中那块圆印子，像一桌酒席被人撤走了主位。 \"东西是死的，跑不了。\"把头的话在我耳边响了一遍。 我背上锅，朝石缝口走去。 走出七八步，我站住了。 缝口那块卧牛大的青石上，坐着一个人。 他背对着我，坐在石头的阴影里，灰褂子，黑布鞋，一头白发在暗处发着灰白的光。他没点灯，手里捏着根烟，烟头一明一灭，是东北烤烟那股子味儿。 我的心一下子提到了嗓子眼。 我进来的时候，缝口没人。这条缝只容一个人侧身走，他要是在我前头进来，我没理由看不见。要是在我后头进来的——更没理由。 可他就在那儿坐着，像一截早就长在石头上的老树根。 \"搬完了？\"他开口了，声音不高，带着点痰音，像很久没跟人说过话。 我嗓子发紧：\"……搬完了。\" \"嗯。\"他抽了一口烟，头也没回，\"锅是死物，谁都能搬。你抱着的不是锅——是名分。名分是活的，认了主，就甩不脱。\" 我后脊梁一凉。 这话，把头对我说过。可这人，我今晚从没见过。 \"你是谁？\"我问。 \"守灯的。\" \"守什么灯？\" \"守你们这种，\"他把烟灰弹了弹，\"会自己点着的人。\" 我攥着背带的手心里全是汗。费了多大的劲，才没让声音发飘：\"外头给我捎话的——那个戴草帽的，也是你的人？\" \"他不是人。\"白发老头顿了顿，补了一句，\"他是跑腿的。\" 我一时没接上话。 他又抽了口烟，慢吞吞地说：\"锅你带走，名分你认下。这都没什么——名分这东西，山里有的是，千年万年，认不完。可你坏了山里的规矩。\" \"什么规矩？\" \"灯的规矩。\"他把烟头掐灭在石头沿上，\"灯没点，你进来了；灯没灭，你出去了。进来的是人，出去的是客。客过山门，山要记一笔账。\" 他站起来。 那个头，比我预想的矮一些，瘦，可站起来那一下，石缝里那股凉气像是跟着他动了一下。 \"这账，我不跟你记。\"他转过身来。 就着一点天光，我看见他的脸——皱纹深得像刀刻的，眉毛全白了。可让我心里咯噔一下的，是他的左耳：耳廓齐着耳根，缺了多半截，只留一点肉桩子。 缺耳。 我脑子里\"嗡\"的一声。 把头十九岁那年，在桓仁魇着，就是一个缺了多半截耳朵的白发老头，把照魇镜递给他的。三十七年了，那个老头要是活着，该是九十往上的年纪——可眼前这个人，看着也就是六十出头的样子。 他弯腰掐烟的当口，灰褂子的袖口往上抽了一抽。 袖口上，补着一块蓝布。 补丁不大，针脚却细得惊人，一针压一针，齐得跟拿尺子量过似的。老周说过——两年前那个跟他红鼻头搭伙卖珍珠罐的白头发瘦子，灰褂子袖口上就补着这么一块蓝补丁，\"针脚细得比机器缝的还匀\"。 我盯着那块补丁，血一下子涌上头顶。 \"第五个还在沟里。\"王长顺那张画背面的铅笔字，在脑子里翻了个个儿。两年前五个人进的沟，老鼠男说四个没出来——可老周明明见过那白头发瘦子在外头撒货，猴三儿上月还见他在五女山北坡坐着等人。 一个本该死在沟里的人，是怎么出去撒的货？ 又或者——出去的，从来就是眼前这个人？ \"这账，\"他说，\"我记在你们那个领头的名下。\" \"为什么是他？\" \"因为他该还。\"缺耳老头说，\"三十七年前，我在桓仁把镜子交出去的时候，跟他说过一句话——'守字的东西，认守字的人。哪天你守不住了，把镜子送回桓仁来，我在老地方等。'\" 石室里静得只剩水滴声。 \"他守住了吗？\"老头看着我，目光很平，\"他要是守住了，就不该让镜子出了桓仁，跟着你们进山去照一口空锅。\" 我张了张嘴，想替把头辩两句，可一个字都说不出来。 因为他说的是实话——这面镜子，是照魇用的，本该压在魇症人的枕头底下。可它跟着我们进了沟，跟着我们看了锅、看了灯、看了那间石室里不该看的东西。 \"我不难为你。\"老头重新坐下，摸出一根烟，又点上，\"锅你拿走，话你捎到。山里的账，一笔归一笔，我记性还不坏。\" 我往缝口挪了两步，又停住。 \"你还没说——'五月'是什么？\" \"我没说五月。\"老头抽着烟，\"你听岔了。\" 我确实不该接这句。我咬了咬牙，侧身挤进缝口。石缝窄，背着锅，走得极慢。我一路走，一路支着耳朵听身后——没有脚步声，没有烟味跟来。 可走出十几步的时候，缝里忽然响起一种声音。 很轻，很慢。 像有人蹲在石室的地上，拿指节，一粒一粒地敲石头。 一。二。三。 我浑身的汗毛一下子全竖了起来。 王长顺烧了半个月的胡话，头一句是\"爹，锅是空的\"，第二句是——\"爹，第五个在数我\"。 我不回头，也不敢回头，背着那口锅，在石缝里深一脚浅一脚地往外逃。那声音不紧不慢地跟在身后，敲一阵，停一阵，敲到第七下的时候，我听见它停了。 停在我身后一步远的地方。 我攥紧了怀里的照魇镜，猛地转过身去。 身后是空的。 石缝里黑黢黢的，只有我自己呼哧呼哧的喘气声。那声音，不知什么时候停了——或者说，从来就没跟着我出来过。 我站了好一会儿，才继续走。 出沟的时候，天边已经泛了白。 我蹲在沟口的溪边，把那口锅从背上卸下来，想喘口气。锅沿磕口里积的灰，一路颠得我满脖子都是。我抹了把脸，看着溪水里那个灰头土脸的自己，忽然想起王药根说过的话—— 山要收账。 从前我只当这是一句吓人的老话。可今儿夜里我知道了：账是真的有人记的。一笔记在把头的名下，等着哪天来收；还有一笔，记在我心里，像那阵敲石头的声音一样，敲一下，停一下，不知道什么时候，才算敲完。 我背上锅，往雅河乡的方向走。 身后那道石缝，在晨雾里慢慢合拢，像一张闭上的嘴。"}, {"id": "A5-077", "arc": "A5", "num": 77, "title": "蜂房", "md": "那口锅，我没敢大白天背回蜂房。\n\n天亮前，我把它裹在防雨布里，塞进雅河乡外那道漫水桥底下的一处干沟，上头压了几捆苞米秸，瞧着跟河滩上乱堆的柴火一样。然后我空着手，沿着大路走回蜂房。\n\n雅河乡的住处是王瘸子的两间废蜂房。\n\n说\"废\"，是真废。土墙裂着指头宽的缝，屋顶苫的草烂了大半，屋里一股陈年蜂蜡和干草混合的味。收拾了三天，才勉强能住人。正屋住人，偏屋堆家伙，后山脚还有一个老炭窑——早年间烧炭用的，塌了半边，让豆芽仔拿树枝子一盖，从外头看就是一堆荒草。\n\n我把门掩上，刚在炕沿坐下，鱼哥就推门进来了。\n\n他看了我一眼，没问锅，先把一碗热粥搁在我手边：\"吃了。\"\n\n我端起碗，两口喝完。他蹲在门槛上，等我开口。\n\n我把夜里的事，捡要紧的说了。说到缝口那个缺耳的白发老头时，鱼哥的眉头拧了起来。他是见过世面的，十年前少林寺塔林那回，他师傅圆寂夜里的白纸灯笼，他都亲眼看过——可\"人\"这一层，他比我更信不过。\n\n\"他要是真想拦你，\"鱼哥说，\"你出不了那道缝。\"\n\n我没接话，因为我知道他说得对。那老头要是动手，十个我也不是个儿。他不动手，只让路，那才是最难办的地方——说明他压根没把我和那口锅，当成一回事。\n\n下午，把头从桓仁镇子上回来。\n\n他进门先洗手，掸了掸衣裳上的灰，才在我对面坐下，卷了根烟。我把夜里的事，从头到尾又讲了一遍。讲那老头说的话，讲他掐烟的架势，讲他提到\"三十七年前，桓仁\"那几句。\n\n讲到缺耳的时候，把头的烟卷到一半，停住了。\n\n屋里静了半晌。他把那根没卷完的烟搁下，慢慢地问：\"你说，他的左耳——\"\n\n\"齐着耳根，缺了多半截。\"我说，\"只留一点肉桩子。\"\n\n把头没说话。他伸手去够烟盒，够了两回，才把烟摸出来，可没点，就那么捏在手里。\n\n\"把头。\"我压低声音，\"你认出来了？\"\n\n\"我认不出。\"他过了好一会儿才开口，\"三十七年了，我只见过他一面，还是在魇着的时候。可你这句话——缺了多半截的左耳——跟他当年一模一样。\"\n\n他顿了顿：\"我在桓仁魇着那回，是十九岁。醒过来的时候，怀里就压着这面镜子，镜背冲上，鱼尾文'守'字正对着我的脸。我四下里看，屋里没人，只当是梦。\"\n\n\"你那时候，见过他的脸？\"\n\n\"见过一眼。\"把头说，\"他背对着窗户走，临出门，侧了一下头。晨光正好打在他脸上，我就记住了那只耳朵。\"\n\n他说完这句，就不再往下讲了。把那根烟点着，抽了两口，忽然没头没脑地冒出一句：\"他说，账记在我名下？\"\n\n\"是。\"\n\n\"记就记吧。\"把头把烟灰磕在炕沿上，\"山要收账，躲是躲不过去的。躲得过的是人账，躲不过的是山账。云峰，你记住——往后咱们在这条线上，能少欠人，就少欠人。欠了的，都得还。\"\n\n他说这话的时候，眼睛望着窗外那片柞树林子，不知在想什么。\n\n王瘸子是在傍晚来的。\n\n他是来收这个月房钱的，一进门就四下里踅摸，看见我们把屋子收拾得利利索索，先是一愣，随即又笑：\n\n\"我说，你们这几个外乡人，倒是比我头先那俩房客讲究。\"\n\n\"头先那俩？\"豆芽仔凑上去，\"瘸子叔，你说的是不是那俩收山货的——一个红鼻头，一个白头发？\"\n\n\"可不是嘛。\"王瘸子收了钱，往怀里一揣，话匣子就打开了，\"去年开春在我这儿住了小半年，走的时候把屋子扫得锃亮，连根柴火棍都没落下。房租给三百，人家非塞四百，说是'添点柴火钱'。啧，讲究人。\"\n\n\"他俩后来还回来过？\"我把话头往这儿引。\n\n\"回来过。\"王瘸子压低声音，\"就上月底，那白头发的老头一个人回来，住了一宿。我问他那个红鼻头呢，他说'走了，不回来了'。走的那天早上，我瞅见他在后墙根底下烧了一堆纸，灰都没踩灭就走了。那纸灰我扫了好几天才扫净，边扫边嘀咕——这年头，谁还给死人烧纸啊。\"\n\n我心头一凛，面上没露。\n\n后墙根，烧纸。\n\n猴三儿说过，那俩包头客当年住在蜂房里，隔个十天半月进一回山，每回进山前都在房后头烧一回纸。给山里的东西烧纸。上月底那白头发老头回来住了一宿、烧了一堆纸——他要进山？\n\n我朝把头递了个眼色。把头不动声色，等王瘸子走了，才开口：\n\n\"他进没进山，说不准。可有一件事是实的——他回来住一宿、烧纸，是上月底的事。咱们搬进来才三天，跟他那一宿，中间隔得不算远。他烧的那堆纸灰，要是没人动过，该还在后墙根。\"\n\n\"他烧的那堆纸灰，\"我接道，\"咱们收拾屋子的时候，会不会收拾掉了？\"\n\n\"翻。\"把头只说了这一个字。\n\n我们四个把蜂房前后翻了个底朝天。豆芽仔在偏屋的炕洞里，掏出一个铁盒子。\n\n盒子不大，是那种装水果糖的旧铁盒，锈得看不出本色。他把它抱出来的时候，盒盖一开，\"哗啦\"一声，滚出半盒子东西。\n\n我蹲下去看，一下子愣住了。\n\n盒子里没有纸，没有灰——是一套做针线的家什。一个黄铜顶针，磨得锃亮，上头刻着细密的花纹；两轴线，一轴红的，一轴黑的；几绺布头，红一道黑一道，边角裁得齐齐整整；还有一把小剪刀，剪口锋利，用油布包着。\n\n豆芽仔捻起那绺红布头，翻来覆去地看，忽然\"咦\"了一声：\"这布头的边儿，收得真细。这是拿针线锁过的边，针脚密得跟机器砸的一样。\"\n\n细针脚。\n\n我心里一跳，跟鱼哥对了个眼神。\n\n老周说过，那白头发瘦子的灰褂子袖口上，补着一块蓝补丁，针脚细得\"比机器缝的还匀\"。沟里石室北壁那两枚新钎眼上系的红布条，也是这么细的针脚。加油站老鼠男摊上的飘带，还是这么细的针脚。\n\n三种东西，一个针脚。\n\n\"不是三种。\"把头拿起那绺红布头，在指间捻了捻，\"是一种。撒货的、封门的、打记号的，全是这一根针线出来的。这蜂房里住过的不是收山货的——是替山里'绣花'的。\"\n\n他顿了顿：\"那个白头发老头，不是从沟里出来的。他是从沟里'出去'的——出去替山里做事的。做完了，再回来烧纸，把数对上。\"\n\n正说着，堂屋的座机响了。\n\n豆芽仔接起来，听了一句，脸色就变了，捂着话筒冲我们压低声音：\"是桓仁老周！他说——那个戴草帽的，又去他店里了！\"\n\n我跟把头对了个眼神。把头放下手里的布头：\"接过来，外放。\"\n\n电话那头，老周的声音又急又虚：\"兄弟！那个戴草帽的又来了！可他这回不是来找事的——他送来一样东西，让我转交给你们掌柜！\"\n\n\"什么东西？\"\n\n\"就是那个珍珠罐！\"老周说，\"他说——'这罐子在我这儿搁了两年，该物归原主了。让你们掌柜的人来取，明天这时候，我在店里等。'\"\n\n我把话筒接过来：\"老周，他还说别的没有？\"\n\n\"他还说了一句，我没听明白——\"老周学着那人的腔调，慢悠悠地复述，\"'罐子底下有一道纹，是给会认纹的人看的。认得出，罐子归他；认不出，罐子我收回，谁也不给。'\"\n\n我挂了电话，半天没动。\n\n珍珠罐。两年前那对包头客撒在老周店里的货，那个让草帽人亲口认下\"是我卖给你的\"的罐子。如今，它成了考题。\n\n\"会认纹的人。\"鱼哥重复了一遍，看向把头。\n\n把头把烟在鞋底上摁灭：\"明儿一早，云峰跟文斌去桓仁。会一会这道纹。\"\n\n夜里，我和鱼哥把锅从漫水桥下的干沟里起了出来，背上后山，送进那座老炭窑。\n\n我拿树枝子把窑口封好，又蹲下身，把那口锅掉了个个儿，让磕口朝门，好认。临出窑门，我回头又看了一眼——锅灰扑扑地蹲在窑底，像个打盹的老头。\n\n睡下以后，我翻来覆去，怎么也睡不着。\n\n那老头的话，一句一句在脑子里过。守灯的。守你们这种会自己点着的人。五部的事、阴契的事、镜子的事，像是几百年的线，全拧在我一个人身上。\n\n后半夜，我实在躺不住，又爬起来，摸黑上了后山。\n\n炭窑的门，跟我封的时候一样，树枝子一根没动。我扒开一条缝，把手电打进去——\n\n那口锅还在。\n\n可它的朝向，变了。\n\n我明明把它掉了个个儿，让磕口朝门。如今那磕口，冲着窑壁，整整转了小半圈。\n\n我站在窑门口，手电光里，那口锅纹丝不动地蹲着，像个睡得正沉的东西。窑里没有脚印，没有手印，耗子也拱不动一口陶锅。\n\n我把树枝子重新封好，一步一步往回走。\n\n走到半坡，我停下来，回头望着那座黑黢黢的炭窑，想起缺耳老头的一句话——\n\n锅是死物，谁都能搬。\n\n可它要是自己转了个身呢？", "words": 3117, "html": "<p>那口锅，我没敢大白天背回蜂房。<\/p>\n<p>天亮前，我把它裹在防雨布里，塞进雅河乡外那道漫水桥底下的一处干沟，上头压了几捆苞米秸，瞧着跟河滩上乱堆的柴火一样。然后我空着手，沿着大路走回蜂房。<\/p>\n<p>雅河乡的住处是王瘸子的两间废蜂房。<\/p>\n<p>说\"废\"，是真废。土墙裂着指头宽的缝，屋顶苫的草烂了大半，屋里一股陈年蜂蜡和干草混合的味。收拾了三天，才勉强能住人。正屋住人，偏屋堆家伙，后山脚还有一个老炭窑——早年间烧炭用的，塌了半边，让豆芽仔拿树枝子一盖，从外头看就是一堆荒草。<\/p>\n<p>我把门掩上，刚在炕沿坐下，鱼哥就推门进来了。<\/p>\n<p>他看了我一眼，没问锅，先把一碗热粥搁在我手边：\"吃了。\"<\/p>\n<p>我端起碗，两口喝完。他蹲在门槛上，等我开口。<\/p>\n<p>我把夜里的事，捡要紧的说了。说到缝口那个缺耳的白发老头时，鱼哥的眉头拧了起来。他是见过世面的，十年前少林寺塔林那回，他师傅圆寂夜里的白纸灯笼，他都亲眼看过——可\"人\"这一层，他比我更信不过。<\/p>\n<p>\"他要是真想拦你，\"鱼哥说，\"你出不了那道缝。\"<\/p>\n<p>我没接话，因为我知道他说得对。那老头要是动手，十个我也不是个儿。他不动手，只让路，那才是最难办的地方——说明他压根没把我和那口锅，当成一回事。<\/p>\n<p>下午，把头从桓仁镇子上回来。<\/p>\n<p>他进门先洗手，掸了掸衣裳上的灰，才在我对面坐下，卷了根烟。我把夜里的事，从头到尾又讲了一遍。讲那老头说的话，讲他掐烟的架势，讲他提到\"三十七年前，桓仁\"那几句。<\/p>\n<p>讲到缺耳的时候，把头的烟卷到一半，停住了。<\/p>\n<p>屋里静了半晌。他把那根没卷完的烟搁下，慢慢地问：\"你说，他的左耳——\"<\/p>\n<p>\"齐着耳根，缺了多半截。\"我说，\"只留一点肉桩子。\"<\/p>\n<p>把头没说话。他伸手去够烟盒，够了两回，才把烟摸出来，可没点，就那么捏在手里。<\/p>\n<p>\"把头。\"我压低声音，\"你认出来了？\"<\/p>\n<p>\"我认不出。\"他过了好一会儿才开口，\"三十七年了，我只见过他一面，还是在魇着的时候。可你这句话——缺了多半截的左耳——跟他当年一模一样。\"<\/p>\n<p>他顿了顿：\"我在桓仁魇着那回，是十九岁。醒过来的时候，怀里就压着这面镜子，镜背冲上，鱼尾文'守'字正对着我的脸。我四下里看，屋里没人，只当是梦。\"<\/p>\n<p>\"你那时候，见过他的脸？\"<\/p>\n<p>\"见过一眼。\"把头说，\"他背对着窗户走，临出门，侧了一下头。晨光正好打在他脸上，我就记住了那只耳朵。\"<\/p>\n<p>他说完这句，就不再往下讲了。把那根烟点着，抽了两口，忽然没头没脑地冒出一句：\"他说，账记在我名下？\"<\/p>\n<p>\"是。\"<\/p>\n<p>\"记就记吧。\"把头把烟灰磕在炕沿上，\"山要收账，躲是躲不过去的。躲得过的是人账，躲不过的是山账。云峰，你记住——往后咱们在这条线上，能少欠人，就少欠人。欠了的，都得还。\"<\/p>\n<p>他说这话的时候，眼睛望着窗外那片柞树林子，不知在想什么。<\/p>\n<p>王瘸子是在傍晚来的。<\/p>\n<p>他是来收这个月房钱的，一进门就四下里踅摸，看见我们把屋子收拾得利利索索，先是一愣，随即又笑：<\/p>\n<p>\"我说，你们这几个外乡人，倒是比我头先那俩房客讲究。\"<\/p>\n<p>\"头先那俩？\"豆芽仔凑上去，\"瘸子叔，你说的是不是那俩收山货的——一个红鼻头，一个白头发？\"<\/p>\n<p>\"可不是嘛。\"王瘸子收了钱，往怀里一揣，话匣子就打开了，\"去年开春在我这儿住了小半年，走的时候把屋子扫得锃亮，连根柴火棍都没落下。房租给三百，人家非塞四百，说是'添点柴火钱'。啧，讲究人。\"<\/p>\n<p>\"他俩后来还回来过？\"我把话头往这儿引。<\/p>\n<p>\"回来过。\"王瘸子压低声音，\"就上月底，那白头发的老头一个人回来，住了一宿。我问他那个红鼻头呢，他说'走了，不回来了'。走的那天早上，我瞅见他在后墙根底下烧了一堆纸，灰都没踩灭就走了。那纸灰我扫了好几天才扫净，边扫边嘀咕——这年头，谁还给死人烧纸啊。\"<\/p>\n<p>我心头一凛，面上没露。<\/p>\n<p>后墙根，烧纸。<\/p>\n<p>猴三儿说过，那俩包头客当年住在蜂房里，隔个十天半月进一回山，每回进山前都在房后头烧一回纸。给山里的东西烧纸。上月底那白头发老头回来住了一宿、烧了一堆纸——他要进山？<\/p>\n<p>我朝把头递了个眼色。把头不动声色，等王瘸子走了，才开口：<\/p>\n<p>\"他进没进山，说不准。可有一件事是实的——他回来住一宿、烧纸，是上月底的事。咱们搬进来才三天，跟他那一宿，中间隔得不算远。他烧的那堆纸灰，要是没人动过，该还在后墙根。\"<\/p>\n<p>\"他烧的那堆纸灰，\"我接道，\"咱们收拾屋子的时候，会不会收拾掉了？\"<\/p>\n<p>\"翻。\"把头只说了这一个字。<\/p>\n<p>我们四个把蜂房前后翻了个底朝天。豆芽仔在偏屋的炕洞里，掏出一个铁盒子。<\/p>\n<p>盒子不大，是那种装水果糖的旧铁盒，锈得看不出本色。他把它抱出来的时候，盒盖一开，\"哗啦\"一声，滚出半盒子东西。<\/p>\n<p>我蹲下去看，一下子愣住了。<\/p>\n<p>盒子里没有纸，没有灰——是一套做针线的家什。一个黄铜顶针，磨得锃亮，上头刻着细密的花纹；两轴线，一轴红的，一轴黑的；几绺布头，红一道黑一道，边角裁得齐齐整整；还有一把小剪刀，剪口锋利，用油布包着。<\/p>\n<p>豆芽仔捻起那绺红布头，翻来覆去地看，忽然\"咦\"了一声：\"这布头的边儿，收得真细。这是拿针线锁过的边，针脚密得跟机器砸的一样。\"<\/p>\n<p>细针脚。<\/p>\n<p>我心里一跳，跟鱼哥对了个眼神。<\/p>\n<p>老周说过，那白头发瘦子的灰褂子袖口上，补着一块蓝补丁，针脚细得\"比机器缝的还匀\"。沟里石室北壁那两枚新钎眼上系的红布条，也是这么细的针脚。加油站老鼠男摊上的飘带，还是这么细的针脚。<\/p>\n<p>三种东西，一个针脚。<\/p>\n<p>\"不是三种。\"把头拿起那绺红布头，在指间捻了捻，\"是一种。撒货的、封门的、打记号的，全是这一根针线出来的。这蜂房里住过的不是收山货的——是替山里'绣花'的。\"<\/p>\n<p>他顿了顿：\"那个白头发老头，不是从沟里出来的。他是从沟里'出去'的——出去替山里做事的。做完了，再回来烧纸，把数对上。\"<\/p>\n<p>正说着，堂屋的座机响了。<\/p>\n<p>豆芽仔接起来，听了一句，脸色就变了，捂着话筒冲我们压低声音：\"是桓仁老周！他说——那个戴草帽的，又去他店里了！\"<\/p>\n<p>我跟把头对了个眼神。把头放下手里的布头：\"接过来，外放。\"<\/p>\n<p>电话那头，老周的声音又急又虚：\"兄弟！那个戴草帽的又来了！可他这回不是来找事的——他送来一样东西，让我转交给你们掌柜！\"<\/p>\n<p>\"什么东西？\"<\/p>\n<p>\"就是那个珍珠罐！\"老周说，\"他说——'这罐子在我这儿搁了两年，该物归原主了。让你们掌柜的人来取，明天这时候，我在店里等。'\"<\/p>\n<p>我把话筒接过来：\"老周，他还说别的没有？\"<\/p>\n<p>\"他还说了一句，我没听明白——\"老周学着那人的腔调，慢悠悠地复述，\"'罐子底下有一道纹，是给会认纹的人看的。认得出，罐子归他；认不出，罐子我收回，谁也不给。'\"<\/p>\n<p>我挂了电话，半天没动。<\/p>\n<p>珍珠罐。两年前那对包头客撒在老周店里的货，那个让草帽人亲口认下\"是我卖给你的\"的罐子。如今，它成了考题。<\/p>\n<p>\"会认纹的人。\"鱼哥重复了一遍，看向把头。<\/p>\n<p>把头把烟在鞋底上摁灭：\"明儿一早，云峰跟文斌去桓仁。会一会这道纹。\"<\/p>\n<p>夜里，我和鱼哥把锅从漫水桥下的干沟里起了出来，背上后山，送进那座老炭窑。<\/p>\n<p>我拿树枝子把窑口封好，又蹲下身，把那口锅掉了个个儿，让磕口朝门，好认。临出窑门，我回头又看了一眼——锅灰扑扑地蹲在窑底，像个打盹的老头。<\/p>\n<p>睡下以后，我翻来覆去，怎么也睡不着。<\/p>\n<p>那老头的话，一句一句在脑子里过。守灯的。守你们这种会自己点着的人。五部的事、阴契的事、镜子的事，像是几百年的线，全拧在我一个人身上。<\/p>\n<p>后半夜，我实在躺不住，又爬起来，摸黑上了后山。<\/p>\n<p>炭窑的门，跟我封的时候一样，树枝子一根没动。我扒开一条缝，把手电打进去——<\/p>\n<p>那口锅还在。<\/p>\n<p>可它的朝向，变了。<\/p>\n<p>我明明把它掉了个个儿，让磕口朝门。如今那磕口，冲着窑壁，整整转了小半圈。<\/p>\n<p>我站在窑门口，手电光里，那口锅纹丝不动地蹲着，像个睡得正沉的东西。窑里没有脚印，没有手印，耗子也拱不动一口陶锅。<\/p>\n<p>我把树枝子重新封好，一步一步往回走。<\/p>\n<p>走到半坡，我停下来，回头望着那座黑黢黢的炭窑，想起缺耳老头的一句话——<\/p>\n<p>锅是死物，谁都能搬。<\/p>\n<p>可它要是自己转了个身呢？<\/p>", "plain": "那口锅，我没敢大白天背回蜂房。 天亮前，我把它裹在防雨布里，塞进雅河乡外那道漫水桥底下的一处干沟，上头压了几捆苞米秸，瞧着跟河滩上乱堆的柴火一样。然后我空着手，沿着大路走回蜂房。 雅河乡的住处是王瘸子的两间废蜂房。 说\"废\"，是真废。土墙裂着指头宽的缝，屋顶苫的草烂了大半，屋里一股陈年蜂蜡和干草混合的味。收拾了三天，才勉强能住人。正屋住人，偏屋堆家伙，后山脚还有一个老炭窑——早年间烧炭用的，塌了半边，让豆芽仔拿树枝子一盖，从外头看就是一堆荒草。 我把门掩上，刚在炕沿坐下，鱼哥就推门进来了。 他看了我一眼，没问锅，先把一碗热粥搁在我手边：\"吃了。\" 我端起碗，两口喝完。他蹲在门槛上，等我开口。 我把夜里的事，捡要紧的说了。说到缝口那个缺耳的白发老头时，鱼哥的眉头拧了起来。他是见过世面的，十年前少林寺塔林那回，他师傅圆寂夜里的白纸灯笼，他都亲眼看过——可\"人\"这一层，他比我更信不过。 \"他要是真想拦你，\"鱼哥说，\"你出不了那道缝。\" 我没接话，因为我知道他说得对。那老头要是动手，十个我也不是个儿。他不动手，只让路，那才是最难办的地方——说明他压根没把我和那口锅，当成一回事。 下午，把头从桓仁镇子上回来。 他进门先洗手，掸了掸衣裳上的灰，才在我对面坐下，卷了根烟。我把夜里的事，从头到尾又讲了一遍。讲那老头说的话，讲他掐烟的架势，讲他提到\"三十七年前，桓仁\"那几句。 讲到缺耳的时候，把头的烟卷到一半，停住了。 屋里静了半晌。他把那根没卷完的烟搁下，慢慢地问：\"你说，他的左耳——\" \"齐着耳根，缺了多半截。\"我说，\"只留一点肉桩子。\" 把头没说话。他伸手去够烟盒，够了两回，才把烟摸出来，可没点，就那么捏在手里。 \"把头。\"我压低声音，\"你认出来了？\" \"我认不出。\"他过了好一会儿才开口，\"三十七年了，我只见过他一面，还是在魇着的时候。可你这句话——缺了多半截的左耳——跟他当年一模一样。\" 他顿了顿：\"我在桓仁魇着那回，是十九岁。醒过来的时候，怀里就压着这面镜子，镜背冲上，鱼尾文'守'字正对着我的脸。我四下里看，屋里没人，只当是梦。\" \"你那时候，见过他的脸？\" \"见过一眼。\"把头说，\"他背对着窗户走，临出门，侧了一下头。晨光正好打在他脸上，我就记住了那只耳朵。\" 他说完这句，就不再往下讲了。把那根烟点着，抽了两口，忽然没头没脑地冒出一句：\"他说，账记在我名下？\" \"是。\" \"记就记吧。\"把头把烟灰磕在炕沿上，\"山要收账，躲是躲不过去的。躲得过的是人账，躲不过的是山账。云峰，你记住——往后咱们在这条线上，能少欠人，就少欠人。欠了的，都得还。\" 他说这话的时候，眼睛望着窗外那片柞树林子，不知在想什么。 王瘸子是在傍晚来的。 他是来收这个月房钱的，一进门就四下里踅摸，看见我们把屋子收拾得利利索索，先是一愣，随即又笑： \"我说，你们这几个外乡人，倒是比我头先那俩房客讲究。\" \"头先那俩？\"豆芽仔凑上去，\"瘸子叔，你说的是不是那俩收山货的——一个红鼻头，一个白头发？\" \"可不是嘛。\"王瘸子收了钱，往怀里一揣，话匣子就打开了，\"去年开春在我这儿住了小半年，走的时候把屋子扫得锃亮，连根柴火棍都没落下。房租给三百，人家非塞四百，说是'添点柴火钱'。啧，讲究人。\" \"他俩后来还回来过？\"我把话头往这儿引。 \"回来过。\"王瘸子压低声音，\"就上月底，那白头发的老头一个人回来，住了一宿。我问他那个红鼻头呢，他说'走了，不回来了'。走的那天早上，我瞅见他在后墙根底下烧了一堆纸，灰都没踩灭就走了。那纸灰我扫了好几天才扫净，边扫边嘀咕——这年头，谁还给死人烧纸啊。\" 我心头一凛，面上没露。 后墙根，烧纸。 猴三儿说过，那俩包头客当年住在蜂房里，隔个十天半月进一回山，每回进山前都在房后头烧一回纸。给山里的东西烧纸。上月底那白头发老头回来住了一宿、烧了一堆纸——他要进山？ 我朝把头递了个眼色。把头不动声色，等王瘸子走了，才开口： \"他进没进山，说不准。可有一件事是实的——他回来住一宿、烧纸，是上月底的事。咱们搬进来才三天，跟他那一宿，中间隔得不算远。他烧的那堆纸灰，要是没人动过，该还在后墙根。\" \"他烧的那堆纸灰，\"我接道，\"咱们收拾屋子的时候，会不会收拾掉了？\" \"翻。\"把头只说了这一个字。 我们四个把蜂房前后翻了个底朝天。豆芽仔在偏屋的炕洞里，掏出一个铁盒子。 盒子不大，是那种装水果糖的旧铁盒，锈得看不出本色。他把它抱出来的时候，盒盖一开，\"哗啦\"一声，滚出半盒子东西。 我蹲下去看，一下子愣住了。 盒子里没有纸，没有灰——是一套做针线的家什。一个黄铜顶针，磨得锃亮，上头刻着细密的花纹；两轴线，一轴红的，一轴黑的；几绺布头，红一道黑一道，边角裁得齐齐整整；还有一把小剪刀，剪口锋利，用油布包着。 豆芽仔捻起那绺红布头，翻来覆去地看，忽然\"咦\"了一声：\"这布头的边儿，收得真细。这是拿针线锁过的边，针脚密得跟机器砸的一样。\" 细针脚。 我心里一跳，跟鱼哥对了个眼神。 老周说过，那白头发瘦子的灰褂子袖口上，补着一块蓝补丁，针脚细得\"比机器缝的还匀\"。沟里石室北壁那两枚新钎眼上系的红布条，也是这么细的针脚。加油站老鼠男摊上的飘带，还是这么细的针脚。 三种东西，一个针脚。 \"不是三种。\"把头拿起那绺红布头，在指间捻了捻，\"是一种。撒货的、封门的、打记号的，全是这一根针线出来的。这蜂房里住过的不是收山货的——是替山里'绣花'的。\" 他顿了顿：\"那个白头发老头，不是从沟里出来的。他是从沟里'出去'的——出去替山里做事的。做完了，再回来烧纸，把数对上。\" 正说着，堂屋的座机响了。 豆芽仔接起来，听了一句，脸色就变了，捂着话筒冲我们压低声音：\"是桓仁老周！他说——那个戴草帽的，又去他店里了！\" 我跟把头对了个眼神。把头放下手里的布头：\"接过来，外放。\" 电话那头，老周的声音又急又虚：\"兄弟！那个戴草帽的又来了！可他这回不是来找事的——他送来一样东西，让我转交给你们掌柜！\" \"什么东西？\" \"就是那个珍珠罐！\"老周说，\"他说——'这罐子在我这儿搁了两年，该物归原主了。让你们掌柜的人来取，明天这时候，我在店里等。'\" 我把话筒接过来：\"老周，他还说别的没有？\" \"他还说了一句，我没听明白——\"老周学着那人的腔调，慢悠悠地复述，\"'罐子底下有一道纹，是给会认纹的人看的。认得出，罐子归他；认不出，罐子我收回，谁也不给。'\" 我挂了电话，半天没动。 珍珠罐。两年前那对包头客撒在老周店里的货，那个让草帽人亲口认下\"是我卖给你的\"的罐子。如今，它成了考题。 \"会认纹的人。\"鱼哥重复了一遍，看向把头。 把头把烟在鞋底上摁灭：\"明儿一早，云峰跟文斌去桓仁。会一会这道纹。\" 夜里，我和鱼哥把锅从漫水桥下的干沟里起了出来，背上后山，送进那座老炭窑。 我拿树枝子把窑口封好，又蹲下身，把那口锅掉了个个儿，让磕口朝门，好认。临出窑门，我回头又看了一眼——锅灰扑扑地蹲在窑底，像个打盹的老头。 睡下以后，我翻来覆去，怎么也睡不着。 那老头的话，一句一句在脑子里过。守灯的。守你们这种会自己点着的人。五部的事、阴契的事、镜子的事，像是几百年的线，全拧在我一个人身上。 后半夜，我实在躺不住，又爬起来，摸黑上了后山。 炭窑的门，跟我封的时候一样，树枝子一根没动。我扒开一条缝，把手电打进去—— 那口锅还在。 可它的朝向，变了。 我明明把它掉了个个儿，让磕口朝门。如今那磕口，冲着窑壁，整整转了小半圈。 我站在窑门口，手电光里，那口锅纹丝不动地蹲着，像个睡得正沉的东西。窑里没有脚印，没有手印，耗子也拱不动一口陶锅。 我把树枝子重新封好，一步一步往回走。 走到半坡，我停下来，回头望着那座黑黢黢的炭窑，想起缺耳老头的一句话—— 锅是死物，谁都能搬。 可它要是自己转了个身呢？"}, {"id": "A5-078", "arc": "A5", "num": 78, "title": "认字", "md": "第二天一早，我把照魇镜从怀里掏出来，还给鱼哥。\n\n\"收好。\"我说，\"魇着的时候，镜子压胸口。\"\n\n鱼哥接了，没说话，只在镜背的鱼尾纹上摩挲了一下。他知道这面镜子这一夜跟着我进了一趟沟，替我照过一口空锅、一个缺耳的人——他什么也没问。\n\n我跟鱼哥搭老周的顺路车到桓仁的时候，是上午九点多。老周早把店门开了一半，站在柜台后头搓手，看见我们，像看见了救星：\n\n\"二位可算来了！那罐子我连夜擦了三遍，连个灰星儿都不敢沾！\"\n\n他从后屋捧出一样东西，小心翼翼地放在柜台上。\n\n那是我头一回见珍珠罐。\n\n巴掌高，黑陶，圆肩，收底，罐身上密密麻麻全是细小的凸点，在窗口的天光里泛着温润的光，像撒了一把没穿线的珠子。搁在柜台上一看，黑沉沉的一小只，瞧不出半点值钱相。\n\n\"就这？\"鱼哥难得开口，\"老周，这罐子当年收了多少钱？\"\n\n老周竖起三根手指，又压低声音：\"三千二。那红鼻头要四千，我磨了半天嘴皮子。搁这两年，也没人问过一嘴——谁知道就成香饽饽了。\"\n\n我把罐子端起来，先看底。\n\n罐底一圈矮圈足，足心有一层黑亮的包浆。我拿指腹蹭了蹭，正要放回去，手忽然停住了——圈足内侧，对着光，隐隐有一道划痕。\n\n很浅，像是刻完又被人拿砂石磨过一遍，只留一道若有若无的白线。\n\n我掏出随身带的放大镜，凑上去。\n\n那道\"白线\"，在放大镜底下显出原形：两道弧线，一上一下，尾端勾连在一起，像一条翻尾的鱼。\n\n我的手指一僵。\n\n鱼尾文。\n\n镜子背上那道\"守\"字，用的就是这种鱼尾勾连的写法。把头说过，那是高句丽老匠人的刀法，一笔勾尾，收锋带守。我在这道划痕上，看见了跟镜子一模一样的东西。\n\n\"云峰。\"鱼哥注意到我的脸色。\n\n\"你看。\"我把罐子递过去，指给他看圈足内侧，\"这纹，跟镜背上的一样。\"\n\n鱼哥就着放大镜看了很久，直起身，没说话，可他握罐子的手，稳得出奇。\n\n老周在边上急得直搓手：\"怎么样怎么样？认得出不？认不出那人可真要把罐子收回去啊——\"\n\n\"认得出。\"我把罐子放回柜台，问老周，\"老周，当年那红鼻头卖罐子的时候，说过它是什么来历没有？\"\n\n\"来历？\"老周挠头，\"他就说了一句——'土里起出来的，正经货。'再问，他就翻脸，说'爱要不要，不要拉倒'。倒是那个白头发的老头，蹲在门口，忽然插了一嘴。\"\n\n\"他说什么？\"\n\n\"他说——\"老周学着那种不爱吭声的人，慢慢开口，\"'这罐子，原先不是装东西的。'\"\n\n我心头一动：\"不是装东西的，那是干什么的？\"\n\n\"我哪知道啊。\"老周说，\"我问了，他就不吭声了。那红鼻头还瞪了他一眼。\"\n\n不是装东西的罐子。\n\n我从怀里掏出一张纸，把圈足内侧那道鱼尾纹，一笔一笔描了下来，折好，揣进兜里。老周要把罐子钱退给我们——说是那人交代过，\"罐子归认得出纹的人，钱他出\"。我拦了他：\n\n\"老周，这罐子我先拿走，不是白拿。你要是心里不踏实——\"\n\n\"踏实，踏实！\"老周连连摆手，\"这东西搁在我这儿两年，我这心里就没踏实过。二位拿走，我反倒能睡个整觉了！\"\n\n我把罐子用油布裹了，揣进怀里。出门前，我回头看了老周一眼：\n\n\"老周，这两天，店里要是再有人来问罐子，你别答话，先给我打电话。\"\n\n\"记住了。\"\n\n出了店门，我低头整理衣裳，余光里，街对面的布告栏后头，站着一个人。\n\n我抬眼去瞧——那人背过身，正慢吞吞地走。\n\n个头，特别矮。\n\n矮得不像话。比街边那卖糖葫芦的炉子高不了多少，裹着一件灰扑扑的旧袄子，走起来一摇一晃。我心头一跳，想起豆芽仔说过的话——\"买主不是废品站的人！有个老头在旁边盯着看！个头特别矮，比我矮一半还多！\"\n\n那个在沈阳废品站、在我们卖铁器时盯梢的矮个子。\n\n\"鱼哥。\"我压低声音。\n\n\"看见了。\"鱼哥说，\"别回头。\"\n\n我们拐进早市，在人堆里左穿右插。鱼哥熟这一套，带着我三拐两拐，从一家干货铺的后门穿出去，绕到河沿的巷子里。我站住脚，回头望了一眼——那矮个子没跟上来。\n\n可我知道，他没跟上来，不等于他走了。\n\n他八成是回去报信了。\n\n我跟鱼哥没急着往回赶，先绕到河沿的栏杆边，站了一会儿。确认没人跟上来，我才低声说：\"鱼哥，你还记得豆芽仔在沈阳说的那个矮个子不？废品站，咱们替老周出手那批铁器的时候——他也在。\"\n\n\"记得。\"鱼哥说，\"个头跟咱俩说的，一个样。\"\n\n\"那就怪了。\"我看着河面，\"咱们替老周跑沈阳出手那批铁器，是刚开春的事。那时候，咱们连鹰嘴沟在哪儿都不知道，更没见过什么锅什么罐。他打那时候就盯着咱们——那他盯的，就不是锅。\"\n\n\"是咱们。\"\n\n鱼哥没接话。他点了根烟，抽了两口，才说：\"回去吧。这事得让把头知道。\"\n\n回去的路上，我坐在三蹦子的车斗里，把那罐子隔着油布摸了摸，心里那点寒气一直没散。\n\n一个从沈阳就跟着咱们的影子，跟着咱们进了桓仁，进了老周的店，看着咱们把珍珠罐取走。他要是跟了一路——那蜂房，还安不安全？\n\n回到蜂房已是午后。\n\n我把罐子放在堂屋桌上，把那张描好的鱼尾纹摊开，跟把头比对着看。把头捏着那张纸，看了很久，又让我把罐子底朝上搁着，他从侧面打着手电照。\n\n\"云峰。\"他忽然说，\"你再看这圈足。\"\n\n我蹲下去。手电光贴着罐底横着打过来，圈足内侧那道鱼尾纹，在斜光里拖出一道影子——不是一道，是浅浅的两道，一深一浅，并排躺着。\n\n\"两道？\"\n\n\"两道。\"把头说，\"一道是刻的，一道是磨的。刻的是原样的，磨的——是后来有人想把这道纹磨掉，没磨干净，又做旧盖住。能看出磨痕的，才是'认得出纹的人'。\"\n\n\"谁磨的？\"\n\n\"想让它变成普通罐子的人。\"把头把罐子放下，\"磨它的人不想让人认出来。留下半道印子的人，是故意留的——他等着有人能认出来。\"\n\n我明白了：\"那卖罐子的白头发老头，是故意留的。\"\n\n\"不止。\"把头看着我，\"你想想，这罐子上这道纹，跟镜子上的鱼尾文，跟咱们取出来的那口锅——是一路的。守字的东西，认守字的人。他把它撒出来，撒在桓仁市面上，撒了两年——就是在等一个能认出这道纹的人。\"\n\n屋里静了一会儿。\n\n鱼哥忽然开口：\"那锅呢？锅上有没有这道纹？\"\n\n我把那口锅从炭窑里搬下来，揭了布，拿湿布把内壁的积灰一层层擦净。擦到锅底正中的时候，湿布底下，露出一道淡淡的划痕——跟罐子上一模一样的鱼尾文，只是更大，更深，像盖印一样，压在锅底中央。\n\n三道了。\n\n镜。罐。锅。\n\n三样东西，三个地方，同一个记号。\n\n\"守字的东西，\"把头把那口锅转过来，锅底朝上，手电光照着那道鱼尾纹，\"头先我只当是一面镜子。如今看，是一套。\"\n\n\"一套什么？\"\n\n把头没答。他摩挲着锅底那道纹，过了很久，才说：\"一套'信'。\"\n\n\"古时候两家盟誓，刀刻为凭，烧陶为信。这锅、这罐、这镜，要都是同一炉出来的信物——那它们背后，就是同一个人、同一炉火、同一句誓。\"\n\n他抬起眼：\"而能拿得出一整套信的，只有立誓的那一家。\"\n\n夜里，我没敢再把锅送回炭窑。\n\n我把锅和罐并排放在堂屋的桌下，拿油布裹严实了，又压了一块磨盘在上头。鱼哥睡里屋，我跟豆芽仔、把头睡外屋。小萱在偏屋，门闩插得紧紧的。\n\n后半夜，我迷迷糊糊听见有人翻身。\n\n我睁开眼。月光从窗纸的破洞里漏进来，照见鱼哥坐在炕沿上，半截身子挺得笔直，眼睛睁着，可我知道他没醒。\n\n他魇着了。\n\n我正要伸手去够枕边的镜子，鱼哥忽然开口了。声音很轻，很平，不像他自己的调子：\n\n\"云峰。\"\n\n我伸出去的手停住。\n\n\"灯点了。\"他说，\"点了四盏了。\"\n\n说完这句，他就那么直挺挺地往后一倒，重新躺平，呼吸匀匀的，像刚才什么都没发生过。\n\n我坐在黑暗里，手悬在半空，半天没敢动。\n\n灯。又是灯。\n\n石室里的白纸灯笼，沈清荷梦里的七头青铜灯，马渡霜那句\"灯亮一盏，走一个人\"，魇里那句\"灯还差三盏\"……如今鱼哥魇着说，点了四盏了。\n\n三盏没点着，四盏已经亮了。\n\n那亮起来的四盏，点的是谁？", "words": 3027, "html": "<p>第二天一早，我把照魇镜从怀里掏出来，还给鱼哥。<\/p>\n<p>\"收好。\"我说，\"魇着的时候，镜子压胸口。\"<\/p>\n<p>鱼哥接了，没说话，只在镜背的鱼尾纹上摩挲了一下。他知道这面镜子这一夜跟着我进了一趟沟，替我照过一口空锅、一个缺耳的人——他什么也没问。<\/p>\n<p>我跟鱼哥搭老周的顺路车到桓仁的时候，是上午九点多。老周早把店门开了一半，站在柜台后头搓手，看见我们，像看见了救星：<\/p>\n<p>\"二位可算来了！那罐子我连夜擦了三遍，连个灰星儿都不敢沾！\"<\/p>\n<p>他从后屋捧出一样东西，小心翼翼地放在柜台上。<\/p>\n<p>那是我头一回见珍珠罐。<\/p>\n<p>巴掌高，黑陶，圆肩，收底，罐身上密密麻麻全是细小的凸点，在窗口的天光里泛着温润的光，像撒了一把没穿线的珠子。搁在柜台上一看，黑沉沉的一小只，瞧不出半点值钱相。<\/p>\n<p>\"就这？\"鱼哥难得开口，\"老周，这罐子当年收了多少钱？\"<\/p>\n<p>老周竖起三根手指，又压低声音：\"三千二。那红鼻头要四千，我磨了半天嘴皮子。搁这两年，也没人问过一嘴——谁知道就成香饽饽了。\"<\/p>\n<p>我把罐子端起来，先看底。<\/p>\n<p>罐底一圈矮圈足，足心有一层黑亮的包浆。我拿指腹蹭了蹭，正要放回去，手忽然停住了——圈足内侧，对着光，隐隐有一道划痕。<\/p>\n<p>很浅，像是刻完又被人拿砂石磨过一遍，只留一道若有若无的白线。<\/p>\n<p>我掏出随身带的放大镜，凑上去。<\/p>\n<p>那道\"白线\"，在放大镜底下显出原形：两道弧线，一上一下，尾端勾连在一起，像一条翻尾的鱼。<\/p>\n<p>我的手指一僵。<\/p>\n<p>鱼尾文。<\/p>\n<p>镜子背上那道\"守\"字，用的就是这种鱼尾勾连的写法。把头说过，那是高句丽老匠人的刀法，一笔勾尾，收锋带守。我在这道划痕上，看见了跟镜子一模一样的东西。<\/p>\n<p>\"云峰。\"鱼哥注意到我的脸色。<\/p>\n<p>\"你看。\"我把罐子递过去，指给他看圈足内侧，\"这纹，跟镜背上的一样。\"<\/p>\n<p>鱼哥就着放大镜看了很久，直起身，没说话，可他握罐子的手，稳得出奇。<\/p>\n<p>老周在边上急得直搓手：\"怎么样怎么样？认得出不？认不出那人可真要把罐子收回去啊——\"<\/p>\n<p>\"认得出。\"我把罐子放回柜台，问老周，\"老周，当年那红鼻头卖罐子的时候，说过它是什么来历没有？\"<\/p>\n<p>\"来历？\"老周挠头，\"他就说了一句——'土里起出来的，正经货。'再问，他就翻脸，说'爱要不要，不要拉倒'。倒是那个白头发的老头，蹲在门口，忽然插了一嘴。\"<\/p>\n<p>\"他说什么？\"<\/p>\n<p>\"他说——\"老周学着那种不爱吭声的人，慢慢开口，\"'这罐子，原先不是装东西的。'\"<\/p>\n<p>我心头一动：\"不是装东西的，那是干什么的？\"<\/p>\n<p>\"我哪知道啊。\"老周说，\"我问了，他就不吭声了。那红鼻头还瞪了他一眼。\"<\/p>\n<p>不是装东西的罐子。<\/p>\n<p>我从怀里掏出一张纸，把圈足内侧那道鱼尾纹，一笔一笔描了下来，折好，揣进兜里。老周要把罐子钱退给我们——说是那人交代过，\"罐子归认得出纹的人，钱他出\"。我拦了他：<\/p>\n<p>\"老周，这罐子我先拿走，不是白拿。你要是心里不踏实——\"<\/p>\n<p>\"踏实，踏实！\"老周连连摆手，\"这东西搁在我这儿两年，我这心里就没踏实过。二位拿走，我反倒能睡个整觉了！\"<\/p>\n<p>我把罐子用油布裹了，揣进怀里。出门前，我回头看了老周一眼：<\/p>\n<p>\"老周，这两天，店里要是再有人来问罐子，你别答话，先给我打电话。\"<\/p>\n<p>\"记住了。\"<\/p>\n<p>出了店门，我低头整理衣裳，余光里，街对面的布告栏后头，站着一个人。<\/p>\n<p>我抬眼去瞧——那人背过身，正慢吞吞地走。<\/p>\n<p>个头，特别矮。<\/p>\n<p>矮得不像话。比街边那卖糖葫芦的炉子高不了多少，裹着一件灰扑扑的旧袄子，走起来一摇一晃。我心头一跳，想起豆芽仔说过的话——\"买主不是废品站的人！有个老头在旁边盯着看！个头特别矮，比我矮一半还多！\"<\/p>\n<p>那个在沈阳废品站、在我们卖铁器时盯梢的矮个子。<\/p>\n<p>\"鱼哥。\"我压低声音。<\/p>\n<p>\"看见了。\"鱼哥说，\"别回头。\"<\/p>\n<p>我们拐进早市，在人堆里左穿右插。鱼哥熟这一套，带着我三拐两拐，从一家干货铺的后门穿出去，绕到河沿的巷子里。我站住脚，回头望了一眼——那矮个子没跟上来。<\/p>\n<p>可我知道，他没跟上来，不等于他走了。<\/p>\n<p>他八成是回去报信了。<\/p>\n<p>我跟鱼哥没急着往回赶，先绕到河沿的栏杆边，站了一会儿。确认没人跟上来，我才低声说：\"鱼哥，你还记得豆芽仔在沈阳说的那个矮个子不？废品站，咱们替老周出手那批铁器的时候——他也在。\"<\/p>\n<p>\"记得。\"鱼哥说，\"个头跟咱俩说的，一个样。\"<\/p>\n<p>\"那就怪了。\"我看着河面，\"咱们替老周跑沈阳出手那批铁器，是刚开春的事。那时候，咱们连鹰嘴沟在哪儿都不知道，更没见过什么锅什么罐。他打那时候就盯着咱们——那他盯的，就不是锅。\"<\/p>\n<p>\"是咱们。\"<\/p>\n<p>鱼哥没接话。他点了根烟，抽了两口，才说：\"回去吧。这事得让把头知道。\"<\/p>\n<p>回去的路上，我坐在三蹦子的车斗里，把那罐子隔着油布摸了摸，心里那点寒气一直没散。<\/p>\n<p>一个从沈阳就跟着咱们的影子，跟着咱们进了桓仁，进了老周的店，看着咱们把珍珠罐取走。他要是跟了一路——那蜂房，还安不安全？<\/p>\n<p>回到蜂房已是午后。<\/p>\n<p>我把罐子放在堂屋桌上，把那张描好的鱼尾纹摊开，跟把头比对着看。把头捏着那张纸，看了很久，又让我把罐子底朝上搁着，他从侧面打着手电照。<\/p>\n<p>\"云峰。\"他忽然说，\"你再看这圈足。\"<\/p>\n<p>我蹲下去。手电光贴着罐底横着打过来，圈足内侧那道鱼尾纹，在斜光里拖出一道影子——不是一道，是浅浅的两道，一深一浅，并排躺着。<\/p>\n<p>\"两道？\"<\/p>\n<p>\"两道。\"把头说，\"一道是刻的，一道是磨的。刻的是原样的，磨的——是后来有人想把这道纹磨掉，没磨干净，又做旧盖住。能看出磨痕的，才是'认得出纹的人'。\"<\/p>\n<p>\"谁磨的？\"<\/p>\n<p>\"想让它变成普通罐子的人。\"把头把罐子放下，\"磨它的人不想让人认出来。留下半道印子的人，是故意留的——他等着有人能认出来。\"<\/p>\n<p>我明白了：\"那卖罐子的白头发老头，是故意留的。\"<\/p>\n<p>\"不止。\"把头看着我，\"你想想，这罐子上这道纹，跟镜子上的鱼尾文，跟咱们取出来的那口锅——是一路的。守字的东西，认守字的人。他把它撒出来，撒在桓仁市面上，撒了两年——就是在等一个能认出这道纹的人。\"<\/p>\n<p>屋里静了一会儿。<\/p>\n<p>鱼哥忽然开口：\"那锅呢？锅上有没有这道纹？\"<\/p>\n<p>我把那口锅从炭窑里搬下来，揭了布，拿湿布把内壁的积灰一层层擦净。擦到锅底正中的时候，湿布底下，露出一道淡淡的划痕——跟罐子上一模一样的鱼尾文，只是更大，更深，像盖印一样，压在锅底中央。<\/p>\n<p>三道了。<\/p>\n<p>镜。罐。锅。<\/p>\n<p>三样东西，三个地方，同一个记号。<\/p>\n<p>\"守字的东西，\"把头把那口锅转过来，锅底朝上，手电光照着那道鱼尾纹，\"头先我只当是一面镜子。如今看，是一套。\"<\/p>\n<p>\"一套什么？\"<\/p>\n<p>把头没答。他摩挲着锅底那道纹，过了很久，才说：\"一套'信'。\"<\/p>\n<p>\"古时候两家盟誓，刀刻为凭，烧陶为信。这锅、这罐、这镜，要都是同一炉出来的信物——那它们背后，就是同一个人、同一炉火、同一句誓。\"<\/p>\n<p>他抬起眼：\"而能拿得出一整套信的，只有立誓的那一家。\"<\/p>\n<p>夜里，我没敢再把锅送回炭窑。<\/p>\n<p>我把锅和罐并排放在堂屋的桌下，拿油布裹严实了，又压了一块磨盘在上头。鱼哥睡里屋，我跟豆芽仔、把头睡外屋。小萱在偏屋，门闩插得紧紧的。<\/p>\n<p>后半夜，我迷迷糊糊听见有人翻身。<\/p>\n<p>我睁开眼。月光从窗纸的破洞里漏进来，照见鱼哥坐在炕沿上，半截身子挺得笔直，眼睛睁着，可我知道他没醒。<\/p>\n<p>他魇着了。<\/p>\n<p>我正要伸手去够枕边的镜子，鱼哥忽然开口了。声音很轻，很平，不像他自己的调子：<\/p>\n<p>\"云峰。\"<\/p>\n<p>我伸出去的手停住。<\/p>\n<p>\"灯点了。\"他说，\"点了四盏了。\"<\/p>\n<p>说完这句，他就那么直挺挺地往后一倒，重新躺平，呼吸匀匀的，像刚才什么都没发生过。<\/p>\n<p>我坐在黑暗里，手悬在半空，半天没敢动。<\/p>\n<p>灯。又是灯。<\/p>\n<p>石室里的白纸灯笼，沈清荷梦里的七头青铜灯，马渡霜那句\"灯亮一盏，走一个人\"，魇里那句\"灯还差三盏\"……如今鱼哥魇着说，点了四盏了。<\/p>\n<p>三盏没点着，四盏已经亮了。<\/p>\n<p>那亮起来的四盏，点的是谁？<\/p>", "plain": "第二天一早，我把照魇镜从怀里掏出来，还给鱼哥。 \"收好。\"我说，\"魇着的时候，镜子压胸口。\" 鱼哥接了，没说话，只在镜背的鱼尾纹上摩挲了一下。他知道这面镜子这一夜跟着我进了一趟沟，替我照过一口空锅、一个缺耳的人——他什么也没问。 我跟鱼哥搭老周的顺路车到桓仁的时候，是上午九点多。老周早把店门开了一半，站在柜台后头搓手，看见我们，像看见了救星： \"二位可算来了！那罐子我连夜擦了三遍，连个灰星儿都不敢沾！\" 他从后屋捧出一样东西，小心翼翼地放在柜台上。 那是我头一回见珍珠罐。 巴掌高，黑陶，圆肩，收底，罐身上密密麻麻全是细小的凸点，在窗口的天光里泛着温润的光，像撒了一把没穿线的珠子。搁在柜台上一看，黑沉沉的一小只，瞧不出半点值钱相。 \"就这？\"鱼哥难得开口，\"老周，这罐子当年收了多少钱？\" 老周竖起三根手指，又压低声音：\"三千二。那红鼻头要四千，我磨了半天嘴皮子。搁这两年，也没人问过一嘴——谁知道就成香饽饽了。\" 我把罐子端起来，先看底。 罐底一圈矮圈足，足心有一层黑亮的包浆。我拿指腹蹭了蹭，正要放回去，手忽然停住了——圈足内侧，对着光，隐隐有一道划痕。 很浅，像是刻完又被人拿砂石磨过一遍，只留一道若有若无的白线。 我掏出随身带的放大镜，凑上去。 那道\"白线\"，在放大镜底下显出原形：两道弧线，一上一下，尾端勾连在一起，像一条翻尾的鱼。 我的手指一僵。 鱼尾文。 镜子背上那道\"守\"字，用的就是这种鱼尾勾连的写法。把头说过，那是高句丽老匠人的刀法，一笔勾尾，收锋带守。我在这道划痕上，看见了跟镜子一模一样的东西。 \"云峰。\"鱼哥注意到我的脸色。 \"你看。\"我把罐子递过去，指给他看圈足内侧，\"这纹，跟镜背上的一样。\" 鱼哥就着放大镜看了很久，直起身，没说话，可他握罐子的手，稳得出奇。 老周在边上急得直搓手：\"怎么样怎么样？认得出不？认不出那人可真要把罐子收回去啊——\" \"认得出。\"我把罐子放回柜台，问老周，\"老周，当年那红鼻头卖罐子的时候，说过它是什么来历没有？\" \"来历？\"老周挠头，\"他就说了一句——'土里起出来的，正经货。'再问，他就翻脸，说'爱要不要，不要拉倒'。倒是那个白头发的老头，蹲在门口，忽然插了一嘴。\" \"他说什么？\" \"他说——\"老周学着那种不爱吭声的人，慢慢开口，\"'这罐子，原先不是装东西的。'\" 我心头一动：\"不是装东西的，那是干什么的？\" \"我哪知道啊。\"老周说，\"我问了，他就不吭声了。那红鼻头还瞪了他一眼。\" 不是装东西的罐子。 我从怀里掏出一张纸，把圈足内侧那道鱼尾纹，一笔一笔描了下来，折好，揣进兜里。老周要把罐子钱退给我们——说是那人交代过，\"罐子归认得出纹的人，钱他出\"。我拦了他： \"老周，这罐子我先拿走，不是白拿。你要是心里不踏实——\" \"踏实，踏实！\"老周连连摆手，\"这东西搁在我这儿两年，我这心里就没踏实过。二位拿走，我反倒能睡个整觉了！\" 我把罐子用油布裹了，揣进怀里。出门前，我回头看了老周一眼： \"老周，这两天，店里要是再有人来问罐子，你别答话，先给我打电话。\" \"记住了。\" 出了店门，我低头整理衣裳，余光里，街对面的布告栏后头，站着一个人。 我抬眼去瞧——那人背过身，正慢吞吞地走。 个头，特别矮。 矮得不像话。比街边那卖糖葫芦的炉子高不了多少，裹着一件灰扑扑的旧袄子，走起来一摇一晃。我心头一跳，想起豆芽仔说过的话——\"买主不是废品站的人！有个老头在旁边盯着看！个头特别矮，比我矮一半还多！\" 那个在沈阳废品站、在我们卖铁器时盯梢的矮个子。 \"鱼哥。\"我压低声音。 \"看见了。\"鱼哥说，\"别回头。\" 我们拐进早市，在人堆里左穿右插。鱼哥熟这一套，带着我三拐两拐，从一家干货铺的后门穿出去，绕到河沿的巷子里。我站住脚，回头望了一眼——那矮个子没跟上来。 可我知道，他没跟上来，不等于他走了。 他八成是回去报信了。 我跟鱼哥没急着往回赶，先绕到河沿的栏杆边，站了一会儿。确认没人跟上来，我才低声说：\"鱼哥，你还记得豆芽仔在沈阳说的那个矮个子不？废品站，咱们替老周出手那批铁器的时候——他也在。\" \"记得。\"鱼哥说，\"个头跟咱俩说的，一个样。\" \"那就怪了。\"我看着河面，\"咱们替老周跑沈阳出手那批铁器，是刚开春的事。那时候，咱们连鹰嘴沟在哪儿都不知道，更没见过什么锅什么罐。他打那时候就盯着咱们——那他盯的，就不是锅。\" \"是咱们。\" 鱼哥没接话。他点了根烟，抽了两口，才说：\"回去吧。这事得让把头知道。\" 回去的路上，我坐在三蹦子的车斗里，把那罐子隔着油布摸了摸，心里那点寒气一直没散。 一个从沈阳就跟着咱们的影子，跟着咱们进了桓仁，进了老周的店，看着咱们把珍珠罐取走。他要是跟了一路——那蜂房，还安不安全？ 回到蜂房已是午后。 我把罐子放在堂屋桌上，把那张描好的鱼尾纹摊开，跟把头比对着看。把头捏着那张纸，看了很久，又让我把罐子底朝上搁着，他从侧面打着手电照。 \"云峰。\"他忽然说，\"你再看这圈足。\" 我蹲下去。手电光贴着罐底横着打过来，圈足内侧那道鱼尾纹，在斜光里拖出一道影子——不是一道，是浅浅的两道，一深一浅，并排躺着。 \"两道？\" \"两道。\"把头说，\"一道是刻的，一道是磨的。刻的是原样的，磨的——是后来有人想把这道纹磨掉，没磨干净，又做旧盖住。能看出磨痕的，才是'认得出纹的人'。\" \"谁磨的？\" \"想让它变成普通罐子的人。\"把头把罐子放下，\"磨它的人不想让人认出来。留下半道印子的人，是故意留的——他等着有人能认出来。\" 我明白了：\"那卖罐子的白头发老头，是故意留的。\" \"不止。\"把头看着我，\"你想想，这罐子上这道纹，跟镜子上的鱼尾文，跟咱们取出来的那口锅——是一路的。守字的东西，认守字的人。他把它撒出来，撒在桓仁市面上，撒了两年——就是在等一个能认出这道纹的人。\" 屋里静了一会儿。 鱼哥忽然开口：\"那锅呢？锅上有没有这道纹？\" 我把那口锅从炭窑里搬下来，揭了布，拿湿布把内壁的积灰一层层擦净。擦到锅底正中的时候，湿布底下，露出一道淡淡的划痕——跟罐子上一模一样的鱼尾文，只是更大，更深，像盖印一样，压在锅底中央。 三道了。 镜。罐。锅。 三样东西，三个地方，同一个记号。 \"守字的东西，\"把头把那口锅转过来，锅底朝上，手电光照着那道鱼尾纹，\"头先我只当是一面镜子。如今看，是一套。\" \"一套什么？\" 把头没答。他摩挲着锅底那道纹，过了很久，才说：\"一套'信'。\" \"古时候两家盟誓，刀刻为凭，烧陶为信。这锅、这罐、这镜，要都是同一炉出来的信物——那它们背后，就是同一个人、同一炉火、同一句誓。\" 他抬起眼：\"而能拿得出一整套信的，只有立誓的那一家。\" 夜里，我没敢再把锅送回炭窑。 我把锅和罐并排放在堂屋的桌下，拿油布裹严实了，又压了一块磨盘在上头。鱼哥睡里屋，我跟豆芽仔、把头睡外屋。小萱在偏屋，门闩插得紧紧的。 后半夜，我迷迷糊糊听见有人翻身。 我睁开眼。月光从窗纸的破洞里漏进来，照见鱼哥坐在炕沿上，半截身子挺得笔直，眼睛睁着，可我知道他没醒。 他魇着了。 我正要伸手去够枕边的镜子，鱼哥忽然开口了。声音很轻，很平，不像他自己的调子： \"云峰。\" 我伸出去的手停住。 \"灯点了。\"他说，\"点了四盏了。\" 说完这句，他就那么直挺挺地往后一倒，重新躺平，呼吸匀匀的，像刚才什么都没发生过。 我坐在黑暗里，手悬在半空，半天没敢动。 灯。又是灯。 石室里的白纸灯笼，沈清荷梦里的七头青铜灯，马渡霜那句\"灯亮一盏，走一个人\"，魇里那句\"灯还差三盏\"……如今鱼哥魇着说，点了四盏了。 三盏没点着，四盏已经亮了。 那亮起来的四盏，点的是谁？"}, {"id": "A5-079", "arc": "A5", "num": 79, "title": "数灯", "md": "第二天一早，天刚蒙蒙亮，鱼哥在院里蹲着刷牙。\n\n我端了碗粥蹲在他旁边，没头没尾地问他：\"夜里那话，你自己还记得不？\"\n\n鱼哥的动作顿了一下，没回头：\"记得一点。\"\n\n\"记得什么？\"\n\n\"梦。\"他漱了口，把水吐进墙根的草窠里，\"梦见黑地里站着一排人，五个人，一人手里一盏灯。四个人手里的灯都亮着，火苗稳稳的，照得人脸都发亮。第五个人，手里的灯点不着——不是没火，是灯芯潮了。\"\n\n我端着粥碗的手紧了紧：\"那第五个人，你看清脸了？\"\n\n\"没有。\"鱼哥说，\"我想凑近了看，他后头忽然伸过来一只手，把我眼睛捂住了。\"他顿了顿，\"有个声音说——'这盏，不是你的。'\"\n\n他说完，把牙刷往缸子里一插，站起来：\"云峰，那五个人要是照着咱们屋里的数——\"\n\n\"别数了。\"我打断他。\n\n他没再往下说。可我端着那碗粥，一口都咽不下去了。\n\n晌午，豆芽仔从桓仁回来，一进门就灌了半缸子水，抹了把嘴：\"哥，那老鼠男，又出摊了！\"\n\n\"出摊就出摊，你跑成这样？\"我给他拉了个凳子。\n\n\"摊子是出摊了，可不对头！\"豆芽仔压低声音，\"他那摊上，除了那些开光土豆、墨镜、破铁皮蛤蟆，多了一样东西——一盏白纸灯笼！没糊完的，竹篾骨子支棱着，糊了一半的白纸耷拉着，就搁在小马扎上。我走近了瞧，他一把就给扣在筐底下，跟防贼似的！\"\n\n白纸灯笼。\n\n我搁下手里的碗：\"他瞧见你了？\"\n\n\"瞧见了。\"豆芽仔说，\"他还冲我招了招手。我过去，他一句话没说，就盯着我看。看得我后脊梁发毛，我才要开口，他忽然说话了。\"\n\n\"说什么？\"\n\n\"他说——'回去告诉你们掌柜的：名分是灯芯。认下了名分，就得有人点灯。'\"\n\n我心头一紧，面上没露：\"还有呢？\"\n\n\"还有——\"豆芽仔咽了口唾沫，\"他说，'灯会要开了。五盏灯，四盏有了主，剩一盏，看你们掌柜的点不点。'说完他就低头收拾他那些破铁皮蛤蟆，再不理我了。\"\n\n五盏灯，四盏有了主。\n\n我脑子里\"嗡\"的一声，跟鱼哥魇里那句话撞在了一起——\"灯点了，点了四盏了。\"\n\n五盏里亮了四盏。剩一盏没主的。\n\n豆芽仔不懂这里头的分量，还在絮叨：\"哥，那老头是不是脑子有毛病？什么灯芯灯会的，装神弄鬼——\"\n\n\"芽仔。\"把头从里屋出来，手里捏着半根没点的烟，\"他这话，是给咱们听的，不是给你听的。你原话带到了，就很好。\"\n\n他走到桌边坐下，把烟搁下，冲我抬了抬下巴：\"云峰，你怎么想？\"\n\n\"我想不通的是数。\"我说，\"石室里，五口锅倒扣着，是五部。墙上写'一灯既起，五部来归；六位既满，骨城自开'——灯跟部是走的。可马渡霜又说'别接灯，灯亮一盏，走一个人'——一盏灯，是一个人的命。五盏灯跟五部、跟人，到底哪个对得上？\"\n\n\"都对得上。\"把头说，\"一个部，就是一个人的名分。五部当初立盟，一部一主，一主一灯。灯在，人在；灯灭，部绝。所以墙上那句话才说——五部来归，是把灯都点起来，让五部的人照着自己回家。\"\n\n我慢慢地问：\"那四盏有了主——是那四部还活着的主？\"\n\n\"是。\"把头把烟点着，\"肉、米、酱、酒，四部四块银符，都叫咱们起出来了。可那是四块死人的饭符。活的灯主，是另外一路。\"\n\n他看着我：\"云峰，你还记得那口空锅底下压的东西吗？\"\n\n\"无字阴契。\"我说。\n\n\"对。四部有字，消奴没字。四部是死契，这空锅、这阴契——是活的。你认下它的那一夜起，消奴部这一盏灯，就挂在你名下了。\"\n\n\"那账就对不上了。\"鱼哥忽然开口。\n\n我们都看向他。\n\n\"五盏灯，四盏有主，一盏没主——这是老鼠男的账。\"鱼哥说，\"可咱们的账上，五部之外，石室西南角还空着一个第六位。要是五盏灯只对应五部，那个空位子算什么？要是它也算一盏灯，那就不是五盏，是六盏。\"\n\n他顿了顿：\"他给你报的数，是教你的数，还是他数的数？\"\n\n我一时答不上来。石室里的第六位，那块色气发乌的空地，起走了东西，也起走了名目——可那东西是什么，我们至今不知道。老周手里出来的珍珠罐，也许沾边，也许只是另一条线。\n\n\"所以我才说，他这账，递到咱们头上，就是让咱们替他数。\"把头把烟灰磕掉，\"他自己数不清楚，才把这本糊涂账往外递。谁接过去替他一数，谁就先乱了阵脚。\"\n\n屋里静了一瞬。\n\n小萱端了饭进来，见我们都坐着不动，也没问，把饭菜摆好，又退了回去。\n\n我把碗端起来，扒了两口，搁下：\"那老鼠男说剩一盏没主——他这话，是在问把头，还是在试探咱们？\"\n\n\"问，也是试探。\"把头说，\"他替山里办事，办的是数人的差。灯有几盏、谁点了、谁没点，他心里有一本账。今儿他跟你把话挑明了，明儿这本账，就该递到咱们头上来。\"\n\n\"那咱们怎么办？\"\n\n把头抽了两口烟，忽然问了一句不相干的：\"云峰，你说，草帽人跟老鼠男，是一路的吗？\"\n\n我想了想：\"一个守沟口，一个守大路。一个递话，一个送带子。像是两路人，可干的都是一样的事——盯着咱们。\"\n\n\"那要是一路呢？\"把头说，\"一路人，分两摊，一个唱红脸一个唱白脸：一个劝你搬锅，一个问你点灯。一个说'搬得动就快搬'，一个说'看你们掌柜的点不点'。兜来兜去，都是想把咱们往一个地方赶。\"\n\n\"往哪赶？\"\n\n把头没答，把烟摁灭：\"咱们不能顺着他们走。明儿，我出一招——你们看戏。\"\n\n他说的招，是\"烧锅\"。\n\n第二天，豆芽仔照把头的吩咐，去老周店里坐了半下午，有一搭没一搭地跟老周唠：那口倒扣的陶锅，太邪性，夜里会自己翻身，吓得我们掌柜睡不着，索性一锅一罐，都架在后院烧了。烧得干干净净，灰都扬进浑江里了。\n\n老周听得直咂舌：\"烧了好，烧了好！那东西搁着就是个祸害！\"\n\n豆芽仔前脚走，老周后脚就把这话学给了来买烟的行商，行商又传给收破烂的，收破烂的又传给开三蹦子的——不到一天，半个桓仁都知道：雅河乡那伙收老物件的，把一口镇宅的破锅烧了。\n\n这是把头撒出去的饵。\n\n夜里，我照旧睡在堂屋，锅和罐就压在桌底下。我枕着那面借回来的镜子——白天我又从鱼哥那儿把镜子要了回来，守着这两样东西，总觉得心里才踏实。\n\n外头起了风，柞树叶子哗啦啦地响。\n\n我躺着，数着风声，数着屋外偶尔一声两声的虫鸣，数着心里那几盏灯——\n\n石室里那盏白纸灯笼，亮过，又灭了。\n鱼哥魇里说点了四盏。\n老鼠男说五盏有四盏有了主。\n\n四。四。四。\n\n我数到第四遍的时候，忽然听见外头传来一声极轻的声响。\n\n不是风声。\n\n是脚步。踩在枯叶上，一步，一步，绕着院子，走过去了。\n\n我慢慢地、不出声地坐起来，从窗纸的破洞往外看。\n\n月光下，院墙外头，一个人影正沿着墙根走。他走得很慢，背有些驼，走几步，停一停，像在找什么。走到炭窑的方向，他停住了，站了一会儿，然后弯下腰——像是捡起了什么东西。\n\n我认不出那是谁。\n\n可我知道，把头撒的\"烧锅\"的饵，有人来咬钩了。\n\n那人直起腰，没往院里来，反倒顺着来路走了。走了几步，他忽然停下，回过头，朝院子的方向看了一眼。\n\n月光正好照在他脸上。\n\n隔着院墙，我看不清眉眼，只看见他慢慢抬起手，朝我这个方向——竖起了三根手指。\n\n然后他转身，消失在柞树林的黑影里。\n\n我僵在窗后，手心里全是汗。\n\n三根手指。\n\n王药根说过，把门人传信不用纸笔：红带子横送是封门，黑带子竖别是请。可这三根手指，跟带子、跟飘带都不是一路的——它更旧，更没头没尾，像一句只说了一半的老话。\n\n我没见过这种信。\n\n可我知道，它是冲着我来的。\n\n那天夜里，我把锅从桌底下拖出来，又检查了一遍麻绳，才重新躺下。天快亮的时候，豆芽仔打来电话，声音都劈了：\n\n\"哥！老鼠男今儿没出摊——可加油站那根路灯杆子上，挂了一盏灯笼！白纸的，糊得齐齐整整，新崭崭的，就朝着咱们雅河乡这个方向！\"\n\n我握着手机，望着窗外慢慢亮起来的天，一个字都说不出来。\n\n灯，挂出来了。\n\n一盏，朝着我们的方向。\n\n王药根说过，把门人传信不用纸笔，红黑带子是信；草帽人捎话、飘带送信，也是信。可这盏白纸灯笼，挂的不是话——是地方。\n\n它指着我们。\n\n点给山看。\n\n山里的账，要开始收了。", "words": 3079, "html": "<p>第二天一早，天刚蒙蒙亮，鱼哥在院里蹲着刷牙。<\/p>\n<p>我端了碗粥蹲在他旁边，没头没尾地问他：\"夜里那话，你自己还记得不？\"<\/p>\n<p>鱼哥的动作顿了一下，没回头：\"记得一点。\"<\/p>\n<p>\"记得什么？\"<\/p>\n<p>\"梦。\"他漱了口，把水吐进墙根的草窠里，\"梦见黑地里站着一排人，五个人，一人手里一盏灯。四个人手里的灯都亮着，火苗稳稳的，照得人脸都发亮。第五个人，手里的灯点不着——不是没火，是灯芯潮了。\"<\/p>\n<p>我端着粥碗的手紧了紧：\"那第五个人，你看清脸了？\"<\/p>\n<p>\"没有。\"鱼哥说，\"我想凑近了看，他后头忽然伸过来一只手，把我眼睛捂住了。\"他顿了顿，\"有个声音说——'这盏，不是你的。'\"<\/p>\n<p>他说完，把牙刷往缸子里一插，站起来：\"云峰，那五个人要是照着咱们屋里的数——\"<\/p>\n<p>\"别数了。\"我打断他。<\/p>\n<p>他没再往下说。可我端着那碗粥，一口都咽不下去了。<\/p>\n<p>晌午，豆芽仔从桓仁回来，一进门就灌了半缸子水，抹了把嘴：\"哥，那老鼠男，又出摊了！\"<\/p>\n<p>\"出摊就出摊，你跑成这样？\"我给他拉了个凳子。<\/p>\n<p>\"摊子是出摊了，可不对头！\"豆芽仔压低声音，\"他那摊上，除了那些开光土豆、墨镜、破铁皮蛤蟆，多了一样东西——一盏白纸灯笼！没糊完的，竹篾骨子支棱着，糊了一半的白纸耷拉着，就搁在小马扎上。我走近了瞧，他一把就给扣在筐底下，跟防贼似的！\"<\/p>\n<p>白纸灯笼。<\/p>\n<p>我搁下手里的碗：\"他瞧见你了？\"<\/p>\n<p>\"瞧见了。\"豆芽仔说，\"他还冲我招了招手。我过去，他一句话没说，就盯着我看。看得我后脊梁发毛，我才要开口，他忽然说话了。\"<\/p>\n<p>\"说什么？\"<\/p>\n<p>\"他说——'回去告诉你们掌柜的：名分是灯芯。认下了名分，就得有人点灯。'\"<\/p>\n<p>我心头一紧，面上没露：\"还有呢？\"<\/p>\n<p>\"还有——\"豆芽仔咽了口唾沫，\"他说，'灯会要开了。五盏灯，四盏有了主，剩一盏，看你们掌柜的点不点。'说完他就低头收拾他那些破铁皮蛤蟆，再不理我了。\"<\/p>\n<p>五盏灯，四盏有了主。<\/p>\n<p>我脑子里\"嗡\"的一声，跟鱼哥魇里那句话撞在了一起——\"灯点了，点了四盏了。\"<\/p>\n<p>五盏里亮了四盏。剩一盏没主的。<\/p>\n<p>豆芽仔不懂这里头的分量，还在絮叨：\"哥，那老头是不是脑子有毛病？什么灯芯灯会的，装神弄鬼——\"<\/p>\n<p>\"芽仔。\"把头从里屋出来，手里捏着半根没点的烟，\"他这话，是给咱们听的，不是给你听的。你原话带到了，就很好。\"<\/p>\n<p>他走到桌边坐下，把烟搁下，冲我抬了抬下巴：\"云峰，你怎么想？\"<\/p>\n<p>\"我想不通的是数。\"我说，\"石室里，五口锅倒扣着，是五部。墙上写'一灯既起，五部来归；六位既满，骨城自开'——灯跟部是走的。可马渡霜又说'别接灯，灯亮一盏，走一个人'——一盏灯，是一个人的命。五盏灯跟五部、跟人，到底哪个对得上？\"<\/p>\n<p>\"都对得上。\"把头说，\"一个部，就是一个人的名分。五部当初立盟，一部一主，一主一灯。灯在，人在；灯灭，部绝。所以墙上那句话才说——五部来归，是把灯都点起来，让五部的人照着自己回家。\"<\/p>\n<p>我慢慢地问：\"那四盏有了主——是那四部还活着的主？\"<\/p>\n<p>\"是。\"把头把烟点着，\"肉、米、酱、酒，四部四块银符，都叫咱们起出来了。可那是四块死人的饭符。活的灯主，是另外一路。\"<\/p>\n<p>他看着我：\"云峰，你还记得那口空锅底下压的东西吗？\"<\/p>\n<p>\"无字阴契。\"我说。<\/p>\n<p>\"对。四部有字，消奴没字。四部是死契，这空锅、这阴契——是活的。你认下它的那一夜起，消奴部这一盏灯，就挂在你名下了。\"<\/p>\n<p>\"那账就对不上了。\"鱼哥忽然开口。<\/p>\n<p>我们都看向他。<\/p>\n<p>\"五盏灯，四盏有主，一盏没主——这是老鼠男的账。\"鱼哥说，\"可咱们的账上，五部之外，石室西南角还空着一个第六位。要是五盏灯只对应五部，那个空位子算什么？要是它也算一盏灯，那就不是五盏，是六盏。\"<\/p>\n<p>他顿了顿：\"他给你报的数，是教你的数，还是他数的数？\"<\/p>\n<p>我一时答不上来。石室里的第六位，那块色气发乌的空地，起走了东西，也起走了名目——可那东西是什么，我们至今不知道。老周手里出来的珍珠罐，也许沾边，也许只是另一条线。<\/p>\n<p>\"所以我才说，他这账，递到咱们头上，就是让咱们替他数。\"把头把烟灰磕掉，\"他自己数不清楚，才把这本糊涂账往外递。谁接过去替他一数，谁就先乱了阵脚。\"<\/p>\n<p>屋里静了一瞬。<\/p>\n<p>小萱端了饭进来，见我们都坐着不动，也没问，把饭菜摆好，又退了回去。<\/p>\n<p>我把碗端起来，扒了两口，搁下：\"那老鼠男说剩一盏没主——他这话，是在问把头，还是在试探咱们？\"<\/p>\n<p>\"问，也是试探。\"把头说，\"他替山里办事，办的是数人的差。灯有几盏、谁点了、谁没点，他心里有一本账。今儿他跟你把话挑明了，明儿这本账，就该递到咱们头上来。\"<\/p>\n<p>\"那咱们怎么办？\"<\/p>\n<p>把头抽了两口烟，忽然问了一句不相干的：\"云峰，你说，草帽人跟老鼠男，是一路的吗？\"<\/p>\n<p>我想了想：\"一个守沟口，一个守大路。一个递话，一个送带子。像是两路人，可干的都是一样的事——盯着咱们。\"<\/p>\n<p>\"那要是一路呢？\"把头说，\"一路人，分两摊，一个唱红脸一个唱白脸：一个劝你搬锅，一个问你点灯。一个说'搬得动就快搬'，一个说'看你们掌柜的点不点'。兜来兜去，都是想把咱们往一个地方赶。\"<\/p>\n<p>\"往哪赶？\"<\/p>\n<p>把头没答，把烟摁灭：\"咱们不能顺着他们走。明儿，我出一招——你们看戏。\"<\/p>\n<p>他说的招，是\"烧锅\"。<\/p>\n<p>第二天，豆芽仔照把头的吩咐，去老周店里坐了半下午，有一搭没一搭地跟老周唠：那口倒扣的陶锅，太邪性，夜里会自己翻身，吓得我们掌柜睡不着，索性一锅一罐，都架在后院烧了。烧得干干净净，灰都扬进浑江里了。<\/p>\n<p>老周听得直咂舌：\"烧了好，烧了好！那东西搁着就是个祸害！\"<\/p>\n<p>豆芽仔前脚走，老周后脚就把这话学给了来买烟的行商，行商又传给收破烂的，收破烂的又传给开三蹦子的——不到一天，半个桓仁都知道：雅河乡那伙收老物件的，把一口镇宅的破锅烧了。<\/p>\n<p>这是把头撒出去的饵。<\/p>\n<p>夜里，我照旧睡在堂屋，锅和罐就压在桌底下。我枕着那面借回来的镜子——白天我又从鱼哥那儿把镜子要了回来，守着这两样东西，总觉得心里才踏实。<\/p>\n<p>外头起了风，柞树叶子哗啦啦地响。<\/p>\n<p>我躺着，数着风声，数着屋外偶尔一声两声的虫鸣，数着心里那几盏灯——<\/p>\n<p>石室里那盏白纸灯笼，亮过，又灭了。鱼哥魇里说点了四盏。老鼠男说五盏有四盏有了主。<\/p>\n<p>四。四。四。<\/p>\n<p>我数到第四遍的时候，忽然听见外头传来一声极轻的声响。<\/p>\n<p>不是风声。<\/p>\n<p>是脚步。踩在枯叶上，一步，一步，绕着院子，走过去了。<\/p>\n<p>我慢慢地、不出声地坐起来，从窗纸的破洞往外看。<\/p>\n<p>月光下，院墙外头，一个人影正沿着墙根走。他走得很慢，背有些驼，走几步，停一停，像在找什么。走到炭窑的方向，他停住了，站了一会儿，然后弯下腰——像是捡起了什么东西。<\/p>\n<p>我认不出那是谁。<\/p>\n<p>可我知道，把头撒的\"烧锅\"的饵，有人来咬钩了。<\/p>\n<p>那人直起腰，没往院里来，反倒顺着来路走了。走了几步，他忽然停下，回过头，朝院子的方向看了一眼。<\/p>\n<p>月光正好照在他脸上。<\/p>\n<p>隔着院墙，我看不清眉眼，只看见他慢慢抬起手，朝我这个方向——竖起了三根手指。<\/p>\n<p>然后他转身，消失在柞树林的黑影里。<\/p>\n<p>我僵在窗后，手心里全是汗。<\/p>\n<p>三根手指。<\/p>\n<p>王药根说过，把门人传信不用纸笔：红带子横送是封门，黑带子竖别是请。可这三根手指，跟带子、跟飘带都不是一路的——它更旧，更没头没尾，像一句只说了一半的老话。<\/p>\n<p>我没见过这种信。<\/p>\n<p>可我知道，它是冲着我来的。<\/p>\n<p>那天夜里，我把锅从桌底下拖出来，又检查了一遍麻绳，才重新躺下。天快亮的时候，豆芽仔打来电话，声音都劈了：<\/p>\n<p>\"哥！老鼠男今儿没出摊——可加油站那根路灯杆子上，挂了一盏灯笼！白纸的，糊得齐齐整整，新崭崭的，就朝着咱们雅河乡这个方向！\"<\/p>\n<p>我握着手机，望着窗外慢慢亮起来的天，一个字都说不出来。<\/p>\n<p>灯，挂出来了。<\/p>\n<p>一盏，朝着我们的方向。<\/p>\n<p>王药根说过，把门人传信不用纸笔，红黑带子是信；草帽人捎话、飘带送信，也是信。可这盏白纸灯笼，挂的不是话——是地方。<\/p>\n<p>它指着我们。<\/p>\n<p>点给山看。<\/p>\n<p>山里的账，要开始收了。<\/p>", "plain": "第二天一早，天刚蒙蒙亮，鱼哥在院里蹲着刷牙。 我端了碗粥蹲在他旁边，没头没尾地问他：\"夜里那话，你自己还记得不？\" 鱼哥的动作顿了一下，没回头：\"记得一点。\" \"记得什么？\" \"梦。\"他漱了口，把水吐进墙根的草窠里，\"梦见黑地里站着一排人，五个人，一人手里一盏灯。四个人手里的灯都亮着，火苗稳稳的，照得人脸都发亮。第五个人，手里的灯点不着——不是没火，是灯芯潮了。\" 我端着粥碗的手紧了紧：\"那第五个人，你看清脸了？\" \"没有。\"鱼哥说，\"我想凑近了看，他后头忽然伸过来一只手，把我眼睛捂住了。\"他顿了顿，\"有个声音说——'这盏，不是你的。'\" 他说完，把牙刷往缸子里一插，站起来：\"云峰，那五个人要是照着咱们屋里的数——\" \"别数了。\"我打断他。 他没再往下说。可我端着那碗粥，一口都咽不下去了。 晌午，豆芽仔从桓仁回来，一进门就灌了半缸子水，抹了把嘴：\"哥，那老鼠男，又出摊了！\" \"出摊就出摊，你跑成这样？\"我给他拉了个凳子。 \"摊子是出摊了，可不对头！\"豆芽仔压低声音，\"他那摊上，除了那些开光土豆、墨镜、破铁皮蛤蟆，多了一样东西——一盏白纸灯笼！没糊完的，竹篾骨子支棱着，糊了一半的白纸耷拉着，就搁在小马扎上。我走近了瞧，他一把就给扣在筐底下，跟防贼似的！\" 白纸灯笼。 我搁下手里的碗：\"他瞧见你了？\" \"瞧见了。\"豆芽仔说，\"他还冲我招了招手。我过去，他一句话没说，就盯着我看。看得我后脊梁发毛，我才要开口，他忽然说话了。\" \"说什么？\" \"他说——'回去告诉你们掌柜的：名分是灯芯。认下了名分，就得有人点灯。'\" 我心头一紧，面上没露：\"还有呢？\" \"还有——\"豆芽仔咽了口唾沫，\"他说，'灯会要开了。五盏灯，四盏有了主，剩一盏，看你们掌柜的点不点。'说完他就低头收拾他那些破铁皮蛤蟆，再不理我了。\" 五盏灯，四盏有了主。 我脑子里\"嗡\"的一声，跟鱼哥魇里那句话撞在了一起——\"灯点了，点了四盏了。\" 五盏里亮了四盏。剩一盏没主的。 豆芽仔不懂这里头的分量，还在絮叨：\"哥，那老头是不是脑子有毛病？什么灯芯灯会的，装神弄鬼——\" \"芽仔。\"把头从里屋出来，手里捏着半根没点的烟，\"他这话，是给咱们听的，不是给你听的。你原话带到了，就很好。\" 他走到桌边坐下，把烟搁下，冲我抬了抬下巴：\"云峰，你怎么想？\" \"我想不通的是数。\"我说，\"石室里，五口锅倒扣着，是五部。墙上写'一灯既起，五部来归；六位既满，骨城自开'——灯跟部是走的。可马渡霜又说'别接灯，灯亮一盏，走一个人'——一盏灯，是一个人的命。五盏灯跟五部、跟人，到底哪个对得上？\" \"都对得上。\"把头说，\"一个部，就是一个人的名分。五部当初立盟，一部一主，一主一灯。灯在，人在；灯灭，部绝。所以墙上那句话才说——五部来归，是把灯都点起来，让五部的人照着自己回家。\" 我慢慢地问：\"那四盏有了主——是那四部还活着的主？\" \"是。\"把头把烟点着，\"肉、米、酱、酒，四部四块银符，都叫咱们起出来了。可那是四块死人的饭符。活的灯主，是另外一路。\" 他看着我：\"云峰，你还记得那口空锅底下压的东西吗？\" \"无字阴契。\"我说。 \"对。四部有字，消奴没字。四部是死契，这空锅、这阴契——是活的。你认下它的那一夜起，消奴部这一盏灯，就挂在你名下了。\" \"那账就对不上了。\"鱼哥忽然开口。 我们都看向他。 \"五盏灯，四盏有主，一盏没主——这是老鼠男的账。\"鱼哥说，\"可咱们的账上，五部之外，石室西南角还空着一个第六位。要是五盏灯只对应五部，那个空位子算什么？要是它也算一盏灯，那就不是五盏，是六盏。\" 他顿了顿：\"他给你报的数，是教你的数，还是他数的数？\" 我一时答不上来。石室里的第六位，那块色气发乌的空地，起走了东西，也起走了名目——可那东西是什么，我们至今不知道。老周手里出来的珍珠罐，也许沾边，也许只是另一条线。 \"所以我才说，他这账，递到咱们头上，就是让咱们替他数。\"把头把烟灰磕掉，\"他自己数不清楚，才把这本糊涂账往外递。谁接过去替他一数，谁就先乱了阵脚。\" 屋里静了一瞬。 小萱端了饭进来，见我们都坐着不动，也没问，把饭菜摆好，又退了回去。 我把碗端起来，扒了两口，搁下：\"那老鼠男说剩一盏没主——他这话，是在问把头，还是在试探咱们？\" \"问，也是试探。\"把头说，\"他替山里办事，办的是数人的差。灯有几盏、谁点了、谁没点，他心里有一本账。今儿他跟你把话挑明了，明儿这本账，就该递到咱们头上来。\" \"那咱们怎么办？\" 把头抽了两口烟，忽然问了一句不相干的：\"云峰，你说，草帽人跟老鼠男，是一路的吗？\" 我想了想：\"一个守沟口，一个守大路。一个递话，一个送带子。像是两路人，可干的都是一样的事——盯着咱们。\" \"那要是一路呢？\"把头说，\"一路人，分两摊，一个唱红脸一个唱白脸：一个劝你搬锅，一个问你点灯。一个说'搬得动就快搬'，一个说'看你们掌柜的点不点'。兜来兜去，都是想把咱们往一个地方赶。\" \"往哪赶？\" 把头没答，把烟摁灭：\"咱们不能顺着他们走。明儿，我出一招——你们看戏。\" 他说的招，是\"烧锅\"。 第二天，豆芽仔照把头的吩咐，去老周店里坐了半下午，有一搭没一搭地跟老周唠：那口倒扣的陶锅，太邪性，夜里会自己翻身，吓得我们掌柜睡不着，索性一锅一罐，都架在后院烧了。烧得干干净净，灰都扬进浑江里了。 老周听得直咂舌：\"烧了好，烧了好！那东西搁着就是个祸害！\" 豆芽仔前脚走，老周后脚就把这话学给了来买烟的行商，行商又传给收破烂的，收破烂的又传给开三蹦子的——不到一天，半个桓仁都知道：雅河乡那伙收老物件的，把一口镇宅的破锅烧了。 这是把头撒出去的饵。 夜里，我照旧睡在堂屋，锅和罐就压在桌底下。我枕着那面借回来的镜子——白天我又从鱼哥那儿把镜子要了回来，守着这两样东西，总觉得心里才踏实。 外头起了风，柞树叶子哗啦啦地响。 我躺着，数着风声，数着屋外偶尔一声两声的虫鸣，数着心里那几盏灯—— 石室里那盏白纸灯笼，亮过，又灭了。鱼哥魇里说点了四盏。老鼠男说五盏有四盏有了主。 四。四。四。 我数到第四遍的时候，忽然听见外头传来一声极轻的声响。 不是风声。 是脚步。踩在枯叶上，一步，一步，绕着院子，走过去了。 我慢慢地、不出声地坐起来，从窗纸的破洞往外看。 月光下，院墙外头，一个人影正沿着墙根走。他走得很慢，背有些驼，走几步，停一停，像在找什么。走到炭窑的方向，他停住了，站了一会儿，然后弯下腰——像是捡起了什么东西。 我认不出那是谁。 可我知道，把头撒的\"烧锅\"的饵，有人来咬钩了。 那人直起腰，没往院里来，反倒顺着来路走了。走了几步，他忽然停下，回过头，朝院子的方向看了一眼。 月光正好照在他脸上。 隔着院墙，我看不清眉眼，只看见他慢慢抬起手，朝我这个方向——竖起了三根手指。 然后他转身，消失在柞树林的黑影里。 我僵在窗后，手心里全是汗。 三根手指。 王药根说过，把门人传信不用纸笔：红带子横送是封门，黑带子竖别是请。可这三根手指，跟带子、跟飘带都不是一路的——它更旧，更没头没尾，像一句只说了一半的老话。 我没见过这种信。 可我知道，它是冲着我来的。 那天夜里，我把锅从桌底下拖出来，又检查了一遍麻绳，才重新躺下。天快亮的时候，豆芽仔打来电话，声音都劈了： \"哥！老鼠男今儿没出摊——可加油站那根路灯杆子上，挂了一盏灯笼！白纸的，糊得齐齐整整，新崭崭的，就朝着咱们雅河乡这个方向！\" 我握着手机，望着窗外慢慢亮起来的天，一个字都说不出来。 灯，挂出来了。 一盏，朝着我们的方向。 王药根说过，把门人传信不用纸笔，红黑带子是信；草帽人捎话、飘带送信，也是信。可这盏白纸灯笼，挂的不是话——是地方。 它指着我们。 点给山看。 山里的账，要开始收了。"}, {"id": "A5-080", "arc": "A5", "num": 80, "title": "收账", "md": "那盏灯笼，在加油站的路灯杆子上挂了一整天。\n\n豆芽仔蹲在马路对面的修车铺里，隔着玻璃门盯了一上午，回来直揉眼睛：\"哥，没人碰它。来来往往那么多车，那么些人，就没一个人多看一眼——那东西挂在那儿，跟原本就长在上头似的。\"\n\n\"挂灯笼的人，本就没打算让人碰。\"把头说，\"那是给咱们看的。\"\n\n\"给咱们看什么？\"\n\n\"看灯会开席的地方。\"把头把地图在桌上摊开，手指点着加油站那个位置，\"老鼠男的摊在加油站，飘带也从这儿出来。可灯往雅河乡方向挂，指的不是沟口——是咱们这个方向。\"\n\n我心里一沉：\"您的意思是，挂灯的人知道咱们住哪儿？\"\n\n\"知道得比咱们还清楚。\"把头说，\"昨儿夜里，炭窑都有人去翻过了。你以为那盏灯是今早才挂的？它是挂给咱们看的——'你藏到哪儿，灯就指到哪儿。'\"\n\n屋里谁都没说话。\n\n豆芽仔最先绷不住：\"那、那咱们搬家吧！搬得远远的！\"\n\n\"搬哪儿去？\"把头抬起眼，\"飘带能送到桓仁，灯笼能挂到加油站，炭窑都有人摸过——这方圆百十里，就没有他们够不着的地方。搬家，是给人家递话：咱们怕了。\"\n\n\"那怎么办？\"\n\n\"烧锅的饵，他们已经咬过了。\"把头说，\"他们翻炭窑，没找着锅，就挂灯点地方。这说明两件事：一，他们认准锅还在咱们手里；二，他们还没摸准锅到底藏在哪儿——要不然，来的就不是一盏灯了。\"\n\n他顿了顿：\"所以，锅不能动。动了，就露了。\"\n\n午后，我们把锅从堂屋桌底下起了出来，挪到偏屋。\n\n偏屋地面是夯土，豆芽仔拿铁锹在墙根挖了个二尺深的坑，把那口锅用油布裹了三层，填土踩实，又泼了一瓢水，拿脚踩匀，扫上浮土，再搬了两麻袋土豆压在上头。从外头看，就是普普通通一间堆杂物的屋。\n\n我蹲在门口，看着豆芽仔把最后一锹土拍平，心里那股子不踏实，怎么都压不下去。\n\n这天夜里，我没睡。\n\n把头也没睡。他坐在堂屋的暗处，卷了一根又一根烟，都不点，就那么捏着。鱼哥抱着膀子，靠在门框上，耳朵支棱着，听院外的动静。豆芽仔和面打呼，小萱在偏屋的门后坐了一宿，门闩上了三道。\n\n后半夜，风停了。\n\n停得特别安静，连柞树叶子都不响了。\n\n我正觉得这安静不对劲，鱼哥忽然动了。他像只夜猫子一样直起身，冲我比了个手势——有人。\n\n我屏住呼吸，贴着窗纸往外看。\n\n院里还是空的。\n\n可偏屋那头的墙根底下，影影绰绰，蹲着一个人影。\n\n他蹲在那儿，一动不动，像一截截断的黑木头。我正要看仔细，那人影忽然动了——他直起身，扬手，往偏屋的窗根底下泼了什么。\n\n一股子煤油味，隔着院子飘过来。\n\n\"油！\"我吼了一声，撞开门就往外冲。\n\n那人影没想到屋里人醒着，手一抖，那半桶油泼了自己一裤腿。他转身就跑，我两步蹿上去，一把攥住他的后脖领子——手底下一滑，他穿着件光面的旧夹克，出溜一下就从我手里挣了出去。\n\n鱼哥从侧面截他。那人矮身一滚，从鱼哥腋下钻过去，身手利落得不像个放火的。我追到院门口，他已经被逼到墙角，再无路可退。\n\n他猛地转过身。\n\n月光底下，我头一回看清他的脸——五十来岁，瘦，颧骨高，一双眼睛又冷又亮，像两粒冻住的玻璃珠子。他盯着我，忽然咧嘴，笑了一下，露出一口黄牙。\n\n然后他抬手，把一样东西朝我砸过来。\n\n我一偏头，那东西\"当\"地砸在我身后的门板上——是一盒火柴。\n\n就这一眨眼的功夫，他脚下一蹬，踩着墙角那摞劈柴，翻上了院墙。墙外头有人接应，一只胳膊把他拽了下去。我追到墙根底下，只听见墙外一阵脚步声，踏着枯叶，飞快地远去了。墙头那一闪的功夫，我瞅见接应那人的半截肩背——压得极低，矮得邪乎。\n\n那个矮个子。\n\n我站在墙根下，大口大口喘着气。\n\n煤油味。我猛地想起来——偏屋窗根底下那把火要是点起来，偏屋烧了，二尺深土底下那口锅……\n\n我扑回偏屋，豆芽仔已经被熏醒了，正拎着水桶往墙上泼。油泼在土墙上，没引着火——那人的火柴砸在门板上，没点着。可窗台底下，我扒开浮土一看：土皮上有一道焦痕，火柴擦了一下，没擦着，就灭了。\n\n只差那么一下。\n\n我瘫坐在墙根下，后知后觉地发现自己后背全湿了。\n\n鱼哥走过来，没急着看火，先在门槛上坐下，把右手伸到灯底下。\n\n\"那人从我胳膊底下滚过去的时候，我攥住过他一把。\"他摊开手，\"他左手的小指——短了半截。从第二个指节往下，是断的。\"\n\n我后脊梁一下子凉透了。\n\n废品站。半夜来敲门那个缺了半截小指的人，鞋上沾着鹰嘴沟的黑泥，留话说\"铁是死的，锅是活的\"。都寻思他敲完那回门就没了影，原来他一直没走远——他一直在等这口锅。\n\n鱼哥把那盒火柴捡起来，在灯底下翻来覆去地看。他忽然\"咦\"了一声，把火柴盒递到我眼前。\n\n盒是普通得不能再普通的白磷火柴，可盒皮上，有人拿指甲刻了一个字。\n\n字刻得很深，笔画是反的——可反着看，分明是一个\"灭\"字。\n\n灭。\n\n我把火柴盒攥在手心里，指节捏得发白。王药根教过——红黑带子横送是封门，竖别是请。可这世上还有第三种传信的法子，不讲红黑，不讲针脚，就一个字：\n\n灭。\n\n\"不是守线的人。\"我把火柴盒递给我把头，\"守灯的人要咱们点灯，不会来放火。\"\n\n\"那这是谁？\"豆芽仔哆嗦着问。\n\n\"是另一路。\"我听见自己的声音发干，\"短信里说的'带灯的可就不止一个了'——带灯的不止一个，想要这锅的，也不止一个。有想点灯的，就有想吹灯的。吹灯的比点灯的急——因为灯一灭，名分就绝了。\"\n\n\"可咱们的灯还没点呢。\"豆芽仔说，\"名分还在——\"\n\n\"名分在不在，不由咱们说了算。\"把头开口了，\"他们烧的不是锅。是这屋里、这山里、这方圆百里，所有认得这道纹的人的念想。锅烧了，阴契还在；可阴契要没人认，就是一块废铁。他们烧的，是那个'认'字。\"\n\n我沉默了很久。\n\n那把火，差一点就点着了。要是点着了，烧掉的不是一口锅，是消奴部在人世上最后一样实打实的东西——锅在坛在。锅没了，坛就空了，空了的坛，谁都能再立一座。\n\n我把那口锅从偏屋的土里又起了出来，抱回堂屋，放在我脚边。\n\n\"把头。\"我说，\"守在这儿，不是个办法。\"\n\n\"嗯。\"\n\n\"灯会要开，有人替咱们点灯，有人要替咱们灭灯。咱们要是不去，灯一盏盏灭过去，早晚灭到咱们头上。\"\n\n\"你想去？\"\n\n\"我想去。\"我说，\"可我不想被人牵着去。守线的人要咱们点灯，咱们就偏不点；可'灭'字那一路，咱们也不能由着他灭。灯要不要点，得咱们自己说了算。\"\n\n把头看了我很久，忽然笑了一下，皱纹全堆到眼角：\"这才像句人话。\"\n\n天快亮的时候，老周的电话打了进来。\n\n他在电话里急得直跺脚：\"兄弟！五女山北坡那个护林员老陈，今儿一早托人捎话给我——说是山上那个白头发的老头，又来了！还在老地方坐着，坐了一宿！\"\n\n我握着手机，看了把头一眼。\n\n\"老陈问他等谁，他说——\"老周咽了口唾沫，\"他说，'我等的那个认字的，该到了。'\"\n\n我挂了电话，屋里静得能听见彼此的呼吸。\n\n白头发。老地方。认字的。\n\n五女山北坡，老陈的护林道口。那个传说中撒了两年货、坐了一下午等人的白头发瘦子——如今又坐了一宿，等一个\"认字的\"。\n\n我低头，看着脚边那口锅。\n\n锅沿磕口里，还沾着没擦净的千年灰土。它从石室里出来，跟我走了一路，认了我做主人。如今，有人在山那头等它，有人在这头要烧它。\n\n它到底是认字的，还是认人的？\n\n\"把头。\"我说，\"明儿，我想上五女山。\"\n\n把头没答。他弯腰，把那盒刻着\"灭\"字的火柴捡起来，揣进怀里，慢慢地开口：\n\n\"去吧。带锅去。\"\n\n\"带锅？\"\n\n\"带锅。\"他把烟点上，抽了一口，\"他们不是想看你点不点灯吗？你带着锅去，把锅往那人跟前一搁，看是点灯的来接，还是吹灯的来抢。锅到了明处，藏在暗处的人，就都得出来。\"\n\n他顿了顿，吐出一口烟：\n\n\"到时候，谁点灯、谁吹灯、谁是主人谁是客，一笔账，当场算清。\"", "words": 2993, "html": "<p>那盏灯笼，在加油站的路灯杆子上挂了一整天。<\/p>\n<p>豆芽仔蹲在马路对面的修车铺里，隔着玻璃门盯了一上午，回来直揉眼睛：\"哥，没人碰它。来来往往那么多车，那么些人，就没一个人多看一眼——那东西挂在那儿，跟原本就长在上头似的。\"<\/p>\n<p>\"挂灯笼的人，本就没打算让人碰。\"把头说，\"那是给咱们看的。\"<\/p>\n<p>\"给咱们看什么？\"<\/p>\n<p>\"看灯会开席的地方。\"把头把地图在桌上摊开，手指点着加油站那个位置，\"老鼠男的摊在加油站，飘带也从这儿出来。可灯往雅河乡方向挂，指的不是沟口——是咱们这个方向。\"<\/p>\n<p>我心里一沉：\"您的意思是，挂灯的人知道咱们住哪儿？\"<\/p>\n<p>\"知道得比咱们还清楚。\"把头说，\"昨儿夜里，炭窑都有人去翻过了。你以为那盏灯是今早才挂的？它是挂给咱们看的——'你藏到哪儿，灯就指到哪儿。'\"<\/p>\n<p>屋里谁都没说话。<\/p>\n<p>豆芽仔最先绷不住：\"那、那咱们搬家吧！搬得远远的！\"<\/p>\n<p>\"搬哪儿去？\"把头抬起眼，\"飘带能送到桓仁，灯笼能挂到加油站，炭窑都有人摸过——这方圆百十里，就没有他们够不着的地方。搬家，是给人家递话：咱们怕了。\"<\/p>\n<p>\"那怎么办？\"<\/p>\n<p>\"烧锅的饵，他们已经咬过了。\"把头说，\"他们翻炭窑，没找着锅，就挂灯点地方。这说明两件事：一，他们认准锅还在咱们手里；二，他们还没摸准锅到底藏在哪儿——要不然，来的就不是一盏灯了。\"<\/p>\n<p>他顿了顿：\"所以，锅不能动。动了，就露了。\"<\/p>\n<p>午后，我们把锅从堂屋桌底下起了出来，挪到偏屋。<\/p>\n<p>偏屋地面是夯土，豆芽仔拿铁锹在墙根挖了个二尺深的坑，把那口锅用油布裹了三层，填土踩实，又泼了一瓢水，拿脚踩匀，扫上浮土，再搬了两麻袋土豆压在上头。从外头看，就是普普通通一间堆杂物的屋。<\/p>\n<p>我蹲在门口，看着豆芽仔把最后一锹土拍平，心里那股子不踏实，怎么都压不下去。<\/p>\n<p>这天夜里，我没睡。<\/p>\n<p>把头也没睡。他坐在堂屋的暗处，卷了一根又一根烟，都不点，就那么捏着。鱼哥抱着膀子，靠在门框上，耳朵支棱着，听院外的动静。豆芽仔和面打呼，小萱在偏屋的门后坐了一宿，门闩上了三道。<\/p>\n<p>后半夜，风停了。<\/p>\n<p>停得特别安静，连柞树叶子都不响了。<\/p>\n<p>我正觉得这安静不对劲，鱼哥忽然动了。他像只夜猫子一样直起身，冲我比了个手势——有人。<\/p>\n<p>我屏住呼吸，贴着窗纸往外看。<\/p>\n<p>院里还是空的。<\/p>\n<p>可偏屋那头的墙根底下，影影绰绰，蹲着一个人影。<\/p>\n<p>他蹲在那儿，一动不动，像一截截断的黑木头。我正要看仔细，那人影忽然动了——他直起身，扬手，往偏屋的窗根底下泼了什么。<\/p>\n<p>一股子煤油味，隔着院子飘过来。<\/p>\n<p>\"油！\"我吼了一声，撞开门就往外冲。<\/p>\n<p>那人影没想到屋里人醒着，手一抖，那半桶油泼了自己一裤腿。他转身就跑，我两步蹿上去，一把攥住他的后脖领子——手底下一滑，他穿着件光面的旧夹克，出溜一下就从我手里挣了出去。<\/p>\n<p>鱼哥从侧面截他。那人矮身一滚，从鱼哥腋下钻过去，身手利落得不像个放火的。我追到院门口，他已经被逼到墙角，再无路可退。<\/p>\n<p>他猛地转过身。<\/p>\n<p>月光底下，我头一回看清他的脸——五十来岁，瘦，颧骨高，一双眼睛又冷又亮，像两粒冻住的玻璃珠子。他盯着我，忽然咧嘴，笑了一下，露出一口黄牙。<\/p>\n<p>然后他抬手，把一样东西朝我砸过来。<\/p>\n<p>我一偏头，那东西\"当\"地砸在我身后的门板上——是一盒火柴。<\/p>\n<p>就这一眨眼的功夫，他脚下一蹬，踩着墙角那摞劈柴，翻上了院墙。墙外头有人接应，一只胳膊把他拽了下去。我追到墙根底下，只听见墙外一阵脚步声，踏着枯叶，飞快地远去了。墙头那一闪的功夫，我瞅见接应那人的半截肩背——压得极低，矮得邪乎。<\/p>\n<p>那个矮个子。<\/p>\n<p>我站在墙根下，大口大口喘着气。<\/p>\n<p>煤油味。我猛地想起来——偏屋窗根底下那把火要是点起来，偏屋烧了，二尺深土底下那口锅……<\/p>\n<p>我扑回偏屋，豆芽仔已经被熏醒了，正拎着水桶往墙上泼。油泼在土墙上，没引着火——那人的火柴砸在门板上，没点着。可窗台底下，我扒开浮土一看：土皮上有一道焦痕，火柴擦了一下，没擦着，就灭了。<\/p>\n<p>只差那么一下。<\/p>\n<p>我瘫坐在墙根下，后知后觉地发现自己后背全湿了。<\/p>\n<p>鱼哥走过来，没急着看火，先在门槛上坐下，把右手伸到灯底下。<\/p>\n<p>\"那人从我胳膊底下滚过去的时候，我攥住过他一把。\"他摊开手，\"他左手的小指——短了半截。从第二个指节往下，是断的。\"<\/p>\n<p>我后脊梁一下子凉透了。<\/p>\n<p>废品站。半夜来敲门那个缺了半截小指的人，鞋上沾着鹰嘴沟的黑泥，留话说\"铁是死的，锅是活的\"。都寻思他敲完那回门就没了影，原来他一直没走远——他一直在等这口锅。<\/p>\n<p>鱼哥把那盒火柴捡起来，在灯底下翻来覆去地看。他忽然\"咦\"了一声，把火柴盒递到我眼前。<\/p>\n<p>盒是普通得不能再普通的白磷火柴，可盒皮上，有人拿指甲刻了一个字。<\/p>\n<p>字刻得很深，笔画是反的——可反着看，分明是一个\"灭\"字。<\/p>\n<p>灭。<\/p>\n<p>我把火柴盒攥在手心里，指节捏得发白。王药根教过——红黑带子横送是封门，竖别是请。可这世上还有第三种传信的法子，不讲红黑，不讲针脚，就一个字：<\/p>\n<p>灭。<\/p>\n<p>\"不是守线的人。\"我把火柴盒递给我把头，\"守灯的人要咱们点灯，不会来放火。\"<\/p>\n<p>\"那这是谁？\"豆芽仔哆嗦着问。<\/p>\n<p>\"是另一路。\"我听见自己的声音发干，\"短信里说的'带灯的可就不止一个了'——带灯的不止一个，想要这锅的，也不止一个。有想点灯的，就有想吹灯的。吹灯的比点灯的急——因为灯一灭，名分就绝了。\"<\/p>\n<p>\"可咱们的灯还没点呢。\"豆芽仔说，\"名分还在——\"<\/p>\n<p>\"名分在不在，不由咱们说了算。\"把头开口了，\"他们烧的不是锅。是这屋里、这山里、这方圆百里，所有认得这道纹的人的念想。锅烧了，阴契还在；可阴契要没人认，就是一块废铁。他们烧的，是那个'认'字。\"<\/p>\n<p>我沉默了很久。<\/p>\n<p>那把火，差一点就点着了。要是点着了，烧掉的不是一口锅，是消奴部在人世上最后一样实打实的东西——锅在坛在。锅没了，坛就空了，空了的坛，谁都能再立一座。<\/p>\n<p>我把那口锅从偏屋的土里又起了出来，抱回堂屋，放在我脚边。<\/p>\n<p>\"把头。\"我说，\"守在这儿，不是个办法。\"<\/p>\n<p>\"嗯。\"<\/p>\n<p>\"灯会要开，有人替咱们点灯，有人要替咱们灭灯。咱们要是不去，灯一盏盏灭过去，早晚灭到咱们头上。\"<\/p>\n<p>\"你想去？\"<\/p>\n<p>\"我想去。\"我说，\"可我不想被人牵着去。守线的人要咱们点灯，咱们就偏不点；可'灭'字那一路，咱们也不能由着他灭。灯要不要点，得咱们自己说了算。\"<\/p>\n<p>把头看了我很久，忽然笑了一下，皱纹全堆到眼角：\"这才像句人话。\"<\/p>\n<p>天快亮的时候，老周的电话打了进来。<\/p>\n<p>他在电话里急得直跺脚：\"兄弟！五女山北坡那个护林员老陈，今儿一早托人捎话给我——说是山上那个白头发的老头，又来了！还在老地方坐着，坐了一宿！\"<\/p>\n<p>我握着手机，看了把头一眼。<\/p>\n<p>\"老陈问他等谁，他说——\"老周咽了口唾沫，\"他说，'我等的那个认字的，该到了。'\"<\/p>\n<p>我挂了电话，屋里静得能听见彼此的呼吸。<\/p>\n<p>白头发。老地方。认字的。<\/p>\n<p>五女山北坡，老陈的护林道口。那个传说中撒了两年货、坐了一下午等人的白头发瘦子——如今又坐了一宿，等一个\"认字的\"。<\/p>\n<p>我低头，看着脚边那口锅。<\/p>\n<p>锅沿磕口里，还沾着没擦净的千年灰土。它从石室里出来，跟我走了一路，认了我做主人。如今，有人在山那头等它，有人在这头要烧它。<\/p>\n<p>它到底是认字的，还是认人的？<\/p>\n<p>\"把头。\"我说，\"明儿，我想上五女山。\"<\/p>\n<p>把头没答。他弯腰，把那盒刻着\"灭\"字的火柴捡起来，揣进怀里，慢慢地开口：<\/p>\n<p>\"去吧。带锅去。\"<\/p>\n<p>\"带锅？\"<\/p>\n<p>\"带锅。\"他把烟点上，抽了一口，\"他们不是想看你点不点灯吗？你带着锅去，把锅往那人跟前一搁，看是点灯的来接，还是吹灯的来抢。锅到了明处，藏在暗处的人，就都得出来。\"<\/p>\n<p>他顿了顿，吐出一口烟：<\/p>\n<p>\"到时候，谁点灯、谁吹灯、谁是主人谁是客，一笔账，当场算清。\"<\/p>", "plain": "那盏灯笼，在加油站的路灯杆子上挂了一整天。 豆芽仔蹲在马路对面的修车铺里，隔着玻璃门盯了一上午，回来直揉眼睛：\"哥，没人碰它。来来往往那么多车，那么些人，就没一个人多看一眼——那东西挂在那儿，跟原本就长在上头似的。\" \"挂灯笼的人，本就没打算让人碰。\"把头说，\"那是给咱们看的。\" \"给咱们看什么？\" \"看灯会开席的地方。\"把头把地图在桌上摊开，手指点着加油站那个位置，\"老鼠男的摊在加油站，飘带也从这儿出来。可灯往雅河乡方向挂，指的不是沟口——是咱们这个方向。\" 我心里一沉：\"您的意思是，挂灯的人知道咱们住哪儿？\" \"知道得比咱们还清楚。\"把头说，\"昨儿夜里，炭窑都有人去翻过了。你以为那盏灯是今早才挂的？它是挂给咱们看的——'你藏到哪儿，灯就指到哪儿。'\" 屋里谁都没说话。 豆芽仔最先绷不住：\"那、那咱们搬家吧！搬得远远的！\" \"搬哪儿去？\"把头抬起眼，\"飘带能送到桓仁，灯笼能挂到加油站，炭窑都有人摸过——这方圆百十里，就没有他们够不着的地方。搬家，是给人家递话：咱们怕了。\" \"那怎么办？\" \"烧锅的饵，他们已经咬过了。\"把头说，\"他们翻炭窑，没找着锅，就挂灯点地方。这说明两件事：一，他们认准锅还在咱们手里；二，他们还没摸准锅到底藏在哪儿——要不然，来的就不是一盏灯了。\" 他顿了顿：\"所以，锅不能动。动了，就露了。\" 午后，我们把锅从堂屋桌底下起了出来，挪到偏屋。 偏屋地面是夯土，豆芽仔拿铁锹在墙根挖了个二尺深的坑，把那口锅用油布裹了三层，填土踩实，又泼了一瓢水，拿脚踩匀，扫上浮土，再搬了两麻袋土豆压在上头。从外头看，就是普普通通一间堆杂物的屋。 我蹲在门口，看着豆芽仔把最后一锹土拍平，心里那股子不踏实，怎么都压不下去。 这天夜里，我没睡。 把头也没睡。他坐在堂屋的暗处，卷了一根又一根烟，都不点，就那么捏着。鱼哥抱着膀子，靠在门框上，耳朵支棱着，听院外的动静。豆芽仔和面打呼，小萱在偏屋的门后坐了一宿，门闩上了三道。 后半夜，风停了。 停得特别安静，连柞树叶子都不响了。 我正觉得这安静不对劲，鱼哥忽然动了。他像只夜猫子一样直起身，冲我比了个手势——有人。 我屏住呼吸，贴着窗纸往外看。 院里还是空的。 可偏屋那头的墙根底下，影影绰绰，蹲着一个人影。 他蹲在那儿，一动不动，像一截截断的黑木头。我正要看仔细，那人影忽然动了——他直起身，扬手，往偏屋的窗根底下泼了什么。 一股子煤油味，隔着院子飘过来。 \"油！\"我吼了一声，撞开门就往外冲。 那人影没想到屋里人醒着，手一抖，那半桶油泼了自己一裤腿。他转身就跑，我两步蹿上去，一把攥住他的后脖领子——手底下一滑，他穿着件光面的旧夹克，出溜一下就从我手里挣了出去。 鱼哥从侧面截他。那人矮身一滚，从鱼哥腋下钻过去，身手利落得不像个放火的。我追到院门口，他已经被逼到墙角，再无路可退。 他猛地转过身。 月光底下，我头一回看清他的脸——五十来岁，瘦，颧骨高，一双眼睛又冷又亮，像两粒冻住的玻璃珠子。他盯着我，忽然咧嘴，笑了一下，露出一口黄牙。 然后他抬手，把一样东西朝我砸过来。 我一偏头，那东西\"当\"地砸在我身后的门板上——是一盒火柴。 就这一眨眼的功夫，他脚下一蹬，踩着墙角那摞劈柴，翻上了院墙。墙外头有人接应，一只胳膊把他拽了下去。我追到墙根底下，只听见墙外一阵脚步声，踏着枯叶，飞快地远去了。墙头那一闪的功夫，我瞅见接应那人的半截肩背——压得极低，矮得邪乎。 那个矮个子。 我站在墙根下，大口大口喘着气。 煤油味。我猛地想起来——偏屋窗根底下那把火要是点起来，偏屋烧了，二尺深土底下那口锅…… 我扑回偏屋，豆芽仔已经被熏醒了，正拎着水桶往墙上泼。油泼在土墙上，没引着火——那人的火柴砸在门板上，没点着。可窗台底下，我扒开浮土一看：土皮上有一道焦痕，火柴擦了一下，没擦着，就灭了。 只差那么一下。 我瘫坐在墙根下，后知后觉地发现自己后背全湿了。 鱼哥走过来，没急着看火，先在门槛上坐下，把右手伸到灯底下。 \"那人从我胳膊底下滚过去的时候，我攥住过他一把。\"他摊开手，\"他左手的小指——短了半截。从第二个指节往下，是断的。\" 我后脊梁一下子凉透了。 废品站。半夜来敲门那个缺了半截小指的人，鞋上沾着鹰嘴沟的黑泥，留话说\"铁是死的，锅是活的\"。都寻思他敲完那回门就没了影，原来他一直没走远——他一直在等这口锅。 鱼哥把那盒火柴捡起来，在灯底下翻来覆去地看。他忽然\"咦\"了一声，把火柴盒递到我眼前。 盒是普通得不能再普通的白磷火柴，可盒皮上，有人拿指甲刻了一个字。 字刻得很深，笔画是反的——可反着看，分明是一个\"灭\"字。 灭。 我把火柴盒攥在手心里，指节捏得发白。王药根教过——红黑带子横送是封门，竖别是请。可这世上还有第三种传信的法子，不讲红黑，不讲针脚，就一个字： 灭。 \"不是守线的人。\"我把火柴盒递给我把头，\"守灯的人要咱们点灯，不会来放火。\" \"那这是谁？\"豆芽仔哆嗦着问。 \"是另一路。\"我听见自己的声音发干，\"短信里说的'带灯的可就不止一个了'——带灯的不止一个，想要这锅的，也不止一个。有想点灯的，就有想吹灯的。吹灯的比点灯的急——因为灯一灭，名分就绝了。\" \"可咱们的灯还没点呢。\"豆芽仔说，\"名分还在——\" \"名分在不在，不由咱们说了算。\"把头开口了，\"他们烧的不是锅。是这屋里、这山里、这方圆百里，所有认得这道纹的人的念想。锅烧了，阴契还在；可阴契要没人认，就是一块废铁。他们烧的，是那个'认'字。\" 我沉默了很久。 那把火，差一点就点着了。要是点着了，烧掉的不是一口锅，是消奴部在人世上最后一样实打实的东西——锅在坛在。锅没了，坛就空了，空了的坛，谁都能再立一座。 我把那口锅从偏屋的土里又起了出来，抱回堂屋，放在我脚边。 \"把头。\"我说，\"守在这儿，不是个办法。\" \"嗯。\" \"灯会要开，有人替咱们点灯，有人要替咱们灭灯。咱们要是不去，灯一盏盏灭过去，早晚灭到咱们头上。\" \"你想去？\" \"我想去。\"我说，\"可我不想被人牵着去。守线的人要咱们点灯，咱们就偏不点；可'灭'字那一路，咱们也不能由着他灭。灯要不要点，得咱们自己说了算。\" 把头看了我很久，忽然笑了一下，皱纹全堆到眼角：\"这才像句人话。\" 天快亮的时候，老周的电话打了进来。 他在电话里急得直跺脚：\"兄弟！五女山北坡那个护林员老陈，今儿一早托人捎话给我——说是山上那个白头发的老头，又来了！还在老地方坐着，坐了一宿！\" 我握着手机，看了把头一眼。 \"老陈问他等谁，他说——\"老周咽了口唾沫，\"他说，'我等的那个认字的，该到了。'\" 我挂了电话，屋里静得能听见彼此的呼吸。 白头发。老地方。认字的。 五女山北坡，老陈的护林道口。那个传说中撒了两年货、坐了一下午等人的白头发瘦子——如今又坐了一宿，等一个\"认字的\"。 我低头，看着脚边那口锅。 锅沿磕口里，还沾着没擦净的千年灰土。它从石室里出来，跟我走了一路，认了我做主人。如今，有人在山那头等它，有人在这头要烧它。 它到底是认字的，还是认人的？ \"把头。\"我说，\"明儿，我想上五女山。\" 把头没答。他弯腰，把那盒刻着\"灭\"字的火柴捡起来，揣进怀里，慢慢地开口： \"去吧。带锅去。\" \"带锅？\" \"带锅。\"他把烟点上，抽了一口，\"他们不是想看你点不点灯吗？你带着锅去，把锅往那人跟前一搁，看是点灯的来接，还是吹灯的来抢。锅到了明处，藏在暗处的人，就都得出来。\" 他顿了顿，吐出一口烟： \"到时候，谁点灯、谁吹灯、谁是主人谁是客，一笔账，当场算清。\""}, {"id": "A5-081", "arc": "A5", "num": 81, "title": "背锅", "md": "要走的那天早上，豆芽仔堵在门口，说什么也不让我把那口锅往三蹦子上绑。\n\n\"哥，你听我一句。\"他张着两条胳膊拦在车斗前，脸都急红了，\"这玩意儿往车上一搁，一路颠到五女山脚底下，路上得有多少双眼睛？昨儿后半夜还有人翻墙头呢！\"\n\n\"那你说怎么弄？\"我把麻绳往肩上一甩，\"我抱着它走二十里地？\"\n\n\"背上。\"里屋传来把头的声音。\n\n他掀帘子出来，端着半缸子热水，衣裳收拾得齐齐整整，一看就是早起要出门的样子。他把水搁在灶台上，看了那口锅一眼：\"用背架。芽仔，偏屋那两个破蜂箱板不是拆了吗？钉一副架子，拿棉被垫上。锅在背上，人才走得稳；搁在车上，是给人家递明信片。\"\n\n豆芽仔梗着脖子站了半天，闷头去钉架子了。\n\n钉架子的时候，把头把我叫到院角，捏着一根没点的烟，在指头上慢慢捻。\n\n\"上山，你只做一件事——认字。\"\n\n\"嗯。\"\n\n\"人家要看纹，你就让他看纹。人家问你名分是怎么来的，你就把石室里那一晚原原本本说一遍，一个字别添，也一个字别减。\"\n\n\"要是他问别的呢？\"\n\n\"他问别的，\"把头伸出三根手指，\"你就说一句——'这事得我们掌柜的到'。他要你点灯，你说这句；要你画押写字，你说这句；他要把镜子收回去，你也说这句。\"\n\n我忍不住笑了一下：\"那我不成复读机了？\"\n\n\"你现在是块招牌。\"把头也笑了，笑纹堆在眼角，\"招牌不能自己开口谈价钱。谈价钱的事，归我。\"\n\n我把笑收了：\"你呢？你上不上山？\"\n\n\"我先去桓仁见个人。\"他说，\"天黑前赶到台子上。你先去，把地方踩熟，把话听全。要是那人只肯等'认字的'，你就先做你的认字的。\"\n\n他顿了顿，又补一句：\"小萱和那只罐子，我另有安置，你不用惦记。文斌跟你去。\"\n\n鱼哥在门口蹲着，把老避龙塞进一个布兜里，背在身后，站起来拍了拍手上的土：\"走。\"\n\n三蹦子把我们送到山根底下的伐木道口，剩下的路，得靠两条腿。\n\n我背着那口锅走在前头。锅在背上，比抱在怀里沉，也比抱在怀里稳当——布裹着，绳勒着，走一步，它在背上轻轻磕一下，像有人拿指节在后头点我。我心里明白，这一趟我背的不光是一口锅。从鹰嘴沟石室里把它抱出来那天起，我就不是个分东西的人了。名分这东西，看不见摸不着，可它跟这口锅一样，上了背，就下不来了。\n\n五女山的北坡，跟我们进过的鹰嘴沟不是一路气象。鹰嘴沟是往地缝里钻，越走越黑；五女山是往石头顶上爬，越走越亮。半坡上全是松树和柞树，风一过，树梢哗啦啦响，跟流水似的。抬头看，青灰色的石崖一层压一层，像谁拿刀在山身上削出来的台阶。\n\n护林道在半山腰断了头，断头处有一间木头搭的小屋，门口挂着一块掉了漆的木牌。\n\n老陈就是在那儿等着我们的。\n\n他六十来岁，黑红脸膛，眼窝深，穿一件洗得发白的护林员制服，手里拎着个搪瓷缸子。他先打量我背上的锅，又打量了鱼哥一眼，才开口，声音不高：\"你们就是找石台的？\"\n\n\"大叔，您怎么知道？\"我问。\n\n\"昨儿有个瘦高个也来问过。\"老陈把缸子搁在窗台上，\"我瞅你们一个背锅，一个背兜，也是奔那地方去的。\"\n\n我跟鱼哥对了个眼神，谁都没接话。\n\n老陈领我们往坡上走，一边走一边说：\"我在这个坡上守了六年。那老头，我见他不下四十回。\"\n\n\"白头发那个？\"\n\n\"嗯。\"老陈脚步不停，\"头两年没个准时候，这两年专挑四月来。一来就在那头石台上坐着，一坐一下午，日头偏西就走。他从不进我这屋，不喝我一口水，不问路。上山的人，不带水不拄棍，走得比兔子还稳当。\"\n\n他停了一下，回头看我们：\"他还不叫人看脸。有一回我端缸子过去想招呼一声，他听见脚步就站起来了，背对着我往石台后头退。打那以后，我就再没往他跟前凑过。\"\n\n我心里一动：\"他每回上山，手里空着？\"\n\n\"不空。\"老陈说，\"每回来，都攥着个手巾包，鼓鼓囊囊的。走的时候，那手巾就瘪了。\"\n\n鼓鼓囊囊地来，瘪着走。东西留在了山上。\n\n\"那手巾包的什么，您瞧见过没有？\"\n\n\"没瞧见。\"老陈摇头，\"就有一回，他走在我前头，手巾角没掖严，掉出来一小撮东西，白花花的，像石灰面儿。他回头一把就攥住了，攥得挺急。\"\n\n白花花的，像石灰面儿。\n\n我把这句记在心里，没往深里想。那时候我还不知道，这一点点白面儿，后头会牵出多长一条线。\n\n往上走的路越来越陡，老陈走在前头，脚步稳当，嘴里有一搭没一搭地念叨。我问他，那老头下山往哪边走。\n\n\"哪边都有。\"老陈说，\"有时候顺獾子道，有时候干脆顺着西边那片崖壁往下溜。有一回下大雨，我当他不来了，晌午去看，他还在台上坐着，浑身淋得透透的，怀里抱着个手巾包，护得严严实实。我喊他进屋躲躲，他不理我，就那么坐着。\"\n\n\"雨停了才走？\"\n\n\"雨停了才走。\"老陈说，\"走的时候，台子上湿漉漉一片，就他坐的那块石头，是干的。\"\n\n我后背上一阵发凉，没接话。\n\n石台在半坡往上的一处平坳里。\n\n一片青石墁的地面，丈把见方，四边被年月磨得圆润，像一块被人坐熟了的炕沿。台边垒着三五个石头堆，当地人管它叫\"压山石\"，说是进山的人添一块，山就记一分情。台后头立着一棵歪脖老榆，树干拧成麻花，往北坡的崖壁上斜斜地探过去。站在台上往下看，是一片黑压压的林子；往上看，是五女山那道青石崖。\n\n老陈管这地方叫\"扣锅台\"。\n\n\"老辈人说，\"他把缸子往台沿上一搁，\"早年间山里有规矩。谁家要在山上立个名分，就拿锅倒扣在台上。扣满五口，山就认了。后来没人扣了，台上那圈印子，倒留下来了。\"\n\n我蹲下去看。\n\n台心正中，果然有一个浅浅的圆印，碗口大小，颜色比四周深一圈，像谁拿热锅底在那儿烙过。\n\n我把背上的锅解下来，抱着，拿锅底往那圆印上一比。\n\n严丝合缝。\n\n锅底那一圈足，正好落在印子里，不多一分，不少一分。我心里\"咯噔\"一下，抬头看鱼哥。他也蹲下来，伸手在印子边上摸了摸，没说话。\n\n再细看，那印子里头，还叠着一圈更浅的、更大一点儿的痕。浅浅一层，要不是日头斜着照，根本看不出来。\n\n台上，先前还扣过一口锅。一口比我这口更大的锅。\n\n鱼哥站起来，绕着台子走了一圈。他蹲在台边那几个压山石堆跟前，一块一块看过去，忽然说：\"这堆石头，底下的土是松的。\"\n\n\"什么意思？\"\n\n\"新添的。\"他说，\"不是一年两年，是近来。添石头的人，还不止一个。\"\n\n我心里记了一笔。进山添一块石头，是当地人许愿的老规矩。可这台上平常没人来——那这些石头，是谁添的？\n\n\"扣锅台，扣锅台。\"鱼哥站起身，拍了拍手上的土，只说了半句，\"这名字，起得实在。\"\n\n天擦黑，我们在台下的林子里歇脚，没敢生火。\n\n老陈早下山了，临走留下一句话：\"夜里要是有动静，别硬来，往我那屋退。这坡上除了我，没人管得着你们。\"\n\n前半夜，鱼哥守头一更，我裹着防雨布靠在老榆树根上打盹。老避龙蹲在布兜里，一声不吭。\n\n我睡不着，靠着树干听鱼哥有一搭没一搭地说话。他说他师傅当年教他练拳，头一句就是\"站桩要站得住，甭管外头刮什么风\"。他说这话的时候，眼睛盯着台子底下那片黑林子，我知道，他这是说给我听的。\n\n后半夜，它忽然扑腾了一下。\n\n鱼哥一把捏住鸡嘴，冲我抬了抬下巴。\n\n我顺着他的目光看下去——护林道尽头那片林子里，有两个影子，一前一后往上走。\n\n前头那个矮得邪乎，走在石阶上，几乎贴着地皮；后头那个瘦高，走得不快，却一步不落。两人到了台边，矮个蹲下去，拿手掌在台面上抹了一圈，又凑近了看那圆印子。瘦高的站在台角，四下里望。\n\n风里飘过来两句听不清的话。矮个起身，走到台角那堆压山石跟前，搬开最上头一块石头，又原样摆了回去。\n\n摆完了，两人没上台阶，顺着坡往下，一转眼就没了。\n\n等那两点影子彻底化进林子，我才蹑手蹑脚地摸到台角。\n\n那块石头，还压在原处。可我把它翻过来一看——底下是新土。\n\n他们不是来搬石头的。他们是来认地方的。搬开又摆上，是给自己留的路标。\n\n\"还要来。\"鱼哥在我背后低声说。\n\n我没答话。我把石头照原样摆回去，退了两步，站在台上，往那两条人下去的方向看。\n\n就在这时候，坡下那条獾子道尽头，慢慢亮起了一点光。\n\n不是火把，也不是手电。是一盏没罩子的油灯。火苗很小，黄黄的，就那么一点，却走得极稳——不快不慢，一层一层，顺着山道往上抬。\n\n风从沟里往上灌，林子哗啦啦地响。\n\n那点火苗，一动都不动。", "words": 3193, "html": "<p>要走的那天早上，豆芽仔堵在门口，说什么也不让我把那口锅往三蹦子上绑。<\/p>\n<p>\"哥，你听我一句。\"他张着两条胳膊拦在车斗前，脸都急红了，\"这玩意儿往车上一搁，一路颠到五女山脚底下，路上得有多少双眼睛？昨儿后半夜还有人翻墙头呢！\"<\/p>\n<p>\"那你说怎么弄？\"我把麻绳往肩上一甩，\"我抱着它走二十里地？\"<\/p>\n<p>\"背上。\"里屋传来把头的声音。<\/p>\n<p>他掀帘子出来，端着半缸子热水，衣裳收拾得齐齐整整，一看就是早起要出门的样子。他把水搁在灶台上，看了那口锅一眼：\"用背架。芽仔，偏屋那两个破蜂箱板不是拆了吗？钉一副架子，拿棉被垫上。锅在背上，人才走得稳；搁在车上，是给人家递明信片。\"<\/p>\n<p>豆芽仔梗着脖子站了半天，闷头去钉架子了。<\/p>\n<p>钉架子的时候，把头把我叫到院角，捏着一根没点的烟，在指头上慢慢捻。<\/p>\n<p>\"上山，你只做一件事——认字。\"<\/p>\n<p>\"嗯。\"<\/p>\n<p>\"人家要看纹，你就让他看纹。人家问你名分是怎么来的，你就把石室里那一晚原原本本说一遍，一个字别添，也一个字别减。\"<\/p>\n<p>\"要是他问别的呢？\"<\/p>\n<p>\"他问别的，\"把头伸出三根手指，\"你就说一句——'这事得我们掌柜的到'。他要你点灯，你说这句；要你画押写字，你说这句；他要把镜子收回去，你也说这句。\"<\/p>\n<p>我忍不住笑了一下：\"那我不成复读机了？\"<\/p>\n<p>\"你现在是块招牌。\"把头也笑了，笑纹堆在眼角，\"招牌不能自己开口谈价钱。谈价钱的事，归我。\"<\/p>\n<p>我把笑收了：\"你呢？你上不上山？\"<\/p>\n<p>\"我先去桓仁见个人。\"他说，\"天黑前赶到台子上。你先去，把地方踩熟，把话听全。要是那人只肯等'认字的'，你就先做你的认字的。\"<\/p>\n<p>他顿了顿，又补一句：\"小萱和那只罐子，我另有安置，你不用惦记。文斌跟你去。\"<\/p>\n<p>鱼哥在门口蹲着，把老避龙塞进一个布兜里，背在身后，站起来拍了拍手上的土：\"走。\"<\/p>\n<p>三蹦子把我们送到山根底下的伐木道口，剩下的路，得靠两条腿。<\/p>\n<p>我背着那口锅走在前头。锅在背上，比抱在怀里沉，也比抱在怀里稳当——布裹着，绳勒着，走一步，它在背上轻轻磕一下，像有人拿指节在后头点我。我心里明白，这一趟我背的不光是一口锅。从鹰嘴沟石室里把它抱出来那天起，我就不是个分东西的人了。名分这东西，看不见摸不着，可它跟这口锅一样，上了背，就下不来了。<\/p>\n<p>五女山的北坡，跟我们进过的鹰嘴沟不是一路气象。鹰嘴沟是往地缝里钻，越走越黑；五女山是往石头顶上爬，越走越亮。半坡上全是松树和柞树，风一过，树梢哗啦啦响，跟流水似的。抬头看，青灰色的石崖一层压一层，像谁拿刀在山身上削出来的台阶。<\/p>\n<p>护林道在半山腰断了头，断头处有一间木头搭的小屋，门口挂着一块掉了漆的木牌。<\/p>\n<p>老陈就是在那儿等着我们的。<\/p>\n<p>他六十来岁，黑红脸膛，眼窝深，穿一件洗得发白的护林员制服，手里拎着个搪瓷缸子。他先打量我背上的锅，又打量了鱼哥一眼，才开口，声音不高：\"你们就是找石台的？\"<\/p>\n<p>\"大叔，您怎么知道？\"我问。<\/p>\n<p>\"昨儿有个瘦高个也来问过。\"老陈把缸子搁在窗台上，\"我瞅你们一个背锅，一个背兜，也是奔那地方去的。\"<\/p>\n<p>我跟鱼哥对了个眼神，谁都没接话。<\/p>\n<p>老陈领我们往坡上走，一边走一边说：\"我在这个坡上守了六年。那老头，我见他不下四十回。\"<\/p>\n<p>\"白头发那个？\"<\/p>\n<p>\"嗯。\"老陈脚步不停，\"头两年没个准时候，这两年专挑四月来。一来就在那头石台上坐着，一坐一下午，日头偏西就走。他从不进我这屋，不喝我一口水，不问路。上山的人，不带水不拄棍，走得比兔子还稳当。\"<\/p>\n<p>他停了一下，回头看我们：\"他还不叫人看脸。有一回我端缸子过去想招呼一声，他听见脚步就站起来了，背对着我往石台后头退。打那以后，我就再没往他跟前凑过。\"<\/p>\n<p>我心里一动：\"他每回上山，手里空着？\"<\/p>\n<p>\"不空。\"老陈说，\"每回来，都攥着个手巾包，鼓鼓囊囊的。走的时候，那手巾就瘪了。\"<\/p>\n<p>鼓鼓囊囊地来，瘪着走。东西留在了山上。<\/p>\n<p>\"那手巾包的什么，您瞧见过没有？\"<\/p>\n<p>\"没瞧见。\"老陈摇头，\"就有一回，他走在我前头，手巾角没掖严，掉出来一小撮东西，白花花的，像石灰面儿。他回头一把就攥住了，攥得挺急。\"<\/p>\n<p>白花花的，像石灰面儿。<\/p>\n<p>我把这句记在心里，没往深里想。那时候我还不知道，这一点点白面儿，后头会牵出多长一条线。<\/p>\n<p>往上走的路越来越陡，老陈走在前头，脚步稳当，嘴里有一搭没一搭地念叨。我问他，那老头下山往哪边走。<\/p>\n<p>\"哪边都有。\"老陈说，\"有时候顺獾子道，有时候干脆顺着西边那片崖壁往下溜。有一回下大雨，我当他不来了，晌午去看，他还在台上坐着，浑身淋得透透的，怀里抱着个手巾包，护得严严实实。我喊他进屋躲躲，他不理我，就那么坐着。\"<\/p>\n<p>\"雨停了才走？\"<\/p>\n<p>\"雨停了才走。\"老陈说，\"走的时候，台子上湿漉漉一片，就他坐的那块石头，是干的。\"<\/p>\n<p>我后背上一阵发凉，没接话。<\/p>\n<p>石台在半坡往上的一处平坳里。<\/p>\n<p>一片青石墁的地面，丈把见方，四边被年月磨得圆润，像一块被人坐熟了的炕沿。台边垒着三五个石头堆，当地人管它叫\"压山石\"，说是进山的人添一块，山就记一分情。台后头立着一棵歪脖老榆，树干拧成麻花，往北坡的崖壁上斜斜地探过去。站在台上往下看，是一片黑压压的林子；往上看，是五女山那道青石崖。<\/p>\n<p>老陈管这地方叫\"扣锅台\"。<\/p>\n<p>\"老辈人说，\"他把缸子往台沿上一搁，\"早年间山里有规矩。谁家要在山上立个名分，就拿锅倒扣在台上。扣满五口，山就认了。后来没人扣了，台上那圈印子，倒留下来了。\"<\/p>\n<p>我蹲下去看。<\/p>\n<p>台心正中，果然有一个浅浅的圆印，碗口大小，颜色比四周深一圈，像谁拿热锅底在那儿烙过。<\/p>\n<p>我把背上的锅解下来，抱着，拿锅底往那圆印上一比。<\/p>\n<p>严丝合缝。<\/p>\n<p>锅底那一圈足，正好落在印子里，不多一分，不少一分。我心里\"咯噔\"一下，抬头看鱼哥。他也蹲下来，伸手在印子边上摸了摸，没说话。<\/p>\n<p>再细看，那印子里头，还叠着一圈更浅的、更大一点儿的痕。浅浅一层，要不是日头斜着照，根本看不出来。<\/p>\n<p>台上，先前还扣过一口锅。一口比我这口更大的锅。<\/p>\n<p>鱼哥站起来，绕着台子走了一圈。他蹲在台边那几个压山石堆跟前，一块一块看过去，忽然说：\"这堆石头，底下的土是松的。\"<\/p>\n<p>\"什么意思？\"<\/p>\n<p>\"新添的。\"他说，\"不是一年两年，是近来。添石头的人，还不止一个。\"<\/p>\n<p>我心里记了一笔。进山添一块石头，是当地人许愿的老规矩。可这台上平常没人来——那这些石头，是谁添的？<\/p>\n<p>\"扣锅台，扣锅台。\"鱼哥站起身，拍了拍手上的土，只说了半句，\"这名字，起得实在。\"<\/p>\n<p>天擦黑，我们在台下的林子里歇脚，没敢生火。<\/p>\n<p>老陈早下山了，临走留下一句话：\"夜里要是有动静，别硬来，往我那屋退。这坡上除了我，没人管得着你们。\"<\/p>\n<p>前半夜，鱼哥守头一更，我裹着防雨布靠在老榆树根上打盹。老避龙蹲在布兜里，一声不吭。<\/p>\n<p>我睡不着，靠着树干听鱼哥有一搭没一搭地说话。他说他师傅当年教他练拳，头一句就是\"站桩要站得住，甭管外头刮什么风\"。他说这话的时候，眼睛盯着台子底下那片黑林子，我知道，他这是说给我听的。<\/p>\n<p>后半夜，它忽然扑腾了一下。<\/p>\n<p>鱼哥一把捏住鸡嘴，冲我抬了抬下巴。<\/p>\n<p>我顺着他的目光看下去——护林道尽头那片林子里，有两个影子，一前一后往上走。<\/p>\n<p>前头那个矮得邪乎，走在石阶上，几乎贴着地皮；后头那个瘦高，走得不快，却一步不落。两人到了台边，矮个蹲下去，拿手掌在台面上抹了一圈，又凑近了看那圆印子。瘦高的站在台角，四下里望。<\/p>\n<p>风里飘过来两句听不清的话。矮个起身，走到台角那堆压山石跟前，搬开最上头一块石头，又原样摆了回去。<\/p>\n<p>摆完了，两人没上台阶，顺着坡往下，一转眼就没了。<\/p>\n<p>等那两点影子彻底化进林子，我才蹑手蹑脚地摸到台角。<\/p>\n<p>那块石头，还压在原处。可我把它翻过来一看——底下是新土。<\/p>\n<p>他们不是来搬石头的。他们是来认地方的。搬开又摆上，是给自己留的路标。<\/p>\n<p>\"还要来。\"鱼哥在我背后低声说。<\/p>\n<p>我没答话。我把石头照原样摆回去，退了两步，站在台上，往那两条人下去的方向看。<\/p>\n<p>就在这时候，坡下那条獾子道尽头，慢慢亮起了一点光。<\/p>\n<p>不是火把，也不是手电。是一盏没罩子的油灯。火苗很小，黄黄的，就那么一点，却走得极稳——不快不慢，一层一层，顺着山道往上抬。<\/p>\n<p>风从沟里往上灌，林子哗啦啦地响。<\/p>\n<p>那点火苗，一动都不动。<\/p>", "plain": "要走的那天早上，豆芽仔堵在门口，说什么也不让我把那口锅往三蹦子上绑。 \"哥，你听我一句。\"他张着两条胳膊拦在车斗前，脸都急红了，\"这玩意儿往车上一搁，一路颠到五女山脚底下，路上得有多少双眼睛？昨儿后半夜还有人翻墙头呢！\" \"那你说怎么弄？\"我把麻绳往肩上一甩，\"我抱着它走二十里地？\" \"背上。\"里屋传来把头的声音。 他掀帘子出来，端着半缸子热水，衣裳收拾得齐齐整整，一看就是早起要出门的样子。他把水搁在灶台上，看了那口锅一眼：\"用背架。芽仔，偏屋那两个破蜂箱板不是拆了吗？钉一副架子，拿棉被垫上。锅在背上，人才走得稳；搁在车上，是给人家递明信片。\" 豆芽仔梗着脖子站了半天，闷头去钉架子了。 钉架子的时候，把头把我叫到院角，捏着一根没点的烟，在指头上慢慢捻。 \"上山，你只做一件事——认字。\" \"嗯。\" \"人家要看纹，你就让他看纹。人家问你名分是怎么来的，你就把石室里那一晚原原本本说一遍，一个字别添，也一个字别减。\" \"要是他问别的呢？\" \"他问别的，\"把头伸出三根手指，\"你就说一句——'这事得我们掌柜的到'。他要你点灯，你说这句；要你画押写字，你说这句；他要把镜子收回去，你也说这句。\" 我忍不住笑了一下：\"那我不成复读机了？\" \"你现在是块招牌。\"把头也笑了，笑纹堆在眼角，\"招牌不能自己开口谈价钱。谈价钱的事，归我。\" 我把笑收了：\"你呢？你上不上山？\" \"我先去桓仁见个人。\"他说，\"天黑前赶到台子上。你先去，把地方踩熟，把话听全。要是那人只肯等'认字的'，你就先做你的认字的。\" 他顿了顿，又补一句：\"小萱和那只罐子，我另有安置，你不用惦记。文斌跟你去。\" 鱼哥在门口蹲着，把老避龙塞进一个布兜里，背在身后，站起来拍了拍手上的土：\"走。\" 三蹦子把我们送到山根底下的伐木道口，剩下的路，得靠两条腿。 我背着那口锅走在前头。锅在背上，比抱在怀里沉，也比抱在怀里稳当——布裹着，绳勒着，走一步，它在背上轻轻磕一下，像有人拿指节在后头点我。我心里明白，这一趟我背的不光是一口锅。从鹰嘴沟石室里把它抱出来那天起，我就不是个分东西的人了。名分这东西，看不见摸不着，可它跟这口锅一样，上了背，就下不来了。 五女山的北坡，跟我们进过的鹰嘴沟不是一路气象。鹰嘴沟是往地缝里钻，越走越黑；五女山是往石头顶上爬，越走越亮。半坡上全是松树和柞树，风一过，树梢哗啦啦响，跟流水似的。抬头看，青灰色的石崖一层压一层，像谁拿刀在山身上削出来的台阶。 护林道在半山腰断了头，断头处有一间木头搭的小屋，门口挂着一块掉了漆的木牌。 老陈就是在那儿等着我们的。 他六十来岁，黑红脸膛，眼窝深，穿一件洗得发白的护林员制服，手里拎着个搪瓷缸子。他先打量我背上的锅，又打量了鱼哥一眼，才开口，声音不高：\"你们就是找石台的？\" \"大叔，您怎么知道？\"我问。 \"昨儿有个瘦高个也来问过。\"老陈把缸子搁在窗台上，\"我瞅你们一个背锅，一个背兜，也是奔那地方去的。\" 我跟鱼哥对了个眼神，谁都没接话。 老陈领我们往坡上走，一边走一边说：\"我在这个坡上守了六年。那老头，我见他不下四十回。\" \"白头发那个？\" \"嗯。\"老陈脚步不停，\"头两年没个准时候，这两年专挑四月来。一来就在那头石台上坐着，一坐一下午，日头偏西就走。他从不进我这屋，不喝我一口水，不问路。上山的人，不带水不拄棍，走得比兔子还稳当。\" 他停了一下，回头看我们：\"他还不叫人看脸。有一回我端缸子过去想招呼一声，他听见脚步就站起来了，背对着我往石台后头退。打那以后，我就再没往他跟前凑过。\" 我心里一动：\"他每回上山，手里空着？\" \"不空。\"老陈说，\"每回来，都攥着个手巾包，鼓鼓囊囊的。走的时候，那手巾就瘪了。\" 鼓鼓囊囊地来，瘪着走。东西留在了山上。 \"那手巾包的什么，您瞧见过没有？\" \"没瞧见。\"老陈摇头，\"就有一回，他走在我前头，手巾角没掖严，掉出来一小撮东西，白花花的，像石灰面儿。他回头一把就攥住了，攥得挺急。\" 白花花的，像石灰面儿。 我把这句记在心里，没往深里想。那时候我还不知道，这一点点白面儿，后头会牵出多长一条线。 往上走的路越来越陡，老陈走在前头，脚步稳当，嘴里有一搭没一搭地念叨。我问他，那老头下山往哪边走。 \"哪边都有。\"老陈说，\"有时候顺獾子道，有时候干脆顺着西边那片崖壁往下溜。有一回下大雨，我当他不来了，晌午去看，他还在台上坐着，浑身淋得透透的，怀里抱着个手巾包，护得严严实实。我喊他进屋躲躲，他不理我，就那么坐着。\" \"雨停了才走？\" \"雨停了才走。\"老陈说，\"走的时候，台子上湿漉漉一片，就他坐的那块石头，是干的。\" 我后背上一阵发凉，没接话。 石台在半坡往上的一处平坳里。 一片青石墁的地面，丈把见方，四边被年月磨得圆润，像一块被人坐熟了的炕沿。台边垒着三五个石头堆，当地人管它叫\"压山石\"，说是进山的人添一块，山就记一分情。台后头立着一棵歪脖老榆，树干拧成麻花，往北坡的崖壁上斜斜地探过去。站在台上往下看，是一片黑压压的林子；往上看，是五女山那道青石崖。 老陈管这地方叫\"扣锅台\"。 \"老辈人说，\"他把缸子往台沿上一搁，\"早年间山里有规矩。谁家要在山上立个名分，就拿锅倒扣在台上。扣满五口，山就认了。后来没人扣了，台上那圈印子，倒留下来了。\" 我蹲下去看。 台心正中，果然有一个浅浅的圆印，碗口大小，颜色比四周深一圈，像谁拿热锅底在那儿烙过。 我把背上的锅解下来，抱着，拿锅底往那圆印上一比。 严丝合缝。 锅底那一圈足，正好落在印子里，不多一分，不少一分。我心里\"咯噔\"一下，抬头看鱼哥。他也蹲下来，伸手在印子边上摸了摸，没说话。 再细看，那印子里头，还叠着一圈更浅的、更大一点儿的痕。浅浅一层，要不是日头斜着照，根本看不出来。 台上，先前还扣过一口锅。一口比我这口更大的锅。 鱼哥站起来，绕着台子走了一圈。他蹲在台边那几个压山石堆跟前，一块一块看过去，忽然说：\"这堆石头，底下的土是松的。\" \"什么意思？\" \"新添的。\"他说，\"不是一年两年，是近来。添石头的人，还不止一个。\" 我心里记了一笔。进山添一块石头，是当地人许愿的老规矩。可这台上平常没人来——那这些石头，是谁添的？ \"扣锅台，扣锅台。\"鱼哥站起身，拍了拍手上的土，只说了半句，\"这名字，起得实在。\" 天擦黑，我们在台下的林子里歇脚，没敢生火。 老陈早下山了，临走留下一句话：\"夜里要是有动静，别硬来，往我那屋退。这坡上除了我，没人管得着你们。\" 前半夜，鱼哥守头一更，我裹着防雨布靠在老榆树根上打盹。老避龙蹲在布兜里，一声不吭。 我睡不着，靠着树干听鱼哥有一搭没一搭地说话。他说他师傅当年教他练拳，头一句就是\"站桩要站得住，甭管外头刮什么风\"。他说这话的时候，眼睛盯着台子底下那片黑林子，我知道，他这是说给我听的。 后半夜，它忽然扑腾了一下。 鱼哥一把捏住鸡嘴，冲我抬了抬下巴。 我顺着他的目光看下去——护林道尽头那片林子里，有两个影子，一前一后往上走。 前头那个矮得邪乎，走在石阶上，几乎贴着地皮；后头那个瘦高，走得不快，却一步不落。两人到了台边，矮个蹲下去，拿手掌在台面上抹了一圈，又凑近了看那圆印子。瘦高的站在台角，四下里望。 风里飘过来两句听不清的话。矮个起身，走到台角那堆压山石跟前，搬开最上头一块石头，又原样摆了回去。 摆完了，两人没上台阶，顺着坡往下，一转眼就没了。 等那两点影子彻底化进林子，我才蹑手蹑脚地摸到台角。 那块石头，还压在原处。可我把它翻过来一看——底下是新土。 他们不是来搬石头的。他们是来认地方的。搬开又摆上，是给自己留的路标。 \"还要来。\"鱼哥在我背后低声说。 我没答话。我把石头照原样摆回去，退了两步，站在台上，往那两条人下去的方向看。 就在这时候，坡下那条獾子道尽头，慢慢亮起了一点光。 不是火把，也不是手电。是一盏没罩子的油灯。火苗很小，黄黄的，就那么一点，却走得极稳——不快不慢，一层一层，顺着山道往上抬。 风从沟里往上灌，林子哗啦啦地响。 那点火苗，一动都不动。"}, {"id": "A5-082", "arc": "A5", "num": 82, "title": "问灯", "md": "那盏灯上来得很慢。\n\n我跟鱼哥退到台子东边的老榆树后头，贴着树干看。来人走得不快，可脚下没有一点声音——枯叶、碎石、树根，他踩过去，跟踩在水面上一样。到了台下，他把灯往台沿上一搁，自己也在台边那块平石头上坐下了，背对着我们，一头白发在灯苗底下泛着灰。\n\n灰褂子。瘦。肩膀薄得像两块板。\n\n他没回头，也没四下看，就那么坐着，抽出一根烟，凑着灯苗点着。烟头的红点一明一灭，是东北烤烟那股子冲味。\n\n我攥着照魇镜的手心里全是汗。\n\n\"背锅的。\"他忽然开口，声音不高，带着点痰音，\"把锅扣上去。\"\n\n我心里一紧。他知道我们在这儿。他早知道。\n\n\"扣锅？\"\n\n\"扣。\"他说，\"口朝下。\"\n\n我看了鱼哥一眼。鱼哥没拦我，只把老避龙的布兜往怀里抱了抱，退到了榆树外头去。我抱着锅走到台心，蹲下，把那口锅端起来，慢慢翻了个个儿——\n\n锅口朝下，扣在台上。\n\n锅底冲上，露着那圈被我擦出来的鱼尾纹。灯苗的光落在上面，一深一浅两道刻痕，像水里游过去的一条鱼，尾巴还在。\n\n锅一落台，我手心里就空了一下。\n\n那口锅在台上扣得极稳，稳得不像是我摆上去的，倒像它自己寻着了地方。台心的圆印跟锅底严丝合缝，扣上去那一瞬，我心里\"咔\"地响了一声，像一把锁落进了锁眼。\n\n老头抽着烟，没看我，也没看锅，只看着台子底下那片黑林子。半晌，他才问：\"擦过没有？\"\n\n\"擦过。\"\n\n\"谁教你擦的？\"\n\n\"没人教。\"我说，\"灰厚，我顺手擦的。\"\n\n\"顺手。\"他把这两个字在嘴里嚼了一遍，\"不是顺手。是锅认你。别人的手摸上去，是一层灰；你的手摸上去，是一道纹。锅这东西，认手。\"\n\n我没接话。台子上风小，灯苗一动不动。\n\n\"你身上，有几样守字的东西？\"他又问。\n\n我想了想，把照魇镜从怀里掏出来，又把阴契从贴身的衣兜里摸出来，托在手里：\"镜子背上有'守'字。契是素面的，没字。\"\n\n\"镜子给我看。\"\n\n我把镜子递过去。他没接，只侧过头，就着灯苗看了一眼镜背，点点头：\"镜是眼。\"\n\n\"罐子上的纹，你见过了？\"\n\n\"见过。\"我说，\"圈足内侧，一深一浅，是刻了又磨的。\"\n\n\"罐是口。\"\n\n\"锅呢？\"\n\n\"锅是肚。\"他抬手，虚虚地朝台心一指，\"你扣着的那口，就是肚。\"\n\n我心里数了数：镜、罐、锅，三样。正要开口，他先说了：\"四样。\"\n\n\"哪来的四样？\"\n\n\"你自己看。\"他下巴朝我手里一抬，\"契。\"\n\n我把阴契凑到灯苗底下，斜着翻了几个角度。前几次看，那银符都是素面，光溜溜的。可这回，灯苗贴着边角照过去，符牌的右下角，隐隐浮出一道极浅的鱼尾印子——\n\n不是刻的。是拿模子压的。浅得几乎看不出，只有在灯苗斜着燎过去的时候，才显一显。\n\n我后脊梁上像被人浇了一瓢凉水。\n\n\"压的。\"我声音有点发干，\"跟刻的不一样。\"\n\n\"刻的是明账，压的是暗账。\"老头把烟头在石头上按灭，\"镜是眼，罐是口，锅是肚，契是名。四样凑齐了，一个人才算立得住。\"\n\n我把阴契和镜子一样一样收好，手心还是湿的。\n\n\"还有一样。\"我说，\"我们掌柜的让我先来，是把话说全。\"\n\n\"说。\"\n\n我就把鹰嘴沟石室里那一晚，捡要紧的说了。五口锅倒扣着，西南空一个位子，第五块素面无字的银符，还有北墙根那只白纸灯笼。我一句一句说，没添没减。\n\n老头一直没插话，等我说完，才慢慢开口：\"五口扣着，缺一口。那缺的一口，就是空出来的那一口。\"\n\n\"是消奴部？\"\n\n\"是你手里这口。\"他下巴朝台心一抬，\"你们把它从沟里背出来，那个位子就空了。空位子，山记得住。\"\n\n我心里一沉。原来我们取锅那一趟，不是从石室里搬走一样东西，是给那间石室留了个空。\n\n\"那台上这圈印子呢？\"我指了指锅底压着的那道圆印，\"这印子里头，还叠着一圈更浅的。\"\n\n\"你看见了。\"他语气平平，\"台上先头扣过一口。比你这口大。\"\n\n\"那口锅呢？\"\n\n\"走了。\"\n\n\"自己走的？\"\n\n\"这话，我不说。\"他重新摸出一根烟，凑着灯苗点着，\"锅是死物，谁都能搬。可搬得动它，跟搬得走它，是两码事。\"\n\n我又想起石室缝口他——不，是那个人说过的话。锅是死物，谁都能搬。可眼前这个白头发老头，跟沟里那个缺耳的老头，是不是一个人，我到这会儿也没瞧清。\n\n他始终侧着身，脸埋在灯苗那头的暗里，只露着半边白发。\n\n\"明儿日落，\"他抽了口烟，忽然转了话头，\"我在这台上点一盅灯。\"\n\n\"点灯做什么？\"\n\n\"灯一离地，名分就过明路。\"他说，\"点灯的来验，吹灯的来夺。谁的名分，谁自己站出来接。\"\n\n我心里一跳：\"您是哪一路的？\"\n\n\"我是问灯的。\"他说，\"我问了半辈子。谁想点，我问他想清没有；谁想吹，我问他还记不记得自己姓什么。\"\n\n\"那您问我什么？\"\n\n他没答，反问我一句：\"你们掌柜的，什么时候到？\"\n\n\"天黑前。\"我说，\"他让我先来，把话听全。\"\n\n\"话，我这就说全。\"他把烟在指间转了半圈，\"明儿日落，灯一起，你们掌柜的要是上了台，这笔账就记在他名下；他要是不上，账就落你头上。\"\n\n\"落我头上，是多大一笔账？\"\n\n\"不大。\"他笑了一下，笑得很淡，\"就是往后这山里的路，你走一条，就记一笔。记满了，山要收，你就得还。\"\n\n\"我要是不想认呢？\"\n\n\"那你今夜就把锅背下山。\"他抬手往坡下指了指，\"谁也不拦你。锅背走，就当没这回事，山里的账另找日子算。\"\n\n\"另找哪个日子？\"\n\n\"你问不着。\"他说，\"该来的时候，它自己会来。\"\n\n台子上静了半晌。灯苗在风里缩了一下，又立起来。\n\n\"还有一句。\"我咬了咬牙，把压了一路的话问出来，\"五盏灯，四盏有主。剩那一盏，是给我们掌柜留的？\"\n\n老头抽着烟，没看我：\"你们掌柜的，把账算错了。\"\n\n\"哪错了？\"\n\n\"数灯，不是数人。\"他说，\"是数名分。人有一个，名分可以有两个；名分有一个，人能换好几个。你们数的是人头，山里数的是名分。\"\n\n\"那第五盏——\"\n\n\"第五盏，不是没主。\"他把烟头弹进台下的林子里，那点红火划了道弧，灭了，\"是主还没认。名分这东西，得有人拿自己的手，按下去才算。\"\n\n他说完，站起来，把台沿上那盏油灯端起来，往台下走。\n\n\"您这就走？\"我追了两步。\n\n\"天亮前，我得下山。\"他头也没回，\"上了年纪的人，怕日头。\"\n\n\"我怎么找您？\"\n\n\"不用找。\"他的声音从林子里传上来，已经隔了老远，\"灯在我这儿。灯会开的时候，我自然来。\"\n\n那点灯火在獾子道上晃了两晃，往下沉，沉到林子里去，就看不见了。\n\n我站在原地，盯着他坐过的那块平石头。\n\n石沿上，压着一个摁灭的烟头。烟灰压得扁扁的，烟纸卷得很紧，是拿指头一下一下摁进去的，摁完还在石头上蹭了半圈。\n\n跟沟里缝口那个人掐烟的样子，一模一样。\n\n我站在那儿，心里那点说不清的疑影子，又沉了一层。\n\n我在台上站了很久。锅还扣在台心，锅底的纹冲着天。\n\n天蒙蒙亮的时候，我下到护林道口，借老陈屋里的座机给豆芽仔打了个电话。\n\n电话那头，豆芽仔的声音哑得厉害，像是没睡。\n\n\"哥，\"他头一句话就把我钉住了，\"昨儿后半夜，桓仁老周那铺子，叫人把临街的玻璃砸了。\"\n\n\"人没事吧？\"\n\n\"人没事，老周躲在里屋，吓了一宿。\"豆芽仔咽了口唾沫，\"玻璃碴子里头，压着一张纸，上头写了一行字——'锅再上山，就别下来了'。\"\n\n我捏着话筒，指节发白。\n\n\"把头呢？\"\n\n\"把头昨晚进的桓仁，见了老鼠男，带回来一句话。\"豆芽仔顿了顿，\"他说——'台上那盏灯，让他们点；账，不能认。'\"\n\n\"他还说什么？\"\n\n\"他说天黑前上到台子上，让你在台上等他。\"豆芽仔的声
