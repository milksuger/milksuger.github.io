音发飘，\"哥，你们那边，到底要出什么事啊？\"\n\n我没回答。我把话筒搁回去，走出小屋，站在护林道口，往上看。\n\n半坡上，那片青石台子在晨光里泛着白。台上扣着一口锅，锅底朝天。\n\n灯，让他们点。\n\n账，不能认。\n\n我站在那儿，忽然明白把头这两句话是替我挡的——灯点起来，账记在他名下，认账的是他，不是我。他把我推到台前头，是想让我只做\"认字的\"，不沾那笔账。\n\n可昨夜那个白头发老头说得也明白：账主不上台，账就落认名分的人头上。\n\n明儿日落，把头要是上了台，那笔账，就是他的。", "words": 3085, "html": "<p>那盏灯上来得很慢。<\/p>\n<p>我跟鱼哥退到台子东边的老榆树后头，贴着树干看。来人走得不快，可脚下没有一点声音——枯叶、碎石、树根，他踩过去，跟踩在水面上一样。到了台下，他把灯往台沿上一搁，自己也在台边那块平石头上坐下了，背对着我们，一头白发在灯苗底下泛着灰。<\/p>\n<p>灰褂子。瘦。肩膀薄得像两块板。<\/p>\n<p>他没回头，也没四下看，就那么坐着，抽出一根烟，凑着灯苗点着。烟头的红点一明一灭，是东北烤烟那股子冲味。<\/p>\n<p>我攥着照魇镜的手心里全是汗。<\/p>\n<p>\"背锅的。\"他忽然开口，声音不高，带着点痰音，\"把锅扣上去。\"<\/p>\n<p>我心里一紧。他知道我们在这儿。他早知道。<\/p>\n<p>\"扣锅？\"<\/p>\n<p>\"扣。\"他说，\"口朝下。\"<\/p>\n<p>我看了鱼哥一眼。鱼哥没拦我，只把老避龙的布兜往怀里抱了抱，退到了榆树外头去。我抱着锅走到台心，蹲下，把那口锅端起来，慢慢翻了个个儿——<\/p>\n<p>锅口朝下，扣在台上。<\/p>\n<p>锅底冲上，露着那圈被我擦出来的鱼尾纹。灯苗的光落在上面，一深一浅两道刻痕，像水里游过去的一条鱼，尾巴还在。<\/p>\n<p>锅一落台，我手心里就空了一下。<\/p>\n<p>那口锅在台上扣得极稳，稳得不像是我摆上去的，倒像它自己寻着了地方。台心的圆印跟锅底严丝合缝，扣上去那一瞬，我心里\"咔\"地响了一声，像一把锁落进了锁眼。<\/p>\n<p>老头抽着烟，没看我，也没看锅，只看着台子底下那片黑林子。半晌，他才问：\"擦过没有？\"<\/p>\n<p>\"擦过。\"<\/p>\n<p>\"谁教你擦的？\"<\/p>\n<p>\"没人教。\"我说，\"灰厚，我顺手擦的。\"<\/p>\n<p>\"顺手。\"他把这两个字在嘴里嚼了一遍，\"不是顺手。是锅认你。别人的手摸上去，是一层灰；你的手摸上去，是一道纹。锅这东西，认手。\"<\/p>\n<p>我没接话。台子上风小，灯苗一动不动。<\/p>\n<p>\"你身上，有几样守字的东西？\"他又问。<\/p>\n<p>我想了想，把照魇镜从怀里掏出来，又把阴契从贴身的衣兜里摸出来，托在手里：\"镜子背上有'守'字。契是素面的，没字。\"<\/p>\n<p>\"镜子给我看。\"<\/p>\n<p>我把镜子递过去。他没接，只侧过头，就着灯苗看了一眼镜背，点点头：\"镜是眼。\"<\/p>\n<p>\"罐子上的纹，你见过了？\"<\/p>\n<p>\"见过。\"我说，\"圈足内侧，一深一浅，是刻了又磨的。\"<\/p>\n<p>\"罐是口。\"<\/p>\n<p>\"锅呢？\"<\/p>\n<p>\"锅是肚。\"他抬手，虚虚地朝台心一指，\"你扣着的那口，就是肚。\"<\/p>\n<p>我心里数了数：镜、罐、锅，三样。正要开口，他先说了：\"四样。\"<\/p>\n<p>\"哪来的四样？\"<\/p>\n<p>\"你自己看。\"他下巴朝我手里一抬，\"契。\"<\/p>\n<p>我把阴契凑到灯苗底下，斜着翻了几个角度。前几次看，那银符都是素面，光溜溜的。可这回，灯苗贴着边角照过去，符牌的右下角，隐隐浮出一道极浅的鱼尾印子——<\/p>\n<p>不是刻的。是拿模子压的。浅得几乎看不出，只有在灯苗斜着燎过去的时候，才显一显。<\/p>\n<p>我后脊梁上像被人浇了一瓢凉水。<\/p>\n<p>\"压的。\"我声音有点发干，\"跟刻的不一样。\"<\/p>\n<p>\"刻的是明账，压的是暗账。\"老头把烟头在石头上按灭，\"镜是眼，罐是口，锅是肚，契是名。四样凑齐了，一个人才算立得住。\"<\/p>\n<p>我把阴契和镜子一样一样收好，手心还是湿的。<\/p>\n<p>\"还有一样。\"我说，\"我们掌柜的让我先来，是把话说全。\"<\/p>\n<p>\"说。\"<\/p>\n<p>我就把鹰嘴沟石室里那一晚，捡要紧的说了。五口锅倒扣着，西南空一个位子，第五块素面无字的银符，还有北墙根那只白纸灯笼。我一句一句说，没添没减。<\/p>\n<p>老头一直没插话，等我说完，才慢慢开口：\"五口扣着，缺一口。那缺的一口，就是空出来的那一口。\"<\/p>\n<p>\"是消奴部？\"<\/p>\n<p>\"是你手里这口。\"他下巴朝台心一抬，\"你们把它从沟里背出来，那个位子就空了。空位子，山记得住。\"<\/p>\n<p>我心里一沉。原来我们取锅那一趟，不是从石室里搬走一样东西，是给那间石室留了个空。<\/p>\n<p>\"那台上这圈印子呢？\"我指了指锅底压着的那道圆印，\"这印子里头，还叠着一圈更浅的。\"<\/p>\n<p>\"你看见了。\"他语气平平，\"台上先头扣过一口。比你这口大。\"<\/p>\n<p>\"那口锅呢？\"<\/p>\n<p>\"走了。\"<\/p>\n<p>\"自己走的？\"<\/p>\n<p>\"这话，我不说。\"他重新摸出一根烟，凑着灯苗点着，\"锅是死物，谁都能搬。可搬得动它，跟搬得走它，是两码事。\"<\/p>\n<p>我又想起石室缝口他——不，是那个人说过的话。锅是死物，谁都能搬。可眼前这个白头发老头，跟沟里那个缺耳的老头，是不是一个人，我到这会儿也没瞧清。<\/p>\n<p>他始终侧着身，脸埋在灯苗那头的暗里，只露着半边白发。<\/p>\n<p>\"明儿日落，\"他抽了口烟，忽然转了话头，\"我在这台上点一盅灯。\"<\/p>\n<p>\"点灯做什么？\"<\/p>\n<p>\"灯一离地，名分就过明路。\"他说，\"点灯的来验，吹灯的来夺。谁的名分，谁自己站出来接。\"<\/p>\n<p>我心里一跳：\"您是哪一路的？\"<\/p>\n<p>\"我是问灯的。\"他说，\"我问了半辈子。谁想点，我问他想清没有；谁想吹，我问他还记不记得自己姓什么。\"<\/p>\n<p>\"那您问我什么？\"<\/p>\n<p>他没答，反问我一句：\"你们掌柜的，什么时候到？\"<\/p>\n<p>\"天黑前。\"我说，\"他让我先来，把话听全。\"<\/p>\n<p>\"话，我这就说全。\"他把烟在指间转了半圈，\"明儿日落，灯一起，你们掌柜的要是上了台，这笔账就记在他名下；他要是不上，账就落你头上。\"<\/p>\n<p>\"落我头上，是多大一笔账？\"<\/p>\n<p>\"不大。\"他笑了一下，笑得很淡，\"就是往后这山里的路，你走一条，就记一笔。记满了，山要收，你就得还。\"<\/p>\n<p>\"我要是不想认呢？\"<\/p>\n<p>\"那你今夜就把锅背下山。\"他抬手往坡下指了指，\"谁也不拦你。锅背走，就当没这回事，山里的账另找日子算。\"<\/p>\n<p>\"另找哪个日子？\"<\/p>\n<p>\"你问不着。\"他说，\"该来的时候，它自己会来。\"<\/p>\n<p>台子上静了半晌。灯苗在风里缩了一下，又立起来。<\/p>\n<p>\"还有一句。\"我咬了咬牙，把压了一路的话问出来，\"五盏灯，四盏有主。剩那一盏，是给我们掌柜留的？\"<\/p>\n<p>老头抽着烟，没看我：\"你们掌柜的，把账算错了。\"<\/p>\n<p>\"哪错了？\"<\/p>\n<p>\"数灯，不是数人。\"他说，\"是数名分。人有一个，名分可以有两个；名分有一个，人能换好几个。你们数的是人头，山里数的是名分。\"<\/p>\n<p>\"那第五盏——\"<\/p>\n<p>\"第五盏，不是没主。\"他把烟头弹进台下的林子里，那点红火划了道弧，灭了，\"是主还没认。名分这东西，得有人拿自己的手，按下去才算。\"<\/p>\n<p>他说完，站起来，把台沿上那盏油灯端起来，往台下走。<\/p>\n<p>\"您这就走？\"我追了两步。<\/p>\n<p>\"天亮前，我得下山。\"他头也没回，\"上了年纪的人，怕日头。\"<\/p>\n<p>\"我怎么找您？\"<\/p>\n<p>\"不用找。\"他的声音从林子里传上来，已经隔了老远，\"灯在我这儿。灯会开的时候，我自然来。\"<\/p>\n<p>那点灯火在獾子道上晃了两晃，往下沉，沉到林子里去，就看不见了。<\/p>\n<p>我站在原地，盯着他坐过的那块平石头。<\/p>\n<p>石沿上，压着一个摁灭的烟头。烟灰压得扁扁的，烟纸卷得很紧，是拿指头一下一下摁进去的，摁完还在石头上蹭了半圈。<\/p>\n<p>跟沟里缝口那个人掐烟的样子，一模一样。<\/p>\n<p>我站在那儿，心里那点说不清的疑影子，又沉了一层。<\/p>\n<p>我在台上站了很久。锅还扣在台心，锅底的纹冲着天。<\/p>\n<p>天蒙蒙亮的时候，我下到护林道口，借老陈屋里的座机给豆芽仔打了个电话。<\/p>\n<p>电话那头，豆芽仔的声音哑得厉害，像是没睡。<\/p>\n<p>\"哥，\"他头一句话就把我钉住了，\"昨儿后半夜，桓仁老周那铺子，叫人把临街的玻璃砸了。\"<\/p>\n<p>\"人没事吧？\"<\/p>\n<p>\"人没事，老周躲在里屋，吓了一宿。\"豆芽仔咽了口唾沫，\"玻璃碴子里头，压着一张纸，上头写了一行字——'锅再上山，就别下来了'。\"<\/p>\n<p>我捏着话筒，指节发白。<\/p>\n<p>\"把头呢？\"<\/p>\n<p>\"把头昨晚进的桓仁，见了老鼠男，带回来一句话。\"豆芽仔顿了顿，\"他说——'台上那盏灯，让他们点；账，不能认。'\"<\/p>\n<p>\"他还说什么？\"<\/p>\n<p>\"他说天黑前上到台子上，让你在台上等他。\"豆芽仔的声音发飘，\"哥，你们那边，到底要出什么事啊？\"<\/p>\n<p>我没回答。我把话筒搁回去，走出小屋，站在护林道口，往上看。<\/p>\n<p>半坡上，那片青石台子在晨光里泛着白。台上扣着一口锅，锅底朝天。<\/p>\n<p>灯，让他们点。<\/p>\n<p>账，不能认。<\/p>\n<p>我站在那儿，忽然明白把头这两句话是替我挡的——灯点起来，账记在他名下，认账的是他，不是我。他把我推到台前头，是想让我只做\"认字的\"，不沾那笔账。<\/p>\n<p>可昨夜那个白头发老头说得也明白：账主不上台，账就落认名分的人头上。<\/p>\n<p>明儿日落，把头要是上了台，那笔账，就是他的。<\/p>", "plain": "那盏灯上来得很慢。 我跟鱼哥退到台子东边的老榆树后头，贴着树干看。来人走得不快，可脚下没有一点声音——枯叶、碎石、树根，他踩过去，跟踩在水面上一样。到了台下，他把灯往台沿上一搁，自己也在台边那块平石头上坐下了，背对着我们，一头白发在灯苗底下泛着灰。 灰褂子。瘦。肩膀薄得像两块板。 他没回头，也没四下看，就那么坐着，抽出一根烟，凑着灯苗点着。烟头的红点一明一灭，是东北烤烟那股子冲味。 我攥着照魇镜的手心里全是汗。 \"背锅的。\"他忽然开口，声音不高，带着点痰音，\"把锅扣上去。\" 我心里一紧。他知道我们在这儿。他早知道。 \"扣锅？\" \"扣。\"他说，\"口朝下。\" 我看了鱼哥一眼。鱼哥没拦我，只把老避龙的布兜往怀里抱了抱，退到了榆树外头去。我抱着锅走到台心，蹲下，把那口锅端起来，慢慢翻了个个儿—— 锅口朝下，扣在台上。 锅底冲上，露着那圈被我擦出来的鱼尾纹。灯苗的光落在上面，一深一浅两道刻痕，像水里游过去的一条鱼，尾巴还在。 锅一落台，我手心里就空了一下。 那口锅在台上扣得极稳，稳得不像是我摆上去的，倒像它自己寻着了地方。台心的圆印跟锅底严丝合缝，扣上去那一瞬，我心里\"咔\"地响了一声，像一把锁落进了锁眼。 老头抽着烟，没看我，也没看锅，只看着台子底下那片黑林子。半晌，他才问：\"擦过没有？\" \"擦过。\" \"谁教你擦的？\" \"没人教。\"我说，\"灰厚，我顺手擦的。\" \"顺手。\"他把这两个字在嘴里嚼了一遍，\"不是顺手。是锅认你。别人的手摸上去，是一层灰；你的手摸上去，是一道纹。锅这东西，认手。\" 我没接话。台子上风小，灯苗一动不动。 \"你身上，有几样守字的东西？\"他又问。 我想了想，把照魇镜从怀里掏出来，又把阴契从贴身的衣兜里摸出来，托在手里：\"镜子背上有'守'字。契是素面的，没字。\" \"镜子给我看。\" 我把镜子递过去。他没接，只侧过头，就着灯苗看了一眼镜背，点点头：\"镜是眼。\" \"罐子上的纹，你见过了？\" \"见过。\"我说，\"圈足内侧，一深一浅，是刻了又磨的。\" \"罐是口。\" \"锅呢？\" \"锅是肚。\"他抬手，虚虚地朝台心一指，\"你扣着的那口，就是肚。\" 我心里数了数：镜、罐、锅，三样。正要开口，他先说了：\"四样。\" \"哪来的四样？\" \"你自己看。\"他下巴朝我手里一抬，\"契。\" 我把阴契凑到灯苗底下，斜着翻了几个角度。前几次看，那银符都是素面，光溜溜的。可这回，灯苗贴着边角照过去，符牌的右下角，隐隐浮出一道极浅的鱼尾印子—— 不是刻的。是拿模子压的。浅得几乎看不出，只有在灯苗斜着燎过去的时候，才显一显。 我后脊梁上像被人浇了一瓢凉水。 \"压的。\"我声音有点发干，\"跟刻的不一样。\" \"刻的是明账，压的是暗账。\"老头把烟头在石头上按灭，\"镜是眼，罐是口，锅是肚，契是名。四样凑齐了，一个人才算立得住。\" 我把阴契和镜子一样一样收好，手心还是湿的。 \"还有一样。\"我说，\"我们掌柜的让我先来，是把话说全。\" \"说。\" 我就把鹰嘴沟石室里那一晚，捡要紧的说了。五口锅倒扣着，西南空一个位子，第五块素面无字的银符，还有北墙根那只白纸灯笼。我一句一句说，没添没减。 老头一直没插话，等我说完，才慢慢开口：\"五口扣着，缺一口。那缺的一口，就是空出来的那一口。\" \"是消奴部？\" \"是你手里这口。\"他下巴朝台心一抬，\"你们把它从沟里背出来，那个位子就空了。空位子，山记得住。\" 我心里一沉。原来我们取锅那一趟，不是从石室里搬走一样东西，是给那间石室留了个空。 \"那台上这圈印子呢？\"我指了指锅底压着的那道圆印，\"这印子里头，还叠着一圈更浅的。\" \"你看见了。\"他语气平平，\"台上先头扣过一口。比你这口大。\" \"那口锅呢？\" \"走了。\" \"自己走的？\" \"这话，我不说。\"他重新摸出一根烟，凑着灯苗点着，\"锅是死物，谁都能搬。可搬得动它，跟搬得走它，是两码事。\" 我又想起石室缝口他——不，是那个人说过的话。锅是死物，谁都能搬。可眼前这个白头发老头，跟沟里那个缺耳的老头，是不是一个人，我到这会儿也没瞧清。 他始终侧着身，脸埋在灯苗那头的暗里，只露着半边白发。 \"明儿日落，\"他抽了口烟，忽然转了话头，\"我在这台上点一盅灯。\" \"点灯做什么？\" \"灯一离地，名分就过明路。\"他说，\"点灯的来验，吹灯的来夺。谁的名分，谁自己站出来接。\" 我心里一跳：\"您是哪一路的？\" \"我是问灯的。\"他说，\"我问了半辈子。谁想点，我问他想清没有；谁想吹，我问他还记不记得自己姓什么。\" \"那您问我什么？\" 他没答，反问我一句：\"你们掌柜的，什么时候到？\" \"天黑前。\"我说，\"他让我先来，把话听全。\" \"话，我这就说全。\"他把烟在指间转了半圈，\"明儿日落，灯一起，你们掌柜的要是上了台，这笔账就记在他名下；他要是不上，账就落你头上。\" \"落我头上，是多大一笔账？\" \"不大。\"他笑了一下，笑得很淡，\"就是往后这山里的路，你走一条，就记一笔。记满了，山要收，你就得还。\" \"我要是不想认呢？\" \"那你今夜就把锅背下山。\"他抬手往坡下指了指，\"谁也不拦你。锅背走，就当没这回事，山里的账另找日子算。\" \"另找哪个日子？\" \"你问不着。\"他说，\"该来的时候，它自己会来。\" 台子上静了半晌。灯苗在风里缩了一下，又立起来。 \"还有一句。\"我咬了咬牙，把压了一路的话问出来，\"五盏灯，四盏有主。剩那一盏，是给我们掌柜留的？\" 老头抽着烟，没看我：\"你们掌柜的，把账算错了。\" \"哪错了？\" \"数灯，不是数人。\"他说，\"是数名分。人有一个，名分可以有两个；名分有一个，人能换好几个。你们数的是人头，山里数的是名分。\" \"那第五盏——\" \"第五盏，不是没主。\"他把烟头弹进台下的林子里，那点红火划了道弧，灭了，\"是主还没认。名分这东西，得有人拿自己的手，按下去才算。\" 他说完，站起来，把台沿上那盏油灯端起来，往台下走。 \"您这就走？\"我追了两步。 \"天亮前，我得下山。\"他头也没回，\"上了年纪的人，怕日头。\" \"我怎么找您？\" \"不用找。\"他的声音从林子里传上来，已经隔了老远，\"灯在我这儿。灯会开的时候，我自然来。\" 那点灯火在獾子道上晃了两晃，往下沉，沉到林子里去，就看不见了。 我站在原地，盯着他坐过的那块平石头。 石沿上，压着一个摁灭的烟头。烟灰压得扁扁的，烟纸卷得很紧，是拿指头一下一下摁进去的，摁完还在石头上蹭了半圈。 跟沟里缝口那个人掐烟的样子，一模一样。 我站在那儿，心里那点说不清的疑影子，又沉了一层。 我在台上站了很久。锅还扣在台心，锅底的纹冲着天。 天蒙蒙亮的时候，我下到护林道口，借老陈屋里的座机给豆芽仔打了个电话。 电话那头，豆芽仔的声音哑得厉害，像是没睡。 \"哥，\"他头一句话就把我钉住了，\"昨儿后半夜，桓仁老周那铺子，叫人把临街的玻璃砸了。\" \"人没事吧？\" \"人没事，老周躲在里屋，吓了一宿。\"豆芽仔咽了口唾沫，\"玻璃碴子里头，压着一张纸，上头写了一行字——'锅再上山，就别下来了'。\" 我捏着话筒，指节发白。 \"把头呢？\" \"把头昨晚进的桓仁，见了老鼠男，带回来一句话。\"豆芽仔顿了顿，\"他说——'台上那盏灯，让他们点；账，不能认。'\" \"他还说什么？\" \"他说天黑前上到台子上，让你在台上等他。\"豆芽仔的声音发飘，\"哥，你们那边，到底要出什么事啊？\" 我没回答。我把话筒搁回去，走出小屋，站在护林道口，往上看。 半坡上，那片青石台子在晨光里泛着白。台上扣着一口锅，锅底朝天。 灯，让他们点。 账，不能认。 我站在那儿，忽然明白把头这两句话是替我挡的——灯点起来，账记在他名下，认账的是他，不是我。他把我推到台前头，是想让我只做\"认字的\"，不沾那笔账。 可昨夜那个白头发老头说得也明白：账主不上台，账就落认名分的人头上。 明儿日落，把头要是上了台，那笔账，就是他的。"}, {"id": "A5-083", "arc": "A5", "num": 83, "title": "对台", "md": "白天，我们在台上守了一天。\n\n鱼哥把老避龙放出来，让鸡在台边的石头堆上刨食。鸡刨得很自在，我心里那根弦却越绷越紧。锅还扣在台心，锅底朝上，那圈鱼尾纹晒着日头，一深一浅，看得久了，像真有一条鱼在锅底上打盹。\n\n晌午，老陈端着两个苞米面饼子上来。\n\n他把饼子搁在台沿上，蹲下，压低了声音：\"今早天没亮，那个瘦高个又来了。\"\n\n我停下咬饼子的嘴：\"又问你石台怎么走？\"\n\n\"他没问。\"老陈说，\"他在我屋门口站了会儿，问我一句'昨儿后晌上去那俩，下来了没有'。我说不知道。他笑笑，就往獾子道那边去了。\"\n\n\"就他一个人？\"\n\n\"就他一个。\"老陈顿了顿，又补一句，\"还有个事，我是听山底下看山货棚的老李说的。昨儿夜里，棚里少了一小桶煤油。\"\n\n煤油。\n\n我拿着饼子的手一紧，抬头看鱼哥。鱼哥正蹲在台角，拿袖子擦一把匕首，闻言没抬头，只把匕首往鞋帮上一插。\n\n\"大叔，\"我说，\"夜里要是有事，您别上来。\"\n\n\"我一个看林的，\"老陈站起来，拍了拍膝盖上的土，\"你们这伙子人，一看就不是来踏青的。我不问你们干啥，只跟你们说一句——这坡上出事，往我屋退。门不锁。\"\n\n他说完就下去了。\n\n老陈下去以后，我坐不住，顺着护林道下到他那间小屋，想给把头打个电话。\n\n座机摇过去，响了半天，没人接。我又摇豆芽仔的手机号，山里信号飘，接通了也是断断续续，只听见豆芽仔在那一头喊\"哥你说啥\"，喊了三遍，就断了。\n\n我把话筒搁回去，站在屋门口，心里发慌。把头从昨儿进桓仁，到现在没个准信。\n\n鱼哥从台上下来找我，站在门口往山下望：\"他要是出事，早出事了。没出事，就是叫人绊住了脚。\"\n\n\"绊住脚，比出事还麻烦。\"\n\n\"那是。\"鱼哥说，\"出事是明的，绊脚是暗的。暗的，不好防。\"\n\n我们俩又上了台。\n\n后晌日头偏西的时候，来了个戴草帽的。\n\n他从护林道正路上来的，走得不快，草帽压得很低，遮着大半张脸，只露一个下巴和脖子上晒出来的黑。他手里捏着一盏白纸灯笼，没糊完的那种，竹篾骨支着，纸面雪白，在日头底下晃得刺眼。\n\n他在台下站住，没上台，冲台上拱了拱手。\n\n\"掌柜的没来。\"他说，嗓子沙哑，\"我来替人说句话。\"\n\n\"哪一路的话？\"\n\n\"点灯的那一路。\"草帽人把灯笼举了举，\"五盏灯，四盏有了主。剩这一盏，是你们掌柜的名分。灯点起来，五灯归位，山里的账就清了。\"\n\n我心里一动。\n\n清账。他说的，跟昨夜那白头发老头说的不一样。\n\n\"你再说一遍。\"我盯着他，\"灯点起来，账怎么了？\"\n\n\"账就清了。\"草帽人说得笃定，\"名分归位，账自然就勾了。\"\n\n\"谁勾的？\"\n\n\"山勾的。\"\n\n我没接话。把头说过，谈价钱的事归他。可这会儿他不在台上，我只能先把话听全，把两种说法都装在心里。\n\n白头发老头说：账跟着名分走，灯起了，账就落到账主或者认名分的人头上，一笔一笔记着，记满了要还。\n\n草帽人说：灯起了，名分归位，账就勾了。\n\n两句话，各说各的。谁对谁错，眼下分不出。\n\n我心里揣着这两句话，像揣着两块不一样的石头。把头不在，我谁也问不得。可我有一样记得清楚——马渡霜留过话，\"别接灯。灯亮一盏，走一个人\"。守线的人让我点灯，白头发老头让我自己拿主意，吹灯的人让我别点。三张嘴，三种说法。\n\n一个\"灯\"字，把三路人全引到这台子上来了。\n\n\"你手里的灯，\"我指了指那盏白纸灯笼，\"是给我点的？\"\n\n\"灯得您自己点。\"草帽人说，\"我是替您掌灯的。您一点，我就把它撑开，山里的眼睛，才都看得见。\"\n\n\"要是我今夜不点呢？\"\n\n\"那就等下一回。\"草帽人把灯笼往怀里一收，\"灯这东西，不催人。催人的是别的。\"\n\n\"催人的是谁？\"\n\n\"您心里有数。\"草帽人把灯笼往怀里又收了收，\"昨儿后半夜，桓仁老周的铺子叫人砸了。再往前，蜂房叫人泼过油。这些，都不是我们干的。\"\n\n\"你们干的是哪一路？\"\n\n\"我们只点灯。\"他说，\"灯点到哪儿，账勾到哪儿。别的，我们不沾。\"\n\n他这话说得干净，可我听得出来，他嘴上说\"不沾\"，手里那盏灯笼，却一直没离手。\n\n他说完，退到台下林子的边上，找了块石头坐下，把草帽往脸上一压，像一截靠着树桩子打盹的枯柴。\n\n日头一寸一寸往下落。\n\n快擦黑的时候，台下那条獾子道，上来两个人。\n\n前头那个矮得邪乎，走石阶贴着地皮；后头那个瘦高个，颧骨高，一双眼睛又冷又亮。两人在林子边上停住，没上台，隔着十几步，站定了。\n\n瘦高个先开了口。他嗓子不高，字咬得清楚：\n\n\"台上那位背锅的。\"\n\n\"有话说话。\"我站在锅边，没动。\n\n\"那口锅，不是你的。\"他说，\"消奴部早绝了两千年，绝了就是绝了。你从沟里拾一口破锅出来，往台上一扣，就成你的名分了？\"\n\n\"名分是我认的。\"\n\n\"认来的名分，也是偷来的。\"他冷笑了一声，\"偷来的东西，山不认。今夜这台上，就两条道——锅自己滚下去，或者，我替山把它吹了。\"\n\n\"吹\"字他咬得很重。\n\n\"你连我是谁都不知道，就要替山吹锅？\"我说。\n\n\"我知道。\"他看着我，一个字一个字地说，\"你叫项云峰，辽阳人。你那个掌柜的，姓王，道上叫他把头。你们从沈阳那批废铁上，就开始沾这条线了。\"\n\n我后脊梁上的汗，一下子凉透了。\n\n他们不是半路撞上来的。他们是早就跟上了。\n\n我盯着他，想把这张脸记住。颧骨高，眼窝深，嘴角一道旧疤，一看就是常年在山里讨生活的人。可他说的是辽阳话，跟我一个口音。\n\n一个辽阳人，跑到桓仁的山上来替人吹锅。这行当，比盗墓还生僻。\n\n我看了看他身后那个矮个。矮个始终低着头，一只手插在裤兜里，兜里鼓鼓囊囊，装着一件硬东西。两人身上的衣裳下摆，都带着一股子味——煤油味，淡淡的，风一吹就散，可鼻子尖的人闻得出来。\n\n他们不是来说理的。他们是来烧台的。\n\n天，黑透了。\n\n就在这时候，獾子道那头，亮起一点黄。\n\n白头发老头提着那盏没罩子的油灯，一步一步走上来。走到台下，他从那两个人身边过去，看都没看他们一眼，径直上了台，把灯搁在台沿正中。\n\n灯苗很小，却立得笔直。\n\n他坐下，还是侧着身，脸埋在暗里。\n\n\"掌柜呢？\"他问。\n\n\"在路上。\"我说。\n\n\"日头落了。\"\n\n\"路上有事，绊住了。\"\n\n\"绊住他的，不是路。\"老头抽出一根烟，没点，就那么叼着，\"是话。有人拿话把他绊在桓仁了。\"\n\n\"您怎么知道？\"\n\n\"猜的。\"他把烟从嘴上拿下来，\"干这行的人，最怕的不是刀子，是话。刀子伤人，话绊人。\"\n\n我心里\"咯噔\"一下。把头在桓仁见的是老鼠男。是老鼠男绊的他？\n\n\"按规矩，\"老头把烟从嘴上拿下来，\"账主不到台，账就不落他头上。认名分的人，接不接这笔账？\"\n\n台下那瘦高个冷笑：\"他接不了。他一个背锅的，拿什么接？\"\n\n老头没理他，只看着我。草帽人也从林子里站了起来，怀里抱着那盏白纸灯笼。\n\n我张了张嘴，没出声。\n\n接，就是把把头替我挡的那笔账，自己扛过来。\n\n不接，就是当着三路人的面，把这口锅背下山，从此再不提名分。\n\n老头等了片刻，见我不说话，便低下头，凑着那盏油灯，从怀里摸出一根捻子。\n\n\"灯，我替你点着。\"他说，\"接不接账，天亮前，给我句话。\"\n\n火折子凑上去，捻子\"噗\"地一声，着了。\n\n就在灯苗亮起来的那一刹那，我看见两样东西——\n\n台下，草帽人把手里的白纸灯笼撑开了，白纸在风里鼓成一个圆；獾子道那头，瘦高个从怀里摸出一只洋铁皮的小桶，桶沿上，沾着一层亮亮的油。\n\n灯苗立着，风在台下打转。\n\n我忽然明白过来——今夜这台子上，谁都不是来看灯的。", "words": 2848, "html": "<p>白天，我们在台上守了一天。<\/p>\n<p>鱼哥把老避龙放出来，让鸡在台边的石头堆上刨食。鸡刨得很自在，我心里那根弦却越绷越紧。锅还扣在台心，锅底朝上，那圈鱼尾纹晒着日头，一深一浅，看得久了，像真有一条鱼在锅底上打盹。<\/p>\n<p>晌午，老陈端着两个苞米面饼子上来。<\/p>\n<p>他把饼子搁在台沿上，蹲下，压低了声音：\"今早天没亮，那个瘦高个又来了。\"<\/p>\n<p>我停下咬饼子的嘴：\"又问你石台怎么走？\"<\/p>\n<p>\"他没问。\"老陈说，\"他在我屋门口站了会儿，问我一句'昨儿后晌上去那俩，下来了没有'。我说不知道。他笑笑，就往獾子道那边去了。\"<\/p>\n<p>\"就他一个人？\"<\/p>\n<p>\"就他一个。\"老陈顿了顿，又补一句，\"还有个事，我是听山底下看山货棚的老李说的。昨儿夜里，棚里少了一小桶煤油。\"<\/p>\n<p>煤油。<\/p>\n<p>我拿着饼子的手一紧，抬头看鱼哥。鱼哥正蹲在台角，拿袖子擦一把匕首，闻言没抬头，只把匕首往鞋帮上一插。<\/p>\n<p>\"大叔，\"我说，\"夜里要是有事，您别上来。\"<\/p>\n<p>\"我一个看林的，\"老陈站起来，拍了拍膝盖上的土，\"你们这伙子人，一看就不是来踏青的。我不问你们干啥，只跟你们说一句——这坡上出事，往我屋退。门不锁。\"<\/p>\n<p>他说完就下去了。<\/p>\n<p>老陈下去以后，我坐不住，顺着护林道下到他那间小屋，想给把头打个电话。<\/p>\n<p>座机摇过去，响了半天，没人接。我又摇豆芽仔的手机号，山里信号飘，接通了也是断断续续，只听见豆芽仔在那一头喊\"哥你说啥\"，喊了三遍，就断了。<\/p>\n<p>我把话筒搁回去，站在屋门口，心里发慌。把头从昨儿进桓仁，到现在没个准信。<\/p>\n<p>鱼哥从台上下来找我，站在门口往山下望：\"他要是出事，早出事了。没出事，就是叫人绊住了脚。\"<\/p>\n<p>\"绊住脚，比出事还麻烦。\"<\/p>\n<p>\"那是。\"鱼哥说，\"出事是明的，绊脚是暗的。暗的，不好防。\"<\/p>\n<p>我们俩又上了台。<\/p>\n<p>后晌日头偏西的时候，来了个戴草帽的。<\/p>\n<p>他从护林道正路上来的，走得不快，草帽压得很低，遮着大半张脸，只露一个下巴和脖子上晒出来的黑。他手里捏着一盏白纸灯笼，没糊完的那种，竹篾骨支着，纸面雪白，在日头底下晃得刺眼。<\/p>\n<p>他在台下站住，没上台，冲台上拱了拱手。<\/p>\n<p>\"掌柜的没来。\"他说，嗓子沙哑，\"我来替人说句话。\"<\/p>\n<p>\"哪一路的话？\"<\/p>\n<p>\"点灯的那一路。\"草帽人把灯笼举了举，\"五盏灯，四盏有了主。剩这一盏，是你们掌柜的名分。灯点起来，五灯归位，山里的账就清了。\"<\/p>\n<p>我心里一动。<\/p>\n<p>清账。他说的，跟昨夜那白头发老头说的不一样。<\/p>\n<p>\"你再说一遍。\"我盯着他，\"灯点起来，账怎么了？\"<\/p>\n<p>\"账就清了。\"草帽人说得笃定，\"名分归位，账自然就勾了。\"<\/p>\n<p>\"谁勾的？\"<\/p>\n<p>\"山勾的。\"<\/p>\n<p>我没接话。把头说过，谈价钱的事归他。可这会儿他不在台上，我只能先把话听全，把两种说法都装在心里。<\/p>\n<p>白头发老头说：账跟着名分走，灯起了，账就落到账主或者认名分的人头上，一笔一笔记着，记满了要还。<\/p>\n<p>草帽人说：灯起了，名分归位，账就勾了。<\/p>\n<p>两句话，各说各的。谁对谁错，眼下分不出。<\/p>\n<p>我心里揣着这两句话，像揣着两块不一样的石头。把头不在，我谁也问不得。可我有一样记得清楚——马渡霜留过话，\"别接灯。灯亮一盏，走一个人\"。守线的人让我点灯，白头发老头让我自己拿主意，吹灯的人让我别点。三张嘴，三种说法。<\/p>\n<p>一个\"灯\"字，把三路人全引到这台子上来了。<\/p>\n<p>\"你手里的灯，\"我指了指那盏白纸灯笼，\"是给我点的？\"<\/p>\n<p>\"灯得您自己点。\"草帽人说，\"我是替您掌灯的。您一点，我就把它撑开，山里的眼睛，才都看得见。\"<\/p>\n<p>\"要是我今夜不点呢？\"<\/p>\n<p>\"那就等下一回。\"草帽人把灯笼往怀里一收，\"灯这东西，不催人。催人的是别的。\"<\/p>\n<p>\"催人的是谁？\"<\/p>\n<p>\"您心里有数。\"草帽人把灯笼往怀里又收了收，\"昨儿后半夜，桓仁老周的铺子叫人砸了。再往前，蜂房叫人泼过油。这些，都不是我们干的。\"<\/p>\n<p>\"你们干的是哪一路？\"<\/p>\n<p>\"我们只点灯。\"他说，\"灯点到哪儿，账勾到哪儿。别的，我们不沾。\"<\/p>\n<p>他这话说得干净，可我听得出来，他嘴上说\"不沾\"，手里那盏灯笼，却一直没离手。<\/p>\n<p>他说完，退到台下林子的边上，找了块石头坐下，把草帽往脸上一压，像一截靠着树桩子打盹的枯柴。<\/p>\n<p>日头一寸一寸往下落。<\/p>\n<p>快擦黑的时候，台下那条獾子道，上来两个人。<\/p>\n<p>前头那个矮得邪乎，走石阶贴着地皮；后头那个瘦高个，颧骨高，一双眼睛又冷又亮。两人在林子边上停住，没上台，隔着十几步，站定了。<\/p>\n<p>瘦高个先开了口。他嗓子不高，字咬得清楚：<\/p>\n<p>\"台上那位背锅的。\"<\/p>\n<p>\"有话说话。\"我站在锅边，没动。<\/p>\n<p>\"那口锅，不是你的。\"他说，\"消奴部早绝了两千年，绝了就是绝了。你从沟里拾一口破锅出来，往台上一扣，就成你的名分了？\"<\/p>\n<p>\"名分是我认的。\"<\/p>\n<p>\"认来的名分，也是偷来的。\"他冷笑了一声，\"偷来的东西，山不认。今夜这台上，就两条道——锅自己滚下去，或者，我替山把它吹了。\"<\/p>\n<p>\"吹\"字他咬得很重。<\/p>\n<p>\"你连我是谁都不知道，就要替山吹锅？\"我说。<\/p>\n<p>\"我知道。\"他看着我，一个字一个字地说，\"你叫项云峰，辽阳人。你那个掌柜的，姓王，道上叫他把头。你们从沈阳那批废铁上，就开始沾这条线了。\"<\/p>\n<p>我后脊梁上的汗，一下子凉透了。<\/p>\n<p>他们不是半路撞上来的。他们是早就跟上了。<\/p>\n<p>我盯着他，想把这张脸记住。颧骨高，眼窝深，嘴角一道旧疤，一看就是常年在山里讨生活的人。可他说的是辽阳话，跟我一个口音。<\/p>\n<p>一个辽阳人，跑到桓仁的山上来替人吹锅。这行当，比盗墓还生僻。<\/p>\n<p>我看了看他身后那个矮个。矮个始终低着头，一只手插在裤兜里，兜里鼓鼓囊囊，装着一件硬东西。两人身上的衣裳下摆，都带着一股子味——煤油味，淡淡的，风一吹就散，可鼻子尖的人闻得出来。<\/p>\n<p>他们不是来说理的。他们是来烧台的。<\/p>\n<p>天，黑透了。<\/p>\n<p>就在这时候，獾子道那头，亮起一点黄。<\/p>\n<p>白头发老头提着那盏没罩子的油灯，一步一步走上来。走到台下，他从那两个人身边过去，看都没看他们一眼，径直上了台，把灯搁在台沿正中。<\/p>\n<p>灯苗很小，却立得笔直。<\/p>\n<p>他坐下，还是侧着身，脸埋在暗里。<\/p>\n<p>\"掌柜呢？\"他问。<\/p>\n<p>\"在路上。\"我说。<\/p>\n<p>\"日头落了。\"<\/p>\n<p>\"路上有事，绊住了。\"<\/p>\n<p>\"绊住他的，不是路。\"老头抽出一根烟，没点，就那么叼着，\"是话。有人拿话把他绊在桓仁了。\"<\/p>\n<p>\"您怎么知道？\"<\/p>\n<p>\"猜的。\"他把烟从嘴上拿下来，\"干这行的人，最怕的不是刀子，是话。刀子伤人，话绊人。\"<\/p>\n<p>我心里\"咯噔\"一下。把头在桓仁见的是老鼠男。是老鼠男绊的他？<\/p>\n<p>\"按规矩，\"老头把烟从嘴上拿下来，\"账主不到台，账就不落他头上。认名分的人，接不接这笔账？\"<\/p>\n<p>台下那瘦高个冷笑：\"他接不了。他一个背锅的，拿什么接？\"<\/p>\n<p>老头没理他，只看着我。草帽人也从林子里站了起来，怀里抱着那盏白纸灯笼。<\/p>\n<p>我张了张嘴，没出声。<\/p>\n<p>接，就是把把头替我挡的那笔账，自己扛过来。<\/p>\n<p>不接，就是当着三路人的面，把这口锅背下山，从此再不提名分。<\/p>\n<p>老头等了片刻，见我不说话，便低下头，凑着那盏油灯，从怀里摸出一根捻子。<\/p>\n<p>\"灯，我替你点着。\"他说，\"接不接账，天亮前，给我句话。\"<\/p>\n<p>火折子凑上去，捻子\"噗\"地一声，着了。<\/p>\n<p>就在灯苗亮起来的那一刹那，我看见两样东西——<\/p>\n<p>台下，草帽人把手里的白纸灯笼撑开了，白纸在风里鼓成一个圆；獾子道那头，瘦高个从怀里摸出一只洋铁皮的小桶，桶沿上，沾着一层亮亮的油。<\/p>\n<p>灯苗立着，风在台下打转。<\/p>\n<p>我忽然明白过来——今夜这台子上，谁都不是来看灯的。<\/p>", "plain": "白天，我们在台上守了一天。 鱼哥把老避龙放出来，让鸡在台边的石头堆上刨食。鸡刨得很自在，我心里那根弦却越绷越紧。锅还扣在台心，锅底朝上，那圈鱼尾纹晒着日头，一深一浅，看得久了，像真有一条鱼在锅底上打盹。 晌午，老陈端着两个苞米面饼子上来。 他把饼子搁在台沿上，蹲下，压低了声音：\"今早天没亮，那个瘦高个又来了。\" 我停下咬饼子的嘴：\"又问你石台怎么走？\" \"他没问。\"老陈说，\"他在我屋门口站了会儿，问我一句'昨儿后晌上去那俩，下来了没有'。我说不知道。他笑笑，就往獾子道那边去了。\" \"就他一个人？\" \"就他一个。\"老陈顿了顿，又补一句，\"还有个事，我是听山底下看山货棚的老李说的。昨儿夜里，棚里少了一小桶煤油。\" 煤油。 我拿着饼子的手一紧，抬头看鱼哥。鱼哥正蹲在台角，拿袖子擦一把匕首，闻言没抬头，只把匕首往鞋帮上一插。 \"大叔，\"我说，\"夜里要是有事，您别上来。\" \"我一个看林的，\"老陈站起来，拍了拍膝盖上的土，\"你们这伙子人，一看就不是来踏青的。我不问你们干啥，只跟你们说一句——这坡上出事，往我屋退。门不锁。\" 他说完就下去了。 老陈下去以后，我坐不住，顺着护林道下到他那间小屋，想给把头打个电话。 座机摇过去，响了半天，没人接。我又摇豆芽仔的手机号，山里信号飘，接通了也是断断续续，只听见豆芽仔在那一头喊\"哥你说啥\"，喊了三遍，就断了。 我把话筒搁回去，站在屋门口，心里发慌。把头从昨儿进桓仁，到现在没个准信。 鱼哥从台上下来找我，站在门口往山下望：\"他要是出事，早出事了。没出事，就是叫人绊住了脚。\" \"绊住脚，比出事还麻烦。\" \"那是。\"鱼哥说，\"出事是明的，绊脚是暗的。暗的，不好防。\" 我们俩又上了台。 后晌日头偏西的时候，来了个戴草帽的。 他从护林道正路上来的，走得不快，草帽压得很低，遮着大半张脸，只露一个下巴和脖子上晒出来的黑。他手里捏着一盏白纸灯笼，没糊完的那种，竹篾骨支着，纸面雪白，在日头底下晃得刺眼。 他在台下站住，没上台，冲台上拱了拱手。 \"掌柜的没来。\"他说，嗓子沙哑，\"我来替人说句话。\" \"哪一路的话？\" \"点灯的那一路。\"草帽人把灯笼举了举，\"五盏灯，四盏有了主。剩这一盏，是你们掌柜的名分。灯点起来，五灯归位，山里的账就清了。\" 我心里一动。 清账。他说的，跟昨夜那白头发老头说的不一样。 \"你再说一遍。\"我盯着他，\"灯点起来，账怎么了？\" \"账就清了。\"草帽人说得笃定，\"名分归位，账自然就勾了。\" \"谁勾的？\" \"山勾的。\" 我没接话。把头说过，谈价钱的事归他。可这会儿他不在台上，我只能先把话听全，把两种说法都装在心里。 白头发老头说：账跟着名分走，灯起了，账就落到账主或者认名分的人头上，一笔一笔记着，记满了要还。 草帽人说：灯起了，名分归位，账就勾了。 两句话，各说各的。谁对谁错，眼下分不出。 我心里揣着这两句话，像揣着两块不一样的石头。把头不在，我谁也问不得。可我有一样记得清楚——马渡霜留过话，\"别接灯。灯亮一盏，走一个人\"。守线的人让我点灯，白头发老头让我自己拿主意，吹灯的人让我别点。三张嘴，三种说法。 一个\"灯\"字，把三路人全引到这台子上来了。 \"你手里的灯，\"我指了指那盏白纸灯笼，\"是给我点的？\" \"灯得您自己点。\"草帽人说，\"我是替您掌灯的。您一点，我就把它撑开，山里的眼睛，才都看得见。\" \"要是我今夜不点呢？\" \"那就等下一回。\"草帽人把灯笼往怀里一收，\"灯这东西，不催人。催人的是别的。\" \"催人的是谁？\" \"您心里有数。\"草帽人把灯笼往怀里又收了收，\"昨儿后半夜，桓仁老周的铺子叫人砸了。再往前，蜂房叫人泼过油。这些，都不是我们干的。\" \"你们干的是哪一路？\" \"我们只点灯。\"他说，\"灯点到哪儿，账勾到哪儿。别的，我们不沾。\" 他这话说得干净，可我听得出来，他嘴上说\"不沾\"，手里那盏灯笼，却一直没离手。 他说完，退到台下林子的边上，找了块石头坐下，把草帽往脸上一压，像一截靠着树桩子打盹的枯柴。 日头一寸一寸往下落。 快擦黑的时候，台下那条獾子道，上来两个人。 前头那个矮得邪乎，走石阶贴着地皮；后头那个瘦高个，颧骨高，一双眼睛又冷又亮。两人在林子边上停住，没上台，隔着十几步，站定了。 瘦高个先开了口。他嗓子不高，字咬得清楚： \"台上那位背锅的。\" \"有话说话。\"我站在锅边，没动。 \"那口锅，不是你的。\"他说，\"消奴部早绝了两千年，绝了就是绝了。你从沟里拾一口破锅出来，往台上一扣，就成你的名分了？\" \"名分是我认的。\" \"认来的名分，也是偷来的。\"他冷笑了一声，\"偷来的东西，山不认。今夜这台上，就两条道——锅自己滚下去，或者，我替山把它吹了。\" \"吹\"字他咬得很重。 \"你连我是谁都不知道，就要替山吹锅？\"我说。 \"我知道。\"他看着我，一个字一个字地说，\"你叫项云峰，辽阳人。你那个掌柜的，姓王，道上叫他把头。你们从沈阳那批废铁上，就开始沾这条线了。\" 我后脊梁上的汗，一下子凉透了。 他们不是半路撞上来的。他们是早就跟上了。 我盯着他，想把这张脸记住。颧骨高，眼窝深，嘴角一道旧疤，一看就是常年在山里讨生活的人。可他说的是辽阳话，跟我一个口音。 一个辽阳人，跑到桓仁的山上来替人吹锅。这行当，比盗墓还生僻。 我看了看他身后那个矮个。矮个始终低着头，一只手插在裤兜里，兜里鼓鼓囊囊，装着一件硬东西。两人身上的衣裳下摆，都带着一股子味——煤油味，淡淡的，风一吹就散，可鼻子尖的人闻得出来。 他们不是来说理的。他们是来烧台的。 天，黑透了。 就在这时候，獾子道那头，亮起一点黄。 白头发老头提着那盏没罩子的油灯，一步一步走上来。走到台下，他从那两个人身边过去，看都没看他们一眼，径直上了台，把灯搁在台沿正中。 灯苗很小，却立得笔直。 他坐下，还是侧着身，脸埋在暗里。 \"掌柜呢？\"他问。 \"在路上。\"我说。 \"日头落了。\" \"路上有事，绊住了。\" \"绊住他的，不是路。\"老头抽出一根烟，没点，就那么叼着，\"是话。有人拿话把他绊在桓仁了。\" \"您怎么知道？\" \"猜的。\"他把烟从嘴上拿下来，\"干这行的人，最怕的不是刀子，是话。刀子伤人，话绊人。\" 我心里\"咯噔\"一下。把头在桓仁见的是老鼠男。是老鼠男绊的他？ \"按规矩，\"老头把烟从嘴上拿下来，\"账主不到台，账就不落他头上。认名分的人，接不接这笔账？\" 台下那瘦高个冷笑：\"他接不了。他一个背锅的，拿什么接？\" 老头没理他，只看着我。草帽人也从林子里站了起来，怀里抱着那盏白纸灯笼。 我张了张嘴，没出声。 接，就是把把头替我挡的那笔账，自己扛过来。 不接，就是当着三路人的面，把这口锅背下山，从此再不提名分。 老头等了片刻，见我不说话，便低下头，凑着那盏油灯，从怀里摸出一根捻子。 \"灯，我替你点着。\"他说，\"接不接账，天亮前，给我句话。\" 火折子凑上去，捻子\"噗\"地一声，着了。 就在灯苗亮起来的那一刹那，我看见两样东西—— 台下，草帽人把手里的白纸灯笼撑开了，白纸在风里鼓成一个圆；獾子道那头，瘦高个从怀里摸出一只洋铁皮的小桶，桶沿上，沾着一层亮亮的油。 灯苗立着，风在台下打转。 我忽然明白过来——今夜这台子上，谁都不是来看灯的。"}, {"id": "A5-084", "arc": "A5", "num": 84, "title": "过火", "md": "那桶煤油泼过来的时候，鱼哥先动的。\n\n瘦高个扬手的动作还没做完，鱼哥已经从我身边蹿了出去，一脚踹在他拿桶的那条胳膊上。铁皮桶飞出去，在半空翻了个个儿，油没泼到台上，泼了半台子外的碎石，哗啦一声，一股呛人的煤油味腾起来。\n\n矮个紧跟着扑上台，直奔台心的锅。\n\n他个子矮，可快得像只狸子，一只手插在裤兜里，另一只已经按在了锅沿上。\n\n我扑过去，一把抱住那口锅。\n\n他的胳膊肘撞在我肩窝上，闷闷一下，眼前直冒金星。我抱着锅不撒手，脚底下一滑，连人带锅往台边滚。他大概没料到我不躲不闪，愣了一下，伸手来掰我的手——那手跟铁钳子似的，我手背上的皮\"嘶\"地就开了。\n\n血珠子一颗一颗冒出来，我顾不上。矮个的另一只手去掀锅沿，我拿肩膀顶住他，两人在台心那块青石上扭成一团。他个子矮，力气却邪乎，膝盖一顶，把我整个人顶得离了地。我抱着锅不撒手，任他把我摔在台上，后脑勺磕在石头上，\"嗡\"的一声，眼前白了一片。\n\n\"松手！\"他嗓子又哑又急。\n\n\"不松。\"\n\n台边上，鱼哥已经跟瘦高个扭在了一处。那瘦高个看着瘦，劲却不小，两人滚在碎石堆里，谁也没占着便宜。鱼哥背上的旧伤被压了一下，闷哼了一声，可手底下没松，一记横肘砸在对方脸上，把瘦高个砸得往后一仰。\n\n瘦高个捂着鼻子，血从指缝里淌下来。他笑了一声，从腰后摸出一把扁扁的撬棍。鱼哥没等他抬起来，抬脚一踹，正踹在他手腕上，撬棍\"当啷\"滚到台下。两人又扭在碎石堆里，滚得一身土。\n\n布兜里的老避龙炸了毛，扑棱棱从兜里挣出来，在台边又扑又叫。\n\n\"台上有人点灯了——\"\n\n草帽人不知什么时候站到了台口，把那盏白纸灯笼高高举起来。白纸灯笼透着一圈暖黄的光，风一吹，晃晃悠悠，却始终没灭。他扯着嗓子喊：\n\n\"山里的眼睛，都看着呢！\"\n\n矮个的手顿了一下。\n\n就这一下，我把锅往怀里一揽，翻身坐起来，背抵着台沿，把锅护在身后。他站在我面前，胸口一起一伏，一双眼睛死死盯着我，盯着我怀里那口锅。\n\n\"你个背锅的，\"他从牙缝里挤出一句，\"命都不要了？\"\n\n我没答话。肩窝那块被他撞的地方，一阵一阵往外冒疼，手背上血顺着指缝往下淌，滴在青石台上，一滴一滴，洇开成小小的黑点。\n\n矮个盯着那几滴血，忽然压着嗓子骂了一句：\"早两年，我就该把这口破锅砸了。\"\n\n我心里一动。两年前，正是五进两出的那一年。\n\n他这话说得没头没尾，可我心里那根弦\"嗡\"地一下绷紧了。五进两出，两年前，一伙人进了鹰嘴沟，只出来一个。这口锅，就是打那回起，才在道上有了名。\n\n矮个没再往下说，只是死死盯着我怀里的锅，像是要把锅看穿。\n\n台底下，瘦高个喊了一声：\"别跟他磨！掀锅！\"\n\n瘦高个从碎石堆里爬起来，抹了一把嘴角的血，走到台前，看着那口锅，忽然笑了。\n\n\"好。\"他说，\"好一个背锅的。\"\n\n他往前一步。\n\n白头发老头动了。\n\n他一直坐在台沿那块平石头上，从我抱锅到这会儿，一动没动，像一截长在石头上的树桩。这会儿他伸出手，把那盏油灯往台心挪了挪，灯苗\"腾\"地往上跳了一下，把台子照得亮堂了些。瘦高个的影子被拉得老长，铺在台口，他一脚踩进去，像踩进一摊黑水，脚下就停住了。\n\n\"这锅，\"他开口，声音不高，却把台下的动静全压住了，\"有主了。\"\n\n瘦高个的脚步停住。\n\n\"它没认。\"他指着锅，\"认名分的还没认账。无主的锅，山不管。\"\n\n\"他抱着呢。\"老头抬了抬下巴，冲我，\"你问他认不认。\"\n\n三路人，六只眼睛，全落到我身上。\n\n台沿上那盏灯苗，把白头发老头的半边脸照出来，又埋进暗里。我到现在也没看清他的耳朵。\n\n我低下头，看怀里那口锅。\n\n锅底冲着地，锅口冲着我。陶胎上还有没擦净的灰。这口锅从鹰嘴沟的石室里出来，跟我走过雨夜，走过石缝，藏过炭窑，埋过偏屋，又让我背着爬了半座五女山。它不是我的，可它认我的手。它认了我认下的那个名分。\n\n王长顺临死前说，爹，锅是空的。\n\n锅是空的，可空锅也得有人背。\n\n\"认。\"我说。\n\n就一个字。\n\n瘦高个脸上的笑僵住了。\n\n\"你说什么？\"\n\n\"我说，账，我认。\"我抬起头，一字一顿，\"灯点起来，名分过明路。这笔账，从今夜起，落我头上。跟我们掌柜的，没关系了。\"\n\n台下静了。\n\n矮个回头去看瘦高个。草帽人举着的灯笼，光晃了一下。鱼哥从碎石堆里站起来，一瘸一拐走到我身边，没说话，就站在我旁边。\n\n我扶着锅站起来，腿肚子发软，后脑勺磕的那块，一阵一阵地跳。可我心里那口气，反倒顺了。\n\n从今往后，这笔账是我的了。我不再是替人背锅的那个，我是这口锅的主。\n\n这话我没说出口，只在心里过了一遍。可过完这一遍，我后背上的汗，反倒干了。\n\n人这一辈子，怕的不是担事，是不知道自己担的是什么事。这会儿我知道了。\n\n台上那盏灯，火苗小小的，照着锅，也照着我。\n\n白头发老头慢慢站起来，走到我面前，低头看了看我护着的那口锅，又看了看我手背上的血。\n\n\"认账的人，\"他说，\"山记得住。\"\n\n他从怀里摸出一样东西，蹲下身，放在台心那盏灯旁边。\n\n是一根捻好的灯芯。白棉线搓的，搓得很紧，绕成一圈，压在一块叠得方方正正的布上。那布是灰的，布角上，补着一小块蓝——\n\n细针脚。一针压着一针，齐得跟拿尺子量过。\n\n我心里\"轰\"地一下。\n\n蜂房炕洞里的铁盒，沟里石室北墙的红布条，老周铺子里那个白头发瘦子的袖口——一样的针脚，一样的蓝。\n\n\"这布，\"我嗓子发干，\"是从哪儿来的？\"\n\n老头没答，只把布往我这边推了推：\"拿着。线头在谁手里，谁就得把线接下去。\"\n\n\"这芯子，我替你捻好了。\"老头说，\"点不点，什么时候点，在你——不在我，也不在那些吹灯的。\"\n\n瘦高个盯着台上，脸上的肉抽了抽。\n\n\"行。\"他退了一步，又退了一步，\"账你认了，好。这笔账，往后就找你要。我等的，就是这一天。\"\n\n他转过身，冲矮个使了个眼色。矮个从台边退开，两人一前一后，顺着獾子道往下走。走了几步，瘦高个回过头，冲台上啐了一口：\n\n\"锅给你留着。账，也给你留着。你背得动锅，未必背得动账。\"\n\n脚步声顺着石阶往下，越走越远，最后化进了林子里。\n\n台上只剩我们三个，还有那盏灯。\n\n草帽人把白纸灯笼收了，冲台上拱了拱手，也退下护林道去了。\n\n他走得很快，白纸灯笼夹在腋下，一晃一晃的，像一只没点着的眼睛。\n\n我冲他背影喊了一声：\"替我谢你们那一路。\"\n\n他没回头，只摆了摆手。\n\n台子上安静下来，只剩风声和林子。\n\n鱼哥低头看了看我手背上的布条，说了一句：\"回去得打破伤风。\"\n\n\"山里哪来的破伤风针。\"我说。\n\n\"那就下山打。\"他把匕首插回鞋帮上，\"这口锅，往后还得你背着。手废了，锅就没人背了。\"\n\n我笑了一下，扯得肩窝生疼。\n\n鱼哥扯了衣裳下摆，给我把手背缠上，缠到一半，忽然停住，抬下巴朝那盏灯努了努嘴。\n\n我顺着看过去。\n\n风是从沟里往上灌的，从台子底下往北坡上吹。台上那棵歪脖老榆的枝条，被吹得哗哗响；台沿上的灰土，一阵一阵往北飘。\n\n可那盏灯的火苗，不往北倒。\n\n它歪着，斜斜地，朝着台心那口锅的方向，直直地倾过去。\n\n灯没动，风没停。\n\n我盯着那点火苗，盯了很久。\n\n它不是被风吹歪的。它是自己朝那口锅，倾过去的。\n\n台下的林子黑沉沉的，风从沟底往上卷，一阵比一阵紧。远处，五女山的崖壁在夜色里立着，像一堵没有门的墙。\n\n我忽然想起老陈说过的话——那老头坐过的石头，雨停了还是干的。\n\n有些事，从今夜起，我怕是躲不开了。", "words": 2834, "html": "<p>那桶煤油泼过来的时候，鱼哥先动的。<\/p>\n<p>瘦高个扬手的动作还没做完，鱼哥已经从我身边蹿了出去，一脚踹在他拿桶的那条胳膊上。铁皮桶飞出去，在半空翻了个个儿，油没泼到台上，泼了半台子外的碎石，哗啦一声，一股呛人的煤油味腾起来。<\/p>\n<p>矮个紧跟着扑上台，直奔台心的锅。<\/p>\n<p>他个子矮，可快得像只狸子，一只手插在裤兜里，另一只已经按在了锅沿上。<\/p>\n<p>我扑过去，一把抱住那口锅。<\/p>\n<p>他的胳膊肘撞在我肩窝上，闷闷一下，眼前直冒金星。我抱着锅不撒手，脚底下一滑，连人带锅往台边滚。他大概没料到我不躲不闪，愣了一下，伸手来掰我的手——那手跟铁钳子似的，我手背上的皮\"嘶\"地就开了。<\/p>\n<p>血珠子一颗一颗冒出来，我顾不上。矮个的另一只手去掀锅沿，我拿肩膀顶住他，两人在台心那块青石上扭成一团。他个子矮，力气却邪乎，膝盖一顶，把我整个人顶得离了地。我抱着锅不撒手，任他把我摔在台上，后脑勺磕在石头上，\"嗡\"的一声，眼前白了一片。<\/p>\n<p>\"松手！\"他嗓子又哑又急。<\/p>\n<p>\"不松。\"<\/p>\n<p>台边上，鱼哥已经跟瘦高个扭在了一处。那瘦高个看着瘦，劲却不小，两人滚在碎石堆里，谁也没占着便宜。鱼哥背上的旧伤被压了一下，闷哼了一声，可手底下没松，一记横肘砸在对方脸上，把瘦高个砸得往后一仰。<\/p>\n<p>瘦高个捂着鼻子，血从指缝里淌下来。他笑了一声，从腰后摸出一把扁扁的撬棍。鱼哥没等他抬起来，抬脚一踹，正踹在他手腕上，撬棍\"当啷\"滚到台下。两人又扭在碎石堆里，滚得一身土。<\/p>\n<p>布兜里的老避龙炸了毛，扑棱棱从兜里挣出来，在台边又扑又叫。<\/p>\n<p>\"台上有人点灯了——\"<\/p>\n<p>草帽人不知什么时候站到了台口，把那盏白纸灯笼高高举起来。白纸灯笼透着一圈暖黄的光，风一吹，晃晃悠悠，却始终没灭。他扯着嗓子喊：<\/p>\n<p>\"山里的眼睛，都看着呢！\"<\/p>\n<p>矮个的手顿了一下。<\/p>\n<p>就这一下，我把锅往怀里一揽，翻身坐起来，背抵着台沿，把锅护在身后。他站在我面前，胸口一起一伏，一双眼睛死死盯着我，盯着我怀里那口锅。<\/p>\n<p>\"你个背锅的，\"他从牙缝里挤出一句，\"命都不要了？\"<\/p>\n<p>我没答话。肩窝那块被他撞的地方，一阵一阵往外冒疼，手背上血顺着指缝往下淌，滴在青石台上，一滴一滴，洇开成小小的黑点。<\/p>\n<p>矮个盯着那几滴血，忽然压着嗓子骂了一句：\"早两年，我就该把这口破锅砸了。\"<\/p>\n<p>我心里一动。两年前，正是五进两出的那一年。<\/p>\n<p>他这话说得没头没尾，可我心里那根弦\"嗡\"地一下绷紧了。五进两出，两年前，一伙人进了鹰嘴沟，只出来一个。这口锅，就是打那回起，才在道上有了名。<\/p>\n<p>矮个没再往下说，只是死死盯着我怀里的锅，像是要把锅看穿。<\/p>\n<p>台底下，瘦高个喊了一声：\"别跟他磨！掀锅！\"<\/p>\n<p>瘦高个从碎石堆里爬起来，抹了一把嘴角的血，走到台前，看着那口锅，忽然笑了。<\/p>\n<p>\"好。\"他说，\"好一个背锅的。\"<\/p>\n<p>他往前一步。<\/p>\n<p>白头发老头动了。<\/p>\n<p>他一直坐在台沿那块平石头上，从我抱锅到这会儿，一动没动，像一截长在石头上的树桩。这会儿他伸出手，把那盏油灯往台心挪了挪，灯苗\"腾\"地往上跳了一下，把台子照得亮堂了些。瘦高个的影子被拉得老长，铺在台口，他一脚踩进去，像踩进一摊黑水，脚下就停住了。<\/p>\n<p>\"这锅，\"他开口，声音不高，却把台下的动静全压住了，\"有主了。\"<\/p>\n<p>瘦高个的脚步停住。<\/p>\n<p>\"它没认。\"他指着锅，\"认名分的还没认账。无主的锅，山不管。\"<\/p>\n<p>\"他抱着呢。\"老头抬了抬下巴，冲我，\"你问他认不认。\"<\/p>\n<p>三路人，六只眼睛，全落到我身上。<\/p>\n<p>台沿上那盏灯苗，把白头发老头的半边脸照出来，又埋进暗里。我到现在也没看清他的耳朵。<\/p>\n<p>我低下头，看怀里那口锅。<\/p>\n<p>锅底冲着地，锅口冲着我。陶胎上还有没擦净的灰。这口锅从鹰嘴沟的石室里出来，跟我走过雨夜，走过石缝，藏过炭窑，埋过偏屋，又让我背着爬了半座五女山。它不是我的，可它认我的手。它认了我认下的那个名分。<\/p>\n<p>王长顺临死前说，爹，锅是空的。<\/p>\n<p>锅是空的，可空锅也得有人背。<\/p>\n<p>\"认。\"我说。<\/p>\n<p>就一个字。<\/p>\n<p>瘦高个脸上的笑僵住了。<\/p>\n<p>\"你说什么？\"<\/p>\n<p>\"我说，账，我认。\"我抬起头，一字一顿，\"灯点起来，名分过明路。这笔账，从今夜起，落我头上。跟我们掌柜的，没关系了。\"<\/p>\n<p>台下静了。<\/p>\n<p>矮个回头去看瘦高个。草帽人举着的灯笼，光晃了一下。鱼哥从碎石堆里站起来，一瘸一拐走到我身边，没说话，就站在我旁边。<\/p>\n<p>我扶着锅站起来，腿肚子发软，后脑勺磕的那块，一阵一阵地跳。可我心里那口气，反倒顺了。<\/p>\n<p>从今往后，这笔账是我的了。我不再是替人背锅的那个，我是这口锅的主。<\/p>\n<p>这话我没说出口，只在心里过了一遍。可过完这一遍，我后背上的汗，反倒干了。<\/p>\n<p>人这一辈子，怕的不是担事，是不知道自己担的是什么事。这会儿我知道了。<\/p>\n<p>台上那盏灯，火苗小小的，照着锅，也照着我。<\/p>\n<p>白头发老头慢慢站起来，走到我面前，低头看了看我护着的那口锅，又看了看我手背上的血。<\/p>\n<p>\"认账的人，\"他说，\"山记得住。\"<\/p>\n<p>他从怀里摸出一样东西，蹲下身，放在台心那盏灯旁边。<\/p>\n<p>是一根捻好的灯芯。白棉线搓的，搓得很紧，绕成一圈，压在一块叠得方方正正的布上。那布是灰的，布角上，补着一小块蓝——<\/p>\n<p>细针脚。一针压着一针，齐得跟拿尺子量过。<\/p>\n<p>我心里\"轰\"地一下。<\/p>\n<p>蜂房炕洞里的铁盒，沟里石室北墙的红布条，老周铺子里那个白头发瘦子的袖口——一样的针脚，一样的蓝。<\/p>\n<p>\"这布，\"我嗓子发干，\"是从哪儿来的？\"<\/p>\n<p>老头没答，只把布往我这边推了推：\"拿着。线头在谁手里，谁就得把线接下去。\"<\/p>\n<p>\"这芯子，我替你捻好了。\"老头说，\"点不点，什么时候点，在你——不在我，也不在那些吹灯的。\"<\/p>\n<p>瘦高个盯着台上，脸上的肉抽了抽。<\/p>\n<p>\"行。\"他退了一步，又退了一步，\"账你认了，好。这笔账，往后就找你要。我等的，就是这一天。\"<\/p>\n<p>他转过身，冲矮个使了个眼色。矮个从台边退开，两人一前一后，顺着獾子道往下走。走了几步，瘦高个回过头，冲台上啐了一口：<\/p>\n<p>\"锅给你留着。账，也给你留着。你背得动锅，未必背得动账。\"<\/p>\n<p>脚步声顺着石阶往下，越走越远，最后化进了林子里。<\/p>\n<p>台上只剩我们三个，还有那盏灯。<\/p>\n<p>草帽人把白纸灯笼收了，冲台上拱了拱手，也退下护林道去了。<\/p>\n<p>他走得很快，白纸灯笼夹在腋下，一晃一晃的，像一只没点着的眼睛。<\/p>\n<p>我冲他背影喊了一声：\"替我谢你们那一路。\"<\/p>\n<p>他没回头，只摆了摆手。<\/p>\n<p>台子上安静下来，只剩风声和林子。<\/p>\n<p>鱼哥低头看了看我手背上的布条，说了一句：\"回去得打破伤风。\"<\/p>\n<p>\"山里哪来的破伤风针。\"我说。<\/p>\n<p>\"那就下山打。\"他把匕首插回鞋帮上，\"这口锅，往后还得你背着。手废了，锅就没人背了。\"<\/p>\n<p>我笑了一下，扯得肩窝生疼。<\/p>\n<p>鱼哥扯了衣裳下摆，给我把手背缠上，缠到一半，忽然停住，抬下巴朝那盏灯努了努嘴。<\/p>\n<p>我顺着看过去。<\/p>\n<p>风是从沟里往上灌的，从台子底下往北坡上吹。台上那棵歪脖老榆的枝条，被吹得哗哗响；台沿上的灰土，一阵一阵往北飘。<\/p>\n<p>可那盏灯的火苗，不往北倒。<\/p>\n<p>它歪着，斜斜地，朝着台心那口锅的方向，直直地倾过去。<\/p>\n<p>灯没动，风没停。<\/p>\n<p>我盯着那点火苗，盯了很久。<\/p>\n<p>它不是被风吹歪的。它是自己朝那口锅，倾过去的。<\/p>\n<p>台下的林子黑沉沉的，风从沟底往上卷，一阵比一阵紧。远处，五女山的崖壁在夜色里立着，像一堵没有门的墙。<\/p>\n<p>我忽然想起老陈说过的话——那老头坐过的石头，雨停了还是干的。<\/p>\n<p>有些事，从今夜起，我怕是躲不开了。<\/p>", "plain": "那桶煤油泼过来的时候，鱼哥先动的。 瘦高个扬手的动作还没做完，鱼哥已经从我身边蹿了出去，一脚踹在他拿桶的那条胳膊上。铁皮桶飞出去，在半空翻了个个儿，油没泼到台上，泼了半台子外的碎石，哗啦一声，一股呛人的煤油味腾起来。 矮个紧跟着扑上台，直奔台心的锅。 他个子矮，可快得像只狸子，一只手插在裤兜里，另一只已经按在了锅沿上。 我扑过去，一把抱住那口锅。 他的胳膊肘撞在我肩窝上，闷闷一下，眼前直冒金星。我抱着锅不撒手，脚底下一滑，连人带锅往台边滚。他大概没料到我不躲不闪，愣了一下，伸手来掰我的手——那手跟铁钳子似的，我手背上的皮\"嘶\"地就开了。 血珠子一颗一颗冒出来，我顾不上。矮个的另一只手去掀锅沿，我拿肩膀顶住他，两人在台心那块青石上扭成一团。他个子矮，力气却邪乎，膝盖一顶，把我整个人顶得离了地。我抱着锅不撒手，任他把我摔在台上，后脑勺磕在石头上，\"嗡\"的一声，眼前白了一片。 \"松手！\"他嗓子又哑又急。 \"不松。\" 台边上，鱼哥已经跟瘦高个扭在了一处。那瘦高个看着瘦，劲却不小，两人滚在碎石堆里，谁也没占着便宜。鱼哥背上的旧伤被压了一下，闷哼了一声，可手底下没松，一记横肘砸在对方脸上，把瘦高个砸得往后一仰。 瘦高个捂着鼻子，血从指缝里淌下来。他笑了一声，从腰后摸出一把扁扁的撬棍。鱼哥没等他抬起来，抬脚一踹，正踹在他手腕上，撬棍\"当啷\"滚到台下。两人又扭在碎石堆里，滚得一身土。 布兜里的老避龙炸了毛，扑棱棱从兜里挣出来，在台边又扑又叫。 \"台上有人点灯了——\" 草帽人不知什么时候站到了台口，把那盏白纸灯笼高高举起来。白纸灯笼透着一圈暖黄的光，风一吹，晃晃悠悠，却始终没灭。他扯着嗓子喊： \"山里的眼睛，都看着呢！\" 矮个的手顿了一下。 就这一下，我把锅往怀里一揽，翻身坐起来，背抵着台沿，把锅护在身后。他站在我面前，胸口一起一伏，一双眼睛死死盯着我，盯着我怀里那口锅。 \"你个背锅的，\"他从牙缝里挤出一句，\"命都不要了？\" 我没答话。肩窝那块被他撞的地方，一阵一阵往外冒疼，手背上血顺着指缝往下淌，滴在青石台上，一滴一滴，洇开成小小的黑点。 矮个盯着那几滴血，忽然压着嗓子骂了一句：\"早两年，我就该把这口破锅砸了。\" 我心里一动。两年前，正是五进两出的那一年。 他这话说得没头没尾，可我心里那根弦\"嗡\"地一下绷紧了。五进两出，两年前，一伙人进了鹰嘴沟，只出来一个。这口锅，就是打那回起，才在道上有了名。 矮个没再往下说，只是死死盯着我怀里的锅，像是要把锅看穿。 台底下，瘦高个喊了一声：\"别跟他磨！掀锅！\" 瘦高个从碎石堆里爬起来，抹了一把嘴角的血，走到台前，看着那口锅，忽然笑了。 \"好。\"他说，\"好一个背锅的。\" 他往前一步。 白头发老头动了。 他一直坐在台沿那块平石头上，从我抱锅到这会儿，一动没动，像一截长在石头上的树桩。这会儿他伸出手，把那盏油灯往台心挪了挪，灯苗\"腾\"地往上跳了一下，把台子照得亮堂了些。瘦高个的影子被拉得老长，铺在台口，他一脚踩进去，像踩进一摊黑水，脚下就停住了。 \"这锅，\"他开口，声音不高，却把台下的动静全压住了，\"有主了。\" 瘦高个的脚步停住。 \"它没认。\"他指着锅，\"认名分的还没认账。无主的锅，山不管。\" \"他抱着呢。\"老头抬了抬下巴，冲我，\"你问他认不认。\" 三路人，六只眼睛，全落到我身上。 台沿上那盏灯苗，把白头发老头的半边脸照出来，又埋进暗里。我到现在也没看清他的耳朵。 我低下头，看怀里那口锅。 锅底冲着地，锅口冲着我。陶胎上还有没擦净的灰。这口锅从鹰嘴沟的石室里出来，跟我走过雨夜，走过石缝，藏过炭窑，埋过偏屋，又让我背着爬了半座五女山。它不是我的，可它认我的手。它认了我认下的那个名分。 王长顺临死前说，爹，锅是空的。 锅是空的，可空锅也得有人背。 \"认。\"我说。 就一个字。 瘦高个脸上的笑僵住了。 \"你说什么？\" \"我说，账，我认。\"我抬起头，一字一顿，\"灯点起来，名分过明路。这笔账，从今夜起，落我头上。跟我们掌柜的，没关系了。\" 台下静了。 矮个回头去看瘦高个。草帽人举着的灯笼，光晃了一下。鱼哥从碎石堆里站起来，一瘸一拐走到我身边，没说话，就站在我旁边。 我扶着锅站起来，腿肚子发软，后脑勺磕的那块，一阵一阵地跳。可我心里那口气，反倒顺了。 从今往后，这笔账是我的了。我不再是替人背锅的那个，我是这口锅的主。 这话我没说出口，只在心里过了一遍。可过完这一遍，我后背上的汗，反倒干了。 人这一辈子，怕的不是担事，是不知道自己担的是什么事。这会儿我知道了。 台上那盏灯，火苗小小的，照着锅，也照着我。 白头发老头慢慢站起来，走到我面前，低头看了看我护着的那口锅，又看了看我手背上的血。 \"认账的人，\"他说，\"山记得住。\" 他从怀里摸出一样东西，蹲下身，放在台心那盏灯旁边。 是一根捻好的灯芯。白棉线搓的，搓得很紧，绕成一圈，压在一块叠得方方正正的布上。那布是灰的，布角上，补着一小块蓝—— 细针脚。一针压着一针，齐得跟拿尺子量过。 我心里\"轰\"地一下。 蜂房炕洞里的铁盒，沟里石室北墙的红布条，老周铺子里那个白头发瘦子的袖口——一样的针脚，一样的蓝。 \"这布，\"我嗓子发干，\"是从哪儿来的？\" 老头没答，只把布往我这边推了推：\"拿着。线头在谁手里，谁就得把线接下去。\" \"这芯子，我替你捻好了。\"老头说，\"点不点，什么时候点，在你——不在我，也不在那些吹灯的。\" 瘦高个盯着台上，脸上的肉抽了抽。 \"行。\"他退了一步，又退了一步，\"账你认了，好。这笔账，往后就找你要。我等的，就是这一天。\" 他转过身，冲矮个使了个眼色。矮个从台边退开，两人一前一后，顺着獾子道往下走。走了几步，瘦高个回过头，冲台上啐了一口： \"锅给你留着。账，也给你留着。你背得动锅，未必背得动账。\" 脚步声顺着石阶往下，越走越远，最后化进了林子里。 台上只剩我们三个，还有那盏灯。 草帽人把白纸灯笼收了，冲台上拱了拱手，也退下护林道去了。 他走得很快，白纸灯笼夹在腋下，一晃一晃的，像一只没点着的眼睛。 我冲他背影喊了一声：\"替我谢你们那一路。\" 他没回头，只摆了摆手。 台子上安静下来，只剩风声和林子。 鱼哥低头看了看我手背上的布条，说了一句：\"回去得打破伤风。\" \"山里哪来的破伤风针。\"我说。 \"那就下山打。\"他把匕首插回鞋帮上，\"这口锅，往后还得你背着。手废了，锅就没人背了。\" 我笑了一下，扯得肩窝生疼。 鱼哥扯了衣裳下摆，给我把手背缠上，缠到一半，忽然停住，抬下巴朝那盏灯努了努嘴。 我顺着看过去。 风是从沟里往上灌的，从台子底下往北坡上吹。台上那棵歪脖老榆的枝条，被吹得哗哗响；台沿上的灰土，一阵一阵往北飘。 可那盏灯的火苗，不往北倒。 它歪着，斜斜地，朝着台心那口锅的方向，直直地倾过去。 灯没动，风没停。 我盯着那点火苗，盯了很久。 它不是被风吹歪的。它是自己朝那口锅，倾过去的。 台下的林子黑沉沉的，风从沟底往上卷，一阵比一阵紧。远处，五女山的崖壁在夜色里立着，像一堵没有门的墙。 我忽然想起老陈说过的话——那老头坐过的石头，雨停了还是干的。 有些事，从今夜起，我怕是躲不开了。"}, {"id": "A5-085", "arc": "A5", "num": 85, "title": "承账", "md": "那一夜，剩下的时辰，是我这辈子过得最慢的一夜。\n\n鱼哥把我的手背缠好，又去收拾台边泼了油的碎石。油味呛人，他用土盖了一层，才压下去大半。台角被溅上的煤油燎了一块，青石面上留着一小片焦黑，像谁在石头上按了个指印。\n\n白头发老头没走。他坐在台沿那块平石头上，守着那盏油灯，一根接一根地抽烟。烟头一明一灭，跟灯苗对着眨眼睛。\n\n我靠在老榆树根上，肩窝一阵一阵地疼。手背上那根布条被血浸透了，风一吹，凉丝丝的。\n\n\"疼不疼？\"老头忽然问。\n\n\"疼。\"\n\n\"疼是好事。\"他把烟头在石头上按灭，\"不疼的人，背不动账。\"\n\n\"我不怕疼。\"我说，\"我怕的是，这笔账认下来，往后的路，就是您说的那条——走一条，记一笔。\"\n\n\"怕就对了。\"老头说，\"不怕的人，走不到头。\"\n\n\"走到头，是什么？\"\n\n\"我要是知道，\"他笑了一下，笑纹在灯苗底下闪了闪，\"我早走过去了。\"\n\n他没再多说。这一夜，他就坐在台沿上，一根接一根地抽烟。我数着台子底下的林涛声，一声一声，数到后来，也数不清了。\n\n我看着他。灯苗的光只够照到他半边脸，另半边埋在暗里，看不清。\n\n\"我问您一句话。\"我说，\"沟里那道缝口，夜里也坐着一个人。灰褂子，黑布鞋，缺了多半截左耳。\"\n\n老头抽烟的动作停了一下。\n\n\"他跟你，什么关系？\"\n\n他把烟从嘴里拿下来，看着灯苗，看了很久。\n\n\"这话，\"他说，\"我不答。你往后自己看。看明白了，比我说一百句都强。\"\n\n我没再追问。有些话，问急了，反而不真。\n\n\"那这个呢？\"我指了指台心那盏灯旁边的灯芯和那块补蓝布，\"您给我这个，是什么意思？\"\n\n\"意思就是，灯在你手里了。\"他说，\"五盏灯，四盏有了主。剩这一盏，我没给你点——我把芯子给你。点不点，什么时候点，你自己拿主意。\"\n\n\"点了会怎么样？\"\n\n\"点了，名分就明。\"他说，\"吹灯的那一路，就再没有'它无主'这句话可讲。到时候，他们要么认你，要么跟你死磕，没有第三条道。\"\n\n\"不点呢？\"\n\n\"不点，名分就压在你身上，压一天，山记一天。\"他站起来，拍了拍褂子上的土，\"账认了，是认了这笔债；灯点不点，是你要不要把这笔债还出去。两码事。\"\n\n\"我还有一句。\"我说，\"点灯的那一路，说灯点起来，账就清了。您说账跟着名分走。两句不一样，我该信哪一句？\"\n\n老头看了我一眼，那一眼在灯苗底下，深得看不见底。\n\n\"信你自己听见的。\"他说，\"别人的话，都是拿嘴说的。账，是拿命记的。\"\n\n我没再问。\n\n我低头看那块补蓝布。布是灰的，蓝补丁不大，针脚细得吓人，一针压着一针，齐得像拿尺子量过。\n\n\"这布，\"我忍不住问，\"是谁缝的？\"\n\n\"老物件了。\"他把油灯端起来，往台下走，\"谁缝的不要紧。要紧的是，缝东西的人，把线头留在了谁手里。\"\n\n他走到台口，停了一下。\n\n\"背锅的，记住我一句话。\"\n\n\"您说。\"\n\n\"承了账，'守'字就上身了。往后这山里的路，你走一条，它记一笔。它要东西，你就得给；给不起，就欠着。欠账的人，走夜路，多留神。\"\n\n说完，那点灯火顺着獾子道，一层一层往下沉，沉进林子里，就没了。\n\n天蒙蒙亮的时候，把头来了。\n\n他是从护林道正路上爬上来的，裤腿上沾满了泥，鞋帮子也湿了半截，一上到台子口，先扶着老榆树喘了半天气，才抬头看台。\n\n他一眼看见那口扣在台心的锅，又看见我手上缠着的布，脸色沉了沉。\n\n\"伤着了？\"\n\n\"皮外伤。\"我说，\"不碍事。\"\n\n他把肩上挎的布包搁下，蹲在台沿上，掏出烟来卷，卷到一半，手指停住了。他从怀里摸出一样东西，搁在台沿上。\n\n是那盒刻着\"灭\"字的火柴。\n\n他又从台心把那根捻好的灯芯和补蓝布拿过来，两样东西，一样一样摆在灯苗的两边。\n\n一边一个\"灭\"，一边一根芯。\n\n\"三路人，都来了。\"他看着这两样东西，慢慢地说，\"点灯的来了，吹灯的来了，问灯的也来了。就我，来晚了。\"\n\n\"您被绊住了？\"\n\n\"老鼠男拉着我说了一下午的灯。\"把头卷好烟，点着，抽了一口，\"从三点说到天擦黑，一句正经话没有，就是不让我动身。等我回过味来，日头已经落了。\"\n\n他顿了顿：\"绊住我的不是路，是话。有人不想让我上台。\"\n\n\"不想让您上台，是不想让账落您头上。\"我说。\n\n\"那账，落谁头上了？\"\n\n我看着他，没吭声。\n\n把头也不催我。他抽着烟，把台子上上下下扫了一遍——焦黑的台角、泼了油的碎石、台心那口锅，最后，目光落在我脸上。\n\n\"你认了？\"\n\n\"认了。\"\n\n烟在他指间烧了一截，灰掉在台沿上。\n\n我原以为他要骂我。他没骂。他把烟在鞋底上摁灭，站起来，走到我身边，伸手在我肩上拍了拍，拍得很轻。\n\n\"认账，不丢人。\"他说，\"赖账，才丢人。你从沟里把锅背出来那天，这笔账就早晚得有人认。你不认，就得我认。你抢在前头，是你的孝心。下回别抢，你还年轻。\"\n\n他这话说得平淡，我鼻子却有点发酸。\n\n\"您早知道会这样？\"我问。\n\n\"我要是早知道，\"把头把烟灰弹在台沿外头，\"就不该让你先上来。\"\n\n\"那您还让我来。\"\n\n\"因为这话，得你自己听。\"他看着我，\"我要是替你把话听了，账认在你身上，你也只是个背锅的。你自己听的，自己认的，往后才立得住。\"\n\n我点点头。风从台子底下往上吹，把台心的灯苗吹得晃了一晃，又立住了。\n\n\"灯呢？\"他问。\n\n\"没点。\"我说，\"芯子留在我这儿了。\"\n\n\"留得好。\"把头点点头，\"灯一明，这山里就再没安稳日子。芯子在咱们手里，什么时候点，咱们说了算。这一点，比什么都强。\"\n\n太阳从东边升起来，照在五女山的青石崖上，把台子照得亮堂堂的。\n\n鱼哥蹲在台边，把散在地上的碎石一块一块归拢。他忽然说：\"昨儿夜里，那矮个使的是北派的擒拿路子。\"\n\n\"北派？\"\n\n\"嗯。\"他拍了拍手上的土，\"跟我师傅一路。可他们不认我。\"\n\n他说这话的时候语气很平，可我听出点别的意思来。\n\n我们收拾东西下山。我把锅从台上抱起来，往背上一勒——\n\n就在锅离开台心的那一刹那，我看见印子里多了一样东西。\n\n那道圆印的印心，多了一道新鲜的划痕。不长，寸把长，直直的，像是有人拿硬物的尖儿，在石头上一划到底。石屑还是新的，白生生地嵌在印子里。\n\n我愣了一下，蹲下去，伸手摸了摸那道痕。\n\n不是锅压的。锅底是圆的，压不出这么直的线。\n\n昨夜这台子上，从点灯到过火到散场，我、鱼哥、白头发老头、草帽人、瘦高个、矮个——六个人，谁都没拿硬物在台心划过。\n\n那这道痕，是谁划的？\n\n我把锅背起来，站在台边，往四下里看。晨光里，护林道是空的，獾子道是空的，北坡的林子安安静静。\n\n下到护林道口，老陈正蹲在屋门口劈柴。他抬头看见我手上缠的布，眼皮抬了抬，什么也没多问。\n\n\"台子上出事了？\"他只问了这一句。\n\n\"出了点。\"我说，\"烧了半台子，人没事。\"\n\n\"锅呢？\"\n\n\"锅好好的。\"\n\n老陈\"嗯\"了一声，把劈好的柴往墙根一摞：\"锅好好的就行。别的，我一个看林的，管不着。\"\n\n他顿了顿，又补一句：\"往后那老头要是再来，我还给你们捎信。\"\n\n我谢了他，进屋打电话。电话那头，豆芽仔压着嗓子，说了一句话，把刚下山的一点轻松全给我抽走了。\n\n\"哥，\"他说，\"今儿一早，草帽人又去老周店了。他让老周给你们带句话——\"\n\n\"什么话？\"\n\n\"他说，'账接了，灯会就开在五月节前。到那天，五部的东西，散的，都得回来。'\"\n\n我握着话筒，半天没出声。\n\n五月。\n\n沟里那个缺耳的白发老头，说他没有提过五月。\n\n可如今，有人把\"五月\"两个字，明明白白地摆到了我面前。\n\n我把话筒放回去，站在屋门口，往上看。\n\n半坡上，扣锅台被日头照着，青石泛白。台边那棵歪脖老榆，风一吹，枝条哗啦啦地响，像有人在台上翻纸。\n\n我忽然想起沟里那道缝口，想起缺耳老头说的那句话——\"我没说五月，你听岔了。\"\n\n他说他没说。\n\n可这世上，知道\"五月\"的，不止他一个。", "words": 2978, "html": "<p>那一夜，剩下的时辰，是我这辈子过得最慢的一夜。<\/p>\n<p>鱼哥把我的手背缠好，又去收拾台边泼了油的碎石。油味呛人，他用土盖了一层，才压下去大半。台角被溅上的煤油燎了一块，青石面上留着一小片焦黑，像谁在石头上按了个指印。<\/p>\n<p>白头发老头没走。他坐在台沿那块平石头上，守着那盏油灯，一根接一根地抽烟。烟头一明一灭，跟灯苗对着眨眼睛。<\/p>\n<p>我靠在老榆树根上，肩窝一阵一阵地疼。手背上那根布条被血浸透了，风一吹，凉丝丝的。<\/p>\n<p>\"疼不疼？\"老头忽然问。<\/p>\n<p>\"疼。\"<\/p>\n<p>\"疼是好事。\"他把烟头在石头上按灭，\"不疼的人，背不动账。\"<\/p>\n<p>\"我不怕疼。\"我说，\"我怕的是，这笔账认下来，往后的路，就是您说的那条——走一条，记一笔。\"<\/p>\n<p>\"怕就对了。\"老头说，\"不怕的人，走不到头。\"<\/p>\n<p>\"走到头，是什么？\"<\/p>\n<p>\"我要是知道，\"他笑了一下，笑纹在灯苗底下闪了闪，\"我早走过去了。\"<\/p>\n<p>他没再多说。这一夜，他就坐在台沿上，一根接一根地抽烟。我数着台子底下的林涛声，一声一声，数到后来，也数不清了。<\/p>\n<p>我看着他。灯苗的光只够照到他半边脸，另半边埋在暗里，看不清。<\/p>\n<p>\"我问您一句话。\"我说，\"沟里那道缝口，夜里也坐着一个人。灰褂子，黑布鞋，缺了多半截左耳。\"<\/p>\n<p>老头抽烟的动作停了一下。<\/p>\n<p>\"他跟你，什么关系？\"<\/p>\n<p>他把烟从嘴里拿下来，看着灯苗，看了很久。<\/p>\n<p>\"这话，\"他说，\"我不答。你往后自己看。看明白了，比我说一百句都强。\"<\/p>\n<p>我没再追问。有些话，问急了，反而不真。<\/p>\n<p>\"那这个呢？\"我指了指台心那盏灯旁边的灯芯和那块补蓝布，\"您给我这个，是什么意思？\"<\/p>\n<p>\"意思就是，灯在你手里了。\"他说，\"五盏灯，四盏有了主。剩这一盏，我没给你点——我把芯子给你。点不点，什么时候点，你自己拿主意。\"<\/p>\n<p>\"点了会怎么样？\"<\/p>\n<p>\"点了，名分就明。\"他说，\"吹灯的那一路，就再没有'它无主'这句话可讲。到时候，他们要么认你，要么跟你死磕，没有第三条道。\"<\/p>\n<p>\"不点呢？\"<\/p>\n<p>\"不点，名分就压在你身上，压一天，山记一天。\"他站起来，拍了拍褂子上的土，\"账认了，是认了这笔债；灯点不点，是你要不要把这笔债还出去。两码事。\"<\/p>\n<p>\"我还有一句。\"我说，\"点灯的那一路，说灯点起来，账就清了。您说账跟着名分走。两句不一样，我该信哪一句？\"<\/p>\n<p>老头看了我一眼，那一眼在灯苗底下，深得看不见底。<\/p>\n<p>\"信你自己听见的。\"他说，\"别人的话，都是拿嘴说的。账，是拿命记的。\"<\/p>\n<p>我没再问。<\/p>\n<p>我低头看那块补蓝布。布是灰的，蓝补丁不大，针脚细得吓人，一针压着一针，齐得像拿尺子量过。<\/p>\n<p>\"这布，\"我忍不住问，\"是谁缝的？\"<\/p>\n<p>\"老物件了。\"他把油灯端起来，往台下走，\"谁缝的不要紧。要紧的是，缝东西的人，把线头留在了谁手里。\"<\/p>\n<p>他走到台口，停了一下。<\/p>\n<p>\"背锅的，记住我一句话。\"<\/p>\n<p>\"您说。\"<\/p>\n<p>\"承了账，'守'字就上身了。往后这山里的路，你走一条，它记一笔。它要东西，你就得给；给不起，就欠着。欠账的人，走夜路，多留神。\"<\/p>\n<p>说完，那点灯火顺着獾子道，一层一层往下沉，沉进林子里，就没了。<\/p>\n<p>天蒙蒙亮的时候，把头来了。<\/p>\n<p>他是从护林道正路上爬上来的，裤腿上沾满了泥，鞋帮子也湿了半截，一上到台子口，先扶着老榆树喘了半天气，才抬头看台。<\/p>\n<p>他一眼看见那口扣在台心的锅，又看见我手上缠着的布，脸色沉了沉。<\/p>\n<p>\"伤着了？\"<\/p>\n<p>\"皮外伤。\"我说，\"不碍事。\"<\/p>\n<p>他把肩上挎的布包搁下，蹲在台沿上，掏出烟来卷，卷到一半，手指停住了。他从怀里摸出一样东西，搁在台沿上。<\/p>\n<p>是那盒刻着\"灭\"字的火柴。<\/p>\n<p>他又从台心把那根捻好的灯芯和补蓝布拿过来，两样东西，一样一样摆在灯苗的两边。<\/p>\n<p>一边一个\"灭\"，一边一根芯。<\/p>\n<p>\"三路人，都来了。\"他看着这两样东西，慢慢地说，\"点灯的来了，吹灯的来了，问灯的也来了。就我，来晚了。\"<\/p>\n<p>\"您被绊住了？\"<\/p>\n<p>\"老鼠男拉着我说了一下午的灯。\"把头卷好烟，点着，抽了一口，\"从三点说到天擦黑，一句正经话没有，就是不让我动身。等我回过味来，日头已经落了。\"<\/p>\n<p>他顿了顿：\"绊住我的不是路，是话。有人不想让我上台。\"<\/p>\n<p>\"不想让您上台，是不想让账落您头上。\"我说。<\/p>\n<p>\"那账，落谁头上了？\"<\/p>\n<p>我看着他，没吭声。<\/p>\n<p>把头也不催我。他抽着烟，把台子上上下下扫了一遍——焦黑的台角、泼了油的碎石、台心那口锅，最后，目光落在我脸上。<\/p>\n<p>\"你认了？\"<\/p>\n<p>\"认了。\"<\/p>\n<p>烟在他指间烧了一截，灰掉在台沿上。<\/p>\n<p>我原以为他要骂我。他没骂。他把烟在鞋底上摁灭，站起来，走到我身边，伸手在我肩上拍了拍，拍得很轻。<\/p>\n<p>\"认账，不丢人。\"他说，\"赖账，才丢人。你从沟里把锅背出来那天，这笔账就早晚得有人认。你不认，就得我认。你抢在前头，是你的孝心。下回别抢，你还年轻。\"<\/p>\n<p>他这话说得平淡，我鼻子却有点发酸。<\/p>\n<p>\"您早知道会这样？\"我问。<\/p>\n<p>\"我要是早知道，\"把头把烟灰弹在台沿外头，\"就不该让你先上来。\"<\/p>\n<p>\"那您还让我来。\"<\/p>\n<p>\"因为这话，得你自己听。\"他看着我，\"我要是替你把话听了，账认在你身上，你也只是个背锅的。你自己听的，自己认的，往后才立得住。\"<\/p>\n<p>我点点头。风从台子底下往上吹，把台心的灯苗吹得晃了一晃，又立住了。<\/p>\n<p>\"灯呢？\"他问。<\/p>\n<p>\"没点。\"我说，\"芯子留在我这儿了。\"<\/p>\n<p>\"留得好。\"把头点点头，\"灯一明，这山里就再没安稳日子。芯子在咱们手里，什么时候点，咱们说了算。这一点，比什么都强。\"<\/p>\n<p>太阳从东边升起来，照在五女山的青石崖上，把台子照得亮堂堂的。<\/p>\n<p>鱼哥蹲在台边，把散在地上的碎石一块一块归拢。他忽然说：\"昨儿夜里，那矮个使的是北派的擒拿路子。\"<\/p>\n<p>\"北派？\"<\/p>\n<p>\"嗯。\"他拍了拍手上的土，\"跟我师傅一路。可他们不认我。\"<\/p>\n<p>他说这话的时候语气很平，可我听出点别的意思来。<\/p>\n<p>我们收拾东西下山。我把锅从台上抱起来，往背上一勒——<\/p>\n<p>就在锅离开台心的那一刹那，我看见印子里多了一样东西。<\/p>\n<p>那道圆印的印心，多了一道新鲜的划痕。不长，寸把长，直直的，像是有人拿硬物的尖儿，在石头上一划到底。石屑还是新的，白生生地嵌在印子里。<\/p>\n<p>我愣了一下，蹲下去，伸手摸了摸那道痕。<\/p>\n<p>不是锅压的。锅底是圆的，压不出这么直的线。<\/p>\n<p>昨夜这台子上，从点灯到过火到散场，我、鱼哥、白头发老头、草帽人、瘦高个、矮个——六个人，谁都没拿硬物在台心划过。<\/p>\n<p>那这道痕，是谁划的？<\/p>\n<p>我把锅背起来，站在台边，往四下里看。晨光里，护林道是空的，獾子道是空的，北坡的林子安安静静。<\/p>\n<p>下到护林道口，老陈正蹲在屋门口劈柴。他抬头看见我手上缠的布，眼皮抬了抬，什么也没多问。<\/p>\n<p>\"台子上出事了？\"他只问了这一句。<\/p>\n<p>\"出了点。\"我说，\"烧了半台子，人没事。\"<\/p>\n<p>\"锅呢？\"<\/p>\n<p>\"锅好好的。\"<\/p>\n<p>老陈\"嗯\"了一声，把劈好的柴往墙根一摞：\"锅好好的就行。别的，我一个看林的，管不着。\"<\/p>\n<p>他顿了顿，又补一句：\"往后那老头要是再来，我还给你们捎信。\"<\/p>\n<p>我谢了他，进屋打电话。电话那头，豆芽仔压着嗓子，说了一句话，把刚下山的一点轻松全给我抽走了。<\/p>\n<p>\"哥，\"他说，\"今儿一早，草帽人又去老周店了。他让老周给你们带句话——\"<\/p>\n<p>\"什么话？\"<\/p>\n<p>\"他说，'账接了，灯会就开在五月节前。到那天，五部的东西，散的，都得回来。'\"<\/p>\n<p>我握着话筒，半天没出声。<\/p>\n<p>五月。<\/p>\n<p>沟里那个缺耳的白发老头，说他没有提过五月。<\/p>\n<p>可如今，有人把\"五月\"两个字，明明白白地摆到了我面前。<\/p>\n<p>我把话筒放回去，站在屋门口，往上看。<\/p>\n<p>半坡上，扣锅台被日头照着，青石泛白。台边那棵歪脖老榆，风一吹，枝条哗啦啦地响，像有人在台上翻纸。<\/p>\n<p>我忽然想起沟里那道缝口，想起缺耳老头说的那句话——\"我没说五月，你听岔了。\"<\/p>\n<p>他说他没说。<\/p>\n<p>可这世上，知道\"五月\"的，不止他一个。<\/p>", "plain": "那一夜，剩下的时辰，是我这辈子过得最慢的一夜。 鱼哥把我的手背缠好，又去收拾台边泼了油的碎石。油味呛人，他用土盖了一层，才压下去大半。台角被溅上的煤油燎了一块，青石面上留着一小片焦黑，像谁在石头上按了个指印。 白头发老头没走。他坐在台沿那块平石头上，守着那盏油灯，一根接一根地抽烟。烟头一明一灭，跟灯苗对着眨眼睛。 我靠在老榆树根上，肩窝一阵一阵地疼。手背上那根布条被血浸透了，风一吹，凉丝丝的。 \"疼不疼？\"老头忽然问。 \"疼。\" \"疼是好事。\"他把烟头在石头上按灭，\"不疼的人，背不动账。\" \"我不怕疼。\"我说，\"我怕的是，这笔账认下来，往后的路，就是您说的那条——走一条，记一笔。\" \"怕就对了。\"老头说，\"不怕的人，走不到头。\" \"走到头，是什么？\" \"我要是知道，\"他笑了一下，笑纹在灯苗底下闪了闪，\"我早走过去了。\" 他没再多说。这一夜，他就坐在台沿上，一根接一根地抽烟。我数着台子底下的林涛声，一声一声，数到后来，也数不清了。 我看着他。灯苗的光只够照到他半边脸，另半边埋在暗里，看不清。 \"我问您一句话。\"我说，\"沟里那道缝口，夜里也坐着一个人。灰褂子，黑布鞋，缺了多半截左耳。\" 老头抽烟的动作停了一下。 \"他跟你，什么关系？\" 他把烟从嘴里拿下来，看着灯苗，看了很久。 \"这话，\"他说，\"我不答。你往后自己看。看明白了，比我说一百句都强。\" 我没再追问。有些话，问急了，反而不真。 \"那这个呢？\"我指了指台心那盏灯旁边的灯芯和那块补蓝布，\"您给我这个，是什么意思？\" \"意思就是，灯在你手里了。\"他说，\"五盏灯，四盏有了主。剩这一盏，我没给你点——我把芯子给你。点不点，什么时候点，你自己拿主意。\" \"点了会怎么样？\" \"点了，名分就明。\"他说，\"吹灯的那一路，就再没有'它无主'这句话可讲。到时候，他们要么认你，要么跟你死磕，没有第三条道。\" \"不点呢？\" \"不点，名分就压在你身上，压一天，山记一天。\"他站起来，拍了拍褂子上的土，\"账认了，是认了这笔债；灯点不点，是你要不要把这笔债还出去。两码事。\" \"我还有一句。\"我说，\"点灯的那一路，说灯点起来，账就清了。您说账跟着名分走。两句不一样，我该信哪一句？\" 老头看了我一眼，那一眼在灯苗底下，深得看不见底。 \"信你自己听见的。\"他说，\"别人的话，都是拿嘴说的。账，是拿命记的。\" 我没再问。 我低头看那块补蓝布。布是灰的，蓝补丁不大，针脚细得吓人，一针压着一针，齐得像拿尺子量过。 \"这布，\"我忍不住问，\"是谁缝的？\" \"老物件了。\"他把油灯端起来，往台下走，\"谁缝的不要紧。要紧的是，缝东西的人，把线头留在了谁手里。\" 他走到台口，停了一下。 \"背锅的，记住我一句话。\" \"您说。\" \"承了账，'守'字就上身了。往后这山里的路，你走一条，它记一笔。它要东西，你就得给；给不起，就欠着。欠账的人，走夜路，多留神。\" 说完，那点灯火顺着獾子道，一层一层往下沉，沉进林子里，就没了。 天蒙蒙亮的时候，把头来了。 他是从护林道正路上爬上来的，裤腿上沾满了泥，鞋帮子也湿了半截，一上到台子口，先扶着老榆树喘了半天气，才抬头看台。 他一眼看见那口扣在台心的锅，又看见我手上缠着的布，脸色沉了沉。 \"伤着了？\" \"皮外伤。\"我说，\"不碍事。\" 他把肩上挎的布包搁下，蹲在台沿上，掏出烟来卷，卷到一半，手指停住了。他从怀里摸出一样东西，搁在台沿上。 是那盒刻着\"灭\"字的火柴。 他又从台心把那根捻好的灯芯和补蓝布拿过来，两样东西，一样一样摆在灯苗的两边。 一边一个\"灭\"，一边一根芯。 \"三路人，都来了。\"他看着这两样东西，慢慢地说，\"点灯的来了，吹灯的来了，问灯的也来了。就我，来晚了。\" \"您被绊住了？\" \"老鼠男拉着我说了一下午的灯。\"把头卷好烟，点着，抽了一口，\"从三点说到天擦黑，一句正经话没有，就是不让我动身。等我回过味来，日头已经落了。\" 他顿了顿：\"绊住我的不是路，是话。有人不想让我上台。\" \"不想让您上台，是不想让账落您头上。\"我说。 \"那账，落谁头上了？\" 我看着他，没吭声。 把头也不催我。他抽着烟，把台子上上下下扫了一遍——焦黑的台角、泼了油的碎石、台心那口锅，最后，目光落在我脸上。 \"你认了？\" \"认了。\" 烟在他指间烧了一截，灰掉在台沿上。 我原以为他要骂我。他没骂。他把烟在鞋底上摁灭，站起来，走到我身边，伸手在我肩上拍了拍，拍得很轻。 \"认账，不丢人。\"他说，\"赖账，才丢人。你从沟里把锅背出来那天，这笔账就早晚得有人认。你不认，就得我认。你抢在前头，是你的孝心。下回别抢，你还年轻。\" 他这话说得平淡，我鼻子却有点发酸。 \"您早知道会这样？\"我问。 \"我要是早知道，\"把头把烟灰弹在台沿外头，\"就不该让你先上来。\" \"那您还让我来。\" \"因为这话，得你自己听。\"他看着我，\"我要是替你把话听了，账认在你身上，你也只是个背锅的。你自己听的，自己认的，往后才立得住。\" 我点点头。风从台子底下往上吹，把台心的灯苗吹得晃了一晃，又立住了。 \"灯呢？\"他问。 \"没点。\"我说，\"芯子留在我这儿了。\" \"留得好。\"把头点点头，\"灯一明，这山里就再没安稳日子。芯子在咱们手里，什么时候点，咱们说了算。这一点，比什么都强。\" 太阳从东边升起来，照在五女山的青石崖上，把台子照得亮堂堂的。 鱼哥蹲在台边，把散在地上的碎石一块一块归拢。他忽然说：\"昨儿夜里，那矮个使的是北派的擒拿路子。\" \"北派？\" \"嗯。\"他拍了拍手上的土，\"跟我师傅一路。可他们不认我。\" 他说这话的时候语气很平，可我听出点别的意思来。 我们收拾东西下山。我把锅从台上抱起来，往背上一勒—— 就在锅离开台心的那一刹那，我看见印子里多了一样东西。 那道圆印的印心，多了一道新鲜的划痕。不长，寸把长，直直的，像是有人拿硬物的尖儿，在石头上一划到底。石屑还是新的，白生生地嵌在印子里。 我愣了一下，蹲下去，伸手摸了摸那道痕。 不是锅压的。锅底是圆的，压不出这么直的线。 昨夜这台子上，从点灯到过火到散场，我、鱼哥、白头发老头、草帽人、瘦高个、矮个——六个人，谁都没拿硬物在台心划过。 那这道痕，是谁划的？ 我把锅背起来，站在台边，往四下里看。晨光里，护林道是空的，獾子道是空的，北坡的林子安安静静。 下到护林道口，老陈正蹲在屋门口劈柴。他抬头看见我手上缠的布，眼皮抬了抬，什么也没多问。 \"台子上出事了？\"他只问了这一句。 \"出了点。\"我说，\"烧了半台子，人没事。\" \"锅呢？\" \"锅好好的。\" 老陈\"嗯\"了一声，把劈好的柴往墙根一摞：\"锅好好的就行。别的，我一个看林的，管不着。\" 他顿了顿，又补一句：\"往后那老头要是再来，我还给你们捎信。\" 我谢了他，进屋打电话。电话那头，豆芽仔压着嗓子，说了一句话，把刚下山的一点轻松全给我抽走了。 \"哥，\"他说，\"今儿一早，草帽人又去老周店了。他让老周给你们带句话——\" \"什么话？\" \"他说，'账接了，灯会就开在五月节前。到那天，五部的东西，散的，都得回来。'\" 我握着话筒，半天没出声。 五月。 沟里那个缺耳的白发老头，说他没有提过五月。 可如今，有人把\"五月\"两个字，明明白白地摆到了我面前。 我把话筒放回去，站在屋门口，往上看。 半坡上，扣锅台被日头照着，青石泛白。台边那棵歪脖老榆，风一吹，枝条哗啦啦地响，像有人在台上翻纸。 我忽然想起沟里那道缝口，想起缺耳老头说的那句话——\"我没说五月，你听岔了。\" 他说他没说。 可这世上，知道\"五月\"的，不止他一个。"}, {"id": "A5-086", "arc": "A5", "num": 86, "title": "台主", "md": "下山的路，比上来时好走。\n\n日头把半坡的露水晒干了，獾子道上的碎石也不再打滑。鱼哥在前头，怀里抱着装老避龙的布兜。我背着锅走中间，锅底贴着后背，一颠一颠地硌人。把头压阵，烟袋别在腰上，一步一顿。\n\n走到半坡那棵歪脖子松树底下，我把憋了一路的话说了。\n\n\"把头，台心那道印子里，多了一道划痕。\"\n\n把头脚下一停。\n\n\"什么划痕？\"\n\n\"寸把长，直直的一道，从印心划到底。\"我说，\"我起锅的时候才看见。锅一离台，它就露出来了。\"\n\n他没说话，回头往坡上看了一眼。日头正照在扣锅台上，那片青石泛着白，亮得晃眼。\n\n\"回去。\"\n\n\"回哪儿？\"\n\n\"回台上。\"他把布包往肩上紧了紧，\"我得自己看一眼。\"\n\n鱼哥停下脚：\"把头，那台子上——\"\n\n\"白天，没人。\"把头已经掉头往坡上走了，\"看一眼就下来。\"\n\n我们仨又爬回扣锅台。\n\n日头底下，台子跟夜里是两个模样。昨夜那些焦黑的痕迹、泼了油的碎石，在日光里都淡了。台心那口锅不在了，圆印空着，像一只睁着的眼睛。\n\n把头蹲在印子边上，先没看那道划痕。他伸出手，沿着圆印的内沿，一寸一寸地摸。\n\n摸了一圈，他抬起头，脸色不太好看。\n\n\"这印子，是凿的。\"\n\n\"凿的？\"\n\n\"石头上的圆印，要么是水冲的，要么是磨的，要么是凿的。\"他用指甲在印沿上刮了一下，刮下一层细白的石粉，\"水冲的沿子圆钝，磨的沿子发亮。这道沿子，一棱一棱的，是拿錾子一下一下打出来的。\"\n\n我心里咯噔一下。\n\n\"您的意思是——\"\n\n\"这台上，早有人凿了一个座。\"他站起来，拍了拍手上的石粉，\"照着锅底的尺寸凿的。先有锅，后有座。凿座的人，手里拿过这口锅。\"\n\n我盯着那个圆印，后脊梁上冒起一层凉。\n\n原来我们不是头一个把锅扣上这台的人。有人比我们早得多——早到这台子还只是块石头的时候，就照着这口锅的底，在石头上凿出了一个严丝合缝的窝。\n\n\"再看这道划痕。\"把头蹲回印子边，指着印心那道新痕。\n\n我凑过去。日头底下看得清楚，那道痕不长，寸把，直得像拿尺子比着划的，两头都收得干净，没有拖泥带水的毛边。\n\n\"这是拿硬尖子一下划到底的。\"把头说，\"手很稳。\"\n\n\"划在正当中。\"我说，\"正好在锅底当间的位置。\"\n\n\"你想想，锅底当间有什么？\"\n\n我愣了一下，随即明白过来。\n\n鱼尾纹。\n\n那圈\"守\"字鱼尾纹，就刻在锅底的正中间。\n\n\"他认得这口锅。\"我声音有点发紧，\"他知道锅底当间有纹。\"\n\n\"对。\"把头点点头，\"不知道锅底有纹的人，划不出这一道。划在印心，就是划在锅底当间——这是给认得的人看的。\"\n\n我脑子里飞快地过了一遍昨夜台上的人。\n\n白头发问灯人，认得锅底的纹。他昨夜说过\"锅是肚\"，还让我把锅扣上去。可他要是想留记，用不着趁乱——他什么时候都能留。\n\n灭字那一路，瘦高个和矮个，要的是砸锅。要砸锅的人，不会拿尖子在石头上划一道记。\n\n草帽人只掌灯。他昨夜撑开灯笼收场，走的时候还冲台上拱了拱手，不像留记的。\n\n\"都不是。\"我摇摇头，\"这三路，都不像。\"\n\n\"不是不像。\"把头把烟点着，抽了一口，慢慢说，\"是够不着。\"\n\n\"够不着？\"\n\n\"你想想，昨夜这台子上，从点灯到过火到散场，前后多少人上来下去？\"他吐出一口烟，\"乱成那样，谁能在台心留一道记，还不让人瞧见？\"\n\n我没吭声。\n\n\"留记的人，要么比谁都早，要么比谁都晚。\"把头说，\"早，是趁我们没上来；晚，是趁我们都走了。\"\n\n\"可那道痕是新划的。\"我说，\"石屑还是白的，一夜的工夫，白不了。\"\n\n\"那就是趁我们走了。\"他把烟在石头上摁灭，\"夜里下台之后，我们谁回头看过台子？\"\n\n我想了想。没有。\n\n下山的时候天刚亮，我、鱼哥、把头，三个人一前一后，谁也没再回头。\n\n\"有人等我们走了，上了台。\"我说。\n\n\"不是等我们走了。\"把头站起来，往台子四下里看了一圈，\"是等我们都到齐了。\"\n\n我一时没听懂。\n\n\"昨夜三路齐了。\"他说，\"点灯的、吹灯的、问灯的，都到过这台子。人到齐了，他才上来，在台心划一道记。\"\n\n\"记什么？\"\n\n\"记这一场。\"把头看着印心那道痕，声音压得很低，\"他要让后头上来的人知道——这台子上，还有一路。\"\n\n日头爬高了，台子上的影子短了。风从林子底下往上吹，把把头褂子的下摆吹得动了动。\n\n\"还有一路……\"我重复了一遍。\n\n\"是。\"把头说，\"这一路，不动手，不露面，也不说话，只在台心划一道记。这种人才最要紧。\"\n\n\"为什么？\"\n\n\"因为他不是来抢的。\"把头说，\"抢东西的，怕人瞧见。他是来看的——看你们谁的名分，谁的手，谁的锅。\"\n\n我忽然想起什么，蹲下去，把照魇镜掏出来，翻到背面，对着日头看那道鱼尾纹，又想起台上那道划痕。两道痕迹，一个在镜背上，一个在石头上，都是又直又净，像是同一双手留下的。\n\n\"把头，\"我说，\"这道划痕的走刀，跟守纹的刻法，像不像？\"\n\n把头接过镜子，对着日头看了半天。他没说像，也没说不像。他把镜子还给我，只说了一句：\"这话，先搁在心里。\"\n\n我把镜子收好。\n\n\"这台子，这口锅，这面镜子，\"把头往山下走，声音压在烟里，\"都是一路货。做它们的人，还活着。\"\n\n下到护林道口，老陈正蹲在屋门口啃干粮。他看见我们又回来，也不问缘由，只往屋里指了指：\"电话在墙上。\"\n\n我没打电话。倒是老陈多看了我背上的锅两眼，忽然说：\"那老头，天没亮就下山了。往东边去的。\"\n\n\"东边？\"\n\n\"嗯。\"老陈咬了口干粮，\"他走的不是獾子道，也不是护林道。他往东边那片断崖上去了。那边没路。\"\n\n我把这话记在心里。\n\n回到雅河乡，已经是后半晌。\n\n蜂房还是那个蜂房。院墙塌了半截，墙根底下晒着几只空蜂箱。小萱听见动静，从屋里出来，看见我手上缠着布，眼圈一下就红了。\n\n\"没事。\"我把手往身后藏了藏，\"皮外伤。\"\n\n她没多问，只给我打了盆水，让我洗手。水一浸到伤口，一阵钻心的疼，我咬着牙没出声。\n\n等我把手包好，小萱才低声说：\"哥，这几天，有人来问过路。\"\n\n\"什么人？\"\n\n\"外乡口音。\"她把手在围裙上擦了擦，\"前天一个，昨天又一个。都在村口那家小卖部打听——问雅河乡有没有一座废蜂房。\"\n\n我端着水盆的手停住了。\n\n废蜂房这地方，是把头半个月前才定下的。除了自己人，没人知道。\n\n\"打听出什么了？\"我问。\n\n\"没有。\"小萱摇头，\"小卖部的老李嘴严，说不知道。可我瞧见那人走的时候，往咱们这头看了好几眼。\"\n\n我把水泼在院墙根，回屋找把头。\n\n把头正蹲在炕沿上，把那盒刻\"灭\"字的火柴、灯芯、补蓝布三样东西一样一样摆在炕桌上。他听完，没抬头，只把火柴盒在手里掂了掂。\n\n\"来了几个人？\"\n\n\"小萱说，前天一个，昨天一个。\"\n\n\"是不是一个人，换了两身衣裳？\"把头问。\n\n我回头看了看跟进来的小萱。小萱愣了愣，想了想，脸白了：\"我……我没细看。\"\n\n\"不打紧。\"把头把那三样东西收进布包，\"该来的，躲不掉。\"\n\n他站起来，走到门口，往院外那条土路看了一会儿。\n\n\"你去把豆芽仔叫来。\"他说，\"问问这半个月，桓仁那边有没有生面孔。\"\n\n我应了一声，往外走。刚走到院门口，就看见土路尽头有个人影，正不紧不慢地往蜂房这边来。\n\n是豆芽仔。\n\n他远远看见我，撒腿跑了起来，跑到跟前，喘得直不起腰。\n\n\"哥，\"他抹了把汗，\"你猜我今儿在桓仁瞧见谁了？\"\n\n\"谁？\"\n\n\"猴三儿。\"他咽了口唾沫，\"猴三儿领着一个外乡人，在县城里转。那外乡人手里拎着个旧木匣子，逢人就问——\"\n\n\"问什么？\"\n\n豆芽仔压低声音，一字一顿：\"问谁认得'认字的'。\"", "words": 2868, "html": "<p>下山的路，比上来时好走。<\/p>\n<p>日头把半坡的露水晒干了，獾子道上的碎石也不再打滑。鱼哥在前头，怀里抱着装老避龙的布兜。我背着锅走中间，锅底贴着后背，一颠一颠地硌人。把头压阵，烟袋别在腰上，一步一顿。<\/p>\n<p>走到半坡那棵歪脖子松树底下，我把憋了一路的话说了。<\/p>\n<p>\"把头，台心那道印子里，多了一道划痕。\"<\/p>\n<p>把头脚下一停。<\/p>\n<p>\"什么划痕？\"<\/p>\n<p>\"寸把长，直直的一道，从印心划到底。\"我说，\"我起锅的时候才看见。锅一离台，它就露出来了。\"<\/p>\n<p>他没说话，回头往坡上看了一眼。日头正照在扣锅台上，那片青石泛着白，亮得晃眼。<\/p>\n<p>\"回去。\"<\/p>\n<p>\"回哪儿？\"<\/p>\n<p>\"回台上。\"他把布包往肩上紧了紧，\"我得自己看一眼。\"<\/p>\n<p>鱼哥停下脚：\"把头，那台子上——\"<\/p>\n<p>\"白天，没人。\"把头已经掉头往坡上走了，\"看一眼就下来。\"<\/p>\n<p>我们仨又爬回扣锅台。<\/p>\n<p>日头底下，台子跟夜里是两个模样。昨夜那些焦黑的痕迹、泼了油的碎石，在日光里都淡了。台心那口锅不在了，圆印空着，像一只睁着的眼睛。<\/p>\n<p>把头蹲在印子边上，先没看那道划痕。他伸出手，沿着圆印的内沿，一寸一寸地摸。<\/p>\n<p>摸了一圈，他抬起头，脸色不太好看。<\/p>\n<p>\"这印子，是凿的。\"<\/p>\n<p>\"凿的？\"<\/p>\n<p>\"石头上的圆印，要么是水冲的，要么是磨的，要么是凿的。\"他用指甲在印沿上刮了一下，刮下一层细白的石粉，\"水冲的沿子圆钝，磨的沿子发亮。这道沿子，一棱一棱的，是拿錾子一下一下打出来的。\"<\/p>\n<p>我心里咯噔一下。<\/p>\n<p>\"您的意思是——\"<\/p>\n<p>\"这台上，早有人凿了一个座。\"他站起来，拍了拍手上的石粉，\"照着锅底的尺寸凿的。先有锅，后有座。凿座的人，手里拿过这口锅。\"<\/p>\n<p>我盯着那个圆印，后脊梁上冒起一层凉。<\/p>\n<p>原来我们不是头一个把锅扣上这台的人。有人比我们早得多——早到这台子还只是块石头的时候，就照着这口锅的底，在石头上凿出了一个严丝合缝的窝。<\/p>\n<p>\"再看这道划痕。\"把头蹲回印子边，指着印心那道新痕。<\/p>\n<p>我凑过去。日头底下看得清楚，那道痕不长，寸把，直得像拿尺子比着划的，两头都收得干净，没有拖泥带水的毛边。<\/p>\n<p>\"这是拿硬尖子一下划到底的。\"把头说，\"手很稳。\"<\/p>\n<p>\"划在正当中。\"我说，\"正好在锅底当间的位置。\"<\/p>\n<p>\"你想想，锅底当间有什么？\"<\/p>\n<p>我愣了一下，随即明白过来。<\/p>\n<p>鱼尾纹。<\/p>\n<p>那圈\"守\"字鱼尾纹，就刻在锅底的正中间。<\/p>\n<p>\"他认得这口锅。\"我声音有点发紧，\"他知道锅底当间有纹。\"<\/p>\n<p>\"对。\"把头点点头，\"不知道锅底有纹的人，划不出这一道。划在印心，就是划在锅底当间——这是给认得的人看的。\"<\/p>\n<p>我脑子里飞快地过了一遍昨夜台上的人。<\/p>\n<p>白头发问灯人，认得锅底的纹。他昨夜说过\"锅是肚\"，还让我把锅扣上去。可他要是想留记，用不着趁乱——他什么时候都能留。<\/p>\n<p>灭字那一路，瘦高个和矮个，要的是砸锅。要砸锅的人，不会拿尖子在石头上划一道记。<\/p>\n<p>草帽人只掌灯。他昨夜撑开灯笼收场，走的时候还冲台上拱了拱手，不像留记的。<\/p>\n<p>\"都不是。\"我摇摇头，\"这三路，都不像。\"<\/p>\n<p>\"不是不像。\"把头把烟点着，抽了一口，慢慢说，\"是够不着。\"<\/p>\n<p>\"够不着？\"<\/p>\n<p>\"你想想，昨夜这台子上，从点灯到过火到散场，前后多少人上来下去？\"他吐出一口烟，\"乱成那样，谁能在台心留一道记，还不让人瞧见？\"<\/p>\n<p>我没吭声。<\/p>\n<p>\"留记的人，要么比谁都早，要么比谁都晚。\"把头说，\"早，是趁我们没上来；晚，是趁我们都走了。\"<\/p>\n<p>\"可那道痕是新划的。\"我说，\"石屑还是白的，一夜的工夫，白不了。\"<\/p>\n<p>\"那就是趁我们走了。\"他把烟在石头上摁灭，\"夜里下台之后，我们谁回头看过台子？\"<\/p>\n<p>我想了想。没有。<\/p>\n<p>下山的时候天刚亮，我、鱼哥、把头，三个人一前一后，谁也没再回头。<\/p>\n<p>\"有人等我们走了，上了台。\"我说。<\/p>\n<p>\"不是等我们走了。\"把头站起来，往台子四下里看了一圈，\"是等我们都到齐了。\"<\/p>\n<p>我一时没听懂。<\/p>\n<p>\"昨夜三路齐了。\"他说，\"点灯的、吹灯的、问灯的，都到过这台子。人到齐了，他才上来，在台心划一道记。\"<\/p>\n<p>\"记什么？\"<\/p>\n<p>\"记这一场。\"把头看着印心那道痕，声音压得很低，\"他要让后头上来的人知道——这台子上，还有一路。\"<\/p>\n<p>日头爬高了，台子上的影子短了。风从林子底下往上吹，把把头褂子的下摆吹得动了动。<\/p>\n<p>\"还有一路……\"我重复了一遍。<\/p>\n<p>\"是。\"把头说，\"这一路，不动手，不露面，也不说话，只在台心划一道记。这种人才最要紧。\"<\/p>\n<p>\"为什么？\"<\/p>\n<p>\"因为他不是来抢的。\"把头说，\"抢东西的，怕人瞧见。他是来看的——看你们谁的名分，谁的手，谁的锅。\"<\/p>\n<p>我忽然想起什么，蹲下去，把照魇镜掏出来，翻到背面，对着日头看那道鱼尾纹，又想起台上那道划痕。两道痕迹，一个在镜背上，一个在石头上，都是又直又净，像是同一双手留下的。<\/p>\n<p>\"把头，\"我说，\"这道划痕的走刀，跟守纹的刻法，像不像？\"<\/p>\n<p>把头接过镜子，对着日头看了半天。他没说像，也没说不像。他把镜子还给我，只说了一句：\"这话，先搁在心里。\"<\/p>\n<p>我把镜子收好。<\/p>\n<p>\"这台子，这口锅，这面镜子，\"把头往山下走，声音压在烟里，\"都是一路货。做它们的人，还活着。\"<\/p>\n<p>下到护林道口，老陈正蹲在屋门口啃干粮。他看见我们又回来，也不问缘由，只往屋里指了指：\"电话在墙上。\"<\/p>\n<p>我没打电话。倒是老陈多看了我背上的锅两眼，忽然说：\"那老头，天没亮就下山了。往东边去的。\"<\/p>\n<p>\"东边？\"<\/p>\n<p>\"嗯。\"老陈咬了口干粮，\"他走的不是獾子道，也不是护林道。他往东边那片断崖上去了。那边没路。\"<\/p>\n<p>我把这话记在心里。<\/p>\n<p>回到雅河乡，已经是后半晌。<\/p>\n<p>蜂房还是那个蜂房。院墙塌了半截，墙根底下晒着几只空蜂箱。小萱听见动静，从屋里出来，看见我手上缠着布，眼圈一下就红了。<\/p>\n<p>\"没事。\"我把手往身后藏了藏，\"皮外伤。\"<\/p>\n<p>她没多问，只给我打了盆水，让我洗手。水一浸到伤口，一阵钻心的疼，我咬着牙没出声。<\/p>\n<p>等我把手包好，小萱才低声说：\"哥，这几天，有人来问过路。\"<\/p>\n<p>\"什么人？\"<\/p>\n<p>\"外乡口音。\"她把手在围裙上擦了擦，\"前天一个，昨天又一个。都在村口那家小卖部打听——问雅河乡有没有一座废蜂房。\"<\/p>\n<p>我端着水盆的手停住了。<\/p>\n<p>废蜂房这地方，是把头半个月前才定下的。除了自己人，没人知道。<\/p>\n<p>\"打听出什么了？\"我问。<\/p>\n<p>\"没有。\"小萱摇头，\"小卖部的老李嘴严，说不知道。可我瞧见那人走的时候，往咱们这头看了好几眼。\"<\/p>\n<p>我把水泼在院墙根，回屋找把头。<\/p>\n<p>把头正蹲在炕沿上，把那盒刻\"灭\"字的火柴、灯芯、补蓝布三样东西一样一样摆在炕桌上。他听完，没抬头，只把火柴盒在手里掂了掂。<\/p>\n<p>\"来了几个人？\"<\/p>\n<p>\"小萱说，前天一个，昨天一个。\"<\/p>\n<p>\"是不是一个人，换了两身衣裳？\"把头问。<\/p>\n<p>我回头看了看跟进来的小萱。小萱愣了愣，想了想，脸白了：\"我……我没细看。\"<\/p>\n<p>\"不打紧。\"把头把那三样东西收进布包，\"该来的，躲不掉。\"<\/p>\n<p>他站起来，走到门口，往院外那条土路看了一会儿。<\/p>\n<p>\"你去把豆芽仔叫来。\"他说，\"问问这半个月，桓仁那边有没有生面孔。\"<\/p>\n<p>我应了一声，往外走。刚走到院门口，就看见土路尽头有个人影，正不紧不慢地往蜂房这边来。<\/p>\n<p>是豆芽仔。<\/p>\n<p>他远远看见我，撒腿跑了起来，跑到跟前，喘得直不起腰。<\/p>\n<p>\"哥，\"他抹了把汗，\"你猜我今儿在桓仁瞧见谁了？\"<\/p>\n<p>\"谁？\"<\/p>\n<p>\"猴三儿。\"他咽了口唾沫，\"猴三儿领着一个外乡人，在县城里转。那外乡人手里拎着个旧木匣子，逢人就问——\"<\/p>\n<p>\"问什么？\"<\/p>\n<p>豆芽仔压低声音，一字一顿：\"问谁认得'认字的'。\"<\/p>", "plain": "下山的路，比上来时好走。 日头把半坡的露水晒干了，獾子道上的碎石也不再打滑。鱼哥在前头，怀里抱着装老避龙的布兜。我背着锅走中间，锅底贴着后背，一颠一颠地硌人。把头压阵，烟袋别在腰上，一步一顿。 走到半坡那棵歪脖子松树底下，我把憋了一路的话说了。 \"把头，台心那道印子里，多了一道划痕。\" 把头脚下一停。 \"什么划痕？\" \"寸把长，直直的一道，从印心划到底。\"我说，\"我起锅的时候才看见。锅一离台，它就露出来了。\" 他没说话，回头往坡上看了一眼。日头正照在扣锅台上，那片青石泛着白，亮得晃眼。 \"回去。\" \"回哪儿？\" \"回台上。\"他把布包往肩上紧了紧，\"我得自己看一眼。\" 鱼哥停下脚：\"把头，那台子上——\" \"白天，没人。\"把头已经掉头往坡上走了，\"看一眼就下来。\" 我们仨又爬回扣锅台。 日头底下，台子跟夜里是两个模样。昨夜那些焦黑的痕迹、泼了油的碎石，在日光里都淡了。台心那口锅不在了，圆印空着，像一只睁着的眼睛。 把头蹲在印子边上，先没看那道划痕。他伸出手，沿着圆印的内沿，一寸一寸地摸。 摸了一圈，他抬起头，脸色不太好看。 \"这印子，是凿的。\" \"凿的？\" \"石头上的圆印，要么是水冲的，要么是磨的，要么是凿的。\"他用指甲在印沿上刮了一下，刮下一层细白的石粉，\"水冲的沿子圆钝，磨的沿子发亮。这道沿子，一棱一棱的，是拿錾子一下一下打出来的。\" 我心里咯噔一下。 \"您的意思是——\" \"这台上，早有人凿了一个座。\"他站起来，拍了拍手上的石粉，\"照着锅底的尺寸凿的。先有锅，后有座。凿座的人，手里拿过这口锅。\" 我盯着那个圆印，后脊梁上冒起一层凉。 原来我们不是头一个把锅扣上这台的人。有人比我们早得多——早到这台子还只是块石头的时候，就照着这口锅的底，在石头上凿出了一个严丝合缝的窝。 \"再看这道划痕。\"把头蹲回印子边，指着印心那道新痕。 我凑过去。日头底下看得清楚，那道痕不长，寸把，直得像拿尺子比着划的，两头都收得干净，没有拖泥带水的毛边。 \"这是拿硬尖子一下划到底的。\"把头说，\"手很稳。\" \"划在正当中。\"我说，\"正好在锅底当间的位置。\" \"你想想，锅底当间有什么？\" 我愣了一下，随即明白过来。 鱼尾纹。 那圈\"守\"字鱼尾纹，就刻在锅底的正中间。 \"他认得这口锅。\"我声音有点发紧，\"他知道锅底当间有纹。\" \"对。\"把头点点头，\"不知道锅底有纹的人，划不出这一道。划在印心，就是划在锅底当间——这是给认得的人看的。\" 我脑子里飞快地过了一遍昨夜台上的人。 白头发问灯人，认得锅底的纹。他昨夜说过\"锅是肚\"，还让我把锅扣上去。可他要是想留记，用不着趁乱——他什么时候都能留。 灭字那一路，瘦高个和矮个，要的是砸锅。要砸锅的人，不会拿尖子在石头上划一道记。 草帽人只掌灯。他昨夜撑开灯笼收场，走的时候还冲台上拱了拱手，不像留记的。 \"都不是。\"我摇摇头，\"这三路，都不像。\" \"不是不像。\"把头把烟点着，抽了一口，慢慢说，\"是够不着。\" \"够不着？\" \"你想想，昨夜这台子上，从点灯到过火到散场，前后多少人上来下去？\"他吐出一口烟，\"乱成那样，谁能在台心留一道记，还不让人瞧见？\" 我没吭声。 \"留记的人，要么比谁都早，要么比谁都晚。\"把头说，\"早，是趁我们没上来；晚，是趁我们都走了。\" \"可那道痕是新划的。\"我说，\"石屑还是白的，一夜的工夫，白不了。\" \"那就是趁我们走了。\"他把烟在石头上摁灭，\"夜里下台之后，我们谁回头看过台子？\" 我想了想。没有。 下山的时候天刚亮，我、鱼哥、把头，三个人一前一后，谁也没再回头。 \"有人等我们走了，上了台。\"我说。 \"不是等我们走了。\"把头站起来，往台子四下里看了一圈，\"是等我们都到齐了。\" 我一时没听懂。 \"昨夜三路齐了。\"他说，\"点灯的、吹灯的、问灯的，都到过这台子。人到齐了，他才上来，在台心划一道记。\" \"记什么？\" \"记这一场。\"把头看着印心那道痕，声音压得很低，\"他要让后头上来的人知道——这台子上，还有一路。\" 日头爬高了，台子上的影子短了。风从林子底下往上吹，把把头褂子的下摆吹得动了动。 \"还有一路……\"我重复了一遍。 \"是。\"把头说，\"这一路，不动手，不露面，也不说话，只在台心划一道记。这种人才最要紧。\" \"为什么？\" \"因为他不是来抢的。\"把头说，\"抢东西的，怕人瞧见。他是来看的——看你们谁的名分，谁的手，谁的锅。\" 我忽然想起什么，蹲下去，把照魇镜掏出来，翻到背面，对着日头看那道鱼尾纹，又想起台上那道划痕。两道痕迹，一个在镜背上，一个在石头上，都是又直又净，像是同一双手留下的。 \"把头，\"我说，\"这道划痕的走刀，跟守纹的刻法，像不像？\" 把头接过镜子，对着日头看了半天。他没说像，也没说不像。他把镜子还给我，只说了一句：\"这话，先搁在心里。\" 我把镜子收好。 \"这台子，这口锅，这面镜子，\"把头往山下走，声音压在烟里，\"都是一路货。做它们的人，还活着。\" 下到护林道口，老陈正蹲在屋门口啃干粮。他看见我们又回来，也不问缘由，只往屋里指了指：\"电话在墙上。\" 我没打电话。倒是老陈多看了我背上的锅两眼，忽然说：\"那老头，天没亮就下山了。往东边去的。\" \"东边？\" \"嗯。\"老陈咬了口干粮，\"他走的不是獾子道，也不是护林道。他往东边那片断崖上去了。那边没路。\" 我把这话记在心里。 回到雅河乡，已经是后半晌。 蜂房还是那个蜂房。院墙塌了半截，墙根底下晒着几只空蜂箱。小萱听见动静，从屋里出来，看见我手上缠着布，眼圈一下就红了。 \"没事。\"我把手往身后藏了藏，\"皮外伤。\" 她没多问，只给我打了盆水，让我洗手。水一浸到伤口，一阵钻心的疼，我咬着牙没出声。 等我把手包好，小萱才低声说：\"哥，这几天，有人来问过路。\" \"什么人？\" \"外乡口音。\"她把手在围裙上擦了擦，\"前天一个，昨天又一个。都在村口那家小卖部打听——问雅河乡有没有一座废蜂房。\" 我端着水盆的手停住了。 废蜂房这地方，是把头半个月前才定下的。除了自己人，没人知道。 \"打听出什么了？\"我问。 \"没有。\"小萱摇头，\"小卖部的老李嘴严，说不知道。可我瞧见那人走的时候，往咱们这头看了好几眼。\" 我把水泼在院墙根，回屋找把头。 把头正蹲在炕沿上，把那盒刻\"灭\"字的火柴、灯芯、补蓝布三样东西一样一样摆在炕桌上。他听完，没抬头，只把火柴盒在手里掂了掂。 \"来了几个人？\" \"小萱说，前天一个，昨天一个。\" \"是不是一个人，换了两身衣裳？\"把头问。 我回头看了看跟进来的小萱。小萱愣了愣，想了想，脸白了：\"我……我没细看。\" \"不打紧。\"把头把那三样东西收进布包，\"该来的，躲不掉。\" 他站起来，走到门口，往院外那条土路看了一会儿。 \"你去把豆芽仔叫来。\"他说，\"问问这半个月，桓仁那边有没有生面孔。\" 我应了一声，往外走。刚走到院门口，就看见土路尽头有个人影，正不紧不慢地往蜂房这边来。 是豆芽仔。 他远远看见我，撒腿跑了起来，跑到跟前，喘得直不起腰。 \"哥，\"他抹了把汗，\"你猜我今儿在桓仁瞧见谁了？\" \"谁？\" \"猴三儿。\"他咽了口唾沫，\"猴三儿领着一个外乡人，在县城里转。那外乡人手里拎着个旧木匣子，逢人就问——\" \"问什么？\" 豆芽仔压低声音，一字一顿：\"问谁认得'认字的'。\""}, {"id": "A5-087", "arc": "A5", "num": 87, "title": "问月", "md": "天没黑，我跟豆芽仔就动了身。\n\n把头留在蜂房，只交代了两句：一，见了猴三儿，先问\"五月\"；二，那个拎匣子的外乡人，能避就避。\n\n我问他，猴三儿一个收旧货的，能知道什么。\n\n把头说：\"收旧货的，耳朵最杂。三十年前的事，他未必记得清；三十天前的话，他一个字都不会漏。\"\n\n桓仁县城到雅河乡，隔着两道岭。豆芽仔借了辆旧摩托，我坐在后座上，背着个空布袋——锅留在了蜂房，用不着往县城里背。风从岭上灌下来，把耳朵刮得生疼。路过第一道岭的时候，我回头看了一眼，五女山那边黑沉沉的一片，扣锅台早看不见了。\n\n到县城，天已经擦黑。\n\n猴三儿没在加油站，也没在白天那个路口。豆芽仔领着我，拐进后街一条小巷，巷子尽头有间铺子，门脸不大，门口堆着半人高的旧铁皮、破铜烂铁，还有几只掉漆的木箱。铺子里点着一盏白炽灯，昏黄昏黄的。\n\n猴三儿正坐在灯底下，拿一块布擦一只旧铜锁。\n\n看见我，他也不起身，只把铜锁搁下，从鼻子底下哼了一声：\"我说是谁，原来是背锅的那位。\"\n\n\"猴三儿，\"我拉了条小马扎坐下，\"我来问你件事。\"\n\n\"问吧。\"他往墙角一努嘴，\"豆芽仔，后头有茶，自己倒。\"\n\n我没绕弯子：\"你知不知道，桓仁这边，'五月'是个什么讲究？\"\n\n猴三儿擦铜锁的手停了。\n\n他没马上答，先抬眼皮把我从上到下打量了一遍，那眼神像是在称一件旧货的分量。\n\n\"你问这个，是替谁问的？\"\n\n\"替我自己。\"\n\n\"替你自己？\"他笑了一下，\"那你这锅，背得不轻。\"\n\n我没接他的话。\n\n猴三儿把布往膝上一搭，身子往后靠，靠进那张吱呀作响的旧藤椅里。\n\n我借着灯光，把这间铺子打量了一遍。四面墙上挂满了旧货：铜锁、门环、断了齿的锯、豁了口的水瓢，还有两只蒙尘的旧帽筒。这些东西堆在一处，看不出个门道，倒像是什么都收，什么都不扔。\n\n\"你爹那辈的事，你还记得这么清？\"我问。\n\n\"我爹记性好，我的记性随他。\"猴三儿拍了拍藤椅扶手，\"再说，那年的事，桓仁老一辈都念叨。谁家丢了人，谁家发了财，都从那一年起头。\"\n\n\"三十多年前的事了。\"他说，\"我那时候还小，是我爹讲的。那年开春，桓仁来了一伙外路人，穿着讲究，不像做买卖的。四月底，那伙人进了山，说是去'看货'。\"\n\n\"看什么货？\"\n\n\"我爹也没说清。\"猴三儿摇摇头，\"只知道那伙人进去以后，一个多月没出来。等到五月初，山里才下来一个。\"\n\n我手指头一紧。\n\n\"下来的那个，头发全白了。\"猴三儿说，\"回来就病了，病了大半年，后来搬走了，再没在桓仁露过面。\"\n\n\"五月初。\"\n\n\"嗯。\"猴三儿点头，\"我爹记性好，说那天是五月初一，下雨。\"\n\n铺子里静了一会儿。灯泡嗡了一声，光晃了晃。\n\n\"五月初一，下雨。\"我把这句话重复了一遍。\n\n\"你念叨啥呢？\"猴三儿斜眼看我。\n\n\"没什么。\"我说，\"就是觉得，这个日子，我好像在哪听过。\"\n\n话一出口，我自己心里先咯噔了一下。沟里那个缺耳的老头，一口咬定没提过五月。可\"五月初一、下雨\"这几个字，从他嘴里出来，怎么这么熟？\n\n我把这个念头压下去。熟归熟，没凭没据的事，不能往一块儿凑。\n\n\"还有一件。\"猴三儿忽然坐直了些，\"上月底，有个人来我摊上买纸钱。\"\n\n\"什么样的人？\"\n\n\"瘦，白头发，话不多。\"猴三儿比划了一下，\"买了厚厚一沓，还买了一刀黄纸。我问他给谁烧，他说不上给谁烧，就烧。\"\n\n\"他还说什么？\"\n\n\"临走，他念叨了一句。\"猴三儿把铜锁重新拿起来，翻来覆去地看，\"他说——'赶五月'。\"\n\n我心里一跳。\n\n\"就这三个字？\"\n\n\"就这三个字。\"猴三儿说，\"我当时没在意。这几天你们一来，我越想越觉得，这三个字，不像是随口说的。\"\n\n\"买纸钱的那人，往哪边走了？\"\n\n\"出城，往西。\"猴三儿想了想，\"过了加油站，就没影了。我那会儿还想，西边除了几座荒山，没什么去处。\"\n\n西边。雅河乡在西边。蜂房也在西边。\n\n我把这话咽回肚子里，没吭声。\n\n沟里那个缺耳的老头，明明白白说过，他没提过五月。可如今，桓仁这边，几十年前的老事落在五月初，上月底那个白头发瘦子又念叨\"赶五月\"，还一路往西去了。同一个\"五月\"，从不同的嘴里出来，绕了一圈，又绕回我面前。\n\n\"猴三儿，\"我说，\"那个拎匣子的外乡人，你跟他怎么搭上的？\"\n\n猴三儿把铜锁往桌上一放，声音沉了点：\"他前天来的。站在摊子外头，看了我半天，才开口。\"\n\n\"他说什么？\"\n\n\"他说，他在找一个'认字的'。\"猴三儿看着我，\"我一听这话，心里就打鼓。'认字的'这三个字，我上回听见，还是两年前——也是你们这号人。\"\n\n我没吭声。\n\n\"我没接他的茬。\"猴三儿说，\"我说我不认得。他也没纠缠，就把手里那个匣子搁在我摊上，说了一句话。\"\n\n\"什么话？\"\n\n\"他说，'认字的要是来了，让他自己开。'\"\n\n\"你就搁着了？\"\n\n\"我敢不搁着？\"猴三儿一摊手，\"那人往那儿一站，我这摊子上的铜铁都像凉了几分。东西我没敢动，绳结都没敢解，就搁在里屋。这两天我心里直发毛，早盼着你们来个人把它取走。\"\n\n\"匣子呢？\"\n\n猴三儿没答，起身往里屋走。过了一会儿，他抱出一只旧木匣来，搁在灯下的桌上。\n\n匣子不大，一尺来长，半尺宽，木头是老木，边角磨得发亮，上头的漆掉了大半，露出一道道木纹。匣盖上没有锁，只用一根麻绳缠了两圈，打了个死结。\n\n\"就这个。\"猴三儿退开半步，像是怕沾上什么，\"东西我没动。绳结我都没解。\"\n\n我伸手，在匣盖上摸了摸。木头凉，凉得有点反常。\n\n\"他还说过别的没有？\"我问，\"比如，他长什么样，从哪来，往哪去？\"\n\n猴三儿想了想，忽然一拍大腿。\n\n\"有一句，我差点忘了。\"他说，\"他走的时候，回头又问了我一句。\"\n\n\"问什么？\"\n\n\"他问——'那口锅，上过台没有？'\"\n\n我手里的匣子，一下子沉了。\n\n上过台没有。\n\n这世上，知道\"锅\"和\"台\"是怎么一回事的人，掰着指头都数得过来。可这个拎匣子的外乡人，头一回跟猴三儿搭话，问的就是这个。\n\n猴三儿瞧着我，压低了声音：\"我那时候不知道他说的是哪口锅。可你们这一来，我心里就有数了。兄弟，这匣子，你还是别在我这儿开。\"\n\n\"猴三儿，\"我又问，\"这两天，除了那个拎匣子的，还有没有别人来问过？\"\n\n\"有。\"猴三儿把布往桌上一扔，\"前天来了个矮个，问路；昨天来了个高个，买锁。两个人都没说自己从哪来。我这铺子，平时冷清得能养蜘蛛，这两天倒热闹。\"\n\n矮个。\n\n我心里又是一动。五女山上过火那一夜，抢锅的就是个矮个；废品站门口敲门的，也是缺了半截小指的人。桓仁、雅河乡、五女山，这几个地方之间，来来回回就那么几张脸。\n\n\"矮个长什么样？\"我问。\n\n\"小个子，罗圈腿，穿件深蓝夹克。\"猴三儿说，\"我没细看，他问完就走了。\"\n\n\"问的什么路？\"\n\n\"问五女山怎么走。\"猴三儿说，\"我给他指了北坡的道。\"\n\n我没再往下问。有些脸，问得越细，越像。\n\n我盯着那根缠在匣盖上的麻绳，看了半晌，才把它抱起来。\n\n\"猴三儿，\"我说，\"这几天，要是再有人来问，你就说什么都不知道。\"\n\n\"我本来就什么都不知道。\"他把铜锁重新拿起来，埋头擦着，\"我一个收破烂的，知道那么多干啥。\"\n\n我抱着匣子出了铺子。巷子里的风比来时凉，吹在脸上，把一路的困意都吹散了。豆芽仔把摩托推过来，我跨上后座，把匣子横抱在怀里。\n\n\"哥，那匣子里到底是啥？\"\n\n\"回头再说。\"我说，\"先走。\"\n\n摩托突突地响起来，冲出巷子，拐上大路。我回头看那间铺子，门帘已经放下了，灯光从帘子缝里漏出来，细细一道，像谁在暗处睁着一只眼。", "words": 2888, "html": "<p>天没黑，我跟豆芽仔就动了身。<\/p>\n<p>把头留在蜂房，只交代了两句：一，见了猴三儿，先问\"五月\"；二，那个拎匣子的外乡人，能避就避。<\/p>\n<p>我问他，猴三儿一个收旧货的，能知道什么。<\/p>\n<p>把头说：\"收旧货的，耳朵最杂。三十年前的事，他未必记得清；三十天前的话，他一个字都不会漏。\"<\/p>\n<p>桓仁县城到雅河乡，隔着两道岭。豆芽仔借了辆旧摩托，我坐在后座上，背着个空布袋——锅留在了蜂房，用不着往县城里背。风从岭上灌下来，把耳朵刮得生疼。路过第一道岭的时候，我回头看了一眼，五女山那边黑沉沉的一片，扣锅台早看不见了。<\/p>\n<p>到县城，天已经擦黑。<\/p>\n<p>猴三儿没在加油站，也没在白天那个路口。豆芽仔领着我，拐进后街一条小巷，巷子尽头有间铺子，门脸不大，门口堆着半人高的旧铁皮、破铜烂铁，还有几只掉漆的木箱。铺子里点着一盏白炽灯，昏黄昏黄的。<\/p>\n<p>猴三儿正坐在灯底下，拿一块布擦一只旧铜锁。<\/p>\n<p>看见我，他也不起身，只把铜锁搁下，从鼻子底下哼了一声：\"我说是谁，原来是背锅的那位。\"<\/p>\n<p>\"猴三儿，\"我拉了条小马扎坐下，\"我来问你件事。\"<\/p>\n<p>\"问吧。\"他往墙角一努嘴，\"豆芽仔，后头有茶，自己倒。\"<\/p>\n<p>我没绕弯子：\"你知不知道，桓仁这边，'五月'是个什么讲究？\"<\/p>\n<p>猴三儿擦铜锁的手停了。<\/p>\n<p>他没马上答，先抬眼皮把我从上到下打量了一遍，那眼神像是在称一件旧货的分量。<\/p>\n<p>\"你问这个，是替谁问的？\"<\/p>\n<p>\"替我自己。\"<\/p>\n<p>\"替你自己？\"他笑了一下，\"那你这锅，背得不轻。\"<\/p>\n<p>我没接他的话。<\/p>\n<p>猴三儿把布往膝上一搭，身子往后靠，靠进那张吱呀作响的旧藤椅里。<\/p>\n<p>我借着灯光，把这间铺子打量了一遍。四面墙上挂满了旧货：铜锁、门环、断了齿的锯、豁了口的水瓢，还有两只蒙尘的旧帽筒。这些东西堆在一处，看不出个门道，倒像是什么都收，什么都不扔。<\/p>\n<p>\"你爹那辈的事，你还记得这么清？\"我问。<\/p>\n<p>\"我爹记性好，我的记性随他。\"猴三儿拍了拍藤椅扶手，\"再说，那年的事，桓仁老一辈都念叨。谁家丢了人，谁家发了财，都从那一年起头。\"<\/p>\n<p>\"三十多年前的事了。\"他说，\"我那时候还小，是我爹讲的。那年开春，桓仁来了一伙外路人，穿着讲究，不像做买卖的。四月底，那伙人进了山，说是去'看货'。\"<\/p>\n<p>\"看什么货？\"<\/p>\n<p>\"我爹也没说清。\"猴三儿摇摇头，\"只知道那伙人进去以后，一个多月没出来。等到五月初，山里才下来一个。\"<\/p>\n<p>我手指头一紧。<\/p>\n<p>\"下来的那个，头发全白了。\"猴三儿说，\"回来就病了，病了大半年，后来搬走了，再没在桓仁露过面。\"<\/p>\n<p>\"五月初。\"<\/p>\n<p>\"嗯。\"猴三儿点头，\"我爹记性好，说那天是五月初一，下雨。\"<\/p>\n<p>铺子里静了一会儿。灯泡嗡了一声，光晃了晃。<\/p>\n<p>\"五月初一，下雨。\"我把这句话重复了一遍。<\/p>\n<p>\"你念叨啥呢？\"猴三儿斜眼看我。<\/p>\n<p>\"没什么。\"我说，\"就是觉得，这个日子，我好像在哪听过。\"<\/p>\n<p>话一出口，我自己心里先咯噔了一下。沟里那个缺耳的老头，一口咬定没提过五月。可\"五月初一、下雨\"这几个字，从他嘴里出来，怎么这么熟？<\/p>\n<p>我把这个念头压下去。熟归熟，没凭没据的事，不能往一块儿凑。<\/p>\n<p>\"还有一件。\"猴三儿忽然坐直了些，\"上月底，有个人来我摊上买纸钱。\"<\/p>\n<p>\"什么样的人？\"<\/p>\n<p>\"瘦，白头发，话不多。\"猴三儿比划了一下，\"买了厚厚一沓，还买了一刀黄纸。我问他给谁烧，他说不上给谁烧，就烧。\"<\/p>\n<p>\"他还说什么？\"<\/p>\n<p>\"临走，他念叨了一句。\"猴三儿把铜锁重新拿起来，翻来覆去地看，\"他说——'赶五月'。\"<\/p>\n<p>我心里一跳。<\/p>\n<p>\"就这三个字？\"<\/p>\n<p>\"就这三个字。\"猴三儿说，\"我当时没在意。这几天你们一来，我越想越觉得，这三个字，不像是随口说的。\"<\/p>\n<p>\"买纸钱的那人，往哪边走了？\"<\/p>\n<p>\"出城，往西。\"猴三儿想了想，\"过了加油站，就没影了。我那会儿还想，西边除了几座荒山，没什么去处。\"<\/p>\n<p>西边。雅河乡在西边。蜂房也在西边。<\/p>\n<p>我把这话咽回肚子里，没吭声。<\/p>\n<p>沟里那个缺耳的老头，明明白白说过，他没提过五月。可如今，桓仁这边，几十年前的老事落在五月初，上月底那个白头发瘦子又念叨\"赶五月\"，还一路往西去了。同一个\"五月\"，从不同的嘴里出来，绕了一圈，又绕回我面前。<\/p>\n<p>\"猴三儿，\"我说，\"那个拎匣子的外乡人，你跟他怎么搭上的？\"<\/p>\n<p>猴三儿把铜锁往桌上一放，声音沉了点：\"他前天来的。站在摊子外头，看了我半天，才开口。\"<\/p>\n<p>\"他说什么？\"<\/p>\n<p>\"他说，他在找一个'认字的'。\"猴三儿看着我，\"我一听这话，心里就打鼓。'认字的'这三个字，我上回听见，还是两年前——也是你们这号人。\"<\/p>\n<p>我没吭声。<\/p>\n<p>\"我没接他的茬。\"猴三儿说，\"我说我不认得。他也没纠缠，就把手里那个匣子搁在我摊上，说了一句话。\"<\/p>\n<p>\"什么话？\"<\/p>\n<p>\"他说，'认字的要是来了，让他自己开。'\"<\/p>\n<p>\"你就搁着了？\"<\/p>\n<p>\"我敢不搁着？\"猴三儿一摊手，\"那人往那儿一站，我这摊子上的铜铁都像凉了几分。东西我没敢动，绳结都没敢解，就搁在里屋。这两天我心里直发毛，早盼着你们来个人把它取走。\"<\/p>\n<p>\"匣子呢？\"<\/p>\n<p>猴三儿没答，起身往里屋走。过了一会儿，他抱出一只旧木匣来，搁在灯下的桌上。<\/p>\n<p>匣子不大，一尺来长，半尺宽，木头是老木，边角磨得发亮，上头的漆掉了大半，露出一道道木纹。匣盖上没有锁，只用一根麻绳缠了两圈，打了个死结。<\/p>\n<p>\"就这个。\"猴三儿退开半步，像是怕沾上什么，\"东西我没动。绳结我都没解。\"<\/p>\n<p>我伸手，在匣盖上摸了摸。木头凉，凉得有点反常。<\/p>\n<p>\"他还说过别的没有？\"我问，\"比如，他长什么样，从哪来，往哪去？\"<\/p>\n<p>猴三儿想了想，忽然一拍大腿。<\/p>\n<p>\"有一句，我差点忘了。\"他说，\"他走的时候，回头又问了我一句。\"<\/p>\n<p>\"问什么？\"<\/p>\n<p>\"他问——'那口锅，上过台没有？'\"<\/p>\n<p>我手里的匣子，一下子沉了。<\/p>\n<p>上过台没有。<\/p>\n<p>这世上，知道\"锅\"和\"台\"是怎么一回事的人，掰着指头都数得过来。可这个拎匣子的外乡人，头一回跟猴三儿搭话，问的就是这个。<\/p>\n<p>猴三儿瞧着我，压低了声音：\"我那时候不知道他说的是哪口锅。可你们这一来，我心里就有数了。兄弟，这匣子，你还是别在我这儿开。\"<\/p>\n<p>\"猴三儿，\"我又问，\"这两天，除了那个拎匣子的，还有没有别人来问过？\"<\/p>\n<p>\"有。\"猴三儿把布往桌上一扔，\"前天来了个矮个，问路；昨天来了个高个，买锁。两个人都没说自己从哪来。我这铺子，平时冷清得能养蜘蛛，这两天倒热闹。\"<\/p>\n<p>矮个。<\/p>\n<p>我心里又是一动。五女山上过火那一夜，抢锅的就是个矮个；废品站门口敲门的，也是缺了半截小指的人。桓仁、雅河乡、五女山，这几个地方之间，来来回回就那么几张脸。<\/p>\n<p>\"矮个长什么样？\"我问。<\/p>\n<p>\"小个子，罗圈腿，穿件深蓝夹克。\"猴三儿说，\"我没细看，他问完就走了。\"<\/p>\n<p>\"问的什么路？\"<\/p>\n<p>\"问五女山怎么走。\"猴三儿说，\"我给他指了北坡的道。\"<\/p>\n<p>我没再往下问。有些脸，问得越细，越像。<\/p>\n<p>我盯着那根缠在匣盖上的麻绳，看了半晌，才把它抱起来。<\/p>\n<p>\"猴三儿，\"我说，\"这几天，要是再有人来问，你就说什么都不知道。\"<\/p>\n<p>\"我本来就什么都不知道。\"他把铜锁重新拿起来，埋头擦着，\"我一个收破烂的，知道那么多干啥。\"<\/p>\n<p>我抱着匣子出了铺子。巷子里的风比来时凉，吹在脸上，把一路的困意都吹散了。豆芽仔把摩托推过来，我跨上后座，把匣子横抱在怀里。<\/p>\n<p>\"哥，那匣子里到底是啥？\"<\/p>\n<p>\"回头再说。\"我说，\"先走。\"<\/p>\n<p>摩托突突地响起来，冲出巷子，拐上大路。我回头看那间铺子，门帘已经放下了，灯光从帘子缝里漏出来，细细一道，像谁在暗处睁着一只眼。<\/p>", "plain": "天没黑，我跟豆芽仔就动了身。 把头留在蜂房，只交代了两句：一，见了猴三儿，先问\"五月\"；二，那个拎匣子的外乡人，能避就避。 我问他，猴三儿一个收旧货的，能知道什么。 把头说：\"收旧货的，耳朵最杂。三十年前的事，他未必记得清；三十天前的话，他一个字都不会漏。\" 桓仁县城到雅河乡，隔着两道岭。豆芽仔借了辆旧摩托，我坐在后座上，背着个空布袋——锅留在了蜂房，用不着往县城里背。风从岭上灌下来，把耳朵刮得生疼。路过第一道岭的时候，我回头看了一眼，五女山那边黑沉沉的一片，扣锅台早看不见了。 到县城，天已经擦黑。 猴三儿没在加油站，也没在白天那个路口。豆芽仔领着我，拐进后街一条小巷，巷子尽头有间铺子，门脸不大，门口堆着半人高的旧铁皮、破铜烂铁，还有几只掉漆的木箱。铺子里点着一盏白炽灯，昏黄昏黄的。 猴三儿正坐在灯底下，拿一块布擦一只旧铜锁。 看见我，他也不起身，只把铜锁搁下，从鼻子底下哼了一声：\"我说是谁，原来是背锅的那位。\" \"猴三儿，\"我拉了条小马扎坐下，\"我来问你件事。\" \"问吧。\"他往墙角一努嘴，\"豆芽仔，后头有茶，自己倒。\" 我没绕弯子：\"你知不知道，桓仁这边，'五月'是个什么讲究？\" 猴三儿擦铜锁的手停了。 他没马上答，先抬眼皮把我从上到下打量了一遍，那眼神像是在称一件旧货的分量。 \"你问这个，是替谁问的？\" \"替我自己。\" \"替你自己？\"他笑了一下，\"那你这锅，背得不轻。\" 我没接他的话。 猴三儿把布往膝上一搭，身子往后靠，靠进那张吱呀作响的旧藤椅里。 我借着灯光，把这间铺子打量了一遍。四面墙上挂满了旧货：铜锁、门环、断了齿的锯、豁了口的水瓢，还有两只蒙尘的旧帽筒。这些东西堆在一处，看不出个门道，倒像是什么都收，什么都不扔。 \"你爹那辈的事，你还记得这么清？\"我问。 \"我爹记性好，我的记性随他。\"猴三儿拍了拍藤椅扶手，\"再说，那年的事，桓仁老一辈都念叨。谁家丢了人，谁家发了财，都从那一年起头。\" \"三十多年前的事了。\"他说，\"我那时候还小，是我爹讲的。那年开春，桓仁来了一伙外路人，穿着讲究，不像做买卖的。四月底，那伙人进了山，说是去'看货'。\" \"看什么货？\" \"我爹也没说清。\"猴三儿摇摇头，\"只知道那伙人进去以后，一个多月没出来。等到五月初，山里才下来一个。\" 我手指头一紧。 \"下来的那个，头发全白了。\"猴三儿说，\"回来就病了，病了大半年，后来搬走了，再没在桓仁露过面。\" \"五月初。\" \"嗯。\"猴三儿点头，\"我爹记性好，说那天是五月初一，下雨。\" 铺子里静了一会儿。灯泡嗡了一声，光晃了晃。 \"五月初一，下雨。\"我把这句话重复了一遍。 \"你念叨啥呢？\"猴三儿斜眼看我。 \"没什么。\"我说，\"就是觉得，这个日子，我好像在哪听过。\" 话一出口，我自己心里先咯噔了一下。沟里那个缺耳的老头，一口咬定没提过五月。可\"五月初一、下雨\"这几个字，从他嘴里出来，怎么这么熟？ 我把这个念头压下去。熟归熟，没凭没据的事，不能往一块儿凑。 \"还有一件。\"猴三儿忽然坐直了些，\"上月底，有个人来我摊上买纸钱。\" \"什么样的人？\" \"瘦，白头发，话不多。\"猴三儿比划了一下，\"买了厚厚一沓，还买了一刀黄纸。我问他给谁烧，他说不上给谁烧，就烧。\" \"他还说什么？\" \"临走，他念叨了一句。\"猴三儿把铜锁重新拿起来，翻来覆去地看，\"他说——'赶五月'。\" 我心里一跳。 \"就这三个字？\" \"就这三个字。\"猴三儿说，\"我当时没在意。这几天你们一来，我越想越觉得，这三个字，不像是随口说的。\" \"买纸钱的那人，往哪边走了？\" \"出城，往西。\"猴三儿想了想，\"过了加油站，就没影了。我那会儿还想，西边除了几座荒山，没什么去处。\" 西边。雅河乡在西边。蜂房也在西边。 我把这话咽回肚子里，没吭声。 沟里那个缺耳的老头，明明白白说过，他没提过五月。可如今，桓仁这边，几十年前的老事落在五月初，上月底那个白头发瘦子又念叨\"赶五月\"，还一路往西去了。同一个\"五月\"，从不同的嘴里出来，绕了一圈，又绕回我面前。 \"猴三儿，\"我说，\"那个拎匣子的外乡人，你跟他怎么搭上的？\" 猴三儿把铜锁往桌上一放，声音沉了点：\"他前天来的。站在摊子外头，看了我半天，才开口。\" \"他说什么？\" \"他说，他在找一个'认字的'。\"猴三儿看着我，\"我一听这话，心里就打鼓。'认字的'这三个字，我上回听见，还是两年前——也是你们这号人。\" 我没吭声。 \"我没接他的茬。\"猴三儿说，\"我说我不认得。他也没纠缠，就把手里那个匣子搁在我摊上，说了一句话。\" \"什么话？\" \"他说，'认字的要是来了，让他自己开。'\" \"你就搁着了？\" \"我敢不搁着？\"猴三儿一摊手，\"那人往那儿一站，我这摊子上的铜铁都像凉了几分。东西我没敢动，绳结都没敢解，就搁在里屋。这两天我心里直发毛，早盼着你们来个人把它取走。\" \"匣子呢？\" 猴三儿没答，起身往里屋走。过了一会儿，他抱出一只旧木匣来，搁在灯下的桌上。 匣子不大，一尺来长，半尺宽，木头是老木，边角磨得发亮，上头的漆掉了大半，露出一道道木纹。匣盖上没有锁，只用一根麻绳缠了两圈，打了个死结。 \"就这个。\"猴三儿退开半步，像是怕沾上什么，\"东西我没动。绳结我都没解。\" 我伸手，在匣盖上摸了摸。木头凉，凉得有点反常。 \"他还说过别的没有？\"我问，\"比如，他长什么样，从哪来，往哪去？\" 猴三儿想了想，忽然一拍大腿。 \"有一句，我差点忘了。\"他说，\"他走的时候，回头又问了我一句。\" \"问什么？\" \"他问——'那口锅，上过台没有？'\" 我手里的匣子，一下子沉了。 上过台没有。 这世上，知道\"锅\"和\"台\"是怎么一回事的人，掰着指头都数得过来。可这个拎匣子的外乡人，头一回跟猴三儿搭话，问的就是这个。 猴三儿瞧着我，压低了声音：\"我那时候不知道他说的是哪口锅。可你们这一来，我心里就有数了。兄弟，这匣子，你还是别在我这儿开。\" \"猴三儿，\"我又问，\"这两天，除了那个拎匣子的，还有没有别人来问过？\" \"有。\"猴三儿把布往桌上一扔，\"前天来了个矮个，问路；昨天来了个高个，买锁。两个人都没说自己从哪来。我这铺子，平时冷清得能养蜘蛛，这两天倒热闹。\" 矮个。 我心里又是一动。五女山上过火那一夜，抢锅的就是个矮个；废品站门口敲门的，也是缺了半截小指的人。桓仁、雅河乡、五女山，这几个地方之间，来来回回就那么几张脸。 \"矮个长什么样？\"我问。 \"小个子，罗圈腿，穿件深蓝夹克。\"猴三儿说，\"我没细看，他问完就走了。\" \"问的什么路？\" \"问五女山怎么走。\"猴三儿说，\"我给他指了北坡的道。\" 我没再往下问。有些脸，问得越细，越像。 我盯着那根缠在匣盖上的麻绳，看了半晌，才把它抱起来。 \"猴三儿，\"我说，\"这几天，要是再有人来问，你就说什么都不知道。\" \"我本来就什么都不知道。\"他把铜锁重新拿起来，埋头擦着，\"我一个收破烂的，知道那么多干啥。\" 我抱着匣子出了铺子。巷子里的风比来时凉，吹在脸上，把一路的困意都吹散了。豆芽仔把摩托推过来，我跨上后座，把匣子横抱在怀里。 \"哥，那匣子里到底是啥？\" \"回头再说。\"我说，\"先走。\" 摩托突突地响起来，冲出巷子，拐上大路。我回头看那间铺子，门帘已经放下了，灯光从帘子缝里漏出来，细细一道，像谁在暗处睁着一只眼。"}, {"id": "A5-088", "arc": "A5", "num": 88, "title": "开匣", "md": "我没在猴三儿铺子里开那只匣子。\n\n一来，是猴三儿那副避之不及的样子，让我心里发毛；二来，把头交代过，见了生人、见了生东西，先别自己拿主意。\n\n我把匣子用布裹了，塞进摩托后座的布袋里，连夜赶回雅河乡。\n\n回程的岭上起了雾。摩托灯照出去，雾里一团一团的白，像有人在前头撒了棉花。豆芽仔开得慢，我坐在后座上，一手扶着车，一手按着布袋，生怕那匣子在颠簸里翻出来。走到半坡，车灯照见路边一棵歪脖子树，我心里忽然一跳——那树长得，跟扣锅台边那棵老榆，像一个模子刻出来的。\n\n\"停一下。\"我说。\n\n豆芽仔把车停住。我下了车，站在路边往回看。雾大，什么也看不见，只有两道车辙印在身后拖着，一直拖进黑里。\n\n\"哥，咋了？\"\n\n\"没事。\"我上了车，\"走吧。\"\n\n我只是想确认一件事——身后没有尾巴。\n\n到蜂房，已是后半夜。\n\n院门虚掩着，屋里的灯还亮着。把头没睡，正坐在炕沿上抽烟，烟灰缸里堆了小半缸烟头。他看见我进门，把烟按灭。\n\n\"匣子呢？\"\n\n我把匣子搁在炕桌上。把头没急着解绳，先绕着匣子转了一圈，又伸手在匣盖上摸了一遍。\n\n\"这绳，\"他忽然说，\"是活的。\"\n\n\"活的？\"\n\n\"你瞧。\"他捏起绳头，凑到灯下，\"缠了两圈，看着是死结，其实是个活扣。一抽就开。打这结的人，没想让它锁着。\"\n\n他把绳头一抽，麻绳松开了。\n\n匣盖掀起来，一股陈年的木头味混着一点桐油味散出来。那味道不冲，压在里头很多年了，一开盖，才慢慢往外渗。\n\n匣子里铺着一层发黄的粗布。粗布底下，是两样东西。\n\n上头那件，是一块巴掌大的铜模，扁扁的，边缘磨得溜圆，正面刻着一道凹下去的纹——鱼尾。\n\n不是画上去的，是刻的。一深一浅两道槽，从纹头到纹尾，收得干干净净。铜模背面有一层暗绿的锈，正面却擦得发亮，像是有人常拿在手里摩挲。\n\n我把照魇镜从怀里掏出来，翻到背面，跟那铜模并在一处。镜背的纹是凸的，模子上的纹是凹的。凹的对着凸的，严丝合缝，像两块牙咬上了。\n\n\"这是做信的模子。\"把头的声音很轻，\"镜子、罐子、锅、契，上头的守纹，都是拿它压出来的。\"\n\n我手心里全是汗。\n\n四件套的纹，我一直以为是一样一样刻上去的。原来不是。原来是有人先做了这么一块模子，再照着模子，把纹压到每一件信物上。\n\n\"一套信，一副模。\"把头说，\"模子在谁手里，谁就是做信的人。\"\n\n\"那这模子，怎么会在匣子里？\"\n\n\"做信的人，把模子留下了。\"把头说，\"留下模子，是留个凭据——往后谁对不上纹，拿模子一验就知道。\"\n\n\"可模子要是叫人仿了呢？\"\n\n\"仿不了。\"把头把那块铜模翻过来，指给我看背面，\"你瞧这锈，老铜，包浆厚，边角磨得溜圆，少说上百年。新仿的模子，锈是浮的，一擦就掉。\"\n\n我凑过去看。铜模背面那层绿锈，一层压着一层，深的地方发黑，浅的地方泛青，像老墙根底下积年的苔。这样的东西，不是谁想仿就能仿的。\n\n\"照这么说，\"我慢慢地说，\"这匣子，是'做信'那一家的家底。\"\n\n\"至少是家底里的一件。\"把头把铜模放回去，\"肯把模子拿出来给人看的，不是求人，就是请人。\"\n\n我把铜模轻轻放回匣里，看底下那件东西。\n\n粗布下面，压着半张旧纸。\n\n纸是黄麻纸，边角都烂了，只剩大半张。上头用墨画着一样东西——五口锅，倒扣着，摆成五方。东南西北各一口，当间一口。西南那个角，空着。\n\n我一眼就认出来了。\n\n鹰嘴沟石室里那五口倒扣的锅，就是这么摆的。西南空出来的那一位，也是这么空的。\n\n我盯着那张纸，喉咙有点发紧。\n\n\"把头，这是石室的图。\"\n\n\"嗯。\"把头也盯着，\"不是图，是位。\"他伸手指点着，\"五个位子，五个部。西南空着的这个位子，就是缺的那一个。\"\n\n\"消奴部。\"\n\n\"对。\"把头说，\"做信的人，早就把位子画好了。后来消奴部出了事，那个位子就空着。空了，也得留着。\"\n\n\"留着做什么？\"\n\n\"等人来填。\"把头说，\"位子是死的，人是活的。位子空着，就总有一天得有人坐上去。\"\n\n我心里那点说不清的东西，又沉了一层。这半年来，从鹰嘴沟到五女山，我们东奔西走，原来走的每一步，都落在这张纸上。\n\n我把纸翻过来。背面还有字，竖着写，字小，墨淡，得凑到灯底下才看得清。\n\n头一行写着四个字：信不认人。\n\n底下跟着一行：五月，信归位。\n\n再往下，是一串符号，有的像鱼尾，有的像勾，有的像缺了口的圈。我不认得，把头也不认得。\n\n\"这不是字。\"把头看了半天，摇头，\"这是记。五个部，五个记。做信的人，拿这个对信。\"\n\n\"跟石室缝口那排钎眼，是不是一路的？\"\n\n\"像。\"把头没把话说死，\"可没凭没据，先搁着。\"\n\n他把那半张纸捏起来，对着灯又看了一遍，忽然停住了。\n\n\"你看这儿。\"他指给我看。\n\n纸的最下边，靠边角的位置，还有一行极小的字，是后来添上去的，墨色比别处新。写着几个字，笔画细得像头发丝。我凑到跟前，眯着眼，一个字一个字地认。\n\n\"消……奴……空。\"\n\n我把这三个字念出来，屋里静了。\n\n窗外头，风穿过那几只空蜂箱，嗡嗡地响，像是还有一窝蜂没走。\n\n\"把头，\"我说，\"这匣子，是谁放在猴三儿那儿的？\"\n\n\"你说是谁？\"\n\n\"那个外乡人。\"\n\n\"那个外乡人，又是替谁跑腿的？\"把头把纸放回匣里，盖上盖子，\"能拿出做信的模子，能画出石室的位，能知道消奴部空着——这个人，不是抢锅的，也不是点灯的。\"\n\n\"那是哪一路的？\"\n\n\"是'做'这一路的。\"把头说，\"他们把信做出来，散到各部去。如今信散了，名分乱了，他们就得出来，把信一件一件对回去。\"\n\n\"对回去做什么？\"\n\n\"认名分。\"把头说，\"信对上了，名分才算数。\"\n\n我心里咯噔一下。\n\n\"那他们找'认字的'——\"\n\n\"找的就是你。\"把头看着我，\"你手里有契，有锅，有镜，认下的又是消奴部的名分。做信的人要认名分，绕不过你去。\"\n\n我低头看着那只匣子。匣子开着，铜模和旧纸安安静静躺在粗布上，像是等了很久，就等有人来开。\n\n\"这匣子，是给您的，还是给我的？\"我问。\n\n\"匣子不认人。\"把头把匣盖合上，\"谁开的，就归谁。\"\n\n他把匣子推到我面前。\n\n\"收好。\"他说，\"这是请帖，也是考卷。\"\n\n\"请帖我懂。\"我说，\"考卷是什么？\"\n\n\"做信的人找上门，是要你认这个名分。\"把头说，\"可认不认，人家不逼你。他要看的是——你接不接得住。\"\n\n\"接不住呢？\"\n\n\"接不住，信就还散着。\"把头把灯芯拨了拨，\"散着的信，迟早落到别人手里。\"\n\n我把匣子抱起来，刚要往柜子里放，院门外忽然响了一下。\n\n不是风。\n\n是脚踩在碎砖上的声音，轻轻的，就一下。\n\n我跟把头对视了一眼。把头没动，只把手往炕席底下一按——那儿搁着他的家伙。我放下匣子，抓起墙边的铁锹，轻手轻脚走到门后。\n\n门外没再响。\n\n过了好一会儿，才有一个声音，隔着院墙传进来，不高，也不急。\n\n\"匣子开了吧？\"\n\n我握着铁锹的手一紧。\n\n\"开了就好。\"那声音说，\"我不进屋。明儿天黑，我在村口老槐树底下等你们。谁是认字的，谁来。\"\n\n声音落下，院墙外再没了动静。\n\n我握着铁锹，在门后站了很久。等把头示意，我才轻轻拉开门。院门口的碎砖上，连个脚印都没留下。\n\n\"人呢？\"我问。\n\n\"走了。\"把头站在院里，往四下的黑里看了一圈，\"来的是生人，落脚没根，走起来也快。\"\n\n我忽然想起他白天那句话——来的是生人，脚底下没根。\n\n\"把头，\"我说，\"他为什么不进屋？\"\n\n\"因为匣子已经开了。\"把头说，\"他要看的东西，都看见了。剩下的，就看你明晚去不去。\"", "words": 2849, "html": "<p>我没在猴三儿铺子里开那只匣子。<\/p>\n<p>一来，是猴三儿那副避之不及的样子，让我心里发毛；二来，把头交代过，见了生人、见了生东西，先别自己拿主意。<\/p>\n<p>我把匣子用布裹了，塞进摩托后座的布袋里，连夜赶回雅河乡。<\/p>\n<p>回程的岭上起了雾。摩托灯照出去，雾里一团一团的白，像有人在前头撒了棉花。豆芽仔开得慢，我坐在后座上，一手扶着车，一手按着布袋，生怕那匣子在颠簸里翻出来。走到半坡，车灯照见路边一棵歪脖子树，我心里忽然一跳——那树长得，跟扣锅台边那棵老榆，像一个模子刻出来的。<\/p>\n<p>\"停一下。\"我说。<\/p>\n<p>豆芽仔把车停住。我下了车，站在路边往回看。雾大，什么也看不见，只有两道车辙印在身后拖着，一直拖进黑里。<\/p>\n<p>\"哥，咋了？\"<\/p>\n<p>\"没事。\"我上了车，\"走吧。\"<\/p>\n<p>我只是想确认一件事——身后没有尾巴。<\/p>\n<p>到蜂房，已是后半夜。<\/p>\n<p>院门虚掩着，屋里的灯还亮着。把头没睡，正坐在炕沿上抽烟，烟灰缸里堆了小半缸烟头。他看见我进门，把烟按灭。<\/p>\n<p>\"匣子呢？\"<\/p>\n<p>我把匣子搁在炕桌上。把头没急着解绳，先绕着匣子转了一圈，又伸手在匣盖上摸了一遍。<\/p>\n<p>\"这绳，\"他忽然说，\"是活的。\"<\/p>\n<p>\"活的？\"<\/p>\n<p>\"你瞧。\"他捏起绳头，凑到灯下，\"缠了两圈，看着是死结，其实是个活扣。一抽就开。打这结的人，没想让它锁着。\"<\/p>\n<p>他把绳头一抽，麻绳松开了。<\/p>\n<p>匣盖掀起来，一股陈年的木头味混着一点桐油味散出来。那味道不冲，压在里头很多年了，一开盖，才慢慢往外渗。<\/p>\n<p>匣子里铺着一层发黄的粗布。粗布底下，是两样东西。<\/p>\n<p>上头那件，是一块巴掌大的铜模，扁扁的，边缘磨得溜圆，正面刻着一道凹下去的纹——鱼尾。<\/p>\n<p>不是画上去的，是刻的。一深一浅两道槽，从纹头到纹尾，收得干干净净。铜模背面有一层暗绿的锈，正面却擦得发亮，像是有人常拿在手里摩挲。<\/p>\n<p>我把照魇镜从怀里掏出来，翻到背面，跟那铜模并在一处。镜背的纹是凸的，模子上的纹是凹的。凹的对着凸的，严丝合缝，像两块牙咬上了。<\/p>\n<p>\"这是做信的模子。\"把头的声音很轻，\"镜子、罐子、锅、契，上头的守纹，都是拿它压出来的。\"<\/p>\n<p>我手心里全是汗。<\/p>\n<p>四件套的纹，我一直以为是一样一样刻上去的。原来不是。原来是有人先做了这么一块模子，再照着模子，把纹压到每一件信物上。<\/p>\n<p>\"一套信，一副模。\"把头说，\"模子在谁手里，谁就是做信的人。\"<\/p>\n<p>\"那这模子，怎么会在匣子里？\"<\/p>\n<p>\"做信的人，把模子留下了。\"把头说，\"留下模子，是留个凭据——往后谁对不上纹，拿模子一验就知道。\"<\/p>\n<p>\"可模子要是叫人仿了呢？\"<\/p>\n<p>\"仿不了。\"把头把那块铜模翻过来，指给我看背面，\"你瞧这锈，老铜，包浆厚，边角磨得溜圆，少说上百年。新仿的模子，锈是浮的，一擦就掉。\"<\/p>\n<p>我凑过去看。铜模背面那层绿锈，一层压着一层，深的地方发黑，浅的地方泛青，像老墙根底下积年的苔。这样的东西，不是谁想仿就能仿的。<\/p>\n<p>\"照这么说，\"我慢慢地说，\"这匣子，是'做信'那一家的家底。\"<\/p>\n<p>\"至少是家底里的一件。\"把头把铜模放回去，\"肯把模子拿出来给人看的，不是求人，就是请人。\"<\/p>\n<p>我把铜模轻轻放回匣里，看底下那件东西。<\/p>\n<p>粗布下面，压着半张旧纸。<\/p>\n<p>纸是黄麻纸，边角都烂了，只剩大半张。上头用墨画着一样东西——五口锅，倒扣着，摆成五方。东南西北各一口，当间一口。西南那个角，空着。<\/p>\n<p>我一眼就认出来了。<\/p>\n<p>鹰嘴沟石室里那五口倒扣的锅，就是这么摆的。西南空出来的那一位，也是这么空的。<\/p>\n<p>我盯着那张纸，喉咙有点发紧。<\/p>\n<p>\"把头，这是石室的图。\"<\/p>\n<p>\"嗯。\"把头也盯着，\"不是图，是位。\"他伸手指点着，\"五个位子，五个部。西南空着的这个位子，就是缺的那一个。\"<\/p>\n<p>\"消奴部。\"<\/p>\n<p>\"对。\"把头说，\"做信的人，早就把位子画好了。后来消奴部出了事，那个位子就空着。空了，也得留着。\"<\/p>\n<p>\"留着做什么？\"<\/p>\n<p>\"等人来填。\"把头说，\"位子是死的，人是活的。位子空着，就总有一天得有人坐上去。\"<\/p>\n<p>我心里那点说不清的东西，又沉了一层。这半年来，从鹰嘴沟到五女山，我们东奔西走，原来走的每一步，都落在这张纸上。<\/p>\n<p>我把纸翻过来。背面还有字，竖着写，字小，墨淡，得凑到灯底下才看得清。<\/p>\n<p>头一行写着四个字：信不认人。<\/p>\n<p>底下跟着一行：五月，信归位。<\/p>\n<p>再往下，是一串符号，有的像鱼尾，有的像勾，有的像缺了口的圈。我不认得，把头也不认得。<\/p>\n<p>\"这不是字。\"把头看了半天，摇头，\"这是记。五个部，五个记。做信的人，拿这个对信。\"<\/p>\n<p>\"跟石室缝口那排钎眼，是不是一路的？\"<\/p>\n<p>\"像。\"把头没把话说死，\"可没凭没据，先搁着。\"<\/p>\n<p>他把那半张纸捏起来，对着灯又看了一遍，忽然停住了。<\/p>\n<p>\"你看这儿。\"他指给我看。<\/p>\n<p>纸的最下边，靠边角的位置，还有一行极小的字，是后来添上去的，墨色比别处新。写着几个字，笔画细得像头发丝。我凑到跟前，眯着眼，一个字一个字地认。<\/p>\n<p>\"消……奴……空。\"<\/p>\n<p>我把这三个字念出来，屋里静了。<\/p>\n<p>窗外头，风穿过那几只空蜂箱，嗡嗡地响，像是还有一窝蜂没走。<\/p>\n<p>\"把头，\"我说，\"这匣子，是谁放在猴三儿那儿的？\"<\/p>\n<p>\"你说是谁？\"<\/p>\n<p>\"那个外乡人。\"<\/p>\n<p>\"那个外乡人，又是替谁跑腿的？\"把头把纸放回匣里，盖上盖子，\"能拿出做信的模子，能画出石室的位，能知道消奴部空着——这个人，不是抢锅的，也不是点灯的。\"<\/p>\n<p>\"那是哪一路的？\"<\/p>\n<p>\"是'做'这一路的。\"把头说，\"他们把信做出来，散到各部去。如今信散了，名分乱了，他们就得出来，把信一件一件对回去。\"<\/p>\n<p>\"对回去做什么？\"<\/p>\n<p>\"认名分。\"把头说，\"信对上了，名分才算数。\"<\/p>\n<p>我心里咯噔一下。<\/p>\n<p>\"那他们找'认字的'——\"<\/p>\n<p>\"找的就是你。\"把头看着我，\"你手里有契，有锅，有镜，认下的又是消奴部的名分。做信的人要认名分，绕不过你去。\"<\/p>\n<p>我低头看着那只匣子。匣子开着，铜模和旧纸安安静静躺在粗布上，像是等了很久，就等有人来开。<\/p>\n<p>\"这匣子，是给您的，还是给我的？\"我问。<\/p>\n<p>\"匣子不认人。\"把头把匣盖合上，\"谁开的，就归谁。\"<\/p>\n<p>他把匣子推到我面前。<\/p>\n<p>\"收好。\"他说，\"这是请帖，也是考卷。\"<\/p>\n<p>\"请帖我懂。\"我说，\"考卷是什么？\"<\/p>\n<p>\"做信的人找上门，是要你认这个名分。\"把头说，\"可认不认，人家不逼你。他要看的是——你接不接得住。\"<\/p>\n<p>\"接不住呢？\"<\/p>\n<p>\"接不住，信就还散着。\"把头把灯芯拨了拨，\"散着的信，迟早落到别人手里。\"<\/p>\n<p>我把匣子抱起来，刚要往柜子里放，院门外忽然响了一下。<\/p>\n<p>不是风。<\/p>\n<p>是脚踩在碎砖上的声音，轻轻的，就一下。<\/p>\n<p>我跟把头对视了一眼。把头没动，只把手往炕席底下一按——那儿搁着他的家伙。我放下匣子，抓起墙边的铁锹，轻手轻脚走到门后。<\/p>\n<p>门外没再响。<\/p>\n<p>过了好一会儿，才有一个声音，隔着院墙传进来，不高，也不急。<\/p>\n<p>\"匣子开了吧？\"<\/p>\n<p>我握着铁锹的手一紧。<\/p>\n<p>\"开了就好。\"那声音说，\"我不进屋。明儿天黑，我在村口老槐树底下等你们。谁是认字的，谁来。\"<\/p>\n<p>声音落下，院墙外再没了动静。<\/p>\n<p>我握着铁锹，在门后站了很久。等把头示意，我才轻轻拉开门。院门口的碎砖上，连个脚印都没留下。<\/p>\n<p>\"人呢？\"我问。<\/p>\n<p>\"走了。\"把头站在院里，往四下的黑里看了一圈，\"来的是生人，落脚没根，走起来也快。\"<\/p>\n<p>我忽然想起他白天那句话——来的是生人，脚底下没根。<\/p>\n<p>\"把头，\"我说，\"他为什么不进屋？\"<\/p>\n<p>\"因为匣子已经开了。\"把头说，\"他要看的东西，都看见了。剩下的，就看你明晚去不去。\"<\/p>", "plain": "我没在猴三儿铺子里开那只匣子。 一来，是猴三儿那副避之不及的样子，让我心里发毛；二来，把头交代过，见了生人、见了生东西，先别自己拿主意。 我把匣子用布裹了，塞进摩托后座的布袋里，连夜赶回雅河乡。 回程的岭上起了雾。摩托灯照出去，雾里一团一团的白，像有人在前头撒了棉花。豆芽仔开得慢，我坐在后座上，一手扶着车，一手按着布袋，生怕那匣子在颠簸里翻出来。走到半坡，车灯照见路边一棵歪脖子树，我心里忽然一跳——那树长得，跟扣锅台边那棵老榆，像一个模子刻出来的。 \"停一下。\"我说。 豆芽仔把车停住。我下了车，站在路边往回看。雾大，什么也看不见，只有两道车辙印在身后拖着，一直拖进黑里。 \"哥，咋了？\" \"没事。\"我上了车，\"走吧。\" 我只是想确认一件事——身后没有尾巴。 到蜂房，已是后半夜。 院门虚掩着，屋里的灯还亮着。把头没睡，正坐在炕沿上抽烟，烟灰缸里堆了小半缸烟头。他看见我进门，把烟按灭。 \"匣子呢？\" 我把匣子搁在炕桌上。把头没急着解绳，先绕着匣子转了一圈，又伸手在匣盖上摸了一遍。 \"这绳，\"他忽然说，\"是活的。\" \"活的？\" \"你瞧。\"他捏起绳头，凑到灯下，\"缠了两圈，看着是死结，其实是个活扣。一抽就开。打这结的人，没想让它锁着。\" 他把绳头一抽，麻绳松开了。 匣盖掀起来，一股陈年的木头味混着一点桐油味散出来。那味道不冲，压在里头很多年了，一开盖，才慢慢往外渗。 匣子里铺着一层发黄的粗布。粗布底下，是两样东西。 上头那件，是一块巴掌大的铜模，扁扁的，边缘磨得溜圆，正面刻着一道凹下去的纹——鱼尾。 不是画上去的，是刻的。一深一浅两道槽，从纹头到纹尾，收得干干净净。铜模背面有一层暗绿的锈，正面却擦得发亮，像是有人常拿在手里摩挲。 我把照魇镜从怀里掏出来，翻到背面，跟那铜模并在一处。镜背的纹是凸的，模子上的纹是凹的。凹的对着凸的，严丝合缝，像两块牙咬上了。 \"这是做信的模子。\"把头的声音很轻，\"镜子、罐子、锅、契，上头的守纹，都是拿它压出来的。\" 我手心里全是汗。 四件套的纹，我一直以为是一样一样刻上去的。原来不是。原来是有人先做了这么一块模子，再照着模子，把纹压到每一件信物上。 \"一套信，一副模。\"把头说，\"模子在谁手里，谁就是做信的人。\" \"那这模子，怎么会在匣子里？\" \"做信的人，把模子留下了。\"把头说，\"留下模子，是留个凭据——往后谁对不上纹，拿模子一验就知道。\" \"可模子要是叫人仿了呢？\" \"仿不了。\"把头把那块铜模翻过来，指给我看背面，\"你瞧这锈，老铜，包浆厚，边角磨得溜圆，少说上百年。新仿的模子，锈是浮的，一擦就掉。\" 我凑过去看。铜模背面那层绿锈，一层压着一层，深的地方发黑，浅的地方泛青，像老墙根底下积年的苔。这样的东西，不是谁想仿就能仿的。 \"照这么说，\"我慢慢地说，\"这匣子，是'做信'那一家的家底。\" \"至少是家底里的一件。\"把头把铜模放回去，\"肯把模子拿出来给人看的，不是求人，就是请人。\" 我把铜模轻轻放回匣里，看底下那件东西。 粗布下面，压着半张旧纸。 纸是黄麻纸，边角都烂了，只剩大半张。上头用墨画着一样东西——五口锅，倒扣着，摆成五方。东南西北各一口，当间一口。西南那个角，空着。 我一眼就认出来了。 鹰嘴沟石室里那五口倒扣的锅，就是这么摆的。西南空出来的那一位，也是这么空的。 我盯着那张纸，喉咙有点发紧。 \"把头，这是石室的图。\" \"嗯。\"把头也盯着，\"不是图，是位。\"他伸手指点着，\"五个位子，五个部。西南空着的这个位子，就是缺的那一个。\" \"消奴部。\" \"对。\"把头说，\"做信的人，早就把位子画好了。后来消奴部出了事，那个位子就空着。空了，也得留着。\" \"留着做什么？\" \"等人来填。\"把头说，\"位子是死的，人是活的。位子空着，就总有一天得有人坐上去。\" 我心里那点说不清的东西，又沉了一层。这半年来，从鹰嘴沟到五女山，我们东奔西走，原来走的每一步，都落在这张纸上。 我把纸翻过来。背面还有字，竖着写，字小，墨淡，得凑到灯底下才看得清。 头一行写着四个字：信不认人。 底下跟着一行：五月，信归位。 再往下，是一串符号，有的像鱼尾，有的像勾，有的像缺了口的圈。我不认得，把头也不认得。 \"这不是字。\"把头看了半天，摇头，\"这是记。五个部，五个记。做信的人，拿这个对信。\" \"跟石室缝口那排钎眼，是不是一路的？\" \"像。\"把头没把话说死，\"可没凭没据，先搁着。\" 他把那半张纸捏起来，对着灯又看了一遍，忽然停住了。 \"你看这儿。\"他指给我看。 纸的最下边，靠边角的位置，还有一行极小的字，是后来添上去的，墨色比别处新。写着几个字，笔画细得像头发丝。我凑到跟前，眯着眼，一个字一个字地认。 \"消……奴……空。\" 我把这三个字念出来，屋里静了。 窗外头，风穿过那几只空蜂箱，嗡嗡地响，像是还有一窝蜂没走。 \"把头，\"我说，\"这匣子，是谁放在猴三儿那儿的？\" \"你说是谁？\" \"那个外乡人。\" \"那个外乡人，又是替谁跑腿的？\"把头把纸放回匣里，盖上盖子，\"能拿出做信的模子，能画出石室的位，能知道消奴部空着——这个人，不是抢锅的，也不是点灯的。\" \"那是哪一路的？\" \"是'做'这一路的。\"把头说，\"他们把信做出来，散到各部去。如今信散了，名分乱了，他们就得出来，把信一件一件对回去。\" \"对回去做什么？\" \"认名分。\"把头说，\"信对上了，名分才算数。\" 我心里咯噔一下。 \"那他们找'认字的'——\" \"找的就是你。\"把头看着我，\"你手里有契，有锅，有镜，认下的又是消奴部的名分。做信的人要认名分，绕不过你去。\" 我低头看着那只匣子。匣子开着，铜模和旧纸安安静静躺在粗布上，像是等了很久，就等有人来开。 \"这匣子，是给您的，还是给我的？\"我问。 \"匣子不认人。\"把头把匣盖合上，\"谁开的，就归谁。\" 他把匣子推到我面前。 \"收好。\"他说，\"这是请帖，也是考卷。\" \"请帖我懂。\"我说，\"考卷是什么？\" \"做信的人找上门，是要你认这个名分。\"把头说，\"可认不认，人家不逼你。他要看的是——你接不接得住。\" \"接不住呢？\" \"接不住，信就还散着。\"把头把灯芯拨了拨，\"散着的信，迟早落到别人手里。\" 我把匣子抱起来，刚要往柜子里放，院门外忽然响了一下。 不是风。 是脚踩在碎砖上的声音，轻轻的，就一下。 我跟把头对视了一眼。把头没动，只把手往炕席底下一按——那儿搁着他的家伙。我放下匣子，抓起墙边的铁锹，轻手轻脚走到门后。 门外没再响。 过了好一会儿，才有一个声音，隔着院墙传进来，不高，也不急。 \"匣子开了吧？\" 我握着铁锹的手一紧。 \"开了就好。\"那声音说，\"我不进屋。明儿天黑，我在村口老槐树底下等你们。谁是认字的，谁来。\" 声音落下，院墙外再没了动静。 我握着铁锹，在门后站了很久。等把头示意，我才轻轻拉开门。院门口的碎砖上，连个脚印都没留下。 \"人呢？\"我问。 \"走了。\"把头站在院里，往四下的黑里看了一圈，\"来的是生人，落脚没根，走起来也快。\" 我忽然想起他白天那句话——来的是生人，脚底下没根。 \"把头，\"我说，\"他为什么不进屋？\" \"因为匣子已经开了。\"把头说，\"他要看的东西，都看见了。剩下的，就看你明晚去不去。\""}, {"id": "A5-089", "arc": "A5", "num": 89, "title": "验信", "md": "第二天天没黑，我就动了身。\n\n把头没跟我一起走。他说，他躲在暗处看，比我站在明处问，能多看出一层东西。豆芽仔留在村口小卖部门口，装作等人。\n\n村口那棵老槐树，得两个人合抱。树底下有块青石，磨得光溜溜的，平时是村里老人纳凉坐的。\n\n我到的时候，那人已经在了。\n\n他坐在青石上，背对着村口，穿一件洗得发白的旧褂子，袖口挽着，露出一截手腕。他手里什么也没拿，就那么坐着，像坐了半宿。\n\n听见脚步，他回过头。\n\n四十来岁，脸瘦，颧骨高，眉毛很淡。手上有茧，指关节粗，虎口那块皮发亮——是常年握刀握凿的人。\n\n\"你就是认字的？\"他问。\n\n\"是我。\"\n\n\"坐。\"他往青石另一头让了让，\"我不爱站着说话。\"\n\n我在他旁边坐下。老槐树的叶子在头顶上响，一片一片，掉下来。\n\n\"匣子，你开了。\"\n\n\"开了。\"\n\n\"模子认出来了？\"\n\n\"认出来了。\"\n\n他点点头，像是早就知道答案。\n\n\"我姓什么，你不要问。\"他说，\"你记着我是做信的，就行。\"\n\n\"做信的。\"我把这两个字在嘴里过了一遍，\"信是你们做的？\"\n\n\"镜、罐、锅、契，还有你们没见过的那几件，都是我家祖上一手做的。\"他说，\"做完，散出去。散出去的信，认了名分，才算数。\"\n\n\"信不认人，只认名分。\"我说。\n\n他侧头看了我一眼，眼神里有点意外，随即又平下去。\n\n\"匣子里那张纸，你看了。\"\n\n\"看了。\"\n\n\"那你该知道，我是来做什么的。\"他把手伸过来，\"东西给我看看。\"\n\n我犹豫了一下。他也没催，就那么伸着手。\n\n我把照魇镜从怀里掏出来，放在他手心。他接过去，翻到背面，凑着天光看了半晌，又用拇指在鱼尾纹上慢慢摩了一遍。\n\n\"刻的。\"他说，\"刀口收得干净，是我家老辈的手。\"\n\n\"您凭这个，就能认出是谁做的？\"\n\n\"认得出。\"他说，\"刻纹跟写字一样，一个人的手，一辈子改不了。这道纹的起刀，是往怀里带的；收刀，是往外撇的。我们家就这一位，用这个手法。\"\n\n他把镜子还我，又伸出手：\"锅呢？\"\n\n\"锅不在身上。\"\n\n\"背着沉，我知道。\"他说，\"那就看契。\"\n\n我把阴契掏出来。他捏着契的一角，对着斜下来的天光，翻来覆去地看，看得极慢。看到右下角，他停住了。\n\n\"压的。\"他声音低了一点，\"这一道，是拿模子压的。\"\n\n\"跟镜背上的不一样。\"我说。\n\n\"镜背是刻的，契角是压的。\"他说，\"刻的，是给明面上看的；压的，是给自家人认的。\"\n\n\"自家人？\"\n\n\"五部立誓那会儿，五件信，五部各拿一件。\"他把契还给我，\"明面上的纹，各不一样；压上去的这道鱼尾，是一模一样的。见了这道压纹，就是自家人。\"\n\n我把镜子和契收好。\n\n\"三件都是真的。\"他说，\"少了件罐。\"\n\n\"我上五女山那夜，见过一个问灯的老头。\"我说，\"灰褂子，白头发，缺了多半截左耳——\"\n\n\"缺耳？\"他打断我，\"左边还是右边？\"\n\n\"左边。\"\n\n他没接话，只把契还我的那只手顿了顿，又收了回去。\n\n\"他跟你说了什么？\"\n\n\"他说，他问的是'谁想点，想清没有'。\"\n\n\"这话像他说的。\"做信的人点点头，随即又把脸沉下去，\"可他不是我们家的。\"\n\n\"那是哪家的？\"\n\n\"我不知道。\"他说，\"做信的不点灯。点灯的、问灯的，是后来才分出去的。分出去以后，各走各的路，谁也不认谁。\"\n\n这话说得含糊，可我听得心里发紧。做信、点灯、问灯，原是一家人，后来散了——这跟五部散伙，倒像一个道理。\n\n\"罐在掌灯的手里。\"我说，\"前些日子，按约交出去了。\"\n\n\"我知道。\"他点点头，\"掌灯的手里那件，是我家散出去的头一件。\"\n\n我没接话。\n\n\"扣锅台台心那道记，\"他忽然说，\"是我留的。\"\n\n我心里一跳，面上没动。\n\n\"那晚我在台下。\"他说，\"你们三路都在台上，我不上去。等你们都走了，我上去，在印心划了一道。\"\n\n\"记什么？\"\n\n\"记锅。\"他说，\"我要看看，那口锅回没回来，有没有人认。\"\n\n\"您怎么知道我背的是那口锅？\"\n\n\"锅底当间有纹。\"他说，\"我划在印心，就是划在纹上。认得纹的人，才看得懂这道记。\"\n\n我看着他。天光一点点暗下去，他半张脸埋进树影里。\n\n\"三路人马，\"我说，\"点灯的，吹灯的，问灯的。您算哪一路？\"\n\n\"我不点灯，也不吹灯。\"他说，\"我只管信。信齐了，我认；信缺了，我不认。\"\n\n\"那您认我吗？\"\n\n他没马上答。他把两手交叠着放在膝上，看着村口那条土路。\n\n\"你认下的是消奴部的名分。\"他说，\"消奴部那件信，是一口空锅。锅是空的，契是无字的，连纹，都比别人少一道。\"\n\n\"为什么？\"\n\n\"因为消奴部的名分，早叫人抹了。\"他说，\"抹了名分的部，信也空着。这是祖上的规矩——名分没了，信就空着，等有人来认。\"\n\n\"所以锅是空的。\"\n\n\"对。\"他说，\"空锅不是没信，是信在等人。\"\n\n我脑子里那些散了半年的东西，忽然一根一根串了起来。空锅、无字契、西南空位、第五盏没主的灯——绕来绕去，说的都是一件事：消奴部的名分空着，等一个人来按手印。\n\n\"您找'认字的'，\"我说，\"就是来认这个名分的。\"\n\n\"我来验。\"他说，\"认不认，是你的事；信真不真，是我的事。\"\n\n天彻底黑了。村口小卖部亮了灯，豆芽仔在门口晃来晃去，装作买烟。\n\n\"灯会的事，你知道多少？\"我问。\n\n\"不多。\"他说，\"我只知道，掌灯的要在灯会那天，把散出去的信都收回来。收回来，信才归位；信归位了，名分才明。\"\n\n\"收回去以后呢？\"\n\n\"收回去以后，信归谁，名分就归谁。\"他看着我，\"你手里有锅，有契，有镜。掌灯的手里有一件罐。还有一件，散在外头，谁也没拿着。\"\n\n\"哪一件？\"\n\n\"第五件。\"他说，\"那件信，五部里最要紧的一件。落在谁手里，我不知道。可灯会那天，它一定会出现。\"\n\n\"为什么一定会出现？\"\n\n\"因为缺一件，信就不齐。\"他站起来，拍了拍褂子上的灰，\"信不齐，山就不认账。点灯的、吹灯的、做信的，都白忙一场。\"\n\n\"您等了这么多年，\"我忍不住问，\"就为等信齐？\"\n\n\"我家等了三辈。\"他说，\"信是我家做出去的，散了，就得我家看着它一件件回来。这是祖上的账。\"\n\n\"这账，还了多少年了？\"我问。\n\n\"从我爷爷的爷爷那辈起。\"他说，\"一茬人收一回，收不齐，就等下一茬。到我这辈，剩得已经不多了。\"\n\n\"剩几件？\"\n\n\"剩三件。\"他伸出手，比了个数，\"一件在掌灯的手里，一件在你身上，还有一件，不知去向。\"\n\n我心里一沉。原来散出去的信，如今只剩三件还没归位。而这五件里，有两件，都跟我有关。我忽然觉得，怀里那三样东西，比背一口锅还沉。\n\n他往村口外头走，走了两步，又停下。\n\n\"还有一句，我送你。\"他回过头，\"掌灯的那根灯芯，你先别点。\"\n\n\"为什么？\"\n\n\"灯芯是干的。\"他说，\"点灯要油。油，不在你手里。\"\n\n说完，他拐出村口，往黑里去了。\n\n我坐在青石上，半天没动。\n\n油不在我手里。\n\n我把这句话翻来覆去地想。问灯的老头给了我灯芯，掌灯的草帽人掌着灯——灯芯、灯，都齐了，可灯要亮，还得有油。油在哪？\n\n我站起来，往村口小卖部走。豆芽仔迎上来，刚要开口，我先问了：\"把头呢？\"\n\n豆芽仔往身后努了努嘴。\n\n老槐树后头的暗影里，把头不知什么时候站到了那儿，烟头一明一灭。\n\n\"都听见了。\"他说，\"回去吧。\"\n\n回蜂房的路上，谁都没说话。走到半道，把头忽然开口。\n\n\"第五件信，散在外头，谁也没拿着。\"他说，\"你想想，这半年，有一样东西，咱们见过，可谁也没往信上想过。\"", "words": 2817, "html": "<p>第二天天没黑，我就动了身。<\/p>\n<p>把头没跟我一起走。他说，他躲在暗处看，比我站在明处问，能多看出一层东西。豆芽仔留在村口小卖部门口，装作等人。<\/p>\n<p>村口那棵老槐树，得两个人合抱。树底下有块青石，磨得光溜溜的，平时是村里老人纳凉坐的。<\/p>\n<p>我到的时候，那人已经在了。<\/p>\n<p>他坐在青石上，背对着村口，穿一件洗得发白的旧褂子，袖口挽着，露出一截手腕。他手里什么也没拿，就那么坐着，像坐了半宿。<\/p>\n<p>听见脚步，他回过头。<\/p>\n<p>四十来岁，脸瘦，颧骨高，眉毛很淡。手上有茧，指关节粗，虎口那块皮发亮——是常年握刀握凿的人。<\/p>\n<p>\"你就是认字的？\"他问。<\/p>\n<p>\"是我。\"<\/p>\n<p>\"坐。\"他往青石另一头让了让，\"我不爱站着说话。\"<\/p>\n<p>我在他旁边坐下。老槐树的叶子在头顶上响，一片一片，掉下来。<\/p>\n<p>\"匣子，你开了。\"<\/p>\n<p>\"开了。\"<\/p>\n<p>\"模子认出来了？\"<\/p>\n<p>\"认出来了。\"<\/p>\n<p>他点点头，像是早就知道答案。<\/p>\n<p>\"我姓什么，你不要问。\"他说，\"你记着我是做信的，就行。\"<\/p>\n<p>\"做信的。\"我把这两个字在嘴里过了一遍，\"信是你们做的？\"<\/p>\n<p>\"镜、罐、锅、契，还有你们没见过的那几件，都是我家祖上一手做的。\"他说，\"做完，散出去。散出去的信，认了名分，才算数。\"<\/p>\n<p>\"信不认人，只认名分。\"我说。<\/p>\n<p>他侧头看了我一眼，眼神里有点意外，随即又平下去。<\/p>\n<p>\"匣子里那张纸，你看了。\"<\/p>\n<p>\"看了。\"<\/p>\n<p>\"那你该知道，我是来做什么的。\"他把手伸过来，\"东西给我看看。\"<\/p>\n<p>我犹豫了一下。他也没催，就那么伸着手。<\/p>\n<p>我把照魇镜从怀里掏出来，放在他手心。他接过去，翻到背面，凑着天光看了半晌，又用拇指在鱼尾纹上慢慢摩了一遍。<\/p>\n<p>\"刻的。\"他说，\"刀口收得干净，是我家老辈的手。\"<\/p>\n<p>\"您凭这个，就能认出是谁做的？\"<\/p>\n<p>\"认得出。\"他说，\"刻纹跟写字一样，一个人的手，一辈子改不了。这道纹的起刀，是往怀里带的；收刀，是往外撇的。我们家就这一位，用这个手法。\"<\/p>\n<p>他把镜子还我，又伸出手：\"锅呢？\"<\/p>\n<p>\"锅不在身上。\"<\/p>\n<p>\"背着沉，我知道。\"他说，\"那就看契。\"<\/p>\n<p>我把阴契掏出来。他捏着契的一角，对着斜下来的天光，翻来覆去地看，看得极慢。看到右下角，他停住了。<\/p>\n<p>\"压的。\"他声音低了一点，\"这一道，是拿模子压的。\"<\/p>\n<p>\"跟镜背上的不一样。\"我说。<\/p>\n<p>\"镜背是刻的，契角是压的。\"他说，\"刻的，是给明面上看的；压的，是给自家人认的。\"<\/p>\n<p>\"自家人？\"<\/p>\n<p>\"五部立誓那会儿，五件信，五部各拿一件。\"他把契还给我，\"明面上的纹，各不一样；压上去的这道鱼尾，是一模一样的。见了这道压纹，就是自家人。\"<\/p>\n<p>我把镜子和契收好。<\/p>\n<p>\"三件都是真的。\"他说，\"少了件罐。\"<\/p>\n<p>\"我上五女山那夜，见过一个问灯的老头。\"我说，\"灰褂子，白头发，缺了多半截左耳——\"<\/p>\n<p>\"缺耳？\"他打断我，\"左边还是右边？\"<\/p>\n<p>\"左边。\"<\/p>\n<p>他没接话，只把契还我的那只手顿了顿，又收了回去。<\/p>\n<p>\"他跟你说了什么？\"<\/p>\n<p>\"他说，他问的是'谁想点，想清没有'。\"<\/p>\n<p>\"这话像他说的。\"做信的人点点头，随即又把脸沉下去，\"可他不是我们家的。\"<\/p>\n<p>\"那是哪家的？\"<\/p>\n<p>\"我不知道。\"他说，\"做信的不点灯。点灯的、问灯的，是后来才分出去的。分出去以后，各走各的路，谁也不认谁。\"<\/p>\n<p>这话说得含糊，可我听得心里发紧。做信、点灯、问灯，原是一家人，后来散了——这跟五部散伙，倒像一个道理。<\/p>\n<p>\"罐在掌灯的手里。\"我说，\"前些日子，按约交出去了。\"<\/p>\n<p>\"我知道。\"他点点头，\"掌灯的手里那件，是我家散出去的头一件。\"<\/p>\n<p>我没接话。<\/p>\n<p>\"扣锅台台心那道记，\"他忽然说，\"是我留的。\"<\/p>\n<p>我心里一跳，面上没动。<\/p>\n<p>\"那晚我在台下。\"他说，\"你们三路都在台上，我不上去。等你们都走了，我上去，在印心划了一道。\"<\/p>\n<p>\"记什么？\"<\/p>\n<p>\"记锅。\"他说，\"我要看看，那口锅回没回来，有没有人认。\"<\/p>\n<p>\"您怎么知道我背的是那口锅？\"<\/p>\n<p>\"锅底当间有纹。\"他说，\"我划在印心，就是划在纹上。认得纹的人，才看得懂这道记。\"<\/p>\n<p>我看着他。天光一点点暗下去，他半张脸埋进树影里。<\/p>\n<p>\"三路人马，\"我说，\"点灯的，吹灯的，问灯的。您算哪一路？\"<\/p>\n<p>\"我不点灯，也不吹灯。\"他说，\"我只管信。信齐了，我认；信缺了，我不认。\"<\/p>\n<p>\"那您认我吗？\"<\/p>\n<p>他没马上答。他把两手交叠着放在膝上，看着村口那条土路。<\/p>\n<p>\"你认下的是消奴部的名分。\"他说，\"消奴部那件信，是一口空锅。锅是空的，契是无字的，连纹，都比别人少一道。\"<\/p>\n<p>\"为什么？\"<\/p>\n<p>\"因为消奴部的名分，早叫人抹了。\"他说，\"抹了名分的部，信也空着。这是祖上的规矩——名分没了，信就空着，等有人来认。\"<\/p>\n<p>\"所以锅是空的。\"<\/p>\n<p>\"对。\"他说，\"空锅不是没信，是信在等人。\"<\/p>\n<p>我脑子里那些散了半年的东西，忽然一根一根串了起来。空锅、无字契、西南空位、第五盏没主的灯——绕来绕去，说的都是一件事：消奴部的名分空着，等一个人来按手印。<\/p>\n<p>\"您找'认字的'，\"我说，\"就是来认这个名分的。\"<\/p>\n<p>\"我来验。\"他说，\"认不认，是你的事；信真不真，是我的事。\"<\/p>\n<p>天彻底黑了。村口小卖部亮了灯，豆芽仔在门口晃来晃去，装作买烟。<\/p>\n<p>\"灯会的事，你知道多少？\"我问。<\/p>\n<p>\"不多。\"他说，\"我只知道，掌灯的要在灯会那天，把散出去的信都收回来。收回来，信才归位；信归位了，名分才明。\"<\/p>\n<p>\"收回去以后呢？\"<\/p>\n<p>\"收回去以后，信归谁，名分就归谁。\"他看着我，\"你手里有锅，有契，有镜。掌灯的手里有一件罐。还有一件，散在外头，谁也没拿着。\"<\/p>\n<p>\"哪一件？\"<\/p>\n<p>\"第五件。\"他说，\"那件信，五部里最要紧的一件。落在谁手里，我不知道。可灯会那天，它一定会出现。\"<\/p>\n<p>\"为什么一定会出现？\"<\/p>\n<p>\"因为缺一件，信就不齐。\"他站起来，拍了拍褂子上的灰，\"信不齐，山就不认账。点灯的、吹灯的、做信的，都白忙一场。\"<\/p>\n<p>\"您等了这么多年，\"我忍不住问，\"就为等信齐？\"<\/p>\n<p>\"我家等了三辈。\"他说，\"信是我家做出去的，散了，就得我家看着它一件件回来。这是祖上的账。\"<\/p>\n<p>\"这账，还了多少年了？\"我问。<\/p>\n<p>\"从我爷爷的爷爷那辈起。\"他说，\"一茬人收一回，收不齐，就等下一茬。到我这辈，剩得已经不多了。\"<\/p>\n<p>\"剩几件？\"<\/p>\n<p>\"剩三件。\"他伸出手，比了个数，\"一件在掌灯的手里，一件在你身上，还有一件，不知去向。\"<\/p>\n<p>我心里一沉。原来散出去的信，如今只剩三件还没归位。而这五件里，有两件，都跟我有关。我忽然觉得，怀里那三样东西，比背一口锅还沉。<\/p>\n<p>他往村口外头走，走了两步，又停下。<\/p>\n<p>\"还有一句，我送你。\"他回过头，\"掌灯的那根灯芯，你先别点。\"<\/p>\n<p>\"为什么？\"<\/p>\n<p>\"灯芯是干的。\"他说，\"点灯要油。油，不在你手里。\"<\/p>\n<p>说完，他拐出村口，往黑里去了。<\/p>\n<p>我坐在青石上，半天没动。<\/p>\n<p>油不在我手里。<\/p>\n<p>我把这句话翻来覆去地想。问灯的老头给了我灯芯，掌灯的草帽人掌着灯——灯芯、灯，都齐了，可灯要亮，还得有油。油在哪？<\/p>\n<p>我站起来，往村口小卖部走。豆芽仔迎上来，刚要开口，我先问了：\"把头呢？\"<\/p>\n<p>豆芽仔往身后努了努嘴。<\/p>\n<p>老槐树后头的暗影里，把头不知什么时候站到了那儿，烟头一明一灭。<\/p>\n<p>\"都听见了。\"他说，\"回去吧。\"<\/p>\n<p>回蜂房的路上，谁都没说话。走到半道，把头忽然开口。<\/p>\n<p>\"第五件信，散在外头，谁也没拿着。\"他说，\"你想想，这半年，有一样东西，咱们见过，可谁也没往信上想过。\"<\/p>", "plain": "第二天天没黑，我就动了身。 把头没跟我一起走。他说，他躲在暗处看，比我站在明处问，能多看出一层东西。豆芽仔留在村口小卖部门口，装作等人。 村口那棵老槐树，得两个人合抱。树底下有块青石，磨得光溜溜的，平时是村里老人纳凉坐的。 我到的时候，那人已经在了。 他坐在青石上，背对着村口，穿一件洗得发白的旧褂子，袖口挽着，露出一截手腕。他手里什么也没拿，就那么坐着，像坐了半宿。 听见脚步，他回过头。 四十来岁，脸瘦，颧骨高，眉毛很淡。手上有茧，指关节粗，虎口那块皮发亮——是常年握刀握凿的人。 \"你就是认字的？\"他问。 \"是我。\" \"坐。\"他往青石另一头让了让，\"我不爱站着说话。\" 我在他旁边坐下。老槐树的叶子在头顶上响，一片一片，掉下来。 \"匣子，你开了。\" \"开了。\" \"模子认出来了？\" \"认出来了。\" 他点点头，像是早就知道答案。 \"我姓什么，你不要问。\"他说，\"你记着我是做信的，就行。\" \"做信的。\"我把这两个字在嘴里过了一遍，\"信是你们做的？\" \"镜、罐、锅、契，还有你们没见过的那几件，都是我家祖上一手做的。\"他说，\"做完，散出去。散出去的信，认了名分，才算数。\" \"信不认人，只认名分。\"我说。 他侧头看了我一眼，眼神里有点意外，随即又平下去。 \"匣子里那张纸，你看了。\" \"看了。\" \"那你该知道，我是来做什么的。\"他把手伸过来，\"东西给我看看。\" 我犹豫了一下。他也没催，就那么伸着手。 我把照魇镜从怀里掏出来，放在他手心。他接过去，翻到背面，凑着天光看了半晌，又用拇指在鱼尾纹上慢慢摩了一遍。 \"刻的。\"他说，\"刀口收得干净，是我家老辈的手。\" \"您凭这个，就能认出是谁做的？\" \"认得出。\"他说，\"刻纹跟写字一样，一个人的手，一辈子改不了。这道纹的起刀，是往怀里带的；收刀，是往外撇的。我们家就这一位，用这个手法。\" 他把镜子还我，又伸出手：\"锅呢？\" \"锅不在身上。\" \"背着沉，我知道
