const DATA = [{"id": "A5-057", "arc": "A5", "num": 57, "title": "问药", "md": "---\n\n我又把那块木牌扶正了。\n\n\"故男王长顺之灵位\"。\n\n朱砂写的，笔划很重，最后一竖拖出去老长，像是写的人手抖了一下。我拿袖子擦了擦牌面上落的灰，转过身，点开了鱼哥发来的彩信。\n\n屏幕小，彩信又慢，转了半天圈才出来。\n\n照片里是我们家那只鸭子。\n\n说实话，第一眼我没认出来。这玩意儿浑身斑秃，一块一块的，露出粉红色的皮，脖子那一圈尤其厉害，毛掉得干干净净，看着就跟熟食店里泡好的卤鸭脖一个成色。\n\n我正看着，身后\"啪\"的一声。\n\n回头。\n\n灵位又倒了。\n\n老屋里没风。窗子是我进来前自己关上的，插销我还按了按。我站在原地看了它两秒钟，走过去，第三次把它扶起来，这回我特意往后退了一步，盯着它。\n\n它立着。\n\n\"王长顺，\"我小声说，\"你是嫌我挡你路了？\"\n\n没人答我。外头雨下得更大，雨点子砸在石棉瓦上，跟撒豆子似的。\n\n我没再管它，披上雨衣出门。\n\n三蹦子停在院子外头，豆芽仔跟老周走了，我得自己骑回去。这玩意儿没棚，雨衣罩不住腿，从普乐堡往县城这一路二十来分钟，等我到永红街的时候，裤腿已经能拧出水了。\n\n老畜牧局是栋二层旧楼，红砖的，墙皮掉得一块一块。院门是那种老式铁栏杆门，虚掩着，里头一盏昏黄的灯，灯下挂着个白底红字的牌子：桓仁县畜牧站。\n\n我拍了拍门房窗户。\n\n里头有个老大爷，六十来岁，穿件洗得发白的蓝褂子，正就着灯看报纸。\n\n\"找谁啊。\"\n\n\"大爷，听说您这儿能给动物看病？\"\n\n他放下报纸，从老花镜上边瞅我：\"退休了。\"\n\n\"退休了也能看吧？我这不着急找别人，就找您。\"\n\n他哼了一声，把门开了一条缝：\"什么动物。\"\n\n\"鸭子。\"\n\n\"鸭子？\"他乐了，\"鸭子还用看？杀了吃了不就完了。\"\n\n\"不能杀，那是我兄弟的命根子。\"\n\n他愣了下，大概是没听懂，也没再问，侧身让我进了屋。屋里有股子来苏水混着干草的味道，墙边一排铁笼子，里头关着两只兔子，一只鸽子，鸽子少了一条腿。\n\n我把手机递过去，把彩信调出来。\n\n他接过去，眯着眼看了半天，又从抽屉里摸出个放大镜，凑上去看。\n\n看着看着，他不说话了。\n\n\"大爷，是换毛不？\"\n\n\"换毛？\"他把手机放下，\"换毛是从前往后，一层一层换，毛根是白的，毛囊里头有新毛茬。你这个——\"\n\n他拿指甲刮了刮屏幕上鸭子脖子的位置。\n\n\"毛根是焦的。\"\n\n\"焦的？\"\n\n\"像让火燎过。可外头这层皮又没烫伤。\"他皱着眉，\"这不是从外头烧的，是从里头烧的。\"\n\n我心里咯噔一下。\n\n\"中毒？\"\n\n\"像是。\"他问，\"它最近吃着什么了？\"\n\n吃着什么了。\n\n我在脑子里过了一遍：玉米面、菜叶子、剩饭剩菜、鱼哥喂的碎肉……还有——\n\n我猛地想起来。\n\n是那几个球。\n\n从五女山那座碎石墓里出来的，苎麻缠着，黑不溜秋，一捏还发黏。当时鱼哥用塑料袋装了三个回来，我和王药根研究过，我说那玩意儿是骨灰掺了松香和糖，搓成的\"魂丸\"——墓里给死人备的干粮，跟后世那\"五谷囊\"\"粮罂\"是一个路数，只是高句丽早期做法更糙。\n\n那几个球，小萱嫌脏，扔在堂屋桌底下那个纸盒子里，说是等我有空了拿去给行家看看。\n\n豆芽仔当时还拿牙咬过一口，说甜的。\n\n\"大爷，\"我咽了口唾沫，\"要是它吃了两千年前墓里出来的东西呢？\"\n\n老大爷抬起头，盯着我看。\n\n看了足有五六秒。\n\n\"小伙子，\"他慢慢说，\"你别跟我开玩笑。\"\n\n\"没开玩笑。\"\n\n他沉默了一会儿，起身从柜子里翻出一本卷了边的册子，翻到中间一页，指着上头一行字给我看。\n\n\"松香这东西，本身没事儿。可它在土里埋上两千年，跟骨头灰、跟棺里的水银、跟那些乱七八糟的朱砂搁一块儿——它会变。变出什么我不懂，我们是兽医，不是搞化验的。但我知道一样：凡是古墓里出来的'能吃'的东西，都不是给活人备的。\"\n\n\"那糖呢？\"\n\n\"糖是引子。\"他说，\"钓鱼还得打窝子呢。\"\n\n我后背有点凉。\n\n\"能治不？\"\n\n\"能试试。\"他进里屋，端出来一个搪瓷缸子，里头是黑绿色的水，又拿了个小塑料瓶，装的是黄不拉叽的油膏，\"绿豆半斤、甘草二两，熬浓了放凉，一天灌两次，每次拿拔了针头的注射器往它嗓子眼里打五毫升。掉毛的地方抹这个，一天三回。\"\n\n\"三天。\"他伸了三根手指，\"三天之内不再掉，那就没事儿。三天之内还在掉，或者开始拉血——\"\n\n\"怎么样？\"\n\n\"你就别治了。\"\n\n我点点头，掏出钱包，数了两千块放桌上。\n\n大爷看了一眼，没推，也没高兴：\"多了。\"\n\n\"不多，我给您留个电话，往后我还得问您。\"\n\n\"半夜别打。\"他把钱收了，\"老头子要睡觉。\"\n\n出来的时候雨小了些。\n\n我站在畜牧站的院门口，点了根烟，脑子有点乱。\n\n鸭子的事是小事。可\"糖是引子\"那句话在我耳朵里转来转去。\n\n那几个球我们拿了三个，鱼哥、豆芽仔都摸过，豆芽仔还咬了一口。\n\n我摸出手机想给豆芽仔打电话，又忍住了——他现在跟着老周在去沈阳的高速上，接电话不方便。\n\n我把烟掐了，骑上三蹦子往回走。\n\n不是回县城住处，是回普乐堡。\n\n那块灵位，我得问明白。\n\n王药根的老屋亮着灯。\n\n我推门进去，老头正蹲在灶坑前烧水，看见我浑身是水，吓了一跳：\"你咋又回来了？\"\n\n\"取钥匙。\"我说，\"顺便问您个事儿。\"\n\n我走到屋角，把那块木牌扶起来，转过身看他。\n\n\"王大爷，这位是？\"\n\n老头手里的柴火棍停在半空。\n\n灶膛里的火苗跳了一下，把他脸上的褶子照得忽明忽暗。\n\n\"我儿。\"\n\n\"您儿子？\"\n\n\"王长顺。满意他爹。\"\n\n我\"哦\"了一声，没敢接太快。\n\n\"死了两年了。\"王药根把柴火棍往灶里一捅，火星子噼里啪啦炸起来，\"上吊。在自家仓房的梁上。\"\n\n我站在那儿没动。\n\n\"为什么？\"\n\n老头没答，先问了我一句：\n\n\"你刚才扶了几回？\"\n\n\"……三回。\"\n\n\"那就对了。\"他低声说，\"他活着的时候，就跪不直。\"\n\n我不明白这话的意思。\n\n王药根站起身，拍了拍手上的灰，走到灵位前，用手掌把它扶正，又从口袋里摸出三根香点上——他没点着，香受了潮，怎么点都灭。\n\n最后他把香搁在了牌位前头。\n\n\"两年前的夏天，\"他说，\"长顺带了一伙人进山。\"\n\n\"进哪？\"\n\n\"鹰嘴沟。\"\n\n我浑身一激灵。\n\n\"那伙人是外路的，说是来收山货，其实我知道，是奔着这山里的石头坟来的。口音不是咱们辽东的，硬，说话跟吵架似的。领头那个，酒糟鼻，红得冒油。\"\n\n酒糟鼻。\n\n我想起老周跟我学舌的那两句方言——\"屁缠屁缠，日能日能\"。\n\n\"他们几个人进去的？\"我问。\n\n老头伸出五根手指。\n\n\"出来两个。\"\n\n灶膛里的火\"轰\"地塌下去一块。\n\n\"剩下三个呢？\"\n\n\"埋在山里了。\"\n\n我喉咙发紧。\n\n断崖下那三具无头男尸骨。\n\n云峰当时蹲在坑边，用手拨开土，看见的是人的手。\n\n\"我儿回来以后就不说话了。\"王药根的声音很平，平得像在讲别人的事，\"问他什么，他就一句。\"\n\n\"哪句？\"\n\n老头抬起头看我。\n\n那双浑浊的眼睛里，第一次有了点别的东西。\n\n\"他说——'爹，锅是空的。'\"\n\n我脑子里\"嗡\"的一声。\n\n白底朱砂，五个小人，每个小人背着一口锅。\n\n那是我在第二座碎石墓里挖出来的壁画。我给它起了个名字，叫\"背锅图\"。\n\n\"什么时候的事？\"我听见自己的声音有点抖。\n\n\"他死前三天。\"\n\n王药根说完，弯下腰，把灶里烧塌的柴重新架好。\n\n火又旺起来了。\n\n\"云峰小友，\"他背对着我说，\"你刚才问我为什么留在这儿，为什么愿意跟你们搭伙。\"\n\n\"我守的不是蛇。\"\n\n\"我守的是那口锅。\"\n\n我站在原地，雨水顺着裤腿往下滴，在地上积了一小滩。\n\n口袋里的手机震了一下。\n\n我掏出来，是鱼哥。\n\n\"云峰，鸭子怎么样？\"\n\n我看着屏幕上那行字，又抬头看了看那块立着的灵位。\n\n\"没事，\"我回过去，\"兽医说了，能治。\"\n\n发完，我把手机揣回兜里，走到灵位前，蹲下身，跟那块牌子平视。\n\n\"王长顺。\"我轻声说。\n\n\"你那口空锅，我上个月见着了。\"", "words": 2933, "html": "<hr>\n<p>我又把那块木牌扶正了。<\/p>\n<p>\"故男王长顺之灵位\"。<\/p>\n<p>朱砂写的，笔划很重，最后一竖拖出去老长，像是写的人手抖了一下。我拿袖子擦了擦牌面上落的灰，转过身，点开了鱼哥发来的彩信。<\/p>\n<p>屏幕小，彩信又慢，转了半天圈才出来。<\/p>\n<p>照片里是我们家那只鸭子。<\/p>\n<p>说实话，第一眼我没认出来。这玩意儿浑身斑秃，一块一块的，露出粉红色的皮，脖子那一圈尤其厉害，毛掉得干干净净，看着就跟熟食店里泡好的卤鸭脖一个成色。<\/p>\n<p>我正看着，身后\"啪\"的一声。<\/p>\n<p>回头。<\/p>\n<p>灵位又倒了。<\/p>\n<p>老屋里没风。窗子是我进来前自己关上的，插销我还按了按。我站在原地看了它两秒钟，走过去，第三次把它扶起来，这回我特意往后退了一步，盯着它。<\/p>\n<p>它立着。<\/p>\n<p>\"王长顺，\"我小声说，\"你是嫌我挡你路了？\"<\/p>\n<p>没人答我。外头雨下得更大，雨点子砸在石棉瓦上，跟撒豆子似的。<\/p>\n<p>我没再管它，披上雨衣出门。<\/p>\n<p>三蹦子停在院子外头，豆芽仔跟老周走了，我得自己骑回去。这玩意儿没棚，雨衣罩不住腿，从普乐堡往县城这一路二十来分钟，等我到永红街的时候，裤腿已经能拧出水了。<\/p>\n<p>老畜牧局是栋二层旧楼，红砖的，墙皮掉得一块一块。院门是那种老式铁栏杆门，虚掩着，里头一盏昏黄的灯，灯下挂着个白底红字的牌子：桓仁县畜牧站。<\/p>\n<p>我拍了拍门房窗户。<\/p>\n<p>里头有个老大爷，六十来岁，穿件洗得发白的蓝褂子，正就着灯看报纸。<\/p>\n<p>\"找谁啊。\"<\/p>\n<p>\"大爷，听说您这儿能给动物看病？\"<\/p>\n<p>他放下报纸，从老花镜上边瞅我：\"退休了。\"<\/p>\n<p>\"退休了也能看吧？我这不着急找别人，就找您。\"<\/p>\n<p>他哼了一声，把门开了一条缝：\"什么动物。\"<\/p>\n<p>\"鸭子。\"<\/p>\n<p>\"鸭子？\"他乐了，\"鸭子还用看？杀了吃了不就完了。\"<\/p>\n<p>\"不能杀，那是我兄弟的命根子。\"<\/p>\n<p>他愣了下，大概是没听懂，也没再问，侧身让我进了屋。屋里有股子来苏水混着干草的味道，墙边一排铁笼子，里头关着两只兔子，一只鸽子，鸽子少了一条腿。<\/p>\n<p>我把手机递过去，把彩信调出来。<\/p>\n<p>他接过去，眯着眼看了半天，又从抽屉里摸出个放大镜，凑上去看。<\/p>\n<p>看着看着，他不说话了。<\/p>\n<p>\"大爷，是换毛不？\"<\/p>\n<p>\"换毛？\"他把手机放下，\"换毛是从前往后，一层一层换，毛根是白的，毛囊里头有新毛茬。你这个——\"<\/p>\n<p>他拿指甲刮了刮屏幕上鸭子脖子的位置。<\/p>\n<p>\"毛根是焦的。\"<\/p>\n<p>\"焦的？\"<\/p>\n<p>\"像让火燎过。可外头这层皮又没烫伤。\"他皱着眉，\"这不是从外头烧的，是从里头烧的。\"<\/p>\n<p>我心里咯噔一下。<\/p>\n<p>\"中毒？\"<\/p>\n<p>\"像是。\"他问，\"它最近吃着什么了？\"<\/p>\n<p>吃着什么了。<\/p>\n<p>我在脑子里过了一遍：玉米面、菜叶子、剩饭剩菜、鱼哥喂的碎肉……还有——<\/p>\n<p>我猛地想起来。<\/p>\n<p>是那几个球。<\/p>\n<p>从五女山那座碎石墓里出来的，苎麻缠着，黑不溜秋，一捏还发黏。当时鱼哥用塑料袋装了三个回来，我和王药根研究过，我说那玩意儿是骨灰掺了松香和糖，搓成的\"魂丸\"——墓里给死人备的干粮，跟后世那\"五谷囊\"\"粮罂\"是一个路数，只是高句丽早期做法更糙。<\/p>\n<p>那几个球，小萱嫌脏，扔在堂屋桌底下那个纸盒子里，说是等我有空了拿去给行家看看。<\/p>\n<p>豆芽仔当时还拿牙咬过一口，说甜的。<\/p>\n<p>\"大爷，\"我咽了口唾沫，\"要是它吃了两千年前墓里出来的东西呢？\"<\/p>\n<p>老大爷抬起头，盯着我看。<\/p>\n<p>看了足有五六秒。<\/p>\n<p>\"小伙子，\"他慢慢说，\"你别跟我开玩笑。\"<\/p>\n<p>\"没开玩笑。\"<\/p>\n<p>他沉默了一会儿，起身从柜子里翻出一本卷了边的册子，翻到中间一页，指着上头一行字给我看。<\/p>\n<p>\"松香这东西，本身没事儿。可它在土里埋上两千年，跟骨头灰、跟棺里的水银、跟那些乱七八糟的朱砂搁一块儿——它会变。变出什么我不懂，我们是兽医，不是搞化验的。但我知道一样：凡是古墓里出来的'能吃'的东西，都不是给活人备的。\"<\/p>\n<p>\"那糖呢？\"<\/p>\n<p>\"糖是引子。\"他说，\"钓鱼还得打窝子呢。\"<\/p>\n<p>我后背有点凉。<\/p>\n<p>\"能治不？\"<\/p>\n<p>\"能试试。\"他进里屋，端出来一个搪瓷缸子，里头是黑绿色的水，又拿了个小塑料瓶，装的是黄不拉叽的油膏，\"绿豆半斤、甘草二两，熬浓了放凉，一天灌两次，每次拿拔了针头的注射器往它嗓子眼里打五毫升。掉毛的地方抹这个，一天三回。\"<\/p>\n<p>\"三天。\"他伸了三根手指，\"三天之内不再掉，那就没事儿。三天之内还在掉，或者开始拉血——\"<\/p>\n<p>\"怎么样？\"<\/p>\n<p>\"你就别治了。\"<\/p>\n<p>我点点头，掏出钱包，数了两千块放桌上。<\/p>\n<p>大爷看了一眼，没推，也没高兴：\"多了。\"<\/p>\n<p>\"不多，我给您留个电话，往后我还得问您。\"<\/p>\n<p>\"半夜别打。\"他把钱收了，\"老头子要睡觉。\"<\/p>\n<p>出来的时候雨小了些。<\/p>\n<p>我站在畜牧站的院门口，点了根烟，脑子有点乱。<\/p>\n<p>鸭子的事是小事。可\"糖是引子\"那句话在我耳朵里转来转去。<\/p>\n<p>那几个球我们拿了三个，鱼哥、豆芽仔都摸过，豆芽仔还咬了一口。<\/p>\n<p>我摸出手机想给豆芽仔打电话，又忍住了——他现在跟着老周在去沈阳的高速上，接电话不方便。<\/p>\n<p>我把烟掐了，骑上三蹦子往回走。<\/p>\n<p>不是回县城住处，是回普乐堡。<\/p>\n<p>那块灵位，我得问明白。<\/p>\n<p>王药根的老屋亮着灯。<\/p>\n<p>我推门进去，老头正蹲在灶坑前烧水，看见我浑身是水，吓了一跳：\"你咋又回来了？\"<\/p>\n<p>\"取钥匙。\"我说，\"顺便问您个事儿。\"<\/p>\n<p>我走到屋角，把那块木牌扶起来，转过身看他。<\/p>\n<p>\"王大爷，这位是？\"<\/p>\n<p>老头手里的柴火棍停在半空。<\/p>\n<p>灶膛里的火苗跳了一下，把他脸上的褶子照得忽明忽暗。<\/p>\n<p>\"我儿。\"<\/p>\n<p>\"您儿子？\"<\/p>\n<p>\"王长顺。满意他爹。\"<\/p>\n<p>我\"哦\"了一声，没敢接太快。<\/p>\n<p>\"死了两年了。\"王药根把柴火棍往灶里一捅，火星子噼里啪啦炸起来，\"上吊。在自家仓房的梁上。\"<\/p>\n<p>我站在那儿没动。<\/p>\n<p>\"为什么？\"<\/p>\n<p>老头没答，先问了我一句：<\/p>\n<p>\"你刚才扶了几回？\"<\/p>\n<p>\"……三回。\"<\/p>\n<p>\"那就对了。\"他低声说，\"他活着的时候，就跪不直。\"<\/p>\n<p>我不明白这话的意思。<\/p>\n<p>王药根站起身，拍了拍手上的灰，走到灵位前，用手掌把它扶正，又从口袋里摸出三根香点上——他没点着，香受了潮，怎么点都灭。<\/p>\n<p>最后他把香搁在了牌位前头。<\/p>\n<p>\"两年前的夏天，\"他说，\"长顺带了一伙人进山。\"<\/p>\n<p>\"进哪？\"<\/p>\n<p>\"鹰嘴沟。\"<\/p>\n<p>我浑身一激灵。<\/p>\n<p>\"那伙人是外路的，说是来收山货，其实我知道，是奔着这山里的石头坟来的。口音不是咱们辽东的，硬，说话跟吵架似的。领头那个，酒糟鼻，红得冒油。\"<\/p>\n<p>酒糟鼻。<\/p>\n<p>我想起老周跟我学舌的那两句方言——\"屁缠屁缠，日能日能\"。<\/p>\n<p>\"他们几个人进去的？\"我问。<\/p>\n<p>老头伸出五根手指。<\/p>\n<p>\"出来两个。\"<\/p>\n<p>灶膛里的火\"轰\"地塌下去一块。<\/p>\n<p>\"剩下三个呢？\"<\/p>\n<p>\"埋在山里了。\"<\/p>\n<p>我喉咙发紧。<\/p>\n<p>断崖下那三具无头男尸骨。<\/p>\n<p>云峰当时蹲在坑边，用手拨开土，看见的是人的手。<\/p>\n<p>\"我儿回来以后就不说话了。\"王药根的声音很平，平得像在讲别人的事，\"问他什么，他就一句。\"<\/p>\n<p>\"哪句？\"<\/p>\n<p>老头抬起头看我。<\/p>\n<p>那双浑浊的眼睛里，第一次有了点别的东西。<\/p>\n<p>\"他说——'爹，锅是空的。'\"<\/p>\n<p>我脑子里\"嗡\"的一声。<\/p>\n<p>白底朱砂，五个小人，每个小人背着一口锅。<\/p>\n<p>那是我在第二座碎石墓里挖出来的壁画。我给它起了个名字，叫\"背锅图\"。<\/p>\n<p>\"什么时候的事？\"我听见自己的声音有点抖。<\/p>\n<p>\"他死前三天。\"<\/p>\n<p>王药根说完，弯下腰，把灶里烧塌的柴重新架好。<\/p>\n<p>火又旺起来了。<\/p>\n<p>\"云峰小友，\"他背对着我说，\"你刚才问我为什么留在这儿，为什么愿意跟你们搭伙。\"<\/p>\n<p>\"我守的不是蛇。\"<\/p>\n<p>\"我守的是那口锅。\"<\/p>\n<p>我站在原地，雨水顺着裤腿往下滴，在地上积了一小滩。<\/p>\n<p>口袋里的手机震了一下。<\/p>\n<p>我掏出来，是鱼哥。<\/p>\n<p>\"云峰，鸭子怎么样？\"<\/p>\n<p>我看着屏幕上那行字，又抬头看了看那块立着的灵位。<\/p>\n<p>\"没事，\"我回过去，\"兽医说了，能治。\"<\/p>\n<p>发完，我把手机揣回兜里，走到灵位前，蹲下身，跟那块牌子平视。<\/p>\n<p>\"王长顺。\"我轻声说。<\/p>\n<p>\"你那口空锅，我上个月见着了。\"<\/p>", "plain": "我又把那块木牌扶正了。 \"故男王长顺之灵位\"。 朱砂写的，笔划很重，最后一竖拖出去老长，像是写的人手抖了一下。我拿袖子擦了擦牌面上落的灰，转过身，点开了鱼哥发来的彩信。 屏幕小，彩信又慢，转了半天圈才出来。 照片里是我们家那只鸭子。 说实话，第一眼我没认出来。这玩意儿浑身斑秃，一块一块的，露出粉红色的皮，脖子那一圈尤其厉害，毛掉得干干净净，看着就跟熟食店里泡好的卤鸭脖一个成色。 我正看着，身后\"啪\"的一声。 回头。 灵位又倒了。 老屋里没风。窗子是我进来前自己关上的，插销我还按了按。我站在原地看了它两秒钟，走过去，第三次把它扶起来，这回我特意往后退了一步，盯着它。 它立着。 \"王长顺，\"我小声说，\"你是嫌我挡你路了？\" 没人答我。外头雨下得更大，雨点子砸在石棉瓦上，跟撒豆子似的。 我没再管它，披上雨衣出门。 三蹦子停在院子外头，豆芽仔跟老周走了，我得自己骑回去。这玩意儿没棚，雨衣罩不住腿，从普乐堡往县城这一路二十来分钟，等我到永红街的时候，裤腿已经能拧出水了。 老畜牧局是栋二层旧楼，红砖的，墙皮掉得一块一块。院门是那种老式铁栏杆门，虚掩着，里头一盏昏黄的灯，灯下挂着个白底红字的牌子：桓仁县畜牧站。 我拍了拍门房窗户。 里头有个老大爷，六十来岁，穿件洗得发白的蓝褂子，正就着灯看报纸。 \"找谁啊。\" \"大爷，听说您这儿能给动物看病？\" 他放下报纸，从老花镜上边瞅我：\"退休了。\" \"退休了也能看吧？我这不着急找别人，就找您。\" 他哼了一声，把门开了一条缝：\"什么动物。\" \"鸭子。\" \"鸭子？\"他乐了，\"鸭子还用看？杀了吃了不就完了。\" \"不能杀，那是我兄弟的命根子。\" 他愣了下，大概是没听懂，也没再问，侧身让我进了屋。屋里有股子来苏水混着干草的味道，墙边一排铁笼子，里头关着两只兔子，一只鸽子，鸽子少了一条腿。 我把手机递过去，把彩信调出来。 他接过去，眯着眼看了半天，又从抽屉里摸出个放大镜，凑上去看。 看着看着，他不说话了。 \"大爷，是换毛不？\" \"换毛？\"他把手机放下，\"换毛是从前往后，一层一层换，毛根是白的，毛囊里头有新毛茬。你这个——\" 他拿指甲刮了刮屏幕上鸭子脖子的位置。 \"毛根是焦的。\" \"焦的？\" \"像让火燎过。可外头这层皮又没烫伤。\"他皱着眉，\"这不是从外头烧的，是从里头烧的。\" 我心里咯噔一下。 \"中毒？\" \"像是。\"他问，\"它最近吃着什么了？\" 吃着什么了。 我在脑子里过了一遍：玉米面、菜叶子、剩饭剩菜、鱼哥喂的碎肉……还有—— 我猛地想起来。 是那几个球。 从五女山那座碎石墓里出来的，苎麻缠着，黑不溜秋，一捏还发黏。当时鱼哥用塑料袋装了三个回来，我和王药根研究过，我说那玩意儿是骨灰掺了松香和糖，搓成的\"魂丸\"——墓里给死人备的干粮，跟后世那\"五谷囊\"\"粮罂\"是一个路数，只是高句丽早期做法更糙。 那几个球，小萱嫌脏，扔在堂屋桌底下那个纸盒子里，说是等我有空了拿去给行家看看。 豆芽仔当时还拿牙咬过一口，说甜的。 \"大爷，\"我咽了口唾沫，\"要是它吃了两千年前墓里出来的东西呢？\" 老大爷抬起头，盯着我看。 看了足有五六秒。 \"小伙子，\"他慢慢说，\"你别跟我开玩笑。\" \"没开玩笑。\" 他沉默了一会儿，起身从柜子里翻出一本卷了边的册子，翻到中间一页，指着上头一行字给我看。 \"松香这东西，本身没事儿。可它在土里埋上两千年，跟骨头灰、跟棺里的水银、跟那些乱七八糟的朱砂搁一块儿——它会变。变出什么我不懂，我们是兽医，不是搞化验的。但我知道一样：凡是古墓里出来的'能吃'的东西，都不是给活人备的。\" \"那糖呢？\" \"糖是引子。\"他说，\"钓鱼还得打窝子呢。\" 我后背有点凉。 \"能治不？\" \"能试试。\"他进里屋，端出来一个搪瓷缸子，里头是黑绿色的水，又拿了个小塑料瓶，装的是黄不拉叽的油膏，\"绿豆半斤、甘草二两，熬浓了放凉，一天灌两次，每次拿拔了针头的注射器往它嗓子眼里打五毫升。掉毛的地方抹这个，一天三回。\" \"三天。\"他伸了三根手指，\"三天之内不再掉，那就没事儿。三天之内还在掉，或者开始拉血——\" \"怎么样？\" \"你就别治了。\" 我点点头，掏出钱包，数了两千块放桌上。 大爷看了一眼，没推，也没高兴：\"多了。\" \"不多，我给您留个电话，往后我还得问您。\" \"半夜别打。\"他把钱收了，\"老头子要睡觉。\" 出来的时候雨小了些。 我站在畜牧站的院门口，点了根烟，脑子有点乱。 鸭子的事是小事。可\"糖是引子\"那句话在我耳朵里转来转去。 那几个球我们拿了三个，鱼哥、豆芽仔都摸过，豆芽仔还咬了一口。 我摸出手机想给豆芽仔打电话，又忍住了——他现在跟着老周在去沈阳的高速上，接电话不方便。 我把烟掐了，骑上三蹦子往回走。 不是回县城住处，是回普乐堡。 那块灵位，我得问明白。 王药根的老屋亮着灯。 我推门进去，老头正蹲在灶坑前烧水，看见我浑身是水，吓了一跳：\"你咋又回来了？\" \"取钥匙。\"我说，\"顺便问您个事儿。\" 我走到屋角，把那块木牌扶起来，转过身看他。 \"王大爷，这位是？\" 老头手里的柴火棍停在半空。 灶膛里的火苗跳了一下，把他脸上的褶子照得忽明忽暗。 \"我儿。\" \"您儿子？\" \"王长顺。满意他爹。\" 我\"哦\"了一声，没敢接太快。 \"死了两年了。\"王药根把柴火棍往灶里一捅，火星子噼里啪啦炸起来，\"上吊。在自家仓房的梁上。\" 我站在那儿没动。 \"为什么？\" 老头没答，先问了我一句： \"你刚才扶了几回？\" \"……三回。\" \"那就对了。\"他低声说，\"他活着的时候，就跪不直。\" 我不明白这话的意思。 王药根站起身，拍了拍手上的灰，走到灵位前，用手掌把它扶正，又从口袋里摸出三根香点上——他没点着，香受了潮，怎么点都灭。 最后他把香搁在了牌位前头。 \"两年前的夏天，\"他说，\"长顺带了一伙人进山。\" \"进哪？\" \"鹰嘴沟。\" 我浑身一激灵。 \"那伙人是外路的，说是来收山货，其实我知道，是奔着这山里的石头坟来的。口音不是咱们辽东的，硬，说话跟吵架似的。领头那个，酒糟鼻，红得冒油。\" 酒糟鼻。 我想起老周跟我学舌的那两句方言——\"屁缠屁缠，日能日能\"。 \"他们几个人进去的？\"我问。 老头伸出五根手指。 \"出来两个。\" 灶膛里的火\"轰\"地塌下去一块。 \"剩下三个呢？\" \"埋在山里了。\" 我喉咙发紧。 断崖下那三具无头男尸骨。 云峰当时蹲在坑边，用手拨开土，看见的是人的手。 \"我儿回来以后就不说话了。\"王药根的声音很平，平得像在讲别人的事，\"问他什么，他就一句。\" \"哪句？\" 老头抬起头看我。 那双浑浊的眼睛里，第一次有了点别的东西。 \"他说——'爹，锅是空的。'\" 我脑子里\"嗡\"的一声。 白底朱砂，五个小人，每个小人背着一口锅。 那是我在第二座碎石墓里挖出来的壁画。我给它起了个名字，叫\"背锅图\"。 \"什么时候的事？\"我听见自己的声音有点抖。 \"他死前三天。\" 王药根说完，弯下腰，把灶里烧塌的柴重新架好。 火又旺起来了。 \"云峰小友，\"他背对着我说，\"你刚才问我为什么留在这儿，为什么愿意跟你们搭伙。\" \"我守的不是蛇。\" \"我守的是那口锅。\" 我站在原地，雨水顺着裤腿往下滴，在地上积了一小滩。 口袋里的手机震了一下。 我掏出来，是鱼哥。 \"云峰，鸭子怎么样？\" 我看着屏幕上那行字，又抬头看了看那块立着的灵位。 \"没事，\"我回过去，\"兽医说了，能治。\" 发完，我把手机揣回兜里，走到灵位前，蹲下身，跟那块牌子平视。 \"王长顺。\"我轻声说。 \"你那口空锅，我上个月见着了。\""}, {"id": "A5-058", "arc": "A5", "num": 58, "title": "外路人", "md": "雨是后半夜停的。\n\n我和王药根蹲在老屋的灶膛前，谁也没说话。灶里的柴烧成了炭，红一阵暗一阵，把老头那张脸照得像块旧木头。\n\n那块灵位立在墙角。\n\n我没再去看它，可我知道它还立着——从我刚才说完那句话起，它就没再倒。\n\n\"大爷。\"我开口。\n\n\"嗯。\"\n\n\"长顺那事儿，您得跟我讲明白。\"\n\n王药根没马上答。他把手里那半截潮香掰断了，扔进灶里，一股子怪味儿腾起来。\n\n\"两年前的六月，\"他说，\"进来的。\"\n\n\"五个人？\"\n\n\"五个。\"\n\n\"一辆破吉普，绿色的，北京2020那种，后头斗上绑着铁锹和麻袋。\"老头慢慢讲，\"说是收山货的，榛蘑、蕨菜、松茸，什么都收。住在村东头老刘家的空房，一天给三十块钱。\"\n\n\"他们找向导。\"\n\n\"村里没人愿意带。鹰嘴沟那地方，本地人都不去——早年间摔死过采药的，前些年还有个放牛的进去再没出来。长顺就去揽这活儿了。\"王药根说到这儿，停了一下，\"一天两百。\"\n\n我没接话。\n\n两百块，在2005年的桓仁乡下，能让一个三十来岁的男人冒着雨往无人区里钻。\n\n\"进了几天？\"\n\n\"三天。\"\n\n\"出来几个？\"\n\n老头伸出两根手指，在手心里搓了搓。\n\n\"就回来俩。\"他说，\"一个是那酒糟鼻，红鼻头，四十来岁，说话冲得很，跟谁都像吵架。另一个白头发，瘦，看着得有六十了，不爱吭声，全程就蹲在边上抽烟。\"\n\n\"剩下三个呢？\"\n\n\"长顺后来跟我说，是塌方埋的。\"王药根抬起眼看我，\"可我们后来去找过，没找着。\"\n\n我心里\"咯噔\"一下。\n\n断崖下那三具无头男尸骨。\n\n没有头。\n\n塌方压死的人，头还在。\n\n\"长顺回来什么样？\"\n\n\"鞋丢了一只，裤腿撕到膝盖，手上的口子都化了脓。\"老头的声音很平，\"回来第三天开始烧，说胡话。烧了半个月，人瘦得脱了相。\"\n\n\"他说什么？\"\n\n\"就一句。\"\n\n\"爹，锅是空的。\"\n\n灶膛里的炭\"啪\"地爆了一声。\n\n\"就这一句？\"\n\n\"就这一句。\"王药根点头，\"翻来覆去，白天黑夜，醒了就说。我问他什么锅，他看我一眼，不答。再问，还是那句，跟卡了壳的收音机一样。\"\n\n\"三个月后呢？\"\n\n\"三个月后他自己上了吊。在仓房梁上，用了根麻绳。舌头伸出来老长。\"\n\n我沉默了一会儿。\n\n\"大爷，那三个人——那三个没出来的，长顺说没说他们是怎么死的？\"\n\n\"说过一次。\"\n\n\"怎么说的？\"\n\n王药根盯着我，灶火的影子在他眼睛里跳。\n\n\"他说：'不是埋的。'\"\n\n我后背一凉。\n\n\"不是埋的，那是什么？\"\n\n\"我再问，他就开始哆嗦，拿被子蒙头，怎么拽都不出来。\"老头说，\"第二天人就哑了，彻底不说话了。一直到死，一个字都没再讲。\"\n\n外头的雨完全停了。屋檐上的水滴在青石板上，\"嗒、嗒、嗒\"，一声一声，听得清清楚楚。\n\n\"那画呢。\"我说。\n\n老头没问我是怎么知道的。\n\n他站起来，走到里屋，翻了半天，捧出一个铁盒子。盒子是那种装饼干的旧铁盒，上头印着褪了色的\"青食\"两个字。\n\n他从里头拿出一个塑料袋，塑料袋里还裹着一层塑料布。\n\n\"他死前三天画的。\"王药根把塑料袋递给我，\"我在他枕头底下找到的。\"\n\n我接过来，就着灶火的光，把塑料布一层层掀开。\n\n里头是一张纸。\n\n不是什么好纸，就是小学生用的那种方格本撕下来的，边上都卷了。\n\n纸上用铅笔画着一口锅。\n\n画得很笨，线条歪歪扭扭，一看就是常年不拿笔的手画出来的。三只脚，圆肚子，锅沿上头还画了五道竖着的短纹，像五根牙签插在上头。\n\n锅里头是空的。\n\n不是画得空——是画的人特意在锅底留了一块白，四周用铅笔涂了灰，唯独中间那块没动。\n\n我盯着那口锅看了很久。\n\n\"大爷。\"\n\n\"嗯。\"\n\n\"他画这个的时候，人在哪？\"\n\n\"在炕上。家里。\"\n\n\"笔呢？\"\n\n\"铅笔头，从满意的书包里翻出来的。\"王药根说，\"他一年没拿过笔了。那阵子他连筷子都握不住，吃饭得我喂。\"\n\n我把纸翻过来。\n\n背面还有字。\n\n铅笔写的，手抖得厉害，笔画都叠在一起，可我能认出来。\n\n\"七月十一。\"\n\n底下还有一行：\n\n\"第五个还在沟里。\"\n\n我脑子里嗡的一声，像有人拿木棍在我后脑勺上敲了一下。\n\n五个外路人。\n\n死三个，出来两个。\n\n三加二，等于五。\n\n那这\"第五个\"，是谁？\n\n\"大爷，\"我听见自己的声音有点发飘，\"您刚才说，进去的是五个人。\"\n\n\"是五个。\"\n\n\"出来俩，死仨。\"\n\n\"是。\"\n\n\"那第五个——\"\n\n我话没说完，王药根忽然伸手，把那张纸从我手里抽了回去。\n\n他动作很轻，可手在抖。\n\n\"云峰小友。\"他说。\n\n\"您说。\"\n\n\"这张纸我藏了两年，谁都没给看过。\"老头把纸重新裹好，塞回铁盒，咔哒一声扣上盖子，\"我为什么给你们签那个分金约？为什么把老屋腾出来给你们放东西？\"\n\n\"为什么？\"\n\n\"因为我想有人再进一次鹰嘴沟。\"王药根说，\"我七十一了，进不去了。我儿进去了，回来成了那样。\"\n\n他顿了顿。\n\n\"我想知道，那第五个，到底是个什么东西。\"\n\n我没吭声。\n\n老屋里静得能听见炭火里最后那点木头在响。\n\n过了半晌，我问：\"大爷，长顺画完这张纸以后呢？\"\n\n\"他把铅笔撅了。\"\n\n\"撅了？\"\n\n\"撅成两截，扔在地上。\"王药根看着我，\"他说了一句话。\"\n\n\"什么话？\"\n\n\"他说——'爹，别问了。'\"\n\n我站起来，走到墙角。\n\n那块灵位还立着。\n\n\"故男王长顺之灵位\"。\n\n朱砂的字在暗处看着发黑，最后一竖拖出去老长。\n\n我盯着它看了足有十几秒。\n\n它没倒。\n\n我回头看王药根，老头正把铁盒往怀里揣，动作小心翼翼的，像揣着个刚满月的孩子。\n\n\"大爷，\"我说，\"您刚才说，长顺烧了半个月，说胡话。\"\n\n\"是。\"\n\n\"那半个月里，除了'锅是空的'，他还说过别的没有？\"\n\n王药根的手停住了。\n\n灶膛里最后一点炭\"噗\"地灭了，屋里彻底暗下来，只剩下门口透进来的那点灰白的天光。\n\n我看见老头的嘴动了动。\n\n\"说过。\"他说。\n\n\"说什么？\"\n\n老头抬起头。\n\n天光太暗，我看不清他的脸，只听见他的声音，干得像秋天苞米叶子。\n\n\"他说——'爹，第五个在数我。'\"\n\n我浑身的汗毛一下子全竖起来了。\n\n口袋里的手机就在这时候震了起来。\n\n我掏出来一看，是豆芽仔。\n\n刚按下接听，那边传来一阵风声和汽车过去的声音，豆芽仔扯着嗓子喊：\n\n\"峰子！货卖完了！可他娘的出事了——\"\n\n\"怎么了？\"\n\n\"买主不是废品站的人！\"豆芽仔的声音都变了调，\"从我们一进门，就有个老头在旁边盯着看！个头特别矮，比我矮一半还多！他一直没下车，就坐在那辆面包车里——\"\n\n我握着手机，慢慢转过头，看向王药根手里的那个铁盒。\n\n\"豆芽仔，\"我说，\"那辆车，你看清车牌了吗？\"\n\n\"看清了！我还记下来了！\"\n\n\"念。\"\n\n电话那头，豆芽仔深吸了一口气。\n\n念出了七个字。\n\n我听完，半天没说出话。\n\n那是辽西的车牌。", "words": 2509, "html": "<p>雨是后半夜停的。<\/p>\n<p>我和王药根蹲在老屋的灶膛前，谁也没说话。灶里的柴烧成了炭，红一阵暗一阵，把老头那张脸照得像块旧木头。<\/p>\n<p>那块灵位立在墙角。<\/p>\n<p>我没再去看它，可我知道它还立着——从我刚才说完那句话起，它就没再倒。<\/p>\n<p>\"大爷。\"我开口。<\/p>\n<p>\"嗯。\"<\/p>\n<p>\"长顺那事儿，您得跟我讲明白。\"<\/p>\n<p>王药根没马上答。他把手里那半截潮香掰断了，扔进灶里，一股子怪味儿腾起来。<\/p>\n<p>\"两年前的六月，\"他说，\"进来的。\"<\/p>\n<p>\"五个人？\"<\/p>\n<p>\"五个。\"<\/p>\n<p>\"一辆破吉普，绿色的，北京2020那种，后头斗上绑着铁锹和麻袋。\"老头慢慢讲，\"说是收山货的，榛蘑、蕨菜、松茸，什么都收。住在村东头老刘家的空房，一天给三十块钱。\"<\/p>\n<p>\"他们找向导。\"<\/p>\n<p>\"村里没人愿意带。鹰嘴沟那地方，本地人都不去——早年间摔死过采药的，前些年还有个放牛的进去再没出来。长顺就去揽这活儿了。\"王药根说到这儿，停了一下，\"一天两百。\"<\/p>\n<p>我没接话。<\/p>\n<p>两百块，在2005年的桓仁乡下，能让一个三十来岁的男人冒着雨往无人区里钻。<\/p>\n<p>\"进了几天？\"<\/p>\n<p>\"三天。\"<\/p>\n<p>\"出来几个？\"<\/p>\n<p>老头伸出两根手指，在手心里搓了搓。<\/p>\n<p>\"就回来俩。\"他说，\"一个是那酒糟鼻，红鼻头，四十来岁，说话冲得很，跟谁都像吵架。另一个白头发，瘦，看着得有六十了，不爱吭声，全程就蹲在边上抽烟。\"<\/p>\n<p>\"剩下三个呢？\"<\/p>\n<p>\"长顺后来跟我说，是塌方埋的。\"王药根抬起眼看我，\"可我们后来去找过，没找着。\"<\/p>\n<p>我心里\"咯噔\"一下。<\/p>\n<p>断崖下那三具无头男尸骨。<\/p>\n<p>没有头。<\/p>\n<p>塌方压死的人，头还在。<\/p>\n<p>\"长顺回来什么样？\"<\/p>\n<p>\"鞋丢了一只，裤腿撕到膝盖，手上的口子都化了脓。\"老头的声音很平，\"回来第三天开始烧，说胡话。烧了半个月，人瘦得脱了相。\"<\/p>\n<p>\"他说什么？\"<\/p>\n<p>\"就一句。\"<\/p>\n<p>\"爹，锅是空的。\"<\/p>\n<p>灶膛里的炭\"啪\"地爆了一声。<\/p>\n<p>\"就这一句？\"<\/p>\n<p>\"就这一句。\"王药根点头，\"翻来覆去，白天黑夜，醒了就说。我问他什么锅，他看我一眼，不答。再问，还是那句，跟卡了壳的收音机一样。\"<\/p>\n<p>\"三个月后呢？\"<\/p>\n<p>\"三个月后他自己上了吊。在仓房梁上，用了根麻绳。舌头伸出来老长。\"<\/p>\n<p>我沉默了一会儿。<\/p>\n<p>\"大爷，那三个人——那三个没出来的，长顺说没说他们是怎么死的？\"<\/p>\n<p>\"说过一次。\"<\/p>\n<p>\"怎么说的？\"<\/p>\n<p>王药根盯着我，灶火的影子在他眼睛里跳。<\/p>\n<p>\"他说：'不是埋的。'\"<\/p>\n<p>我后背一凉。<\/p>\n<p>\"不是埋的，那是什么？\"<\/p>\n<p>\"我再问，他就开始哆嗦，拿被子蒙头，怎么拽都不出来。\"老头说，\"第二天人就哑了，彻底不说话了。一直到死，一个字都没再讲。\"<\/p>\n<p>外头的雨完全停了。屋檐上的水滴在青石板上，\"嗒、嗒、嗒\"，一声一声，听得清清楚楚。<\/p>\n<p>\"那画呢。\"我说。<\/p>\n<p>老头没问我是怎么知道的。<\/p>\n<p>他站起来，走到里屋，翻了半天，捧出一个铁盒子。盒子是那种装饼干的旧铁盒，上头印着褪了色的\"青食\"两个字。<\/p>\n<p>他从里头拿出一个塑料袋，塑料袋里还裹着一层塑料布。<\/p>\n<p>\"他死前三天画的。\"王药根把塑料袋递给我，\"我在他枕头底下找到的。\"<\/p>\n<p>我接过来，就着灶火的光，把塑料布一层层掀开。<\/p>\n<p>里头是一张纸。<\/p>\n<p>不是什么好纸，就是小学生用的那种方格本撕下来的，边上都卷了。<\/p>\n<p>纸上用铅笔画着一口锅。<\/p>\n<p>画得很笨，线条歪歪扭扭，一看就是常年不拿笔的手画出来的。三只脚，圆肚子，锅沿上头还画了五道竖着的短纹，像五根牙签插在上头。<\/p>\n<p>锅里头是空的。<\/p>\n<p>不是画得空——是画的人特意在锅底留了一块白，四周用铅笔涂了灰，唯独中间那块没动。<\/p>\n<p>我盯着那口锅看了很久。<\/p>\n<p>\"大爷。\"<\/p>\n<p>\"嗯。\"<\/p>\n<p>\"他画这个的时候，人在哪？\"<\/p>\n<p>\"在炕上。家里。\"<\/p>\n<p>\"笔呢？\"<\/p>\n<p>\"铅笔头，从满意的书包里翻出来的。\"王药根说，\"他一年没拿过笔了。那阵子他连筷子都握不住，吃饭得我喂。\"<\/p>\n<p>我把纸翻过来。<\/p>\n<p>背面还有字。<\/p>\n<p>铅笔写的，手抖得厉害，笔画都叠在一起，可我能认出来。<\/p>\n<p>\"七月十一。\"<\/p>\n<p>底下还有一行：<\/p>\n<p>\"第五个还在沟里。\"<\/p>\n<p>我脑子里嗡的一声，像有人拿木棍在我后脑勺上敲了一下。<\/p>\n<p>五个外路人。<\/p>\n<p>死三个，出来两个。<\/p>\n<p>三加二，等于五。<\/p>\n<p>那这\"第五个\"，是谁？<\/p>\n<p>\"大爷，\"我听见自己的声音有点发飘，\"您刚才说，进去的是五个人。\"<\/p>\n<p>\"是五个。\"<\/p>\n<p>\"出来俩，死仨。\"<\/p>\n<p>\"是。\"<\/p>\n<p>\"那第五个——\"<\/p>\n<p>我话没说完，王药根忽然伸手，把那张纸从我手里抽了回去。<\/p>\n<p>他动作很轻，可手在抖。<\/p>\n<p>\"云峰小友。\"他说。<\/p>\n<p>\"您说。\"<\/p>\n<p>\"这张纸我藏了两年，谁都没给看过。\"老头把纸重新裹好，塞回铁盒，咔哒一声扣上盖子，\"我为什么给你们签那个分金约？为什么把老屋腾出来给你们放东西？\"<\/p>\n<p>\"为什么？\"<\/p>\n<p>\"因为我想有人再进一次鹰嘴沟。\"王药根说，\"我七十一了，进不去了。我儿进去了，回来成了那样。\"<\/p>\n<p>他顿了顿。<\/p>\n<p>\"我想知道，那第五个，到底是个什么东西。\"<\/p>\n<p>我没吭声。<\/p>\n<p>老屋里静得能听见炭火里最后那点木头在响。<\/p>\n<p>过了半晌，我问：\"大爷，长顺画完这张纸以后呢？\"<\/p>\n<p>\"他把铅笔撅了。\"<\/p>\n<p>\"撅了？\"<\/p>\n<p>\"撅成两截，扔在地上。\"王药根看着我，\"他说了一句话。\"<\/p>\n<p>\"什么话？\"<\/p>\n<p>\"他说——'爹，别问了。'\"<\/p>\n<p>我站起来，走到墙角。<\/p>\n<p>那块灵位还立着。<\/p>\n<p>\"故男王长顺之灵位\"。<\/p>\n<p>朱砂的字在暗处看着发黑，最后一竖拖出去老长。<\/p>\n<p>我盯着它看了足有十几秒。<\/p>\n<p>它没倒。<\/p>\n<p>我回头看王药根，老头正把铁盒往怀里揣，动作小心翼翼的，像揣着个刚满月的孩子。<\/p>\n<p>\"大爷，\"我说，\"您刚才说，长顺烧了半个月，说胡话。\"<\/p>\n<p>\"是。\"<\/p>\n<p>\"那半个月里，除了'锅是空的'，他还说过别的没有？\"<\/p>\n<p>王药根的手停住了。<\/p>\n<p>灶膛里最后一点炭\"噗\"地灭了，屋里彻底暗下来，只剩下门口透进来的那点灰白的天光。<\/p>\n<p>我看见老头的嘴动了动。<\/p>\n<p>\"说过。\"他说。<\/p>\n<p>\"说什么？\"<\/p>\n<p>老头抬起头。<\/p>\n<p>天光太暗，我看不清他的脸，只听见他的声音，干得像秋天苞米叶子。<\/p>\n<p>\"他说——'爹，第五个在数我。'\"<\/p>\n<p>我浑身的汗毛一下子全竖起来了。<\/p>\n<p>口袋里的手机就在这时候震了起来。<\/p>\n<p>我掏出来一看，是豆芽仔。<\/p>\n<p>刚按下接听，那边传来一阵风声和汽车过去的声音，豆芽仔扯着嗓子喊：<\/p>\n<p>\"峰子！货卖完了！可他娘的出事了——\"<\/p>\n<p>\"怎么了？\"<\/p>\n<p>\"买主不是废品站的人！\"豆芽仔的声音都变了调，\"从我们一进门，就有个老头在旁边盯着看！个头特别矮，比我矮一半还多！他一直没下车，就坐在那辆面包车里——\"<\/p>\n<p>我握着手机，慢慢转过头，看向王药根手里的那个铁盒。<\/p>\n<p>\"豆芽仔，\"我说，\"那辆车，你看清车牌了吗？\"<\/p>\n<p>\"看清了！我还记下来了！\"<\/p>\n<p>\"念。\"<\/p>\n<p>电话那头，豆芽仔深吸了一口气。<\/p>\n<p>念出了七个字。<\/p>\n<p>我听完，半天没说出话。<\/p>\n<p>那是辽西的车牌。<\/p>", "plain": "雨是后半夜停的。 我和王药根蹲在老屋的灶膛前，谁也没说话。灶里的柴烧成了炭，红一阵暗一阵，把老头那张脸照得像块旧木头。 那块灵位立在墙角。 我没再去看它，可我知道它还立着——从我刚才说完那句话起，它就没再倒。 \"大爷。\"我开口。 \"嗯。\" \"长顺那事儿，您得跟我讲明白。\" 王药根没马上答。他把手里那半截潮香掰断了，扔进灶里，一股子怪味儿腾起来。 \"两年前的六月，\"他说，\"进来的。\" \"五个人？\" \"五个。\" \"一辆破吉普，绿色的，北京2020那种，后头斗上绑着铁锹和麻袋。\"老头慢慢讲，\"说是收山货的，榛蘑、蕨菜、松茸，什么都收。住在村东头老刘家的空房，一天给三十块钱。\" \"他们找向导。\" \"村里没人愿意带。鹰嘴沟那地方，本地人都不去——早年间摔死过采药的，前些年还有个放牛的进去再没出来。长顺就去揽这活儿了。\"王药根说到这儿，停了一下，\"一天两百。\" 我没接话。 两百块，在2005年的桓仁乡下，能让一个三十来岁的男人冒着雨往无人区里钻。 \"进了几天？\" \"三天。\" \"出来几个？\" 老头伸出两根手指，在手心里搓了搓。 \"就回来俩。\"他说，\"一个是那酒糟鼻，红鼻头，四十来岁，说话冲得很，跟谁都像吵架。另一个白头发，瘦，看着得有六十了，不爱吭声，全程就蹲在边上抽烟。\" \"剩下三个呢？\" \"长顺后来跟我说，是塌方埋的。\"王药根抬起眼看我，\"可我们后来去找过，没找着。\" 我心里\"咯噔\"一下。 断崖下那三具无头男尸骨。 没有头。 塌方压死的人，头还在。 \"长顺回来什么样？\" \"鞋丢了一只，裤腿撕到膝盖，手上的口子都化了脓。\"老头的声音很平，\"回来第三天开始烧，说胡话。烧了半个月，人瘦得脱了相。\" \"他说什么？\" \"就一句。\" \"爹，锅是空的。\" 灶膛里的炭\"啪\"地爆了一声。 \"就这一句？\" \"就这一句。\"王药根点头，\"翻来覆去，白天黑夜，醒了就说。我问他什么锅，他看我一眼，不答。再问，还是那句，跟卡了壳的收音机一样。\" \"三个月后呢？\" \"三个月后他自己上了吊。在仓房梁上，用了根麻绳。舌头伸出来老长。\" 我沉默了一会儿。 \"大爷，那三个人——那三个没出来的，长顺说没说他们是怎么死的？\" \"说过一次。\" \"怎么说的？\" 王药根盯着我，灶火的影子在他眼睛里跳。 \"他说：'不是埋的。'\" 我后背一凉。 \"不是埋的，那是什么？\" \"我再问，他就开始哆嗦，拿被子蒙头，怎么拽都不出来。\"老头说，\"第二天人就哑了，彻底不说话了。一直到死，一个字都没再讲。\" 外头的雨完全停了。屋檐上的水滴在青石板上，\"嗒、嗒、嗒\"，一声一声，听得清清楚楚。 \"那画呢。\"我说。 老头没问我是怎么知道的。 他站起来，走到里屋，翻了半天，捧出一个铁盒子。盒子是那种装饼干的旧铁盒，上头印着褪了色的\"青食\"两个字。 他从里头拿出一个塑料袋，塑料袋里还裹着一层塑料布。 \"他死前三天画的。\"王药根把塑料袋递给我，\"我在他枕头底下找到的。\" 我接过来，就着灶火的光，把塑料布一层层掀开。 里头是一张纸。 不是什么好纸，就是小学生用的那种方格本撕下来的，边上都卷了。 纸上用铅笔画着一口锅。 画得很笨，线条歪歪扭扭，一看就是常年不拿笔的手画出来的。三只脚，圆肚子，锅沿上头还画了五道竖着的短纹，像五根牙签插在上头。 锅里头是空的。 不是画得空——是画的人特意在锅底留了一块白，四周用铅笔涂了灰，唯独中间那块没动。 我盯着那口锅看了很久。 \"大爷。\" \"嗯。\" \"他画这个的时候，人在哪？\" \"在炕上。家里。\" \"笔呢？\" \"铅笔头，从满意的书包里翻出来的。\"王药根说，\"他一年没拿过笔了。那阵子他连筷子都握不住，吃饭得我喂。\" 我把纸翻过来。 背面还有字。 铅笔写的，手抖得厉害，笔画都叠在一起，可我能认出来。 \"七月十一。\" 底下还有一行： \"第五个还在沟里。\" 我脑子里嗡的一声，像有人拿木棍在我后脑勺上敲了一下。 五个外路人。 死三个，出来两个。 三加二，等于五。 那这\"第五个\"，是谁？ \"大爷，\"我听见自己的声音有点发飘，\"您刚才说，进去的是五个人。\" \"是五个。\" \"出来俩，死仨。\" \"是。\" \"那第五个——\" 我话没说完，王药根忽然伸手，把那张纸从我手里抽了回去。 他动作很轻，可手在抖。 \"云峰小友。\"他说。 \"您说。\" \"这张纸我藏了两年，谁都没给看过。\"老头把纸重新裹好，塞回铁盒，咔哒一声扣上盖子，\"我为什么给你们签那个分金约？为什么把老屋腾出来给你们放东西？\" \"为什么？\" \"因为我想有人再进一次鹰嘴沟。\"王药根说，\"我七十一了，进不去了。我儿进去了，回来成了那样。\" 他顿了顿。 \"我想知道，那第五个，到底是个什么东西。\" 我没吭声。 老屋里静得能听见炭火里最后那点木头在响。 过了半晌，我问：\"大爷，长顺画完这张纸以后呢？\" \"他把铅笔撅了。\" \"撅了？\" \"撅成两截，扔在地上。\"王药根看着我，\"他说了一句话。\" \"什么话？\" \"他说——'爹，别问了。'\" 我站起来，走到墙角。 那块灵位还立着。 \"故男王长顺之灵位\"。 朱砂的字在暗处看着发黑，最后一竖拖出去老长。 我盯着它看了足有十几秒。 它没倒。 我回头看王药根，老头正把铁盒往怀里揣，动作小心翼翼的，像揣着个刚满月的孩子。 \"大爷，\"我说，\"您刚才说，长顺烧了半个月，说胡话。\" \"是。\" \"那半个月里，除了'锅是空的'，他还说过别的没有？\" 王药根的手停住了。 灶膛里最后一点炭\"噗\"地灭了，屋里彻底暗下来，只剩下门口透进来的那点灰白的天光。 我看见老头的嘴动了动。 \"说过。\"他说。 \"说什么？\" 老头抬起头。 天光太暗，我看不清他的脸，只听见他的声音，干得像秋天苞米叶子。 \"他说——'爹，第五个在数我。'\" 我浑身的汗毛一下子全竖起来了。 口袋里的手机就在这时候震了起来。 我掏出来一看，是豆芽仔。 刚按下接听，那边传来一阵风声和汽车过去的声音，豆芽仔扯着嗓子喊： \"峰子！货卖完了！可他娘的出事了——\" \"怎么了？\" \"买主不是废品站的人！\"豆芽仔的声音都变了调，\"从我们一进门，就有个老头在旁边盯着看！个头特别矮，比我矮一半还多！他一直没下车，就坐在那辆面包车里——\" 我握着手机，慢慢转过头，看向王药根手里的那个铁盒。 \"豆芽仔，\"我说，\"那辆车，你看清车牌了吗？\" \"看清了！我还记下来了！\" \"念。\" 电话那头，豆芽仔深吸了一口气。 念出了七个字。 我听完，半天没说出话。 那是辽西的车牌。"}, {"id": "A5-059", "arc": "A5", "num": 59, "title": "背锅的", "md": "从普乐堡回县城的时候，天刚蒙蒙亮。\n\n雨后的桓仁罩在一层白气里，浑江那边的山头全看不见，马路上积着水，三蹦子开过去，压得水花往两边劈。\n\n我浑身湿透，一进门就把雨衣扔在了门槛上。\n\n小萱从屋里探出头：\"云峰哥，你这一宿上哪儿了？\"\n\n\"办事儿。\"\n\n\"鸭子呢？\"\n\n\"有药了。\"我把搪瓷缸子递过去，\"绿豆甘草水，凉了给它灌五毫升，一天两回。掉毛的地方抹这个，一天三回。\"\n\n小萱接过去，凑鼻子底下闻了闻，脸皱成一团：\"这什么味儿啊。\"\n\n\"救命的味儿。\"\n\n她\"哦\"了一声，抱着缸子往厨房走，走了两步又回头：\"鱼哥在后院呢，天没亮就起来了。\"\n\n我嗯了一声，径直进了堂屋。\n\n把头坐在八仙桌前抽烟，桌上摊着一张桓仁县的地图。\n\n见我进来，他把烟摁了：\"老屋那边的事完了？\"\n\n\"完了。\"\n\n\"铁器呢？\"\n\n\"豆芽仔刚来电话，货出了。\"我把普乐堡这一宿的事拣要紧的说了，长顺、那五个外路人、画着锅的纸、\"第五个还在沟里\"，一直说到最后那块辽西车牌。\n\n把头听完，半天没说话。\n\n他把烟盒捏在手里转了两圈，才开口：\"辽西。\"\n\n\"是。\"\n\n\"姚师爷的人，不至于跑到沈阳的废品站去收一堆破铁。\"把头说，\"可也不像长春会——长春会要这种铁器没用。\"\n\n\"那就是有人专门盯着这批货。\"\n\n\"盯着货，还是盯着出货的人。\"把头抬眼看我，\"云峰，那伙包头口音的人，卖珍珠罐儿是在一年多前，卖玉树叶是年前。他们把这坑里的东西，一件一件、慢慢地往外撒，撒了一年多。\"\n\n\"怕人查。\"\n\n\"怕人查。\"把头点头，\"可他们现在反过来在收我们的铁器。\"\n\n\"说明他们知道我们已经摸到地方了。\"\n\n\"说明——\"把头把烟盒往桌上一放，\"他们一直知道有人在找。\"\n\n我没接话，从兜里掏出手机，蹲到门槛上翻照片。\n\n那是我用N73拍的。\n\n第二座碎石墓，白底朱砂，五个小人，一人背一口锅。\n\n屏幕才两寸多，我拿两根手指在屏幕上撑开、放大，再撑、再放大，像素一格一格地糊起来，最后成了马赛克。\n\n\"看不清。\"我嘀咕。\n\n\"拿过来。\"\n\n我抬头，把头冲我伸着手。\n\n我把手机递过去，他戴上老花镜，把手机举到窗户跟前，就着天光看。\n\n看了得有两分钟。\n\n\"把头，您看什么？\"\n\n\"你过来。\"\n\n我凑过去。\n\n把头粗粝的手指在屏幕上点着，一个一个数：\"第一个，锅上有盖。第二个，锅里画了三道横杠，像是水。第三个，锅沿上有个缺口。第四个，锅底下画了火。\"\n\n他停住了。\n\n\"第五个呢？\"\n\n\"第五个，\"把头把手机往我跟前推了推，\"你自己看。\"\n\n我凑近了看。\n\n第五个小人比其他四个矮一点，背上的锅也是那口锅的画法，三只脚，圆肚子。\n\n可它锅里什么都没有。\n\n不是没有画东西——是画的人压根就没打算画。\n\n别的四口锅，锅里都有线条，有盖、有水、有火，唯独这一口，锅膛里是白白的一片，跟长顺那张纸上留的那块白，一模一样。\n\n我脑子里\"轰\"的一声。\n\n\"把头。\"\n\n\"嗯。\"\n\n\"王长顺画的那口锅，锅里也是空的。\"\n\n把头没说话。\n\n他把手机放下，摘了老花镜，用衣角慢慢擦着镜片。\n\n\"两千年前画在石头坟里的画，\"他说，\"和一个两年前上吊死的人画在方格本上的画，画的是同一口空锅。\"\n\n\"是。\"\n\n\"云峰，你觉得这说明什么？\"\n\n\"说明长顺在沟里见过这口锅。\"\n\n\"不止是见过。\"把头把眼镜戴上，\"他见过，还记住了，回来烧了半个月的高烧，到死都在说这句话。\"\n\n外头的天光又亮了一些。雨彻底停了，能听见远处有卖豆腐的梆子声，一下，一下。\n\n我把手机收起来，坐在门槛上点了根烟。\n\n\"把头，我前些日子说那五个人是高句丽的五部，您让我别瞎联想。\"\n\n\"是。\"\n\n\"您现在能告诉我了吗？\"\n\n把头沉默了一会儿。\n\n他起身，从里屋拿出一本翻得卷了边的书，是那本《后汉书·高句丽传》的注释本，这几月他一有空就翻。\n\n他把书摊在桌上，翻到做了记号的一页。\n\n\"高句丽立国，靠的是五个部。\"他说。\n\n\"哪五个？\"\n\n\"桂娄部、消奴部、绝奴部、顺奴部、灌奴部。\"\n\n我赶紧掏出笔，在手心上记。\n\n\"这五部不是平起平坐的。\"把头拿手指在桌上画，\"最早称王的，不是桂娄部。\"\n\n\"不是？\"\n\n\"最早是消奴部。\"把头说，\"高句丽开国的头几代王，出自消奴部。后来王位转到了桂娄部手里，从那以后，桂娄部世代为王，其余四部轮流当'左辅''右辅'，也就是左右丞相。\"\n\n\"消奴部丢了王位。\"\n\n\"丢了王位，也丢了命。\"\n\n我心里一紧。\n\n\"把头，您是说——\"\n\n\"五部里，有一部是被杀绝的。\"把头把书合上，\"就是消奴部。\"\n\n窗外那卖豆腐的梆子声走远了。\n\n我捏着烟，忘了抽。\n\n\"为什么杀？\"\n\n\"说是谋反。\"把头说，\"具体怎么个反法，史书上就那么几个字，谁也说不清。反正从那以后，高句丽就只剩四部了。\"\n\n四部。\n\n我猛地想起壁画上那四个被涂改过的小人。\n\n\"把头，\"我说，\"那画上五个人，有四个人的背上有涂改的痕迹。\"\n\n\"是。\"\n\n\"涂改的是什么？\"\n\n\"不知道。\"把头说，\"我和你想过一样的事——改的是名字，是族徽，还是部名。可那壁画在墓里，墓是碎石墓，小得可怜，却画了白底朱砂。云峰你记不记得，集安那四千多座墓，带壁画的不到三十座。\"\n\n\"记得。全是大墓。\"\n\n\"这墓不是大墓。\"把头说，\"可它有壁画。\"\n\n\"所以这墓不是给贵族的。\"\n\n\"或者说，\"把头慢慢地说，\"不是给活着的贵族的。\"\n\n我手里的烟烧到了指头，一激灵，赶紧扔了。\n\n\"把头，我不明白。\"\n\n\"你想想，\"把头拿指头敲着桌面，\"消奴部被杀绝了。杀绝的意思，是连名号都给你抹了，史书上不写，石碑上不刻，后人提都不提——就跟没存在过一样。\"\n\n\"是。\"\n\n\"那要是有人偏偏要把这'第五个'画上去呢？\"\n\n我愣住了。\n\n\"您的意思是——\"\n\n\"墓里那幅画，\"把头说，\"是被杀绝的那一部的人画的，或者是他们的后人画的。\"\n\n\"可他为什么把四个人的背都涂改了，独独留下这第五个？\"\n\n把头看了我很久。\n\n堂屋里静得落针可闻。\n\n\"因为他留下的不是第五个。\"把头说。\n\n\"那他留下的是什么？\"\n\n\"是那口锅。\"\n\n我脑子里翻江倒海。\n\n一口空锅。\n\n一个被杀绝了的部。\n\n一个两千年前的画匠，在石头坟里偷偷画下第五个小人，给他背上一口什么都没装的锅。\n\n然后两千年后，一个叫王长顺的农村汉子从鹰嘴沟里爬出来，烧了半个月，在方格本上画了同一口空锅，说\"爹，锅是空的\"。\n\n\"把头，\"我嗓子有点干，\"空锅是什么意思？\"\n\n\"我不知道。\"\n\n\"那咱们现在怎么办？\"\n\n把头把那本书推到我面前。\n\n\"你先看这个。\"他说，\"看完了，把那批铁器的账给我算清楚。老周那边你抓紧见一面——买主是谁，中间经了几道手，那辆辽西牌照的车是谁的，一条都不能落。\"\n\n\"明白。\"\n\n\"还有，\"把头站起身，走到门口，背对着我说，\"云峰。\"\n\n\"在。\"\n\n\"那口空锅的事，先不要和文斌讲，也不要和芽仔讲。\"\n\n我心里一沉：\"为什么？\"\n\n把头没回头。\n\n晨光从门外照进来，把他花白的头发照得发亮。\n\n\"因为鱼哥昨儿夜里又魇着了。\"\n\n我猛地站起来。\n\n\"什么时候的事？\"\n\n\"你走了一个钟头以后。\"把头说，\"这回他不喊不叫，就那么坐在炕上，两只手攥成拳头，攥了一夜。\"\n\n\"他说什么没有？\"\n\n把头沉默了三秒钟。\n\n\"说了。\"\n\n\"说什么？\"\n\n把头转过身，看着我。\n\n\"他说：'锅里有人。'\"", "words": 2761, "html": "<p>从普乐堡回县城的时候，天刚蒙蒙亮。<\/p>\n<p>雨后的桓仁罩在一层白气里，浑江那边的山头全看不见，马路上积着水，三蹦子开过去，压得水花往两边劈。<\/p>\n<p>我浑身湿透，一进门就把雨衣扔在了门槛上。<\/p>\n<p>小萱从屋里探出头：\"云峰哥，你这一宿上哪儿了？\"<\/p>\n<p>\"办事儿。\"<\/p>\n<p>\"鸭子呢？\"<\/p>\n<p>\"有药了。\"我把搪瓷缸子递过去，\"绿豆甘草水，凉了给它灌五毫升，一天两回。掉毛的地方抹这个，一天三回。\"<\/p>\n<p>小萱接过去，凑鼻子底下闻了闻，脸皱成一团：\"这什么味儿啊。\"<\/p>\n<p>\"救命的味儿。\"<\/p>\n<p>她\"哦\"了一声，抱着缸子往厨房走，走了两步又回头：\"鱼哥在后院呢，天没亮就起来了。\"<\/p>\n<p>我嗯了一声，径直进了堂屋。<\/p>\n<p>把头坐在八仙桌前抽烟，桌上摊着一张桓仁县的地图。<\/p>\n<p>见我进来，他把烟摁了：\"老屋那边的事完了？\"<\/p>\n<p>\"完了。\"<\/p>\n<p>\"铁器呢？\"<\/p>\n<p>\"豆芽仔刚来电话，货出了。\"我把普乐堡这一宿的事拣要紧的说了，长顺、那五个外路人、画着锅的纸、\"第五个还在沟里\"，一直说到最后那块辽西车牌。<\/p>\n<p>把头听完，半天没说话。<\/p>\n<p>他把烟盒捏在手里转了两圈，才开口：\"辽西。\"<\/p>\n<p>\"是。\"<\/p>\n<p>\"姚师爷的人，不至于跑到沈阳的废品站去收一堆破铁。\"把头说，\"可也不像长春会——长春会要这种铁器没用。\"<\/p>\n<p>\"那就是有人专门盯着这批货。\"<\/p>\n<p>\"盯着货，还是盯着出货的人。\"把头抬眼看我，\"云峰，那伙包头口音的人，卖珍珠罐儿是在一年多前，卖玉树叶是年前。他们把这坑里的东西，一件一件、慢慢地往外撒，撒了一年多。\"<\/p>\n<p>\"怕人查。\"<\/p>\n<p>\"怕人查。\"把头点头，\"可他们现在反过来在收我们的铁器。\"<\/p>\n<p>\"说明他们知道我们已经摸到地方了。\"<\/p>\n<p>\"说明——\"把头把烟盒往桌上一放，\"他们一直知道有人在找。\"<\/p>\n<p>我没接话，从兜里掏出手机，蹲到门槛上翻照片。<\/p>\n<p>那是我用N73拍的。<\/p>\n<p>第二座碎石墓，白底朱砂，五个小人，一人背一口锅。<\/p>\n<p>屏幕才两寸多，我拿两根手指在屏幕上撑开、放大，再撑、再放大，像素一格一格地糊起来，最后成了马赛克。<\/p>\n<p>\"看不清。\"我嘀咕。<\/p>\n<p>\"拿过来。\"<\/p>\n<p>我抬头，把头冲我伸着手。<\/p>\n<p>我把手机递过去，他戴上老花镜，把手机举到窗户跟前，就着天光看。<\/p>\n<p>看了得有两分钟。<\/p>\n<p>\"把头，您看什么？\"<\/p>\n<p>\"你过来。\"<\/p>\n<p>我凑过去。<\/p>\n<p>把头粗粝的手指在屏幕上点着，一个一个数：\"第一个，锅上有盖。第二个，锅里画了三道横杠，像是水。第三个，锅沿上有个缺口。第四个，锅底下画了火。\"<\/p>\n<p>他停住了。<\/p>\n<p>\"第五个呢？\"<\/p>\n<p>\"第五个，\"把头把手机往我跟前推了推，\"你自己看。\"<\/p>\n<p>我凑近了看。<\/p>\n<p>第五个小人比其他四个矮一点，背上的锅也是那口锅的画法，三只脚，圆肚子。<\/p>\n<p>可它锅里什么都没有。<\/p>\n<p>不是没有画东西——是画的人压根就没打算画。<\/p>\n<p>别的四口锅，锅里都有线条，有盖、有水、有火，唯独这一口，锅膛里是白白的一片，跟长顺那张纸上留的那块白，一模一样。<\/p>\n<p>我脑子里\"轰\"的一声。<\/p>\n<p>\"把头。\"<\/p>\n<p>\"嗯。\"<\/p>\n<p>\"王长顺画的那口锅，锅里也是空的。\"<\/p>\n<p>把头没说话。<\/p>\n<p>他把手机放下，摘了老花镜，用衣角慢慢擦着镜片。<\/p>\n<p>\"两千年前画在石头坟里的画，\"他说，\"和一个两年前上吊死的人画在方格本上的画，画的是同一口空锅。\"<\/p>\n<p>\"是。\"<\/p>\n<p>\"云峰，你觉得这说明什么？\"<\/p>\n<p>\"说明长顺在沟里见过这口锅。\"<\/p>\n<p>\"不止是见过。\"把头把眼镜戴上，\"他见过，还记住了，回来烧了半个月的高烧，到死都在说这句话。\"<\/p>\n<p>外头的天光又亮了一些。雨彻底停了，能听见远处有卖豆腐的梆子声，一下，一下。<\/p>\n<p>我把手机收起来，坐在门槛上点了根烟。<\/p>\n<p>\"把头，我前些日子说那五个人是高句丽的五部，您让我别瞎联想。\"<\/p>\n<p>\"是。\"<\/p>\n<p>\"您现在能告诉我了吗？\"<\/p>\n<p>把头沉默了一会儿。<\/p>\n<p>他起身，从里屋拿出一本翻得卷了边的书，是那本《后汉书·高句丽传》的注释本，这几月他一有空就翻。<\/p>\n<p>他把书摊在桌上，翻到做了记号的一页。<\/p>\n<p>\"高句丽立国，靠的是五个部。\"他说。<\/p>\n<p>\"哪五个？\"<\/p>\n<p>\"桂娄部、消奴部、绝奴部、顺奴部、灌奴部。\"<\/p>\n<p>我赶紧掏出笔，在手心上记。<\/p>\n<p>\"这五部不是平起平坐的。\"把头拿手指在桌上画，\"最早称王的，不是桂娄部。\"<\/p>\n<p>\"不是？\"<\/p>\n<p>\"最早是消奴部。\"把头说，\"高句丽开国的头几代王，出自消奴部。后来王位转到了桂娄部手里，从那以后，桂娄部世代为王，其余四部轮流当'左辅''右辅'，也就是左右丞相。\"<\/p>\n<p>\"消奴部丢了王位。\"<\/p>\n<p>\"丢了王位，也丢了命。\"<\/p>\n<p>我心里一紧。<\/p>\n<p>\"把头，您是说——\"<\/p>\n<p>\"五部里，有一部是被杀绝的。\"把头把书合上，\"就是消奴部。\"<\/p>\n<p>窗外那卖豆腐的梆子声走远了。<\/p>\n<p>我捏着烟，忘了抽。<\/p>\n<p>\"为什么杀？\"<\/p>\n<p>\"说是谋反。\"把头说，\"具体怎么个反法，史书上就那么几个字，谁也说不清。反正从那以后，高句丽就只剩四部了。\"<\/p>\n<p>四部。<\/p>\n<p>我猛地想起壁画上那四个被涂改过的小人。<\/p>\n<p>\"把头，\"我说，\"那画上五个人，有四个人的背上有涂改的痕迹。\"<\/p>\n<p>\"是。\"<\/p>\n<p>\"涂改的是什么？\"<\/p>\n<p>\"不知道。\"把头说，\"我和你想过一样的事——改的是名字，是族徽，还是部名。可那壁画在墓里，墓是碎石墓，小得可怜，却画了白底朱砂。云峰你记不记得，集安那四千多座墓，带壁画的不到三十座。\"<\/p>\n<p>\"记得。全是大墓。\"<\/p>\n<p>\"这墓不是大墓。\"把头说，\"可它有壁画。\"<\/p>\n<p>\"所以这墓不是给贵族的。\"<\/p>\n<p>\"或者说，\"把头慢慢地说，\"不是给活着的贵族的。\"<\/p>\n<p>我手里的烟烧到了指头，一激灵，赶紧扔了。<\/p>\n<p>\"把头，我不明白。\"<\/p>\n<p>\"你想想，\"把头拿指头敲着桌面，\"消奴部被杀绝了。杀绝的意思，是连名号都给你抹了，史书上不写，石碑上不刻，后人提都不提——就跟没存在过一样。\"<\/p>\n<p>\"是。\"<\/p>\n<p>\"那要是有人偏偏要把这'第五个'画上去呢？\"<\/p>\n<p>我愣住了。<\/p>\n<p>\"您的意思是——\"<\/p>\n<p>\"墓里那幅画，\"把头说，\"是被杀绝的那一部的人画的，或者是他们的后人画的。\"<\/p>\n<p>\"可他为什么把四个人的背都涂改了，独独留下这第五个？\"<\/p>\n<p>把头看了我很久。<\/p>\n<p>堂屋里静得落针可闻。<\/p>\n<p>\"因为他留下的不是第五个。\"把头说。<\/p>\n<p>\"那他留下的是什么？\"<\/p>\n<p>\"是那口锅。\"<\/p>\n<p>我脑子里翻江倒海。<\/p>\n<p>一口空锅。<\/p>\n<p>一个被杀绝了的部。<\/p>\n<p>一个两千年前的画匠，在石头坟里偷偷画下第五个小人，给他背上一口什么都没装的锅。<\/p>\n<p>然后两千年后，一个叫王长顺的农村汉子从鹰嘴沟里爬出来，烧了半个月，在方格本上画了同一口空锅，说\"爹，锅是空的\"。<\/p>\n<p>\"把头，\"我嗓子有点干，\"空锅是什么意思？\"<\/p>\n<p>\"我不知道。\"<\/p>\n<p>\"那咱们现在怎么办？\"<\/p>\n<p>把头把那本书推到我面前。<\/p>\n<p>\"你先看这个。\"他说，\"看完了，把那批铁器的账给我算清楚。老周那边你抓紧见一面——买主是谁，中间经了几道手，那辆辽西牌照的车是谁的，一条都不能落。\"<\/p>\n<p>\"明白。\"<\/p>\n<p>\"还有，\"把头站起身，走到门口，背对着我说，\"云峰。\"<\/p>\n<p>\"在。\"<\/p>\n<p>\"那口空锅的事，先不要和文斌讲，也不要和芽仔讲。\"<\/p>\n<p>我心里一沉：\"为什么？\"<\/p>\n<p>把头没回头。<\/p>\n<p>晨光从门外照进来，把他花白的头发照得发亮。<\/p>\n<p>\"因为鱼哥昨儿夜里又魇着了。\"<\/p>\n<p>我猛地站起来。<\/p>\n<p>\"什么时候的事？\"<\/p>\n<p>\"你走了一个钟头以后。\"把头说，\"这回他不喊不叫，就那么坐在炕上，两只手攥成拳头，攥了一夜。\"<\/p>\n<p>\"他说什么没有？\"<\/p>\n<p>把头沉默了三秒钟。<\/p>\n<p>\"说了。\"<\/p>\n<p>\"说什么？\"<\/p>\n<p>把头转过身，看着我。<\/p>\n<p>\"他说：'锅里有人。'\"<\/p>", "plain": "从普乐堡回县城的时候，天刚蒙蒙亮。 雨后的桓仁罩在一层白气里，浑江那边的山头全看不见，马路上积着水，三蹦子开过去，压得水花往两边劈。 我浑身湿透，一进门就把雨衣扔在了门槛上。 小萱从屋里探出头：\"云峰哥，你这一宿上哪儿了？\" \"办事儿。\" \"鸭子呢？\" \"有药了。\"我把搪瓷缸子递过去，\"绿豆甘草水，凉了给它灌五毫升，一天两回。掉毛的地方抹这个，一天三回。\" 小萱接过去，凑鼻子底下闻了闻，脸皱成一团：\"这什么味儿啊。\" \"救命的味儿。\" 她\"哦\"了一声，抱着缸子往厨房走，走了两步又回头：\"鱼哥在后院呢，天没亮就起来了。\" 我嗯了一声，径直进了堂屋。 把头坐在八仙桌前抽烟，桌上摊着一张桓仁县的地图。 见我进来，他把烟摁了：\"老屋那边的事完了？\" \"完了。\" \"铁器呢？\" \"豆芽仔刚来电话，货出了。\"我把普乐堡这一宿的事拣要紧的说了，长顺、那五个外路人、画着锅的纸、\"第五个还在沟里\"，一直说到最后那块辽西车牌。 把头听完，半天没说话。 他把烟盒捏在手里转了两圈，才开口：\"辽西。\" \"是。\" \"姚师爷的人，不至于跑到沈阳的废品站去收一堆破铁。\"把头说，\"可也不像长春会——长春会要这种铁器没用。\" \"那就是有人专门盯着这批货。\" \"盯着货，还是盯着出货的人。\"把头抬眼看我，\"云峰，那伙包头口音的人，卖珍珠罐儿是在一年多前，卖玉树叶是年前。他们把这坑里的东西，一件一件、慢慢地往外撒，撒了一年多。\" \"怕人查。\" \"怕人查。\"把头点头，\"可他们现在反过来在收我们的铁器。\" \"说明他们知道我们已经摸到地方了。\" \"说明——\"把头把烟盒往桌上一放，\"他们一直知道有人在找。\" 我没接话，从兜里掏出手机，蹲到门槛上翻照片。 那是我用N73拍的。 第二座碎石墓，白底朱砂，五个小人，一人背一口锅。 屏幕才两寸多，我拿两根手指在屏幕上撑开、放大，再撑、再放大，像素一格一格地糊起来，最后成了马赛克。 \"看不清。\"我嘀咕。 \"拿过来。\" 我抬头，把头冲我伸着手。 我把手机递过去，他戴上老花镜，把手机举到窗户跟前，就着天光看。 看了得有两分钟。 \"把头，您看什么？\" \"你过来。\" 我凑过去。 把头粗粝的手指在屏幕上点着，一个一个数：\"第一个，锅上有盖。第二个，锅里画了三道横杠，像是水。第三个，锅沿上有个缺口。第四个，锅底下画了火。\" 他停住了。 \"第五个呢？\" \"第五个，\"把头把手机往我跟前推了推，\"你自己看。\" 我凑近了看。 第五个小人比其他四个矮一点，背上的锅也是那口锅的画法，三只脚，圆肚子。 可它锅里什么都没有。 不是没有画东西——是画的人压根就没打算画。 别的四口锅，锅里都有线条，有盖、有水、有火，唯独这一口，锅膛里是白白的一片，跟长顺那张纸上留的那块白，一模一样。 我脑子里\"轰\"的一声。 \"把头。\" \"嗯。\" \"王长顺画的那口锅，锅里也是空的。\" 把头没说话。 他把手机放下，摘了老花镜，用衣角慢慢擦着镜片。 \"两千年前画在石头坟里的画，\"他说，\"和一个两年前上吊死的人画在方格本上的画，画的是同一口空锅。\" \"是。\" \"云峰，你觉得这说明什么？\" \"说明长顺在沟里见过这口锅。\" \"不止是见过。\"把头把眼镜戴上，\"他见过，还记住了，回来烧了半个月的高烧，到死都在说这句话。\" 外头的天光又亮了一些。雨彻底停了，能听见远处有卖豆腐的梆子声，一下，一下。 我把手机收起来，坐在门槛上点了根烟。 \"把头，我前些日子说那五个人是高句丽的五部，您让我别瞎联想。\" \"是。\" \"您现在能告诉我了吗？\" 把头沉默了一会儿。 他起身，从里屋拿出一本翻得卷了边的书，是那本《后汉书·高句丽传》的注释本，这几月他一有空就翻。 他把书摊在桌上，翻到做了记号的一页。 \"高句丽立国，靠的是五个部。\"他说。 \"哪五个？\" \"桂娄部、消奴部、绝奴部、顺奴部、灌奴部。\" 我赶紧掏出笔，在手心上记。 \"这五部不是平起平坐的。\"把头拿手指在桌上画，\"最早称王的，不是桂娄部。\" \"不是？\" \"最早是消奴部。\"把头说，\"高句丽开国的头几代王，出自消奴部。后来王位转到了桂娄部手里，从那以后，桂娄部世代为王，其余四部轮流当'左辅''右辅'，也就是左右丞相。\" \"消奴部丢了王位。\" \"丢了王位，也丢了命。\" 我心里一紧。 \"把头，您是说——\" \"五部里，有一部是被杀绝的。\"把头把书合上，\"就是消奴部。\" 窗外那卖豆腐的梆子声走远了。 我捏着烟，忘了抽。 \"为什么杀？\" \"说是谋反。\"把头说，\"具体怎么个反法，史书上就那么几个字，谁也说不清。反正从那以后，高句丽就只剩四部了。\" 四部。 我猛地想起壁画上那四个被涂改过的小人。 \"把头，\"我说，\"那画上五个人，有四个人的背上有涂改的痕迹。\" \"是。\" \"涂改的是什么？\" \"不知道。\"把头说，\"我和你想过一样的事——改的是名字，是族徽，还是部名。可那壁画在墓里，墓是碎石墓，小得可怜，却画了白底朱砂。云峰你记不记得，集安那四千多座墓，带壁画的不到三十座。\" \"记得。全是大墓。\" \"这墓不是大墓。\"把头说，\"可它有壁画。\" \"所以这墓不是给贵族的。\" \"或者说，\"把头慢慢地说，\"不是给活着的贵族的。\" 我手里的烟烧到了指头，一激灵，赶紧扔了。 \"把头，我不明白。\" \"你想想，\"把头拿指头敲着桌面，\"消奴部被杀绝了。杀绝的意思，是连名号都给你抹了，史书上不写，石碑上不刻，后人提都不提——就跟没存在过一样。\" \"是。\" \"那要是有人偏偏要把这'第五个'画上去呢？\" 我愣住了。 \"您的意思是——\" \"墓里那幅画，\"把头说，\"是被杀绝的那一部的人画的，或者是他们的后人画的。\" \"可他为什么把四个人的背都涂改了，独独留下这第五个？\" 把头看了我很久。 堂屋里静得落针可闻。 \"因为他留下的不是第五个。\"把头说。 \"那他留下的是什么？\" \"是那口锅。\" 我脑子里翻江倒海。 一口空锅。 一个被杀绝了的部。 一个两千年前的画匠，在石头坟里偷偷画下第五个小人，给他背上一口什么都没装的锅。 然后两千年后，一个叫王长顺的农村汉子从鹰嘴沟里爬出来，烧了半个月，在方格本上画了同一口空锅，说\"爹，锅是空的\"。 \"把头，\"我嗓子有点干，\"空锅是什么意思？\" \"我不知道。\" \"那咱们现在怎么办？\" 把头把那本书推到我面前。 \"你先看这个。\"他说，\"看完了，把那批铁器的账给我算清楚。老周那边你抓紧见一面——买主是谁，中间经了几道手，那辆辽西牌照的车是谁的，一条都不能落。\" \"明白。\" \"还有，\"把头站起身，走到门口，背对着我说，\"云峰。\" \"在。\" \"那口空锅的事，先不要和文斌讲，也不要和芽仔讲。\" 我心里一沉：\"为什么？\" 把头没回头。 晨光从门外照进来，把他花白的头发照得发亮。 \"因为鱼哥昨儿夜里又魇着了。\" 我猛地站起来。 \"什么时候的事？\" \"你走了一个钟头以后。\"把头说，\"这回他不喊不叫，就那么坐在炕上，两只手攥成拳头，攥了一夜。\" \"他说什么没有？\" 把头沉默了三秒钟。 \"说了。\" \"说什么？\" 把头转过身，看着我。 \"他说：'锅里有人。'\""}, {"id": "A5-060", "arc": "A5", "num": 60, "title": "废品站", "md": "老周的店，重新开门了。\n\n门板上那张\"暂停营业几天\"的纸条撕了，撕得不干净，四角还留着白胶印。我到的时候是上午十点，他正蹲在门口拿小刀刮玻璃上的一块牛皮癣广告，见我来了，小刀一收，搓着手迎上来。\n\n\"兄弟，你可算来了，我这心里七上八下好几宿了。\"\n\n\"进去说。\"\n\n店里还是老样子，柜台后头那盏绿罩台灯，玻璃柜里摆着几串花钱和几个笔洗，多了一面锦旗，\"诚信经营\"，红字黄边。\n\n我坐下了，开门见山：\"铁器的事，从头到尾，给我过一遍。\"\n\n老周搬了个凳子坐我对面，掰着手指头讲。\n\n\"那天夜里，我开着面包车拉货去的沈阳，就你兄弟（指豆芽仔）跟着。到的是于洪区一家大废品站，姓马，马老板，我跟他做过几年废铜烂铁的生意，人可靠，嘴也严。\"\n\n\"过磅，一百六十多件，连灶台带釜，一共三吨二，按七毛一斤，收了四千四百八十块。钱是马老板当场给的现金。\"\n\n\"然后呢。\"\n\n\"然后我俩没走。\"老周的声音压下来，\"按你吩咐的，我俩在马路对面的小旅馆开了个房，趴窗户上瞅。\"\n\n\"瞅见什么了？\"\n\n\"瞅见邪门的了。\"\n\n他从抽屉里摸出一包烟，抽出一根点上，手有点抖。\n\n\"当天后半夜，三点来钟，那废品站来了辆车。绿色的北京吉普2020，跟吉普车斗上绑着铁锹——兄弟，就跟我上回跟你说的那伙收山货的一模一样的车！\"\n\n我心里一动。\n\n\"车牌呢？\"\n\n\"我记了。\"老周从柜台底下摸出个小本子，翻开，推给我。\n\n我低头看。\n\n辽P·55749。\n\n跟豆芽仔念给我的是同一个号。\n\n\"车上下来的两个人，一个穿棉猴儿的，一个穿旧西装的。穿西装那个跟马老板讲价，我离得远听不清，就看见马老板起先直摆手，后来那人从怀里掏出个信封，往磅秤上一拍。马老板捏了捏厚度，就点头了。\"\n\n\"多少钱？\"\n\n\"我第二天专门去问了。\"老周伸出三根手指，\"三万。\"\n\n\"三万二？\"\n\n\"三万，三千二都没给添，就整三万，一捆一捆的，全是旧票子。\"\n\n我算了笔账。\n\n四千四百八十块收的废铁，转手三万整收走，一夜之间，翻了六倍七。\n\n收破烂的都懂：废铁就是废铁，锈得再花也是废铁，没人会为一堆铁锅铁甑多掏两万五。\n\n除非他知道那不是废铁。\n\n\"东西装车了吗？\"\n\n\"装了。那个穿西装的还现场验货，一件一件拿手电照，专挑带锈花的。有件大铁甑，他翻过来照了半天锅底，又拿小刀在口沿上刮了刮，我瞅着他脸色不太好。\"\n\n刮了刮。\n\n我心里明白了七八分——那是我在普乐堡老屋连夜划掉族徽的那件。\n\n他没找到他要的东西。\n\n\"人长什么样？\"\n\n\"穿西装那个，五十来岁，白净，戴副平光眼镜，手指头干净得很，不像干力气活的。开车那个年轻些，全程没下车，就摇下车窗递烟。\"\n\n\"口音呢？\"\n\n\"说话冲，字字都往外砸。\"老周想了想，\"硬，不是咱们辽东的调儿，关外那边的。\"\n\n关外。\n\n包头、内蒙，还是辽西？\n\n\"他俩走的时候，\"老周把烟摁灭，凑近了半尺，声音低得像蚊子哼，\"穿西装那个回头问马老板一句话，马老板后来学给我听了。\"\n\n\"什么话？\"\n\n\"他问：'这两天，还有没有这样的货。'\"\n\n\"马老板怎么说？\"\n\n\"马老板说，废品站嘛，什么都可能来。\"老周咧了咧嘴，笑得比哭难看，\"那人就从怀里又掏出五百块，拍在柜台上，说：'这是定钱。往后再有带锈花的老铁器，不管多少，先给我留着，我加钱。'\"\n\n五千？\n\n不，五百。\n\n五百块定钱，买一个消息。\n\n这买卖做的，比我们行里人还门儿清。\n\n我坐在那儿，把这串事从头到尾捋了一遍。\n\n铁器当废铁进站，是我们故意洒出去的\"烟儿\"。烟儿刚落地，鱼就来了——不等天亮，带着现钱，直奔带锈花的老铁器。\n\n这不是撞上的。\n\n这是**守着**的。\n\n守着的意思是：他一直在等这批东西浮出水面。他知道桓仁出了高句丽早期的大货，他不知道货在谁手里、藏在哪，于是他就蹲在废品站——天下行里人销\"脏\"的老地方——等我们这种把货化整为零的人自己撞上来。\n\n\"老周，\"我问，\"那穿西装的，给马老板留联系方式没有？\"\n\n\"留了。\"老周说，\"一个传呼号。\"\n\n\"你抄下来了？\"\n\n老周嘿嘿一笑，又从本子里翻出一页：\"我哪能不抄。\"\n\n我低头看那一串数字，是沈阳本地的台。\n\n\"打电话了吗？\"\n\n\"我可不敢。\"老周摆手，\"兄弟，说句掏心窝子的，我觉出来这里头水深。你那批铁器，我一分钱没挣着——四千四百八十八，马老板给我留了二百辛苦钱，我都没敢要。\"\n\n\"那二百你收着吧。\"我说，\"辛苦是真的辛苦。\"\n\n老周搓了搓手，忽然又想起什么，一拍大腿。\n\n\"哎对了，还有个事儿，我犹豫一宿了，不知当讲不当讲。\"\n\n\"讲。\"\n\n\"就前儿个，我那店还关着门呢，来了个人。\"老周的声音又压下去半格，\"我没开门，他在外头敲了半天，隔着门缝跟我说了几句话，说完就走了。\"\n\n\"说什么？\"\n\n\"他说——\"老周咽了口唾沫，一字一顿地学：\n\n\"'回去告诉桓仁那个收古玩的小子，铁是死的，锅是活的。锅在哪儿，让他自己个儿掂量。'\"\n\n店里那盏绿罩台灯\"嗡\"地响了一声。\n\n我坐在那儿，后脊梁一寸一寸地凉上来。\n\n铁是死的。\n\n锅是活的。\n\n铁器没了就没了，那伙人根本不在乎——他们在乎的是那口锅。\n\n那口被两千年前的画匠特意留白的锅，被王长顺画在方格本上的锅，在鹰嘴沟的石室里倒扣着的锅。\n\n他们不但知道，而且知道**在我们手里出现过**。\n\n\"老周，\"我尽量让自己的声音听着平常，\"那人，长什么样？\"\n\n\"没看着脸，隔的门缝。\"老周挠了挠头，\"就瞧见个下巴，还有一只手——扶着门框。\"\n\n\"手什么样？\"\n\n\"就一般人手啊……\"老周忽然一激灵，\"哎，不对，我想起来了！那手的小拇指，短一截！\"\n\n我站起来。\n\n\"他的鞋。\"我又问，\"门口有泥没有？\"\n\n\"有啊，下过雨嘛。\"\n\n\"什么样的泥？\"\n\n老周眨巴着眼想了半天：\"黑的，油亮，还带着股子腥味儿——我当时还寻思，这大清早的，谁家杀鱼了。\"\n\n黑泥，腥味。\n\n五女山里的腐殖土，混着鹰嘴沟沟底那种黑泥浆，才是那个味儿。\n\n我走到门口，回头看老周。\n\n\"那张传呼号，借我看看。\"\n\n\"拿走拿走。\"老周大方地一挥手，随即又拉住我，\"兄弟，我这不是引狼入室了吧？我这小店，经不起折腾啊。\"\n\n我把本子揣进兜里，拍了拍他肩膀。\n\n\"老周，听我一句。\"\n\n\"你说。\"\n\n\"从今天起，你那个店，十天之内，什么生坑熟坑的货都别收。有人上门卖东西，你就说资金压着，周转不开。\"\n\n\"那我这买卖……\"\n\n\"买卖黄不了。\"我说，\"等这阵风头过去，我给你带个大买主。\"\n\n老周千恩万谢地把我送出门。\n\n我骑上三蹦子，没直接回据点，先在县城里绕了一大圈，确认后头没跟尾巴，才往五女山方向走。\n\n路过加油站的时候，我减了速。\n\n老鼠男的摊子支着，墨镜一排，\"开光土豆\"一筐，那两条红黑相间的飘带在雨后的风里轻轻摆着。\n\n他坐在小马扎上，尖嘴猴腮，眯着眼，冲我笑了。\n\n我也冲他笑了笑，没停，一脚油门走了。\n\n他在看我。\n\n从头到尾，他都在看着这条路上进进出出的人。\n\n而那个敲老周店门的人，缺了半截小拇指，鞋上沾着鹰嘴沟的黑泥——\n\n沟是王药根的地界，长顺是王药根的儿子，那伙外路人两年前就是从这条路上进山的。\n\n一路的线，全在往一个点上收。\n\n我摸出手机，拨了把头的号。\n\n响了两声，接了。\n\n\"把头，\"我说，\"铁器的事，有下文了。\"\n\n\"回来再说。\"\n\n电话那头的把头，声音听不出喜怒，可我跟着他这么多年，听得出那底下的分量。\n\n\"把头，还有个事。\"我放慢了车速，\"鱼哥昨儿夜里的话，您得让他说完。\"\n\n电话那头沉默了一会儿。\n\n\"云峰。\"\n\n\"在。\"\n\n\"你先回来看一样东西。\"把头说，\"小萱今早收拾鸭子笼的时候，在笼子底下的草垫子里，\"\n\n他停了一下。\n\n\"扫出来一样东西。\"", "words": 2918, "html": "<p>老周的店，重新开门了。<\/p>\n<p>门板上那张\"暂停营业几天\"的纸条撕了，撕得不干净，四角还留着白胶印。我到的时候是上午十点，他正蹲在门口拿小刀刮玻璃上的一块牛皮癣广告，见我来了，小刀一收，搓着手迎上来。<\/p>\n<p>\"兄弟，你可算来了，我这心里七上八下好几宿了。\"<\/p>\n<p>\"进去说。\"<\/p>\n<p>店里还是老样子，柜台后头那盏绿罩台灯，玻璃柜里摆着几串花钱和几个笔洗，多了一面锦旗，\"诚信经营\"，红字黄边。<\/p>\n<p>我坐下了，开门见山：\"铁器的事，从头到尾，给我过一遍。\"<\/p>\n<p>老周搬了个凳子坐我对面，掰着手指头讲。<\/p>\n<p>\"那天夜里，我开着面包车拉货去的沈阳，就你兄弟（指豆芽仔）跟着。到的是于洪区一家大废品站，姓马，马老板，我跟他做过几年废铜烂铁的生意，人可靠，嘴也严。\"<\/p>\n<p>\"过磅，一百六十多件，连灶台带釜，一共三吨二，按七毛一斤，收了四千四百八十块。钱是马老板当场给的现金。\"<\/p>\n<p>\"然后呢。\"<\/p>\n<p>\"然后我俩没走。\"老周的声音压下来，\"按你吩咐的，我俩在马路对面的小旅馆开了个房，趴窗户上瞅。\"<\/p>\n<p>\"瞅见什么了？\"<\/p>\n<p>\"瞅见邪门的了。\"<\/p>\n<p>他从抽屉里摸出一包烟，抽出一根点上，手有点抖。<\/p>\n<p>\"当天后半夜，三点来钟，那废品站来了辆车。绿色的北京吉普2020，跟吉普车斗上绑着铁锹——兄弟，就跟我上回跟你说的那伙收山货的一模一样的车！\"<\/p>\n<p>我心里一动。<\/p>\n<p>\"车牌呢？\"<\/p>\n<p>\"我记了。\"老周从柜台底下摸出个小本子，翻开，推给我。<\/p>\n<p>我低头看。<\/p>\n<p>辽P·55749。<\/p>\n<p>跟豆芽仔念给我的是同一个号。<\/p>\n<p>\"车上下来的两个人，一个穿棉猴儿的，一个穿旧西装的。穿西装那个跟马老板讲价，我离得远听不清，就看见马老板起先直摆手，后来那人从怀里掏出个信封，往磅秤上一拍。马老板捏了捏厚度，就点头了。\"<\/p>\n<p>\"多少钱？\"<\/p>\n<p>\"我第二天专门去问了。\"老周伸出三根手指，\"三万。\"<\/p>\n<p>\"三万二？\"<\/p>\n<p>\"三万，三千二都没给添，就整三万，一捆一捆的，全是旧票子。\"<\/p>\n<p>我算了笔账。<\/p>\n<p>四千四百八十块收的废铁，转手三万整收走，一夜之间，翻了六倍七。<\/p>\n<p>收破烂的都懂：废铁就是废铁，锈得再花也是废铁，没人会为一堆铁锅铁甑多掏两万五。<\/p>\n<p>除非他知道那不是废铁。<\/p>\n<p>\"东西装车了吗？\"<\/p>\n<p>\"装了。那个穿西装的还现场验货，一件一件拿手电照，专挑带锈花的。有件大铁甑，他翻过来照了半天锅底，又拿小刀在口沿上刮了刮，我瞅着他脸色不太好。\"<\/p>\n<p>刮了刮。<\/p>\n<p>我心里明白了七八分——那是我在普乐堡老屋连夜划掉族徽的那件。<\/p>\n<p>他没找到他要的东西。<\/p>\n<p>\"人长什么样？\"<\/p>\n<p>\"穿西装那个，五十来岁，白净，戴副平光眼镜，手指头干净得很，不像干力气活的。开车那个年轻些，全程没下车，就摇下车窗递烟。\"<\/p>\n<p>\"口音呢？\"<\/p>\n<p>\"说话冲，字字都往外砸。\"老周想了想，\"硬，不是咱们辽东的调儿，关外那边的。\"<\/p>\n<p>关外。<\/p>\n<p>包头、内蒙，还是辽西？<\/p>\n<p>\"他俩走的时候，\"老周把烟摁灭，凑近了半尺，声音低得像蚊子哼，\"穿西装那个回头问马老板一句话，马老板后来学给我听了。\"<\/p>\n<p>\"什么话？\"<\/p>\n<p>\"他问：'这两天，还有没有这样的货。'\"<\/p>\n<p>\"马老板怎么说？\"<\/p>\n<p>\"马老板说，废品站嘛，什么都可能来。\"老周咧了咧嘴，笑得比哭难看，\"那人就从怀里又掏出五百块，拍在柜台上，说：'这是定钱。往后再有带锈花的老铁器，不管多少，先给我留着，我加钱。'\"<\/p>\n<p>五千？<\/p>\n<p>不，五百。<\/p>\n<p>五百块定钱，买一个消息。<\/p>\n<p>这买卖做的，比我们行里人还门儿清。<\/p>\n<p>我坐在那儿，把这串事从头到尾捋了一遍。<\/p>\n<p>铁器当废铁进站，是我们故意洒出去的\"烟儿\"。烟儿刚落地，鱼就来了——不等天亮，带着现钱，直奔带锈花的老铁器。<\/p>\n<p>这不是撞上的。<\/p>\n<p>这是<strong>守着<\/strong>的。<\/p>\n<p>守着的意思是：他一直在等这批东西浮出水面。他知道桓仁出了高句丽早期的大货，他不知道货在谁手里、藏在哪，于是他就蹲在废品站——天下行里人销\"脏\"的老地方——等我们这种把货化整为零的人自己撞上来。<\/p>\n<p>\"老周，\"我问，\"那穿西装的，给马老板留联系方式没有？\"<\/p>\n<p>\"留了。\"老周说，\"一个传呼号。\"<\/p>\n<p>\"你抄下来了？\"<\/p>\n<p>老周嘿嘿一笑，又从本子里翻出一页：\"我哪能不抄。\"<\/p>\n<p>我低头看那一串数字，是沈阳本地的台。<\/p>\n<p>\"打电话了吗？\"<\/p>\n<p>\"我可不敢。\"老周摆手，\"兄弟，说句掏心窝子的，我觉出来这里头水深。你那批铁器，我一分钱没挣着——四千四百八十八，马老板给我留了二百辛苦钱，我都没敢要。\"<\/p>\n<p>\"那二百你收着吧。\"我说，\"辛苦是真的辛苦。\"<\/p>\n<p>老周搓了搓手，忽然又想起什么，一拍大腿。<\/p>\n<p>\"哎对了，还有个事儿，我犹豫一宿了，不知当讲不当讲。\"<\/p>\n<p>\"讲。\"<\/p>\n<p>\"就前儿个，我那店还关着门呢，来了个人。\"老周的声音又压下去半格，\"我没开门，他在外头敲了半天，隔着门缝跟我说了几句话，说完就走了。\"<\/p>\n<p>\"说什么？\"<\/p>\n<p>\"他说——\"老周咽了口唾沫，一字一顿地学：<\/p>\n<p>\"'回去告诉桓仁那个收古玩的小子，铁是死的，锅是活的。锅在哪儿，让他自己个儿掂量。'\"<\/p>\n<p>店里那盏绿罩台灯\"嗡\"地响了一声。<\/p>\n<p>我坐在那儿，后脊梁一寸一寸地凉上来。<\/p>\n<p>铁是死的。<\/p>\n<p>锅是活的。<\/p>\n<p>铁器没了就没了，那伙人根本不在乎——他们在乎的是那口锅。<\/p>\n<p>那口被两千年前的画匠特意留白的锅，被王长顺画在方格本上的锅，在鹰嘴沟的石室里倒扣着的锅。<\/p>\n<p>他们不但知道，而且知道<strong>在我们手里出现过<\/strong>。<\/p>\n<p>\"老周，\"我尽量让自己的声音听着平常，\"那人，长什么样？\"<\/p>\n<p>\"没看着脸，隔的门缝。\"老周挠了挠头，\"就瞧见个下巴，还有一只手——扶着门框。\"<\/p>\n<p>\"手什么样？\"<\/p>\n<p>\"就一般人手啊……\"老周忽然一激灵，\"哎，不对，我想起来了！那手的小拇指，短一截！\"<\/p>\n<p>我站起来。<\/p>\n<p>\"他的鞋。\"我又问，\"门口有泥没有？\"<\/p>\n<p>\"有啊，下过雨嘛。\"<\/p>\n<p>\"什么样的泥？\"<\/p>\n<p>老周眨巴着眼想了半天：\"黑的，油亮，还带着股子腥味儿——我当时还寻思，这大清早的，谁家杀鱼了。\"<\/p>\n<p>黑泥，腥味。<\/p>\n<p>五女山里的腐殖土，混着鹰嘴沟沟底那种黑泥浆，才是那个味儿。<\/p>\n<p>我走到门口，回头看老周。<\/p>\n<p>\"那张传呼号，借我看看。\"<\/p>\n<p>\"拿走拿走。\"老周大方地一挥手，随即又拉住我，\"兄弟，我这不是引狼入室了吧？我这小店，经不起折腾啊。\"<\/p>\n<p>我把本子揣进兜里，拍了拍他肩膀。<\/p>\n<p>\"老周，听我一句。\"<\/p>\n<p>\"你说。\"<\/p>\n<p>\"从今天起，你那个店，十天之内，什么生坑熟坑的货都别收。有人上门卖东西，你就说资金压着，周转不开。\"<\/p>\n<p>\"那我这买卖……\"<\/p>\n<p>\"买卖黄不了。\"我说，\"等这阵风头过去，我给你带个大买主。\"<\/p>\n<p>老周千恩万谢地把我送出门。<\/p>\n<p>我骑上三蹦子，没直接回据点，先在县城里绕了一大圈，确认后头没跟尾巴，才往五女山方向走。<\/p>\n<p>路过加油站的时候，我减了速。<\/p>\n<p>老鼠男的摊子支着，墨镜一排，\"开光土豆\"一筐，那两条红黑相间的飘带在雨后的风里轻轻摆着。<\/p>\n<p>他坐在小马扎上，尖嘴猴腮，眯着眼，冲我笑了。<\/p>\n<p>我也冲他笑了笑，没停，一脚油门走了。<\/p>\n<p>他在看我。<\/p>\n<p>从头到尾，他都在看着这条路上进进出出的人。<\/p>\n<p>而那个敲老周店门的人，缺了半截小拇指，鞋上沾着鹰嘴沟的黑泥——<\/p>\n<p>沟是王药根的地界，长顺是王药根的儿子，那伙外路人两年前就是从这条路上进山的。<\/p>\n<p>一路的线，全在往一个点上收。<\/p>\n<p>我摸出手机，拨了把头的号。<\/p>\n<p>响了两声，接了。<\/p>\n<p>\"把头，\"我说，\"铁器的事，有下文了。\"<\/p>\n<p>\"回来再说。\"<\/p>\n<p>电话那头的把头，声音听不出喜怒，可我跟着他这么多年，听得出那底下的分量。<\/p>\n<p>\"把头，还有个事。\"我放慢了车速，\"鱼哥昨儿夜里的话，您得让他说完。\"<\/p>\n<p>电话那头沉默了一会儿。<\/p>\n<p>\"云峰。\"<\/p>\n<p>\"在。\"<\/p>\n<p>\"你先回来看一样东西。\"把头说，\"小萱今早收拾鸭子笼的时候，在笼子底下的草垫子里，\"<\/p>\n<p>他停了一下。<\/p>\n<p>\"扫出来一样东西。\"<\/p>", "plain": "老周的店，重新开门了。 门板上那张\"暂停营业几天\"的纸条撕了，撕得不干净，四角还留着白胶印。我到的时候是上午十点，他正蹲在门口拿小刀刮玻璃上的一块牛皮癣广告，见我来了，小刀一收，搓着手迎上来。 \"兄弟，你可算来了，我这心里七上八下好几宿了。\" \"进去说。\" 店里还是老样子，柜台后头那盏绿罩台灯，玻璃柜里摆着几串花钱和几个笔洗，多了一面锦旗，\"诚信经营\"，红字黄边。 我坐下了，开门见山：\"铁器的事，从头到尾，给我过一遍。\" 老周搬了个凳子坐我对面，掰着手指头讲。 \"那天夜里，我开着面包车拉货去的沈阳，就你兄弟（指豆芽仔）跟着。到的是于洪区一家大废品站，姓马，马老板，我跟他做过几年废铜烂铁的生意，人可靠，嘴也严。\" \"过磅，一百六十多件，连灶台带釜，一共三吨二，按七毛一斤，收了四千四百八十块。钱是马老板当场给的现金。\" \"然后呢。\" \"然后我俩没走。\"老周的声音压下来，\"按你吩咐的，我俩在马路对面的小旅馆开了个房，趴窗户上瞅。\" \"瞅见什么了？\" \"瞅见邪门的了。\" 他从抽屉里摸出一包烟，抽出一根点上，手有点抖。 \"当天后半夜，三点来钟，那废品站来了辆车。绿色的北京吉普2020，跟吉普车斗上绑着铁锹——兄弟，就跟我上回跟你说的那伙收山货的一模一样的车！\" 我心里一动。 \"车牌呢？\" \"我记了。\"老周从柜台底下摸出个小本子，翻开，推给我。 我低头看。 辽P·55749。 跟豆芽仔念给我的是同一个号。 \"车上下来的两个人，一个穿棉猴儿的，一个穿旧西装的。穿西装那个跟马老板讲价，我离得远听不清，就看见马老板起先直摆手，后来那人从怀里掏出个信封，往磅秤上一拍。马老板捏了捏厚度，就点头了。\" \"多少钱？\" \"我第二天专门去问了。\"老周伸出三根手指，\"三万。\" \"三万二？\" \"三万，三千二都没给添，就整三万，一捆一捆的，全是旧票子。\" 我算了笔账。 四千四百八十块收的废铁，转手三万整收走，一夜之间，翻了六倍七。 收破烂的都懂：废铁就是废铁，锈得再花也是废铁，没人会为一堆铁锅铁甑多掏两万五。 除非他知道那不是废铁。 \"东西装车了吗？\" \"装了。那个穿西装的还现场验货，一件一件拿手电照，专挑带锈花的。有件大铁甑，他翻过来照了半天锅底，又拿小刀在口沿上刮了刮，我瞅着他脸色不太好。\" 刮了刮。 我心里明白了七八分——那是我在普乐堡老屋连夜划掉族徽的那件。 他没找到他要的东西。 \"人长什么样？\" \"穿西装那个，五十来岁，白净，戴副平光眼镜，手指头干净得很，不像干力气活的。开车那个年轻些，全程没下车，就摇下车窗递烟。\" \"口音呢？\" \"说话冲，字字都往外砸。\"老周想了想，\"硬，不是咱们辽东的调儿，关外那边的。\" 关外。 包头、内蒙，还是辽西？ \"他俩走的时候，\"老周把烟摁灭，凑近了半尺，声音低得像蚊子哼，\"穿西装那个回头问马老板一句话，马老板后来学给我听了。\" \"什么话？\" \"他问：'这两天，还有没有这样的货。'\" \"马老板怎么说？\" \"马老板说，废品站嘛，什么都可能 const $ = s => document.querySelector(s);
const KEY = 'bpdx_reader_v1';
let chapters = DATA.slice().sort((a,b)=> (a.arc<b.arc?-1:a.arc>b.arc?1:0) || a.num-b.num);
let cur = 0, hits = [];
const DEF = {theme:'light', fs:'18px', lh:'1.9', pw:'760px', ch:null, y:0, fold:false};
let S = Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY)||'{}'));
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function applySettings(){
  document.body.classList.toggle('toc-fold', !!S.fold);
  $('#fold').textContent = S.fold ? '⇥' : '⇤';
  document.documentElement.setAttribute('data-theme', S.theme);
  document.documentElement.style.setProperty('--fs', S.fs);
  document.documentElement.style.setProperty('--lh', S.lh);
  document.documentElement.style.setProperty('--pw', S.pw);
  $('#theme').textContent = S.theme==='dark' ? '☀️' : '🌙';
  $('#fs').value=S.fs; $('#lh').value=S.lh; $('#pw').value=S.pw;
}
$('#theme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';applySettings();save();};
$('#fs').onchange=e=>{S.fs=e.target.value;applySettings();save();};
$('#lh').onchange=e=>{S.lh=e.target.value;applySettings();save();};
$('#pw').onchange=e=>{S.pw=e.target.value;applySettings();save();};
$('#fold').onclick=()=>{S.fold=!S.fold;applySettings();save();};
$('#tocbtn').onclick=()=>document.body.classList.toggle('toc-open');
function renderToc(){
  $('#toclist').innerHTML = chapters.map((c,i)=>`<a href="#" data-i="${i}"><span style="color:var(--muted);font-size:13px;margin-right:6px">第${c.num}章</span>${c.title}</a>`).join('');
  $('#toclist').querySelectorAll('a').forEach(a=>{a.onclick=e=>{e.preventDefault();go(+a.dataset.i,true);document.body.classList.remove('toc-open');};});
  document.querySelectorAll('#toc a').forEach(a=>a.classList.toggle('on',+a.dataset.i===cur));
}
function render(){
  const c=chapters[cur];
  document.title=`第${c.num}章 ${c.title} · 北派续写`;
  $('#chapter').innerHTML=`<h2>第${c.num}章　${c.title}</h2><div class="meta">${c.id} · 约 ${c.words} 字 · [续写草稿 AI_HYPOTHESIS]</div>`+c.html;
  $('#prev').disabled=cur<=0; $('#next').disabled=cur>=chapters.length-1;
  renderToc();
  if(hits.length) highlight($('#q').value);
}
function go(i,top){cur=Math.max(0,Math.min(chapters.length-1,i));S.ch=chapters[cur].id;S.y=0;save();render();window.scrollTo(0,0);updateProg();}
$('#prev').onclick=()=>go(cur-1,true);
$('#next').onclick=()=>go(cur+1,true);
$('#fold').onclick=()=>{S.fold=!S.fold;applySettings();save();};
function updateProg(){const h=document.documentElement.scrollHeight-window.innerHeight;$('#prog').style.width=(h>0?(window.scrollY/h*100):0)+'%';}
window.addEventListener('scroll',()=>{updateProg();if(S.ch===chapters[cur].id){S.y=window.scrollY;save();}},{passive:true});
function clearMarks(){document.querySelectorAll('#chapter mark').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));$('#chapter').normalize();}
function highlight(q){clearMarks();q=(q||'').trim();if(!q)return;const root=$('#chapter');const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];let n;while(n=w.nextNode())ns.push(n);
ns.forEach(node=>{const idx=node.nodeValue.toLowerCase().indexOf(q.toLowerCase());if(idx<0)return;const f=document.createDocumentFragment();if(idx>0)f.appendChild(document.createTextNode(node.nodeValue.slice(0,idx)));
const mk=document.createElement('mark');mk.textContent=node.nodeValue.slice(idx,idx+q.length);f.appendChild(mk);if(idx+q.length<node.nodeValue.length)f.appendChild(document.createTextNode(node.nodeValue.slice(idx+q.length)));node.replaceWith(f);});
const first=root.querySelector('mark');if(first)first.scrollIntoView({block:'center'});}
let timer;
$('#q').oninput=e=>{clearTimeout(timer);const v=e.target.value;timer=setTimeout(()=>search(v),220);};
$('#q').onkeydown=e=>{if(e.key==='Escape'){e.target.value='';search('');e.target.blur();}};
function search(q){const box=$('#results');q=(q||'').trim();if(!q){box.style.display='none';hits=[];clearMarks();return;}
hits=[];chapters.forEach((c,i)=>{let idx=c.plain.toLowerCase().indexOf(q.toLowerCase());if(idx<0)return;
hits.push({i,title:`第${c.num}章 ${c.title}`,ctx:c.plain.slice(Math.max(0,idx-30),idx+q.length+40)});});
box.style.display='block';box.innerHTML=hits.length?hits.map((h,k)=>`<div class="r" data-k="${k}"><div class="rt">${h.title}</div><div class="rc">…${h.ctx.replace(/</g,'&lt;')}…</div></div>`).join(''):`<div class="empty">没有找到「${q.replace(/</g,'&lt;')}」</div>`;
box.querySelectorAll('.r').forEach(r=>{r.onclick=()=>{go(hits[+r.dataset.k].i,true);setTimeout(()=>highlight(q),30);};});}
document.addEventListener('keydown',e=>{if(/input|select|textarea/i.test(e.target.tagName))return;
if(e.key==='ArrowLeft')go(cur-1,true);if(e.key==='ArrowRight')go(cur+1,true);
if(e.key==='/'){e.preventDefault();$('#q').focus();}if(e.key==='t'||e.key==='T')$('#fold').click();});
applySettings();
let start=chapters.length-1;
if(S.ch){const k=chapters.findIndex(c=>c.id===S.ch);if(k>=0)start=k;}
cur=start;render();
if(S.ch===chapters[start].id&&S.y){window.scrollTo(0,S.y);}else{window.scrollTo(0,0);}
updateProg();
</script>
</body>
