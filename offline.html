*\n\n\"这第三份，\"把头把纸放平，\"当初立它，是为了堵道上的嘴。老丈是坐地户——有人见他跟外来的伙进山，若没这张纸兜底，往后谁都能往他头上扣一顶'挖绝户坟'的帽子。\"\n\n\"可这张纸上，一个字都没提山。\"\n\n\"提了山，还算什么兜底？\"把头说，\"给道上看的东西，从来不是给人看的——是给人躲的。躲的是山，护的是人。\"\n\n他顿了顿：\"老丈，你要退伙，我不拦你。可这份约不能撕，我也不能收。这第三张上头本就写着你王药根的名字——你往道上一亮，谁都知道：那桩'清运旧铁'的活儿办结了。办结，就是散伙。\"\n\n\"散伙？\"\n\n\"散伙。\"把头说，\"你干干净净地走，我们也干干净净地散。往后有人问王老丈认不认识那伙人，你说不认识；问那伙人去哪儿了，你说散了。白纸黑字，你理直气壮。\"\n\n王药根盯着那张纸，盯了很久。\n\n\"你要我把这张纸亮出去。\"他说，\"是想让道上的人都知道——那伙人，散了。\"\n\n把头没答。\n\n我看出来了。\n\n药根要退伙，把头应下的不是\"退\"，是借这一退，把这伙人从道上的眼睛里\"摘\"出去。飘带封了山门，草帽人问到了老周门上，缺指人守着废品站——所有人都在盯着我们。可要是\"这伙人已经散了\"呢？\n\n散了的伙，就不值得盯了。\n\n\"老丈。\"把头又说，\"你应得的，不是一文不要。该给的辛苦钱，我不会短你。往后你带着满意过你的日子，山里头的事——\"\n\n\"山里头的事，\"王药根接过话，\"跟我王药根，再没关系。\"\n\n他把那张第三份约仔仔细细折好，跟自己的那份并在一起，收进怀里。\n\n\"鸡呢？\"他忽然问。\n\n鱼哥把那只老避龙从布兜里抱出来，放到王药根手上。老头摸了摸它的冠子，又把它放回鱼哥手心。\n\n\"鸡你留着。\"他说，\"这畜生认你。魇着的时候，别点灯，别喊魂——把镜子压在胸口，让鸡蹲在你脚边，它镇得住。\"\n\n王药根站起身，走到门口又停下，回过头来看着我。\n\n\"云峰小友。\"\n\n\"大爷。\"\n\n\"我那老屋，后墙根底下埋着一坛子老酒，还有半口袋干蛇药。\"他说，\"你们要用，自己去刨，别跟外人说是我给的。\"\n\n\"记住了。\"\n\n\"还有——\"他张了张嘴，像是想说什么，最终只摆了摆手，\"罢了。走了。\"\n\n他迈出门槛的时候，正是黄昏，一步一步往院门口走。豆芽仔追了两步：\"老爷子，我送您！\"\n\n\"不用送。\"王药根头也没回，\"路我认得。我这辈子走的都是这条路。\"\n\n他走了。\n\n我看着他的背影消失在柞树林边上，忽然觉得，这个守了半辈子山的老人，像一座终于关上了门的庙。\n\n吃过晚饭，把头把我们都叫到堂屋。\n\n\"药根走了，飘带的风头也就过去了。\"他盘腿坐在炕上，慢条斯理地卷烟，\"可咱们的活儿，没完。\"\n\n豆芽仔问：\"头儿，那咱们下一步干啥？\"\n\n\"先把这处据点挪了。\"把头说，\"飘带能送到老屋，就能送到这儿。今儿夜里，东西收拾利索，明早咱们往雅河乡那头搬。\"\n\n\"雅河乡？\"我一愣，\"那不是那俩包头客住过的地界？\"\n\n\"最危险的地方，最没人查。\"把头说，\"那俩包头客住过的地方，道上的眼睛早扫过八百遍——扫过的地方，才干净。\"\n\n他卷好烟，点上，抽了一口。\n\n\"云峰。\"\n\n\"在。\"\n\n\"药根走了，这伙人散了。可'散'是对外头散的。\"他看着我，\"对内，还有一件事没办——那口空锅。\"\n\n我心里一跳。\n\n\"那口锅，还扣在石室里。\"\n\n\"对。\"把头说，\"它扣在那儿一天，那伙人就惦记一天，早晚有人抢在咱们前头。可这锅认主——阴契在你身上，你就是消奴部认下的当家人。别人碰它，它不跟人走。\"\n\n\"您的意思是——\"\n\n\"趁着眼下所有眼睛都盯着咱们'散伙'，你挑个夜里，一个人进沟，把那口锅请出来。\"把头说，\"带上镜子，带上那只鸡。请到锅，别走原路出沟——锅走正路，人走旁路。锅先藏好，人再露面。\"\n\n\"什么时候？\"\n\n\"三天后。\"把头把烟灰磕在炕沿上，\"等把门人的带子送到了，等道上'散伙'的话传开了，等沟口的眼睛都撤了——就是时候了。\"\n\n他抬起头，看着我，目光又沉又定：\n\n\"云峰，这一趟，就你一个人。\"\n\n夜里，我躺在炕上，翻来覆去睡不着。\n\n三天。\n\n三天后，我一个人进沟。\n\n那口空锅还在石室里等着。它底下压着的东西早被我取走了，可锅还在——它会认得我吗？\n\n电话是在后半夜响起来的。\n\n我摸黑抓起手机，是老周。\n\n\"兄弟！\"他的声音发紧，\"那个戴草帽的，又来了！\"\n\n\"他来做什么？\"\n\n\"他没进门，隔着门缝跟我说——\"老周咽了口唾沫，一字一顿地学，\"'回去告诉你们那个会尝土的年轻人：那口空锅，搬得动就快搬。搬不动，就别让人烧了。'\"\n\n电话那头，老周还在絮絮叨叨地说什么，我已经听不见了。\n\n窗户纸上透着一点灰白的天光。我把手机放下，看着窗外那片慢慢亮起来的柞树林，忽然想起王药根说过的那句话——\n\n山要收账。\n\n可这账，到底是向谁收的？", "words": 3386, "html": "<p>第二天一早，豆芽仔就把那根带子带了回来。<\/p>\n<p>他跑了一夜，眼圈青着，进门把一个塑料袋放在桌上，又从怀里掏出一张纸片：\"满意天没亮就让他舅接去宽甸他姨奶家了。这是那人留下的纸包皮，上头有字。\"<\/p>\n<p>王药根接过纸片，就着天光看了很久。<\/p>\n<p>纸皮上只有一行字，铅笔写的，笔画很硬：<\/p>\n<p>\"王老爷子收。货已验，人已出，山门从此关。\"<\/p>\n<p>\"货已验，人已出。\"我念了一遍，\"什么叫货已验？\"<\/p>\n<p>\"验的就是咱们。\"鱼哥靠在门框上，声音淡淡的，\"咱们从沟里出来，一个没少。他们把咱们当'货'数过了。\"<\/p>\n<p>我后脊梁一凉。<\/p>\n<p>那夜石室里有人掀锅、有人数锅——原来数的不是锅。<\/p>\n<p>是我们。<\/p>\n<p>王药根把纸片折好，收进怀里。他没提退伙的事，只把那根红黑带子平铺在桌上，抚平，用指腹一道一道地压过去。<\/p>\n<p>\"老辈人讲，\"他开口了，\"山里把门人传信，不用纸笔。红带子横送上门，是封门——山不让你进了；黑带子竖别门框，是请——山里头有人等你。\"<\/p>\n<p>\"横的送的是红的黑的？\"<\/p>\n<p>\"红黑一道儿，是封门里的死封。\"老头说，\"意思是：往后这座山，你连望都不许望一眼。\"<\/p>\n<p>\"封的是您？\"<\/p>\n<p>\"封的是咱们这几个从沟里出来的人。\"王药根抬起头，\"进去的可以，出来的不行——这是把门人几十年的规矩。我年轻时不信，只当是老古话。今儿知道了，那不是古话，是话。\"<\/p>\n<p>他顿了顿：\"咱们破了规矩。破了规矩的人，山要收账。\"<\/p>\n<p>屋里静了一瞬。<\/p>\n<p>小萱从里屋端了茶出来，给我们一人倒了一碗，又默默地退回里屋去了。<\/p>\n<p>\"老丈。\"把头开口，\"你打算怎么走？\"<\/p>\n<p>王药根从怀里摸出一样东西，放在桌上——一张折成四方块的黄纸，纸边磨得起毛，用红绳系着。<\/p>\n<p>那是他的那一份分金约。<\/p>\n<p>\"我这一份，在这儿。\"他说，\"今儿请你们诸位做个见证：我王药根，退伙。\"<\/p>\n<p>他说完，把红绳解开，将那张黄纸在桌上摊平。纸上的字，是把头的字。行里的约，从来不叫外人写。<\/p>\n<p>\"老丈。\"我忍不住开口，\"您想清楚——\"<\/p>\n<p>\"想清楚了。\"王药根打断我，\"我这辈子进过三回山。头一回，我自个儿回来，丢了半条命；第二回，我把儿子送进去，儿子再没出得来；第三回，是你把我领进去的——我见了我想见的东西，可我也惊动了把门人。\"<\/p>\n<p>他摩挲着那张约：\"头一回我年轻，不懂退；第二回我贪，不肯退。这第三回要是再不退，第四回，就该是满意替我进了。\"<\/p>\n<p>他把约推到桌子中间。<\/p>\n<p>\"我要退伙。这份约，请把头收回去。我应的分成，一文不要。\"<\/p>\n<p>豆芽仔张了张嘴，又闭上。鱼哥抱着膀子站在门口，没动。<\/p>\n<p>把头坐在上首，看着那张摊开的约，看了很久。<\/p>\n<p>\"老丈。\"他终于开口，\"约，我不能收。\"<\/p>\n<p>\"怎么？\"<\/p>\n<p>\"你的约在我这儿留着，你在道上才算'还有人管着'。\"把头说，\"我把约收了，你前脚出门，后脚就有人敢动你——一个没约没主的蛇花子，谁都敢捏一把。\"<\/p>\n<p>\"可是——\"<\/p>\n<p>\"可是你想干干净净地退。\"把头接口道，\"这行里，没有'退伙'这个说法。只有两种走法：一种是散伙，伙没了，约自然作废；另一种是——\"他顿了一下，\"办结。\"<\/p>\n<p>\"办结？\"<\/p>\n<p>把头站起身，从贴身夹袄的暗兜里摸出一张纸来。那纸比桌上的新，折成窄窄的长条，封皮上写着三个字——\"分金约\"。<\/p>\n<p>他把它放在桌上，压在王药根那张约的旁边。<\/p>\n<p>\"老丈，你还记得签约那天，我说过一句话么？\"<\/p>\n<p>\"你说，\"王药根看着那张纸，\"咱们这约，不是两份，是三份。第三张，是给道上看。\"<\/p>\n<p>\"对。\"把头说，\"就是这张。\"<\/p>\n<p>我心里一紧。<\/p>\n<p>两份约——你一份，我们一份。可这第三份，我从来没听他提起过。<\/p>\n<p>\"三份约，\"把头把那张长纸展开，\"头两份，是咱们自己看的，写的是真话：你应几成，我们应几成，私藏者三刀六洞。这第三份——\"<\/p>\n<p>他把它转过来，冲着我们，一字一字念道：<\/p>\n<p>\"'立约人：桓仁坐地户王药根。事由：代清运旧铁杂件一宗，工讫两讫，各不相欠。事讫人散，永不追讨。'\"<\/p>\n<p>我愣住了。<\/p>\n<p>没有分成，没有三刀六洞，没有山，没有沟，没有锅。<\/p>\n<p>通篇只有八个字是实的：<strong>事讫人散，永不追讨。<\/strong><\/p>\n<p>\"这第三份，\"把头把纸放平，\"当初立它，是为了堵道上的嘴。老丈是坐地户——有人见他跟外来的伙进山，若没这张纸兜底，往后谁都能往他头上扣一顶'挖绝户坟'的帽子。\"<\/p>\n<p>\"可这张纸上，一个字都没提山。\"<\/p>\n<p>\"提了山，还算什么兜底？\"把头说，\"给道上看的东西，从来不是给人看的——是给人躲的。躲的是山，护的是人。\"<\/p>\n<p>他顿了顿：\"老丈，你要退伙，我不拦你。可这份约不能撕，我也不能收。这第三张上头本就写着你王药根的名字——你往道上一亮，谁都知道：那桩'清运旧铁'的活儿办结了。办结，就是散伙。\"<\/p>\n<p>\"散伙？\"<\/p>\n<p>\"散伙。\"把头说，\"你干干净净地走，我们也干干净净地散。往后有人问王老丈认不认识那伙人，你说不认识；问那伙人去哪儿了，你说散了。白纸黑字，你理直气壮。\"<\/p>\n<p>王药根盯着那张纸，盯了很久。<\/p>\n<p>\"你要我把这张纸亮出去。\"他说，\"是想让道上的人都知道——那伙人，散了。\"<\/p>\n<p>把头没答。<\/p>\n<p>我看出来了。<\/p>\n<p>药根要退伙，把头应下的不是\"退\"，是借这一退，把这伙人从道上的眼睛里\"摘\"出去。飘带封了山门，草帽人问到了老周门上，缺指人守着废品站——所有人都在盯着我们。可要是\"这伙人已经散了\"呢？<\/p>\n<p>散了的伙，就不值得盯了。<\/p>\n<p>\"老丈。\"把头又说，\"你应得的，不是一文不要。该给的辛苦钱，我不会短你。往后你带着满意过你的日子，山里头的事——\"<\/p>\n<p>\"山里头的事，\"王药根接过话，\"跟我王药根，再没关系。\"<\/p>\n<p>他把那张第三份约仔仔细细折好，跟自己的那份并在一起，收进怀里。<\/p>\n<p>\"鸡呢？\"他忽然问。<\/p>\n<p>鱼哥把那只老避龙从布兜里抱出来，放到王药根手上。老头摸了摸它的冠子，又把它放回鱼哥手心。<\/p>\n<p>\"鸡你留着。\"他说，\"这畜生认你。魇着的时候，别点灯，别喊魂——把镜子压在胸口，让鸡蹲在你脚边，它镇得住。\"<\/p>\n<p>王药根站起身，走到门口又停下，回过头来看着我。<\/p>\n<p>\"云峰小友。\"<\/p>\n<p>\"大爷。\"<\/p>\n<p>\"我那老屋，后墙根底下埋着一坛子老酒，还有半口袋干蛇药。\"他说，\"你们要用，自己去刨，别跟外人说是我给的。\"<\/p>\n<p>\"记住了。\"<\/p>\n<p>\"还有——\"他张了张嘴，像是想说什么，最终只摆了摆手，\"罢了。走了。\"<\/p>\n<p>他迈出门槛的时候，正是黄昏，一步一步往院门口走。豆芽仔追了两步：\"老爷子，我送您！\"<\/p>\n<p>\"不用送。\"王药根头也没回，\"路我认得。我这辈子走的都是这条路。\"<\/p>\n<p>他走了。<\/p>\n<p>我看着他的背影消失在柞树林边上，忽然觉得，这个守了半辈子山的老人，像一座终于关上了门的庙。<\/p>\n<p>吃过晚饭，把头把我们都叫到堂屋。<\/p>\n<p>\"药根走了，飘带的风头也就过去了。\"他盘腿坐在炕上，慢条斯理地卷烟，\"可咱们的活儿，没完。\"<\/p>\n<p>豆芽仔问：\"头儿，那咱们下一步干啥？\"<\/p>\n<p>\"先把这处据点挪了。\"把头说，\"飘带能送到老屋，就能送到这儿。今儿夜里，东西收拾利索，明早咱们往雅河乡那头搬。\"<\/p>\n<p>\"雅河乡？\"我一愣，\"那不是那俩包头客住过的地界？\"<\/p>\n<p>\"最危险的地方，最没人查。\"把头说，\"那俩包头客住过的地方，道上的眼睛早扫过八百遍——扫过的地方，才干净。\"<\/p>\n<p>他卷好烟，点上，抽了一口。<\/p>\n<p>\"云峰。\"<\/p>\n<p>\"在。\"<\/p>\n<p>\"药根走了，这伙人散了。可'散'是对外头散的。\"他看着我，\"对内，还有一件事没办——那口空锅。\"<\/p>\n<p>我心里一跳。<\/p>\n<p>\"那口锅，还扣在石室里。\"<\/p>\n<p>\"对。\"把头说，\"它扣在那儿一天，那伙人就惦记一天，早晚有人抢在咱们前头。可这锅认主——阴契在你身上，你就是消奴部认下的当家人。别人碰它，它不跟人走。\"<\/p>\n<p>\"您的意思是——\"<\/p>\n<p>\"趁着眼下所有眼睛都盯着咱们'散伙'，你挑个夜里，一个人进沟，把那口锅请出来。\"把头说，\"带上镜子，带上那只鸡。请到锅，别走原路出沟——锅走正路，人走旁路。锅先藏好，人再露面。\"<\/p>\n<p>\"什么时候？\"<\/p>\n<p>\"三天后。\"把头把烟灰磕在炕沿上，\"等把门人的带子送到了，等道上'散伙'的话传开了，等沟口的眼睛都撤了——就是时候了。\"<\/p>\n<p>他抬起头，看着我，目光又沉又定：<\/p>\n<p>\"云峰，这一趟，就你一个人。\"<\/p>\n<p>夜里，我躺在炕上，翻来覆去睡不着。<\/p>\n<p>三天。<\/p>\n<p>三天后，我一个人进沟。<\/p>\n<p>那口空锅还在石室里等着。它底下压着的东西早被我取走了，可锅还在——它会认得我吗？<\/p>\n<p>电话是在后半夜响起来的。<\/p>\n<p>我摸黑抓起手机，是老周。<\/p>\n<p>\"兄弟！\"他的声音发紧，\"那个戴草帽的，又来了！\"<\/p>\n<p>\"他来做什么？\"<\/p>\n<p>\"他没进门，隔着门缝跟我说——\"老周咽了口唾沫，一字一顿地学，\"'回去告诉你们那个会尝土的年轻人：那口空锅，搬得动就快搬。搬不动，就别让人烧了。'\"<\/p>\n<p>电话那头，老周还在絮絮叨叨地说什么，我已经听不见了。<\/p>\n<p>窗户纸上透着一点灰白的天光。我把手机放下，看着窗外那片慢慢亮起来的柞树林，忽然想起王药根说过的那句话——<\/p>\n<p>山要收账。<\/p>\n<p>可这账，到底是向谁收的？<\/p>", "plain": "第二天一早，豆芽仔就把那根带子带了回来。 他跑了一夜，眼圈青着，进门把一个塑料袋放在桌上，又从怀里掏出一张纸片：\"满意天没亮就让他舅接去宽甸他姨奶家了。这是那人留下的纸包皮，上头有字。\" 王药根接过纸片，就着天光看了很久。 纸皮上只有一行字，铅笔写的，笔画很硬： \"王老爷子收。货已验，人已出，山门从此关。\" \"货已验，人已出。\"我念了一遍，\"什么叫货已验？\" \"验的就是咱们。\"鱼哥靠在门框上，声音淡淡的，\"咱们从沟里出来，一个没少。他们把咱们当'货'数过了。\" 我后脊梁一凉。 那夜石室里有人掀锅、有人数锅——原来数的不是锅。 是我们。 王药根把纸片折好，收进怀里。他没提退伙的事，只把那根红黑带子平铺在桌上，抚平，用指腹一道一道地压过去。 \"老辈人讲，\"他开口了，\"山里把门人传信，不用纸笔。红带子横送上门，是封门——山不让你进了；黑带子竖别门框，是请——山里头有人等你。\" \"横的送的是红的黑的？\" \"红黑一道儿，是封门里的死封。\"老头说，\"意思是：往后这座山，你连望都不许望一眼。\" \"封的是您？\" \"封的是咱们这几个从沟里出来的人。\"王药根抬起头，\"进去的可以，出来的不行——这是把门人几十年的规矩。我年轻时不信，只当是老古话。今儿知道了，那不是古话，是话。\" 他顿了顿：\"咱们破了规矩。破了规矩的人，山要收账。\" 屋里静了一瞬。 小萱从里屋端了茶出来，给我们一人倒了一碗，又默默地退回里屋去了。 \"老丈。\"把头开口，\"你打算怎么走？\" 王药根从怀里摸出一样东西，放在桌上——一张折成四方块的黄纸，纸边磨得起毛，用红绳系着。 那是他的那一份分金约。 \"我这一份，在这儿。\"他说，\"今儿请你们诸位做个见证：我王药根，退伙。\" 他说完，把红绳解开，将那张黄纸在桌上摊平。纸上的字，是把头的字。行里的约，从来不叫外人写。 \"老丈。\"我忍不住开口，\"您想清楚——\" \"想清楚了。\"王药根打断我，\"我这辈子进过三回山。头一回，我自个儿回来，丢了半条命；第二回，我把儿子送进去，儿子再没出得来；第三回，是你把我领进去的——我见了我想见的东西，可我也惊动了把门人。\" 他摩挲着那张约：\"头一回我年轻，不懂退；第二回我贪，不肯退。这第三回要是再不退，第四回，就该是满意替我进了。\" 他把约推到桌子中间。 \"我要退伙。这份约，请把头收回去。我应的分成，一文不要。\" 豆芽仔张了张嘴，又闭上。鱼哥抱着膀子站在门口，没动。 const $ = s => document.querySelector(s);
const KEY = 'bpdx_reader_v1';
let chapters = DATA.slice().sort((a,b)=> (a.arc<b.arc?-1:a.arc>b.arc?1:0) || a.num-b.num);
let cur = 0, hits = [];
const DEF = {theme:'light', fs:'18px', lh:'1.9', pw:'760px', ch:null, y:0, fold:false};
let S = Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY)||'{}'));
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function applySettings(){
  document.body.classList.toggle('toc-fold', !!S.fold);
  $('#fold').textContent = S.fold ? '⇥' : '⇤';
  document.documentElement.setAttribute('data-theme', S.theme);
  document.documentElement.style.setProperty('--fs', S.fs);
  document.documentElement.style.setProperty('--lh', S.lh);
  document.documentElement.style.setProperty('--pw', S.pw);
  $('#theme').textContent = S.theme==='dark' ? '☀️' : '🌙';
  $('#fs').value=S.fs; $('#lh').value=S.lh; $('#pw').value=S.pw;
}
$('#theme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';applySettings();save();};
$('#fs').onchange=e=>{S.fs=e.target.value;applySettings();save();};
$('#lh').onchange=e=>{S.lh=e.target.value;applySettings();save();};
$('#pw').onchange=e=>{S.pw=e.target.value;applySettings();save();};
$('#fold').onclick=()=>{S.fold=!S.fold;applySettings();save();};
$('#tocbtn').onclick=()=>document.body.classList.toggle('toc-open');
$('#backdrop').onclick=()=>document.body.classList.remove('toc-open');
function renderToc(){
  $('#toclist').innerHTML = chapters.map((c,i)=>`<a href="#" data-i="${i}"><span style="color:var(--muted);font-size:13px;margin-right:6px">第${c.num}章</span>${c.title}</a>`).join('');
  $('#toclist').querySelectorAll('a').forEach(a=>{a.onclick=e=>{e.preventDefault();go(+a.dataset.i,true);document.body.classList.remove('toc-open');};});
  document.querySelectorAll('#toc a').forEach(a=>a.classList.toggle('on',+a.dataset.i===cur));
}
function render(){
  const c=chapters[cur];
  document.title=`第${c.num}章 ${c.title} · 北派续写`;
  $('#chapter').innerHTML=`<h2>第${c.num}章　${c.title}</h2><div class="meta">${c.id} · 约 ${c.words} 字 · [续写草稿 AI_HYPOTHESIS]</div>`+c.html;
  $('#prev').disabled=cur<=0; $('#next').disabled=cur>=chapters.length-1;
  renderToc();
  if(hits.length) highlight($('#q').value);
}
function go(i,top){cur=Math.max(0,Math.min(chapters.length-1,i));S.ch=chapters[cur].id;S.y=0;save();render();window.scrollTo(0,0);updateProg();}
$('#prev').onclick=()=>go(cur-1,true);
$('#next').onclick=()=>go(cur+1,true);
$('#fold').onclick=()=>{S.fold=!S.fold;applySettings();save();};
function updateProg(){const h=document.documentElement.scrollHeight-window.innerHeight;$('#prog').style.width=(h>0?(window.scrollY/h*100):0)+'%';}
window.addEventListener('scroll',()=>{updateProg();if(S.ch===chapters[cur].id){S.y=window.scrollY;save();}},{passive:true});
function clearMarks(){document.querySelectorAll('#chapter mark').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));$('#chapter').normalize();}
function highlight(q){clearMarks();q=(q||'').trim();if(!q)return;const root=$('#chapter');const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];let n;while(n=w.nextNode())ns.push(n);
ns.forEach(node=>{const idx=node.nodeValue.toLowerCase().indexOf(q.toLowerCase());if(idx<0)return;const f=document.createDocumentFragment();if(idx>0)f.appendChild(document.createTextNode(node.nodeValue.slice(0,idx)));
const mk=document.createElement('mark');mk.textContent=node.nodeValue.slice(idx,idx+q.length);f.appendChild(mk);if(idx+q.length<node.nodeValue.length)f.appendChild(document.createTextNode(node.nodeValue.slice(idx+q.length)));node.replaceWith(f);});
const first=root.querySelector('mark');if(first)first.scrollIntoView({block:'center'});}
let timer;
$('#q').oninput=e=>{clearTimeout(timer);const v=e.target.value;timer=setTimeout(()=>search(v),220);};
$('#q').onkeydown=e=>{if(e.key==='Escape'){e.target.value='';search('');e.target.blur();}};
function search(q){const box=$('#results');q=(q||'').trim();if(!q){box.style.display='none';hits=[];clearMarks();return;}
hits=[];chapters.forEach((c,i)=>{let idx=c.plain.toLowerCase().indexOf(q.toLowerCase());if(idx<0)return;
hits.push({i,title:`第${c.num}章 ${c.title}`,ctx:c.plain.slice(Math.max(0,idx-30),idx+q.length+40)});});
box.style.display='block';box.innerHTML=hits.length?hits.map((h,k)=>`<div class="r" data-k="${k}"><div class="rt">${h.title}</div><div class="rc">…${h.ctx.replace(/</g,'&lt;')}…</div></div>`).join(''):`<div class="empty">没有找到「${q.replace(/</g,'&lt;')}」</div>`;
box.querySelectorAll('.r').forEach(r=>{r.onclick=()=>{go(hits[+r.dataset.k].i,true);setTimeout(()=>highlight(q),30);};});}
document.addEventListener('keydown',e=>{if(/input|select|textarea/i.test(e.target.tagName))return;
if(e.key==='ArrowLeft')go(cur-1,true);if(e.key==='ArrowRight')go(cur+1,true);
if(e.key==='/'){e.preventDefault();$('#q').focus();}if(e.key==='t'||e.key==='T')$('#fold').click();});
applySettings();
let start=chapters.length-1;
if(S.ch){const k=chapters.findIndex(c=>c.id===S.ch);if(k>=0)start=k;}
cur=start;render();
if(S.ch===chapters[start].id&&S.y){window.scrollTo(0,S.y);}else{window.scrollTo(0,0);}
updateProg();
</script>
</body>
</html>
