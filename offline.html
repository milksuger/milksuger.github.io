。\"他说，\"那就看契。\" 我把阴契掏出来。他捏着契的一角，对着斜下来的天光，翻来覆去地看，看得极慢。看到右下角，他停住了。 \"压的。\"他声音低了一点，\"这一道，是拿模子压的。\" \"跟镜背上的不一样。\"我说。 \"镜背是刻的，契角是压的。\"他说，\"刻的，是给明面上看的；压的，是给自家人认的。\" \"自家人？\" \"五部立誓那会儿，五件信，五部各拿一件。\"他把契还给我，\"明面上的纹，各不一样；压上去的这道鱼尾，是一模一样的。见了这道压纹，就是自家人。\" 我把镜子和契收好。 \"三件都是真的。\"他说，\"少了件罐。\" \"我上五女山那夜，见过一个问灯的老头。\"我说，\"灰褂子，白头发，缺了多半截左耳——\" \"缺耳？\"他打断我，\"左边还是右边？\" \"左边。\" 他没接话，只把契还我的那只手顿了顿，又收了回去。 \"他跟你说了什么？\" \"他说，他问的是'谁想点，想清没有'。\" \"这话像他说的。\"做信的人点点头，随即又把脸沉下去，\"可他不是我们家的。\" \"那是哪家的？\" \"我不知道。\"他说，\"做信的不点灯。点灯的、问灯的，是后来才分出去的。分出去以后，各走各的路，谁也不认谁。\" 这话说得含糊，可我听得心里发紧。做信、点灯、问灯，原是一家人，后来散了——这跟五部散伙，倒像一个道理。 \"罐在掌灯的手里。\"我说，\"前些日子，按约交出去了。\" \"我知道。\"他点点头，\"掌灯的手里那件，是我家散出去的头一件。\" 我没接话。 \"扣锅台台心那道记，\"他忽然说，\"是我留的。\" 我心里一跳，面上没动。 \"那晚我在台下。\"他说，\"你们三路都在台上，我不上去。等你们都走了，我上去，在印心划了一道。\" \"记什么？\" \"记锅。\"他说，\"我要看看，那口锅回没回来，有没有人认。\" \"您怎么知道我背的是那口锅？\" \"锅底当间有纹。\"他说，\"我划在印心，就是划在纹上。认得纹的人，才看得懂这道记。\" 我看着他。天光一点点暗下去，他半张脸埋进树影里。 \"三路人马，\"我说，\"点灯的，吹灯的，问灯的。您算哪一路？\" \"我不点灯，也不吹灯。\"他说，\"我只管信。信齐了，我认；信缺了，我不认。\" \"那您认我吗？\" 他没马上答。他把两手交叠着放在膝上，看着村口那条土路。 \"你认下的是消奴部的名分。\"他说，\"消奴部那件信，是一口空锅。锅是空的，契是无字的，连纹，都比别人少一道。\" \"为什么？\" \"因为消奴部的名分，早叫人抹了。\"他说，\"抹了名分的部，信也空着。这是祖上的规矩——名分没了，信就空着，等有人来认。\" \"所以锅是空的。\" \"对。\"他说，\"空锅不是没信，是信在等人。\" 我脑子里那些散了半年的东西，忽然一根一根串了起来。空锅、无字契、西南空位、第五盏没主的灯——绕来绕去，说的都是一件事：消奴部的名分空着，等一个人来按手印。 \"您找'认字的'，\"我说，\"就是来认这个名分的。\" \"我来验。\"他说，\"认不认，是你的事；信真不真，是我的事。\" 天彻底黑了。村口小卖部亮了灯，豆芽仔在门口晃来晃去，装作买烟。 \"灯会的事，你知道多少？\"我问。 \"不多。\"他说，\"我只知道，掌灯的要在灯会那天，把散出去的信都收回来。收回来，信才归位；信归位了，名分才明。\" \"收回去以后呢？\" \"收回去以后，信归谁，名分就归谁。\"他看着我，\"你手里有锅，有契，有镜。掌灯的手里有一件罐。还有一件，散在外头，谁也没拿着。\" \"哪一件？\" \"第五件。\"他说，\"那件信，五部里最要紧的一件。落在谁手里，我不知道。可灯会那天，它一定会出现。\" \"为什么一定会出现？\" \"因为缺一件，信就不齐。\"他站起来，拍了拍褂子上的灰，\"信不齐，山就不认账。点灯的、吹灯的、做信的，都白忙一场。\" \"您等了这么多年，\"我忍不住问，\"就为等信齐？\" \"我家等了三辈。\"他说，\"信是我家做出去的，散了，就得我家看着它一件件回来。这是祖上的账。\" \"这账，还了多少年了？\"我问。 \"从我爷爷的爷爷那辈起。\"他说，\"一茬人收一回，收不齐，就等下一茬。到我这辈，剩得已经不多了。\" \"剩几件？\" \"剩三件。\"他伸出手，比了个数，\"一件在掌灯的手里，一件在你身上，还有一件，不知去向。\" 我心里一沉。原来散出去的信，如今只剩三件还没归位。而这五件里，有两件，都跟我有关。我忽然觉得，怀里那三样东西，比背一口锅还沉。 他往村口外头走，走了两步，又停下。 \"还有一句，我送你。\"他回过头，\"掌灯的那根灯芯，你先别点。\" \"为什么？\" \"灯芯是干的。\"他说，\"点灯要油。油，不在你手里。\" 说完，他拐出村口，往黑里去了。 我坐在青石上，半天没动。 油不在我手里。 我把这句话翻来覆去地想。问灯的老头给了我灯芯，掌灯的草帽人掌着灯——灯芯、灯，都齐了，可灯要亮，还得有油。油在哪？ 我站起来，往村口小卖部走。豆芽仔迎上来，刚要开口，我先问了：\"把头呢？\" 豆芽仔往身后努了努嘴。 老槐树后头的暗影里，把头不知什么时候站到了那儿，烟头一明一灭。 \"都听见了。\"他说，\"回去吧。\" 回蜂房的路上，谁都没说话。走到半道，把头忽然开口。 \"第五件信，散在外头，谁也没拿着。\"他说，\"你想想，这半年，有一样东西，咱们见过，可谁也没往信上想过。\""}, {"id": "A5-090", "arc": "A5", "num": 90, "title": "灯期", "md": "回到蜂房，把头没睡。\n\n他把炕桌擦了，把匣子里的铜模和那张旧纸摊在桌上，又把自己那本记事的破本子翻到空白页，拿铅笔头一笔一笔地描。描的是纸上那串\"记\"——鱼尾、勾、缺口的圈，五个部，五个记。\n\n我给他倒了碗水，坐在对面。\n\n\"把头，您说第五件信，咱们见过。\"\n\n\"嗯。\"\n\n\"我想了一路。\"我掰着指头数，\"镜在我这儿，锅在我这儿，契也在我这儿，罐在掌灯的手里。这四件，都有主了。第五件，散在外头。\"\n\n\"你想岔了。\"把头把铅笔搁下，\"镜、锅、契、罐，这四件，是一件信，不是四件。\"\n\n我一愣。\n\n\"一个人身上，凑齐镜眼、罐口、锅肚、契名，才算立得住。\"他说，\"这是一套。一套信，认一个名分。可五部立誓那会儿，是五个部，五件信。\"\n\n\"那五件信是——\"\n\n\"一镜、一罐、一锅、一契。\"他把本子转过来给我看，\"这是一件。第五件，不是这套里的。\"\n\n我盯着那串\"记\"，脑子飞快地转。\n\n五部，五件信。可我见过的信物，翻来覆去，就是镜、罐、锅、契这几样。第五件是什么？\n\n\"咱们见过。\"把头又重复了一遍，声音很慢，\"沟里那口倒吊着的锅。\"\n\n我心里\"咯噔\"一下。\n\n鹰嘴石梁上那口倒吊着、滴黑泥、会领路的锅。进沟那夜，是它领着我们找着缝口的。出沟的时候，它叫一伙人截走了。这事过去半个多月，我几乎把它忘了。\n\n\"那口锅，会领路。\"把头说，\"会领路的锅，跟背在身上的锅，不是一回事。背着的锅认名分，领路的锅认路。\"\n\n\"认什么路？\"\n\n\"五部盟坛的路。\"他说，\"五口锅散在五处，摆成五方。光有锅不成，还得有人领路，把锅摆到该摆的位子上去。那口会领路的锅，就是领路的那一件。\"\n\n我后脊背一凉。\n\n\"它叫人截走了。\"\n\n\"对。\"把头把水喝了一口，\"截走它的，不一定是灭字那一路，也不一定是掌灯的。谁拿着那口锅，谁就拿着进盟坛的图。\"\n\n图。\n\n我一下子明白这个\"图\"字的分量。半年来我们东一头西一头，进沟、取锅、上五女山、认账，绕来绕去，其实一直在找的，就是一张\"图\"——哪儿是五个位子，哪一位空着，锅怎么摆。\n\n\"锅是死的，可领路的锅，是活的。\"我说，\"它自己会走。\"\n\n\"所以它最难拿。\"把头点点头，\"你在手里攥着它，它未必听你的；它想走，谁也拦不住。\"\n\n\"那它会走到哪去？\"\n\n\"走到该领路的地方去。\"把头说，\"五月灯会，五口锅要归位。它就得先到。\"\n\n我低头看那张旧纸。五口锅摆成五方，西南空着一格。领路的锅，是这五口里的哪一口？还是说，它是第六口，专门跑腿的？\n\n这话我没问出口。把头也没往下说。有些东西，问急了反而散。\n\n我起身去了偏屋。锅搁在土坑里，上头盖着草席，草席上又压了两块土坯。我掀开一角，伸手摸了摸锅底。那圈鱼尾纹凉丝丝的，指头顺着纹路划过去，一深一浅，跟镜背上的分毫不差。\n\n我把草席重新盖好，压上土坯，拍了拍手上的土。\n\n做信的说，空锅不是没信，是信在等人。可它等了这么久，等到的是一个背锅的，不是个立誓的。这话搁在心里，压得人喘不上气。\n\n我回到正屋，把头已经把本子收好了，正坐在炕沿上卷烟。\n\n\"把头，\"我说，\"灯会那天，咱们到底去不去？\"\n\n他没马上答。烟卷好了，点着，抽了一口，才慢慢说：\"去不去，不由咱们。\"\n\n屋里静了一阵。炕桌上的灯芯在油盏里烧着，火苗小小的。\n\n\"灯会那天，第五件信一定会出现。\"我把那外乡人的话又想起来，\"缺一件，信就不齐，山就不认账。\"\n\n\"这话不假。\"把头说，\"可你想想，谁最不想让信齐？\"\n\n\"吹灯的。\"\n\n\"谁最想？\"\n\n\"掌灯的。\"\n\n\"那问灯的呢？\"\n\n我想了想。问灯的老头说过，他问的是\"谁想点，想清没有\"。他要的不是信齐，是名分明。\n\n\"三路都要灯会。\"把头说，\"点灯的要把信收回去，吹灯的要趁乱把信毁了，问灯的要看谁的名分站得住。灯会那天，这山里就热闹了。\"\n\n\"咱们算哪一路？\"\n\n\"咱们哪一路都不算。\"把头把本子合上，\"咱们是背锅的。锅在谁身上，谁就是靶子。\"\n\n他把本子揣进怀里。\n\n\"什么时候？\"我问，\"五月节，还剩几天？\"\n\n\"今天是四月廿五。\"把头算了算，\"按老例，五月初五端午。差十天。\"\n\n十天。\n\n十天之内，散在外头的信要一件一件收回来：罐在掌灯的手里，第五件在不知谁手里，锅、契、镜在我身上。还有那口领路的锅，至今下落不明。\n\n\"十天。\"我把这两个字念了一遍，觉得胸口发闷。\n\n\"怕了？\"\n\n\"不是怕。\"我说，\"是觉得，这十天里，总得有人先动手。\"\n\n\"已经动手了。\"把头站起来，往门口走，\"你没发现？这半个月，来雅河乡打听蜂房的，来桓仁找'认字的'，一个接一个。人家早就在找门了。\"\n\n他推开门，往院子里看了一眼。夜里的蜂房，黑得只剩几只空箱子的轮廓。\n\n\"明天起，锅挪回偏屋土坑，契你贴身带着，镜不许离身。\"他说，\"白天别出村，夜里有人来，先看脚，别看脸。\"\n\n\"看脚？\"\n\n\"人走路，脚不会装。\"把头说，\"来的是生人，脚底下没根；来的是熟人，落脚就重。\"\n\n\"豆芽仔，\"他转向豆芽仔，\"你明天回桓仁，盯着老周那间铺子。谁来买罐子、谁来打听纹，你都记下来。\"\n\n\"记下来给谁？\"\n\n\"给你自己。\"把头说，\"记满一页，再来找我。\"\n\n小萱端着一盏灯从里屋出来，把灯搁在窗台上，屋里亮堂了些。她这些天话更少了，做什么都轻手轻脚，像是怕惊着谁。\n\n\"哥，\"她低声说，\"你们……还要走？\"\n\n\"走一趟桓仁。\"我说，\"不出十天就回。\"\n\n她点点头，没再问。转身回屋的时候，我看见她袖口那块补丁，针脚歪歪扭扭的——是她自己缝的，跟匣子里那张纸上的\"细针脚\"，是两回事。\n\n我把这事记在心里，没声张。\n\n\"鱼哥呢？\"我忽然想起。\n\n\"在偏屋。\"把头说，\"今儿后晌睡了一觉，醒了就坐在那儿发呆。\"\n\n我走到偏屋门口。鱼哥正坐在炕沿上，怀里抱着那只黑鸡，眼睛直勾勾的，像是没睡醒。\n\n\"鱼哥，\"我说，\"你梦着啥了？\"\n\n他半天才回过神，摇摇头：\"没梦着什么。就梦见一口锅，在山上跑。\"\n\n\"跑哪儿去？\"\n\n\"没看清。\"他把黑鸡往怀里搂了搂，\"我在后头追，追着追着，锅自己翻过来，扣地上了。掀开一看，底下是空的。\"\n\n我心里一动，没接话。他自己笑了笑，也没再说。\n\n我回屋的时候，豆芽仔正从院外进来，走得急，鞋上全是土。\n\n\"哥，\"他喘着气，\"桓仁那边有信。\"\n\n\"什么信？\"\n\n\"马渡霜回店了。\"他说，\"她没露面，托隔壁的人给咱们带了句话。\"\n\n我心里一动。马渡霜的店关了小半个月，留话\"别接灯\"，人就没影了。这会儿回来，不是小事。\n\n\"她说啥？\"\n\n豆芽仔看了把头一眼，才压低声音说：\"她说——'五月那场灯，别赶。灯亮一盏，走一个人。'\"\n\n\"这句话，她上回也说过。\"我说。\n\n\"上回是留话，这回是回来当面说。\"把头把烟头按灭，\"留话的时候，她可以装糊涂；回来了还这么说，就是真怕了。\"\n\n马渡霜的店，在桓仁开了多少年，从没关过这么久。她这一回来就带这句话，说明五月那场灯，比我们想的还要紧。\n\n\"她怕什么？\"\n\n\"怕灯亮。\"把头说，\"灯一亮，名分就过明路。过明路的东西，藏不住。\"\n\n把头站在门口，没回头。烟在他指间烧着，一明一灭。\n\n半晌，他才说了一句：\"明天进桓仁，我去见她。\"\n\n我看着院子里那几只空蜂箱，忽然觉得，这十天，怕是要一天掰成两天过了。\n\n夜里起了风，几只空蜂箱被吹得嗡嗡响，像还有蜂在里头。我躺在炕上，睁着眼，一直听到后半夜。", "words": 2831, "html": "<p>回到蜂房，把头没睡。<\/p>\n<p>他把炕桌擦了，把匣子里的铜模和那张旧纸摊在桌上，又把自己那本记事的破本子翻到空白页，拿铅笔头一笔一笔地描。描的是纸上那串\"记\"——鱼尾、勾、缺口的圈，五个部，五个记。<\/p>\n<p>我给他倒了碗水，坐在对面。<\/p>\n<p>\"把头，您说第五件信，咱们见过。\"<\/p>\n<p>\"嗯。\"<\/p>\n<p>\"我想了一路。\"我掰着指头数，\"镜在我这儿，锅在我这儿，契也在我这儿，罐在掌灯的手里。这四件，都有主了。第五件，散在外头。\"<\/p>\n<p>\"你想岔了。\"把头把铅笔搁下，\"镜、锅、契、罐，这四件，是一件信，不是四件。\"<\/p>\n<p>我一愣。<\/p>\n<p>\"一个人身上，凑齐镜眼、罐口、锅肚、契名，才算立得住。\"他说，\"这是一套。一套信，认一个名分。可五部立誓那会儿，是五个部，五件信。\"<\/p>\n<p>\"那五件信是——\"<\/p>\n<p>\"一镜、一罐、一锅、一契。\"他把本子转过来给我看，\"这是一件。第五件，不是这套里的。\"<\/p>\n<p>我盯着那串\"记\"，脑子飞快地转。<\/p>\n<p>五部，五件信。可我见过的信物，翻来覆去，就是镜、罐、锅、契这几样。第五件是什么？<\/p>\n<p>\"咱们见过。\"把头又重复了一遍，声音很慢，\"沟里那口倒吊着的锅。\"<\/p>\n<p>我心里\"咯噔\"一下。<\/p>\n<p>鹰嘴石梁上那口倒吊着、滴黑泥、会领路的锅。进沟那夜，是它领着我们找着缝口的。出沟的时候，它叫一伙人截走了。这事过去半个多月，我几乎把它忘了。<\/p>\n<p>\"那口锅，会领路。\"把头说，\"会领路的锅，跟背在身上的锅，不是一回事。背着的锅认名分，领路的锅认路。\"<\/p>\n<p>\"认什么路？\"<\/p>\n<p>\"五部盟坛的路。\"他说，\"五口锅散在五处，摆成五方。光有锅不成，还得有人领路，把锅摆到该摆的位子上去。那口会领路的锅，就是领路的那一件。\"<\/p>\n<p>我后脊背一凉。<\/p>\n<p>\"它叫人截走了。\"<\/p>\n<p>\"对。\"把头把水喝了一口，\"截走它的，不一定是灭字那一路，也不一定是掌灯的。谁拿着那口锅，谁就拿着进盟坛的图。\"<\/p>\n<p>图。<\/p>\n<p>我一下子明白这个\"图\"字的分量。半年来我们东一头西一头，进沟、取锅、上五女山、认账，绕来绕去，其实一直在找的，就是一张\"图\"——哪儿是五个位子，哪一位空着，锅怎么摆。<\/p>\n<p>\"锅是死的，可领路的锅，是活的。\"我说，\"它自己会走。\"<\/p>\n<p>\"所以它最难拿。\"把头点点头，\"你在手里攥着它，它未必听你的；它想走，谁也拦不住。\"<\/p>\n<p>\"那它会走到哪去？\"<\/p>\n<p>\"走到该领路的地方去。\"把头说，\"五月灯会，五口锅要归位。它就得先到。\"<\/p>\n<p>我低头看那张旧纸。五口锅摆成五方，西南空着一格。领路的锅，是这五口里的哪一口？还是说，它是第六口，专门跑腿的？<\/p>\n<p>这话我没问出口。把头也没往下说。有些东西，问急了反而散。<\/p>\n<p>我起身去了偏屋。锅搁在土坑里，上头盖着草席，草席上又压了两块土坯。我掀开一角，伸手摸了摸锅底。那圈鱼尾纹凉丝丝的，指头顺着纹路划过去，一深一浅，跟镜背上的分毫不差。<\/p>\n<p>我把草席重新盖好，压上土坯，拍了拍手上的土。<\/p>\n<p>做信的说，空锅不是没信，是信在等人。可它等了这么久，等到的是一个背锅的，不是个立誓的。这话搁在心里，压得人喘不上气。<\/p>\n<p>我回到正屋，把头已经把本子收好了，正坐在炕沿上卷烟。<\/p>\n<p>\"把头，\"我说，\"灯会那天，咱们到底去不去？\"<\/p>\n<p>他没马上答。烟卷好了，点着，抽了一口，才慢慢说：\"去不去，不由咱们。\"<\/p>\n<p>屋里静了一阵。炕桌上的灯芯在油盏里烧着，火苗小小的。<\/p>\n<p>\"灯会那天，第五件信一定会出现。\"我把那外乡人的话又想起来，\"缺一件，信就不齐，山就不认账。\"<\/p>\n<p>\"这话不假。\"把头说，\"可你想想，谁最不想让信齐？\"<\/p>\n<p>\"吹灯的。\"<\/p>\n<p>\"谁最想？\"<\/p>\n<p>\"掌灯的。\"<\/p>\n<p>\"那问灯的呢？\"<\/p>\n<p>我想了想。问灯的老头说过，他问的是\"谁想点，想清没有\"。他要的不是信齐，是名分明。<\/p>\n<p>\"三路都要灯会。\"把头说，\"点灯的要把信收回去，吹灯的要趁乱把信毁了，问灯的要看谁的名分站得住。灯会那天，这山里就热闹了。\"<\/p>\n<p>\"咱们算哪一路？\"<\/p>\n<p>\"咱们哪一路都不算。\"把头把本子合上，\"咱们是背锅的。锅在谁身上，谁就是靶子。\"<\/p>\n<p>他把本子揣进怀里。<\/p>\n<p>\"什么时候？\"我问，\"五月节，还剩几天？\"<\/p>\n<p>\"今天是四月廿五。\"把头算了算，\"按老例，五月初五端午。差十天。\"<\/p>\n<p>十天。<\/p>\n<p>十天之内，散在外头的信要一件一件收回来：罐在掌灯的手里，第五件在不知谁手里，锅、契、镜在我身上。还有那口领路的锅，至今下落不明。<\/p>\n<p>\"十天。\"我把这两个字念了一遍，觉得胸口发闷。<\/p>\n<p>\"怕了？\"<\/p>\n<p>\"不是怕。\"我说，\"是觉得，这十天里，总得有人先动手。\"<\/p>\n<p>\"已经动手了。\"把头站起来，往门口走，\"你没发现？这半个月，来雅河乡打听蜂房的，来桓仁找'认字的'，一个接一个。人家早就在找门了。\"<\/p>\n<p>他推开门，往院子里看了一眼。夜里的蜂房，黑得只剩几只空箱子的轮廓。<\/p>\n<p>\"明天起，锅挪回偏屋土坑，契你贴身带着，镜不许离身。\"他说，\"白天别出村，夜里有人来，先看脚，别看脸。\"<\/p>\n<p>\"看脚？\"<\/p>\n<p>\"人走路，脚不会装。\"把头说，\"来的是生人，脚底下没根；来的是熟人，落脚就重。\"<\/p>\n<p>\"豆芽仔，\"他转向豆芽仔，\"你明天回桓仁，盯着老周那间铺子。谁来买罐子、谁来打听纹，你都记下来。\"<\/p>\n<p>\"记下来给谁？\"<\/p>\n<p>\"给你自己。\"把头说，\"记满一页，再来找我。\"<\/p>\n<p>小萱端着一盏灯从里屋出来，把灯搁在窗台上，屋里亮堂了些。她这些天话更少了，做什么都轻手轻脚，像是怕惊着谁。<\/p>\n<p>\"哥，\"她低声说，\"你们……还要走？\"<\/p>\n<p>\"走一趟桓仁。\"我说，\"不出十天就回。\"<\/p>\n<p>她点点头，没再问。转身回屋的时候，我看见她袖口那块补丁，针脚歪歪扭扭的——是她自己缝的，跟匣子里那张纸上的\"细针脚\"，是两回事。<\/p>\n<p>我把这事记在心里，没声张。<\/p>\n<p>\"鱼哥呢？\"我忽然想起。<\/p>\n<p>\"在偏屋。\"把头说，\"今儿后晌睡了一觉，醒了就坐在那儿发呆。\"<\/p>\n<p>我走到偏屋门口。鱼哥正坐在炕沿上，怀里抱着那只黑鸡，眼睛直勾勾的，像是没睡醒。<\/p>\n<p>\"鱼哥，\"我说，\"你梦着啥了？\"<\/p>\n<p>他半天才回过神，摇摇头：\"没梦着什么。就梦见一口锅，在山上跑。\"<\/p>\n<p>\"跑哪儿去？\"<\/p>\n<p>\"没看清。\"他把黑鸡往怀里搂了搂，\"我在后头追，追着追着，锅自己翻过来，扣地上了。掀开一看，底下是空的。\"<\/p>\n<p>我心里一动，没接话。他自己笑了笑，也没再说。<\/p>\n<p>我回屋的时候，豆芽仔正从院外进来，走得急，鞋上全是土。<\/p>\n<p>\"哥，\"他喘着气，\"桓仁那边有信。\"<\/p>\n<p>\"什么信？\"<\/p>\n<p>\"马渡霜回店了。\"他说，\"她没露面，托隔壁的人给咱们带了句话。\"<\/p>\n<p>我心里一动。马渡霜的店关了小半个月，留话\"别接灯\"，人就没影了。这会儿回来，不是小事。<\/p>\n<p>\"她说啥？\"<\/p>\n<p>豆芽仔看了把头一眼，才压低声音说：\"她说——'五月那场灯，别赶。灯亮一盏，走一个人。'\"<\/p>\n<p>\"这句话，她上回也说过。\"我说。<\/p>\n<p>\"上回是留话，这回是回来当面说。\"把头把烟头按灭，\"留话的时候，她可以装糊涂；回来了还这么说，就是真怕了。\"<\/p>\n<p>马渡霜的店，在桓仁开了多少年，从没关过这么久。她这一回来就带这句话，说明五月那场灯，比我们想的还要紧。<\/p>\n<p>\"她怕什么？\"<\/p>\n<p>\"怕灯亮。\"把头说，\"灯一亮，名分就过明路。过明路的东西，藏不住。\"<\/p>\n<p>把头站在门口，没回头。烟在他指间烧着，一明一灭。<\/p>\n<p>半晌，他才说了一句：\"明天进桓仁，我去见她。\"<\/p>\n<p>我看着院子里那几只空蜂箱，忽然觉得，这十天，怕是要一天掰成两天过了。<\/p>\n<p>夜里起了风，几只空蜂箱被吹得嗡嗡响，像还有蜂在里头。我躺在炕上，睁着眼，一直听到后半夜。<\/p>", "plain": "回到蜂房，把头没睡。 他把炕桌擦了，把匣子里的铜模和那张旧纸摊在桌上，又把自己那本记事的破本子翻到空白页，拿铅笔头一笔一笔地描。描的是纸上那串\"记\"——鱼尾、勾、缺口的圈，五个部，五个记。 我给他倒了碗水，坐在对面。 \"把头，您说第五件信，咱们见过。\" \"嗯。\" \"我想了一路。\"我掰着指头数，\"镜在我这儿，锅在我这儿，契也在我这儿，罐在掌灯的手里。这四件，都有主了。第五件，散在外头。\" \"你想岔了。\"把头把铅笔搁下，\"镜、锅、契、罐，这四件，是一件信，不是四件。\" 我一愣。 \"一个人身上，凑齐镜眼、罐口、锅肚、契名，才算立得住。\"他说，\"这是一套。一套信，认一个名分。可五部立誓那会儿，是五个部，五件信。\" \"那五件信是——\" \"一镜、一罐、一锅、一契。\"他把本子转过来给我看，\"这是一件。第五件，不是这套里的。\" 我盯着那串\"记\"，脑子飞快地转。 五部，五件信。可我见过的信物，翻来覆去，就是镜、罐、锅、契这几样。第五件是什么？ \"咱们见过。\"把头又重复了一遍，声音很慢，\"沟里那口倒吊着的锅。\" 我心里\"咯噔\"一下。 鹰嘴石梁上那口倒吊着、滴黑泥、会领路的锅。进沟那夜，是它领着我们找着缝口的。出沟的时候，它叫一伙人截走了。这事过去半个多月，我几乎把它忘了。 \"那口锅，会领路。\"把头说，\"会领路的锅，跟背在身上的锅，不是一回事。背着的锅认名分，领路的锅认路。\" \"认什么路？\" \"五部盟坛的路。\"他说，\"五口锅散在五处，摆成五方。光有锅不成，还得有人领路，把锅摆到该摆的位子上去。那口会领路的锅，就是领路的那一件。\" 我后脊背一凉。 \"它叫人截走了。\" \"对。\"把头把水喝了一口，\"截走它的，不一定是灭字那一路，也不一定是掌灯的。谁拿着那口锅，谁就拿着进盟坛的图。\" 图。 我一下子明白这个\"图\"字的分量。半年来我们东一头西一头，进沟、取锅、上五女山、认账，绕来绕去，其实一直在找的，就是一张\"图\"——哪儿是五个位子，哪一位空着，锅怎么摆。 \"锅是死的，可领路的锅，是活的。\"我说，\"它自己会走。\" \"所以它最难拿。\"把头点点头，\"你在手里攥着它，它未必听你的；它想走，谁也拦不住。\" \"那它会走到哪去？\" \"走到该领路的地方去。\"把头说，\"五月灯会，五口锅要归位。它就得先到。\" 我低头看那张旧纸。五口锅摆成五方，西南空着一格。领路的锅，是这五口里的哪一口？还是说，它是第六口，专门跑腿的？ 这话我没问出口。把头也没往下说。有些东西，问急了反而散。 我起身去了偏屋。锅搁在土坑里，上头盖着草席，草席上又压了两块土坯。我掀开一角，伸手摸了摸锅底。那圈鱼尾纹凉丝丝的，指头顺着纹路划过去，一深一浅，跟镜背上的分毫不差。 我把草席重新盖好，压上土坯，拍了拍手上的土。 做信的说，空锅不是没信，是信在等人。可它等了这么久，等到的是一个背锅的，不是个立誓的。这话搁在心里，压得人喘不上气。 我回到正屋，把头已经把本子收好了，正坐在炕沿上卷烟。 \"把头，\"我说，\"灯会那天，咱们到底去不去？\" 他没马上答。烟卷好了，点着，抽了一口，才慢慢说：\"去不去，不由咱们。\" 屋里静了一阵。炕桌上的灯芯在油盏里烧着，火苗小小的。 \"灯会那天，第五件信一定会出现。\"我把那外乡人的话又想起来，\"缺一件，信就不齐，山就不认账。\" \"这话不假。\"把头说，\"可你想想，谁最不想让信齐？\" \"吹灯的。\" \"谁最想？\" \"掌灯的。\" \"那问灯的呢？\" 我想了想。问灯的老头说过，他问的是\"谁想点，想清没有\"。他要的不是信齐，是名分明。 \"三路都要灯会。\"把头说，\"点灯的要把信收回去，吹灯的要趁乱把信毁了，问灯的要看谁的名分站得住。灯会那天，这山里就热闹了。\" \"咱们算哪一路？\" \"咱们哪一路都不算。\"把头把本子合上，\"咱们是背锅的。锅在谁身上，谁就是靶子。\" 他把本子揣进怀里。 \"什么时候？\"我问，\"五月节，还剩几天？\" \"今天是四月廿五。\"把头算了算，\"按老例，五月初五端午。差十天。\" 十天。 十天之内，散在外头的信要一件一件收回来：罐在掌灯的手里，第五件在不知谁手里，锅、契、镜在我身上。还有那口领路的锅，至今下落不明。 \"十天。\"我把这两个字念了一遍，觉得胸口发闷。 \"怕了？\" \"不是怕。\"我说，\"是觉得，这十天里，总得有人先动手。\" \"已经动手了。\"把头站起来，往门口走，\"你没发现？这半个月，来雅河乡打听蜂房的，来桓仁找'认字的'，一个接一个。人家早就在找门了。\" 他推开门，往院子里看了一眼。夜里的蜂房，黑得只剩几只空箱子的轮廓。 \"明天起，锅挪回偏屋土坑，契你贴身带着，镜不许离身。\"他说，\"白天别出村，夜里有人来，先看脚，别看脸。\" \"看脚？\" \"人走路，脚不会装。\"把头说，\"来的是生人，脚底下没根；来的是熟人，落脚就重。\" \"豆芽仔，\"他转向豆芽仔，\"你明天回桓仁，盯着老周那间铺子。谁来买罐子、谁来打听纹，你都记下来。\" \"记下来给谁？\" \"给你自己。\"把头说，\"记满一页，再来找我。\" 小萱端着一盏灯从里屋出来，把灯搁在窗台上，屋里亮堂了些。她这些天话更少了，做什么都轻手轻脚，像是怕惊着谁。 \"哥，\"她低声说，\"你们……还要走？\" \"走一趟桓仁。\"我说，\"不出十天就回。\" 她点点头，没再问。转身回屋的时候，我看见她袖口那块补丁，针脚歪歪扭扭的——是她自己缝的，跟匣子里那张纸上的\"细针脚\"，是两回事。 我把这事记在心里，没声张。 \"鱼哥呢？\"我忽然想起。 \"在偏屋。\"把头说，\"今儿后晌睡了一觉，醒了就坐在那儿发呆。\" 我走到偏屋门口。鱼哥正坐在炕沿上，怀里抱着那只黑鸡，眼睛直勾勾的，像是没睡醒。 \"鱼哥，\"我说，\"你梦着啥了？\" 他半天才回过神，摇摇头：\"没梦着什么。就梦见一口锅，在山上跑。\" \"跑哪儿去？\" \"没看清。\"他把黑鸡往怀里搂了搂，\"我在后头追，追着追着，锅自己翻过来，扣地上了。掀开一看，底下是空的。\" 我心里一动，没接话。他自己笑了笑，也没再说。 我回屋的时候，豆芽仔正从院外进来，走得急，鞋上全是土。 \"哥，\"他喘着气，\"桓仁那边有信。\" \"什么信？\" \"马渡霜回店了。\"他说，\"她没露面，托隔壁的人给咱们带了句话。\" 我心里一动。马渡霜的店关了小半个月，留话\"别接灯\"，人就没影了。这会儿回来，不是小事。 \"她说啥？\" 豆芽仔看了把头一眼，才压低声音说：\"她说——'五月那场灯，别赶。灯亮一盏，走一个人。'\" \"这句话，她上回也说过。\"我说。 \"上回是留话，这回是回来当面说。\"把头把烟头按灭，\"留话的时候，她可以装糊涂；回来了还这么说，就是真怕了。\" 马渡霜的店，在桓仁开了多少年，从没关过这么久。她这一回来就带这句话，说明五月那场灯，比我们想的还要紧。 \"她怕什么？\" \"怕灯亮。\"把头说，\"灯一亮，名分就过明路。过明路的东西，藏不住。\" 把头站在门口，没回头。烟在他指间烧着，一明一灭。 半晌，他才说了一句：\"明天进桓仁，我去见她。\" 我看着院子里那几只空蜂箱，忽然觉得，这十天，怕是要一天掰成两天过了。 夜里起了风，几只空蜂箱被吹得嗡嗡响，像还有蜂在里头。我躺在炕上，睁着眼，一直听到后半夜。"}, {"id": "A5-091", "arc": "A5", "num": 91, "title": "灯油", "md": "天没亮透，把头就把我叫起来了。\n\n\"进桓仁。\"他把烟袋别进腰里，\"鱼哥看家，锅在坑里，天黑前回来。\"\n\n鱼哥蹲在偏屋门口喂鸡，听见这话，抬眼看了看我们，什么也没问。他这些天话少，夜里倒睡得实——自从扣锅台下来，他的魇没再犯过。他把最后一把苞米撒给黑鸡，站起来拍拍手：\"哥，早点回。\"\n\n小萱在灶上贴了一锅饼子，一人塞了两个热的。她没说话，眼睛在把头和我脸上转了一圈，像是想问什么，又咽回去了。\n\n出村的道上起了薄雾。把头一路没说话，快到官道口的时候，他忽然把我往边上带，拐进了高粱地边的小道。\n\n\"走地里的道？\"\n\n\"官道今天过车的辙印深。\"他头也不回，\"天没亮就过车，拉的还不是粮。桓仁这一段，就一条正经车道。有人赶早。\"\n\n我不懂车辙里的门道，只跟着走。地里的道湿，露水把裤脚打得透湿。走了小半个时辰，从城西的破窑边上绕进城，鞋帮上糊了两层泥。\n\n佛具店在城南老街上，门板下了半扇。把头上去敲了三下，不轻不重，一顿，又敲两下。\n\n门后半天没动静。正要走，里头传出脚步声，到门后停住，没开门。\n\n\"谁？\"\n\n\"王显生。\"把头说，\"上回在你店里买香的那个。\"\n\n门缝开了一条，露出半张脸。马渡霜看了一眼把头，又看了一眼我。她的目光在我身上停了停，鼻翼动了动，像闻见了什么。\n\n\"带着东西呢。\"她说。\n\n我心里一紧。契贴在我胸口，隔着两层布，外头是贴身的褂子。可她说得笃定，像隔着门板就闻见了。\n\n\"借一步。\"把头说。\n\n她把门拉开一条缝，让我们进去，又把门板重新上好。店里比外头暗，佛龛上的灯点着，豆大的火苗。龛底下摆着一个倒扣的小陶罐，落着薄薄一层灰。\n\n后屋更小。马渡霜把门掩上，自己坐在灯影外头，脸一半亮一半暗。\n\n\"上回的话，我托人带到了。\"她先开口，\"你们还来，是想问那句话？\"\n\n\"灯亮一盏，走一个人。\"把头把这十个字念了一遍，\"我要后头的。\"\n\n\"后头的没有。\"她说，\"我就知道这一句。\"\n\n\"那我说一句你不知道的。\"把头从怀里掏出烟袋，没点，就在手里转，\"前些日子，有个做手艺的，跟认字的说了句话——'灯芯是干的，点灯要油，油不在你手里'。\"\n\n马渡霜搁在膝上的手指停了一下。\n\n就停了那么一下。要是换个人，看不出来。可把头看出来了。\n\n\"谁的手艺，你不必知道。\"把头说，\"我就问一句，油在哪儿。\"\n\n屋里静了好一阵。佛龛的火苗晃了晃，她的半张脸在暗处，看不出神色。我数着心跳，数到二十多下，她才开口。\n\n\"你们查到我了。\"她说，声音平得很，\"查到我了，还问在哪儿，是试探我知道多少。\"\n\n\"不是试探。\"把头说，\"是要账的到了门口，我总得知道账本在谁手里。\"\n\n马渡霜抬起头，看了我很久。我让她看得后脊发毛，也没躲。\n\n\"你身上有契。\"她说，\"进门我就闻见了。山里的东西，瞒不住人。\"\n\n我没接话。把头也没接话，只在膝上把烟袋转了半圈。\n\n她起身，从柜底下摸出一个巴掌大的木匣，搁在桌上，没开。\n\n\"我师父是送油的。\"她说，\"这话出了这个门，我就不认了。\"\n\n把头坐直了。\n\n\"三十多年前，也是四月末，我师父挑着两坛油进的山。\"她说得不紧不慢，像是在背一段早背熟了的话，\"订油的是山里的人，下山来订的，付了订金。他说是替山上的灯订的，五月初一点灯，油要头等的。\"\n\n\"什么样的头等？\"\n\n\"我师父是做佛前灯油的，一辈子就认一口锅、一方蜡。\"她说，\"订主没还价。\"\n\n\"订金是什么？\"\n\n马渡霜打开木匣。匣子里衬着旧绒布，上头搁着一枚黄铜鱼尾，一拃长，磨得溜光，边上一道浅一道深的两条棱。\n\n我一眼就认得这个刀路。镜背上是它，锅底上是它，阴模上是它。做信人验过的东西，我都用手量过。\n\n\"这物件，我们见过同宗的。\"我把这话跟把头交换了一个眼色，把头接了话：\"这鱼尾，是跟油一块儿走的？\"\n\n\"订金搁我师父那儿，油就没回来。\"她说，\"他挑着两坛油进的山，送到沟口，人家不让进去，把油搁在石头上就回来了。初一那天夜里下雨，他坐在城里听雷，一夜没睡。初二有人捎信，让他再去。\"\n\n\"取回来了？\"\n\n\"取回去了。两坛，一满一空。\"她说，\"满的那坛，油一点没动，封蜡上还是他的指印。空的那坛，坛底粘着一层黑泥。\"\n\n把头转烟袋的手停了。\n\n\"跟他一起应这个活儿的，还有一个人，他师兄。\"马渡霜说，\"灯点起来的那晚，他师兄没回来。后来山里只下来一个人，白头发，不是他师兄。我师父去认了，不认得。\"\n\n\"他师兄应的什么活儿？\"\n\n\"接油的。\"她说，\"订油的规矩是一送一接。我师父把油送到沟口，师兄在里头接，跟着灯走。灯灭人回。\"她顿了顿，\"师兄没回，接油的活儿就断了根。我师父回来烧了送油的挑子，立了三规矩：油不过江，油不过夜，不点第二回。\"\n\n\"那坛满的呢？\"\n\n\"他没舍得倒，供在柜底下，供了一辈子。临走交给我，说一句话——等下回来取油的人。\"\n\n\"什么人？\"\n\n\"他没说。\"马渡霜看了我一眼，\"我等了三十年，等成个笑话。上个月你们来买香，走后我越想越不对。你身上那股山里的味，跟我师父当年从山里带回来的味，对上了。\"\n\n\"灯亮一盏，走一个人，\"把头慢慢问，\"是那年你师父说的？\"\n\n\"他只说了一句囫囵话。\"她说，\"那年五盏灯，亮了一盏。走的那个人，是我师父的师兄。他就记住了这一句，念叨了一辈子。\"\n\n我听得心里发凉。走，原来是这个走法。\n\n\"油我给你们。\"马渡霜说，\"就一坛。初三夜里来取，走东边老渡口上头的水路，摇船，别走官道。\"\n\n\"为什么是初三？\"\n\n\"因为初一我不开门，初五我不见人。\"她说，\"初三夜里来，拍三下门，报你师父的姓。\"\n\n\"我不认识你师父。\"\n\n\"用不着认识。\"她把木匣的盖子合上了，\"油认人。端坛子的时候手要稳，洒一滴，这坛油就废了——我收不回来，你们也点不成。\"\n\n\"要是咱们端不了呢？\"我问了一句。\n\n她看了我一眼，头一回正眼看我：\"端不了，就说明你还不配点。\"\n\n把头又问了一句：\"送油那趟，你师父进沟口多深？\"\n\n\"没进。\"她说，\"石头上搁下就退。他说沟口那儿立着一块碑似的东西，黑黢黢的，顶上挂着物件。他不敢细看。\"\n\n\"挂的什么物件？\"\n\n\"倒着的。\"她说，\"像一口锅。\"\n\n我和把头对看了一眼。三十年前，那口锅就吊在沟口。它是沟口的灯，也是沟口的关。\n\n把头站起来，冲她拱了拱手。事情成了，他不多话。\n\n出后屋的时候，马渡霜忽然又叫住我们。\n\n\"还有一句。\"她站在灯影外头，看不清脸，\"掌灯的眼睛，早就在渡口了。初三那晚，他要是在你们前头进的门，就当这坛油没有——别提我，别提油，扭头就走。\"\n\n\"他要是已经知道呢？\"\n\n\"那我也没法子。\"她说，\"油是我师父的，规矩是我师父的。我只管看坛子，不管灯亮不亮。\"\n\n门在我们身后合上了。\n\n回去的路上，把头一句话没说。过了老街，拐上江堤，他才开口：\"她这坛油，三十年没挪过窝。今儿答应得这么痛快，你想过没有？\"\n\n\"想过。\"我说，\"她不是给咱们，她是替她师父交差。\"\n\n\"对。\"把头说，\"交差的事儿，最怕的就是接错人。她见了你的契才松口。这说明什么？说明她师父当年那句话后头还有话，她没学全，或者没敢学。\"\n\n\"还有一层。\"我说，\"她说初五不见人，初一不开门。她躲的不是咱们。\"\n\n\"她躲的是灯。\"把头说，\"送油人的后人，最知道灯是什么成色。\"\n\n日头偏西，江上过船的不多，对岸的山头压着云。快到渡口的时候，他站住了，看着江面。\n\n\"油认人。\"他把这仨字咂摸了一遍，\"她师父留下的油，等的就是背锅的人。你小子这趟差事，怕是三十年前就派下了。\"\n\n我说不出话。江风从上游刮过来，带着水腥气。远处官道上过车的动静隐隐传来，把头听了听，眉头皱起来了。\n\n\"走，抄小道。\"他说，\"官道上今天车多，不对劲。\"", "words": 2983, "html": "<p>天没亮透，把头就把我叫起来了。<\/p>\n<p>\"进桓仁。\"他把烟袋别进腰里，\"鱼哥看家，锅在坑里，天黑前回来。\"<\/p>\n<p>鱼哥蹲在偏屋门口喂鸡，听见这话，抬眼看了看我们，什么也没问。他这些天话少，夜里倒睡得实——自从扣锅台下来，他的魇没再犯过。他把最后一把苞米撒给黑鸡，站起来拍拍手：\"哥，早点回。\"<\/p>\n<p>小萱在灶上贴了一锅饼子，一人塞了两个热的。她没说话，眼睛在把头和我脸上转了一圈，像是想问什么，又咽回去了。<\/p>\n<p>出村的道上起了薄雾。把头一路没说话，快到官道口的时候，他忽然把我往边上带，拐进了高粱地边的小道。<\/p>\n<p>\"走地里的道？\"<\/p>\n<p>\"官道今天过车的辙印深。\"他头也不回，\"天没亮就过车，拉的还不是粮。桓仁这一段，就一条正经车道。有人赶早。\"<\/p>\n<p>我不懂车辙里的门道，只跟着走。地里的道湿，露水把裤脚打得透湿。走了小半个时辰，从城西的破窑边上绕进城，鞋帮上糊了两层泥。<\/p>\n<p>佛具店在城南老街上，门板下了半扇。把头上去敲了三下，不轻不重，一顿，又敲两下。<\/p>\n<p>门后半天没动静。正要走，里头传出脚步声，到门后停住，没开门。<\/p>\n<p>\"谁？\"<\/p>\n<p>\"王显生。\"把头说，\"上回在你店里买香的那个。\"<\/p>\n<p>门缝开了一条，露出半张脸。马渡霜看了一眼把头，又看了一眼我。她的目光在我身上停了停，鼻翼动了动，像闻见了什么。<\/p>\n<p>\"带着东西呢。\"她说。<\/p>\n<p>我心里一紧。契贴在我胸口，隔着两层布，外头是贴身的褂子。可她说得笃定，像隔着门板就闻见了。<\/p>\n<p>\"借一步。\"把头说。<\/p>\n<p>她把门拉开一条缝，让我们进去，又把门板重新上好。店里比外头暗，佛龛上的灯点着，豆大的火苗。龛底下摆着一个倒扣的小陶罐，落着薄薄一层灰。<\/p>\n<p>后屋更小。马渡霜把门掩上，自己坐在灯影外头，脸一半亮一半暗。<\/p>\n<p>\"上回的话，我托人带到了。\"她先开口，\"你们还来，是想问那句话？\"<\/p>\n<p>\"灯亮一盏，走一个人。\"把头把这十个字念了一遍，\"我要后头的。\"<\/p>\n<p>\"后头的没有。\"她说，\"我就知道这一句。\"<\/p>\n<p>\"那我说一句你不知道的。\"把头从怀里掏出烟袋，没点，就在手里转，\"前些日子，有个做手艺的，跟认字的说了句话——'灯芯是干的，点灯要油，油不在你手里'。\"<\/p>\n<p>马渡霜搁在膝上的手指停了一下。<\/p>\n<p>就停了那么一下。要是换个人，看不出来。可把头看出来了。<\/p>\n<p>\"谁的手艺，你不必知道。\"把头说，\"我就问一句，油在哪儿。\"<\/p>\n<p>屋里静了好一阵。佛龛的火苗晃了晃，她的半张脸在暗处，看不出神色。我数着心跳，数到二十多下，她才开口。<\/p>\n<p>\"你们查到我了。\"她说，声音平得很，\"查到我了，还问在哪儿，是试探我知道多少。\"<\/p>\n<p>\"不是试探。\"把头说，\"是要账的到了门口，我总得知道账本在谁手里。\"<\/p>\n<p>马渡霜抬起头，看了我很久。我让她看得后脊发毛，也没躲。<\/p>\n<p>\"你身上有契。\"她说，\"进门我就闻见了。山里的东西，瞒不住人。\"<\/p>\n<p>我没接话。把头也没接话，只在膝上把烟袋转了半圈。<\/p>\n<p>她起身，从柜底下摸出一个巴掌大的木匣，搁在桌上，没开。<\/p>\n<p>\"我师父是送油的。\"她说，\"这话出了这个门，我就不认了。\"<\/p>\n<p>把头坐直了。<\/p>\n<p>\"三十多年前，也是四月末，我师父挑着两坛油进的山。\"她说得不紧不慢，像是在背一段早背熟了的话，\"订油的是山里的人，下山来订的，付了订金。他说是替山上的灯订的，五月初一点灯，油要头等的。\"<\/p>\n<p>\"什么样的头等？\"<\/p>\n<p>\"我师父是做佛前灯油的，一辈子就认一口锅、一方蜡。\"她说，\"订主没还价。\"<\/p>\n<p>\"订金是什么？\"<\/p>\n<p>马渡霜打开木匣。匣子里衬着旧绒布，上头搁着一枚黄铜鱼尾，一拃长，磨得溜光，边上一道浅一道深的两条棱。<\/p>\n<p>我一眼就认得这个刀路。镜背上是它，锅底上是它，阴模上是它。做信人验过的东西，我都用手量过。<\/p>\n<p>\"这物件，我们见过同宗的。\"我把这话跟把头交换了一个眼色，把头接了话：\"这鱼尾，是跟油一块儿走的？\"<\/p>\n<p>\"订金搁我师父那儿，油就没回来。\"她说，\"他挑着两坛油进的山，送到沟口，人家不让进去，把油搁在石头上就回来了。初一那天夜里下雨，他坐在城里听雷，一夜没睡。初二有人捎信，让他再去。\"<\/p>\n<p>\"取回来了？\"<\/p>\n<p>\"取回去了。两坛，一满一空。\"她说，\"满的那坛，油一点没动，封蜡上还是他的指印。空的那坛，坛底粘着一层黑泥。\"<\/p>\n<p>把头转烟袋的手停了。<\/p>\n<p>\"跟他一起应这个活儿的，还有一个人，他师兄。\"马渡霜说，\"灯点起来的那晚，他师兄没回来。后来山里只下来一个人，白头发，不是他师兄。我师父去认了，不认得。\"<\/p>\n<p>\"他师兄应的什么活儿？\"<\/p>\n<p>\"接油的。\"她说，\"订油的规矩是一送一接。我师父把油送到沟口，师兄在里头接，跟着灯走。灯灭人回。\"她顿了顿，\"师兄没回，接油的活儿就断了根。我师父回来烧了送油的挑子，立了三规矩：油不过江，油不过夜，不点第二回。\"<\/p>\n<p>\"那坛满的呢？\"<\/p>\n<p>\"他没舍得倒，供在柜底下，供了一辈子。临走交给我，说一句话——等下回来取油的人。\"<\/p>\n<p>\"什么人？\"<\/p>\n<p>\"他没说。\"马渡霜看了我一眼，\"我等了三十年，等成个笑话。上个月你们来买香，走后我越想越不对。你身上那股山里的味，跟我师父当年从山里带回来的味，对上了。\"<\/p>\n<p>\"灯亮一盏，走一个人，\"把头慢慢问，\"是那年你师父说的？\"<\/p>\n<p>\"他只说了一句囫囵话。\"她说，\"那年五盏灯，亮了一盏。走的那个人，是我师父的师兄。他就记住了这一句，念叨了一辈子。\"<\/p>\n<p>我听得心里发凉。走，原来是这个走法。<\/p>\n<p>\"油我给你们。\"马渡霜说，\"就一坛。初三夜里来取，走东边老渡口上头的水路，摇船，别走官道。\"<\/p>\n<p>\"为什么是初三？\"<\/p>\n<p>\"因为初一我不开门，初五我不见人。\"她说，\"初三夜里来，拍三下门，报你师父的姓。\"<\/p>\n<p>\"我不认识你师父。\"<\/p>\n<p>\"用不着认识。\"她把木匣的盖子合上了，\"油认人。端坛子的时候手要稳，洒一滴，这坛油就废了——我收不回来，你们也点不成。\"<\/p>\n<p>\"要是咱们端不了呢？\"我问了一句。<\/p>\n<p>她看了我一眼，头一回正眼看我：\"端不了，就说明你还不配点。\"<\/p>\n<p>把头又问了一句：\"送油那趟，你师父进沟口多深？\"<\/p>\n<p>\"没进。\"她说，\"石头上搁下就退。他说沟口那儿立着一块碑似的东西，黑黢黢的，顶上挂着物件。他不敢细看。\"<\/p>\n<p>\"挂的什么物件？\"<\/p>\n<p>\"倒着的。\"她说，\"像一口锅。\"<\/p>\n<p>我和把头对看了一眼。三十年前，那口锅就吊在沟口。它是沟口的灯，也是沟口的关。<\/p>\n<p>把头站起来，冲她拱了拱手。事情成了，他不多话。<\/p>\n<p>出后屋的时候，马渡霜忽然又叫住我们。<\/p>\n<p>\"还有一句。\"她站在灯影外头，看不清脸，\"掌灯的眼睛，早就在渡口了。初三那晚，他要是在你们前头进的门，就当这坛油没有——别提我，别提油，扭头就走。\"<\/p>\n<p>\"他要是已经知道呢？\"<\/p>\n<p>\"那我也没法子。\"她说，\"油是我师父的，规矩是我师父的。我只管看坛子，不管灯亮不亮。\"<\/p>\n<p>门在我们身后合上了。<\/p>\n<p>回去的路上，把头一句话没说。过了老街，拐上江堤，他才开口：\"她这坛油，三十年没挪过窝。今儿答应得这么痛快，你想过没有？\"<\/p>\n<p>\"想过。\"我说，\"她不是给咱们，她是替她师父交差。\"<\/p>\n<p>\"对。\"把头说，\"交差的事儿，最怕的就是接错人。她见了你的契才松口。这说明什么？说明她师父当年那句话后头还有话，她没学全，或者没敢学。\"<\/p>\n<p>\"还有一层。\"我说，\"她说初五不见人，初一不开门。她躲的不是咱们。\"<\/p>\n<p>\"她躲的是灯。\"把头说，\"送油人的后人，最知道灯是什么成色。\"<\/p>\n<p>日头偏西，江上过船的不多，对岸的山头压着云。快到渡口的时候，他站住了，看着江面。<\/p>\n<p>\"油认人。\"他把这仨字咂摸了一遍，\"她师父留下的油，等的就是背锅的人。你小子这趟差事，怕是三十年前就派下了。\"<\/p>\n<p>我说不出话。江风从上游刮过来，带着水腥气。远处官道上过车的动静隐隐传来，把头听了听，眉头皱起来了。<\/p>\n<p>\"走，抄小道。\"他说，\"官道上今天车多，不对劲。\"<\/p>", "plain": "天没亮透，把头就把我叫起来了。 \"进桓仁。\"他把烟袋别进腰里，\"鱼哥看家，锅在坑里，天黑前回来。\" 鱼哥蹲在偏屋门口喂鸡，听见这话，抬眼看了看我们，什么也没问。他这些天话少，夜里倒睡得实——自从扣锅台下来，他的魇没再犯过。他把最后一把苞米撒给黑鸡，站起来拍拍手：\"哥，早点回。\" 小萱在灶上贴了一锅饼子，一人塞了两个热的。她没说话，眼睛在把头和我脸上转了一圈，像是想问什么，又咽回去了。 出村的道上起了薄雾。把头一路没说话，快到官道口的时候，他忽然把我往边上带，拐进了高粱地边的小道。 \"走地里的道？\" \"官道今天过车的辙印深。\"他头也不回，\"天没亮就过车，拉的还不是粮。桓仁这一段，就一条正经车道。有人赶早。\" 我不懂车辙里的门道，只跟着走。地里的道湿，露水把裤脚打得透湿。走了小半个时辰，从城西的破窑边上绕进城，鞋帮上糊了两层泥。 佛具店在城南老街上，门板下了半扇。把头上去敲了三下，不轻不重，一顿，又敲两下。 门后半天没动静。正要走，里头传出脚步声，到门后停住，没开门。 \"谁？\" \"王显生。\"把头说，\"上回在你店里买香的那个。\" 门缝开了一条，露出半张脸。马渡霜看了一眼把头，又看了一眼我。她的目光在我身上停了停，鼻翼动了动，像闻见了什么。 \"带着东西呢。\"她说。 我心里一紧。契贴在我胸口，隔着两层布，外头是贴身的褂子。可她说得笃定，像隔着门板就闻见了。 \"借一步。\"把头说。 她把门拉开一条缝，让我们进去，又把门板重新上好。店里比外头暗，佛龛上的灯点着，豆大的火苗。龛底下摆着一个倒扣的小陶罐，落着薄薄一层灰。 后屋更小。马渡霜把门掩上，自己坐在灯影外头，脸一半亮一半暗。 \"上回的话，我托人带到了。\"她先开口，\"你们还来，是想问那句话？\" \"灯亮一盏，走一个人。\"把头把这十个字念了一遍，\"我要后头的。\" \"后头的没有。\"她说，\"我就知道这一句。\" \"那我说一句你不知道的。\"把头从怀里掏出烟袋，没点，就在手里转，\"前些日子，有个做手艺的，跟认字的说了句话——'灯芯是干的，点灯要油，油不在你手里'。\" 马渡霜搁在膝上的手指停了一下。 就停了那么一下。要是换个人，看不出来。可把头看出来了。 \"谁的手艺，你不必知道。\"把头说，\"我就问一句，油在哪儿。\" 屋里静了好一阵。佛龛的火苗晃了晃，她的半张脸在暗处，看不出神色。我数着心跳，数到二十多下，她才开口。 \"你们查到我了。\"她说，声音平得很，\"查到我了，还问在哪儿，是试探我知道多少。\" \"不是试探。\"把头说，\"是要账的到了门口，我总得知道账本在谁手里。\" 马渡霜抬起头，看了我很久。我让她看得后脊发毛，也没躲。 \"你身上有契。\"她说，\"进门我就闻见了。山里的东西，瞒不住人。\" 我没接话。把头也没接话，只在膝上把烟袋转了半圈。 她起身，从柜底下摸出一个巴掌大的木匣，搁在桌上，没开。 \"我师父是送油的。\"她说，\"这话出了这个门，我就不认了。\" 把头坐直了。 \"三十多年前，也是四月末，我师父挑着两坛油进的山。\"她说得不紧不慢，像是在背一段早背熟了的话，\"订油的是山里的人，下山来订的，付了订金。他说是替山上的灯订的，五月初一点灯，油要头等的。\" \"什么样的头等？\" \"我师父是做佛前灯油的，一辈子就认一口锅、一方蜡。\"她说，\"订主没还价。\" \"订金是什么？\" 马渡霜打开木匣。匣子里衬着旧绒布，上头搁着一枚黄铜鱼尾，一拃长，磨得溜光，边上一道浅一道深的两条棱。 我一眼就认得这个刀路。镜背上是它，锅底上是它，阴模上是它。做信人验过的东西，我都用手量过。 \"这物件，我们见过同宗的。\"我把这话跟把头交换了一个眼色，把头接了话：\"这鱼尾，是跟油一块儿走的？\" \"订金搁我师父那儿，油就没回来。\"她说，\"他挑着两坛油进的山，送到沟口，人家不让进去，把油搁在石头上就回来了。初一那天夜里下雨，他坐在城里听雷，一夜没睡。初二有人捎信，让他再去。\" \"取回来了？\" \"取回去了。两坛，一满一空。\"她说，\"满的那坛，油一点没动，封蜡上还是他的指印。空的那坛，坛底粘着一层黑泥。\" 把头转烟袋的手停了。 \"跟他一起应这个活儿的，还有一个人，他师兄。\"马渡霜说，\"灯点起来的那晚，他师兄没回来。后来山里只下来一个人，白头发，不是他师兄。我师父去认了，不认得。\" \"他师兄应的什么活儿？\" \"接油的。\"她说，\"订油的规矩是一送一接。我师父把油送到沟口，师兄在里头接，跟着灯走。灯灭人回。\"她顿了顿，\"师兄没回，接油的活儿就断了根。我师父回来烧了送油的挑子，立了三规矩：油不过江，油不过夜，不点第二回。\" \"那坛满的呢？\" \"他没舍得倒，供在柜底下，供了一辈子。临走交给我，说一句话——等下回来取油的人。\" \"什么人？\" \"他没说。\"马渡霜看了我一眼，\"我等了三十年，等成个笑话。上个月你们来买香，走后我越想越不对。你身上那股山里的味，跟我师父当年从山里带回来的味，对上了。\" \"灯亮一盏，走一个人，\"把头慢慢问，\"是那年你师父说的？\" \"他只说了一句囫囵话。\"她说，\"那年五盏灯，亮了一盏。走的那个人，是我师父的师兄。他就记住了这一句，念叨了一辈子。\" 我听得心里发凉。走，原来是这个走法。 \"油我给你们。\"马渡霜说，\"就一坛。初三夜里来取，走东边老渡口上头的水路，摇船，别走官道。\" \"为什么是初三？\" \"因为初一我不开门，初五我不见人。\"她说，\"初三夜里来，拍三下门，报你师父的姓。\" \"我不认识你师父。\" \"用不着认识。\"她把木匣的盖子合上了，\"油认人。端坛子的时候手要稳，洒一滴，这坛油就废了——我收不回来，你们也点不成。\" \"要是咱们端不了呢？\"我问了一句。 她看了我一眼，头一回正眼看我：\"端不了，就说明你还不配点。\" 把头又问了一句：\"送油那趟，你师父进沟口多深？\" \"没进。\"她说，\"石头上搁下就退。他说沟口那儿立着一块碑似的东西，黑黢黢的，顶上挂着物件。他不敢细看。\" \"挂的什么物件？\" \"倒着的。\"她说，\"像一口锅。\" 我和把头对看了一眼。三十年前，那口锅就吊在沟口。它是沟口的灯，也是沟口的关。 把头站起来，冲她拱了拱手。事情成了，他不多话。 出后屋的时候，马渡霜忽然又叫住我们。 \"还有一句。\"她站在灯影外头，看不清脸，\"掌灯的眼睛，早就在渡口了。初三那晚，他要是在你们前头进的门，就当这坛油没有——别提我，别提油，扭头就走。\" \"他要是已经知道呢？\" \"那我也没法子。\"她说，\"油是我师父的，规矩是我师父的。我只管看坛子，不管灯亮不亮。\" 门在我们身后合上了。 回去的路上，把头一句话没说。过了老街，拐上江堤，他才开口：\"她这坛油，三十年没挪过窝。今儿答应得这么痛快，你想过没有？\" \"想过。\"我说，\"她不是给咱们，她是替她师父交差。\" \"对。\"把头说，\"交差的事儿，最怕的就是接错人。她见了你的契才松口。这说明什么？说明她师父当年那句话后头还有话，她没学全，或者没敢学。\" \"还有一层。\"我说，\"她说初五不见人，初一不开门。她躲的不是咱们。\" \"她躲的是灯。\"把头说，\"送油人的后人，最知道灯是什么成色。\" 日头偏西，江上过船的不多，对岸的山头压着云。快到渡口的时候，他站住了，看着江面。 \"油认人。\"他把这仨字咂摸了一遍，\"她师父留下的油，等的就是背锅的人。你小子这趟差事，怕是三十年前就派下了。\" 我说不出话。江风从上游刮过来，带着水腥气。远处官道上过车的动静隐隐传来，把头听了听，眉头皱起来了。 \"走，抄小道。\"他说，\"官道上今天车多，不对劲。\""}, {"id": "A5-092", "arc": "A5", "num": 92, "title": "一页", "md": "天擦黑进的雅河乡，第二天一早，豆芽仔的信就到了——他托赶集的老乡捎了张字条，字条上就六个字：记满一页，速来。\n\n把头看完字条，把烟袋往腰里一别：\"走。\"\n\n\"就为看一页账？\"\n\n\"一页账抵一箱货。\"把头说，\"他记满了一页还没人来收，说明他记着的东西他自己都嫌沉。\"\n\n到了桓仁，没走前街，从后巷进的阿布。老周把后屋门帘一挑，脸白得跟纸似的。\n\n\"来了？\"他把声音压得只剩气，\"这两天我这铺子，进来出去的都是生面孔，我夜里都不敢睡踏实。\"\n\n豆芽仔坐在条凳上，面前摊着他那本破本子。一页，记得密密麻麻，字丑，但一笔是一笔，每条后头都缀着日子。\n\n\"哥，你自个儿看。\"他往边上挪了挪。\n\n我凑过去看。头一条：四月十九起，矮个儿来铺子两回，买麻绳，一回比一回买得多，末一回是整捆。第二条：瘦高个儿前天在北门河沿蹲了半天，看水，没买东西，蹲的是涨潮线往上的石头。第三条：高个儿买了一把铜锁，问哪儿有铸新锁的，问得仔细，问的是老样儿的锁。\n\n把头一条一条地问，一条一条地对日子。\n\n\"麻绳买去做什么，他问没问？\"把头指着头一条。\n\n\"没问。\"豆芽仔说，\"人家买麻绳还要跟老周报备？\"\n\n\"我不是问那个。\"把头说，\"我是看日子。十九买一回，廿二买一回，隔三天。这是个备料的进度，不是临时起意。\"\n\n问到第四条，他的手指在页边上停住了。\n\n第四条往后，字忽然写得重了。\n\n四月廿六，后晌。一个干瘦老头进店，六十往上，酒糟鼻子。不买东西，就问一句话——鹰嘴沟里那口锅，后来叫谁起走了。\n\n\"他问的时候，我腿肚子都是软的。\"老周在后屋门口搓着手，\"我不敢接茬，就装糊涂。他不恼，站了一会儿，掏出这么个东西搁柜台上，说给背锅的留着。\"\n\n他递过来半张黄纸。纸旧，脆，边儿上有一道火烧的旧茬，角上用墨点着一个记号——三笔两笔，一条鱼尾。\n\n把头就着窗口的光看那纸。纸是黄表纸，裁得毛糙，墨点子洇进纸纹里，不是一天两天的墨。\n\n\"他说，\"老周咽了口唾沫，\"他说，告诉背锅的，锅不是叫人截走的，是它自己要走的。谁要拦它，谁就得替它背到底。\"\n\n我捏着那半张纸，指头有点凉。\n\n锅不是叫人截走的，是它自己要走的。\n\n出沟那晚，引路锅叫一伙人截走，这事压了我们半个多月，一直当是被人抢了。可这老头一句话，把这事翻了个个儿。\n\n\"这老头什么来路？\"我问。\n\n豆芽仔从本子后头又翻出一页：\"我跟了他。\"\n\n\"跟到哪儿？\"\n\n\"北门外河滩。\"他说，\"他腿脚不利索，左腿拖着走，走一段歇一段，我跟得挺稳，没叫他瞧见。到河滩他就没影了——那片柳树丛，我跟进去就找不着人了。\"\n\n\"柳树丛你没敢往深里钻？\"\n\n\"钻了两步。\"豆芽仔有点不好意思，\"那里头静得邪乎，我总觉得有人看我后脖颈子。\"\n\n把头合不上他的本子，还在翻，忽然抬头：\"看见他往哪儿去了？\"\n\n\"没有。\"豆芽仔挠头，\"我就看见他蹲在河滩上，跟埋东西似的扒拉了几下。我以为要捡漏，凑近了，他站起来了，冲我说了一句话。\"\n\n\"说什么？\"\n\n\"他说——\"豆芽仔学得磕磕绊绊，\"小伙子，别跟了。我要办的事，三天办不完，初五以后你们就都知道了。\"\n\n\"他怎么知道你是跟咱们的？\"\n\n\"我也纳闷。\"豆芽仔说，\"我一身赶集的行头，他张嘴就叫破。\"\n\n把头合上本子。\n\n\"酒糟鼻。\"他慢慢说，\"三十多年前，五进两出，活着从沟里走出来的那个。\"\n\n我知道这段旧事。当年进沟五个人，外头只等着两个人回来，结果只走回来一个酒糟鼻。打那以后，这人再没在山边露过面，听说南下讨生活，一走就是三十年。\n\n三十年不露面，一露面，就问那口锅。\n\n\"河滩上他埋没埋东西？\"把头问。\n\n\"我去看了。\"豆芽仔说，\"新土倒是没有，就是柳树丛边上有一块地方，草压倒了，人睡过的样儿。边上烧过纸，灰还新。\"\n\n\"灰里有东西没有？\"\n\n\"天擦黑了，没细拣。\"豆芽仔说，\"就拣出几个烟屁。掐得都贼短，烫手了才扔的样儿。\"\n\n把头的眉头动了一下，没说话。\n\n老周在边上一直搓手，这时候忍不住了：\"还有个事儿，我没敢写本子上。\"\n\n\"说。\"\n\n\"那老头临出门，回头问了我一句怪话。\"老周压低声音，\"他问——五女山那个等人的老头，今年怎么没来？\"\n\n屋里静了。\n\n五女山那个等人的老头。等了六年，来了四十多回，专挑四月，从不让人看脸。问灯的。\n\n\"他怎么知道那老头？\"我脱口而出。\n\n\"我哪敢问。\"老周苦笑，\"我支吾了两句，他就走了。走的时候，我瞅着他背影，那步子……不像六十岁的人，倒像给腿上上了刑的，一步一步都是咬牙。\"\n\n\"他走哪个门？\"\n\n\"前门。\"老周说，\"走前门，过街口，谁也没接他。这条街上但凡有眼线的，都得看见他。他不怕看。\"\n\n\"要么是不怕，\"把头说，\"要么是觉着这世上已经没人认得他了。\"\n\n老周还想说什么，又咽了，末了憋出一句：\"他穿的褂子，洗得都发白了，可那针脚——\"他比划了一下袖口，\"我年轻时候在裁缝铺待过两年，那针脚，如今没人缝得出来。\"\n\n把头和我的目光碰了一下。谁也没接这个茬。\n\n豆芽仔把本子往怀里一收：\"哥，那句话我寻思了一道——'谁要拦它，谁就得替它背到底'。这话啥意思？\"\n\n\"意思是，那口锅要走的道，早就定好了。\"把头说，\"拦的，背的，都得在这条道上。咱们没得选。\"\n\n\"那要是不拦呢？\"\n\n\"不拦，它就走了。\"把头说，\"走了，咱们拿什么赴初五？名分在锅上，锅跑了，咱们就是一群顶着个空名分的活人。\"\n\n他没再说下去。我听得出来，这话后头还有一层他没说的——锅要是自己走了，走的那个名分，算谁的。\n\n回去的道上，把头又一句话不说。他把那半张黄纸夹进了本子里，本子揣在怀里，走一路，手就在胸口按一路。\n\n到了渡口，他站住，看着北边。\n\n\"豆芽仔本子上这一页，我给它起个名，叫账。\"他说，\"矮个儿买绳，瘦高个儿看水，高个儿买锁——这三样凑一块儿，是要拴东西、探水路、锁门。他们在备初五的活儿。\"\n\n\"酒糟鼻呢？\"\n\n\"酒糟鼻不一样。\"把头说，\"那三个是冲咱们来的。他不是，他是冲着锅来的。\"\n\n他把那半张黄纸又掏出来，就着日头看。墨点的鱼尾，笔画很旧，像是描了多少年的。\n\n\"他在给咱们留记号。\"把头说，\"留记号的人，是想让咱们找着他。\"\n\n\"找他干嘛？\"\n\n\"他见过那口锅怎么走。\"把头把纸收好，\"三十多年前那场灯，他是唯一看着灯亮完的人。初五之前，我得见他一面。\"\n\n\"上哪儿找？\"\n\n\"河滩。\"把头往北边看了一眼，\"睡过的草窝，烧过的纸，掐短的烟。那是个老山客的做派。老山客留记号，不会只留一处。\"\n\n\"可他要是冲着锅来的，他跟锅里那些事儿，沾着什么亲？\"我问。\n\n把头没答。他把烟袋摸出来又塞回去，像是话到嘴边，又压下去了。\n\n船家在渡口喊人过江。把头摆摆手没动，站了半晌，忽然自言自语似的补了一句：\n\n\"初五以后你们就都知道了。\"\n\n这话在道上颠了一路，到了雅河乡，还硌在我心里。\n\n进村的时候天都擦黑了。鱼哥在院门口等着，一见面就说：\"后晌有个人打村道上过，骑不着牲口，就那么走着。走到咱门口，站了站，没敲门，走了。\"\n\n\"长什么样？\"\n\n\"天太暗，看不清脸。\"鱼哥说，\"个头不高，瘦。走道儿的时候，左腿像是不利索。\"\n\n我和把头都没说话。\n\n\"你追没追？\"\n\n\"追了两步。\"鱼哥说，\"他拐进苞米地就没影了。那地里当晚也没露水，人走过去，愣是没压倒一棵苗——我进去转了半天，转晕了都。\"\n\n把头听完，进院把门闩了，回屋跟我说：\"他是来看门的。看看咱们睡没睡，院里几口人。\"\n\n\"看完了呢？\"\n\n\"看完了，就该排日子了。\"把头说，\"初一，初三，初五。人家那头也是三步棋。\"", "words": 2925, "html": "<p>天擦黑进的雅河乡，第二天一早，豆芽仔的信就到了——他托赶集的老乡捎了张字条，字条上就六个字：记满一页，速来。<\/p>\n<p>把头看完字条，把烟袋往腰里一别：\"走。\"<\/p>\n<p>\"就为看一页账？\"<\/p>\n<p>\"一页账抵一箱货。\"把头说，\"他记满了一页还没人来收，说明他记着的东西他自己都嫌沉。\"<\/p>\n<p>到了桓仁，没走前街，从后巷进的阿布。老周把后屋门帘一挑，脸白得跟纸似的。<\/p>\n<p>\"来了？\"他把声音压得只剩气，\"这两天我这铺子，进来出去的都是生面孔，我夜里都不敢睡踏实。\"<\/p>\n<p>豆芽仔坐在条凳上，面前摊着他那本破本子。一页，记得密密麻麻，字丑，但一笔是一笔，每条后头都缀着日子。<\/p>\n<p>\"哥，你自个儿看。\"他往边上挪了挪。<\/p>\n<p>我凑过去看。头一条：四月十九起，矮个儿来铺子两回，买麻绳，一回比一回买得多，末一回是整捆。第二条：瘦高个儿前天在北门河沿蹲了半天，看水，没买东西，蹲的是涨潮线往上的石头。第三条：高个儿买了一把铜锁，问哪儿有铸新锁的，问得仔细，问的是老样儿的锁。<\/p>\n<p>把头一条一条地问，一条一条地对日子。<\/p>\n<p>\"麻绳买去做什么，他问没问？\"把头指着头一条。<\/p>\n<p>\"没问。\"豆芽仔说，\"人家买麻绳还要跟老周报备？\"<\/p>\n<p>\"我不是问那个。\"把头说，\"我是看日子。十九买一回，廿二买一回，隔三天。这是个备料的进度，不是临时起意。\"<\/p>\n<p>问到第四条，他的手指在页边上停住了。<\/p>\n<p>第四条往后，字忽然写得重了。<\/p>\n<p>四月廿六，后晌。一个干瘦老头进店，六十往上，酒糟鼻子。不买东西，就问一句话——鹰嘴沟里那口锅，后来叫谁起走了。<\/p>\n<p>\"他问的时候，我腿肚子都是软的。\"老周在后屋门口搓着手，\"我不敢接茬，就装糊涂。他不恼，站了一会儿，掏出这么个东西搁柜台上，说给背锅的留着。\"<\/p>\n<p>他递过来半张黄纸。纸旧，脆，边儿上有一道火烧的旧茬，角上用墨点着一个记号——三笔两笔，一条鱼尾。<\/p>\n<p>把头就着窗口的光看那纸。纸是黄表纸，裁得毛糙，墨点子洇进纸纹里，不是一天两天的墨。<\/p>\n<p>\"他说，\"老周咽了口唾沫，\"他说，告诉背锅的，锅不是叫人截走的，是它自己要走的。谁要拦它，谁就得替它背到底。\"<\/p>\n<p>我捏着那半张纸，指头有点凉。<\/p>\n<p>锅不是叫人截走的，是它自己要走的。<\/p>\n<p>出沟那晚，引路锅叫一伙人截走，这事压了我们半个多月，一直当是被人抢了。可这老头一句话，把这事翻了个个儿。<\/p>\n<p>\"这老头什么来路？\"我问。<\/p>\n<p>豆芽仔从本子后头又翻出一页：\"我跟了他。\"<\/p>\n<p>\"跟到哪儿？\"<\/p>\n<p>\"北门外河滩。\"他说，\"他腿脚不利索，左腿拖着走，走一段歇一段，我跟得挺稳，没叫他瞧见。到河滩他就没影了——那片柳树丛，我跟进去就找不着人了。\"<\/p>\n<p>\"柳树丛你没敢往深里钻？\"<\/p>\n<p>\"钻了两步。\"豆芽仔有点不好意思，\"那里头静得邪乎，我总觉得有人看我后脖颈子。\"<\/p>\n<p>把头合不上他的本子，还在翻，忽然抬头：\"看见他往哪儿去了？\"<\/p>\n<p>\"没有。\"豆芽仔挠头，\"我就看见他蹲在河滩上，跟埋东西似的扒拉了几下。我以为要捡漏，凑近了，他站起来了，冲我说了一句话。\"<\/p>\n<p>\"说什么？\"<\/p>\n<p>\"他说——\"豆芽仔学得磕磕绊绊，\"小伙子，别跟了。我要办的事，三天办不完，初五以后你们就都知道了。\"<\/p>\n<p>\"他怎么知道你是跟咱们的？\"<\/p>\n<p>\"我也纳闷。\"豆芽仔说，\"我一身赶集的行头，他张嘴就叫破。\"<\/p>\n<p>把头合上本子。<\/p>\n<p>\"酒糟鼻。\"他慢慢说，\"三十多年前，五进两出，活着从沟里走出来的那个。\"<\/p>\n<p>我知道这段旧事。当年进沟五个人，外头只等着两个人回来，结果只走回来一个酒糟鼻。打那以后，这人再没在山边露过面，听说南下讨生活，一走就是三十年。<\/p>\n<p>三十年不露面，一露面，就问那口锅。<\/p>\n<p>\"河滩上他埋没埋东西？\"把头问。<\/p>\n<p>\"我去看了。\"豆芽仔说，\"新土倒是没有，就是柳树丛边上有一块地方，草压倒了，人睡过的样儿。边上烧过纸，灰还新。\"<\/p>\n<p>\"灰里有东西没有？\"<\/p>\n<p>\"天擦黑了，没细拣。\"豆芽仔说，\"就拣出几个烟屁。掐得都贼短，烫手了才扔的样儿。\"<\/p>\n<p>把头的眉头动了一下，没说话。<\/p>\n<p>老周在边上一直搓手，这时候忍不住了：\"还有个事儿，我没敢写本子上。\"<\/p>\n<p>\"说。\"<\/p>\n<p>\"那老头临出门，回头问了我一句怪话。\"老周压低声音，\"他问——五女山那个等人的老头，今年怎么没来？\"<\/p>\n<p>屋里静了。<\/p>\n<p>五女山那个等人的老头。等了六年，来了四十多回，专挑四月，从不让人看脸。问灯的。<\/p>\n<p>\"他怎么知道那老头？\"我脱口而出。<\/p>\n<p>\"我哪敢问。\"老周苦笑，\"我支吾了两句，他就走了。走的时候，我瞅着他背影，那步子……不像六十岁的人，倒像给腿上上了刑的，一步一步都是咬牙。\"<\/p>\n<p>\"他走哪个门？\"<\/p>\n<p>\"前门。\"老周说，\"走前门，过街口，谁也没接他。这条街上但凡有眼线的，都得看见他。他不怕看。\"<\/p>\n<p>\"要么是不怕，\"把头说，\"要么是觉着这世上已经没人认得他了。\"<\/p>\n<p>老周还想说什么，又咽了，末了憋出一句：\"他穿的褂子，洗得都发白了，可那针脚——\"他比划了一下袖口，\"我年轻时候在裁缝铺待过两年，那针脚，如今没人缝得出来。\"<\/p>\n<p>把头和我的目光碰了一下。谁也没接这个茬。<\/p>\n<p>豆芽仔把本子往怀里一收：\"哥，那句话我寻思了一道——'谁要拦它，谁就得替它背到底'。这话啥意思？\"<\/p>\n<p>\"意思是，那口锅要走的道，早就定好了。\"把头说，\"拦的，背的，都得在这条道上。咱们没得选。\"<\/p>\n<p>\"那要是不拦呢？\"<\/p>\n<p>\"不拦，它就走了。\"把头说，\"走了，咱们拿什么赴初五？名分在锅上，锅跑了，咱们就是一群顶着个空名分的活人。\"<\/p>\n<p>他没再说下去。我听得出来，这话后头还有一层他没说的——锅要是自己走了，走的那个名分，算谁的。<\/p>\n<p>回去的道上，把头又一句话不说。他把那半张黄纸夹进了本子里，本子揣在怀里，走一路，手就在胸口按一路。<\/p>\n<p>到了渡口，他站住，看着北边。<\/p>\n<p>\"豆芽仔本子上这一页，我给它起个名，叫账。\"他说，\"矮个儿买绳，瘦高个儿看水，高个儿买锁——这三样凑一块儿，是要拴东西、探水路、锁门。他们在备初五的活儿。\"<\/p>\n<p>\"酒糟鼻呢？\"<\/p>\n<p>\"酒糟鼻不一样。\"把头说，\"那三个是冲咱们来的。他不是，他是冲着锅来的。\"<\/p>\n<p>他把那半张黄纸又掏出来，就着日头看。墨点的鱼尾，笔画很旧，像是描了多少年的。<\/p>\n<p>\"他在给咱们留记号。\"把头说，\"留记号的人，是想让咱们找着他。\"<\/p>\n<p>\"找他干嘛？\"<\/p>\n<p>\"他见过那口锅怎么走。\"把头把纸收好，\"三十多年前那场灯，他是唯一看着灯亮完的人。初五之前，我得见他一面。\"<\/p>\n<p>\"上哪儿找？\"<\/p>\n<p>\"河滩。\"把头往北边看了一眼，\"睡过的草窝，烧过的纸，掐短的烟。那是个老山客的做派。老山客留记号，不会只留一处。\"<\/p>\n<p>\"可他要是冲着锅来的，他跟锅里那些事儿，沾着什么亲？\"我问。<\/p>\n<p>把头没答。他把烟袋摸出来又塞回去，像是话到嘴边，又压下去了。<\/p>\n<p>船家在渡口喊人过江。把头摆摆手没动，站了半晌，忽然自言自语似的补了一句：<\/p>\n<p>\"初五以后你们就都知道了。\"<\/p>\n<p>这话在道上颠了一路，到了雅河乡，还硌在我心里。<\/p>\n<p>进村的时候天都擦黑了。鱼哥在院门口等着，一见面就说：\"后晌有个人打村道上过，骑不着牲口，就那么走着。走到咱门口，站了站，没敲门，走了。\"<\/p>\n<p>\"长什么样？\"<\/p>\n<p>\"天太暗，看不清脸。\"鱼哥说，\"个头不高，瘦。走道儿的时候，左腿像是不利索。\"<\/p>\n<p>我和把头都没说话。<\/p>\n<p>\"你追没追？\"<\/p>\n<p>\"追了两步。\"鱼哥说，\"他拐进苞米地就没影了。那地里当晚也没露水，人走过去，愣是没压倒一棵苗——我进去转了半天，转晕了都。\"<\/p>\n<p>把头听完，进院把门闩了，回屋跟我说：\"他是来看门的。看看咱们睡没睡，院里几口人。\"<\/p>\n<p>\"看完了呢？\"<\/p>\n<p>\"看完了，就该排日子了。\"把头说，\"初一，初三，初五。人家那头也是三步棋。\"<\/p>", "plain": "天擦黑进的雅河乡，第二天一早，豆芽仔的信就到了——他托赶集的老乡捎了张字条，字条上就六个字：记满一页，速来。 把头看完字条，把烟袋往腰里一别：\"走。\" \"就为看一页账？\" \"一页账抵一箱货。\"把头说，\"他记满了一页还没人来收，说明他记着的东西他自己都嫌沉。\" 到了桓仁，没走前街，从后巷进的阿布。老周把后屋门帘一挑，脸白得跟纸似的。 \"来了？\"他把声音压得只剩气，\"这两天我这铺子，进来出去的都是生面孔，我夜里都不敢睡踏实。\" 豆芽仔坐在条凳上，面前摊着他那本破本子。一页，记得密密麻麻，字丑，但一笔是一笔，每条后头都缀着日子。 \"哥，你自个儿看。\"他往边上挪了挪。 我凑过去看。头一条：四月十九起，矮个儿来铺子两回，买麻绳，一回比一回买得多，末一回是整捆。第二条：瘦高个儿前天在北门河沿蹲了半天，看水，没买东西，蹲的是涨潮线往上的石头。第三条：高个儿买了一把铜锁，问哪儿有铸新锁的，问得仔细，问的是老样儿的锁。 把头一条一条地问，一条一条地对日子。 \"麻绳买去做什么，他问没问？\"把头指着头一条。 \"没问。\"豆芽仔说，\"人家买麻绳还要跟老周报备？\" \"我不是问那个。\"把头说，\"我是看日子。十九买一回，廿二买一回，隔三天。这是个备料的进度，不是临时起意。\" 问到第四条，他的手指在页边上停住了。 第四条往后，字忽然写得重了。 四月廿六，后晌。一个干瘦老头进店，六十往上，酒糟鼻子。不买东西，就问一句话——鹰嘴沟里那口锅，后来叫谁起走了。 \"他问的时候，我腿肚子都是软的。\"老周在后屋门口搓着手，\"我不敢接茬，就装糊涂。他不恼，站了一会儿，掏出这么个东西搁柜台上，说给背锅的留着。\" 他递过来半张黄纸。纸旧，脆，边儿上有一道火烧的旧茬，角上用墨点着一个记号——三笔两笔，一条鱼尾。 把头就着窗口的光看那纸。纸是黄表纸，裁得毛糙，墨点子洇进纸纹里，不是一天两天的墨。 \"他说，\"老周咽了口唾沫，\"他说，告诉背锅的，锅不是叫人截走的，是它自己要走的。谁要拦它，谁就得替它背到底。\" 我捏着那半张纸，指头有点凉。 锅不是叫人截走的，是它自己要走的。 出沟那晚，引路锅叫一伙人截走，这事压了我们半个多月，一直当是被人抢了。可这老头一句话，把这事翻了个个儿。 \"这老头什么来路？\"我问。 豆芽仔从本子后头又翻出一页：\"我跟了他。\" \"跟到哪儿？\" \"北门外河滩。\"他说，\"他腿脚不利索，左腿拖着走，走一段歇一段，我跟得挺稳，没叫他瞧见。到河滩他就没影了——那片柳树丛，我跟进去就找不着人了。\" \"柳树丛你没敢往深里钻？\" \"钻了两步。\"豆芽仔有点不好意思，\"那里头静得邪乎，我总觉得有人看我后脖颈子。\" 把头合不上他的本子，还在翻，忽然抬头：\"看见他往哪儿去了？\" \"没有。\"豆芽仔挠头，\"我就看见他蹲在河滩上，跟埋东西似的扒拉了几下。我以为要捡漏，凑近了，他站起来了，冲我说了一句话。\" \"说什么？\" \"他说——\"豆芽仔学得磕磕绊绊，\"小伙子，别跟了。我要办的事，三天办不完，初五以后你们就都知道了。\" \"他怎么知道你是跟咱们的？\" \"我也纳闷。\"豆芽仔说，\"我一身赶集的行头，他张嘴就叫破。\" 把头合上本子。 \"酒糟鼻。\"他慢慢说，\"三十多年前，五进两出，活着从沟里走出来的那个。\" 我知道这段旧事。当年进沟五个人，外头只等着两个人回来，结果只走回来一个酒糟鼻。打那以后，这人再没在山边露过面，听说南下讨生活，一走就是三十年。 三十年不露面，一露面，就问那口锅。 \"河滩上他埋没埋东西？\"把头问。 \"我去看了。\"豆芽仔说，\"新土倒是没有，就是柳树丛边上有一块地方，草压倒了，人睡过的样儿。边上烧过纸，灰还新。\" \"灰里有东西没有？\" \"天擦黑了，没细拣。\"豆芽仔说，\"就拣出几个烟屁。掐得都贼短，烫手了才扔的样儿。\" 把头的眉头动了一下，没说话。 老周在边上一直搓手，这时候忍不住了：\"还有个事儿，我没敢写本子上。\" \"说。\" \"那老头临出门，回头问了我一句怪话。\"老周压低声音，\"他问——五女山那个等人的老头，今年怎么没来？\" 屋里静了。 五女山那个等人的老头。等了六年，来了四十多回，专挑四月，从不让人看脸。问灯的。 \"他怎么知道那老头？\"我脱口而出。 \"我哪敢问。\"老周苦笑，\"我支吾了两句，他就走了。走的时候，我瞅着他背影，那步子……不像六十岁的人，倒像给腿上上了刑的，一步一步都是咬牙。\" \"他走哪个门？\" \"前门。\"老周说，\"走前门，过街口，谁也没接他。这条街上但凡有眼线的，都得看见他。他不怕看。\" \"要么是不怕，\"把头说，\"要么是觉着这世上已经没人认得他了。\" 老周还想说什么，又咽了，末了憋出一句：\"他穿的褂子，洗得都发白了，可那针脚——\"他比划了一下袖口，\"我年轻时候在裁缝铺待过两年，那针脚，如今没人缝得出来。\" 把头和我的目光碰了一下。谁也没接这个茬。 豆芽仔把本子往怀里一收：\"哥，那句话我寻思了一道——'谁要拦它，谁就得替它背到底'。这话啥意思？\" \"意思是，那口锅要走的道，早就定好了。\"把头说，\"拦的，背的，都得在这条道上。咱们没得选。\" \"那要是不拦呢？\" \"不拦，它就走了。\"把头说，\"走了，咱们拿什么赴初五？名分在锅上，锅跑了，咱们就是一群顶着个空名分的活人。\" 他没再说下去。我听得出来，这话后头还有一层他没说的——锅要是自己走了，走的那个名分，算谁的。 回去的道上，把头又一句话不说。他把那半张黄纸夹进了本子里，本子揣在怀里，走一路，手就在胸口按一路。 到了渡口，他站住，看着北边。 \"豆芽仔本子上这一页，我给它起个名，叫账。\"他说，\"矮个儿买绳，瘦高个儿看水，高个儿买锁——这三样凑一块儿，是要拴东西、探水路、锁门。他们在备初五的活儿。\" \"酒糟鼻呢？\" \"酒糟鼻不一样。\"把头说，\"那三个是冲咱们来的。他不是，他是冲着锅来的。\" 他把那半张黄纸又掏出来，就着日头看。墨点的鱼尾，笔画很旧，像是描了多少年的。 \"他在给咱们留记号。\"把头说，\"留记号的人，是想让咱们找着他。\" \"找他干嘛？\" \"他见过那口锅怎么走。\"把头把纸收好，\"三十多年前那场灯，他是唯一看着灯亮完的人。初五之前，我得见他一面。\" \"上哪儿找？\" \"河滩。\"把头往北边看了一眼，\"睡过的草窝，烧过的纸，掐短的烟。那是个老山客的做派。老山客留记号，不会只留一处。\" \"可他要是冲着锅来的，他跟锅里那些事儿，沾着什么亲？\"我问。 把头没答。他把烟袋摸出来又塞回去，像是话到嘴边，又压下去了。 船家在渡口喊人过江。把头摆摆手没动，站了半晌，忽然自言自语似的补了一句： \"初五以后你们就都知道了。\" 这话在道上颠了一路，到了雅河乡，还硌在我心里。 进村的时候天都擦黑了。鱼哥在院门口等着，一见面就说：\"后晌有个人打村道上过，骑不着牲口，就那么走着。走到咱门口，站了站，没敲门，走了。\" \"长什么样？\" \"天太暗，看不清脸。\"鱼哥说，\"个头不高，瘦。走道儿的时候，左腿像是不利索。\" 我和把头都没说话。 \"你追没追？\" \"追了两步。\"鱼哥说，\"他拐进苞米地就没影了。那地里当晚也没露水，人走过去，愣是没压倒一棵苗——我进去转了半天，转晕了都。\" 把头听完，进院把门闩了，回屋跟我说：\"他是来看门的。看看咱们睡没睡，院里几口人。\" \"看完了呢？\" \"看完了，就该排日子了。\"把头说，\"初一，初三，初五。人家那头也是三步棋。\""}, {"id": "A5-093", "arc": "A5", "num": 93, "title": "走锅", "md": "四月廿七，夜里起了南风。\n\n天没黑透，把头就把院子前后走了一遍。院墙东南角塌了半截，他搬了两块土坯顶着，又把柴垛往边上挪了挪，腾出一条能走人的暗影。做完这些，他站在院当间，听了一阵风。\n\n\"今晚你守偏屋。\"他跟我说。\n\n\"守锅？\"\n\n\"守锅，也守夜。\"他把烟袋点着，\"这些天王瘸子那边没动静，桓仁那边倒是越来越热闹。热闹到头了，就该轮到咱们这院了。\"\n\n他把小萱和鱼哥都叫到跟前，立了三条规矩：夜里听见什么动静，不许出屋；不许点灯；要是听见院里有人说话，不管说的是什么，天亮之前不许提。\n\n小萱应得快，鱼哥应得慢。他把黑鸡抱起来，掂了掂：\"鸡呢？\"\n\n\"鸡随你。\"把头说，\"它要是炸毛，你就知道有人来了——它比你灵。\"\n\n我把铺盖搬进偏屋，靠着土坑边上铺下。坑里那口锅扣着，草席盖着，草席上压着两块土坯。我伸手进去摸了摸锅底，凉的，鱼尾纹一道一道，跟白天没有两样。\n\n偏屋没有窗，只在门头上留着一个透气的窟窿。我吹了灯，和衣躺下，睁着眼看那窟窿里透进来的一点天光。\n\n前半夜什么动静都没有。院里黑鸡卧在窝里，脑袋插在翅膀底下，睡得很沉。南风一阵一阵的，吹得空蜂箱嗡嗡地响，响一阵，停一阵。我数着蜂箱的响声，数着数着就迷糊过去了。\n\n迷糊里过了一阵，前屋门轻响，把头过来换我。他在坑边的矮凳上坐下，把契又递回我手里：\"攥着睡。手心里有东西，觉轻。\"\n\n\"您也歇会儿？\"\n\n\"老了，觉少。\"他说，\"你后半夜顶上。\"\n\n他出去的时候，顺手把黑鸡的窝往正屋那边又拖了半步。鸡没叫，窝底刮着地皮，沙沙两声，就又静了。院里只剩下风。风从南边来，过了院墙，卷着苇塘的腥气，在空蜂箱的口上打着旋儿。\n\n我又数蜂箱的响声。数到一半，觉出不对——蜂箱的响，跟着风走；可这会儿风没停，蜂箱却一个一个哑下去了，像有谁挨着个儿按住了箱口。\n\n变故是后半夜来的。\n\n先是黑鸡。它忽然从窝里站起来了，脖子抻得直直的，冲着偏屋这边，一动不动。我隔着门缝看了它一眼，它不看我了，就那么站着，毛一根一根炸起来。\n\n跟着我就听见了。\n\n嗡——\n\n不是蜂。蜂房早就没有蜂了。那声音是从土坑底下出来的，闷闷的，像一口大瓮里捂着一窝活物，拱着，拱着，要出来。\n\n我一骨碌爬起来，凑到坑边，掀开草席一角。\n\n锅在颤。\n\n不是风吹的颤。是锅自己，贴着土，一颤一颤，颤得坑沿的土簌簌往下掉。我把手按在锅身上，一股凉气顺着掌心往胳膊上爬。那凉气里带着一股腥味，不是鱼腥，是沟里石头的腥，黑的，沉的。\n\n我把手缩回来，手心里一层潮。\n\n身后脚步声，把头进来了，披着褂子，鞋都没穿响。\n\n\"别拦。\"他站在坑边上，声音很稳，\"它要走，你拦不住。它不走，你叫破天也没用。\"\n\n\"它这是要走？\"\n\n\"它这是想走。\"把头蹲下来，看着那口锅，像看一头牲口，\"想走的，未必走得了。\"\n\n\"差什么？\"\n\n\"差个由头。\"他说，\"也可能差个人。\"\n\n他从怀里把契摸出来，递给我。无字的阴契，入手沉，边角那道压模的鱼尾纹硌着指头。\n\n\"要是它真要起来，你把契按在锅沿上。\"把头说，\"契是名，锅认名。名按住了，它走也走不踏实。\"\n\n\"走不踏实，是好事？\"\n\n\"是好事。\"他说，\"走得不踏实的锅，到了地方也立不住。咱们要的不是拴死它，是让它带赖着走——赖着走的，心里还认着主。\"\n\n我们爷俩就这么守着。锅颤了小半个时辰，声音一点点弱下去，跟喘气喘匀了似的。黑鸡不知什么时候蹲回去了，毛还炸着，但不叫了。\n\n\"把头，\"我低声问，\"要是它真走了，咱们拿什么赴初五？\"\n\n\"拿命。\"把头说，\"账在谁头上，谁就得把差事应下来。锅走了，锅是山上的；人还在，人还是背锅的。\"\n\n这话说的，比锅还凉。\n\n天蒙蒙亮的时候，锅彻底静了。风也停了，蜂箱一声不响，天光从门头那个窟窿里漏进来，一线灰白。\n\n小萱在院里生火，拉风匣的声音一下一下的，跟没事人一样。鱼哥蹲在门槛上看着那半个塌墙角，看了半天，起身从柴垛上抽了几根硬柴，横七竖八地别在那儿。\n\n\"别这儿干嘛？\"我问。\n\n\"绊脚。\"他说，\"绊不着贼，能绊着个响儿也行。\"\n\n把头绕着坑走了一圈，蹲在东边，盯着坑沿的土看。我顺着他的目光看过去——坑边的浮土上，一个膝盖印。很深，朝着锅。\n\n\"夜里有人进来了。\"我说。\n\n\"进了不止一会儿。\"把头伸手比了比膝盖印的深浅，\"跪着。跪了不短。这个印子窄，是个瘦人，身量不高。\"\n\n\"院墙那么高——\"\n\n\"塌的那半截。\"他把头说，\"我拿土坯顶着，是怕它真塌下来出声。人家从那儿进来，没碰倒一块坯。\"\n\n掀开草席，锅没挪地方，还是扣在原处。可锅沿上，一圈一圈，挂着黑泥。\n\n我捻了一点，搁在指尖上搓。黑的，油亮，带着腥气，对着天光看，泥里头有极细的亮星。这泥我认得——鹰嘴沟石室里那种，离这儿隔着两道梁。这泥新鲜得很，边上的还软着。\n\n\"有人夜里摸了锅。\"我说，\"摸完还把席子给盖好了。\"\n\n\"嗯。\"\n\n\"是谁？\"\n\n把头没答。他蹲在那儿，看那圈黑泥，看了很久。\n\n\"摸过这口锅的手，不止一双。\"他慢慢说，\"掌灯的摸过，做信的摸过，我摸过，你也摸过。可夜里敢进这个院，跪下来摸锅，摸完了还给盖好席子的——\"\n\n他没说下去，站起来，拍了拍裤子上的土。\n\n鱼哥在门口站着，抱着胳膊，脸色不好看。他夜里就睡在前头正屋，隔着一道院，怀里还搂着黑鸡。\n\n\"把头，哥。\"他开口，声音发干，\"后半夜我听见外头有人说话。\"\n\n我和把头同时看过去。\n\n\"就一句。\"鱼哥说，\"'再等等，还没到时候。'\"\n\n\"听清是谁的声没有？\"\n\n\"听不清。\"鱼哥摇头，\"声不高，压着的。男的，岁数不小——尾音是哑的。我起来看的时候，院里没人，黑鸡蹲窝了。\"\n\n\"黑鸡几时蹲的窝？\"\n\n\"我出来它就蹲了。\"鱼哥说，\"炸完毛，它就蹲下了，跟没事人似的。\"\n\n\"那声话是从哪个方向来的？\"我问。\n\n\"正北。\"鱼哥指了指，\"院墙塌的那头。\"\n\n把头的目光在塌墙那半截上停了停，什么也没说。\n\n他看了鱼哥很久。我看得出来，他在掂量——哪些话能说，哪些话不能说。最后他把话咽了，只说了一句：\n\n\"今儿白天，锅别离人。晚上我守前半夜，你守后半夜。\"\n\n鱼哥应了，转身去收拾偏屋的铺盖。走出门槛的时候，他回头看了一眼那个土坑，眼神我从来没见过——那不是看一口锅的眼神，是看一个人的。\n\n把头在院里站着，等鱼哥走远了，才低声跟我说：\n\n\"跪着摸锅，摸完盖席，临走留一句'再等等'。\"他往北边看了一眼，\"这不是来偷的，也不是来害的。\"\n\n\"那是什么？\"\n\n\"是来送信的。\"把头说，\"锅自己想走，有人不想让它走。他来给锅带话——再等等。\"\n\n我心里一沉：\"等什么？\"\n\n\"等初五？\"把头摇摇头，又像是自己推翻了自己，\"不对。要是等初五，他犯不着夜里来跪这一回。\"\n\n他把那圈黑泥抠了一点下来，包进纸里，揣好。\n\n\"这泥得对着光验。\"他说，\"里头要是有亮星，就是盟坛里的老泥；要是没有，就是有人从沟外头挖了土，拿它当记号使——那性质就两样了。\"\n\n\"怎么个两样法？\"\n\n\"老泥是山里的东西，带过来是敬。\"把头说，\"外头的土冒充山里的泥，是探。探咱们认不认货。\"\n\n\"咱们认。\"\n\n\"咱们认，他就知道这口锅在咱们手里养熟了。\"把头说，\"熟锅难抢。他夜里来这一趟，也是在掂量这个。\"\n\n他望着北边那道山影，半晌，说了一句我没听懂的话：\n\n\"初五之前的那个初一，才是坎。\"", "words": 2834, "html": "<p>四月廿七，夜里起了南风。<\/p>\n<p>天没黑透，把头就把院子前后走了一遍。院墙东南角塌了半截，他搬了两块土坯顶着，又把柴垛往边上挪了挪，腾出一条能走人的暗影。做完这些，他站在院当间，听了一阵风。<\/p>\n<p>\"今晚你守偏屋。\"他跟我说。<\/p>\n<p>\"守锅？\"<\/p>\n<p>\"守锅，也守夜。\"他把烟袋点着，\"这些天王瘸子那边没动静，桓仁那边倒是越来越热闹。热闹到头了，就该轮到咱们这院了。\"<\/p>\n<p>他把小萱和鱼哥都叫到跟前，立了三条规矩：夜里听见什么动静，不许出屋；不许点灯；要是听见院里有人说话，不管说的是什么，天亮之前不许提。<\/p>\n<p>小萱应得快，鱼哥应得慢。他把黑鸡抱起来，掂了掂：\"鸡呢？\"<\/p>\n<p>\"鸡随你。\"把头说，\"它要是炸毛，你就知道有人来了——它比你灵。\"<\/p>\n<p>我把铺盖搬进偏屋，靠着土坑边上铺下。坑里那口锅扣着，草席盖着，草席上压着两块土坯。我伸手进去摸了摸锅底，凉的，鱼尾纹一道一道，跟白天没有两样。<\/p>\n<p>偏屋没有窗，只在门头上留着一个透气的窟窿。我吹了灯，和衣躺下，睁着眼看那窟窿里透进来的一点天光。<\/p>\n<p>前半夜什么动静都没有。院里黑鸡卧在窝里，脑袋插在翅膀底下，睡得很沉。南风一阵一阵的，吹得空蜂箱嗡嗡地响，响一阵，停一阵。我数着蜂箱的响声，数着数着就迷糊过去了。<\/p>\n<p>迷糊里过了一阵，前屋门轻响，把头过来换我。他在坑边的矮凳上坐下，把契又递回我手里：\"攥着睡。手心里有东西，觉轻。\"<\/p>\n<p>\"您也歇会儿？\"<\/p>\n<p>\"老了，觉少。\"他说，\"你后半夜顶上。\"<\/p>\n<p>他出去的时候，顺手把黑鸡的窝往正屋那边又拖了半步。鸡没叫，窝底刮着地皮，沙沙两声，就又静了。院里只剩下风。风从南边来，过了院墙，卷着苇塘的腥气，在空蜂箱的口上打着旋儿。<\/p>\n<p>我又数蜂箱的响声。数到一半，觉出不对——蜂箱的响，跟着风走；可这会儿风没停，蜂箱却一个一个哑下去了，像有谁挨着个儿按住了箱口。<\/p>\n<p>变故是后半夜来的。<\/p>\n<p>先是黑鸡。它忽然从窝里站起来了，脖子抻得直直的，冲着偏屋这边，一动不动。我隔着门缝看了它一眼，它不看我了，就那么站着，毛一根一根炸起来。<\/p>\n<p>跟着我就听见了。<\/p>\n<p>嗡——<\/p>\n<p>不是蜂。蜂房早就没有蜂了。那声音是从土坑底下出来的，闷闷的，像一口大瓮里捂着一窝活物，拱着，拱着，要出来。<\/p>\n<p>我一骨碌爬起来，凑到坑边，掀开草席一角。<\/p>\n<p>锅在颤。<\/p>\n<p>不是风吹的颤。是锅自己，贴着土，一颤一颤，颤得坑沿的土簌簌往下掉。我把手按在锅身上，一股凉气顺着掌心往胳膊上爬。那凉气里带着一股腥味，不是鱼腥，是沟里石头的腥，黑的，沉的。<\/p>\n<p>我把手缩回来，手心里一层潮。<\/p>\n<p>身后脚步声，把头进来了，披着褂子，鞋都没穿响。<\/p>\n<p>\"别拦。\"他站在坑边上，声音很稳，\"它要走，你拦不住。它不走，你叫破天也没用。\"<\/p>\n<p>\"它这是要走？\"<\/p>\n<p>\"它这是想走。\"把头蹲下来，看着那口锅，像看一头牲口，\"想走的，未必走得了。\"<\/p>\n<p>\"差什么？\"<\/p>\n<p>\"差个由头。\"他说，\"也可能差个人。\"<\/p>\n<p>他从怀里把契摸出来，递给我。无字的阴契，入手沉，边角那道压模的鱼尾纹硌着指头。<\/p>\n<p>\"要是它真要起来，你把契按在锅沿上。\"把头说，\"契是名，锅认名。名按住了，它走也走不踏实。\"<\/p>\n<p>\"走不踏实，是好事？\"<\/p>\n<p>\"是好事。\"他说，\"走得不踏实的锅，到了地方也立不住。咱们要的不是拴死它，是让它带赖着走——赖着走的，心里还认着主。\"<\/p>\n<p>我们爷俩就这么守着。锅颤了小半个时辰，声音一点点弱下去，跟喘气喘匀了似的。黑鸡不知什么时候蹲回去了，毛还炸着，但不叫了。<\/p>\n<p>\"把头，\"我低声问，\"要是它真走了，咱们拿什么赴初五？\"<\/p>\n<p>\"拿命。\"把头说，\"账在谁头上，谁就得把差事应下来。锅走了，锅是山上的；人还在，人还是背锅的。\"<\/p>\n<p>这话说的，比锅还凉。<\/p>\n<p>天蒙蒙亮的时候，锅彻底静了。风也停了，蜂箱一声不响，天光从门头那个窟窿里漏进来，一线灰白。<\/p>\n<p>小萱在院里生火，拉风匣的声音一下一下的，跟没事人一样。鱼哥蹲在门槛上看着那半个塌墙角，看了半天，起身从柴垛上抽了几根硬柴，横七竖八地别在那儿。<\/p>\n<p>\"别这儿干嘛？\"我问。<\/p>\n<p>\"绊脚。\"他说，\"绊不着贼，能绊着个响儿也行。\"<\/p>\n<p>把头绕着坑走了一圈，蹲在东边，盯着坑沿的土看。我顺着他的目光看过去——坑边的浮土上，一个膝盖印。很深，朝着锅。<\/p>\n<p>\"夜里有人进来了。\"我说。<\/p>\n<p>\"进了不止一会儿。\"把头伸手比了比膝盖印的深浅，\"跪着。跪了不短。这个印子窄，是个瘦人，身量不高。\"<\/p>\n<p>\"院墙那么高——\"<\/p>\n<p>\"塌的那半截。\"他把头说，\"我拿土坯顶着，是怕它真塌下来出声。人家从那儿进来，没碰倒一块坯。\"<\/p>\n<p>掀开草席，锅没挪地方，还是扣在原处。可锅沿上，一圈一圈，挂着黑泥。<\/p>\n<p>我捻了一点，搁在指尖上搓。黑的，油亮，带着腥气，对着天光看，泥里头有极细的亮星。这泥我认得——鹰嘴沟石室里那种，离这儿隔着两道梁。这泥新鲜得很，边上的还软着。<\/p>\n<p>\"有人夜里摸了锅。\"我说，\"摸完还把席子给盖好了。\"<\/p>\n<p>\"嗯。\"<\/p>\n<p>\"是谁？\"<\/p>\n<p>把头没答。他蹲在那儿，看那圈黑泥，看了很久。<\/p>\n<p>\"摸过这口锅的手，不止一双。\"他慢慢说，\"掌灯的摸过，做信的摸过，我摸过，你也摸过。可夜里敢进这个院，跪下来摸锅，摸完了还给盖好席子的——\"<\/p>\n<p>他没说下去，站起来，拍了拍裤子上的土。<\/p>\n<p>鱼哥在门口站着，抱着胳膊，脸色不好看。他夜里就睡在前头正屋，隔着一道院，怀里还搂着黑鸡。<\/p>\n<p>\"把头，哥。\"他开口，声音发干，\"后半夜我听见外头有人说话。\"<\/p>\n<p>我和把头同时看过去。<\/p>\n<p>\"就一句。\"鱼哥说，\"'再等等，还没到时候。'\"<\/p>\n<p>\"听清是谁的声没有？\"<\/p>\n<p>\"听不清。\"鱼哥摇头，\"声不高，压着的。男的，岁数不小——尾音是哑的。我起来看的时候，院里没人，黑鸡蹲窝了。\"<\/p>\n<p>\"黑鸡几时蹲的窝？\"<\/p>\n<p>\"我出来它就蹲了。\"鱼哥说，\"炸完毛，它就蹲下了，跟没事人似的。\"<\/p>\n<p>\"那声话是从哪个方向来的？\"我问。<\/p>\n<p>\"正北。\"鱼哥指了指，\"院墙塌的那头。\"<\/p>\n<p>把头的目光在塌墙那半截上停了停，什么也没说。<\/p>\n<p>他看了鱼哥很久。我看得出来，他在掂量——哪些话能说，哪些话不能说。最后他把话咽了，只说了一句：<\/p>\n<p>\"今儿白天，锅别离人。晚上我守前半夜，你守后半夜。\"<\/p>\n<p>鱼哥应了，转身去收拾偏屋的铺盖。走出门槛的时候，他回头看了一眼那个土坑，眼神我从来没见过——那不是看一口锅的眼神，是看一个人的。<\/p>\n<p>把头在院里站着，等鱼哥走远了，才低声跟我说：<\/p>\n<p>\"跪着摸锅，摸完盖席，临走留一句'再等等'。\"他往北边看了一眼，\"这不是来偷的，也不是来害的。\"<\/p>\n<p>\"那是什么？\"<\/p>\n<p>\"是来送信的。\"把头说，\"锅自己想走，有人不想让它走。他来给锅带话——再等等。\"<\/p>\n<p>我心里一沉：\"等什么？\"<\/p>\n<p>\"等初五？\"把头摇摇头，又像是自己推翻了自己，\"不对。要是等初五，他犯不着夜里来跪这一回。\"<\/p>\n<p>他把那圈黑泥抠了一点下来，包进纸里，揣好。<\/p>\n<p>\"这泥得对着光验。\"他说，\"里头要是有亮星，就是盟坛里的老泥；要是没有，就是有人从沟外头挖了土，拿它当记号使——那性质就两样了。\"<\/p>\n<p>\"怎么个两样法？\"<\/p>\n<p>\"老泥是山里的东西，带过来是敬。\"把头说，\"外头的土冒充山里的泥，是探。探咱们认不认货。\"<\/p>\n<p>\"咱们认。\"<\/p>\n<p>\"咱们认，他就知道这口锅在咱们手里养熟了。\"把头说，\"熟锅难抢。他夜里来这一趟，也是在掂量这个。\"<\/p>\n<p>他望着北边那道山影，半晌，说了一句我没听懂的话：<\/p>\n<p>\"初五之前的那个初一，才是坎。\"<\/p>", "plain": "四月廿七，夜里起了南风。 天没黑透，把头就把院子前后走了一遍。院墙东南角塌了半截，他搬了两块土坯顶着，又把柴垛往边上挪了挪，腾出一条能走人的暗影。做完这些，他站在院当间，听了一阵风。 \"今晚你守偏屋。\"他跟我说。 \"守锅？\" \"守锅，也守夜。\"他把烟袋点着，\"这些天王瘸子那边没动静，桓仁那边倒是越来越热闹。热闹到头了，就该轮到咱们这院了。\" 他把小萱和鱼哥都叫到跟前，立了三条规矩：夜里听见什么动静，不许出屋；不许点灯；要是听见院里有人说话，不管说的是什么，天亮之前不许提。 小萱应得快，鱼哥应得慢。他把黑鸡抱起来，掂了掂：\"鸡呢？\" \"鸡随你。\"把头说，\"它要是炸毛，你就知道有人来了——它比你灵。\" 我把铺盖搬进偏屋，靠着土坑边上铺下。坑里那口锅扣着，草席盖着，草席上压着两块土坯。我伸手进去摸了摸锅底，凉的，鱼尾纹一道一道，跟白天没有两样。 偏屋没有窗，只在门头上留着一个透气的窟窿。我吹了灯，和衣躺下，睁着眼看那窟窿里透进来的一点天光。 前半夜什么动静都没有。院里黑鸡卧在窝里，脑袋插在翅膀底下，睡得很沉。南风一阵一阵的，吹得空蜂箱嗡嗡地响，响一阵，停一阵。我数着蜂箱的响声，数着数着就迷糊过去了。 迷糊里过了一阵，前屋门轻响，把头过来换我。他在坑边的矮凳上坐下，把契又递回我手里：\"攥着睡。手心里有东西，觉轻。\" \"您也歇会儿？\" \"老了，觉少。\"他说，\"你后半夜顶上。\" 他出去的时候，顺手把黑鸡的窝往正屋那边又拖了半步。鸡没叫，窝底刮着地皮，沙沙两声，就又静了。院里只剩下风。风从南边来，过了院墙，卷着苇塘的腥气，在空蜂箱的口上打着旋儿。 我又数蜂箱的响声。数到一半，觉出不对——蜂箱的响，跟着风走；可这会儿风没停，蜂箱却一个一个哑下去了，像有谁挨着个儿按住了箱口。 变故是后半夜来的。 先是黑鸡。它忽然从窝里站起来了，脖子抻得直直的，冲着偏屋这边，一动不动。我隔着门缝看了它一眼，它不看我了，就那么站着，毛一根一根炸起来。 跟着我就听见了。 嗡—— 不是蜂。蜂房早就没有蜂了。那声音是从土坑底下出来的，闷闷的，像一口大瓮里捂着一窝活物，拱着，拱着，要出来。 我一骨碌爬起来，凑到坑边，掀开草席一角。 锅在颤。 不是风吹的颤。是锅自己，贴着土，一颤一颤，颤得坑沿的土簌簌往下掉。我把手按在锅身上，一股凉气顺着掌心往胳膊上爬。那凉气里带着一股腥味，不是鱼腥，是沟里石头的腥，黑的，沉的。 我把手缩回来，手心里一层潮。 身后脚步声，把头进来了，披着褂子，鞋都没穿响。 \"别拦。\"他站在坑边上，声音很稳，\"它要走，你拦不住。它不走，你叫破天也没用。\" \"它这是要走？\" \"它这是想走。\"把头蹲下来，看着那口锅，像看一头牲口，\"想走的，未必走得了。\" \"差什么？\" \"差个由头。\"他说，\"也可能差个人。\" 他从怀里把契摸出来，递给我。无字的阴契，入手沉，边角那道压模的鱼尾纹硌着指头。 \"要是它真要起来，你把契按在锅沿上。\"把头说，\"契是名，锅认名。名按住了，它走也走不踏实。\" \"走不踏实，是好事？\" \"是好事。\"他说，\"走得不踏实的锅，到了地方也立不住。咱们要的不是拴死它，是让它带赖着走——赖着走的，心里还认着主。\" 我们爷俩就这么守着。锅颤了小半个时辰，声音一点点弱下去，跟喘气喘匀了似的。黑鸡不知什么时候蹲回去了，毛还炸着，但不叫了。 \"把头，\"我低声问，\"要是它真走了，咱们拿什么赴初五？\" \"拿命。\"把头说，\"账在谁头上，谁就得把差事应下来。锅走了，锅是山上的；人还在，人还是背锅的。\" 这话说的，比锅还凉。 天蒙蒙亮的时候，锅彻底静了。风也停了，蜂箱一声不响，天光从门头那个窟窿里漏进来，一线灰白。 小萱在院里生火，拉风匣的声音一下一下的，跟没事人一样。鱼哥蹲在门槛上看着那半个塌墙角，看了半天，起身从柴垛上抽了几根硬柴，横七竖八地别在那儿。 \"别这儿干嘛？\"我问。 \"绊脚。\"他说，\"绊不着贼，能绊着个响儿也行。\" 把头绕着坑走了一圈，蹲在东边，盯着坑沿的土看。我顺着他的目光看过去——坑边的浮土上，一个膝盖印。很深，朝着锅。 \"夜里有人进来了。\"我说。 \"进了不止一会儿。\"把头伸手比了比膝盖印的深浅，\"跪着。跪了不短。这个印子窄，是个瘦人，身量不高。\" \"院墙那么高——\" \"塌的那半截。\"他把头说，\"我拿土坯顶着，是怕它真塌下来出声。人家从那儿进来，没碰倒一块坯。\" 掀开草席，锅没挪地方，还是扣在原处。可锅沿上，一圈一圈，挂着黑泥。 我捻了一点，搁在指尖上搓。黑的，油亮，带着腥气，对着天光看，泥里头有极细的亮星。这泥我认得——鹰嘴沟石室里那种，离这儿隔着两道梁。这泥新鲜得很，边上的还软着。 \"有人夜里摸了锅。\"我说，\"摸完还把席子给盖好了。\" \"嗯。\" \"是谁？\" 把头没答。他蹲在那儿，看那圈黑泥，看了很久。 \"摸过这口锅的手，不止一双。\"他慢慢说，\"掌灯的摸过，做信的摸过，我摸过，你也摸过。可夜里敢进这个院，跪下来摸锅，摸完了还给盖好席子的——\" 他没说下去，站起来，拍了拍裤子上的土。 鱼哥在门口站着，抱着胳膊，脸色不好看。他夜里就睡在前头正屋，隔着一道院，怀里还搂着黑鸡。 \"把头，哥。\"他开口，声音发干，\"后半夜我听见外头有人说话。\" 我和把头同时看过去。 \"就一句。\"鱼哥说，\"'再等等，还没到时候。'\" \"听清是谁的声没有？\" \"听不清。\"鱼哥摇头，\"声不高，压着的。男的，岁数不小——尾音是哑的。我起来看的时候，院里没人，黑鸡蹲窝了。\" \"黑鸡几时蹲的窝？\" \"我出来它就蹲了。\"鱼哥说，\"炸完毛，它就蹲下了，跟没事人似的。\" \"那声话是从哪个方向来的？\"我问。 \"正北。\"鱼哥指了指，\"院墙塌的那头。\" 把头的目光在塌墙那半截上停了停，什么也没说。 他看了鱼哥很久。我看得出来，他在掂量——哪些话能说，哪些话不能说。最后他把话咽了，只说了一句： \"今儿白天，锅别离人。晚上我守前半夜，你守后半夜。\" 鱼哥应了，转身去收拾偏屋的铺盖。走出门槛的时候，他回头看了一眼那个土坑，眼神我从来没见过——那不是看一口锅的眼神，是看一个人的。 把头在院里站着，等鱼哥走远了，才低声跟我说： \"跪着摸锅，摸完盖席，临走留一句'再等等'。\"他往北边看了一眼，\"这不是来偷的，也不是来害的。\" \"那是什么？\" \"是来送信的。\"把头说，\"锅自己想走，有人不想让它走。他来给锅带话——再等等。\" 我心里一沉：\"等什么？\" \"等初五？\"把头摇摇头，又像是自己推翻了自己，\"不对。要是等初五，他犯不着夜里来跪这一回。\" 他把那圈黑泥抠了一点下来，包进纸里，揣好。 \"这泥得对着光验。\"他说，\"里头要是有亮星，就是盟坛里的老泥；要是没有，就是有人从沟外头挖了土，拿它当记号使——那性质就两样了。\" \"怎么个两样法？\" \"老泥是山里的东西，带过来是敬。\"把头说，\"外头的土冒充山里的泥，是探。探咱们认不认货。\" \"咱们认。\" \"咱们认，他就知道这口锅在咱们手里养熟了。\"把头说，\"熟锅难抢。他夜里来这一趟，也是在掂量这个。\" 他望着北边那道山影，半晌，说了一句我没听懂的话： \"初五之前的那个初一，才是坎。\""}, {"id": "A5-094", "arc": "A5", "num": 94, "title": "刻痕", "md": "四月廿八，天一亮，把头就带着我出了村，往北。\n\n露水没干。膝印出村就没了——地皮硬，留不下脚印。可把头不慌，他不看地，看树。\n\n\"夜里走路的人，不挑道，挑影子。\"他说，\"昨儿夜里南边起风，月亮让云遮一阵露一阵。他走路得躲着亮，专捡树影底下的空子钻。\"\n\n果然，出了村北的苞米地，柳树丛里就有了痕迹。草压倒了一溜，不宽，一个人的肩膀宽，专挑密的柳棵子底下过。把头顺着这溜倒草走，走一段就蹲下来看一回——看的不是脚印，是草弯下去的方向。\n\n\"腿脚不利索的人，夜里反倒走得稳。\"他说，\"一步是一步，不带踉跄的。这是走惯了夜道的腿。\"\n\n路过王瘸子家后身的时候，王瘸子正蹲在门口修蟹笼。看见我们往北走，他直起腰：\"这么早，赶山去？\"\n\n\"遛弯。\"把头头也不回。\n\n\"昨儿后半夜，\"王瘸子在他身后说，\"我听见北边河滩有动静。当是野狗刨食，起来看了看，没看见啥。\"\n\n把头站住了：\"几点？\"\n\n\"鸡叫头遍。\"\n\n把头没再问，抬脚接着走。走出去老远，他跟我说：\"鸡叫头遍，正是黑鸡炸毛那会儿。对上了。\"\n\n顺着倒草走出去二里多地，到了河边，痕迹断了。\n\n断头的地方，有一堆烧过的纸。\n\n灰都散了，风一吹就跑。豆芽仔夜里看见的就是这堆。把头蹲下去，拿根草棍拨拉着，拨得极慢，一层灰一层灰地揭。揭出半张没烧透的黄表纸，纸角压着一个印——鱼尾，墨点的，跟酒糟鼻留给老周那张上的一模一样。\n\n\"是他。\"我说。\n\n\"等会儿。\"把头拨出一样东西，捏起来对着亮看。\n\n半截烟嘴。铜的，磨得发亮，烟掐得极短，短得烫手。\n\n把头捏着那半截烟嘴，半天没动地方。河滩上的水鸟叫了两声，他也没回头。\n\n\"把头？\"\n\n\"掐烟掐到烫手才扔的人，\"他把烟嘴翻过来，凑到鼻子底下闻了闻，\"我这辈子，没见过第二个。\"\n\n\"烟嘴上能认出人来？\"\n\n\"认出的不是人，是毛病。\"他说，\"老烟枪掐烟，掐到不烫手就扔，只有一种人掐到烫手——心里搁着事，烟烧到嘴上了都不知道。\"\n\n他站起来，拍了拍裤子上的土，眼睛却还在那堆灰上。\n\n\"三十七年前，桓仁。\"他说，\"我十九岁，魇着了，人家把我领到一个老头跟前。那老头给我受镜，从头到尾没正眼看我，屋里不点灯，隔着一道帐。完了事儿，他就坐在炕沿上抽烟，一锅一锅地抽，抽到烫手，往灰里一杵，杵完那一锅，才跟我说头一句话。\"\n\n\"说的什么？\"\n\n\"他说，'娃，记住了，镜子认脸，也认命。'\"把头说，\"那时候我当他是吓唬我。\"\n\n我后脊背的汗毛立起来了。\n\n\"你这个意思——\"我把话咽了半截，\"昨儿夜里跪着摸锅的，是当年给你受镜那个人？\"\n\n\"我认纹，认人，也认烟。\"把头把那半截烟嘴揣进怀里，\"沟里那个，山上那个，我没见过他们的脸。可要是同一个人，三十年前的做派，改不了。\"\n\n\"那他摸锅干嘛？\"\n\n\"我哪知道。\"把头说，\"他给我受镜那年，我不明白。三十年了，还是不明白。\"\n\n我往四下里看。河滩，柳丛，烧纸的灰。一个三十多年前从死人堆里走出去的人，一个三十年不露面的人，昨儿夜里到咱们院里跪了一回。\n\n\"还有别的没有？\"我问。\n\n\"有。\"\n\n把头领着我进了柳树丛深处。一棵老柳，碗口粗，树皮上刻着记号——一个鱼尾，笔画深，刻旧了，边上叫人摸得发亮，不知摸了多少年。\n\n刻这个记的人，来过不止一回。摸亮的边儿，也不是一只手一天摸出来的。\n\n\"这记刻了多久了？\"我问。\n\n\"皮都包住了，十年打不住。\"把头用拇指肚蹭了蹭那道亮，\"他这些年，年年来。不进沟，就站在这儿摸摸树。\"\n\n\"摸什么？\"\n\n\"摸他那口气。\"把头说，\"人出了一档子事，一辈子缓不过来的，就得找个物件，年年摸一回。摸的不是树，是那档子事。\"\n\n摸亮的鱼尾旁边，新添了三个字。刀尖刻的，皮翻着，茬口发白，顶多两天。\n\n初一来。\n\n我盯着那三个字，心里咯噔一下。\n\n\"初一。\"我说，\"五月初一？\"\n\n\"三十多年前那场灯，就是初一晚上点的。\"把头说，\"这是他的旧日子。\"\n\n\"初一要来？来干什么？\"\n\n\"不知道。\"把头说，\"可你算算这日子——初一他来，初三咱们取油，初五灯会。三天，一步一个坎。\"\n\n\"初三跟初一隔两天，他要真冲着油来的——\"\n\n\"他不冲油。\"把头说，\"冲油的是掌灯的。他冲的是锅。\"\n\n回村的道上，谁都没说话。路过加油站，路灯杆子空着——七九那天挂白纸灯笼的地方，灯笼没了，杆子上只留着一圈叫风吹雨打磨出来的旧印子。\n\n老鼠男的摊子在加油站的背风处，摆着些针头线脑。他看见我们，也不招呼，只把手里糊了一半的白纸灯笼往身后挪了挪。\n\n把头在他摊前站住，拿起一张灶王爷看看，又放下。\n\n\"灯笼呢？\"老鼠男忽然问。\n\n\"什么灯笼？\"\n\n\"杆子上那盏。\"他说，\"谷雨那天夜里，让人摘走了。摘灯的手生，扯坏了半边——做灯的人心疼呢。\"\n\n\"谁心疼？\"\n\n老鼠男不答，低头理他的针线。理了半天，冒出一句：\"快五月了。该忙的都忙着呢，闲人也该忙了。\"\n\n把头没再问，丢下几个钱，拿了那张灶王爷走了。走出老远，他跟我说：\"他这话是说给咱们听的。摘灯的，不是他。\"\n\n\"他知道谁摘的？\"\n\n\"他知道，就不能说。\"把头说，\"传话的要是把话传成了情报，他就不是传话的了。\"\n\n快进村的时候，把头站住了。\n\n\"豆芽仔那儿有句实话，我得跟你交个底。\"他说，\"矮个儿买绳，高个儿买锁，瘦高个儿看水。这三样，是拴、是锁、是探路。人家在备家伙，咱们备什么？\"\n\n\"您说。\"\n\n\"咱们那口锅，夜里自己想走。\"他看着我，\"真到了初一初五，它是帮咱们，还是帮他们，你知道吗？\"\n\n我张了张嘴，没答上来。\n\n\"不知道就对了。\"把头说，\"连它自己都不知道。\"\n\n当天后晌，把头做了三件事。\n\n头一件，让鱼哥把黑鸡挪进正屋，说夜里鸡炸毛，是替人守夜，白日里得让人歇。鱼哥嘴上应着，抱鸡的时候嘟囔了一句：\"它比咱们院里哪个都明白。\"\n\n第二件，把做信人给的铜模和那张旧纸，从蜂房柜子里取出来。他把褥子拆开一角，东西裹进毡里，缝进我褥子靠腰的那一侧，针脚走得又密又匀。\n\n\"契在身上，模在褥子里。\"他说，\"真到了那一步，人跑了，东西不丢。\"\n\n第三件，他把酒糟鼻那半张黄纸压在佛龛底下，压的时候端端正正，念叨了一句：\n\n\"你要真想让咱们找着你，初一夜里，就在柳树丛等。\"\n\n小萱在边上听着，没敢问。等把头走了，她才低声跟我说：\"哥，佛龛底下能压这个吗？\"\n\n\"他不是压给佛看的。\"我说，\"是压给咱们看的。\"\n\n她哦了一声，转身要去添火，走了两步又回来，声音压得更低：\"哥，昨儿夜里我起来添柴，看见院墙塌那儿——土坯上头搭着个东西。我拿灯一照，是只鞋。就一只，搭在坯上头。我给拿开了，没敢跟你们说。\"\n\n\"什么样的鞋？\"\n\n\"布鞋。\"她说，\"底子快磨穿了，可干净，没泥。\"\n\n夜里进来的人，鞋上不带泥。不是绕着水走，是提着鞋走的。\n\n我把这话跟把头说了。他听完，半天没言语，末了说了一句：\"提鞋翻墙的，是山里的礼数。他这是把自己当客，不当贼。\"\n\n天黑以后，豆芽仔又捎来了信。这回的信短，就一句话——\n\n桓仁铺子里，今天来了个生人，不买东西，站了半天，临走问了一句：你们掌柜的，是不是打算过江？\n\n把头听完，把烟袋在鞋底上磕了磕。\n\n\"过江。\"他说，\"初三取油，走的就是水路。人家连咱们怎么走都摸着了。\"\n\n\"那还去？\"\n\n\"去。\"他把烟袋别进腰里，\"油不在咱们手里，锅不听咱们的话，人就站在明处等着咱们。越是这样，越得去。\"\n\n\"初一夜里呢？\"\n\n\"初一夜里，\"他往北边看了一眼，夜里的山影黑沉沉的，压着江那边，\"我倒要会会这个掐烟的。\"", "words": 2902, "html": "<p>四月廿八，天一亮，把头就带着我出了村，往北。<\/p>\n<p>露水没干。膝印出村就没了——地皮硬，留不下脚印。可把头不慌，他不看地，看树。<\/p>\n<p>\"夜里走路的人，不挑道，挑影子。\"他说，\"昨儿夜里南边起风，月亮让云遮一阵露一阵。他走路得躲着亮，专捡树影底下的空子钻。\"<\/p>\n<p>果然，出了村北的苞米地，柳树丛里就有了痕迹。草压倒了一溜，不宽，一个人的肩膀宽，专挑密的柳棵子底下过。把头顺着这溜倒草走，走一段就蹲下来看一回——看的不是脚印，是草弯下去的方向。<\/p>\n<p>\"腿脚不利索的人，夜里反倒走得稳。\"他说，\"一步是一步，不带踉跄的。这是走惯了夜道的腿。\"<\/p>\n<p>路过王瘸子家后身的时候，王瘸子正蹲在门口修蟹笼。看见我们往北走，他直起腰：\"这么早，赶山去？\"<\/p>\n<p>\"遛弯。\"把头头也不回。<\/p>\n<p>\"昨儿后半夜，\"王瘸子在他身后说，\"我听见北边河滩有动静。当是野狗刨食，起来看了看，没看见啥。\"<\/p>\n<p>把头站住了：\"几点？\"<\/p>\n<p>\"鸡叫头遍。\"<\/p>\n<p>把头没再问，抬脚接着走。走出去老远，他跟我说：\"鸡叫头遍，正是黑鸡炸毛那会儿。对上了。\"<\/p>\n<p>顺着倒草走出去二里多地，到了河边，痕迹断了。<\/p>\n<p>断头的地方，有一堆烧过的纸。<\/p>\n<p>灰都散了，风一吹就跑。豆芽仔夜里看见的就是这堆。把头蹲下去，拿根草棍拨拉着，拨得极慢，一层灰一层灰地揭。揭出半张没烧透的黄表纸，纸角压着一个印——鱼尾，墨点的，跟酒糟鼻留给老周那张上的一模一样。<\/p>\n<p>\"是他。\"我说。<\/p>\n<p>\"等会儿。\"把头拨出一样东西，捏起来对着亮看。<\/p>\n<p>半截烟嘴。铜的，磨得发亮，烟掐得极短，短得烫手。<\/p>\n<p>把头捏着那半截烟嘴，半天没动地方。河滩上的水鸟叫了两声，他也没回头。<\/p>\n<p>\"把头？\"<\/p>\n<p>\"掐烟掐到烫手才扔的人，\"他把烟嘴翻过来，凑到鼻子底下闻了闻，\"我这辈子，没见过第二个。\"<\/p>\n<p>\"烟嘴上能认出人来？\"<\/p>\n<p>\"认出的不是人，是毛病。\"他说，\"老烟枪掐烟，掐到不烫手就扔，只有一种人掐到烫手——心里搁着事，烟烧到嘴上了都不知道。\"<\/p>\n<p>他站起来，拍了拍裤子上的土，眼睛却还在那堆灰上。<\/p>\n<p>\"三十七年前，桓仁。\"他说，\"我十九岁，魇着了，人家把我领到一个老头跟前。那老头给我受镜，从头到尾没正眼看我，屋里不点灯，隔着一道帐。完了事儿，他就坐在炕沿上抽烟，一锅一锅地抽，抽到烫手，往灰里一杵，杵完那一锅，才跟我说头一句话。\"<\/p>\n<p>\"说的什么？\"<\/p>\n<p>\"他说，'娃，记住了，镜子认脸，也认命。'\"把头说，\"那时候我当他是吓唬我。\"<\/p>\n<p>我后脊背的汗毛立起来了。<\/p>\n<p>\"你这个意思——\"我把话咽了半截，\"昨儿夜里跪着摸锅的，是当年给你受镜那个人？\"<\/p>\n<p>\"我认纹，认人，也认烟。\"把头把那半截烟嘴揣进怀里，\"沟里那个，山上那个，我没见过他们的脸。可要是同一个人，三十年前的做派，改不了。\"<\/p>\n<p>\"那他摸锅干嘛？\"<\/p>\n<p>\"我哪知道。\"把头说，\"他给我受镜那年，我不明白。三十年了，还是不明白。\"<\/p>\n<p>我往四下里看。河滩，柳丛，烧纸的灰。一个三十多年前从死人堆里走出去的人，一个三十年不露面的人，昨儿夜里到咱们院里跪了一回。<\/p>\n<p>\"还有别的没有？\"我问。<\/p>\n<p>\"有。\"<\/p>\n<p>把头领着我进了柳树丛深处。一棵老柳，碗口粗，树皮上刻着记号——一个鱼尾，笔画深，刻旧了，边上叫人摸得发亮，不知摸了多少年。<\/p>\n<p>刻这个记的人，来过不止一回。摸亮的边儿，也不是一只手一天摸出来的。<\/p>\n<p>\"这记刻了多久了？\"我问。<\/p>\n<p>\"皮都包住了，十年打不住。\"把头用拇指肚蹭了蹭那道亮，\"他这些年，年年来。不进沟，就站在这儿摸摸树。\"<\/p>\n<p>\"摸什么？\"<\/p>\n<p>\"摸他那口气。\"把头说，\"人出了一档子事，一辈子缓不过来的，就得找个物件，年年摸一回。摸的不是树，是那档子事。\"<\/p>\n<p>摸亮的鱼尾旁边，新添了三个字。刀尖刻的，皮翻着，茬口发白，顶多两天。<\/p>\n<p>初一来。<\/p>\n<p>我盯着那三个字，心里咯噔一下。<\/p>\n<p>\"初一。\"我说，\"五月初一？\"<\/p>\n<p>\"三十多年前那场灯，就是初一晚上点的。\"把头说，\"这是他的旧日子。\"<\/p>\n<p>\"初一要来？来干什么？\"<\/p>\n<p>\"不知道。\"把头说，\"可你算算这日子——初一他来，初三咱们取油，初五灯会。三天，一步一个坎。\"<\/p>\n<p>\"初三跟初一隔两天，他要真冲着油来的——\"<\/p>\n<p>\"他不冲油。\"把头说，\"冲油的是掌灯的。他冲的是锅。\"<\/p>\n<p>回村的道上，谁都没说话。路过加油站，路灯杆子空着——七九那天挂白纸灯笼的地方，灯笼没了，杆子上只留着一圈叫风吹雨打磨出来的旧印子。<\/p>\n<p>老鼠男的摊子在加油站的背风处，摆着些针头线脑。他看见我们，也不招呼，只把手里糊了一半的白纸灯笼往身后挪了挪。<\/p>\n<p>把头在他摊前站住，拿起一张灶王爷看看，又放下。<\/p>\n<p>\"灯笼呢？\"老鼠男忽然问。<\/p>\n<p>\"什么灯笼？\"<\/p>\n<p>\"杆子上那盏。\"他说，\"谷雨那天夜里，让人摘走了。摘灯的手生，扯坏了半边——做灯的人心疼呢。\"<\/p>\n<p>\"谁心疼？\"<\/p>\n<p>老鼠男不答，低头理他的针线。理了半天，冒出一句：\"快五月了。该忙的都忙着呢，闲人也该忙了。\"<\/p>\n<p>把头没再问，丢下几个钱，拿了那张灶王爷走了。走出老远，他跟我说：\"他这话是说给咱们听的。摘灯的，不是他。\"<\/p>\n<p>\"他知道谁摘的？\"<\/p>\n<p>\"他知道，就不能说。\"把头说，\"传话的要是把话传成了情报，他就不是传话的了。\"<\/p>\n<p>快进村的时候，把头站住了。<\/p>\n<p>\"豆芽仔那儿有句实话，我得跟你交个底。\"他说，\"矮个儿买绳，高个儿买锁，瘦高个儿看水。这三样，是拴、是锁、是探路。人家在备家伙，咱们备什么？\"<\/p>\n<p>\"您说。\"<\/p>\n<p>\"咱们那口锅，夜里自己想走。\"他看着我，\"真到了初一初五，它是帮咱们，还是帮他们，你知道吗？\"<\/p>\n<p>我张了张嘴，没答上来。<\/p>\n<p>\"不知道就对了。\"把头说，\"连它自己都不知道。\"<\/p>\n<p>当天后晌，把头做了三件事。<\/p>\n<p>头一件，让鱼哥把黑鸡挪进正屋，说夜里鸡炸毛，是替人守夜，白日里得让人歇。鱼哥嘴上应着，抱鸡的时候嘟囔了一句：\"它比咱们院里哪个都明白。\"<\/p>\n<p>第二件，把做信人给的铜模和那张旧纸，从蜂房柜子里取出来。他把褥子拆开一角，东西裹进毡里，缝进我褥子靠腰的那一侧，针脚走得又密又匀。<\/p>\n<p>\"契在身上，模在褥子里。\"他说，\"真到了那一步，人跑了，东西不丢。\"<\/p>\n<p>第三件，他把酒糟鼻那半张黄纸压在佛龛底下，压的时候端端正正，念叨了一句：<\/p>\n<p>\"你要真想让咱们找着你，初一夜里，就在柳树丛等。\"<\/p>\n<p>小萱在边上听着，没敢问。等把头走了，她才低声跟我说：\"哥，佛龛底下能压这个吗？\"<\/p>\n<p>\"他不是压给佛看的。\"我说，\"是压给咱们看的。\"<\/p>\n<p>她哦了一声，转身要去添火，走了两步又回来，声音压得更低：\"哥，昨儿夜里我起来添柴，看见院墙塌那儿——土坯上头搭着个东西。我拿灯一照，是只鞋。就一只，搭在坯上头。我给拿开了，没敢跟你们说。\"<\/p>\n<p>\"什么样的鞋？\"<\/p>\n<p>\"布鞋。\"她说，\"底子快磨穿了，可干净，没泥。\"<\/p>\n<p>夜里进来的人，鞋上不带泥。不是绕着水走，是提着鞋走的。<\/p>\n<p>我把这话跟把头说了。他听完，半天没言语，末了说了一句：\"提鞋翻墙的，是山里的礼数。他这是把自己当客，不当贼。\"<\/p>\n<p>天黑以后，豆芽仔又捎来了信。这回的信短，就一句话——<\/p>\n<p>桓仁铺子里，今天来了个生人，不买东西，站了半天，临走问了一句：你们掌柜的，是不是打算过江？<\/p>\n<p>把头听完，把烟袋在鞋底上磕了磕。<\/p>\n<p>\"过江。\"他说，\"初三取油，走的就是水路。人家连咱们怎么走都摸着了。\"<\/p>\n<p>\"那还去？\"<\/p>\n<p>\"去。\"他把烟袋别进腰里，\"油不在咱们手里，锅不听咱们的话，人就站在明处等着咱们。越是这样，越得去。\"<\/p>\n<p>\"初一夜里呢？\"<\/p>\n<p>\"初一夜里，\"他往北边看了一眼，夜里的山影黑沉沉的，压着江那边，\"我倒要会会这个掐烟的。\"<\/p>", "plain": "四月廿八，天一亮，把头就带着我出了村，往北。 露水没干。膝印出村就没了——地皮硬，留不下脚印。可把头不慌，他不看地，看树。 \"夜里走路的人，不挑道，挑影子。\"他说，\"昨儿夜里南边起风，月亮让云遮一阵露一阵。他走路得躲着亮，专捡树影底下的空子钻。\" 果然，出了村北的苞米地，柳树丛里就有了痕迹。草压倒了一溜，不宽，一个人的肩膀宽，专挑密的柳棵子底下过。把头顺着这溜倒草走，走一段就蹲下来看一回——看的不是脚印，是草弯下去的方向。 \"腿脚不利索的人，夜里反倒走得稳。\"他说，\"一步是一步，不带踉跄的。这是走惯了夜道的腿。\" 路过王瘸子家后身的时候，王瘸子正蹲在门口修蟹笼。看见我们往北走，他直起腰：\"这么早，赶山去？\" \"遛弯。\"把头头也不回。 \"昨儿后半夜，\"王瘸子在他身后说，\"我听见北边河滩有动静。当是野狗刨食，起来看了看，没看见啥。\" 把头站住了：\"几点？\" \"鸡叫头遍。\" 把头没再问，抬脚接着走。走出去老远，他跟我说：\"鸡叫头遍，正是黑鸡炸毛那会儿。对上了。\" 顺着倒草走出去二里多地，到了河边，痕迹断了。 断头的地方，有一堆烧过的纸。 灰都散了，风一吹就跑。豆芽仔夜里看见的就是这堆。把头蹲下去，拿根草棍拨拉着，拨得极慢，一层灰一层灰地揭。揭出半张没烧透的黄表纸，纸角压着一个印——鱼尾，墨点的，跟酒糟鼻留给老周那张上的一模一样。 \"是他。\"我说。 \"等会儿。\"把头拨出一样东西，捏起来对着亮看。 半截烟嘴。铜的，磨得发亮，烟掐得极短，短得烫手。 把头捏着那半截烟嘴，半天没动地方。河滩上的水鸟叫了两声，他也没回头。 \"把头？\" \"掐烟掐到烫手才扔的人，\"他把烟嘴翻过来，凑到鼻子底下闻了闻，\"我这辈子，没见过第二个。\" \"烟嘴上能认出人来？\" \"认出的不是人，是毛病。\"他说，\"老烟枪掐烟，掐到不烫手就扔，只有一种人掐到烫手——心里搁着事，烟烧到嘴上了都不知道。\" 他站起来，拍了拍裤子上的土，眼睛却还在那堆灰上。 \"三十七年前，桓仁。\"他说，\"我十九岁，魇着了，人家把我领到一个老头跟前。那老头给我受镜，从头到尾没正眼看我，屋里不点灯，隔着一道帐。完了事儿，他就坐在炕沿上抽烟，一锅一锅地抽，抽到烫手，往灰里一杵，杵完那一锅，才跟我说头一句话。\" \"说的什么？\" \"他说，'娃，记住了，镜子认脸，也认命。'\"把头说，\"那时候我当他是吓唬我。\" 我后脊背的汗毛立起来了。 \"你这个意思——\"我把话咽了半截，\"昨儿夜里跪着摸锅的，是当年给你受镜那个人？\" \"我认纹，认人，也认烟。\"把头把那半截烟嘴揣进怀里，\"沟里那个，山上那个，我没见过他们的脸。可要是同一个人，三十年前的做派，改不了。\" \"那他摸锅干嘛？\" \"我哪知道。\"把头说，\"他给我受镜那年，我不明白。三十年了，还是不明白。\" 我往四下里看。河滩，柳丛，烧纸的灰。一个三十多年前从死人堆里走出去的人，一个三十年不露面的人，昨儿夜里到咱们院里跪了一回。 \"还有别的没有？\"我问。 \"有。\" 把头领着我进了柳树丛深处。一棵老柳，碗口粗，树皮上刻着记号——一个鱼尾，笔画深，刻旧了，边上叫人摸得发亮，不知摸了多少年。 刻这个记的人，来过不止一回。摸亮的边儿，也不是一只手一天摸出来的。 \"这记刻了多久了？\"我问。 \"皮都包住了，十年打不住。\"把头用拇指肚蹭了蹭那道亮，\"他这些年，年年来。不进沟，就站在这儿摸摸树。\" \"摸什么？\" \"摸他那口气。\"把头说，\"人出了一档子事，一辈子缓不过来的，就得找个物件，年年摸一回。摸的不是树，是那档子事。\" 摸亮的鱼尾旁边，新添了三个字。刀尖刻的，皮翻着，茬口发白，顶多两天。 初一来。 我盯着那三个字，心里咯噔一下。 \"初一。\"我说，\"五月初一？\" \"三十多年前那场灯，就是初一晚上点的。\"把头说，\"这是他的旧日子。\" \"初一要来？来干什么？\" \"不知道。\"把头说，\"可你算算这日子——初一他来，初三咱们取油，初五灯会。三天，一步一个坎。\" \"初三跟初一隔两天，他要真冲着油来的——\" \"他不冲油。\"把头说，\"冲油的是掌灯的。他冲的是锅。\" 回村的道上，谁都没说话。路过加油站，路灯杆子空着——七九那天挂白纸灯笼的地方，灯笼没了，杆子上只留着一圈叫风吹雨打磨出来的旧印子。 老鼠男的摊子在加油站的背风处，摆着些针头线脑。他看见我们，也不招呼，只把手里糊了一半的白纸灯笼往身后挪了挪。 把头在他摊前站住，拿起一张灶王爷看看，又放下。 \"灯笼呢？\"老鼠男忽然问。 \"什么灯笼？\" \"杆子上那盏。\"他说，\"谷雨那天夜里，让人摘走了。摘灯的手生，扯坏了半边——做灯的人心疼呢。\" \"谁心疼？\" 老鼠男不答，低头理他的针线。理了半天，冒出一句：\"快五月了。该忙的都忙着呢，闲人也该忙了。\" 把头没再问，丢下几个钱，拿了那张灶王爷走了。走出老远，他跟我说：\"他这话是说给咱们听的。摘灯的，不是他。\" \"他知道谁摘的？\" \"他知道，就不能说。\"把头说，\"传话的要是把话传成了情报，他就不是传话的了。\" 快进村的时候，把头站住了。 \"豆芽仔那儿有句实话，我得跟你交个底。\"他说，\"矮个儿买绳，高个儿买锁，瘦高个儿看水。这三样，是拴、是锁、是探路。人家在备家伙，咱们备什么？\" \"您说。\" \"咱们那口锅，夜里自己想走。\"他看着我，\"真到了初一初五，它是帮咱们，还是帮他们，你知道吗？\" 我张了张嘴，没答上来。 \"不知道就对了。\"把头说，\"连它自己都不知道。\" 当天后晌，把头做了三件事。 头一件，让鱼哥把黑鸡挪进正屋，说夜里鸡炸毛，是替人守夜，白日里得让人歇。鱼哥嘴上应着，抱鸡的时候嘟囔了一句：\"它比咱们院里哪个都明白。\" 第二件，把做信人给的铜模和那张旧纸，从蜂房柜子里取出来。他把褥子拆开一角，东西裹进毡里，缝进我褥子靠腰的那一侧，针脚走得又密又匀。 \"契在身上，模在褥子里。\"他说，\"真到了那一步，人跑了，东西不丢。\" 第三件，他把酒糟鼻那半张黄纸压在佛龛底下，压的时候端端正正，念叨了一句： \"你要真想让咱们找着你，初一夜里，就在柳树丛等。\" 小萱在边上听着，没敢问。等把头走了，她才低声跟我说：\"哥，佛龛底下能压这个吗？\" \"他不是压给佛看的。\"我说，\"是压给咱们看的。\" 她哦了一声，转身要去添火，走了两步又回来，声音压得更低：\"哥，昨儿夜里我起来添柴，看见院墙塌那儿——土坯上头搭着个东西。我拿灯一照，是只鞋。就一只，搭在坯上头。我给拿开了，没敢跟你们说。\" \"什么样的鞋？\" \"布鞋。\"她说，\"底子快磨穿了，可干净，没泥。\" 夜里进来的人，鞋上不带泥。不是绕着水走，是提着鞋走的。 我把这话跟把头说了。他听完，半天没言语，末了说了一句：\"提鞋翻墙的，是山里的礼数。他这是把自己当客，不当贼。\" 天黑以后，豆芽仔又捎来了信。这回的信短，就一句话—— 桓仁铺子里，今天来了个生人，不买东西，站了半天，临走问了一句：你们掌柜的，是不是打算过江？ 把头听完，把烟袋在鞋底上磕了磕。 \"过江。\"他说，\"初三取油，走的就是水路。人家连咱们怎么走都摸着了。\" \"那还去？\" \"去。\"他把烟袋别进腰里，\"油不在咱们手里，锅不听咱们的话，人就站在明处等着咱们。越是这样，越得去。\" \"初一夜里呢？\" \"初一夜里，\"他往北边看了一眼，夜里的山影黑沉沉的，压着江那边，\"我倒要会会这个掐烟的。\""}, {"id": "A5-095", "arc": "A5", "num": 95, "title": "过江", "md": "初一那天夜里，锅一声没响。\n\n把头在偏屋守了一宿，我在前头守。黑鸡也没炸毛，天亮的时候还叫了两声。可谁也没觉得踏实——一夜太安静了，安静得像大雪封门之前。连空蜂箱都不嗡了，一宿没响。\n\n天亮掀席看，锅还是那口锅，坑沿的膝印让露水洇得发浅，锅沿的黑泥干了一层壳。把头蹲着看了半天，只说了一句：\"它在听。\"\n\n\"听什么？\"\n\n\"听山里那位的信儿。\"把头说，\"信到了，它就不闹了。\"\n\n初二白天，把头睡了半天，起来把我叫过去，摆开了说。\n\n\"明儿初三。你，我，鱼哥，三个走水路。豆芽仔留桓仁盯着，小萱看家，锅不让它离窝——谁叫门也不开。\"\n\n\"人家要是知道咱们仨都出来了——\"\n\n\"知道才好。\"把头说，\"家里越空，越没人敢动那口锅。做贼的都怕空屋。\"\n\n路线他也定了：不走官道，不走老渡口，从东边王瘸子家后身的老河汊子上船，摇过江，顺水再走八里，从水汊子绕到马渡霜落脚的地方。船是鱼哥早年换酒的一条破舢板，平时扣在苇塘里，没人知道。\n\n\"为什么非走水路？\"我问，\"绕官道远是远，道上能看见人。\"\n\n\"水上看不见埋伏。\"把头说，\"官道上人家要看你，一眼就看个全乎。水上人家要拿你，得动船——动船就出动静。咱们这趟是取油，不是斗狠，越悄没声越好。\"\n\n\"鱼哥摇橹。\"他说，\"我压船头。你坐当中，什么都不拿——手上越空，心里越稳。\"\n\n五月初三，天擦黑，我们三个出的村。苇塘里起船，鱼哥一橹下去，水声一格一格的。江心起了雾，雾贴着水面走，船头扎进雾里，两岸就都看不见了。\n\n雾里行船，全凭鱼哥的耳朵。他橹放慢，脖子侧着，听水头打在船帮上的声，一声紧一声慢，他都知道船走在哪一股水上。\n\n\"前头岔口，\"他低声说，\"往左。右边水底下有沉树。\"\n\n把头在船头坐着，一动不动，像一截老木头。只有烟袋锅在雾里偶尔红一下，马上就捂灭了。\n\n到了马渡霜说的那处水汊子，已经起定更的雾。上岸走一箭地，一间独门独户的小屋，窗纸上一点灯光。她这半个月没住佛具店。\n\n把头拍了三下门，报了马渡霜她师父的姓。\n\n门开了。屋里点着一盏佛灯，正对门的墙上供着个牌位，没写字，裹着黄布。马渡霜看见我们仨，眼神在我脸上停了停，侧身让开。\n\n柜底下的木匣端出来了。开匣，里头是一口黑坛，巴掌高，封口的黑蜡上按着一个指印。\n\n\"我师父的印。\"她说，\"三十年了，蜡没动过。\"\n\n把头双手接过，捧得极稳。坛子入手，我看见他胳膊上的筋绷了一下。\n\n\"轻拿轻放。\"马渡霜说，\"油认人，也认性子。毛手毛脚的，它自己就洒。\"\n\n鱼哥在后头看得直眨眼，一声没敢出。\n\n\"就这一坛？\"把头问。\n\n\"三十年前订的是两坛。\"她说，\"回来的是一满一空。满的这坛，就是山里点的头一盏灯该用的量——一盏灯的油。\"\n\n\"一盏？\"\n\n\"一盏。\"她看着把头，\"你当灯会是拿油泼？灯就是灯。一盏灯，一炷香，一个名分。多了，山不收。\"\n\n\"空的那坛呢？\"\n\n\"坛底的黑泥，我师父抠下来一把，带了一辈子。\"她说，\"他走的时候，连坛子一起烧了。\"\n\n屋里静了静。佛灯的火苗直直的，一丝不晃。\n\n\"临走，我师父还有一句话，让我带给来取油的人。\"马渡霜站在灯影外头，\"来取油的要是背锅的，就告诉他——灯是山的，人是借的。借的东西，得还。\"\n\n\"还什么？\"我问。\n\n\"他说到这儿就咽气了。\"她说，\"三十年，我就知道这半句。\"\n\n她给每人倒了碗水。碗是旧的，边上磕了口。鱼哥端着，喝也不是，放也不是。\n\n\"你师父那句'等下回来取油的人'，\"把头问，\"他就没提过取油的人长什么样？\"\n\n\"提了一句。\"马渡霜说，\"他说，那人身上带着山里的名分，可名分不是他的——是他应下来的。\"\n\n屋里静了一静。我知道这话说的是谁，把头也知道。谁也没看谁。\n\n把头把坛子用包袱裹了三层，缠在我背上。坛子贴着后脊梁，凉的，像一块捂不热的石头。\n\n出门的时候，马渡霜送到门口，忽然低声说了一句：\"初五那天，我要是没露面，别找我。\"\n\n\"为什么？\"\n\n\"因为我要是真怕一件事，\"她说，\"我就不出门。\"\n\n门在身后关上了。鱼哥回头望了一眼那扇门，小声说：\"她这话，听着不像是嘱咐，像是告别。\"\n\n\"少说。\"把头说，\"上船。\"\n\n船离岸，雾更大了。鱼哥摇橹，水声一格一格的。走出一里多地，前头是渡口老地方的灯影，把头忽然抬手——\n\n橹停了。\n\n雾里头，渡口边上，坐着一个人。戴着草帽，帽檐压得很低，身前搁着一盏白纸灯笼，没点。船要是照原路走，得从他那船帮边上擦过去。\n\n\"来接油的。\"那人说，声音不高，穿透雾正正好。\n\n把头的手在我背上按了一下，很轻。我懂了——不硬碰。\n\n\"凭什么给你？\"把头问。\n\n\"凭灯归我掌。\"草帽人说，\"名分是他的，\"帽檐朝我这边偏了偏，\"灯是山的，油是公中的。初五点灯，灯芯是他那根，油从我这儿出——不对。\"\n\n他笑了一声。\n\n\"油从我这儿过。\"\n\n把头又问：\"问灯的呢？你那一趟的旧相识，今儿怎么没露面？\"\n\n\"他等他该等的。\"草帽人说，\"他那一辈的规矩，见人不肯，见事肯。初一过了，他自然见。\"\n\n\"见谁？\"\n\n\"见名分站得住的。\"草帽人说，\"站不住的，他不屑见。\"\n\n\"油是马家三十年前送进山的。\"把头说，\"你收去，山认吗？\"\n\n\"山里的事，从来是货认路，人不认路。\"草帽人说，\"这坛油在马家柜底下躺了三十年，是因为来取它的人没到。今儿人到了，它就该上路了。我从这儿过一道手，是替它省腿。\"\n\n把头沉默了半晌，回头看我。我背着坛子，坛子凉贴着后背。我解下来，递了过去。\n\n草帽人双手接了，接得比我们想的还郑重。他掂了掂，没开蜡封。\n\n\"蜡没动，好。\"他把坛子搁在灯笼边上，\"你们是懂规矩的人。\"\n\n\"就这一句？\"把头问。\n\n\"还有个准信，送给你这个背锅的。\"草帽人站起来，提着灯笼，\"你要找的那口会走的锅，初一那天夜里，已经进山了。它比谁都急。\"\n\n我心里咯噔一下。\n\n\"这几天，\"他不紧不慢地接着说，\"你们家那口，是不是不闹了？同伙到了，它就不叫了。\"\n\n雾里，草帽人的背影一点一点淡下去。快看不见的时候，他的声音又飘回来一句：\n\n\"初五，你背锅上台。灯，我掌。\"\n\n船调头往回走。鱼哥的橹摇得比来时快，我知道他心里毛了——他听见\"锅\"字，就想起他那些梦。\n\n\"把头，\"我问，\"他说的，信几成？\"\n\n把头没马上答。他看着雾里翻白的江面，看了很久。\n\n\"锅初一夜里安静。\"他说，\"跟初一咱们守的那宿，对上了。\"\n\n\"那就是真的？\"\n\n\"他说的是真的。\"把头说，\"可你想过没有——会走的锅进了山，山上点的灯，掌灯的是他。它要是自己个儿走到该去的位子，要他掌什么灯？\"\n\n我愣住了。\n\n\"除非，\"把头慢慢说，\"它进山，不是去归位的。\"\n\n雾散了一点，江水一浪一浪往东去。对岸的山黑沉沉的，压着半边天。鱼哥把橹摇得更慢了，不是省力，是不敢快——快了，船头就得扎进那片黑里去。\n\n就在这时候，山根底下，极远极深的地方，闪了一下。\n\n不是火，也不是闪电。是一种发黄的、极稳的光，亮了一息，又灭了。像有人在一座黑山里头，划亮了一根火柴。\n\n鱼哥的橹停在半空。把头盯着那个方向，一直盯到那片黑重新合拢。\n\n\"把头，那是——\"\n\n\"别问。\"把头说，\"摇你的橹。\"\n\n\"初一夜里进山的，不止它一个。\"把头望着山那边，声音很低，\"来接它的，也到了。\"", "words": 2803, "html": "<p>初一那天夜里，锅一声没响。<\/p>\n<p>把头在偏屋守了一宿，我在前头守。黑鸡也没炸毛，天亮的时候还叫了两声。可谁也没觉得踏实——一夜太安静了，安静得像大雪封门之前。连空蜂箱都不嗡了，一宿没响。<\/p>\n<p>天亮掀席看，锅还是那口锅，坑沿的膝印让露水洇得发浅，锅沿的黑泥干了一层壳。把头蹲着看了半天，只说了一句：\"它在听。\"<\/p>\n<p>\"听什么？\"<\/p>\n<p>\"听山里那位的信儿。\"把头说，\"信到了，它就不闹了。\"<\/p>\n<p>初二白天，把头睡了半天，起来把我叫过去，摆开了说。<\/p>\n<p>\"明儿初三。你，我，鱼哥，三个走水路。豆芽仔留桓仁盯着，小萱看家，锅不让它离窝——谁叫门也不开。\"<\/p>\n<p>\"人家要是知道咱们仨都出来了——\"<\/p>\n<p>\"知道才好。\"把头说，\"家里越空，越没人敢动那口锅。做贼的都怕空屋。\"<\/p>\n<p>路线他也定了：不走官道，不走老渡口，从东边王瘸子家后身的老河汊子上船，摇过江，顺水再走八里，从水汊子绕到马渡霜落脚的地方。船是鱼哥早年换酒的一条破舢板，平时扣在苇塘里，没人知道。<\/p>\n<p>\"为什么非走水路？\"我问，\"绕官道远是远，道上能看见人。\"<\/p>\n<p>\"水上看不见埋伏。\"把头说，\"官道上人家要看你，一眼就看个全乎。水上人家要拿你，得动船——动船就出动静。咱们这趟是取油，不是斗狠，越悄没声越好。\"<\/p>\n<p>\"鱼哥摇橹。\"他说，\"我压船头。你坐当中，什么都不拿——手上越空，心里越稳。\"<\/p>\n<p>五月初三，天擦黑，我们三个出的村。苇塘里起船，鱼哥一橹下去，水声一格一格的。江心起了雾，雾贴着水面走，船头扎进雾里，两岸就都看不见了。<\/p>\n<p>雾里行船，全凭鱼哥的耳朵。他橹放慢，脖子侧着，听水头打在船帮上的声，一声紧一声慢，他都知道船走在哪一股水上。<\/p>\n<p>\"前头岔口，\"他低声说，\"往左。右边水底下有沉树。\"<\/p>\n<p>把头在船头坐着，一动不动，像一截老木头。只有烟袋锅在雾里偶尔红一下，马上就捂灭了。<\/p>\n<p>到了马渡霜说的那处水汊子，已经起定更的雾。上岸走一箭地，一间独门独户的小屋，窗纸上一点灯光。她这半个月没住佛具店。<\/p>\n<p>把头拍了三下门，报了马渡霜她师父的姓。<\/p>\n<p>门开了。屋里点着一盏佛灯，正对门的墙上供着个牌位，没写字，裹着黄布。马渡霜看见我们仨，眼神在我脸上停了停，侧身让开。<\/p>\n<p>柜底下的木匣端出来了。开匣，里头是一口黑坛，巴掌高，封口的黑蜡上按着一个指印。<\/p>\n<p>\"我师父的印。\"她说，\"三十年了，蜡没动过。\"<\/p>\n<p>把头双手接过，捧得极稳。坛子入手，我看见他胳膊上的筋绷了一下。<\/p>\n<p>\"轻拿轻放。\"马渡霜说，\"油认人，也认性子。毛手毛脚的，它自己就洒。\"<\/p>\n<p>鱼哥在后头看得直眨眼，一声没敢出。<\/p>\n<p>\"就这一坛？\"把头问。<\/p>\n<p>\"三十年前订的是两坛。\"她说，\"回来的是一满一空。满的这坛，就是山里点的头一盏灯该用的量——一盏灯的油。\"<\/p>\n<p>\"一盏？\"<\/p>\n<p>\"一盏。\"她看着把头，\"你当灯会是拿油泼？灯就是灯。一盏灯，一炷香，一个名分。多了，山不收。\"<\/p>\n<p>\"空的那坛呢？\"<\/p>\n<p>\"坛底的黑泥，我师父抠下来一把，带了一辈子。\"她说，\"他走的时候，连坛子一起烧了。\"<\/p>\n<p>屋里静了静。佛灯的火苗直直的，一丝不晃。<\/p>\n<p>\"临走，我师父还有一句话，让我带给来取油的人。\"马渡霜站在灯影外头，\"来取油的要是背锅的，就告诉他——灯是山的，人是借的。借的东西，得还。\"<\/p>\n<p>\"还什么？\"我问。<\/p>\n<p>\"他说到这儿就咽气了。\"她说，\"三十年，我就知道这半句。\"<\/p>\n<p>她给每人倒了碗水。碗是旧的，边上磕了口。鱼哥端着，喝也不是，放也不是。<\/p>\n<p>\"你师父那句'等下回来取油的人'，\"把头问，\"他就没提过取油的人长什么样？\"<\/p>\n<p>\"提了一句。\"马渡霜说，\"他说，那人身上带着山里的名分，可名分不是他的——是他应下来的。\"<\/p>\n<p>屋里静了一静。我知道这话说的是谁，把头也知道。谁也没看谁。<\/p>\n<p>把头把坛子用包袱裹了三层，缠在我背上。坛子贴着后脊梁，凉的，像一块捂不热的石头。<\/p>\n<p>出门的时候，马渡霜送到门口，忽然低声说了一句：\"初五那天，我要是没露面，别找我。\"<\/p>\n<p>\"为什么？\"<\/p>\n<p>\"因为我要是真怕一件事，\"她说，\"我就不出门。\"<\/p>\n<p>门在身后关上了。鱼哥回头望了一眼那扇门，小声说：\"她这话，听着不像是嘱咐，像是告别。\"<\/p>\n<p>\"少说。\"把头说，\"上船。\"<\/p>\n<p>船离岸，雾更大了。鱼哥摇橹，水声一格一格的。走出一里多地，前头是渡口老地方的灯影，把头忽然抬手——<\/p>\n<p>橹停了。<\/p>\n<p>雾里头，渡口边上，坐着一个人。戴着草帽，帽檐压得很低，身前搁着一盏白纸灯笼，没点。船要是照原路走，得从他那船帮边上擦过去。<\/p>\n<p>\"来接油的。\"那人说，声音不高，穿透雾正正好。<\/p>\n<p>把头的手在我背上按了一下，很轻。我懂了——不硬碰。<\/p>\n<p>\"凭什么给你？\"把头问。<\/p>\n<p>\"凭灯归我掌。\"草帽人说，\"名分是他的，\"帽檐朝我这边偏了偏，\"灯是山的，油是公中的。初五点灯，灯芯是他那根，油从我这儿出——不对。\"<\/p>\n<p>他笑了一声。<\/p>\n<p>\"油从我这儿过。\"<\/p>\n<p>把头又问：\"问灯的呢？你那一趟的旧相识，今儿怎么没露面？\"<\/p>\n<p>\"他等他该等的。\"草帽人说，\"他那一辈的规矩，见人不肯，见事肯。初一过了，他自然见。\"<\/p>\n<p>\"见谁？\"<\/p>\n<p>\"见名分站得住的。\"草帽人说，\"站不住的，他不屑见。\"<\/p>\n<p>\"油是马家三十年前送进山的。\"把头说，\"你收去，山认吗？\"<\/p>\n<p>\"山里的事，从来是货认路，人不认路。\"草帽人说，\"这坛油在马家柜底下躺了三十年，是因为来取它的人没到。今儿人到了，它就该上路了。我从这儿过一道手，是替它省腿。\"<\/p>\n<p>把头沉默了半晌，回头看我。我背着坛子，坛子凉贴着后背。我解下来，递了过去。<\/p>\n<p>草帽人双手接了，接得比我们想的还郑重。他掂了掂，没开蜡封。<\/p>\n<p>\"蜡没动，好。\"他把坛子搁在灯笼边上，\"你们是懂规矩的人。\"<\/p>\n<p>\"就这一句？\"把头问。<\/p>\n<p>\"还有个准信，送给你这个背锅的。\"草帽人站起来，提着灯笼，\"你要找的那口会走的锅，初一那天夜里，已经进山了。它比谁都急。\"<\/p>\n<p>我心里咯噔一下。<\/p>\n<p>\"这几天，\"他不紧不慢地接着说，\"你们家那口，是不是不闹了？同伙到了，它就不叫了。\"<\/p>\n<p>雾里，草帽人的背影一点一点淡下去。快看不见的时候，他的声音又飘回来一句：<\/p>\n<p>\"初五，你背锅上台。灯，我掌。\"<\/p>\n<p>船调头往回走。鱼哥的橹摇得比来时快，我知道他心里毛了——他听见\"锅\"字，就想起他那些梦。<\/p>\n<p>\"把头，\"我问，\"他说的，信几成？\"<\/p>\n<p>把头没马上答。他看着雾里翻白的江面，看了很久。<\/p>\n<p>\"锅初一夜里安静。\"他说，\"跟初一咱们守的那宿，对上了。\"<\/p>\n<p>\"那就是真的？\"<\/p>\n<p>\"他说的是真的。\"把头说，\"可你想过没有——会走的锅进了山，山上点的灯，掌灯的是他。它要是自己个儿走到该去的位子，要他掌什么灯？\"<\/p>\n<p>我愣住了。<\/p>\n<p>\"除非，\"把头慢慢说，\"它进山，不是去归位的。\"<\/p>\n<p>雾散了一点，江水一浪一浪往东去。对岸的山黑沉沉的，压着半边天。鱼哥把橹摇得更慢了，不是省力，是不敢快——快了，船头就得扎进那片黑里去。<\/p>\n<p>就在这时候，山根底下，极远极深的地方，闪了一下。<\/p>\n<p>不是火，也不是闪电。是一种发黄的、极稳的光，亮了一息，又灭了。像有人在一座黑山里头，划亮了一根火柴。<\/p>\n<p>鱼哥的橹停在半空。把头盯着那个方向，一直盯到那片黑重新合拢。<\/p>\n<p>\"把头，那是——\"<\/p>\n<p>\"别问。\"把头说，\"摇你的橹。\"<\/p>\n<p>\"初一夜里进山的，不止它一个。\"把头望着山那边，声音很低，\"来接它的，也到了。\"<\/p>", "plain": "初一那天夜里，锅一声没响。 把头在偏屋守了一宿，我在前头守。黑鸡也没炸毛，天亮的时候还叫了两声。可谁也没觉得踏实——一夜太安静了，安静得像大雪封门之前。连空蜂箱都不嗡了，一宿没响。 天亮掀席看，锅还是那口锅，坑沿的膝印让露水洇得发浅，锅沿的黑泥干了一层壳。把头蹲着看了半天，只说了一句：\"它在听。\" \"听什么？\" \"听山里那位的信儿。\"把头说，\"信到了，它就不闹了。\" 初二白天，把头睡了半天，起来把我叫过去，摆开了说。 \"明儿初三。你，我，鱼哥，三个走水路。豆芽仔留桓仁盯着，小萱看家，锅不让它离窝——谁叫门也不开。\" \"人家要是知道咱们仨都出来了——\" \"知道才好。\"把头说，\"家里越空，越没人敢动那口锅。做贼的都怕空屋。\" 路线他也定了：不走官道，不走老渡口，从东边王瘸子家后身的老河汊子上船，摇过江，顺水再走八里，从水汊子绕到马渡霜落脚的地方。船是鱼哥早年换酒的一条破舢板，平时扣在苇塘里，没人知道。 \"为什么非走水路？\"我问，\"绕官道远是远，道上能看见人。\" \"水上看不见埋伏。\"把头说，\"官道上人家要看你，一眼就看个全乎。水上人家要拿你，得动船——动船就出动静。咱们这趟是取油，不是斗狠，越悄没声越好。\" \"鱼哥摇橹。\"他说，\"我压船头。你坐当中，什么都不拿——手上越空，心里越稳。\" 五月初三，天擦黑，我们三个出的村。苇塘里起船，鱼哥一橹下去，水声一格一格的。江心起了雾，雾贴着水面走，船头扎进雾里，两岸就都看不见了。 雾里行船，全凭鱼哥的耳朵。他橹放慢，脖子侧着，听水头打在船帮上的声，一声紧一声慢，他都知道船走在哪一股水上。 \"前头岔口，\"他低声说，\"往左。右边水底下有沉树。\" 把头在船头坐着，一动不动，像一截老木头。只有烟袋锅在雾里偶尔红一下，马上就捂灭了。 到了马渡霜说的那处水汊子，已经起定更的雾。上岸走一箭地，一间独门独户的小屋，窗纸上一点灯光。她这半个月没住佛具店。 把头拍了三下门，报了马渡霜她师父的姓。 门开了。屋里点着一盏佛灯，正对门的墙上供着个牌位，没写字，裹着黄布。马渡霜看见我们仨，眼神在我脸上停了停，侧身让开。 柜底下的木匣端出来了。开匣，里头是一口黑坛，巴掌高，封口的黑蜡上按着一个指印。 \"我师父的印。\"她说，\"三十年了，蜡没动过。\" 把头双手接过，捧得极稳。坛子入手，我看见他胳膊上的筋绷了一下。 \"轻拿轻放。\"马渡霜说，\"油认人，也认性子。毛手毛脚的，它自己就洒。\" 鱼哥在后头看得直眨眼，一声没敢出。 \"就这一坛？\"把头问。 \"三十年前订的是两坛。\"她说，\"回来的是一满一空。满的这坛，就是山里点的头一盏灯该用的量——一盏灯的油。\" \"一盏？\" \"一盏。\"她看着把头，\"你当灯会是拿油泼？灯就是灯。一盏灯，一炷香，一个名分。多了，山不收。\" \"空的那坛呢？\" \"坛底的黑泥，我师父抠下来一把，带了一辈子。\"她说，\"他走的时候，连坛子一起烧了。\" 屋里静了静。佛灯的火苗直直的，一丝不晃。 \"临走，我师父还有一句话，让我带给来取油的人。\"马渡霜站在灯影外头，\"来取油的要是背锅的，就告诉他——灯是山的，人是借的。借的东西，得还。\" \"还什么？\"我问。 \"他说到这儿就咽气了。\"她说，\"三十年，我就知道这半句。\" 她给每人倒了碗水。碗是旧的，边上磕了口。鱼哥端着，喝也不是，放也不是。 \"你师父那句'等下回来取油的人'，\"把头问，\"他就没提过取油的人长什么样？\" \"提了一句。\"马渡霜说，\"他说，那人身上带着山里的名分，可名分不是他的——是他应下来的。\" 屋里静了一静。我知道这话说的是谁，把头也知道。谁也没看谁。 把头把坛子用包袱裹了三层，缠在我背上。坛子贴着后脊梁，凉的，像一块捂不热的石头。 出门的时候，马渡霜送到门口，忽然低声说了一句：\"初五那天，我要是没露面，别找我。\" \"为什么？\" \"因为我要是真怕一件事，\"她说，\"我就不出门。\" 门在身后关上了。鱼哥回头望了一眼那扇门，小声说：\"她这话，听着不像是嘱咐，像是告别。\" \"少说。\"把头说，\"上船。\" 船离岸，雾更大了。鱼哥摇橹，水声一格一格的。走出一里多地，前头是渡口老地方的灯影，把头忽然抬手—— 橹停了。 雾里头，渡口边上，坐着一个人。戴着草帽，帽檐压得很低，身前搁着一盏白纸灯笼，没点。船要是照原路走，得从他那船帮边上擦过去。 \"来接油的。\"那人说，声音不高，穿透雾正正好。 把头的手在我背上按了一下，很轻。我懂了——不硬碰。 \"凭什么给你？\"把头问。 \"凭灯归我掌。\"草帽人说，\"名分是他的，\"帽檐朝我这边偏了偏，\"灯是山的，油是公中的。初五点灯，灯芯是他那根，油从我这儿出——不对。\" 他笑了一声。 \"油从我这儿过。\" 把头又问：\"问灯的呢？你那一趟的旧相识，今儿怎么没露面？\" \"他等他该等的。\"草帽人说，\"他那一辈的规矩，见人不肯，见事肯。初一过了，他自然见。\" \"见谁？\" \"见名分站得住的。\"草帽人说，\"站不住的，他不屑见。\" \"油是马家三十年前送进山的。\"把头说，\"你收去，山认吗？\" \"山里的事，从来是货认路，人不认路。\"草帽人说，\"这坛油在马家柜底下躺了三十年，是因为来取它的人没到。今儿人到了，它就该上路了。我从这儿过一道手，是替它省腿。\" 把头沉默了半晌，回头看我。我背着坛子，坛子凉贴着后背。我解下来，递了过去。 草帽人双手接了，接得比我们想的还郑重。他掂了掂，没开蜡封。 \"蜡没动，好。\"他把坛子搁在灯笼边上，\"你们是懂规矩的人。\" \"就这一句？\"把头问。 \"还有个准信，送给你这个背锅的。\"草帽人站起来，提着灯笼，\"你要找的那口会走的锅，初一那天夜里，已经进山了。它比谁都急。\" 我心里咯噔一下。 \"这几天，\"他不紧不慢地接着说，\"你们家那口，是不是不闹了？同伙到了，它就不叫了。\" 雾里，草帽人的背影一点一点淡下去。快看不见的时候，他的声音又飘回来一句： \"初五，你背锅上台。灯，我掌。\" 船调头往回走。鱼哥的橹摇得比来时快，我知道他心里毛了——他听见\"锅\"字，就想起他那些梦。 \"把头，\"我问，\"他说的，信几成？\" 把头没马上答。他看着雾里翻白的江面，看了很久。 \"锅初一夜里安静。\"他说，\"跟初一咱们守的那宿，对上了。\" \"那就是真的？\" \"他说的是真的。\"把头说，\"可你想过没有——会走的锅进了山，山上点的灯，掌灯的是他。它要是自己个儿走到该去的位子，要他掌什么灯？\" 我愣住了。 \"除非，\"把头慢慢说，\"它进山，不是去归位的。\" 雾散了一点，江水一浪一浪往东去。对岸的山黑沉沉的，压着半边天。鱼哥把橹摇得更慢了，不是省力，是不敢快——快了，船头就得扎进那片黑里去。 就在这时候，山根底下，极远极深的地方，闪了一下。 不是火，也不是闪电。是一种发黄的、极稳的光，亮了一息，又灭了。像有人在一座黑山里头，划亮了一根火柴。 鱼哥的橹停在半空。把头盯着那个方向，一直盯到那片黑重新合拢。 \"把头，那是——\" \"别问。\"把头说，\"摇你的橹。\" \"初一夜里进山的，不止它一个。\"把头望着山那边，声音很低，\"来接它的，也到了。\""}, {"id": "A5-096", "arc": "A5", "num": 96, "title": "初一", "md": "五月初一，天黑以后，把头带我出的村。\n\n鱼哥要跟，把头没让。\"你留下看家。\"他说，\"锅在，人在。今晚谁都别开门。\"\n\n鱼哥应了，把黑鸡抱进怀里，坐到门槛上。我知道他心里不痛快，可这事确实不能带他——夜访者那句\"再等等\"，是从鱼哥耳朵里过的，再来一个场面对不上，反倒乱。\n\n柳树丛里潮气重。把头挑了棵歪脖柳，两人在树后的干土上蹲下，烟袋揣着，火不敢见。月亮让云遮着，一阵亮一阵暗，河滩上的水一浪一浪地翻白。\n\n等以前，把头把该交底的都交了。\n\n\"一会儿来的人，不管说什么，你只带耳朵。\"他说，\"他们那辈人的话，一人一个说法，你接了谁的茬，就断了谁的线。\"\n\n\"那要是他们问您当年受镜的事呢？\"\n\n\"问就答。\"把头说，\"三十七年的账，人家记得比我清。\"\n\n这话不像他。平时把头是账上最清楚的一个，今晚却像把自己摆到了被告的位子上。我想问，没问。\n\n河对岸有夜鸟叫了两声，又没了。水声一阵大一阵小，人的耳朵在黑地里熬着，熬到后来，连自己的心跳都跟水声搅在一块儿。把头在我边上，一动不动，烟袋在手里，连转都不转了。\n\n等了小半个时辰，苇塘那边先有了动静。\n\n不是脚步声。是咳嗽——压着的、哑的，咳两声停一停，越咳越近。一个人从苇塘里钻出来，个头不高，瘦，左腿拖着地，走三步歇一步。\n\n酒糟鼻。\n\n他走到老柳底下，没看我们藏身的地方，先伸手摸了摸树皮上那个鱼尾刻痕。摸完，他才开口，冲着黑处说：\n\n\"出来吧。刻了字等人的人，没有躲在树后头的道理。\"\n\n把头站了起来，把我也从树后带出来。\n\n酒糟鼻转过脸。这张脸让酒糟糟的红斑盖了半边，眼睛倒亮，亮得不像六十多岁的人。他上上下下打量把头，又打量我，末了目光落在我胸口——隔着两层布，他也像闻见了什么。\n\n\"契在你身上。\"他说，\"好。省得我多走一趟。\"\n\n\"你是当年的接应。\"把头开口，\"五进两出，活着出来的那个。\"\n\n\"活着出来的。\"酒糟鼻咂摸了一下这五个字，笑了一声，笑得比哭难看，\"这话得改改。那晚上，沟里喊话让进去接灯，五个人，站着没动的两个，转身跑了的两个。我呢——我往里迈了半步。\"\n\n他抬起左腿，在干土上跺了跺。\n\n\"就这半步，把它吓回去了。\"\n\n\"把什么吓回去了？\"\n\n\"灯。\"酒糟鼻说，\"灯在往出走。我半步迎上去，它一缩，退回去了。打那以后，再没出来过。\"\n\n柳丛里静得只剩水声。我在心里过了一遍——五月初一夜里，灯不是熄的，是退回去的。\n\n\"那晚的雨大。\"酒糟鼻自己接着说，没人问，他像是憋了三十年，不吐不行，\"我们五个人在沟口躲雨，子时刚过，里头的灯亮了。亮得邪性——雨那么大，那光不散，一道一道从缝里头淌出来，淌在雨里都不灭。里头有人喊，喊了三遍，说灯起了，进来接灯。\"\n\n\"喊的什么话？\"\n\n\"就一句。\"酒糟鼻说，\"'灯起了，接灯的进来。'\"\n\n\"你们五个人，谁是说好了接灯的？\"\n\n\"没有说好的。\"他说，\"当年订油的人说了，接灯的到那儿自然知道。可到了地头，谁也不知道自己是不是。灯一亮，五个人你看我，我看你，谁也不敢先动。\"\n\n\"后来呢？\"\n\n\"后来耗着。雨越下越大，灯光一道一道往外淌，淌到第四道的时候，我不行了。\"他抬起头，眼睛在黑地里亮得吓人，\"不是害怕。是那光往人身上淌的时候，暖的。像有一只手往里拉你。我腿自己迈出去半步——就那半步，灯缩回去了。\"\n\n\"剩下的四个人呢？\"\n\n\"两个跑的，是两头最精的。\"酒糟鼻说，\"我到今天不怪他们。没跑的两个，站在原地没动，等灯再出来。等到天亮，灯没出来，他们进去了。\"\n\n他把这话说完，长长地喘了一口气，像卸下来一副挑了三十年的担子。\n\n\"进去了就没出来。\"把头说。\n\n\"没出来。\"酒糟鼻说，\"山里人后来都说五进两出，其实账不是那么算的。进去了的，兴许还在里头守灯。跑出来的，\"他拍了拍自己的胸口，\"才是真死在外头的。\"\n\n\"我跑了。\"酒糟鼻说，\"跑出山，跑过江，一跑三十年。别人当我是逃了活命，只有我自己知道，我是把一样东西带出来了，怕人找。\"\n\n他从怀里摸出一个布包，一层一层打开。里头是一枚黑铁物件，杯口大，钉帽上一圈细纹——鱼尾，一深一浅。\n\n\"锅钉。\"把头伸手要去接，手到半道停住了，\"这是印里那口大锅上的。\"\n\n\"当年盟坛散伙，消奴不服，大锅是当众劈了的。\"酒糟鼻把布包往把头手里一塞，\"我抠了一枚钉。三十年，我枕着它睡。上个月我听说有人背锅上台、当众认账，我就想——时候到了，这钉该回家了。\"\n\n把头捏着那枚锅钉，对着月亮看。钉帽上的鱼尾，跟镜背的、锅底的、铜模的，是一个刀路里出来的。\n\n\"还有一个时辰，\"酒糟鼻往北边努了努嘴，\"还有位要来。他来跟你们说的话，比我多。我先说明白，他说的每一个字，你们记住了——那是我拿三十年换不来的。\"\n\n我们刚在树后重新蹲下，柳丛深处就响起了脚步声。\n\n很轻，很稳，一步是一步。来人穿旧褂子，背微驼，走到离老柳五六步的地方站定，没再近。月亮钻出云缝，照亮他半边身子——脸还是在暗处。\n\n\"王显生。\"他开口了。\n\n把头的脊背当场就僵了。三十七年，头一回有人连名带姓叫他，用的是受镜那晚的腔调。\n\n\"是我。\"\n\n\"锅，初一夜里走了。\"那人说，\"你们也知道了？\"\n\n\"掌灯的说的。\"把头说，\"还说同伙到了，它就不叫了。\"\n\n\"他只说对一半。\"那人说，\"它是走了，可它走得不情愿。有人拿一盏灯在前头引它——它认灯，不认人。真灯假灯，它分不出来。\"\n\n\"假灯？\"\n\n\"火头朝水、烟往山下走的，是引灯。\"那人说，\"正经的山灯，火头朝上。你们加油站那盏，谷雨里叫人摘走的那盏，就是引灯的一种。\"\n\n\"摘灯的是谁？\"把头问。\n\n\"不知道。\"那人说，\"做引灯的手艺，糙。灯骨扎得歪，糊纸的浆子都不对。做灯的人要是看见了，得心疼死。\"\n\n把头和我想的是同一个人——老鼠男摊上那盏糊了一半的。\n\n\"您说它在走岔路，\"我问，\"岔到哪儿去了？\"\n\n\"岔到引灯的人想让它去的地方。\"那人说，\"锅是认位的，位在盟坛。可要是半道上有人拿灯把它的头别过来，它就一头扎进不该进的缝。山里封着的东西多了，它要是把哪一道封给顶开了——\"他没说下去，\"所以我说，再等等。\"\n\n我想起老鼠男那句\"摘灯的手生，扯坏了半边\"，后脊一层凉。\n\n\"我上你们家去，\"那人说，\"是让锅再等等。正主没到，灯没归位，它这时候进山，走的是岔路。岔路上的锅，扣不到该扣的位子上。\"\n\n\"正主是谁？\"我问。\n\n那人朝我这边偏了偏头。月光扫过他的下颌，又停了。\n\n\"初五你就见着了。\"他说，\"他等你，等得不比你短。\"\n\n\"灯亮一盏，走一个。\"把头把马渡霜的话端出来，\"这话到底怎么讲？\"\n\n那人沉默了一阵。久到我以为他不会答了。\n\n\"一盏灯，一个接灯的。\"他终于说，\"灯亮，接灯的就得往里走。三十年前那盏，走的是马家的师兄。往后几盏走谁——\"\n\n把头往前逼了半步：\"三十七年前你给我受镜，也是这样的话——半句。今夜你再说半句，我们爷俩就白蹲这一宿。\"\n\n那人在黑地里站了很久。月亮让他头顶的云遮着，看不出他在看谁。\n\n\"半句就半句。\"他说，\"三十年前那盏灯，亮的不是头一盏。山里那套灯，兴了不止一回。每一回亮，都得有人接灯往里走——接灯的走一个，灯就在里头多守一盏。你们当里头是空的？\"他顿了顿，\"里头站满了人。\"\n\n他把话顿住了，转身要走，又停下，补了半句：\n\n\"背锅的，你记住。到了石室，灯让你点你就点，让你走你就走。别问。问，就点不着了。\"\n\n脚步声往北去了，很快没了。\n\n酒糟鼻不知什么时候站到了我们边上，往那个方向看了一眼，低声说：\"他这半句，是白送你们的。三十年前他没说，我等了三十年。\"\n\n\"初五，\"把头问，\"你也去？\"\n\n\"去。\"酒糟鼻把空了的手揣回怀里，\"我把三十年攒的话，都说完。\"\n\n散的时候，天已经透出灰意。我和把头深一脚浅一脚往回走，快到村口，加油站那边有个人影迎过来——是老陈，五女山北坡的护林员，连夜捎信下来的。\n\n\"可算找着你们了。\"他喘着气，\"我天不亮就下山了。北坡东边山坳里——夜里亮起两盏灯。挂枯树上的。\"\n\n\"什么时候的事？\"\n\n\"后半夜。\"老陈说，\"我当是眼花，揉了半天。天都亮了，那两盏还亮着。\"", "words": 3163, "html": "<p>五月初一，天黑以后，把头带我出的村。<\/p>\n<p>鱼哥要跟，把头没让。\"你留下看家。\"他说，\"锅在，人在。今晚谁都别开门。\"<\/p>\n<p>鱼哥应了，把黑鸡抱进怀里，坐到门槛上。我知道他心里不痛快，可这事确实不能带他——夜访者那句\"再等等\"，是从鱼哥耳朵里过的，再来一个场面对不上，反倒乱。<\/p>\n<p>柳树丛里潮气重。把头挑了棵歪脖柳，两人在树后的干土上蹲下，烟袋揣着，火不敢见。月亮让云遮着，一阵亮一阵暗，河滩上的水一浪一浪地翻白。<\/p>\n<p>等以前，把头把该交底的都交了。<\/p>\n<p>\"一会儿来的人，不管说什么，你只带耳朵。\"他说，\"他们那辈人的话，一人一个说法，你接了谁的茬，就断了谁的线。\"<\/p>\n<p>\"那要是他们问您当年受镜的事呢？\"<\/p>\n<p>\"问就答。\"把头说，\"三十七年的账，人家记得比我清。\"<\/p>\n<p>这话不像他。平时把头是账上最清楚的一个，今晚却像把自己摆到了被告的位子上。我想问，没问。<\/p>\n<p>河对岸有夜鸟叫了两声，又没了。水声一阵大一阵小，人的耳朵在黑地里熬着，熬到后来，连自己的心跳都跟水声搅在一块儿。把头在我边上，一动不动，烟袋在手里，连转都不转了。<\/p>\n<p>等了小半个时辰，苇塘那边先有了动静。<\/p>\n<p>不是脚步声。是咳嗽——压着的、哑的，咳两声停一停，越咳越近。一个人从苇塘里钻出来，个头不高，瘦，左腿拖着地，走三步歇一步。<\/p>\n<p>酒糟鼻。<\/p>\n<p>他走到老柳底下，没看我们藏身的地方，先伸手摸了摸树皮上那个鱼尾刻痕。摸完，他才开口，冲着黑处说：<\/p>\n<p>\"出来吧。刻了字等人的人，没有躲在树后头的道理。\"<\/p>\n<p>把头站了起来，把我也从树后带出来。<\/p>\n<p>酒糟鼻转过脸。这张脸让酒糟糟的红斑盖了半边，眼睛倒亮，亮得不像六十多岁的人。他上上下下打量把头，又打量我，末了目光落在我胸口——隔着两层布，他也像闻见了什么。<\/p>\n<p>\"契在你身上。\"他说，\"好。省得我多走一趟。\"<\/p>\n<p>\"你是当年的接应。\"把头开口，\"五进两出，活着出来的那个。\"<\/p>\n<p>\"活着出来的。\"酒糟鼻咂摸了一下这五个字，笑了一声，笑得比哭难看，\"这话得改改。那晚上，沟里喊话让进去接灯，五个人，站着没动的两个，转身跑了的两个。我呢——我往里迈了半步。\"<\/p>\n<p>他抬起左腿，在干土上跺了跺。<\/p>\n<p>\"就这半步，把它吓回去了。\"<\/p>\n<p>\"把什么吓回去了？\"<\/p>\n<p>\"灯。\"酒糟鼻说，\"灯在往出走。我半步迎上去，它一缩，退回去了。打那以后，再没出来过。\"<\/p>\n<p>柳丛里静得只剩水声。我在心里过了一遍——五月初一夜里，灯不是熄的，是退回去的。<\/p>\n<p>\"那晚的雨大。\"酒糟鼻自己接着说，没人问，他像是憋了三十年，不吐不行，\"我们五个人在沟口躲雨，子时刚过，里头的灯亮了。亮得邪性——雨那么大，那光不散，一道一道从缝里头淌出来，淌在雨里都不灭。里头有人喊，喊了三遍，说灯起了，进来接灯。\"<\/p>\n<p>\"喊的什么话？\"<\/p>\n<p>\"就一句。\"酒糟鼻说，\"'灯起了，接灯的进来。'\"<\/p>\n<p>\"你们五个人，谁是说好了接灯的？\"<\/p>\n<p>\"没有说好的。\"他说，\"当年订油的人说了，接灯的到那儿自然知道。可到了地头，谁也不知道自己是不是。灯一亮，五个人你看我，我看你，谁也不敢先动。\"<\/p>\n<p>\"后来呢？\"<\/p>\n<p>\"后来耗着。雨越下越大，灯光一道一道往外淌，淌到第四道的时候，我不行了。\"他抬起头，眼睛在黑地里亮得吓人，\"不是害怕。是那光往人身上淌的时候，暖的。像有一只手往里拉你。我腿自己迈出去半步——就那半步，灯缩回去了。\"<\/p>\n<p>\"剩下的四个人呢？\"<\/p>\n<p>\"两个跑的，是两头最精的。\"酒糟鼻说，\"我到今天不怪他们。没跑的两个，站在原地没动，等灯再出来。等到天亮，灯没出来，他们进去了。\"<\/p>\n<p>他把这话说完，长长地喘了一口气，像卸下来一副挑了三十年的担子。<\/p>\n<p>\"进去了就没出来。\"把头说。<\/p>\n<p>\"没出来。\"酒糟鼻说，\"山里人后来都说五进两出，其实账不是那么算的。进去了的，兴许还在里头守灯。跑出来的，\"他拍了拍自己的胸口，\"才是真死在外头的。\"<\/p>\n<p>\"我跑了。\"酒糟鼻说，\"跑出山，跑过江，一跑三十年。别人当我是逃了活命，只有我自己知道，我是把一样东西带出来了，怕人找。\"<\/p>\n<p>他从怀里摸出一个布包，一层一层打开。里头是一枚黑铁物件，杯口大，钉帽上一圈细纹——鱼尾，一深一浅。<\/p>\n<p>\"锅钉。\"把头伸手要去接，手到半道停住了，\"这是印里那口大锅上的。\"<\/p>\n<p>\"当年盟坛散伙，消奴不服，大锅是当众劈了的。\"酒糟鼻把布包往把头手里一塞，\"我抠了一枚钉。三十年，我枕着它睡。上个月我听说有人背锅上台、当众认账，我就想——时候到了，这钉该回家了。\"<\/p>\n<p>把头捏着那枚锅钉，对着月亮看。钉帽上的鱼尾，跟镜背的、锅底的、铜模的，是一个刀路里出来的。<\/p>\n<p>\"还有一个时辰，\"酒糟鼻往北边努了努嘴，\"还有位要来。他来跟你们说的话，比我多。我先说明白，他说的每一个字，你们记住了——那是我拿三十年换不来的。\"<\/p>\n<p>我们刚在树后重新蹲下，柳丛深处就响起了脚步声。<\/p>\n<p>很轻，很稳，一步是一步。来人穿旧褂子，背微驼，走到离老柳五六步的地方站定，没再近。月亮钻出云缝，照亮他半边身子——脸还是在暗处。<\/p>\n<p>\"王显生。\"他开口了。<\/p>\n<p>把头的脊背当场就僵了。三十七年，头一回有人连名带姓叫他，用的是受镜那晚的腔调。<\/p>\n<p>\"是我。\"<\/p>\n<p>\"锅，初一夜里走了。\"那人说，\"你们也知道了？\"<\/p>\n<p>\"掌灯的说的。\"把头说，\"还说同伙到了，它就不叫了。\"<\/p>\n<p>\"他只说对一半。\"那人说，\"它是走了，可它走得不情愿。有人拿一盏灯在前头引它——它认灯，不认人。真灯假灯，它分不出来。\"<\/p>\n<p>\"假灯？\"<\/p>\n<p>\"火头朝水、烟往山下走的，是引灯。\"那人说，\"正经的山灯，火头朝上。你们加油站那盏，谷雨里叫人摘走的那盏，就是引灯的一种。\"<\/p>\n<p>\"摘灯的是谁？\"把头问。<\/p>\n<p>\"不知道。\"那人说，\"做引灯的手艺，糙。灯骨扎得歪，糊纸的浆子都不对。做灯的人要是看见了，得心疼死。\"<\/p>\n<p>把头和我想的是同一个人——老鼠男摊上那盏糊了一半的。<\/p>\n<p>\"您说它在走岔路，\"我问，\"岔到哪儿去了？\"<\/p>\n<p>\"岔到引灯的人想让它去的地方。\"那人说，\"锅是认位的，位在盟坛。可要是半道上有人拿灯把它的头别过来，它就一头扎进不该进的缝。山里封着的东西多了，它要是把哪一道封给顶开了——\"他没说下去，\"所以我说，再等等。\"<\/p>\n<p>我想起老鼠男那句\"摘灯的手生，扯坏了半边\"，后脊一层凉。<\/p>\n<p>\"我上你们家去，\"那人说，\"是让锅再等等。正主没到，灯没归位，它这时候进山，走的是岔路。岔路上的锅，扣不到该扣的位子上。\"<\/p>\n<p>\"正主是谁？\"我问。<\/p>\n<p>那人朝我这边偏了偏头。月光扫过他的下颌，又停了。<\/p>\n<p>\"初五你就见着了。\"他说，\"他等你，等得不比你短。\"<\/p>\n<p>\"灯亮一盏，走一个。\"把头把马渡霜的话端出来，\"这话到底怎么讲？\"<\/p>\n<p>那人沉默了一阵。久到我以为他不会答了。<\/p>\n<p>\"一盏灯，一个接灯的。\"他终于说，\"灯亮，接灯的就得往里走。三十年前那盏，走的是马家的师兄。往后几盏走谁——\"<\/p>\n<p>把头往前逼了半步：\"三十七年前你给我受镜，也是这样的话——半句。今夜你再说半句，我们爷俩就白蹲这一宿。\"<\/p>\n<p>那人在黑地里站了很久。月亮让他头顶的云遮着，看不出他在看谁。<\/p>\n<p>\"半句就半句。\"他说，\"三十年前那盏灯，亮的不是头一盏。山里那套灯，兴了不止一回。每一回亮，都得有人接灯往里走——接灯的走一个，灯就在里头多守一盏。你们当里头是空的？\"他顿了顿，\"里头站满了人。\"<\/p>\n<p>他把话顿住了，转身要走，又停下，补了半句：<\/p>\n<p>\"背锅的，你记住。到了石室，灯让你点你就点，让你走你就走。别问。问，就点不着了。\"<\/p>\n<p>脚步声往北去了，很快没了。<\/p>\n<p>酒糟鼻不知什么时候站到了我们边上，往那个方向看了一眼，低声说：\"他这半句，是白送你们的。三十年前他没说，我等了三十年。\"<\/p>\n<p>\"初五，\"把头问，\"你也去？\"<\/p>\n<p>\"去。\"酒糟鼻把空了的手揣回怀里，\"我把三十年攒的话，都说完。\"<\/p>\n<p>散的时候，天已经透出灰意。我和把头深一脚浅一脚往回走，快到村口，加油站那边有个人影迎过来——是老陈，五女山北坡的护林员，连夜捎信下来的。<\/p>\n<p>\"可算找着你们了。\"他喘着气，\"我天不亮就下山了。北坡东边山坳里——夜里亮起两盏灯。挂枯树上的。\"<\/p>\n<p>\"什么时候的事？\"<\/p>\n<p>\"后半夜。\"老陈说，\"我当是眼花，揉了半天。天都亮了，那两盏还亮着。\"<\/p>", "plain": "五月初一，天黑以后，把头带我出的村。 鱼哥要跟，把头没让。\"你留下看家。\"他说，\"锅在，人在。今晚谁都别开门。\" 鱼哥应了，把黑鸡抱进怀里，坐到门槛上。我知道他心里不痛快，可这事确实不能带他——夜访者那句\"再等等\"，是从鱼哥耳朵里过的，再来一个场面对不上，反倒乱。 柳树丛里潮气重。把头挑了棵歪脖柳，两人在树后的干土上蹲下，烟袋揣着，火不敢见。月亮让云遮着，一阵亮一阵暗，河滩上的水一浪一浪地翻白。 等以前，把头把该交底的都交了。 \"一会儿来的人，不管说什么，你只带耳朵。\"他说，\"他们那辈人的话，一人一个说法，你接了谁的茬，就断了谁的线。\" \"那要是他们问您当年受镜的事呢？\" \"问就答。\"把头说，\"三十七年的账，人家记得比我清。\" 这话不像他。平时把头是账上最清楚的一个，今晚却像把自己摆到了被告的位子上。我想问，没问。 河对岸有夜鸟叫了两声，又没了。水声一阵大一阵小，人的耳朵在黑地里熬着，熬到后来，连自己的心跳都跟水声搅在一块儿。把头在我边上，一动不动，烟袋在手里，连转都不转了。 等了小半个时辰，苇塘那边先有了动静。 不是脚步声。是咳嗽——压着的、哑的，咳两声停一停，越咳越近。一个人从苇塘里钻出来，个头不高，瘦，左腿拖着地，走三步歇一步。 酒糟鼻。 他走到老柳底下，没看我们藏身的地方，先伸手摸了摸树皮上那个鱼尾刻痕。摸完，他才开口，冲着黑处说： \"出来吧。刻了字等人的人，没有躲在树后头的道理。\" 把头站了起来，把我也从树后带出来。 酒糟鼻转过脸。这张脸让酒糟糟的红斑盖了半边，眼睛倒亮，亮得不像六十多岁的人。他上上下下打量把头，又打量我，末了目光落在我胸口——隔着两层布，他也像闻见了什么。 \"契在你身上。\"他说，\"好。省得我多走一趟。\" \"你是当年的接应。\"把头开口，\"五进两出，活着出来的那个。\" \"活着出来的。\"酒糟鼻咂摸了一下这五个字，笑了一声，笑得比哭难看，\"这话得改改。那晚上，沟里喊话让进去接灯，五个人，站着没动的两个，转身跑了的两个。我呢——我往里迈了半步。\" 他抬起左腿，在干土上跺了跺。 \"就这半步，把它吓回去了。\" \"把什么吓回去了？\" \"灯。\"酒糟鼻说，\"灯在往出走。我半步迎上去，它一缩，退回去了。打那以后，再没出来过。\" 柳丛里静得只剩水声。我在心里过了一遍——五月初一夜里，灯不是熄的，是退回去的。 \"那晚的雨大。\"酒糟鼻自己接着说，没人问，他像是憋了三十年，不吐不行，\"我们五个人在沟口躲雨，子时刚过，里头的灯亮了。亮得邪性——雨那么大，那光不散，一道一道从缝里头淌出来，淌在雨里都不灭。里头有人喊，喊了三遍，说灯起了，进来接灯。\" \"喊的什么话？\" \"就一句。\"酒糟鼻说，\"'灯起了，接灯的进来。'\" \"你们五个人，谁是说好了接灯的？\" \"没有说好的。\"他说，\"当年订油的人说了，接灯的到那儿自然知道。可到了地头，谁也不知道自己是不是。灯一亮，五个人你看我，我看你，谁也不敢先动。\" \"后来呢？\" \"后来耗着。雨越下越大，灯光一道一道往外淌，淌到第四道的时候，我不行了。\"他抬起头，眼睛在黑地里亮得吓人，\"不是害怕。是那光往人身上淌的时候，暖的。像有一只手往里拉你。我腿自己迈出去半步——就那半步，灯缩回去了。\" \"剩下的四个人呢？\" \"两个跑的，是两头最精的。\"酒糟鼻说，\"我到今天不怪他们。没跑的两个，站在原地没动，等灯再出来。等到天亮，灯没出来，他们进去了。\" 他把这话说完，长长地喘了一口气，像卸下来一副挑了三十年的担子。 \"进去了就没出来。\"把头说。 \"没出来。\"酒糟鼻说，\"山里人后来都说五进两出，其实账不是那么算的。进去了的，兴许还在里头守灯。跑出来的，\"他拍了拍自己的胸口，\"才是真死在外头的。\" \"我跑了。\"酒糟鼻说，\"跑出山，跑过江，一跑三十年。别人当我是逃了活命，只有我自己知道，我是把一样东西带出来了，怕人找。\" 他从怀里摸出一个布包，一层一层打开。里头是一枚黑铁物件，杯口大，钉帽上一圈细纹——鱼尾，一深一浅。 \"锅钉。\"把头伸手要去接，手到半道停住了，\"这是印里那口大锅上的。\" \"当年盟坛散伙，消奴不服，大锅是当众劈了的。\"酒糟鼻把布包往把头手里一塞，\"我抠了一枚钉。三十年，我枕着它睡。上个月我听说有人背锅上台、当众认账，我就想——时候到了，这钉该回家了。\" 把头捏着那枚锅钉，对着月亮看。钉帽上的鱼尾，跟镜背的、锅底的、铜模的，是一个刀路里出来的。 \"还有一个时辰，\"酒糟鼻往北边努了努嘴，\"还有位要来。他来跟你们说的话，比我多。我先说明白，他说的每一个字，你们记住了——那是我拿三十年换不来的。\" 我们刚在树后重新蹲下，柳丛深处就响起了脚步声。 很轻，很稳，一步是一步。来人穿旧褂子，背微驼，走到离老柳五六步的地方站定，没再近。月亮钻出云缝，照亮他半边身子——脸还是在暗处。 \"王显生。\"他开口了。 把头的脊背当场就僵了。三十七年，头一回有人连名带姓叫他，用的是受镜那晚的腔调。 \"是我。\" \"锅，初一夜里走了。\"那人说，\"你们也知道了？\" \"掌灯的说的。\"把头说，\"还说同伙到了，它就不叫了。\" \"他只说对一半。\"那人说，\"它是走了，可它走得不情愿。有人拿一盏灯在前头引它——它认灯，不认人。真灯假灯，它分不出来。\" \"假灯？\" \"火头朝水、烟往山下走的，是引灯。\"那人说，\"正经的山灯，火头朝上。你们加油站那盏，谷雨里叫人摘走的那盏，就是引灯的一种。\" \"摘灯的是谁？\"把头问。 \"不知道。\"那人说，\"做引灯的手艺，糙。灯骨扎得歪，糊纸的浆子都不对。做灯的人要是看见了，得心疼死。\" 把头和我想的是同一个人——老鼠男摊上那盏糊了一半的。 \"您说它在走岔路，\"我问，\"岔到哪儿去了？\" \"岔到引灯的人想让它去的地方。\"那人说，\"锅是认位的，位在盟坛。可要是半道上有人拿灯把它的头别过来，它就一头扎进不该进的缝。山里封着的东西多了，它要是把哪一道封给顶开了——\"他没说下去，\"所以我说，再等等。\" 我想起老鼠男那句\"摘灯的手生，扯坏了半边\"，后脊一层凉。 \"我上你们家去，\"那人说，\"是让锅再等等。正主没到，灯没归位，它这时候进山，走的是岔路。岔路上的锅，扣不到该扣的位子上。\" \"正主是谁？\"我问。 那人朝我这边偏了偏头。月光扫过他的下颌，又停了。 \"初五你就见着了。\"他说，\"他等你，等得不比你短。\" \"灯亮一盏，走一个。\"把头把马渡霜的话端出来，\"这话到底怎么讲？\" 那人沉默了一阵。久到我以为他不会答了。 \"一盏灯，一个接灯的。\"他终于说，\"灯亮，接灯的就得往里走。三十年前那盏，走的是马家的师兄。往后几盏走谁——\" 把头往前逼了半步：\"三十七年前你给我受镜，也是这样的话——半句。今夜你再说半句，我们爷俩就白蹲这一宿。\" 那人在黑地里站了很久。月亮让他头顶的云遮着，看不出他在看谁。 \"半句就半句。\"他说，\"三十年前那盏灯，亮的不是头一盏。山里那套灯，兴了不止一回。每一回亮，都得有人接灯往里走——接灯的走一个，灯就在里头多守一盏。你们当里头是空的？\"他顿了顿，\"里头站满了人。\" 他把话顿住了，转身要走，又停下，补了半句： \"背锅的，你记住。到了石室，灯让你点你就点，让你走你就走。别问。问，就点不着了。\" 脚步声往北去了，很快没了。 酒糟鼻不知什么时候站到了我们边上，往那个方向看了一眼，低声说：\"他这半句，是白送你们的。三十年前他没说，我等了三十年。\" \"初五，\"把头问，\"你也去？\" \"去。\"酒糟鼻把空了的手揣回怀里，\"我把三十年攒的话，都说完。\" 散的时候，天已经透出灰意。我和把头深一脚浅一脚往回走，快到村口，加油站那边有个人影迎过来——是老陈，五女山北坡的护林员，连夜捎信下来的。 \"可算找着你们了。\"他喘着气，\"我天不亮就下山了。北坡东边山坳里——夜里亮起两盏灯。挂枯树上的。\" \"什么时候的事？\" \"后半夜。\"老陈说，\"我当是眼花，揉了半天。天都亮了，那两盏还亮着。\""}, {"id": "A5-097", "arc": "A5", "num": 97, "title": "早灯", "md": "老陈的话在炕桌上放了一夜，谁也没动它。\n\n天没亮，屋里人就齐了。鱼哥蹲在炕梢，小萱倚着门框，豆芽仔的信还压在醋碟底下。谁都没睡踏实，谁也不先开口。\n\n还是老陈先说话。他就蹲在门槛上，一袋接一袋地抽烟，说到灯的时候，手都有点比划不稳。\n\n\"我起初当是山下人上坟。\"他说，\"可那位置不对——山坳里头，前不着村后不着店。我捡了两块石头扔过去，石头打在树上，灯晃了晃，火苗愣是没歪。\"\n\n\"你靠近看了没有？\"\n\n\"没有。\"老陈摇头，\"我干护林十来年，山里的邪性事，宁可信其有。我就下来报信了——反正那白头发老头常在的地方，我去熟。\"\n\n天大亮，把头才开口：\"引灯。\"\n\n\"您怎么断定是引灯？\"我问。\n\n\"正经山灯，挂在庙、挂在门、挂在人的窗前头，图个照。\"把头说，\"挂枯树上的灯，不是照人的，是引东西的。火头朝水，烟往山下走——山里那些认灯不认人的物件，见着就得跟。\"\n\n\"领路锅，是初一夜里进山的。\"我说，\"那这两盏——\"\n\n\"是给它带道的。\"把头说，\"领路的锅进了山，还得有灯把道接上。有人等不了初五，夜里就把道铺上了。\"\n\n\"那正经的灯会还办不办？\"鱼哥问。\n\n\"办。\"把头说，\"引灯引的是锅，不是名分。名分要过明路，就得正日子、正地方、正的灯。有人铺岔道，咱们走正道——两头都别耽误。\"\n\n老陈临走前，把头托他一件事：这四天，那两盏灯要是灭了，或者挪了窝，想方设法捎个信下来。老陈应了，揣上两个饼子就往北坡走。走到院门口他回头说了一句：\"那老头好些天没见着了。往常这个日子，他早该在老地方坐着了。\"\n\n这句话谁也没接。可我知道，把头把它记下了。\n\n早饭后，豆芽仔从桓仁捎回第二封信。这封信比头一封沉，字也写得慌：\n\n马渡霜的佛具店，门板下了，人不在。隔壁说初三一早见她出的门，背了个包袱，往东去的，再没回来。她水汊子那间独屋，门虚掩着，佛灯没吹，牌位前的香烧过了三炷，灰是整段的，没人动过。\n\n\"整段的香灰，说明她走得急，\"把头把信纸折起来，\"但不是被人架走的。架走的，屋里得翻。\"\n\n\"她说过，初五那天她要是不露面，别找她。\"我说。\n\n\"她这话是初三之前说的。\"把头站起来，\"人初三就没了影。她没等到初五，就先躲了。\"\n\n\"躲什么？\"\n\n\"躲她该走的那个位子。\"把头说完这句，自己顿了一下，像是说漏了什么，摆摆手，\"备东西吧。\"\n\n我明白他把头半句咽回去的是什么。灯亮一盏，走一个——走的是接灯的。马家师兄当年接的是第一盏。那她马家的人，往后几盏里头，有没有她的位？\n\n她要是自己想明白了这个，走得急，就不奇怪了。\n\n\"要不要找？\"我问。\n\n\"初五之前不找。\"把头说，\"她要是想藏，桓仁城里翻不出来。她要是想露面，不用我们找。\"\n\n当天的正事是把初五的行程钉死。路线照旧——不走官道，晨起进沟，天黑前抵石室。分工：鱼哥背粮和灯，把头拿契匣和锅钉，锅在我背上；豆芽仔守桓仁，一有动静往村里捎信；小萱看家。\n\n锅钉单独收了。把头拿一块新红布把酒糟鼻那枚锅钉包了三层，跟契放进一个匣子。\n\n\"这物件比契还沉。\"他说，\"盟坛上劈锅的那笔账，三十年没人认。初五要是有人翻旧账，它就是证。\"\n\n粮和水是鱼哥去王瘸子家备的。王瘸子听说是进山，没多问，塞过来一包熏好的干鱼，外加一句：\"蛇药带着。沟里那东西，今年开春就没露过面，不正常。\"\n\n小萱连夜把三个人的鞋底都纳了一遍，纳完拿蜡在鞋帮上蹭了蹭。她还是话少，就把鞋一双一双摆在我们门口，摆得整整齐齐。\n\n鱼哥听完安排，半天没言语，末了说：\"哥，我昨儿夜里又魇着了。\"\n\n\"梦着什么？\"\n\n\"灯。\"他说。这两个字他说得很艰难，\"一排灯，挂在山缝里头。数了数，七盏。别的都挂着不动，就一盏——它在往外爬。\"\n\n七盏。我心里一动，没敢接话。沈清荷梦里那七头青铜灯，我没跟鱼哥提过一个字。\n\n把头在旁边听着，听完了只问了一句：\"往外爬，爬到哪儿了？\"\n\n\"爬到缝口了。\"鱼哥说，\"灯头都探出缝了。我喊了一声，就醒了。\"\n\n把头和我的目光碰了碰，谁也没说话。\n\n初三夜里，我把把头拽到村北的高地上。\n\n\"您看山。\"\n\n把头顺着我的手看过去。北坡东边山坳的方向，夜色里浮着黄点，不大，可稳。看一会儿，眼晕了，它们还在原地。\n\n\"老陈白天捎下话来，\"我说，\"灯底下落了层灰——灯花的灰，薄薄一层。那灯已经亮了不止一夜。\"\n\n把头眯着眼数了两遍，没吭声。\n\n三粒。\n\n前儿夜里还是两盏。今儿夜里，第三盏灯亮起来了。三盏，隔着老远，摆出的却不是一条线——歪歪的，像有人在山里，一步点一盏，正朝着沟口的方向挪。\n\n\"灯在爬山。\"我把鱼哥梦里那句说了，\"跟鱼哥梦的一模一样。灯在往外爬。\"\n\n把头在高地上站了半宿。下山的时候，他只说了一句：\n\n\"山里那位不点灯。这几盏，是掌灯的点的——他也等不得了，怕夜长梦多。两边都赶着初五，这山里就是一锅滚水，就看谁的火先灭。\"\n\n下山走到村口，把头忽然站住，背对着我。\n\n\"小子，我问你一句话，你想好了再答。\"\n\n\"您问。\"\n\n\"灯亮一盏走一个。高个儿那样的，轮上就得走。\"他顿了顿，\"真轮到你，你走不走？\"\n\n我没马上答。这话没法马上答。想了半天，我说：\"把头，我先问您一句——您当年在扣锅台，为什么不拦着我认账？\"\n\n把头半天没言语。\n\n\"因为拦不住。\"他说，\"名分这东西，认了就是认了。拦住了今儿，拦不住明儿。\"\n\n\"那我走不走，跟您拦不拦，一个理。\"我说，\"轮上了，我就走。可走之前，我把该办的都办完——锅归位，账对清，把头您后半辈子有人管。\"\n\n把头背对着我，站了很久。最后他抬手在自己脸上抹了一把，像抹掉点什么。\n\n\"睡吧。\"他说，\"明儿还有一天的活儿。\"\n\n那晚我躺下以后，听见他在外屋坐到后半夜，烟袋锅子一明一灭，明了一宿。\n\n初四这天过得格外慢。把头让我把契、镜、灯芯、蓝布又检点了一遍，锅钉单独包好，跟契放在一处。傍晚他去了一趟加油站，回来的时候手上多了一张灶王爷，是老鼠男摊上的。\n\n\"他怎么说？\"\n\n\"他没说。\"把头把灶王爷贴在偏屋门后，\"他就问我一句话——背锅的，你知道灯往哪儿挂吗？\"\n\n\"你怎么答的？\"\n\n\"我说不知道。\"把头说，\"他说，答对了。\"\n\n夜里我睡不着，起来喝水，看见小萱在灶房里，就着一点炭火的光纳鞋底。纳的是把头那双——他那双鞋早开了线，他不说，她看出来了。\n\n\"哥。\"她头也没抬，\"你们明天真进沟？\"\n\n\"进。\"\n\n\"都回得来吗？\"\n\n这一问，问得我半天没接上话。灶膛里的炭噼啪响了一声。\n\n\"回得来。\"我说，\"你们把门看好。\"\n\n她\"嗯\"了一声，低头接着纳。锥子扎过鞋底的声音，一下一下的，又稳又密。我站了一会儿，回屋躺下，那声音隔着墙传过来，听着听着，心里竟定了不少。\n\n初四夜里，豆芽仔的信到的，托的还是赶集的老乡。信上的话不多，可每个
