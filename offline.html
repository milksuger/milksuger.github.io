蹭一下，蹭出那声\"吱嘎\"。 锅底下，滴滴答答，往下淌着水。 不，不是水。 手电的光圈里，那液体拉出细细的一条线，黑得发亮，落在卵石上，洇开一小片，又腥又凉的味道顺着沟风飘下来。 我认得这个味道。 跟敲老周店门那人鞋底的黑泥，一模一样。 \"别看了。\"把头在我身后用气声说，声音平得像一碗凉水。 \"顺着它滴的方向走。\" \"锅会领咱们到地方。\" 我压下手电，回头看他。 把头站在黑暗里，眼睛望着那口还在轻轻晃的锅，脸上一丝表情也没有。 \"三十年前那晚，\"他说，\"它也是这么，给我领的路。\""}, {"id": "A5-066", "arc": "A5", "num": 66, "title": "黑眉", "md": "那口吊锅在半空晃着，滴出来的黑泥在地上洇出一条线。\n\n线的方向，往沟的深处去。\n\n我们跟着它走。\n\n走出百来步，两壁又收拢了，头顶的天窗细成一条缝。黑泥线在卵石上断断续续，每一段洇痕都不大，像有人提着锅一路走一路漏。\n\n我越走越觉得不对。\n\n不是因为邪性——是因为这泥滴得太**匀**了。每隔七八步一滴，每滴大小相当，滴痕边缘齐整。提着锅的人再稳，走山路也不会这么匀。\n\n除非提锅的，不是人。\n\n前头的王药根忽然站住了。\n\n他站的位置很讲究：左脚虚点地，重心在后，响哨棍横在身前。两只老避龙蹲在他两边的卵石上，脖子上的毛炸到极限，喉咙里滚着几乎听不见的咕声。\n\n我顺着他的目光往前看。\n\n前方七八步，黑泥线的尽头，是一块从西壁塌下来的巨石，半人高，像个塌了肩膀的驼子。\n\n巨石的阴影里，盘着一样东西。\n\n起先我以为是树根——黑褐油亮，一圈盘着一圈。等我的眼睛适应了黑暗，看清那\"树根\"上有一道白线，从\"根\"的最粗处笔直地划到尖上——\n\n眉毛。\n\n两条黑眉中间，一道雪白的眉心纹。\n\n黑眉。\n\n王药根的气声细得像蚊子：\"两米半……比我爹跟我说的那条还长……\"\n\n蛇盘着，头搁在盘顶上，正对着我们。它的眼睛在黑暗里泛着一层黄，瞳孔竖着，一动不动。\n\n它不躲，也不攻，就那么看着我们——像在**数数**。\n\n长顺的那句话毫无预兆地撞进我脑子：第五个在数我。\n\n我胳膊上的鸡皮疙瘩一层压着一层。\n\n\"都别动。\"王药根的气声抖得厉害，\"它是黑眉王。它不动，是在等咱们先动。老话讲，'贴树皮让路，黑眉王让命'——退，慢慢退，从右边绕，别踩它的影子。\"\n\n我们开始退。\n\n一步，两步。\n\n第三步上，鱼哥脚下的卵石滚了一下。\n\n就这一声轻响——\n\n黑眉动了。\n\n没有预备动作。那盘成塔状的黑影\"哗\"地散开，两米半的身子弹起来半人高，速度快得像鞭子甩出去，直取最前头的王药根面门！\n\n老头到底是玩了一辈子蛇的人。响哨棍横里一架，蛇身\"啪\"地抽在棍身上，震得他连退三步，后腰撞在石壁上。\n\n蛇头悬在半空，离他的脸不到一尺，腥气喷在他脸上。\n\n\"老避龙！\"\n\n两只黑鸡同时扑了出去。\n\n不是逃跑——是**进攻**。两只黑鸡一左一右，翅膀炸开，啄向蛇身的七寸两侧。黑眉王的身子横着一扫，\"咔\"一声，左边那只黑鸡被扫飞出去，撞在石壁上，落地就没了声息。\n\n右边那只黑鸡却死死咬住了蛇的尾巴根。\n\n黑眉王回身来救。\n\n就是这一回身的空当——\n\n鱼哥动了。\n\n他从我身边擦过去，像一堵墙倒过来。我不知道他什么时候蓄的劲，只见他半步踏进，腰胯一拧，右拳从下往上，短促、极快，拳面砸在蛇头侧面——\n\n没有声音。\n\n真的没有声音。那么大一拳，砸在那么大一颗蛇头上，声音像是被拳头吸走了。\n\n黑眉王整个身子僵在半空，僵了足有两秒，然后\"啪嗒\"一声瘫下来，从巨石上滑下去，蛇身抽搐着，越抽越慢。\n\n那只咬着蛇尾的黑鸡还死死不撒口，脖子上的毛全断了，断口渗着血。\n\n\"退开！\"王药根嘶声喊，\"它没死！它在装——\"\n\n话音没落，蛇尾猛地一卷。\n\n黑鸡被卷住了。\n\n黑眉王卷着自己的猎物往巨石的缝隙里缩，速度陡然又快起来。王药根扑上去拽黑鸡，蛇尾一甩，把他整个人甩了个趔趄，右手背上顿时绷起两排血洞。\n\n\"大爷！\"\n\n黑鸡连着两声短促的咯咯，声音戛然而止。\n\n蛇身彻底缩进了巨石底的石缝，最后消失的，是那道雪白的眉心纹。\n\n石缝里安静下来。\n\n黑鸡没再出来。\n\n王药根跪坐在卵石上，右手背血往下淌。他顾不上手，伸手去摸石缝，被鱼哥一把按住：\"大爷！蛇还在里头！\"\n\n\"里头……\"老头喘着粗气，\"里头不是我儿说的那条路……这缝是活的，是空的……\"\n\n鱼哥把我带的手电拧开，光柱探进石缝。\n\n缝比看上去深，两壁齐整——不是天然的齐整，是人凿出来的齐整。光柱打进去七八米，照见缝底一层黑泥，泥上盘着黑眉王刚蜕下来的半张蛇皮，皮上的白眉纹完整得刺眼。\n\n蛇皮后头，泥地的尽头，立着一堵墙。\n\n垒砌的墙。\n\n黑眉王死了没有，没人知道。它拖着那只为我们死的黑鸡，缩进了这道人工的石缝深处。王药根看着自己血淋淋的右手背，忽然笑了，笑得眼角全是泪。\n\n\"好，好……老避龙没白养……\"\n\n他从怀里摸出一个小瓷瓶，倒出点黑褐色的膏子按在伤口上。\n\n\"大爷，你手——\"\n\n\"不碍事。\"他摆摆手，盯着那道石缝，一字一字地说：\n\n\"这一趟，值了。\"\n\n\"我儿子的魂儿，就压在这缝里头。\"", "words": 1669, "html": "<p>那口吊锅在半空晃着，滴出来的黑泥在地上洇出一条线。<\/p>\n<p>线的方向，往沟的深处去。<\/p>\n<p>我们跟着它走。<\/p>\n<p>走出百来步，两壁又收拢了，头顶的天窗细成一条缝。黑泥线在卵石上断断续续，每一段洇痕都不大，像有人提着锅一路走一路漏。<\/p>\n<p>我越走越觉得不对。<\/p>\n<p>不是因为邪性——是因为这泥滴得太<strong>匀<\/strong>了。每隔七八步一滴，每滴大小相当，滴痕边缘齐整。提着锅的人再稳，走山路也不会这么匀。<\/p>\n<p>除非提锅的，不是人。<\/p>\n<p>前头的王药根忽然站住了。<\/p>\n<p>他站的位置很讲究：左脚虚点地，重心在后，响哨棍横在身前。两只老避龙蹲在他两边的卵石上，脖子上的毛炸到极限，喉咙里滚着几乎听不见的咕声。<\/p>\n<p>我顺着他的目光往前看。<\/p>\n<p>前方七八步，黑泥线的尽头，是一块从西壁塌下来的巨石，半人高，像个塌了肩膀的驼子。<\/p>\n<p>巨石的阴影里，盘着一样东西。<\/p>\n<p>起先我以为是树根——黑褐油亮，一圈盘着一圈。等我的眼睛适应了黑暗，看清那\"树根\"上有一道白线，从\"根\"的最粗处笔直地划到尖上——<\/p>\n<p>眉毛。<\/p>\n<p>两条黑眉中间，一道雪白的眉心纹。<\/p>\n<p>黑眉。<\/p>\n<p>王药根的气声细得像蚊子：\"两米半……比我爹跟我说的那条还长……\"<\/p>\n<p>蛇盘着，头搁在盘顶上，正对着我们。它的眼睛在黑暗里泛着一层黄，瞳孔竖着，一动不动。<\/p>\n<p>它不躲，也不攻，就那么看着我们——像在<strong>数数<\/strong>。<\/p>\n<p>长顺的那句话毫无预兆地撞进我脑子：第五个在数我。<\/p>\n<p>我胳膊上的鸡皮疙瘩一层压着一层。<\/p>\n<p>\"都别动。\"王药根的气声抖得厉害，\"它是黑眉王。它不动，是在等咱们先动。老话讲，'贴树皮让路，黑眉王让命'——退，慢慢退，从右边绕，别踩它的影子。\"<\/p>\n<p>我们开始退。<\/p>\n<p>一步，两步。<\/p>\n<p>第三步上，鱼哥脚下的卵石滚了一下。<\/p>\n<p>就这一声轻响——<\/p>\n<p>黑眉动了。<\/p>\n<p>没有预备动作。那盘成塔状的黑影\"哗\"地散开，两米半的身子弹起来半人高，速度快得像鞭子甩出去，直取最前头的王药根面门！<\/p>\n<p>老头到底是玩了一辈子蛇的人。响哨棍横里一架，蛇身\"啪\"地抽在棍身上，震得他连退三步，后腰撞在石壁上。<\/p>\n<p>蛇头悬在半空，离他的脸不到一尺，腥气喷在他脸上。<\/p>\n<p>\"老避龙！\"<\/p>\n<p>两只黑鸡同时扑了出去。<\/p>\n<p>不是逃跑——是<strong>进攻<\/strong>。两只黑鸡一左一右，翅膀炸开，啄向蛇身的七寸两侧。黑眉王的身子横着一扫，\"咔\"一声，左边那只黑鸡被扫飞出去，撞在石壁上，落地就没了声息。<\/p>\n<p>右边那只黑鸡却死死咬住了蛇的尾巴根。<\/p>\n<p>黑眉王回身来救。<\/p>\n<p>就是这一回身的空当——<\/p>\n<p>鱼哥动了。<\/p>\n<p>他从我身边擦过去，像一堵墙倒过来。我不知道他什么时候蓄的劲，只见他半步踏进，腰胯一拧，右拳从下往上，短促、极快，拳面砸在蛇头侧面——<\/p>\n<p>没有声音。<\/p>\n<p>真的没有声音。那么大一拳，砸在那么大一颗蛇头上，声音像是被拳头吸走了。<\/p>\n<p>黑眉王整个身子僵在半空，僵了足有两秒，然后\"啪嗒\"一声瘫下来，从巨石上滑下去，蛇身抽搐着，越抽越慢。<\/p>\n<p>那只咬着蛇尾的黑鸡还死死不撒口，脖子上的毛全断了，断口渗着血。<\/p>\n<p>\"退开！\"王药根嘶声喊，\"它没死！它在装——\"<\/p>\n<p>话音没落，蛇尾猛地一卷。<\/p>\n<p>黑鸡被卷住了。<\/p>\n<p>黑眉王卷着自己的猎物往巨石的缝隙里缩，速度陡然又快起来。王药根扑上去拽黑鸡，蛇尾一甩，把他整个人甩了个趔趄，右手背上顿时绷起两排血洞。<\/p>\n<p>\"大爷！\"<\/p>\n<p>黑鸡连着两声短促的咯咯，声音戛然而止。<\/p>\n<p>蛇身彻底缩进了巨石底的石缝，最后消失的，是那道雪白的眉心纹。<\/p>\n<p>石缝里安静下来。<\/p>\n<p>黑鸡没再出来。<\/p>\n<p>王药根跪坐在卵石上，右手背血往下淌。他顾不上手，伸手去摸石缝，被鱼哥一把按住：\"大爷！蛇还在里头！\"<\/p>\n<p>\"里头……\"老头喘着粗气，\"里头不是我儿说的那条路……这缝是活的，是空的……\"<\/p>\n<p>鱼哥把我带的手电拧开，光柱探进石缝。<\/p>\n<p>缝比看上去深，两壁齐整——不是天然的齐整，是人凿出来的齐整。光柱打进去七八米，照见缝底一层黑泥，泥上盘着黑眉王刚蜕下来的半张蛇皮，皮上的白眉纹完整得刺眼。<\/p>\n<p>蛇皮后头，泥地的尽头，立着一堵墙。<\/p>\n<p>垒砌的墙。<\/p>\n<p>黑眉王死了没有，没人知道。它拖着那只为我们死的黑鸡，缩进了这道人工的石缝深处。王药根看着自己血淋淋的右手背，忽然笑了，笑得眼角全是泪。<\/p>\n<p>\"好，好……老避龙没白养……\"<\/p>\n<p>他从怀里摸出一个小瓷瓶，倒出点黑褐色的膏子按在伤口上。<\/p>\n<p>\"大爷，你手——\"<\/p>\n<p>\"不碍事。\"他摆摆手，盯着那道石缝，一字一字地说：<\/p>\n<p>\"这一趟，值了。\"<\/p>\n<p>\"我儿子的魂儿，就压在这缝里头。\"<\/p>", "plain": "那口吊锅在半空晃着，滴出来的黑泥在地上洇出一条线。 线的方向，往沟的深处去。 我们跟着它走。 走出百来步，两壁又收拢了，头顶的天窗细成一条缝。黑泥线在卵石上断断续续，每一段洇痕都不大，像有人提着锅一路走一路漏。 我越走越觉得不对。 不是因为邪性——是因为这泥滴得太匀了。每隔七八步一滴，每滴大小相当，滴痕边缘齐整。提着锅的人再稳，走山路也不会这么匀。 除非提锅的，不是人。 前头的王药根忽然站住了。 他站的位置很讲究：左脚虚点地，重心在后，响哨棍横在身前。两只老避龙蹲在他两边的卵石上，脖子上的毛炸到极限，喉咙里滚着几乎听不见的咕声。 我顺着他的目光往前看。 前方七八步，黑泥线的尽头，是一块从西壁塌下来的巨石，半人高，像个塌了肩膀的驼子。 巨石的阴影里，盘着一样东西。 起先我以为是树根——黑褐油亮，一圈盘着一圈。等我的眼睛适应了黑暗，看清那\"树根\"上有一道白线，从\"根\"的最粗处笔直地划到尖上—— 眉毛。 两条黑眉中间，一道雪白的眉心纹。 黑眉。 王药根的气声细得像蚊子：\"两米半……比我爹跟我说的那条还长……\" 蛇盘着，头搁在盘顶上，正对着我们。它的眼睛在黑暗里泛着一层黄，瞳孔竖着，一动不动。 它不躲，也不攻，就那么看着我们——像在数数。 长顺的那句话毫无预兆地撞进我脑子：第五个在数我。 我胳膊上的鸡皮疙瘩一层压着一层。 \"都别动。\"王药根的气声抖得厉害，\"它是黑眉王。它不动，是在等咱们先动。老话讲，'贴树皮让路，黑眉王让命'——退，慢慢退，从右边绕，别踩它的影子。\" 我们开始退。 一步，两步。 第三步上，鱼哥脚下的卵石滚了一下。 就这一声轻响—— 黑眉动了。 没有预备动作。那盘成塔状的黑影\"哗\"地散开，两米半的身子弹起来半人高，速度快得像鞭子甩出去，直取最前头的王药根面门！ 老头到底是玩了一辈子蛇的人。响哨棍横里一架，蛇身\"啪\"地抽在棍身上，震得他连退三步，后腰撞在石壁上。 蛇头悬在半空，离他的脸不到一尺，腥气喷在他脸上。 \"老避龙！\" 两只黑鸡同时扑了出去。 不是逃跑——是进攻。两只黑鸡一左一右，翅膀炸开，啄向蛇身的七寸两侧。黑眉王的身子横着一扫，\"咔\"一声，左边那只黑鸡被扫飞出去，撞在石壁上，落地就没了声息。 右边那只黑鸡却死死咬住了蛇的尾巴根。 黑眉王回身来救。 就是这一回身的空当—— 鱼哥动了。 他从我身边擦过去，像一堵墙倒过来。我不知道他什么时候蓄的劲，只见他半步踏进，腰胯一拧，右拳从下往上，短促、极快，拳面砸在蛇头侧面—— 没有声音。 真的没有声音。那么大一拳，砸在那么大一颗蛇头上，声音像是被拳头吸走了。 黑眉王整个身子僵在半空，僵了足有两秒，然后\"啪嗒\"一声瘫下来，从巨石上滑下去，蛇身抽搐着，越抽越慢。 那只咬着蛇尾的黑鸡还死死不撒口，脖子上的毛全断了，断口渗着血。 \"退开！\"王药根嘶声喊，\"它没死！它在装——\" 话音没落，蛇尾猛地一卷。 黑鸡被卷住了。 黑眉王卷着自己的猎物往巨石的缝隙里缩，速度陡然又快起来。王药根扑上去拽黑鸡，蛇尾一甩，把他整个人甩了个趔趄，右手背上顿时绷起两排血洞。 \"大爷！\" 黑鸡连着两声短促的咯咯，声音戛然而止。 蛇身彻底缩进了巨石底的石缝，最后消失的，是那道雪白的眉心纹。 石缝里安静下来。 黑鸡没再出来。 王药根跪坐在卵石上，右手背血往下淌。他顾不上手，伸手去摸石缝，被鱼哥一把按住：\"大爷！蛇还在里头！\" \"里头……\"老头喘着粗气，\"里头不是我儿说的那条路……这缝是活的，是空的……\" 鱼哥把我带的手电拧开，光柱探进石缝。 缝比看上去深，两壁齐整——不是天然的齐整，是人凿出来的齐整。光柱打进去七八米，照见缝底一层黑泥，泥上盘着黑眉王刚蜕下来的半张蛇皮，皮上的白眉纹完整得刺眼。 蛇皮后头，泥地的尽头，立着一堵墙。 垒砌的墙。 黑眉王死了没有，没人知道。它拖着那只为我们死的黑鸡，缩进了这道人工的石缝深处。王药根看着自己血淋淋的右手背，忽然笑了，笑得眼角全是泪。 \"好，好……老避龙没白养……\" 他从怀里摸出一个小瓷瓶，倒出点黑褐色的膏子按在伤口上。 \"大爷，你手——\" \"不碍事。\"他摆摆手，盯着那道石缝，一字一字地说： \"这一趟，值了。\" \"我儿子的魂儿，就压在这缝里头。\""}, {"id": "A5-067", "arc": "A5", "num": 67, "title": "石缝", "md": "王药根右手背敷了药，用布条一缠，说声\"不耽误\"，就要往石缝里钻。\n\n把头一把攥住他胳膊。\n\n\"老丈，蛇还在里头。\"\n\n\"蛇是护东西的。\"王药根说，\"它咬完人缩回去，一时半会儿不出来。这是我家的手艺，我比谁都清楚。\"\n\n\"我知道蛇不出来的道理。\"把头说，\"可我不知道里头还有没有别的。都等一等。\"\n\n他把鱼哥和我也拦了，让我们就地歇脚，把干粮和水分了，自己却蹲到那道石缝跟前，打着手电，一寸一寸地看。\n\n我凑过去。\n\n缝宽不到半米，两壁齐整，凿痕一层压着一层，每一层的走向都一样。把头看了半晌，忽然说：\"云峰，你看这凿痕，是干茬还是湿茬？\"\n\n我贴上去细看。凿痕干净，石粉早被雨水冲走了，茬口却是毛的，没有后来修整的痕迹。\n\n\"干茬。\"我说，\"凿完没修。\"\n\n\"说明什么？\"\n\n\"赶工。\"\n\n\"对喽。\"把头直起腰，\"不是怕人看见——深山老林没人看见。是怕**蛇**看见。\"\n\n我和鱼哥对了个眼神。\n\n\"这缝是给蛇留的门。\"我说。\n\n\"不是给蛇留的门。\"把头摇头，\"是给蛇留的**岗**。你想想，谁家封门，特意在门底下留一条两米半的毒蛇能进出的缝？\"\n\n我心里转了个弯，想明白了。\n\n\"守墓的。\"我说，\"这条缝，两千年里就是这堵墙的岗哨。有东西从缝里过，先过蛇这一关。\"\n\n\"所以黑眉王不是碰上的。\"鱼哥在旁边低声说，\"它是这儿土生土长的岗。两千年里换了一茬又一茬，这一茬最小，才两米半。\"\n\n王药根在旁边听着，脸上的表情说不上是惊还是喜。他忽然扭头问：\"你们说的这些，跟我儿子——\"\n\n\"先看墙。\"把头打断他。\n\n石缝右边，就是那堵墙。\n\n墙从缝口往右延伸，一头扎进西壁的石体里，另一头被塌下来的巨石压着。看走向，是横着把这条支沟封死了。墙面上的石头大大小小，没有一块经凿，全是拣来的河卵石，可垒法极讲究：三块大石垫底，上头一层小石找平，再一层大石压顶，层层咬合，不用一点泥灰。\n\n\"干岔垒。\"我说，\"跟高句丽积石墓的墙法是一个路数。\"\n\n\"不是路数一样。\"把头说，\"这就是积石。云峰，你记住，高句丽人砌石头，跟汉人砌砖是一个道理——他们一辈子跟石头打交道，垒出来的墙，石头之间是**咬**上的，不是堆上的。\"\n\n他让我把光打在墙的某一处，我照办。\n\n那一处，两块大石的咬合缝里，嵌着一枚小小的石片。石片打掉了一角，卡在缝里，严丝合缝。\n\n\"看见没有，这是'锁眼石'。\"把头说，\"拆墙的人只要动了这一块，上头的石头自己就下来压他。这墙不光是封门，是**设了手**的封门。\"\n\n鱼哥倒吸了一口凉气：\"那咱们还拆吗？\"\n\n\"不拆。\"把头说。\n\n我们都看着他。\n\n\"墙是死的，缝是活的。\"他把下巴朝那道蛇缝一点，\"两千年的岗哨，认的是缝，不认墙。老规矩，进封门，不走门，走狗洞。\"\n\n王药根咧嘴想笑，牵动了手背的伤，\"嘶\"了一声。\n\n把头让我打光，他自己趴在缝口，探进半个身子，手电的光柱贴着缝底的黑泥扫过去。\n\n\"云峰，拿我的撬棍来。轻点，别碰两壁。\"\n\n我把撬棍递给他。他侧身挤进缝里，我在缝口打光，鱼哥攥着他的腰带。\n\n缝底的泥有半尺厚。把头用撬棍一点一点地探，探了几下，\"当\"的一声轻响。\n\n他停住，换了手势。我把光压低。\n\n撬棍尖挑出来的时候，泥里带上来两样东西。\n\n一片陶。\n\n一枚铜。\n\n陶片巴掌大，灰陶，素面，边缘齐整，是器物的腹片。把头用拇指抹去泥，翻过来，指腹在断茬上搓了搓：\"两千年的茬口，摸着跟刀切的一样。\"\n\n那枚铜是带钩。\n\n钩身一拃长，钩头是个简化的兽首，通体黑漆古，翻过来，背面圆钮完好。\n\n\"战国到西汉的式样。\"我说，\"中原的东西。\"\n\n\"中原的东西，出现在高句丽早期封门的墙缝里。\"把头把带钩托在手心，\"云峰，这话你接得住吗？\"\n\n我接得住。\n\n\"封门的人里，有中原人。\"我说，\"而且是亲手砌墙的人——带钩是在干活的人身上蹭下来的。\"\n\n把头点了点头，正要说话，忽然停住。\n\n\"别动。\"\n\n他把整张脸转向缝的深处。\n\n\"你们感觉。\"他说。\n\n我趴下去，学着他的样子朝缝里探。\n\n缝底有风。\n\n极细，极凉，一丝一丝地往外走，带着一股说不出的味道——不是泥腥，不是蛇腥。\n\n是烟。\n\n烧了很久的柴火的烟味，混着一丝若有若无的、类似香灰的甜。\n\n把头从缝里退出来，坐在卵石上，仰头看着两壁之间的那一线天，半天没说话。\n\n\"把头，\"我低声问，\"里头有人？\"\n\n\"里头不光有人。\"把头说。\n\n\"里头有人，点了灯。\"\n\n\"而且这灯——\"他站起身，拍拍裤子上的泥，眼睛望着缝口那片黑暗，\"**从两千年前，一直点到了今天。**\"", "words": 1728, "html": "<p>王药根右手背敷了药，用布条一缠，说声\"不耽误\"，就要往石缝里钻。<\/p>\n<p>把头一把攥住他胳膊。<\/p>\n<p>\"老丈，蛇还在里头。\"<\/p>\n<p>\"蛇是护东西的。\"王药根说，\"它咬完人缩回去，一时半会儿不出来。这是我家的手艺，我比谁都清楚。\"<\/p>\n<p>\"我知道蛇不出来的道理。\"把头说，\"可我不知道里头还有没有别的。都等一等。\"<\/p>\n<p>他把鱼哥和我也拦了，让我们就地歇脚，把干粮和水分了，自己却蹲到那道石缝跟前，打着手电，一寸一寸地看。<\/p>\n<p>我凑过去。<\/p>\n<p>缝宽不到半米，两壁齐整，凿痕一层压着一层，每一层的走向都一样。把头看了半晌，忽然说：\"云峰，你看这凿痕，是干茬还是湿茬？\"<\/p>\n<p>我贴上去细看。凿痕干净，石粉早被雨水冲走了，茬口却是毛的，没有后来修整的痕迹。<\/p>\n<p>\"干茬。\"我说，\"凿完没修。\"<\/p>\n<p>\"说明什么？\"<\/p>\n<p>\"赶工。\"<\/p>\n<p>\"对喽。\"把头直起腰，\"不是怕人看见——深山老林没人看见。是怕<strong>蛇<\/strong>看见。\"<\/p>\n<p>我和鱼哥对了个眼神。<\/p>\n<p>\"这缝是给蛇留的门。\"我说。<\/p>\n<p>\"不是给蛇留的门。\"把头摇头，\"是给蛇留的<strong>岗<\/strong>。你想想，谁家封门，特意在门底下留一条两米半的毒蛇能进出的缝？\"<\/p>\n<p>我心里转了个弯，想明白了。<\/p>\n<p>\"守墓的。\"我说，\"这条缝，两千年里就是这堵墙的岗哨。有东西从缝里过，先过蛇这一关。\"<\/p>\n<p>\"所以黑眉王不是碰上的。\"鱼哥在旁边低声说，\"它是这儿土生土长的岗。两千年里换了一茬又一茬，这一茬最小，才两米半。\"<\/p>\n<p>王药根在旁边听着，脸上的表情说不上是惊还是喜。他忽然扭头问：\"你们说的这些，跟我儿子——\"<\/p>\n<p>\"先看墙。\"把头打断他。<\/p>\n<p>石缝右边，就是那堵墙。<\/p>\n<p>墙从缝口往右延伸，一头扎进西壁的石体里，另一头被塌下来的巨石压着。看走向，是横着把这条支沟封死了。墙面上的石头大大小小，没有一块经凿，全是拣来的河卵石，可垒法极讲究：三块大石垫底，上头一层小石找平，再一层大石压顶，层层咬合，不用一点泥灰。<\/p>\n<p>\"干岔垒。\"我说，\"跟高句丽积石墓的墙法是一个路数。\"<\/p>\n<p>\"不是路数一样。\"把头说，\"这就是积石。云峰，你记住，高句丽人砌石头，跟汉人砌砖是一个道理——他们一辈子跟石头打交道，垒出来的墙，石头之间是<strong>咬<\/strong>上的，不是堆上的。\"<\/p>\n<p>他让我把光打在墙的某一处，我照办。<\/p>\n<p>那一处，两块大石的咬合缝里，嵌着一枚小小的石片。石片打掉了一角，卡在缝里，严丝合缝。<\/p>\n<p>\"看见没有，这是'锁眼石'。\"把头说，\"拆墙的人只要动了这一块，上头的石头自己就下来压他。这墙不光是封门，是<strong>设了手<\/strong>的封门。\"<\/p>\n<p>鱼哥倒吸了一口凉气：\"那咱们还拆吗？\"<\/p>\n<p>\"不拆。\"把头说。<\/p>\n<p>我们都看着他。<\/p>\n<p>\"墙是死的，缝是活的。\"他把下巴朝那道蛇缝一点，\"两千年的岗哨，认的是缝，不认墙。老规矩，进封门，不走门，走狗洞。\"<\/p>\n<p>王药根咧嘴想笑，牵动了手背的伤，\"嘶\"了一声。<\/p>\n<p>把头让我打光，他自己趴在缝口，探进半个身子，手电的光柱贴着缝底的黑泥扫过去。<\/p>\n<p>\"云峰，拿我的撬棍来。轻点，别碰两壁。\"<\/p>\n<p>我把撬棍递给他。他侧身挤进缝里，我在缝口打光，鱼哥攥着他的腰带。<\/p>\n<p>缝底的泥有半尺厚。把头用撬棍一点一点地探，探了几下，\"当\"的一声轻响。<\/p>\n<p>他停住，换了手势。我把光压低。<\/p>\n<p>撬棍尖挑出来的时候，泥里带上来两样东西。<\/p>\n<p>一片陶。<\/p>\n<p>一枚铜。<\/p>\n<p>陶片巴掌大，灰陶，素面，边缘齐整，是器物的腹片。把头用拇指抹去泥，翻过来，指腹在断茬上搓了搓：\"两千年的茬口，摸着跟刀切的一样。\"<\/p>\n<p>那枚铜是带钩。<\/p>\n<p>钩身一拃长，钩头是个简化的兽首，通体黑漆古，翻过来，背面圆钮完好。<\/p>\n<p>\"战国到西汉的式样。\"我说，\"中原的东西。\"<\/p>\n<p>\"中原的东西，出现在高句丽早期封门的墙缝里。\"把头把带钩托在手心，\"云峰，这话你接得住吗？\"<\/p>\n<p>我接得住。<\/p>\n<p>\"封门的人里，有中原人。\"我说，\"而且是亲手砌墙的人——带钩是在干活的人身上蹭下来的。\"<\/p>\n<p>把头点了点头，正要说话，忽然停住。<\/p>\n<p>\"别动。\"<\/p>\n<p>他把整张脸转向缝的深处。<\/p>\n<p>\"你们感觉。\"他说。<\/p>\n<p>我趴下去，学着他的样子朝缝里探。<\/p>\n<p>缝底有风。<\/p>\n<p>极细，极凉，一丝一丝地往外走，带着一股说不出的味道——不是泥腥，不是蛇腥。<\/p>\n<p>是烟。<\/p>\n<p>烧了很久的柴火的烟味，混着一丝若有若无的、类似香灰的甜。<\/p>\n<p>把头从缝里退出来，坐在卵石上，仰头看着两壁之间的那一线天，半天没说话。<\/p>\n<p>\"把头，\"我低声问，\"里头有人？\"<\/p>\n<p>\"里头不光有人。\"把头说。<\/p>\n<p>\"里头有人，点了灯。\"<\/p>\n<p>\"而且这灯——\"他站起身，拍拍裤子上的泥，眼睛望着缝口那片黑暗，\"<strong>从两千年前，一直点到了今天。<\/strong>\"<\/p>", "plain": "王药根右手背敷了药，用布条一缠，说声\"不耽误\"，就要往石缝里钻。 把头一把攥住他胳膊。 \"老丈，蛇还在里头。\" \"蛇是护东西的。\"王药根说，\"它咬完人缩回去，一时半会儿不出来。这是我家的手艺，我比谁都清楚。\" \"我知道蛇不出来的道理。\"把头说，\"可我不知道里头还有没有别的。都等一等。\" 他把鱼哥和我也拦了，让我们就地歇脚，把干粮和水分了，自己却蹲到那道石缝跟前，打着手电，一寸一寸地看。 我凑过去。 缝宽不到半米，两壁齐整，凿痕一层压着一层，每一层的走向都一样。把头看了半晌，忽然说：\"云峰，你看这凿痕，是干茬还是湿茬？\" 我贴上去细看。凿痕干净，石粉早被雨水冲走了，茬口却是毛的，没有后来修整的痕迹。 \"干茬。\"我说，\"凿完没修。\" \"说明什么？\" \"赶工。\" \"对喽。\"把头直起腰，\"不是怕人看见——深山老林没人看见。是怕蛇看见。\" 我和鱼哥对了个眼神。 \"这缝是给蛇留的门。\"我说。 \"不是给蛇留的门。\"把头摇头，\"是给蛇留的岗。你想想，谁家封门，特意在门底下留一条两米半的毒蛇能进出的缝？\" 我心里转了个弯，想明白了。 \"守墓的。\"我说，\"这条缝，两千年里就是这堵墙的岗哨。有东西从缝里过，先过蛇这一关。\" \"所以黑眉王不是碰上的。\"鱼哥在旁边低声说，\"它是这儿土生土长的岗。两千年里换了一茬又一茬，这一茬最小，才两米半。\" 王药根在旁边听着，脸上的表情说不上是惊还是喜。他忽然扭头问：\"你们说的这些，跟我儿子——\" \"先看墙。\"把头打断他。 石缝右边，就是那堵墙。 墙从缝口往右延伸，一头扎进西壁的石体里，另一头被塌下来的巨石压着。看走向，是横着把这条支沟封死了。墙面上的石头大大小小，没有一块经凿，全是拣来的河卵石，可垒法极讲究：三块大石垫底，上头一层小石找平，再一层大石压顶，层层咬合，不用一点泥灰。 \"干岔垒。\"我说，\"跟高句丽积石墓的墙法是一个路数。\" \"不是路数一样。\"把头说，\"这就是积石。云峰，你记住，高句丽人砌石头，跟汉人砌砖是一个道理——他们一辈子跟石头打交道，垒出来的墙，石头之间是咬上的，不是堆上的。\" 他让我把光打在墙的某一处，我照办。 那一处，两块大石的咬合缝里，嵌着一枚小小的石片。石片打掉了一角，卡在缝里，严丝合缝。 \"看见没有，这是'锁眼石'。\"把头说，\"拆墙的人只要动了这一块，上头的石头自己就下来压他。这墙不光是封门，是设了手的封门。\" 鱼哥倒吸了一口凉气：\"那咱们还拆吗？\" \"不拆。\"把头说。 我们都看着他。 \"墙是死的，缝是活的。\"他把下巴朝那道蛇缝一点，\"两千年的岗哨，认的是缝，不认墙。老规矩，进封门，不走门，走狗洞。\" 王药根咧嘴想笑，牵动了手背的伤，\"嘶\"了一声。 把头让我打光，他自己趴在缝口，探进半个身子，手电的光柱贴着缝底的黑泥扫过去。 \"云峰，拿我的撬棍来。轻点，别碰两壁。\" 我把撬棍递给他。他侧身挤进缝里，我在缝口打光，鱼哥攥着他的腰带。 缝底的泥有半尺厚。把头用撬棍一点一点地探，探了几下，\"当\"的一声轻响。 他停住，换了手势。我把光压低。 撬棍尖挑出来的时候，泥里带上来两样东西。 一片陶。 一枚铜。 陶片巴掌大，灰陶，素面，边缘齐整，是器物的腹片。把头用拇指抹去泥，翻过来，指腹在断茬上搓了搓：\"两千年的茬口，摸着跟刀切的一样。\" 那枚铜是带钩。 钩身一拃长，钩头是个简化的兽首，通体黑漆古，翻过来，背面圆钮完好。 \"战国到西汉的式样。\"我说，\"中原的东西。\" \"中原的东西，出现在高句丽早期封门的墙缝里。\"把头把带钩托在手心，\"云峰，这话你接得住吗？\" 我接得住。 \"封门的人里，有中原人。\"我说，\"而且是亲手砌墙的人——带钩是在干活的人身上蹭下来的。\" 把头点了点头，正要说话，忽然停住。 \"别动。\" 他把整张脸转向缝的深处。 \"你们感觉。\"他说。 我趴下去，学着他的样子朝缝里探。 缝底有风。 极细，极凉，一丝一丝地往外走，带着一股说不出的味道——不是泥腥，不是蛇腥。 是烟。 烧了很久的柴火的烟味，混着一丝若有若无的、类似香灰的甜。 把头从缝里退出来，坐在卵石上，仰头看着两壁之间的那一线天，半天没说话。 \"把头，\"我低声问，\"里头有人？\" \"里头不光有人。\"把头说。 \"里头有人，点了灯。\" \"而且这灯——\"他站起身，拍拍裤子上的泥，眼睛望着缝口那片黑暗，\"从两千年前，一直点到了今天。\""}, {"id": "A5-068", "arc": "A5", "num": 68, "title": "锅", "md": "进缝之前，把头立了三条规矩。\n\n\"第一，都把嘴闭上，用眼神和手势。第二，手电一律压到最低，别直射。第三——\"他看了一眼王药根那只缠着布的手，\"老丈，你的黑鸡带一只进去。活鸡在，咱们心里有底。\"\n\n王药根把剩下那只老避龙从笼里请出来，塞进胸前的布兜，只露个脑袋。黑鸡在兜里睁着眼，一声不吭。\n\n我们鱼贯进缝。\n\n缝比看上去长，手脚并用走了约莫三十步，两壁忽然散开，一个向上的缓坡，再十来步，头顶一空——\n\n到了。\n\n我把手电拧开一丝，光晕贴着地皮铺出去。\n\n这是一间人工开凿的石室，比昨天藏铁器的仓库还大一圈。四壁凿得平整，顶是拱的，拱顶正中垂下一根石钟乳，水珠顺着它一滴一滴地落在地面一个浅浅的石窝里，滴答，滴答——那滴水声，就是我们在缝口听见的声音。\n\n石室正中，摆着五口锅。\n\n五口陶锅，倒扣着，锅足朝天，沿地一圈摆开。方位我一眼就认出来了——不熟行的人看着是随便一圈，其实按的是正经方位：正北、正南、正东、正西，第五口，在正中。\n\n每一口锅，都比家里的大铁锅小些，灰陶，素面，锅身上结着一层黑灰，黑得发亮，像上了一层釉。\n\n把头没有立刻靠近。他站在缝口，看了足足一分钟，才抬手示意：跟我来，踩我的脚印。\n\n我们贴着墙根走，一步不落。\n\n到了锅圈外一尺，把头蹲下，手电压得极低，光晕只照住正北那一口。\n\n锅足朝天。锅底的烟灰积得极厚。\n\n\"都看清楚了？\"他用气声说，\"这五口锅，摆的是**位子**。\"\n\n鱼哥蹲在我旁边，呼吸放得很轻：\"位子？\"\n\n\"北、南、东、西，四口，加当中一口。\"把头的手电缓缓转了一圈，\"我考考你，云峰。高句丽五部，哪一部在上座？\"\n\n\"桂娄部。\"我脱口而出，\"桂娄部世代为王。\"\n\n\"王在哪儿？\"\n\n我看着那五口锅。\n\n正当中那一口——王的位置。\n\n可把头的手电，在正中那口锅上只停了一停，就移开了。\n\n\"都错了。\"他说。\n\n\"啊？\"\n\n\"你数数。\"把头的手电在四壁慢慢转，\"这间屋子，四个方向，四个角。锅里头摆北南东西加正中——**缺的是什么？**\"\n\n我在心里把石室转了一圈，猛地反应过来。\n\n四个角。\n\n四隅。\n\n\"缺的是四隅。\"我说，\"辰巳、戌亥……东南、西南、东北、西北，这四个角上，没有锅。\"\n\n\"高句丽的五部，不是这么坐的。\"把头的声音压得更低，\"高句丽人分部，不按汉人的四方中方坐。他们是按**纥升骨城的山口**坐的——五个部，各守一条进山的谷道。\"\n\n他把光移向石室的四壁。\n\n我这才注意到，四壁上各凿着一道浅槽，浅槽从地面起，斜着向上，通向拱顶，像四条干涸的河道。而石室朝沟的那面墙——就是我们进来的这面——比其他三面厚出一倍。\n\n\"这屋子不是墓。\"把头站起身，\"也不是仓。这是**坛**。\"\n\n\"坛？\"\n\n\"祭坛，也是盟坛。\"把头绕着锅圈外走了半圈，光圈扫过每一口锅的足底，\"五口锅倒扣，锅底朝天——云峰，倒扣的锅是什么？\"\n\n我想了想：\"……盖印？\"\n\n\"是**歇伙**。\"把头说，\"江湖上，伙里散伙，把锅倒扣；伙里立誓，把锅埋土。这五口锅倒扣在这儿，是五部当年在这里**起了誓又散了伙**。\"\n\n鱼哥忽然伸手按住胸口的布兜。那只老避龙在兜里扑腾了两下。\n\n我们仨一齐看过去。\n\n黑鸡从布兜里探出脑袋，脖子上的毛炸着，两只芝麻眼直勾勾地盯着——\n\n西南角。\n\n四隅里，西南方向的那面墙根。\n\n把头的手电慢慢移过去。\n\n光晕里，西南墙根的地面上，干干净净。\n\n什么都没有。\n\n可那圈摆锅的方位线上，我数了三遍——\n\n北、南、东、西、中，五口锅。\n\n加上西南这个\"空位\"。\n\n是六。", "words": 1344, "html": "<p>进缝之前，把头立了三条规矩。<\/p>\n<p>\"第一，都把嘴闭上，用眼神和手势。第二，手电一律压到最低，别直射。第三——\"他看了一眼王药根那只缠着布的手，\"老丈，你的黑鸡带一只进去。活鸡在，咱们心里有底。\"<\/p>\n<p>王药根把剩下那只老避龙从笼里请出来，塞进胸前的布兜，只露个脑袋。黑鸡在兜里睁着眼，一声不吭。<\/p>\n<p>我们鱼贯进缝。<\/p>\n<p>缝比看上去长，手脚并用走了约莫三十步，两壁忽然散开，一个向上的缓坡，再十来步，头顶一空——<\/p>\n<p>到了。<\/p>\n<p>我把手电拧开一丝，光晕贴着地皮铺出去。<\/p>\n<p>这是一间人工开凿的石室，比昨天藏铁器的仓库还大一圈。四壁凿得平整，顶是拱的，拱顶正中垂下一根石钟乳，水珠顺着它一滴一滴地落在地面一个浅浅的石窝里，滴答，滴答——那滴水声，就是我们在缝口听见的声音。<\/p>\n<p>石室正中，摆着五口锅。<\/p>\n<p>五口陶锅，倒扣着，锅足朝天，沿地一圈摆开。方位我一眼就认出来了——不熟行的人看着是随便一圈，其实按的是正经方位：正北、正南、正东、正西，第五口，在正中。<\/p>\n<p>每一口锅，都比家里的大铁锅小些，灰陶，素面，锅身上结着一层黑灰，黑得发亮，像上了一层釉。<\/p>\n<p>把头没有立刻靠近。他站在缝口，看了足足一分钟，才抬手示意：跟我来，踩我的脚印。<\/p>\n<p>我们贴着墙根走，一步不落。<\/p>\n<p>到了锅圈外一尺，把头蹲下，手电压得极低，光晕只照住正北那一口。<\/p>\n<p>锅足朝天。锅底的烟灰积得极厚。<\/p>\n<p>\"都看清楚了？\"他用气声说，\"这五口锅，摆的是<strong>位子<\/strong>。\"<\/p>\n<p>鱼哥蹲在我旁边，呼吸放得很轻：\"位子？\"<\/p>\n<p>\"北、南、东、西，四口，加当中一口。\"把头的手电缓缓转了一圈，\"我考考你，云峰。高句丽五部，哪一部在上座？\"<\/p>\n<p>\"桂娄部。\"我脱口而出，\"桂娄部世代为王。\"<\/p>\n<p>\"王在哪儿？\"<\/p>\n<p>我看着那五口锅。<\/p>\n<p>正当中那一口——王的位置。<\/p>\n<p>可把头的手电，在正中那口锅上只停了一停，就移开了。<\/p>\n<p>\"都错了。\"他说。<\/p>\n<p>\"啊？\"<\/p>\n<p>\"你数数。\"把头的手电在四壁慢慢转，\"这间屋子，四个方向，四个角。锅里头摆北南东西加正中——<strong>缺的是什么？<\/strong>\"<\/p>\n<p>我在心里把石室转了一圈，猛地反应过来。<\/p>\n<p>四个角。<\/p>\n<p>四隅。<\/p>\n<p>\"缺的是四隅。\"我说，\"辰巳、戌亥……东南、西南、东北、西北，这四个角上，没有锅。\"<\/p>\n<p>\"高句丽的五部，不是这么坐的。\"把头的声音压得更低，\"高句丽人分部，不按汉人的四方中方坐。他们是按<strong>纥升骨城的山口<\/strong>坐的——五个部，各守一条进山的谷道。\"<\/p>\n<p>他把光移向石室的四壁。<\/p>\n<p>我这才注意到，四壁上各凿着一道浅槽，浅槽从地面起，斜着向上，通向拱顶，像四条干涸的河道。而石室朝沟的那面墙——就是我们进来的这面——比其他三面厚出一倍。<\/p>\n<p>\"这屋子不是墓。\"把头站起身，\"也不是仓。这是<strong>坛<\/strong>。\"<\/p>\n<p>\"坛？\"<\/p>\n<p>\"祭坛，也是盟坛。\"把头绕着锅圈外走了半圈，光圈扫过每一口锅的足底，\"五口锅倒扣，锅底朝天——云峰，倒扣的锅是什么？\"<\/p>\n<p>我想了想：\"……盖印？\"<\/p>\n<p>\"是<strong>歇伙<\/strong>。\"把头说，\"江湖上，伙里散伙，把锅倒扣；伙里立誓，把锅埋土。这五口锅倒扣在这儿，是五部当年在这里<strong>起了誓又散了伙<\/strong>。\"<\/p>\n<p>鱼哥忽然伸手按住胸口的布兜。那只老避龙在兜里扑腾了两下。<\/p>\n<p>我们仨一齐看过去。<\/p>\n<p>黑鸡从布兜里探出脑袋，脖子上的毛炸着，两只芝麻眼直勾勾地盯着——<\/p>\n<p>西南角。<\/p>\n<p>四隅里，西南方向的那面墙根。<\/p>\n<p>把头的手电慢慢移过去。<\/p>\n<p>光晕里，西南墙根的地面上，干干净净。<\/p>\n<p>什么都没有。<\/p>\n<p>可那圈摆锅的方位线上，我数了三遍——<\/p>\n<p>北、南、东、西、中，五口锅。<\/p>\n<p>加上西南这个\"空位\"。<\/p>\n<p>是六。<\/p>", "plain": "进缝之前，把头立了三条规矩。 \"第一，都把嘴闭上，用眼神和手势。第二，手电一律压到最低，别直射。第三——\"他看了一眼王药根那只缠着布的手，\"老丈，你的黑鸡带一只进去。活鸡在，咱们心里有底。\" 王药根把剩下那只老避龙从笼里请出来，塞进胸前的布兜，只露个脑袋。黑鸡在兜里睁着眼，一声不吭。 我们鱼贯进缝。 缝比看上去长，手脚并用走了约莫三十步，两壁忽然散开，一个向上的缓坡，再十来步，头顶一空—— 到了。 我把手电拧开一丝，光晕贴着地皮铺出去。 这是一间人工开凿的石室，比昨天藏铁器的仓库还大一圈。四壁凿得平整，顶是拱的，拱顶正中垂下一根石钟乳，水珠顺着它一滴一滴地落在地面一个浅浅的石窝里，滴答，滴答——那滴水声，就是我们在缝口听见的声音。 石室正中，摆着五口锅。 五口陶锅，倒扣着，锅足朝天，沿地一圈摆开。方位我一眼就认出来了——不熟行的人看着是随便一圈，其实按的是正经方位：正北、正南、正东、正西，第五口，在正中。 每一口锅，都比家里的大铁锅小些，灰陶，素面，锅身上结着一层黑灰，黑得发亮，像上了一层釉。 把头没有立刻靠近。他站在缝口，看了足足一分钟，才抬手示意：跟我来，踩我的脚印。 我们贴着墙根走，一步不落。 到了锅圈外一尺，把头蹲下，手电压得极低，光晕只照住正北那一口。 锅足朝天。锅底的烟灰积得极厚。 \"都看清楚了？\"他用气声说，\"这五口锅，摆的是位子。\" 鱼哥蹲在我旁边，呼吸放得很轻：\"位子？\" \"北、南、东、西，四口，加当中一口。\"把头的手电缓缓转了一圈，\"我考考你，云峰。高句丽五部，哪一部在上座？\" \"桂娄部。\"我脱口而出，\"桂娄部世代为王。\" \"王在哪儿？\" 我看着那五口锅。 正当中那一口——王的位置。 可把头的手电，在正中那口锅上只停了一停，就移开了。 \"都错了。\"他说。 \"啊？\" \"你数数。\"把头的手电在四壁慢慢转，\"这间屋子，四个方向，四个角。锅里头摆北南东西加正中——缺的是什么？\" 我在心里把石室转了一圈，猛地反应过来。 四个角。 四隅。 \"缺的是四隅。\"我说，\"辰巳、戌亥……东南、西南、东北、西北，这四个角上，没有锅。\" \"高句丽的五部，不是这么坐的。\"把头的声音压得更低，\"高句丽人分部，不按汉人的四方中方坐。他们是按纥升骨城的山口坐的——五个部，各守一条进山的谷道。\" 他把光移向石室的四壁。 我这才注意到，四壁上各凿着一道浅槽，浅槽从地面起，斜着向上，通向拱顶，像四条干涸的河道。而石室朝沟的那面墙——就是我们进来的这面——比其他三面厚出一倍。 \"这屋子不是墓。\"把头站起身，\"也不是仓。这是坛。\" \"坛？\" \"祭坛，也是盟坛。\"把头绕着锅圈外走了半圈，光圈扫过每一口锅的足底，\"五口锅倒扣，锅底朝天——云峰，倒扣的锅是什么？\" 我想了想：\"……盖印？\" \"是歇伙。\"把头说，\"江湖上，伙里散伙，把锅倒扣；伙里立誓，把锅埋土。这五口锅倒扣在这儿，是五部当年在这里起了誓又散了伙。\" 鱼哥忽然伸手按住胸口的布兜。那只老避龙在兜里扑腾了两下。 我们仨一齐看过去。 黑鸡从布兜里探出脑袋，脖子上的毛炸着，两只芝麻眼直勾勾地盯着—— 西南角。 四隅里，西南方向的那面墙根。 把头的手电慢慢移过去。 光晕里，西南墙根的地面上，干干净净。 什么都没有。 可那圈摆锅的方位线上，我数了三遍—— 北、南、东、西、中，五口锅。 加上西南这个\"空位\"。 是六。"}, {"id": "A5-069", "arc": "A5", "num": 69, "title": "空锅", "md": "\"六？\"鱼哥的气声里透着不敢信。\n\n\"五部，五口锅。\"我说，\"可方位线上留了六的数。\"\n\n把头蹲在西南墙根，手电贴着地皮，看了很久。\n\n\"云峰，你过来。\"他说，\"看这个角的地。\"\n\n我蹲过去。西南墙根的地面上，石板和其他地方一样平，一样干。可细看，石板的色气不一样——这一块地方的石板颜色深，深得发乌，接缝里的石茬是新的，茬面上还挂着石末。\n\n\"起过东西。\"我说，\"这里原本摆着第六样，被人起走了。\"\n\n\"多久？\"\n\n我拿指腹蹭了蹭石茬。石末还松，没长新苔。\n\n\"两三年。\"我说，\"跟老周收珍珠罐那批货出土的日子，对得上。\"\n\n鱼哥和把头对了个眼神。\n\n把头站起身，走到正中那口锅前，蹲下，双手按住锅的两耳。\n\n\"都退后，捂住口鼻。\"\n\n我们退开。他把头猛地一掀——\n\n\"轰\"的一声闷响，一股两千年没见过天日的灰气从锅底腾起来。锅掀翻在地，锅底朝天翻过来，露出底下的地面。\n\n地面正中，浅浅一个圆坑。\n\n坑里没有随葬，没有骨头，只有一片烧过的黑灰。\n\n灰上，压着一样东西。\n\n一锭银。\n\n不对——走近了看，是一块银牌。巴掌长，一指宽，边角齐整，银色黑里透白。我一眼就认出了它的制式——和我们手里那四块，一模一样。\n\n\"太官署食契。\"鱼哥低声说。\n\n把头拿起来，翻过正面。\n\n正面是空的。\n\n四块银符，分别铸着\"肉\"\"米\"\"酱\"\"酒\"四个字。这一块，铸纹的位置上，什么都没有。\n\n不是字磨没了。铸的时候，就没有字。\n\n一整块素面无字的银符。\n\n石室里静得只剩拱顶的水滴声。滴答。滴答。\n\n把头托着那块无字银符，翻来覆去看了三遍，忽然问：\"云峰，太官署是什么衙门？\"\n\n\"少府属官。\"我说，\"皇家的灶。天子的饭，从太官署出。\"\n\n\"食契呢？\"\n\n\"吃饭的凭据。\"我说，\"后宫里按位分领膳，凭契领食。什么位分，领什么食，肉、米、酱、酒，各是一路。\"\n\n\"那这一块没字的，\"把头把银符举到我眼前，\"领的是什么饭？\"\n\n我盯着那片空白的银面，脑子里把两天来所有的线头一根根捋过去。\n\n被杀绝的消奴部。\n\n壁画上被涂改的四个小人，和那口特意留白的空锅。\n\n长顺画的空锅，锅里什么都没有。\n\n\"领不着饭的。\"我听见自己说，\"把头——这一块，是给消奴部的。\"\n\n\"说下去。\"\n\n\"五部盟誓，共立此坛，太官署铸契为凭。肉米酱酒，四部各领一块。\"我指着自己的心口，\"可后来消奴部被杀绝了。绝人之国，夺人之名——他们连'消奴'两个字都不许再存在。\"\n\n\"所以这一块上的字，被人为地取消了？\"\n\n\"不是取消。\"我说，\"是**留空**。\"\n\n\"留空？\"\n\n\"字铸不上去，因为名号被抹了。可盟约是五家的盟约，太官署的契是五家的契——**契不能少，字不能有**。\"我说，\"于是铸了一块空契。名分没了，饭还得给他留着。这是当年铸契的人，唯一敢做的事。\"\n\n把头托着那块银符，站了很久。\n\n拱顶的水珠又落下来一滴。\n\n\"云峰。\"他忽然说，\"你知道这块东西，在道上叫什么吗？\"\n\n\"请把头赐教。\"\n\n\"这叫**阴契**。\"把头把银符轻轻放进我手心，合上我的手指，\"阴契在谁手里，谁就是那一房的人。\"\n\n我的手一沉。\n\n\"把头，这——\"\n\n\"四块有字的，是死人的饭，收到咱们手里，那是财。\"把头看着我，一字一顿，\"这一块没字的，是活人的**名分**。云峰，你从它落在你手心里那一刻起，在这条线上，你就是消奴部的人了。\"\n\n\"这江湖上有多少双眼睛盯着这块东西——我要的不是你拿着它，是**认下它**。\"\n\n我攥着那块冰凉的银符，掌心出汗了。\n\n\"我认。\"我说。\n\n把头看了我很久，忽然笑了，皱纹全堆到眼角。\n\n\"好。\"他说，\"当年那白毛老头给我镜子的时候，也是这么说的。\"\n\n他弯腰，把掀翻的那口锅重新扣回原位，锅足朝天，一丝不差。\n\n\"这一锅，是消奴部的锅。\"他直起腰，\"锅在坛在。\"\n\n正说着，鱼哥胸口的布兜里，那只老避龙忽然剧烈地扑腾起来，扑得鱼哥整条胳膊都在抖。\n\n鱼哥把它掏出来。\n\n黑鸡在他掌心炸着毛，头扭向石室的北墙，喉咙里滚着咕声。\n\n北墙——正北那口锅的方位——墙根的阴影里。\n\n不知什么时候，多了一样东西。\n\n一只白纸灯笼。\n\n灯上画着一圈黑字。", "words": 1567, "html": "<p>\"六？\"鱼哥的气声里透着不敢信。<\/p>\n<p>\"五部，五口锅。\"我说，\"可方位线上留了六的数。\"<\/p>\n<p>把头蹲在西南墙根，手电贴着地皮，看了很久。<\/p>\n<p>\"云峰，你过来。\"他说，\"看这个角的地。\"<\/p>\n<p>我蹲过去。西南墙根的地面上，石板和其他地方一样平，一样干。可细看，石板的色气不一样——这一块地方的石板颜色深，深得发乌，接缝里的石茬是新的，茬面上还挂着石末。<\/p>\n<p>\"起过东西。\"我说，\"这里原本摆着第六样，被人起走了。\"<\/p>\n<p>\"多久？\"<\/p>\n<p>我拿指腹蹭了蹭石茬。石末还松，没长新苔。<\/p>\n<p>\"两三年。\"我说，\"跟老周收珍珠罐那批货出土的日子，对得上。\"<\/p>\n<p>鱼哥和把头对了个眼神。<\/p>\n<p>把头站起身，走到正中那口锅前，蹲下，双手按住锅的两耳。<\/p>\n<p>\"都退后，捂住口鼻。\"<\/p>\n<p>我们退开。他把头猛地一掀——<\/p>\n<p>\"轰\"的一声闷响，一股两千年没见过天日的灰气从锅底腾起来。锅掀翻在地，锅底朝天翻过来，露出底下的地面。<\/p>\n<p>地面正中，浅浅一个圆坑。<\/p>\n<p>坑里没有随葬，没有骨头，只有一片烧过的黑灰。<\/p>\n<p>灰上，压着一样东西。<\/p>\n<p>一锭银。<\/p>\n<p>不对——走近了看，是一块银牌。巴掌长，一指宽，边角齐整，银色黑里透白。我一眼就认出了它的制式——和我们手里那四块，一模一样。<\/p>\n<p>\"太官署食契。\"鱼哥低声说。<\/p>\n<p>把头拿起来，翻过正面。<\/p>\n<p>正面是空的。<\/p>\n<p>四块银符，分别铸着\"肉\"\"米\"\"酱\"\"酒\"四个字。这一块，铸纹的位置上，什么都没有。<\/p>\n<p>不是字磨没了。铸的时候，就没有字。<\/p>\n<p>一整块素面无字的银符。<\/p>\n<p>石室里静得只剩拱顶的水滴声。滴答。滴答。<\/p>\n<p>把头托着那块无字银符，翻来覆去看了三遍，忽然问：\"云峰，太官署是什么衙门？\"<\/p>\n<p>\"少府属官。\"我说，\"皇家的灶。天子的饭，从太官署出。\"<\/p>\n<p>\"食契呢？\"<\/p>\n<p>\"吃饭的凭据。\"我说，\"后宫里按位分领膳，凭契领食。什么位分，领什么食，肉、米、酱、酒，各是一路。\"<\/p>\n<p>\"那这一块没字的，\"把头把银符举到我眼前，\"领的是什么饭？\"<\/p>\n<p>我盯着那片空白的银面，脑子里把两天来所有的线头一根根捋过去。<\/p>\n<p>被杀绝的消奴部。<\/p>\n<p>壁画上被涂改的四个小人，和那口特意留白的空锅。<\/p>\n<p>长顺画的空锅，锅里什么都没有。<\/p>\n<p>\"领不着饭的。\"我听见自己说，\"把头——这一块，是给消奴部的。\"<\/p>\n<p>\"说下去。\"<\/p>\n<p>\"五部盟誓，共立此坛，太官署铸契为凭。肉米酱酒，四部各领一块。\"我指着自己的心口，\"可后来消奴部被杀绝了。绝人之国，夺人之名——他们连'消奴'两个字都不许再存在。\"<\/p>\n<p>\"所以这一块上的字，被人为地取消了？\"<\/p>\n<p>\"不是取消。\"我说，\"是<strong>留空<\/strong>。\"<\/p>\n<p>\"留空？\"<\/p>\n<p>\"字铸不上去，因为名号被抹了。可盟约是五家的盟约，太官署的契是五家的契——<strong>契不能少，字不能有<\/strong>。\"我说，\"于是铸了一块空契。名分没了，饭还得给他留着。这是当年铸契的人，唯一敢做的事。\"<\/p>\n<p>把头托着那块银符，站了很久。<\/p>\n<p>拱顶的水珠又落下来一滴。<\/p>\n<p>\"云峰。\"他忽然说，\"你知道这块东西，在道上叫什么吗？\"<\/p>\n<p>\"请把头赐教。\"<\/p>\n<p>\"这叫<strong>阴契<\/strong>。\"把头把银符轻轻放进我手心，合上我的手指，\"阴契在谁手里，谁就是那一房的人。\"<\/p>\n<p>我的手一沉。<\/p>\n<p>\"把头，这——\"<\/p>\n<p>\"四块有字的，是死人的饭，收到咱们手里，那是财。\"把头看着我，一字一顿，\"这一块没字的，是活人的<strong>名分<\/strong>。云峰，你从它落在你手心里那一刻起，在这条线上，你就是消奴部的人了。\"<\/p>\n<p>\"这江湖上有多少双眼睛盯着这块东西——我要的不是你拿着它，是<strong>认下它<\/strong>。\"<\/p>\n<p>我攥着那块冰凉的银符，掌心出汗了。<\/p>\n<p>\"我认。\"我说。<\/p>\n<p>把头看了我很久，忽然笑了，皱纹全堆到眼角。<\/p>\n<p>\"好。\"他说，\"当年那白毛老头给我镜子的时候，也是这么说的。\"<\/p>\n<p>他弯腰，把掀翻的那口锅重新扣回原位，锅足朝天，一丝不差。<\/p>\n<p>\"这一锅，是消奴部的锅。\"他直起腰，\"锅在坛在。\"<\/p>\n<p>正说着，鱼哥胸口的布兜里，那只老避龙忽然剧烈地扑腾起来，扑得鱼哥整条胳膊都在抖。<\/p>\n<p>鱼哥把它掏出来。<\/p>\n<p>黑鸡在他掌心炸着毛，头扭向石室的北墙，喉咙里滚着咕声。<\/p>\n<p>北墙——正北那口锅的方位——墙根的阴影里。<\/p>\n<p>不知什么时候，多了一样东西。<\/p>\n<p>一只白纸灯笼。<\/p>\n<p>灯上画着一圈黑字。<\/p>", "plain": "\"六？\"鱼哥的气声里透着不敢信。 \"五部，五口锅。\"我说，\"可方位线上留了六的数。\" 把头蹲在西南墙根，手电贴着地皮，看了很久。 \"云峰，你过来。\"他说，\"看这个角的地。\" 我蹲过去。西南墙根的地面上，石板和其他地方一样平，一样干。可细看，石板的色气不一样——这一块地方的石板颜色深，深得发乌，接缝里的石茬是新的，茬面上还挂着石末。 \"起过东西。\"我说，\"这里原本摆着第六样，被人起走了。\" \"多久？\" 我拿指腹蹭了蹭石茬。石末还松，没长新苔。 \"两三年。\"我说，\"跟老周收珍珠罐那批货出土的日子，对得上。\" 鱼哥和把头对了个眼神。 把头站起身，走到正中那口锅前，蹲下，双手按住锅的两耳。 \"都退后，捂住口鼻。\" 我们退开。他把头猛地一掀—— \"轰\"的一声闷响，一股两千年没见过天日的灰气从锅底腾起来。锅掀翻在地，锅底朝天翻过来，露出底下的地面。 地面正中，浅浅一个圆坑。 坑里没有随葬，没有骨头，只有一片烧过的黑灰。 灰上，压着一样东西。 一锭银。 不对——走近了看，是一块银牌。巴掌长，一指宽，边角齐整，银色黑里透白。我一眼就认出了它的制式——和我们手里那四块，一模一样。 \"太官署食契。\"鱼哥低声说。 把头拿起来，翻过正面。 正面是空的。 四块银符，分别铸着\"肉\"\"米\"\"酱\"\"酒\"四个字。这一块，铸纹的位置上，什么都没有。 不是字磨没了。铸的时候，就没有字。 一整块素面无字的银符。 石室里静得只剩拱顶的水滴声。滴答。滴答。 把头托着那块无字银符，翻来覆去看了三遍，忽然问：\"云峰，太官署是什么衙门？\" \"少府属官。\"我说，\"皇家的灶。天子的饭，从太官署出。\" \"食契呢？\" \"吃饭的凭据。\"我说，\"后宫里按位分领膳，凭契领食。什么位分，领什么食，肉、米、酱、酒，各是一路。\" \"那这一块没字的，\"把头把银符举到我眼前，\"领的是什么饭？\" 我盯着那片空白的银面，脑子里把两天来所有的线头一根根捋过去。 被杀绝的消奴部。 壁画上被涂改的四个小人，和那口特意留白的空锅。 长顺画的空锅，锅里什么都没有。 \"领不着饭的。\"我听见自己说，\"把头——这一块，是给消奴部的。\" \"说下去。\" \"五部盟誓，共立此坛，太官署铸契为凭。肉米酱酒，四部各领一块。\"我指着自己的心口，\"可后来消奴部被杀绝了。绝人之国，夺人之名——他们连'消奴'两个字都不许再存在。\" \"所以这一块上的字，被人为地取消了？\" \"不是取消。\"我说，\"是留空。\" \"留空？\" \"字铸不上去，因为名号被抹了。可盟约是五家的盟约，太官署的契是五家的契——契不能少，字不能有。\"我说，\"于是铸了一块空契。名分没了，饭还得给他留着。这是当年铸契的人，唯一敢做的事。\" 把头托着那块银符，站了很久。 拱顶的水珠又落下来一滴。 \"云峰。\"他忽然说，\"你知道这块东西，在道上叫什么吗？\" \"请把头赐教。\" \"这叫阴契。\"把头把银符轻轻放进我手心，合上我的手指，\"阴契在谁手里，谁就是那一房的人。\" 我的手一沉。 \"把头，这——\" \"四块有字的，是死人的饭，收到咱们手里，那是财。\"把头看着我，一字一顿，\"这一块没字的，是活人的名分。云峰，你从它落在你手心里那一刻起，在这条线上，你就是消奴部的人了。\" \"这江湖上有多少双眼睛盯着这块东西——我要的不是你拿着它，是认下它。\" 我攥着那块冰凉的银符，掌心出汗了。 \"我认。\"我说。 把头看了我很久，忽然笑了，皱纹全堆到眼角。 \"好。\"他说，\"当年那白毛老头给我镜子的时候，也是这么说的。\" 他弯腰，把掀翻的那口锅重新扣回原位，锅足朝天，一丝不差。 \"这一锅，是消奴部的锅。\"他直起腰，\"锅在坛在。\" 正说着，鱼哥胸口的布兜里，那只老避龙忽然剧烈地扑腾起来，扑得鱼哥整条胳膊都在抖。 鱼哥把它掏出来。 黑鸡在他掌心炸着毛，头扭向石室的北墙，喉咙里滚着咕声。 北墙——正北那口锅的方位——墙根的阴影里。 不知什么时候，多了一样东西。 一只白纸灯笼。 灯上画着一圈黑字。"}, {"id": "A5-070", "arc": "A5", "num": 70, "title": "有人来过", "md": "谁都没动。\n\n那只白纸灯笼就挂在北墙根，用一根细麻绳吊在墙上凿出的浅槽里，离地半尺，微微地晃。\n\n灯笼不大，白纸的罩子，竹篾的骨。罩子上用墨画着一圈字，一圈连着一圈，首尾相接，转着灯看，那字像是在纸上走。\n\n鱼哥盯着那圈字，脸色一点点变了。\n\n\"云峰，\"他的气声发紧，\"这灯笼……我在哪儿见过。\"\n\n\"沈清荷的梦里。\"\n\n\"不止。\"鱼哥说，\"十年前，少林寺后山的塔林。我师傅圆寂那天夜里，塔林里也挑着一只这样的灯笼。白纸，墨圈字。当时老人们都说是塔林的老和尚挑的，可塔林里只有塔。\"\n\n\"墨圈字认得吗？\"\n\n\"认得一半。\"鱼哥眯着眼，\"转圈写的，得连起来念。是——'**一灯既起，五部来归；六位既满，骨城自开**'。\"\n\n骨城。\n\n纥升骨城。\n\n我攥着兜里那块无字阴契，手心一下子全湿了。\n\n\"这是**请**。\"把头的气声很低，\"挂灯，是江湖上请人的规矩。这灯挂在这儿——\"\n\n\"请谁？\"\n\n把头没答。他抬手，示意我看灯底下。\n\n灯底下，垫着半块青砖。砖面上，端端正正摆着一样东西。\n\n一截烟屁股。\n\n烟丝还潮着，过滤嘴上咬痕新鲜。鱼哥用蛇叉子挑起来，凑到鼻子底下闻了闻，眉毛拧成一团。\n\n\"东北烟，烤的。抽得急，没抽完就掐了。\"他说，\"顶多，是今天的事。\"\n\n今天。\n\n我们进沟这半宿，有人先进了这间石室，在这儿抽了半支烟，挂了灯，走了。\n\n\"还有。\"王药根忽然蹲下去，指着砖旁边墙根的石面。\n\n石面上有字。\n\n粉笔写的，字很粗，笔画乱，像是用半截粉笔头仓促划的。不是汉字——是拼音，夹杂着两个汉字，歪歪扭扭一行：\n\n**\"lao san si zai zhe li  05.7.11  老五别找我\"**\n\n我的呼吸停了一拍。\n\n05.7.11。\n\n2005年7月11日。\n\n王长顺画的那张纸背面，铅笔字：**七月十一。**\n\n\"老三……死在这里。\"鱼哥一字一字念出声，\"老五，别找我。\"\n\n王药根整个人扑到墙根前，手电的光在他手里乱颤。他看着那行字，看了很久很久，忽然伸手去摸那个\"三\"字，摸了一遍又一遍。\n\n\"五年了……\"老头的声音哑得不成样子，\"我找了他五年……我儿子到死都说'锅是空的'，原来是替这个'老三'捎的话……\"\n\n\"大爷。\"我把手按在他肩膀上。\n\n\"这字不对。\"他把头忽然蹲下来。\n\n\"哪儿不对？\"\n\n\"落款。\"把头指着自己看到的疑点，\"2005年7月11日，你儿子还没进沟。进沟是两年前——2005年的夏天，那五个人刚走。这行字是**他们五个人里的人**写的，写的时候，'老三'刚死。\"\n\n他抬起头，看着我们。\n\n\"可是云峰，你想——断崖底下那三具尸骨，是**没有头**的。'老三死在这里'——死在这里的人，头呢？\"\n\n石室里的水滴声，一滴，一滴。\n\n\"还有更邪的。\"鱼哥站起身，走到石室的另一头，手电压得极低。\n\n\"你们来看这个。\"\n\n西北角，墙根。\n\n石壁上，打着两个钢钎眼。\n\n眼是新打的，眼壁的石茬雪白，石粉还没被潮气浸透，我们进来到现在，最多三个时辰——这钎眼，就是这两天里打的。\n\n钎眼里楔着一根钢钎，钎头上，系着半截红布条。\n\n布条鲜红，新崭崭的，边角剪得齐齐整整，上头用红丝线锁着一圈小字。\n\n我凑近了一看，头皮\"轰\"地炸开。\n\n红丝线锁的字，和加油站那两条飘带上的绣字，是同一种针脚。\n\n老鼠男的针脚。\n\n\"大爷。\"我回头。\n\n王药根还在墙根摸着那行粉笔字，没回头。\n\n\"这布条上的针脚，\"我说，\"跟加油站那个老鼠男的，一模一样。\"\n\n把头沉默了很久。\n\n他走过去，把那根钢钎拔出来看了看，又原样楔回去，红布条理顺，退开一步。\n\n\"云峰，\"他说，\"你还记得老鼠男的话吗。\"\n\n\"'进去的可以，出来的不行。'\"我说。\n\n\"还有后半句呢？\"\n\n我想了想：\"……他说两年前那五个人，四个没出来。\"\n\n\"对。\"把头说，\"五进两出，是王老丈的说法。四个没出来，是他的说法。现在你再把这行字连起来看——\"\n\n他一个字一个字地往下说：\n\n\"'老三死在这里'——老三没出来。\"\n\n\"'老五别找我'——写这行字的人，也不是出来的那个。\"\n\n\"五个外路人。一个死在沟里，写字的这个，也留在了沟里。真正走出去的，从头到尾——**只有酒糟鼻一个。**\"\n\n\"那王药根看见的另一个出来的呢？\"\n\n\"白头发。\"把头说，\"你还没想过一个问题——那个'白头发瘦子'，跟我三十七年前见过的白毛老头，是一个岁数。\"\n\n我浑身的血一下子凉了。\n\n鱼哥胸口的布兜里，老避龙忽然疯了一样扑腾起来。\n\n紧跟着——\n\n\"吱——嘎。\"\n\n锅盖磨石头的声音。\n\n不在石室里。\n\n在缝外。在沟里。在我们头顶的鹰嘴石梁上，一声，又一声，不紧不慢，朝这边来了。\n\n把头一口气吹灭了鱼哥的手电。\n\n黑暗里，他抓住我的手腕，把一样小东西按进我手心——是无字阴契。\n\n\"背熟我这句话。\"他的气声贴着我耳朵，轻得像一缕烟：\n\n\"灯要是问你要锅——\"\n\n\"**你就把阴契亮给它看。**\"", "words": 1837, "html": "<p>谁都没动。<\/p>\n<p>那只白纸灯笼就挂在北墙根，用一根细麻绳吊在墙上凿出的浅槽里，离地半尺，微微地晃。<\/p>\n<p>灯笼不大，白纸的罩子，竹篾的骨。罩子上用墨画着一圈字，一圈连着一圈，首尾相接，转着灯看，那字像是在纸上走。<\/p>\n<p>鱼哥盯着那圈字，脸色一点点变了。<\/p>\n<p>\"云峰，\"他的气声发紧，\"这灯笼……我在哪儿见过。\"<\/p>\n<p>\"沈清荷的梦里。\"<\/p>\n<p>\"不止。\"鱼哥说，\"十年前，少林寺后山的塔林。我师傅圆寂那天夜里，塔林里也挑着一只这样的灯笼。白纸，墨圈字。当时老人们都说是塔林的老和尚挑的，可塔林里只有塔。\"<\/p>\n<p>\"墨圈字认得吗？\"<\/p>\n<p>\"认得一半。\"鱼哥眯着眼，\"转圈写的，得连起来念。是——'<strong>一灯既起，五部来归；六位既满，骨城自开<\/strong>'。\"<\/p>\n<p>骨城。<\/p>\n<p>纥升骨城。<\/p>\n<p>我攥着兜里那块无字阴契，手心一下子全湿了。<\/p>\n<p>\"这是<strong>请<\/strong>。\"把头的气声很低，\"挂灯，是江湖上请人的规矩。这灯挂在这儿——\"<\/p>\n<p>\"请谁？\"<\/p>\n<p>把头没答。他抬手，示意我看灯底下。<\/p>\n<p>灯底下，垫着半块青砖。砖面上，端端正正摆着一样东西。<\/p>\n<p>一截烟屁股。<\/p>\n<p>烟丝还潮着，过滤嘴上咬痕新鲜。鱼哥用蛇叉子挑起来，凑到鼻子底下闻了闻，眉毛拧成一团。<\/p>\n<p>\"东北烟，烤的。抽得急，没抽完就掐了。\"他说，\"顶多，是今天的事。\"<\/p>\n<p>今天。<\/p>\n<p>我们进沟这半宿，有人先进了这间石室，在这儿抽了半支烟，挂了灯，走了。<\/p>\n<p>\"还有。\"王药根忽然蹲下去，指着砖旁边墙根的石面。<\/p>\n<p>石面上有字。<\/p>\n<p>粉笔写的，字很粗，笔画乱，像是用半截粉笔头仓促划的。不是汉字——是拼音，夹杂着两个汉字，歪歪扭扭一行：<\/p>\n<p><strong>\"lao san si zai zhe li  05.7.11  老五别找我\"<\/strong><\/p>\n<p>我的呼吸停了一拍。<\/p>\n<p>05.7.11。<\/p>\n<p>2005年7月11日。<\/p>\n<p>王长顺画的那张纸背面，铅笔字：<strong>七月十一。<\/strong><\/p>\n<p>\"老三……死在这里。\"鱼哥一字一字念出声，\"老五，别找我。\"<\/p>\n<p>王药根整个人扑到墙根前，手电的光在他手里乱颤。他看着那行字，看了很久很久，忽然伸手去摸那个\"三\"字，摸了一遍又一遍。<\/p>\n<p>\"五年了……\"老头的声音哑得不成样子，\"我找了他五年……我儿子到死都说'锅是空的'，原来是替这个'老三'捎的话……\"<\/p>\n<p>\"大爷。\"我把手按在他肩膀上。<\/p>\n<p>\"这字不对。\"他把头忽然蹲下来。<\/p>\n<p>\"哪儿不对？\"<\/p>\n<p>\"落款。\"把头指着自己看到的疑点，\"2005年7月11日，你儿子还没进沟。进沟是两年前——2005年的夏天，那五个人刚走。这行字是<strong>他们五个人里的人<\/strong>写的，写的时候，'老三'刚死。\"<\/p>\n<p>他抬起头，看着我们。<\/p>\n<p>\"可是云峰，你想——断崖底下那三具尸骨，是<strong>没有头<\/strong>的。'老三死在这里'——死在这里的人，头呢？\"<\/p>\n<p>石室里的水滴声，一滴，一滴。<\/p>\n<p>\"还有更邪的。\"鱼哥站起身，走到石室的另一头，手电压得极低。<\/p>\n<p>\"你们来看这个。\"<\/p>\n<p>西北角，墙根。<\/p>\n<p>石壁上，打着两个钢钎眼。<\/p>\n<p>眼是新打的，眼壁的石茬雪白，石粉还没被潮气浸透，我们进来到现在，最多三个时辰——这钎眼，就是这两天里打的。<\/p>\n<p>钎眼里楔着一根钢钎，钎头上，系着半截红布条。<\/p>\n<p>布条鲜红，新崭崭的，边角剪得齐齐整整，上头用红丝线锁着一圈小字。<\/p>\n<p>我凑近了一看，头皮\"轰\"地炸开。<\/p>\n<p>红丝线锁的字，和加油站那两条飘带上的绣字，是同一种针脚。<\/p>\n<p>老鼠男的针脚。<\/p>\n<p>\"大爷。\"我回头。<\/p>\n<p>王药根还在墙根摸着那行粉笔字，没回头。<\/p>\n<p>\"这布条上的针脚，\"我说，\"跟加油站那个老鼠男的，一模一样。\"<\/p>\n<p>把头沉默了很久。<\/p>\n<p>他走过去，把那根钢钎拔出来看了看，又原样楔回去，红布条理顺，退开一步。<\/p>\n<p>\"云峰，\"他说，\"你还记得老鼠男的话吗。\"<\/p>\n<p>\"'进去的可以，出来的不行。'\"我说。<\/p>\n<p>\"还有后半句呢？\"<\/p>\n<p>我想了想：\"……他说两年前那五个人，四个没出来。\"<\/p>\n<p>\"对。\"把头说，\"五进两出，是王老丈的说法。四个没出来，是他的说法。现在你再把这行字连起来看——\"<\/p>\n<p>他一个字一个字地往下说：<\/p>\n<p>\"'老三死在这里'——老三没出来。\"<\/p>\n<p>\"'老五别找我'——写这行字的人，也不是出来的那个。\"<\/p>\n<p>\"五个外路人。一个死在沟里，写字的这个，也留在了沟里。真正走出去的，从头到尾——<strong>只有酒糟鼻一个。<\/strong>\"<\/p>\n<p>\"那王药根看见的另一个出来的呢？\"<\/p>\n<p>\"白头发。\"把头说，\"你还没想过一个问题——那个'白头发瘦子'，跟我三十七年前见过的白毛老头，是一个岁数。\"<\/p>\n<p>我浑身的血一下子凉了。<\/p>\n<p>鱼哥胸口的布兜里，老避龙忽然疯了一样扑腾起来。<\/p>\n<p>紧跟着——<\/p>\n<p>\"吱——嘎。\"<\/p>\n<p>锅盖磨石头的声音。<\/p>\n<p>不在石室里。<\/p>\n<p>在缝外。在沟里。在我们头顶的鹰嘴石梁上，一声，又一声，不紧不慢，朝这边来了。<\/p>\n<p>把头一口气吹灭了鱼哥的手电。<\/p>\n<p>黑暗里，他抓住我的手腕，把一样小东西按进我手心——是无字阴契。<\/p>\n<p>\"背熟我这句话。\"他的气声贴着我耳朵，轻得像一缕烟：<\/p>\n<p>\"灯要是问你要锅——\"<\/p>\n<p>\"<strong>你就把阴契亮给它看。<\/strong>\"<\/p>", "plain": "谁都没动。 那只白纸灯笼就挂在北墙根，用一根细麻绳吊在墙上凿出的浅槽里，离地半尺，微微地晃。 灯笼不大，白纸的罩子，竹篾的骨。罩子上用墨画着一圈字，一圈连着一圈，首尾相接，转着灯看，那字像是在纸上走。 鱼哥盯着那圈字，脸色一点点变了。 \"云峰，\"他的气声发紧，\"这灯笼……我在哪儿见过。\" \"沈清荷的梦里。\" \"不止。\"鱼哥说，\"十年前，少林寺后山的塔林。我师傅圆寂那天夜里，塔林里也挑着一只这样的灯笼。白纸，墨圈字。当时老人们都说是塔林的老和尚挑的，可塔林里只有塔。\" \"墨圈字认得吗？\" \"认得一半。\"鱼哥眯着眼， const $ = s => document.querySelector(s);
const KEY = 'bpdx_reader_v1';
let chapters = DATA.slice().sort((a,b)=> (a.arc<b.arc?-1:a.arc>b.arc?1:0) || a.num-b.num);
let cur = 0, hits = [];
const DEF = {theme:'light', fs:'18px', lh:'1.9', pw:'760px', ch:null, y:0, fold:false};
let S = Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY)||'{}'));
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function applySettings(){
  document.body.classList.toggle('toc-fold', !!S.fold);
  $('#fold').textContent = S.fold ? '⇥' : '⇤';
  document.documentElement.setAttribute('data-theme', S.theme);
  document.documentElement.style.setProperty('--fs', S.fs);
  document.documentElement.style.setProperty('--lh', S.lh);
  document.documentElement.style.setProperty('--pw', S.pw);
  $('#theme').textContent = S.theme==='dark' ? '☀️' : '🌙';
  $('#fs').value=S.fs; $('#lh').value=S.lh; $('#pw').value=S.pw;
}
$('#theme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';applySettings();save();};
$('#fs').onchange=e=>{S.fs=e.target.value;applySettings();save();};
$('#lh').onchange=e=>{S.lh=e.target.value;applySettings();save();};
$('#pw').onchange=e=>{S.pw=e.target.value;applySettings();save();};
$('#fold').onclick=()=>{S.fold=!S.fold;applySettings();save();};
$('#tocbtn').onclick=()=>document.body.classList.toggle('toc-open');
$('#backdrop').onclick=()=>document.body.classList.remove('toc-open');
function renderToc(){
  $('#toclist').innerHTML = chapters.map((c,i)=>`<a href="#" data-i="${i}"><span style="color:var(--muted);font-size:13px;margin-right:6px">第${c.num}章</span>${c.title}</a>`).join('');
  $('#toclist').querySelectorAll('a').forEach(a=>{a.onclick=e=>{e.preventDefault();go(+a.dataset.i,true);document.body.classList.remove('toc-open');};});
  document.querySelectorAll('#toc a').forEach(a=>a.classList.toggle('on',+a.dataset.i===cur));
}
function render(){
  const c=chapters[cur];
  document.title=`第${c.num}章 ${c.title} · 北派续写`;
  $('#chapter').innerHTML=`<h2>第${c.num}章　${c.title}</h2><div class="meta">${c.id} · 约 ${c.words} 字 · [续写草稿 AI_HYPOTHESIS]</div>`+c.html;
  $('#prev').disabled=cur<=0; $('#next').disabled=cur>=chapters.length-1;
  renderToc();
  if(hits.length) highlight($('#q').value);
}
function go(i,top){cur=Math.max(0,Math.min(chapters.length-1,i));S.ch=chapters[cur].id;S.y=0;save();render();window.scrollTo(0,0);updateProg();}
$('#prev').onclick=()=>go(cur-1,true);
$('#next').onclick=()=>go(cur+1,true);
$('#fold').onclick=()=>{S.fold=!S.fold;applySettings();save();};
function updateProg(){const h=document.documentElement.scrollHeight-window.innerHeight;$('#prog').style.width=(h>0?(window.scrollY/h*100):0)+'%';}
window.addEventListener('scroll',()=>{updateProg();if(S.ch===chapters[cur].id){S.y=window.scrollY;save();}},{passive:true});
function clearMarks(){document.querySelectorAll('#chapter mark').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));$('#chapter').normalize();}
function highlight(q){clearMarks();q=(q||'').trim();if(!q)return;const root=$('#chapter');const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];let n;while(n=w.nextNode())ns.push(n);
ns.forEach(node=>{const idx=node.nodeValue.toLowerCase().indexOf(q.toLowerCase());if(idx<0)return;const f=document.createDocumentFragment();if(idx>0)f.appendChild(document.createTextNode(node.nodeValue.slice(0,idx)));
const mk=document.createElement('mark');mk.textContent=node.nodeValue.slice(idx,idx+q.length);f.appendChild(mk);if(idx+q.length<node.nodeValue.length)f.appendChild(document.createTextNode(node.nodeValue.slice(idx+q.length)));node.replaceWith(f);});
const first=root.querySelector('mark');if(first)first.scrollIntoView({block:'center'});}
let timer;
$('#q').oninput=e=>{clearTimeout(timer);const v=e.target.value;timer=setTimeout(()=>search(v),220);};
$('#q').onkeydown=e=>{if(e.key==='Escape'){e.target.value='';search('');e.target.blur();}};
function search(q){const box=$('#results');q=(q||'').trim();if(!q){box.style.display='none';hits=[];clearMarks();return;}
hits=[];chapters.forEach((c,i)=>{let idx=c.plain.toLowerCase().indexOf(q.toLowerCase());if(idx<0)return;
hits.push({i,title:`第${c.num}章 ${c.title}`,ctx:c.plain.slice(Math.max(0,idx-30),idx+q.length+40)});});
box.style.display='block';box.innerHTML=hits.length?hits.map((h,k)=>`<div class="r" data-k="${k}"><div class="rt">${h.title}</div><div class="rc">…${h.ctx.replace(/</g,'&lt;')}…</div></div>`).join(''):`<div class="empty">没有找到「${q.replace(/</g,'&lt;')}」</div>`;
box.querySelectorAll('.r').forEach(r=>{r.onclick=()=>{go(hits[+r.dataset.k].i,true);setTimeout(()=>highlight(q),30);};});}
document.addEventListener('keydown',e=>{if(/input|select|textarea/i.test(e.target.tagName))return;
if(e.key==='ArrowLeft')go(cur-1,true);if(e.key==='ArrowRight')go(cur+1,true);
if(e.key==='/'){e.preventDefault();$('#q').focus();}if(e.key==='t'||e.key==='T')$('#fold').click();});
applySettings();
let start=chapters.length-1;
if(S.ch){const k=chapters.findIndex(c=>c.id===S.ch);if(k>=0)start=k;}
cur=start;render();
if(S.ch===chapters[start].id&&S.y){window.scrollTo(0,S.y);}else{window.scrollTo(0,0);}
updateProg();
</script>
</body>
</html>
