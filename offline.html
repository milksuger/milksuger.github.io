字都硌人——\n\n今儿晌午，矮个儿、瘦高个儿、高个儿，仨人一块儿出的镇，往山里去了。绳子上缠着那把新铜锁。走之前，瘦高个儿在我跟前站了站，说了一句话：初五的灯，一盏也点不成。你们信不信？\n\n把头看完信，把信纸凑到灯上烧了。\n\n\"他们要锁灯。\"我说。\n\n\"他们要锁的不是灯。\"把头说，\"灯点起来，名分过明路——他们要锁的是明路。\"\n\n他坐在炕沿上，把烟袋装上，没点。窗户外头，五月初五前的最后一夜，山那边黑得严严实实。可我们都知道，那三盏灯，这会儿还亮着，火头直直的，等着正日子的钟点。\n\n\"睡吧。\"把头吹了灯，\"明天，赴灯。\"", "words": 2882, "html": "<p>老陈的话在炕桌上放了一夜，谁也没动它。<\/p>\n<p>天没亮，屋里人就齐了。鱼哥蹲在炕梢，小萱倚着门框，豆芽仔的信还压在醋碟底下。谁都没睡踏实，谁也不先开口。<\/p>\n<p>还是老陈先说话。他就蹲在门槛上，一袋接一袋地抽烟，说到灯的时候，手都有点比划不稳。<\/p>\n<p>\"我起初当是山下人上坟。\"他说，\"可那位置不对——山坳里头，前不着村后不着店。我捡了两块石头扔过去，石头打在树上，灯晃了晃，火苗愣是没歪。\"<\/p>\n<p>\"你靠近看了没有？\"<\/p>\n<p>\"没有。\"老陈摇头，\"我干护林十来年，山里的邪性事，宁可信其有。我就下来报信了——反正那白头发老头常在的地方，我去熟。\"<\/p>\n<p>天大亮，把头才开口：\"引灯。\"<\/p>\n<p>\"您怎么断定是引灯？\"我问。<\/p>\n<p>\"正经山灯，挂在庙、挂在门、挂在人的窗前头，图个照。\"把头说，\"挂枯树上的灯，不是照人的，是引东西的。火头朝水，烟往山下走——山里那些认灯不认人的物件，见着就得跟。\"<\/p>\n<p>\"领路锅，是初一夜里进山的。\"我说，\"那这两盏——\"<\/p>\n<p>\"是给它带道的。\"把头说，\"领路的锅进了山，还得有灯把道接上。有人等不了初五，夜里就把道铺上了。\"<\/p>\n<p>\"那正经的灯会还办不办？\"鱼哥问。<\/p>\n<p>\"办。\"把头说，\"引灯引的是锅，不是名分。名分要过明路，就得正日子、正地方、正的灯。有人铺岔道，咱们走正道——两头都别耽误。\"<\/p>\n<p>老陈临走前，把头托他一件事：这四天，那两盏灯要是灭了，或者挪了窝，想方设法捎个信下来。老陈应了，揣上两个饼子就往北坡走。走到院门口他回头说了一句：\"那老头好些天没见着了。往常这个日子，他早该在老地方坐着了。\"<\/p>\n<p>这句话谁也没接。可我知道，把头把它记下了。<\/p>\n<p>早饭后，豆芽仔从桓仁捎回第二封信。这封信比头一封沉，字也写得慌：<\/p>\n<p>马渡霜的佛具店，门板下了，人不在。隔壁说初三一早见她出的门，背了个包袱，往东去的，再没回来。她水汊子那间独屋，门虚掩着，佛灯没吹，牌位前的香烧过了三炷，灰是整段的，没人动过。<\/p>\n<p>\"整段的香灰，说明她走得急，\"把头把信纸折起来，\"但不是被人架走的。架走的，屋里得翻。\"<\/p>\n<p>\"她说过，初五那天她要是不露面，别找她。\"我说。<\/p>\n<p>\"她这话是初三之前说的。\"把头站起来，\"人初三就没了影。她没等到初五，就先躲了。\"<\/p>\n<p>\"躲什么？\"<\/p>\n<p>\"躲她该走的那个位子。\"把头说完这句，自己顿了一下，像是说漏了什么，摆摆手，\"备东西吧。\"<\/p>\n<p>我明白他把头半句咽回去的是什么。灯亮一盏，走一个——走的是接灯的。马家师兄当年接的是第一盏。那她马家的人，往后几盏里头，有没有她的位？<\/p>\n<p>她要是自己想明白了这个，走得急，就不奇怪了。<\/p>\n<p>\"要不要找？\"我问。<\/p>\n<p>\"初五之前不找。\"把头说，\"她要是想藏，桓仁城里翻不出来。她要是想露面，不用我们找。\"<\/p>\n<p>当天的正事是把初五的行程钉死。路线照旧——不走官道，晨起进沟，天黑前抵石室。分工：鱼哥背粮和灯，把头拿契匣和锅钉，锅在我背上；豆芽仔守桓仁，一有动静往村里捎信；小萱看家。<\/p>\n<p>锅钉单独收了。把头拿一块新红布把酒糟鼻那枚锅钉包了三层，跟契放进一个匣子。<\/p>\n<p>\"这物件比契还沉。\"他说，\"盟坛上劈锅的那笔账，三十年没人认。初五要是有人翻旧账，它就是证。\"<\/p>\n<p>粮和水是鱼哥去王瘸子家备的。王瘸子听说是进山，没多问，塞过来一包熏好的干鱼，外加一句：\"蛇药带着。沟里那东西，今年开春就没露过面，不正常。\"<\/p>\n<p>小萱连夜把三个人的鞋底都纳了一遍，纳完拿蜡在鞋帮上蹭了蹭。她还是话少，就把鞋一双一双摆在我们门口，摆得整整齐齐。<\/p>\n<p>鱼哥听完安排，半天没言语，末了说：\"哥，我昨儿夜里又魇着了。\"<\/p>\n<p>\"梦着什么？\"<\/p>\n<p>\"灯。\"他说。这两个字他说得很艰难，\"一排灯，挂在山缝里头。数了数，七盏。别的都挂着不动，就一盏——它在往外爬。\"<\/p>\n<p>七盏。我心里一动，没敢接话。沈清荷梦里那七头青铜灯，我没跟鱼哥提过一个字。<\/p>\n<p>把头在旁边听着，听完了只问了一句：\"往外爬，爬到哪儿了？\"<\/p>\n<p>\"爬到缝口了。\"鱼哥说，\"灯头都探出缝了。我喊了一声，就醒了。\"<\/p>\n<p>把头和我的目光碰了碰，谁也没说话。<\/p>\n<p>初三夜里，我把把头拽到村北的高地上。<\/p>\n<p>\"您看山。\"<\/p>\n<p>把头顺着我的手看过去。北坡东边山坳的方向，夜色里浮着黄点，不大，可稳。看一会儿，眼晕了，它们还在原地。<\/p>\n<p>\"老陈白天捎下话来，\"我说，\"灯底下落了层灰——灯花的灰，薄薄一层。那灯已经亮了不止一夜。\"<\/p>\n<p>把头眯着眼数了两遍，没吭声。<\/p>\n<p>三粒。<\/p>\n<p>前儿夜里还是两盏。今儿夜里，第三盏灯亮起来了。三盏，隔着老远，摆出的却不是一条线——歪歪的，像有人在山里，一步点一盏，正朝着沟口的方向挪。<\/p>\n<p>\"灯在爬山。\"我把鱼哥梦里那句说了，\"跟鱼哥梦的一模一样。灯在往外爬。\"<\/p>\n<p>把头在高地上站了半宿。下山的时候，他只说了一句：<\/p>\n<p>\"山里那位不点灯。这几盏，是掌灯的点的——他也等不得了，怕夜长梦多。两边都赶着初五，这山里就是一锅滚水，就看谁的火先灭。\"<\/p>\n<p>下山走到村口，把头忽然站住，背对着我。<\/p>\n<p>\"小子，我问你一句话，你想好了再答。\"<\/p>\n<p>\"您问。\"<\/p>\n<p>\"灯亮一盏走一个。高个儿那样的，轮上就得走。\"他顿了顿，\"真轮到你，你走不走？\"<\/p>\n<p>我没马上答。这话没法马上答。想了半天，我说：\"把头，我先问您一句——您当年在扣锅台，为什么不拦着我认账？\"<\/p>\n<p>把头半天没言语。<\/p>\n<p>\"因为拦不住。\"他说，\"名分这东西，认了就是认了。拦住了今儿，拦不住明儿。\"<\/p>\n<p>\"那我走不走，跟您拦不拦，一个理。\"我说，\"轮上了，我就走。可走之前，我把该办的都办完——锅归位，账对清，把头您后半辈子有人管。\"<\/p>\n<p>把头背对着我，站了很久。最后他抬手在自己脸上抹了一把，像抹掉点什么。<\/p>\n<p>\"睡吧。\"他说，\"明儿还有一天的活儿。\"<\/p>\n<p>那晚我躺下以后，听见他在外屋坐到后半夜，烟袋锅子一明一灭，明了一宿。<\/p>\n<p>初四这天过得格外慢。把头让我把契、镜、灯芯、蓝布又检点了一遍，锅钉单独包好，跟契放在一处。傍晚他去了一趟加油站，回来的时候手上多了一张灶王爷，是老鼠男摊上的。<\/p>\n<p>\"他怎么说？\"<\/p>\n<p>\"他没说。\"把头把灶王爷贴在偏屋门后，\"他就问我一句话——背锅的，你知道灯往哪儿挂吗？\"<\/p>\n<p>\"你怎么答的？\"<\/p>\n<p>\"我说不知道。\"把头说，\"他说，答对了。\"<\/p>\n<p>夜里我睡不着，起来喝水，看见小萱在灶房里，就着一点炭火的光纳鞋底。纳的是把头那双——他那双鞋早开了线，他不说，她看出来了。<\/p>\n<p>\"哥。\"她头也没抬，\"你们明天真进沟？\"<\/p>\n<p>\"进。\"<\/p>\n<p>\"都回得来吗？\"<\/p>\n<p>这一问，问得我半天没接上话。灶膛里的炭噼啪响了一声。<\/p>\n<p>\"回得来。\"我说，\"你们把门看好。\"<\/p>\n<p>她\"嗯\"了一声，低头接着纳。锥子扎过鞋底的声音，一下一下的，又稳又密。我站了一会儿，回屋躺下，那声音隔着墙传过来，听着听着，心里竟定了不少。<\/p>\n<p>初四夜里，豆芽仔的信到的，托的还是赶集的老乡。信上的话不多，可每个字都硌人——<\/p>\n<p>今儿晌午，矮个儿、瘦高个儿、高个儿，仨人一块儿出的镇，往山里去了。绳子上缠着那把新铜锁。走之前，瘦高个儿在我跟前站了站，说了一句话：初五的灯，一盏也点不成。你们信不信？<\/p>\n<p>把头看完信，把信纸凑到灯上烧了。<\/p>\n<p>\"他们要锁灯。\"我说。<\/p>\n<p>\"他们要锁的不是灯。\"把头说，\"灯点起来，名分过明路——他们要锁的是明路。\"<\/p>\n<p>他坐在炕沿上，把烟袋装上，没点。窗户外头，五月初五前的最后一夜，山那边黑得严严实实。可我们都知道，那三盏灯，这会儿还亮着，火头直直的，等着正日子的钟点。<\/p>\n<p>\"睡吧。\"把头吹了灯，\"明天，赴灯。\"<\/p>", "plain": "老陈的话在炕桌上放了一夜，谁也没动它。 天没亮，屋里人就齐了。鱼哥蹲在炕梢，小萱倚着门框，豆芽仔的信还压在醋碟底下。谁都没睡踏实，谁也不先开口。 还是老陈先说话。他就蹲在门槛上，一袋接一袋地抽烟，说到灯的时候，手都有点比划不稳。 \"我起初当是山下人上坟。\"他说，\"可那位置不对——山坳里头，前不着村后不着店。我捡了两块石头扔过去，石头打在树上，灯晃了晃，火苗愣是没歪。\" \"你靠近看了没有？\" \"没有。\"老陈摇头，\"我干护林十来年，山里的邪性事，宁可信其有。我就下来报信了——反正那白头发老头常在的地方，我去熟。\" 天大亮，把头才开口：\"引灯。\" \"您怎么断定是引灯？\"我问。 \"正经山灯，挂在庙、挂在门、挂在人的窗前头，图个照。\"把头说，\"挂枯树上的灯，不是照人的，是引东西的。火头朝水，烟往山下走——山里那些认灯不认人的物件，见着就得跟。\" \"领路锅，是初一夜里进山的。\"我说，\"那这两盏——\" \"是给它带道的。\"把头说，\"领路的锅进了山，还得有灯把道接上。有人等不了初五，夜里就把道铺上了。\" \"那正经的灯会还办不办？\"鱼哥问。 \"办。\"把头说，\"引灯引的是锅，不是名分。名分要过明路，就得正日子、正地方、正的灯。有人铺岔道，咱们走正道——两头都别耽误。\" 老陈临走前，把头托他一件事：这四天，那两盏灯要是灭了，或者挪了窝，想方设法捎个信下来。老陈应了，揣上两个饼子就往北坡走。走到院门口他回头说了一句：\"那老头好些天没见着了。往常这个日子，他早该在老地方坐着了。\" 这句话谁也没接。可我知道，把头把它记下了。 早饭后，豆芽仔从桓仁捎回第二封信。这封信比头一封沉，字也写得慌： 马渡霜的佛具店，门板下了，人不在。隔壁说初三一早见她出的门，背了个包袱，往东去的，再没回来。她水汊子那间独屋，门虚掩着，佛灯没吹，牌位前的香烧过了三炷，灰是整段的，没人动过。 \"整段的香灰，说明她走得急，\"把头把信纸折起来，\"但不是被人架走的。架走的，屋里得翻。\" \"她说过，初五那天她要是不露面，别找她。\"我说。 \"她这话是初三之前说的。\"把头站起来，\"人初三就没了影。她没等到初五，就先躲了。\" \"躲什么？\" \"躲她该走的那个位子。\"把头说完这句，自己顿了一下，像是说漏了什么，摆摆手，\"备东西吧。\" 我明白他把头半句咽回去的是什么。灯亮一盏，走一个——走的是接灯的。马家师兄当年接的是第一盏。那她马家的人，往后几盏里头，有没有她的位？ 她要是自己想明白了这个，走得急，就不奇怪了。 \"要不要找？\"我问。 \"初五之前不找。\"把头说，\"她要是想藏，桓仁城里翻不出来。她要是想露面，不用我们找。\" 当天的正事是把初五的行程钉死。路线照旧——不走官道，晨起进沟，天黑前抵石室。分工：鱼哥背粮和灯，把头拿契匣和锅钉，锅在我背上；豆芽仔守桓仁，一有动静往村里捎信；小萱看家。 锅钉单独收了。把头拿一块新红布把酒糟鼻那枚锅钉包了三层，跟契放进一个匣子。 \"这物件比契还沉。\"他说，\"盟坛上劈锅的那笔账，三十年没人认。初五要是有人翻旧账，它就是证。\" 粮和水是鱼哥去王瘸子家备的。王瘸子听说是进山，没多问，塞过来一包熏好的干鱼，外加一句：\"蛇药带着。沟里那东西，今年开春就没露过面，不正常。\" 小萱连夜把三个人的鞋底都纳了一遍，纳完拿蜡在鞋帮上蹭了蹭。她还是话少，就把鞋一双一双摆在我们门口，摆得整整齐齐。 鱼哥听完安排，半天没言语，末了说：\"哥，我昨儿夜里又魇着了。\" \"梦着什么？\" \"灯。\"他说。这两个字他说得很艰难，\"一排灯，挂在山缝里头。数了数，七盏。别的都挂着不动，就一盏——它在往外爬。\" 七盏。我心里一动，没敢接话。沈清荷梦里那七头青铜灯，我没跟鱼哥提过一个字。 把头在旁边听着，听完了只问了一句：\"往外爬，爬到哪儿了？\" \"爬到缝口了。\"鱼哥说，\"灯头都探出缝了。我喊了一声，就醒了。\" 把头和我的目光碰了碰，谁也没说话。 初三夜里，我把把头拽到村北的高地上。 \"您看山。\" 把头顺着我的手看过去。北坡东边山坳的方向，夜色里浮着黄点，不大，可稳。看一会儿，眼晕了，它们还在原地。 \"老陈白天捎下话来，\"我说，\"灯底下落了层灰——灯花的灰，薄薄一层。那灯已经亮了不止一夜。\" 把头眯着眼数了两遍，没吭声。 三粒。 前儿夜里还是两盏。今儿夜里，第三盏灯亮起来了。三盏，隔着老远，摆出的却不是一条线——歪歪的，像有人在山里，一步点一盏，正朝着沟口的方向挪。 \"灯在爬山。\"我把鱼哥梦里那句说了，\"跟鱼哥梦的一模一样。灯在往外爬。\" 把头在高地上站了半宿。下山的时候，他只说了一句： \"山里那位不点灯。这几盏，是掌灯的点的——他也等不得了，怕夜长梦多。两边都赶着初五，这山里就是一锅滚水，就看谁的火先灭。\" 下山走到村口，把头忽然站住，背对着我。 \"小子，我问你一句话，你想好了再答。\" \"您问。\" \"灯亮一盏走一个。高个儿那样的，轮上就得走。\"他顿了顿，\"真轮到你，你走不走？\" 我没马上答。这话没法马上答。想了半天，我说：\"把头，我先问您一句——您当年在扣锅台，为什么不拦着我认账？\" 把头半天没言语。 \"因为拦不住。\"他说，\"名分这东西，认了就是认了。拦住了今儿，拦不住明儿。\" \"那我走不走，跟您拦不拦，一个理。\"我说，\"轮上了，我就走。可走之前，我把该办的都办完——锅归位，账对清，把头您后半辈子有人管。\" 把头背对着我，站了很久。最后他抬手在自己脸上抹了一把，像抹掉点什么。 \"睡吧。\"他说，\"明儿还有一天的活儿。\" 那晚我躺下以后，听见他在外屋坐到后半夜，烟袋锅子一明一灭，明了一宿。 初四这天过得格外慢。把头让我把契、镜、灯芯、蓝布又检点了一遍，锅钉单独包好，跟契放在一处。傍晚他去了一趟加油站，回来的时候手上多了一张灶王爷，是老鼠男摊上的。 \"他怎么说？\" \"他没说。\"把头把灶王爷贴在偏屋门后，\"他就问我一句话——背锅的，你知道灯往哪儿挂吗？\" \"你怎么答的？\" \"我说不知道。\"把头说，\"他说，答对了。\" 夜里我睡不着，起来喝水，看见小萱在灶房里，就着一点炭火的光纳鞋底。纳的是把头那双——他那双鞋早开了线，他不说，她看出来了。 \"哥。\"她头也没抬，\"你们明天真进沟？\" \"进。\" \"都回得来吗？\" 这一问，问得我半天没接上话。灶膛里的炭噼啪响了一声。 \"回得来。\"我说，\"你们把门看好。\" 她\"嗯\"了一声，低头接着纳。锥子扎过鞋底的声音，一下一下的，又稳又密。我站了一会儿，回屋躺下，那声音隔着墙传过来，听着听着，心里竟定了不少。 初四夜里，豆芽仔的信到的，托的还是赶集的老乡。信上的话不多，可每个字都硌人—— 今儿晌午，矮个儿、瘦高个儿、高个儿，仨人一块儿出的镇，往山里去了。绳子上缠着那把新铜锁。走之前，瘦高个儿在我跟前站了站，说了一句话：初五的灯，一盏也点不成。你们信不信？ 把头看完信，把信纸凑到灯上烧了。 \"他们要锁灯。\"我说。 \"他们要锁的不是灯。\"把头说，\"灯点起来，名分过明路——他们要锁的是明路。\" 他坐在炕沿上，把烟袋装上，没点。窗户外头，五月初五前的最后一夜，山那边黑得严严实实。可我们都知道，那三盏灯，这会儿还亮着，火头直直的，等着正日子的钟点。 \"睡吧。\"把头吹了灯，\"明天，赴灯。\""}, {"id": "A5-098", "arc": "A5", "num": 98, "title": "进沟", "md": "五月初五，天刚透亮，我们仨出的村。\n\n小萱把我们送到村口，就站住了。她没说话，从怀里掏出一小包东西塞给鱼哥——是几个煮鸡蛋，还温着。鱼哥接了，愣了一下，把鸡蛋小心地搁在粮袋最上头。\n\n豆芽仔不在，他前儿就回桓仁了。临走那晚把头跟他交代：\"记住，你不用胆子大，你只要眼睛尖。看见什么，记什么，别打听。\"豆芽仔拍着胸脯走了，走出两步又回来，问了句：\"要是看见……不该看见的呢？\"\n\n\"记下来。\"把头说，\"不该看的，你也记。回来给我。\"\n\n进山这一路，没人提灯，没人提锅，好像仨人约好了，把那点紧张都揣进怀里捂着。\n\n锅在我背上。出村那几里地还好，过了黑瞎子沟，山路一陡，那口锅就像长了根，一坠一坠往骨头缝里沉。鱼哥要替我，把头拦了：\"锅认人。半道换肩，它得犯嘀咕。\"\n\n\"那它嘀咕起来，是啥样？\"\n\n\"你见过骡子闹脾气的样儿吗？\"把头在前头说，\"差不多。\"\n\n鱼哥就不吭声了，闷头走在中间，背上粮袋和灯碗，一步一响。天边刚泛白，露水把道打透了，三个人三双新纳的鞋底，走出半里地就都透了。\n\n走到最后一道梁，把头停下来，回身把村子又看了一眼。晨雾里的雅河乡就那么十几户人家，炊烟都没起。\n\n\"进了这道梁，\"他说，\"话就少说。沟里的规矩：不喊名，不应声，不走回头路。\"\n\n进沟前最后一道梁，把头站住了。\n\n黑眉蛇窝那条石缝还在老地方，缝口的乱石半点没动。可缝口上横着一样东西——一张完整的蛇皮，蜕得干干净净，蒙在缝口上，风一过，轻轻地鼓。\n\n\"黑眉走了。\"把头看着那张皮，\"整张蜕在缝口，这是让门的蛇让道了。\"\n\n鱼哥往后缩了半步：\"蛇……让道？\"\n\n\"山里要过大事，蛇比人先知道。\"把头说，\"走吧，别碰它。\"\n\n\"把头，\"鱼哥忍不住，\"蛇让道，是让好事还是坏事？\"\n\n\"蛇不管好坏，蛇管动静。\"把头说，\"山门要是真要动，蛇让道是给蛇留的活路，也是给人留的信号——它让了，说明动静还没到顶。到顶的时候，蛇就不让了，蛇就跑了。\"\n\n\"跑了会怎么样？\"\n\n\"跑了，\"把头说，\"山就空了。\"\n\n过蛇窝的时候，谁也没出声。那张蛇皮在头上轻轻地晃，像一面没字的幡。\n\n晌午前，到了沟口。日头白花花的，沟里却阴凉，一进沟口，汗就收了。\n\n老远就抬头找——鹰嘴石梁还在，梁上那道黑影没了。倒吊锅的位置空着，石梁底下只剩一圈黑泥印子，干在石头上，边上一道一道的绳痕。\n\n鱼哥仰着头看那圈空印子，看了半天：\"哥，当年进沟，是它领的咱们。这会儿它没了，咱们还算认道的吗？\"\n\n\"认。\"把头说，\"路在人心里，不在锅上。锅领的是头一回，往后的道，咱们自己认得。\"\n\n把头凑近了看绳痕，看了很久。\n\n\"新痕。\"他说，\"勒进石头的那几道是旧的，咱们当年进沟时就有。这几道浅的，顶多六天。\"\n\n\"初一夜里，\"我说，\"它是打这儿被解下来带走的。\"\n\n\"解下来的？\"鱼哥凑过来看，\"哥，那它不是自己走——是叫人解下来的？\"\n\n把头没接话。他伸手在黑泥印子底下抠了一点泥，捻开，对着天光看。泥里有亮星。\n\n\"老泥。\"他说，\"盟坛里带出来的。解锅的人，是从里头出来的。\"\n\n我们没在沟口多停。进了沟，雾比当年那回薄，龙回头那道弯一过，路就熟了——哪儿该弯腰，哪儿该踩石头，脚自己记得。\n\n沟里静得反常。当年进沟，好歹有水声、鸟声，这会儿连水都走得没声。石缝两壁的湿气重，越往里走越凉，凉得人不自觉地把步子放轻。走到半道，鱼哥忽然拽了我一把，指了指头顶——\n\n石梁上挂着一串水珠，颗颗悬着，不落。\n\n\"哥，\"他嗓子压得极低，\"这水……不对。\"\n\n\"别看。\"把头头也不回，\"走道。\"\n\n日头偏西的时候，缝口到了。\n\n干茬的蛇缝岗哨塌了半边，锁眼石还堵在原处。把头绕着锁眼石看了一圈，伸手在石缝边上摸了摸。\n\n\"没动过。\"他说，\"里头那位，还没醒。\"\n\n\"里头那位？\"\n\n\"封在里头的灯。\"把头说，\"当年撬缝的人听见过灯响。三十年了，它没响过。初一夜里要是响一回——\"\n\n他没说完，抬脚进了盟坛石室。\n\n石室里比记忆里暗。五方石位还在，四口倒扣的锅还扣在原处，扣了不知多少年，锅身跟石头都长在一起了。西南空位空着，空得干干净净，连灰都没有。\n\n把头举着火折子，围着西南空位转了一圈。石位上凿着浅浅一圈凹槽，槽里干干净净，槽沿上有一圈更浅的旧磨痕——磨得发亮，是常年有东西搁在上头磨出来的。\n\n\"这空位上，搁过东西。\"把头说，\"搁了很久。\"\n\n\"搁的什么？\"\n\n\"不知道。\"把头说，\"反正不是锅。锅搁这儿会留泥，它一点泥没有。\"\n\n北墙上，那盏白纸灯笼，又挂回来了。\n\n七十六那晚我们回沟取锅，北墙上是空的。这会儿灯笼挂得端端正正，灯底下压着一张字条，墨迹还新：\n\n锅到了，人就位。\n\n把头把字条拿起来，凑到鼻子底下闻了闻：\"墨不过两天。留字的人，初一以后来过。\"\n\n\"草帽人？\"\n\n\"不像。\"把头说，\"他掌灯的，不在墙上留字。这个手笔——\"他把字条对着门口的亮光看，\"笔画收得紧，是匠人的字。\"\n\n纸也是好纸。不是外头买的毛边纸，是那种老法子抄的皮纸，韧，迎着光看，帘纹一道一道，匀得像机器印的——可这不是机器能印出来的纹。\n\n做信人家里的纸。\n\n把字条压回灯底下的时候，我心里数了一件事：灯，还挂着五盏的位子。可石室里现成的灯，就北墙这一盏。\n\n\"灯从哪儿来？\"我问。\n\n\"带来了。\"门口有人说话。\n\n我们仨齐刷刷回头。缝口黑着，一个人站在黑里，手里提着一盏白纸灯笼，没点。草帽的影子压着半张脸。\n\n\"你们早到了，好。\"草帽人往里走，身后还跟着两个人，抬着一根扁担，扁担两头各挂两盏灯，四盏，白纸的，都没点。\n\n那两个抬灯的面生，一老一少，进了石室就低头干活，谁也不看。灯从扁担上取下来，一盏一盏挂上四方的石位——草帽人挂得极讲究，灯钩卡进石缝的深浅，每盏都拿手指探了探，探完还要侧耳听一听，像在给灯号脉。\n\n\"挂灯还听？\"鱼哥小声问我。\n\n\"灯挂对了，\"草帽人替我答了，头也没回，\"里头的芯会应一声。你们听不见，我听得见。\"\n\n挂完，他退后一步，看了看，像是布置一场喜事。\n\n\"还差一盏。\"他说，\"西南的。\"\n\n\"西南那盏灯呢？\"把头问。\n\n\"西南不用灯。\"草帽人说。他转过脸来，帽檐底下看着我，看我背上的锅，\"西南的那盏，得用锅。\"\n\n\"灯都点了五盏，为什么单单西南用锅？\"鱼哥没忍住。\n\n草帽人没恼，像教书先生碰上个好问题：\"四方的灯照四方的位。西南是空位——第六数。空位上的光，灯给不了，得锅自己发。锅底有纹，纹对着地，地气一顶，它自己就亮。\"\n\n\"要是它不亮呢？\"鱼哥又问。\n\n\"那就不亮。\"草帽人说得很平，\"灯会年年办，空位不是回回都满。等了一个空位等的年数，比你们的岁数长。\"\n\n石室里静了一瞬。我背上的锅，忽然沉了一沉——不是错觉，是真沉，像有什么东西在锅底下翻了个身。\n\n就在这时候，缝口外头，传来了脚步声。\n\n不止一路。\n\n一路脚步重，踩在碎石上，一步一个响，是照着直道来的；另一路轻，几乎听不见，只在缝口外的湿土上偶尔沾出一声半声。两路人一前一后，在缝口外头，都停住了。\n\n把头把火折子掐灭，低声道：\"来了。都来了。\"\n\n鱼哥往我边上靠了靠，手里的灯碗攥得指节发白。我背上的锅又沉了一沉，锅底那圈纹路贴着我的后脊，一跳一跳的，像有脉。\n\n缝口黑下来，先进来一盏灯。", "words": 2814, "html": "<p>五月初五，天刚透亮，我们仨出的村。<\/p>\n<p>小萱把我们送到村口，就站住了。她没说话，从怀里掏出一小包东西塞给鱼哥——是几个煮鸡蛋，还温着。鱼哥接了，愣了一下，把鸡蛋小心地搁在粮袋最上头。<\/p>\n<p>豆芽仔不在，他前儿就回桓仁了。临走那晚把头跟他交代：\"记住，你不用胆子大，你只要眼睛尖。看见什么，记什么，别打听。\"豆芽仔拍着胸脯走了，走出两步又回来，问了句：\"要是看见……不该看见的呢？\"<\/p>\n<p>\"记下来。\"把头说，\"不该看的，你也记。回来给我。\"<\/p>\n<p>进山这一路，没人提灯，没人提锅，好像仨人约好了，把那点紧张都揣进怀里捂着。<\/p>\n<p>锅在我背上。出村那几里地还好，过了黑瞎子沟，山路一陡，那口锅就像长了根，一坠一坠往骨头缝里沉。鱼哥要替我，把头拦了：\"锅认人。半道换肩，它得犯嘀咕。\"<\/p>\n<p>\"那它嘀咕起来，是啥样？\"<\/p>\n<p>\"你见过骡子闹脾气的样儿吗？\"把头在前头说，\"差不多。\"<\/p>\n<p>鱼哥就不吭声了，闷头走在中间，背上粮袋和灯碗，一步一响。天边刚泛白，露水把道打透了，三个人三双新纳的鞋底，走出半里地就都透了。<\/p>\n<p>走到最后一道梁，把头停下来，回身把村子又看了一眼。晨雾里的雅河乡就那么十几户人家，炊烟都没起。<\/p>\n<p>\"进了这道梁，\"他说，\"话就少说。沟里的规矩：不喊名，不应声，不走回头路。\"<\/p>\n<p>进沟前最后一道梁，把头站住了。<\/p>\n<p>黑眉蛇窝那条石缝还在老地方，缝口的乱石半点没动。可缝口上横着一样东西——一张完整的蛇皮，蜕得干干净净，蒙在缝口上，风一过，轻轻地鼓。<\/p>\n<p>\"黑眉走了。\"把头看着那张皮，\"整张蜕在缝口，这是让门的蛇让道了。\"<\/p>\n<p>鱼哥往后缩了半步：\"蛇……让道？\"<\/p>\n<p>\"山里要过大事，蛇比人先知道。\"把头说，\"走吧，别碰它。\"<\/p>\n<p>\"把头，\"鱼哥忍不住，\"蛇让道，是让好事还是坏事？\"<\/p>\n<p>\"蛇不管好坏，蛇管动静。\"把头说，\"山门要是真要动，蛇让道是给蛇留的活路，也是给人留的信号——它让了，说明动静还没到顶。到顶的时候，蛇就不让了，蛇就跑了。\"<\/p>\n<p>\"跑了会怎么样？\"<\/p>\n<p>\"跑了，\"把头说，\"山就空了。\"<\/p>\n<p>过蛇窝的时候，谁也没出声。那张蛇皮在头上轻轻地晃，像一面没字的幡。<\/p>\n<p>晌午前，到了沟口。日头白花花的，沟里却阴凉，一进沟口，汗就收了。<\/p>\n<p>老远就抬头找——鹰嘴石梁还在，梁上那道黑影没了。倒吊锅的位置空着，石梁底下只剩一圈黑泥印子，干在石头上，边上一道一道的绳痕。<\/p>\n<p>鱼哥仰着头看那圈空印子，看了半天：\"哥，当年进沟，是它领的咱们。这会儿它没了，咱们还算认道的吗？\"<\/p>\n<p>\"认。\"把头说，\"路在人心里，不在锅上。锅领的是头一回，往后的道，咱们自己认得。\"<\/p>\n<p>把头凑近了看绳痕，看了很久。<\/p>\n<p>\"新痕。\"他说，\"勒进石头的那几道是旧的，咱们当年进沟时就有。这几道浅的，顶多六天。\"<\/p>\n<p>\"初一夜里，\"我说，\"它是打这儿被解下来带走的。\"<\/p>\n<p>\"解下来的？\"鱼哥凑过来看，\"哥，那它不是自己走——是叫人解下来的？\"<\/p>\n<p>把头没接话。他伸手在黑泥印子底下抠了一点泥，捻开，对着天光看。泥里有亮星。<\/p>\n<p>\"老泥。\"他说，\"盟坛里带出来的。解锅的人，是从里头出来的。\"<\/p>\n<p>我们没在沟口多停。进了沟，雾比当年那回薄，龙回头那道弯一过，路就熟了——哪儿该弯腰，哪儿该踩石头，脚自己记得。<\/p>\n<p>沟里静得反常。当年进沟，好歹有水声、鸟声，这会儿连水都走得没声。石缝两壁的湿气重，越往里走越凉，凉得人不自觉地把步子放轻。走到半道，鱼哥忽然拽了我一把，指了指头顶——<\/p>\n<p>石梁上挂着一串水珠，颗颗悬着，不落。<\/p>\n<p>\"哥，\"他嗓子压得极低，\"这水……不对。\"<\/p>\n<p>\"别看。\"把头头也不回，\"走道。\"<\/p>\n<p>日头偏西的时候，缝口到了。<\/p>\n<p>干茬的蛇缝岗哨塌了半边，锁眼石还堵在原处。把头绕着锁眼石看了一圈，伸手在石缝边上摸了摸。<\/p>\n<p>\"没动过。\"他说，\"里头那位，还没醒。\"<\/p>\n<p>\"里头那位？\"<\/p>\n<p>\"封在里头的灯。\"把头说，\"当年撬缝的人听见过灯响。三十年了，它没响过。初一夜里要是响一回——\"<\/p>\n<p>他没说完，抬脚进了盟坛石室。<\/p>\n<p>石室里比记忆里暗。五方石位还在，四口倒扣的锅还扣在原处，扣了不知多少年，锅身跟石头都长在一起了。西南空位空着，空得干干净净，连灰都没有。<\/p>\n<p>把头举着火折子，围着西南空位转了一圈。石位上凿着浅浅一圈凹槽，槽里干干净净，槽沿上有一圈更浅的旧磨痕——磨得发亮，是常年有东西搁在上头磨出来的。<\/p>\n<p>\"这空位上，搁过东西。\"把头说，\"搁了很久。\"<\/p>\n<p>\"搁的什么？\"<\/p>\n<p>\"不知道。\"把头说，\"反正不是锅。锅搁这儿会留泥，它一点泥没有。\"<\/p>\n<p>北墙上，那盏白纸灯笼，又挂回来了。<\/p>\n<p>七十六那晚我们回沟取锅，北墙上是空的。这会儿灯笼挂得端端正正，灯底下压着一张字条，墨迹还新：<\/p>\n<p>锅到了，人就位。<\/p>\n<p>把头把字条拿起来，凑到鼻子底下闻了闻：\"墨不过两天。留字的人，初一以后来过。\"<\/p>\n<p>\"草帽人？\"<\/p>\n<p>\"不像。\"把头说，\"他掌灯的，不在墙上留字。这个手笔——\"他把字条对着门口的亮光看，\"笔画收得紧，是匠人的字。\"<\/p>\n<p>纸也是好纸。不是外头买的毛边纸，是那种老法子抄的皮纸，韧，迎着光看，帘纹一道一道，匀得像机器印的——可这不是机器能印出来的纹。<\/p>\n<p>做信人家里的纸。<\/p>\n<p>把字条压回灯底下的时候，我心里数了一件事：灯，还挂着五盏的位子。可石室里现成的灯，就北墙这一盏。<\/p>\n<p>\"灯从哪儿来？\"我问。<\/p>\n<p>\"带来了。\"门口有人说话。<\/p>\n<p>我们仨齐刷刷回头。缝口黑着，一个人站在黑里，手里提着一盏白纸灯笼，没点。草帽的影子压着半张脸。<\/p>\n<p>\"你们早到了，好。\"草帽人往里走，身后还跟着两个人，抬着一根扁担，扁担两头各挂两盏灯，四盏，白纸的，都没点。<\/p>\n<p>那两个抬灯的面生，一老一少，进了石室就低头干活，谁也不看。灯从扁担上取下来，一盏一盏挂上四方的石位——草帽人挂得极讲究，灯钩卡进石缝的深浅，每盏都拿手指探了探，探完还要侧耳听一听，像在给灯号脉。<\/p>\n<p>\"挂灯还听？\"鱼哥小声问我。<\/p>\n<p>\"灯挂对了，\"草帽人替我答了，头也没回，\"里头的芯会应一声。你们听不见，我听得见。\"<\/p>\n<p>挂完，他退后一步，看了看，像是布置一场喜事。<\/p>\n<p>\"还差一盏。\"他说，\"西南的。\"<\/p>\n<p>\"西南那盏灯呢？\"把头问。<\/p>\n<p>\"西南不用灯。\"草帽人说。他转过脸来，帽檐底下看着我，看我背上的锅，\"西南的那盏，得用锅。\"<\/p>\n<p>\"灯都点了五盏，为什么单单西南用锅？\"鱼哥没忍住。<\/p>\n<p>草帽人没恼，像教书先生碰上个好问题：\"四方的灯照四方的位。西南是空位——第六数。空位上的光，灯给不了，得锅自己发。锅底有纹，纹对着地，地气一顶，它自己就亮。\"<\/p>\n<p>\"要是它不亮呢？\"鱼哥又问。<\/p>\n<p>\"那就不亮。\"草帽人说得很平，\"灯会年年办，空位不是回回都满。等了一个空位等的年数，比你们的岁数长。\"<\/p>\n<p>石室里静了一瞬。我背上的锅，忽然沉了一沉——不是错觉，是真沉，像有什么东西在锅底下翻了个身。<\/p>\n<p>就在这时候，缝口外头，传来了脚步声。<\/p>\n<p>不止一路。<\/p>\n<p>一路脚步重，踩在碎石上，一步一个响，是照着直道来的；另一路轻，几乎听不见，只在缝口外的湿土上偶尔沾出一声半声。两路人一前一后，在缝口外头，都停住了。<\/p>\n<p>把头把火折子掐灭，低声道：\"来了。都来了。\"<\/p>\n<p>鱼哥往我边上靠了靠，手里的灯碗攥得指节发白。我背上的锅又沉了一沉，锅底那圈纹路贴着我的后脊，一跳一跳的，像有脉。<\/p>\n<p>缝口黑下来，先进来一盏灯。<\/p>", "plain": "五月初五，天刚透亮，我们仨出的村。 小萱把我们送到村口，就站住了。她没说话，从怀里掏出一小包东西塞给鱼哥——是几个煮鸡蛋，还温着。鱼哥接了，愣了一下，把鸡蛋小心地搁在粮袋最上头。 豆芽仔不在，他前儿就回桓仁了。临走那晚把头跟他交代：\"记住，你不用胆子大，你只要眼睛尖。看见什么，记什么，别打听。\"豆芽仔拍着胸脯走了，走出两步又回来，问了句：\"要是看见……不该看见的呢？\" \"记下来。\"把头说，\"不该看的，你也记。回来给我。\" 进山这一路，没人提灯，没人提锅，好像仨人约好了，把那点紧张都揣进怀里捂着。 锅在我背上。出村那几里地还好，过了黑瞎子沟，山路一陡，那口锅就像长了根，一坠一坠往骨头缝里沉。鱼哥要替我，把头拦了：\"锅认人。半道换肩，它得犯嘀咕。\" \"那它嘀咕起来，是啥样？\" \"你见过骡子闹脾气的样儿吗？\"把头在前头说，\"差不多。\" 鱼哥就不吭声了，闷头走在中间，背上粮袋和灯碗，一步一响。天边刚泛白，露水把道打透了，三个人三双新纳的鞋底，走出半里地就都透了。 走到最后一道梁，把头停下来，回身把村子又看了一眼。晨雾里的雅河乡就那么十几户人家，炊烟都没起。 \"进了这道梁，\"他说，\"话就少说。沟里的规矩：不喊名，不应声，不走回头路。\" 进沟前最后一道梁，把头站住了。 黑眉蛇窝那条石缝还在老地方，缝口的乱石半点没动。可缝口上横着一样东西——一张完整的蛇皮，蜕得干干净净，蒙在缝口上，风一过，轻轻地鼓。 \"黑眉走了。\"把头看着那张皮，\"整张蜕在缝口，这是让门的蛇让道了。\" 鱼哥往后缩了半步：\"蛇……让道？\" \"山里要过大事，蛇比人先知道。\"把头说，\"走吧，别碰它。\" \"把头，\"鱼哥忍不住，\"蛇让道，是让好事还是坏事？\" \"蛇不管好坏，蛇管动静。\"把头说，\"山门要是真要动，蛇让道是给蛇留的活路，也是给人留的信号——它让了，说明动静还没到顶。到顶的时候，蛇就不让了，蛇就跑了。\" \"跑了会怎么样？\" \"跑了，\"把头说，\"山就空了。\" 过蛇窝的时候，谁也没出声。那张蛇皮在头上轻轻地晃，像一面没字的幡。 晌午前，到了沟口。日头白花花的，沟里却阴凉，一进沟口，汗就收了。 老远就抬头找——鹰嘴石梁还在，梁上那道黑影没了。倒吊锅的位置空着，石梁底下只剩一圈黑泥印子，干在石头上，边上一道一道的绳痕。 鱼哥仰着头看那圈空印子，看了半天：\"哥，当年进沟，是它领的咱们。这会儿它没了，咱们还算认道的吗？\" \"认。\"把头说，\"路在人心里，不在锅上。锅领的是头一回，往后的道，咱们自己认得。\" 把头凑近了看绳痕，看了很久。 \"新痕。\"他说，\"勒进石头的那几道是旧的，咱们当年进沟时就有。这几道浅的，顶多六天。\" \"初一夜里，\"我说，\"它是打这儿被解下来带走的。\" \"解下来的？\"鱼哥凑过来看，\"哥，那它不是自己走——是叫人解下来的？\" 把头没接话。他伸手在黑泥印子底下抠了一点泥，捻开，对着天光看。泥里有亮星。 \"老泥。\"他说，\"盟坛里带出来的。解锅的人，是从里头出来的。\" 我们没在沟口多停。进了沟，雾比当年那回薄，龙回头那道弯一过，路就熟了——哪儿该弯腰，哪儿该踩石头，脚自己记得。 沟里静得反常。当年进沟，好歹有水声、鸟声，这会儿连水都走得没声。石缝两壁的湿气重，越往里走越凉，凉得人不自觉地把步子放轻。走到半道，鱼哥忽然拽了我一把，指了指头顶—— 石梁上挂着一串水珠，颗颗悬着，不落。 \"哥，\"他嗓子压得极低，\"这水……不对。\" \"别看。\"把头头也不回，\"走道。\" 日头偏西的时候，缝口到了。 干茬的蛇缝岗哨塌了半边，锁眼石还堵在原处。把头绕着锁眼石看了一圈，伸手在石缝边上摸了摸。 \"没动过。\"他说，\"里头那位，还没醒。\" \"里头那位？\" \"封在里头的灯。\"把头说，\"当年撬缝的人听见过灯响。三十年了，它没响过。初一夜里要是响一回——\" 他没说完，抬脚进了盟坛石室。 石室里比记忆里暗。五方石位还在，四口倒扣的锅还扣在原处，扣了不知多少年，锅身跟石头都长在一起了。西南空位空着，空得干干净净，连灰都没有。 把头举着火折子，围着西南空位转了一圈。石位上凿着浅浅一圈凹槽，槽里干干净净，槽沿上有一圈更浅的旧磨痕——磨得发亮，是常年有东西搁在上头磨出来的。 \"这空位上，搁过东西。\"把头说，\"搁了很久。\" \"搁的什么？\" \"不知道。\"把头说，\"反正不是锅。锅搁这儿会留泥，它一点泥没有。\" 北墙上，那盏白纸灯笼，又挂回来了。 七十六那晚我们回沟取锅，北墙上是空的。这会儿灯笼挂得端端正正，灯底下压着一张字条，墨迹还新： 锅到了，人就位。 把头把字条拿起来，凑到鼻子底下闻了闻：\"墨不过两天。留字的人，初一以后来过。\" \"草帽人？\" \"不像。\"把头说，\"他掌灯的，不在墙上留字。这个手笔——\"他把字条对着门口的亮光看，\"笔画收得紧，是匠人的字。\" 纸也是好纸。不是外头买的毛边纸，是那种老法子抄的皮纸，韧，迎着光看，帘纹一道一道，匀得像机器印的——可这不是机器能印出来的纹。 做信人家里的纸。 把字条压回灯底下的时候，我心里数了一件事：灯，还挂着五盏的位子。可石室里现成的灯，就北墙这一盏。 \"灯从哪儿来？\"我问。 \"带来了。\"门口有人说话。 我们仨齐刷刷回头。缝口黑着，一个人站在黑里，手里提着一盏白纸灯笼，没点。草帽的影子压着半张脸。 \"你们早到了，好。\"草帽人往里走，身后还跟着两个人，抬着一根扁担，扁担两头各挂两盏灯，四盏，白纸的，都没点。 那两个抬灯的面生，一老一少，进了石室就低头干活，谁也不看。灯从扁担上取下来，一盏一盏挂上四方的石位——草帽人挂得极讲究，灯钩卡进石缝的深浅，每盏都拿手指探了探，探完还要侧耳听一听，像在给灯号脉。 \"挂灯还听？\"鱼哥小声问我。 \"灯挂对了，\"草帽人替我答了，头也没回，\"里头的芯会应一声。你们听不见，我听得见。\" 挂完，他退后一步，看了看，像是布置一场喜事。 \"还差一盏。\"他说，\"西南的。\" \"西南那盏灯呢？\"把头问。 \"西南不用灯。\"草帽人说。他转过脸来，帽檐底下看着我，看我背上的锅，\"西南的那盏，得用锅。\" \"灯都点了五盏，为什么单单西南用锅？\"鱼哥没忍住。 草帽人没恼，像教书先生碰上个好问题：\"四方的灯照四方的位。西南是空位——第六数。空位上的光，灯给不了，得锅自己发。锅底有纹，纹对着地，地气一顶，它自己就亮。\" \"要是它不亮呢？\"鱼哥又问。 \"那就不亮。\"草帽人说得很平，\"灯会年年办，空位不是回回都满。等了一个空位等的年数，比你们的岁数长。\" 石室里静了一瞬。我背上的锅，忽然沉了一沉——不是错觉，是真沉，像有什么东西在锅底下翻了个身。 就在这时候，缝口外头，传来了脚步声。 不止一路。 一路脚步重，踩在碎石上，一步一个响，是照着直道来的；另一路轻，几乎听不见，只在缝口外的湿土上偶尔沾出一声半声。两路人一前一后，在缝口外头，都停住了。 把头把火折子掐灭，低声道：\"来了。都来了。\" 鱼哥往我边上靠了靠，手里的灯碗攥得指节发白。我背上的锅又沉了一沉，锅底那圈纹路贴着我的后脊，一跳一跳的，像有脉。 缝口黑下来，先进来一盏灯。"}, {"id": "A5-099", "arc": "A5", "num": 99, "title": "灯乱", "md": "脚步声到了缝口，停住。\n\n天色一寸一寸暗下去。我们仨把干粮分了，就着水咽，谁也没说话。鱼哥把黑豆喂给不了谁，就喂给自己，一颗一颗嚼得山响，被把头瞪了一眼，才放轻了。\n\n我把灯芯又摸了一遍。三个月了，它在我贴身的口袋里，捻得紧，白棉的，头上一撮绒。做信人说它是干的——今夜过后，它还干不干得成，就看这一晚。\n\n草帽人抬手，把北墙那盏灯笼点着了。火苗一起来，缝口那片黑就让开了一条线——灯线拦在道中间，笔直的一道亮。\n\n\"灯起了。\"草帽人说，\"进这道缝的，把火灭了再走。\"\n\n黑里头静了片刻。能听出来外头在交换眼色——谁也不肯头一个灭。\n\n先说话的是瘦高个，声音又冷又硬：\"我们灭字一路，从来是掌火的。你让我们灭自己的火？\"\n\n\"我这道缝里，只有一盏灯。\"草帽人说，\"灯底下的都是客。要动手，出了这道缝随便。进了灯的界，谁也别伸手。\"\n\n\"规矩倒是学得像。\"瘦高个冷笑，\"跟谁学的？山里那位？\"\n\n\"跟山学的。\"草帽人说，\"你要嫌这规矩别扭，可以把灯摘了走。灯一摘，界就没了——界没了，你那两个兄弟，可就护不住你了。\"\n\n黑里头又静了一阵。然后是\"嚓\"的一声——火折子熄了。三个人影一个跟一个进了石室：瘦高个在前，矮个在后，中间那个高个，背上横着那捆新麻绳，绳头上缠着铜锁。\n\n高个进门前，把绳和锁在缝口外头的石头上放下了。就放在那盘新麻绳上，摆得整整齐齐，像交械。\n\n瘦高个一进来，眼睛先扫四方的灯，再扫西南空位，最后落在我背上的锅上。\n\n\"信不齐。\"他说，\"五件信，你手里攥着三件半，罐在掌灯的身上，领路的锅到现在没露面。拿半套信点五盏灯——点的是假灯。\"\n\n\"信齐不齐，\"草帽人不紧不慢，\"灯说了算。\"\n\n\"灯是人点的。\"瘦高个说，\"人会说瞎话。\"\n\n\"所以今晚有问灯的。\"草帽人朝缝口偏了偏头，\"你吵不过他。\"\n\n缝口的光线又暗了一层。第三个人进来的时候，石室里连喘气声都轻了。\n\n还是那件灰褂子，还是侧着身，还是那张看不全的脸。他进门先没看人，抬头把北墙的灯笼、四方的石灯挨个看了一遍，看完了，才转过身来。\n\n把头站在我边上，我觉出他的手在抖。\n\n问灯的老头走到灯线里头，站定。今夜他站的位置，比扣锅台那晚正——月光从缝口斜进来，扫过他的侧脸，扫过下巴，扫过——\n\n左耳。\n\n完好的。耳廓圆圆的，一点缺口都没有。\n\n把头的手攥住了我的胳膊，攥得生疼。我在他耳朵边上几乎听见了他的牙关在响——沟里那位守灯的，左耳缺着；五女山问灯的，掐烟的姿势一个模子；可眼前这位，耳朵是全的。\n\n不是一个人。从来就不是一个人。\n\n我脑子里嗡的一声。那掐到烫手的烟嘴、夜里的膝印、\"再等等\"——那些我认过账的做派，全对到了另一个人头上。可把头三十七年的记性，会认错烟嘴吗？\n\n\"你再看看。\"把头的声音压在牙缝里，是冲我说的，也是冲他自己说的，\"看他的手。\"\n\n问灯的老头坐在灯影里，手搭在膝盖上。左手的小指——\n\n齐根少半截。\n\n缺的是小指。废品站敲门人缺的那半截，鱼哥在焚房夜里验过的那半截。把头的肩膀垮下去半寸，又硬起来。这世上的账，比我们记的还乱：掐烟的做派能学，烟嘴能换，可手上的缺，是做不了假的——也可能，是故意的。\n\n问灯的老头像是背后长了眼睛，他不看把头，只淡淡说了一句：\"耳朵的事儿，等灯点完了再说。今晚论灯，不论人。\"\n\n瘦高个冷笑：\"论灯？好啊。那就当着灯的面说清楚——五盏灯，你们打算怎么点？油呢？\"\n\n草帽人从怀里把那口黑坛取出来，搁在灯底下。黑蜡封口，还是那个指印。\n\n\"油在这儿。\"\n\n他把坛子往灯底下一推，又从怀里取出一个布卷，展开——是那只珍珠罐。罐身上落了些灰，他用袖子擦了，把罐口对着北墙的灯。\n\n\"罐是眼。\"他说，\"灯点起来，是罐替灯看着道。\"\n\n罐口迎着灯光，那一圈磨残的鱼尾纹，一深一浅，在光里清清楚楚。\n\n\"芯呢？\"\n\n云峰把灯芯从贴身处取出来。白棉捻的，三个月了，一直贴着胸口，带着体温。\n\n\"芯在这儿。\"草帽人替我答了。\n\n\"锅呢？\"\n\n\"锅在这儿。\"我把背上的锅卸下来，抱在怀里。锅身温的——一路进山，它贴着我的背，早就不是石头的凉了。\n\n\"还差领路的锅。\"瘦高个说，\"它初一夜里就进山了，怎么没见着？\"\n\n\"它不用见。\"缝口那边，有人接了话。\n\n众人回头。酒糟鼻不知什么时候到了缝口边上，靠着石壁站着，喘匀了气才往里走。他今晚把那件发白的旧褂子洗过了，走得不快，一步一步，像是踩着自己三十年的脚印。\n\n\"它领路，\"他说，\"它不在道上，就在道口。等你们四盏灯一亮，它自己会进来。\"\n\n\"你是谁？\"瘦高个盯着他。\n\n\"三十年前，\"酒糟鼻说，\"看完全场的那个人。\"\n\n他往里走，走到灯线边上，从怀里掏出那个布包，一层层打开，把那枚锅钉举起来，给满屋子的人看了一圈。\n\n\"大锅劈了，钉我抠走一枚。\"他说，\"今儿我把它带回家了。谁有异议？\"\n\n没人接话。瘦高个盯着那枚钉，喉结动了动，到底没言语。\n\n酒糟鼻把钉搁在西南空位边上，冲空位拱了拱手，退到壁根底下，靠着石头站了，像是打定主意就看这一场。\n\n瘦高个还想说什么，问灯的老头抬了抬手。\n\n\"点灯。\"他说，\"天交二更了。头一盏，请掌灯的。\"\n\n草帽人开坛。黑蜡用指甲一圈一圈剥下来，坛口一开，一股说不出的味散出来——不香，不冲，是一种沉底的陈味，像老庙里几百年没换过的灯。他把芯安进北墙那盏灯里，舀了一勺油，缓缓地浇。\n\n\"借你的名分。\"他对我说，\"灯芯是您的，油是山里的，灯——\"他把火折子递到我手边，\"你来点。\"\n\n火苗凑近灯芯的那一瞬，我的手稳得连自己都意外。\n\n灯亮了。\n\n北墙那盏白纸灯笼从里头透出光来，稳稳的，火头朝上。四方的石位里，三盏还没点的灯，灯纸上映着它的光，微微地晃。\n\n灯亮起来的同一瞬，灭字一路里那个背着铜锁的高个，转过身，朝缝口外的黑暗里走了。\n\n走得安安静静。他不快，也不回头，就像散了一场夜戏，戏散了，该回家的人往家走。\n\n瘦高个一把没拉住，喝了一声，那人像没听见。矮个追出两步，站在灯线上，进也不是，退也不是——灯线拦着他，他不敢过，他兄弟过了，头也不回。\n\n\"高个儿！\"瘦高个又喝了一声。\n\n黑暗里传来高个的声音，平平的，听不出情绪：\"三哥，锁用不上了。我先走一步。\"\n\n然后什么声都没了。\n\n石室里静得可怕。矮个退回灯线里头，蹲在墙根，抱着胳膊，脸埋在影子里。瘦高个站在原地，手还保持着刚才抓人没抓着的姿势，半天才放下来。\n\n\"看见没有。\"问灯的老头在灯影里坐着，声音不高，\"灯亮一盏，走一个。\"\n\n我把这话在心里过了一遍——走，不是跑，不是溜。是走了。高个走的时候，脸上没有一点不舍，倒像……像终于轮到他了。\n\n\"他早知道？\"我低声问把头。\n\n\"买锁的人，\"把头看着那盘搁在缝口的麻绳和铜锁，\"锁的不是别人。\"\n\n我顺着他的话想下去，越想越冷——高个儿买锁那天起，锁的兴许就是自己的退路，或者说，是自己的进路。灭字一路的人，也不是铁板一块。\n\n\"把头，\"我又压低声音，\"问灯那老头的小指——\"\n\n\"别在这儿说。\"把头打断我，声音低得几乎听不见，\"灯底下不点人。他缺的那半截，鱼哥那晚验过的。这会儿不论人，论灯——灯点完，这笔账跑不了。\"\n\n\"第二盏。\"老头说，\"掌灯的，请。\"", "words": 2802, "html": "<p>脚步声到了缝口，停住。<\/p>\n<p>天色一寸一寸暗下去。我们仨把干粮分了，就着水咽，谁也没说话。鱼哥把黑豆喂给不了谁，就喂给自己，一颗一颗嚼得山响，被把头瞪了一眼，才放轻了。<\/p>\n<p>我把灯芯又摸了一遍。三个月了，它在我贴身的口袋里，捻得紧，白棉的，头上一撮绒。做信人说它是干的——今夜过后，它还干不干得成，就看这一晚。<\/p>\n<p>草帽人抬手，把北墙那盏灯笼点着了。火苗一起来，缝口那片黑就让开了一条线——灯线拦在道中间，笔直的一道亮。<\/p>\n<p>\"灯起了。\"草帽人说，\"进这道缝的，把火灭了再走。\"<\/p>\n<p>黑里头静了片刻。能听出来外头在交换眼色——谁也不肯头一个灭。<\/p>\n<p>先说话的是瘦高个，声音又冷又硬：\"我们灭字一路，从来是掌火的。你让我们灭自己的火？\"<\/p>\n<p>\"我这道缝里，只有一盏灯。\"草帽人说，\"灯底下的都是客。要动手，出了这道缝随便。进了灯的界，谁也别伸手。\"<\/p>\n<p>\"规矩倒是学得像。\"瘦高个冷笑，\"跟谁学的？山里那位？\"<\/p>\n<p>\"跟山学的。\"草帽人说，\"你要嫌这规矩别扭，可以把灯摘了走。灯一摘，界就没了——界没了，你那两个兄弟，可就护不住你了。\"<\/p>\n<p>黑里头又静了一阵。然后是\"嚓\"的一声——火折子熄了。三个人影一个跟一个进了石室：瘦高个在前，矮个在后，中间那个高个，背上横着那捆新麻绳，绳头上缠着铜锁。<\/p>\n<p>高个进门前，把绳和锁在缝口外头的石头上放下了。就放在那盘新麻绳上，摆得整整齐齐，像交械。<\/p>\n<p>瘦高个一进来，眼睛先扫四方的灯，再扫西南空位，最后落在我背上的锅上。<\/p>\n<p>\"信不齐。\"他说，\"五件信，你手里攥着三件半，罐在掌灯的身上，领路的锅到现在没露面。拿半套信点五盏灯——点的是假灯。\"<\/p>\n<p>\"信齐不齐，\"草帽人不紧不慢，\"灯说了算。\"<\/p>\n<p>\"灯是人点的。\"瘦高个说，\"人会说瞎话。\"<\/p>\n<p>\"所以今晚有问灯的。\"草帽人朝缝口偏了偏头，\"你吵不过他。\"<\/p>\n<p>缝口的光线又暗了一层。第三个人进来的时候，石室里连喘气声都轻了。<\/p>\n<p>还是那件灰褂子，还是侧着身，还是那张看不全的脸。他进门先没看人，抬头把北墙的灯笼、四方的石灯挨个看了一遍，看完了，才转过身来。<\/p>\n<p>把头站在我边上，我觉出他的手在抖。<\/p>\n<p>问灯的老头走到灯线里头，站定。今夜他站的位置，比扣锅台那晚正——月光从缝口斜进来，扫过他的侧脸，扫过下巴，扫过——<\/p>\n<p>左耳。<\/p>\n<p>完好的。耳廓圆圆的，一点缺口都没有。<\/p>\n<p>把头的手攥住了我的胳膊，攥得生疼。我在他耳朵边上几乎听见了他的牙关在响——沟里那位守灯的，左耳缺着；五女山问灯的，掐烟的姿势一个模子；可眼前这位，耳朵是全的。<\/p>\n<p>不是一个人。从来就不是一个人。<\/p>\n<p>我脑子里嗡的一声。那掐到烫手的烟嘴、夜里的膝印、\"再等等\"——那些我认过账的做派，全对到了另一个人头上。可把头三十七年的记性，会认错烟嘴吗？<\/p>\n<p>\"你再看看。\"把头的声音压在牙缝里，是冲我说的，也是冲他自己说的，\"看他的手。\"<\/p>\n<p>问灯的老头坐在灯影里，手搭在膝盖上。左手的小指——<\/p>\n<p>齐根少半截。<\/p>\n<p>缺的是小指。废品站敲门人缺的那半截，鱼哥在焚房夜里验过的那半截。把头的肩膀垮下去半寸，又硬起来。这世上的账，比我们记的还乱：掐烟的做派能学，烟嘴能换，可手上的缺，是做不了假的——也可能，是故意的。<\/p>\n<p>问灯的老头像是背后长了眼睛，他不看把头，只淡淡说了一句：\"耳朵的事儿，等灯点完了再说。今晚论灯，不论人。\"<\/p>\n<p>瘦高个冷笑：\"论灯？好啊。那就当着灯的面说清楚——五盏灯，你们打算怎么点？油呢？\"<\/p>\n<p>草帽人从怀里把那口黑坛取出来，搁在灯底下。黑蜡封口，还是那个指印。<\/p>\n<p>\"油在这儿。\"<\/p>\n<p>他把坛子往灯底下一推，又从怀里取出一个布卷，展开——是那只珍珠罐。罐身上落了些灰，他用袖子擦了，把罐口对着北墙的灯。<\/p>\n<p>\"罐是眼。\"他说，\"灯点起来，是罐替灯看着道。\"<\/p>\n<p>罐口迎着灯光，那一圈磨残的鱼尾纹，一深一浅，在光里清清楚楚。<\/p>\n<p>\"芯呢？\"<\/p>\n<p>云峰把灯芯从贴身处取出来。白棉捻的，三个月了，一直贴着胸口，带着体温。<\/p>\n<p>\"芯在这儿。\"草帽人替我答了。<\/p>\n<p>\"锅呢？\"<\/p>\n<p>\"锅在这儿。\"我把背上的锅卸下来，抱在怀里。锅身温的——一路进山，它贴着我的背，早就不是石头的凉了。<\/p>\n<p>\"还差领路的锅。\"瘦高个说，\"它初一夜里就进山了，怎么没见着？\"<\/p>\n<p>\"它不用见。\"缝口那边，有人接了话。<\/p>\n<p>众人回头。酒糟鼻不知什么时候到了缝口边上，靠着石壁站着，喘匀了气才往里走。他今晚把那件发白的旧褂子洗过了，走得不快，一步一步，像是踩着自己三十年的脚印。<\/p>\n<p>\"它领路，\"他说，\"它不在道上，就在道口。等你们四盏灯一亮，它自己会进来。\"<\/p>\n<p>\"你是谁？\"瘦高个盯着他。<\/p>\n<p>\"三十年前，\"酒糟鼻说，\"看完全场的那个人。\"<\/p>\n<p>他往里走，走到灯线边上，从怀里掏出那个布包，一层层打开，把那枚锅钉举起来，给满屋子的人看了一圈。<\/p>\n<p>\"大锅劈了，钉我抠走一枚。\"他说，\"今儿我把它带回家了。谁有异议？\"<\/p>\n<p>没人接话。瘦高个盯着那枚钉，喉结动了动，到底没言语。<\/p>\n<p>酒糟鼻把钉搁在西南空位边上，冲空位拱了拱手，退到壁根底下，靠着石头站了，像是打定主意就看这一场。<\/p>\n<p>瘦高个还想说什么，问灯的老头抬了抬手。<\/p>\n<p>\"点灯。\"他说，\"天交二更了。头一盏，请掌灯的。\"<\/p>\n<p>草帽人开坛。黑蜡用指甲一圈一圈剥下来，坛口一开，一股说不出的味散出来——不香，不冲，是一种沉底的陈味，像老庙里几百年没换过的灯。他把芯安进北墙那盏灯里，舀了一勺油，缓缓地浇。<\/p>\n<p>\"借你的名分。\"他对我说，\"灯芯是您的，油是山里的，灯——\"他把火折子递到我手边，\"你来点。\"<\/p>\n<p>火苗凑近灯芯的那一瞬，我的手稳得连自己都意外。<\/p>\n<p>灯亮了。<\/p>\n<p>北墙那盏白纸灯笼从里头透出光来，稳稳的，火头朝上。四方的石位里，三盏还没点的灯，灯纸上映着它的光，微微地晃。<\/p>\n<p>灯亮起来的同一瞬，灭字一路里那个背着铜锁的高个，转过身，朝缝口外的黑暗里走了。<\/p>\n<p>走得安安静静。他不快，也不回头，就像散了一场夜戏，戏散了，该回家的人往家走。<\/p>\n<p>瘦高个一把没拉住，喝了一声，那人像没听见。矮个追出两步，站在灯线上，进也不是，退也不是——灯线拦着他，他不敢过，他兄弟过了，头也不回。<\/p>\n<p>\"高个儿！\"瘦高个又喝了一声。<\/p>\n<p>黑暗里传来高个的声音，平平的，听不出情绪：\"三哥，锁用不上了。我先走一步。\"<\/p>\n<p>然后什么声都没了。<\/p>\n<p>石室里静得可怕。矮个退回灯线里头，蹲在墙根，抱着胳膊，脸埋在影子里。瘦高个站在原地，手还保持着刚才抓人没抓着的姿势，半天才放下来。<\/p>\n<p>\"看见没有。\"问灯的老头在灯影里坐着，声音不高，\"灯亮一盏，走一个。\"<\/p>\n<p>我把这话在心里过了一遍——走，不是跑，不是溜。是走了。高个走的时候，脸上没有一点不舍，倒像……像终于轮到他了。<\/p>\n<p>\"他早知道？\"我低声问把头。<\/p>\n<p>\"买锁的人，\"把头看着那盘搁在缝口的麻绳和铜锁，\"锁的不是别人。\"<\/p>\n<p>我顺着他的话想下去，越想越冷——高个儿买锁那天起，锁的兴许就是自己的退路，或者说，是自己的进路。灭字一路的人，也不是铁板一块。<\/p>\n<p>\"把头，\"我又压低声音，\"问灯那老头的小指——\"<\/p>\n<p>\"别在这儿说。\"把头打断我，声音低得几乎听不见，\"灯底下不点人。他缺的那半截，鱼哥那晚验过的。这会儿不论人，论灯——灯点完，这笔账跑不了。\"<\/p>\n<p>\"第二盏。\"老头说，\"掌灯的，请。\"<\/p>", "plain": "脚步声到了缝口，停住。 天色一寸一寸暗下去。我们仨把干粮分了，就着水咽，谁也没说话。鱼哥把黑豆喂给不了谁，就喂给自己，一颗一颗嚼得山响，被把头瞪了一眼，才放轻了。 我把灯芯又摸了一遍。三个月了，它在我贴身的口袋里，捻得紧，白棉的，头上一撮绒。做信人说它是干的——今夜过后，它还干不干得成，就看这一晚。 草帽人抬手，把北墙那盏灯笼点着了。火苗一起来，缝口那片黑就让开了一条线——灯线拦在道中间，笔直的一道亮。 \"灯起了。\"草帽人说，\"进这道缝的，把火灭了再走。\" 黑里头静了片刻。能听出来外头在交换眼色——谁也不肯头一个灭。 先说话的是瘦高个，声音又冷又硬：\"我们灭字一路，从来是掌火的。你让我们灭自己的火？\" \"我这道缝里，只有一盏灯。\"草帽人说，\"灯底下的都是客。要动手，出了这道缝随便。进了灯的界，谁也别伸手。\" \"规矩倒是学得像。\"瘦高个冷笑，\"跟谁学的？山里那位？\" \"跟山学的。\"草帽人说，\"你要嫌这规矩别扭，可以把灯摘了走。灯一摘，界就没了——界没了，你那两个兄弟，可就护不住你了。\" 黑里头又静了一阵。然后是\"嚓\"的一声——火折子熄了。三个人影一个跟一个进了石室：瘦高个在前，矮个在后，中间那个高个，背上横着那捆新麻绳，绳头上缠着铜锁。 高个进门前，把绳和锁在缝口外头的石头上放下了。就放在那盘新麻绳上，摆得整整齐齐，像交械。 瘦高个一进来，眼睛先扫四方的灯，再扫西南空位，最后落在我背上的锅上。 \"信不齐。\"他说，\"五件信，你手里攥着三件半，罐在掌灯的身上，领路的锅到现在没露面。拿半套信点五盏灯——点的是假灯。\" \"信齐不齐，\"草帽人不紧不慢，\"灯说了算。\" \"灯是人点的。\"瘦高个说，\"人会说瞎话。\" \"所以今晚有问灯的。\"草帽人朝缝口偏了偏头，\"你吵不过他。\" 缝口的光线又暗了一层。第三个人进来的时候，石室里连喘气声都轻了。 还是那件灰褂子，还是侧着身，还是那张看不全的脸。他进门先没看人，抬头把北墙的灯笼、四方的石灯挨个看了一遍，看完了，才转过身来。 把头站在我边上，我觉出他的手在抖。 问灯的老头走到灯线里头，站定。今夜他站的位置，比扣锅台那晚正——月光从缝口斜进来，扫过他的侧脸，扫过下巴，扫过—— 左耳。 完好的。耳廓圆圆的，一点缺口都没有。 把头的手攥住了我的胳膊，攥得生疼。我在他耳朵边上几乎听见了他的牙关在响——沟里那位守灯的，左耳缺着；五女山问灯的，掐烟的姿势一个模子；可眼前这位，耳朵是全的。 不是一个人。从来就不是一个人。 我脑子里嗡的一声。那掐到烫手的烟嘴、夜里的膝印、\"再等等\"——那些我认过账的做派，全对到了另一个人头上。可把头三十七年的记性，会认错烟嘴吗？ \"你再看看。\"把头的声音压在牙缝里，是冲我说的，也是冲他自己说的，\"看他的手。\" 问灯的老头坐在灯影里，手搭在膝盖上。左手的小指—— 齐根少半截。 缺的是小指。废品站敲门人缺的那半截，鱼哥在焚房夜里验过的那半截。把头的肩膀垮下去半寸，又硬起来。这世上的账，比我们记的还乱：掐烟的做派能学，烟嘴能换，可手上的缺，是做不了假的——也可能，是故意的。 问灯的老头像是背后长了眼睛，他不看把头，只淡淡说了一句：\"耳朵的事儿，等灯点完了再说。今晚论灯，不论人。\" 瘦高个冷笑：\"论灯？好啊。那就当着灯的面说清楚——五盏灯，你们打算怎么点？油呢？\" 草帽人从怀里把那口黑坛取出来，搁在灯底下。黑蜡封口，还是那个指印。 \"油在这儿。\" 他把坛子往灯底下一推，又从怀里取出一个布卷，展开——是那只珍珠罐。罐身上落了些灰，他用袖子擦了，把罐口对着北墙的灯。 \"罐是眼。\"他说，\"灯点起来，是罐替灯看着道。\" 罐口迎着灯光，那一圈磨残的鱼尾纹，一深一浅，在光里清清楚楚。 \"芯呢？\" 云峰把灯芯从贴身处取出来。白棉捻的，三个月了，一直贴着胸口，带着体温。 \"芯在这儿。\"草帽人替我答了。 \"锅呢？\" \"锅在这儿。\"我把背上的锅卸下来，抱在怀里。锅身温的——一路进山，它贴着我的背，早就不是石头的凉了。 \"还差领路的锅。\"瘦高个说，\"它初一夜里就进山了，怎么没见着？\" \"它不用见。\"缝口那边，有人接了话。 众人回头。酒糟鼻不知什么时候到了缝口边上，靠着石壁站着，喘匀了气才往里走。他今晚把那件发白的旧褂子洗过了，走得不快，一步一步，像是踩着自己三十年的脚印。 \"它领路，\"他说，\"它不在道上，就在道口。等你们四盏灯一亮，它自己会进来。\" \"你是谁？\"瘦高个盯着他。 \"三十年前，\"酒糟鼻说，\"看完全场的那个人。\" 他往里走，走到灯线边上，从怀里掏出那个布包，一层层打开，把那枚锅钉举起来，给满屋子的人看了一圈。 \"大锅劈了，钉我抠走一枚。\"他说，\"今儿我把它带回家了。谁有异议？\" 没人接话。瘦高个盯着那枚钉，喉结动了动，到底没言语。 酒糟鼻把钉搁在西南空位边上，冲空位拱了拱手，退到壁根底下，靠着石头站了，像是打定主意就看这一场。 瘦高个还想说什么，问灯的老头抬了抬手。 \"点灯。\"他说，\"天交二更了。头一盏，请掌灯的。\" 草帽人开坛。黑蜡用指甲一圈一圈剥下来，坛口一开，一股说不出的味散出来——不香，不冲，是一种沉底的陈味，像老庙里几百年没换过的灯。他把芯安进北墙那盏灯里，舀了一勺油，缓缓地浇。 \"借你的名分。\"他对我说，\"灯芯是您的，油是山里的，灯——\"他把火折子递到我手边，\"你来点。\" 火苗凑近灯芯的那一瞬，我的手稳得连自己都意外。 灯亮了。 北墙那盏白纸灯笼从里头透出光来，稳稳的，火头朝上。四方的石位里，三盏还没点的灯，灯纸上映着它的光，微微地晃。 灯亮起来的同一瞬，灭字一路里那个背着铜锁的高个，转过身，朝缝口外的黑暗里走了。 走得安安静静。他不快，也不回头，就像散了一场夜戏，戏散了，该回家的人往家走。 瘦高个一把没拉住，喝了一声，那人像没听见。矮个追出两步，站在灯线上，进也不是，退也不是——灯线拦着他，他不敢过，他兄弟过了，头也不回。 \"高个儿！\"瘦高个又喝了一声。 黑暗里传来高个的声音，平平的，听不出情绪：\"三哥，锁用不上了。我先走一步。\" 然后什么声都没了。 石室里静得可怕。矮个退回灯线里头，蹲在墙根，抱着胳膊，脸埋在影子里。瘦高个站在原地，手还保持着刚才抓人没抓着的姿势，半天才放下来。 \"看见没有。\"问灯的老头在灯影里坐着，声音不高，\"灯亮一盏，走一个。\" 我把这话在心里过了一遍——走，不是跑，不是溜。是走了。高个走的时候，脸上没有一点不舍，倒像……像终于轮到他了。 \"他早知道？\"我低声问把头。 \"买锁的人，\"把头看着那盘搁在缝口的麻绳和铜锁，\"锁的不是别人。\" 我顺着他的话想下去，越想越冷——高个儿买锁那天起，锁的兴许就是自己的退路，或者说，是自己的进路。灭字一路的人，也不是铁板一块。 \"把头，\"我又压低声音，\"问灯那老头的小指——\" \"别在这儿说。\"把头打断我，声音低得几乎听不见，\"灯底下不点人。他缺的那半截，鱼哥那晚验过的。这会儿不论人，论灯——灯点完，这笔账跑不了。\" \"第二盏。\"老头说，\"掌灯的，请。\""}, {"id": "A5-100", "arc": "A5", "num": 100, "title": "归位", "md": "第二盏灯，点在东位。\n\n草帽人舀油的时候，多看了我一眼：\"这一盏，本该问罐。罐在我身上，名分在您那儿——您点。\"\n\n我又点了一盏。灯亮起来的时候，缝口外头，隐隐约约传来一声响。\n\n不是脚步，不是风。像一口锅，在很远的山道上，磕了一下石头。\n\n酒糟鼻在缝口边上站直了：\"来了。\"\n\n没人说话。那声音隔一阵响一声，一声比一声近，不急不缓，磕磕绊绊地顺着山道下来——一口锅在滚，滚一段，停一段，像认一步，走一步。\n\n\"它不是叫人押着走的。\"酒糟鼻盯着缝口，声音发紧，\"三十年前它领我们进沟，走的就是这个动静。走走停停，它不是累——它是回头看。看后头有没有人跟上。\"\n\n\"这回谁跟上它了？\"鱼哥问。\n\n\"没人。\"酒糟鼻说，\"它自己个儿来赶灯会的。\"\n\n话音没落，缝口的光暗了一暗。\n\n第三盏灯点在西位。灯亮的那一瞬，石室里的石头地微微地颤了一下。\n\n灯亮，人走。这一回走的是抬灯来的一老一少里的那个老的。他把扁担往墙根一靠，冲草帽人拱了拱手，什么也没说，顺着灯线外沿，一步一步走出缝口。少的留在原地，守着灯架，眼圈红了，可没吭声。\n\n\"他们也知道？\"鱼哥的声音都变了。\n\n\"来的没有一个不知道的。\"酒糟鼻靠着壁根说，\"不知道的，进不来这道缝。\"\n\n石室里的人，眼看着一点一点少。剩下的，不是走不了的，就是有账没清的。\n\n第五声磕响停在缝口外头。\n\n一口锅从黑暗里滚了进来。就是它——沟口那口倒吊的、滴黑泥的、会领路的锅。它滚到石室当间，自己一翻，稳稳地扣住，不动了。锅身上糊着半干的黑泥，泥缝里还夹着枯叶。\n\n全场的人都盯着它。它扣在那儿，锅沿冲着西南空位，像一头认了槽的牲口。\n\n\"领路的到了。\"酒糟鼻说，\"四盏灯了。\"\n\n瘦高个的脸在灯影里一阵青一阵白。他们一路三个人，这会儿剩两个，铜锁还捆在麻绳上，没用上。他忽然开口，声音哑了：\"问灯的。你给我句准话——今儿这灯点完，我们那一路的账，怎么算？\"\n\n问灯的老头没睁眼：\"灯亮到第几盏，账就算到第几笔。你急什么，第五盏还没影呢。\"\n\n\"第五盏要什么？\"\n\n\"要人。\"老头睁开了眼，看向西南空位，\"灯要锅，锅要位，位要人。\"\n\n草帽人转向我，把黑坛捧起来，双手递到我跟前。\n\n\"背锅的。\"他说，\"西南的位，本该消奴部自己的人来扣。可他们一门绝了，名分落在你身上——锅你来扣，第五盏灯，你来点。\"\n\n\"灯亮一盏，走一个。\"我把话问出来，\"第五盏亮了，走的是谁？\"\n\n石室里静了。问灯的老头看着灯，草帽人看着坛，酒糟鼻看着那口领路的锅。半天，酒糟鼻笑了一声，还是那个比哭难看的笑：\n\n\"三十年前我走到缝口，也问了这一句。没人答我。今儿我替他们答——走了的，是你身后的名字。消奴部满门，三十年前就该走的那一盏。你替他们点，他们替你走。\"\n\n我捧着锅，往西南空位走。\n\n三步。就三步。可我走出了半辈子的长。\n\n第一步落下去，五盏灯的影子在我身上让开了一条道。第二步，我听见把头在我身后极轻地说了一句什么，声音叫灯影吃了，没听清，可我知道是句吉利话。第三步，锅忽然一轻。\n\n真轻了。一路上压得我直不起腰的那口锅，到了空位跟前，轻得像捧着一兜水。\n\n锅从怀里下来，翻过来，锅口朝下，锅底的鱼尾纹冲着石位——扣下去的那一瞬，严丝合缝，一声轻响，像一枚钉子进了卯眼。\n\n酒糟鼻那枚锅钉还搁在空位边上。他走过来，把钉拾起来，揳进锅耳下的旧钉眼里。松了三十年的钉，进门就咬住了。\n\n\"回家了。\"他说。就三个字，说完把脸别过去，肩膀一抽一抽的。\n\n石室里所有的灯影，齐齐地晃了一下。\n\n第四盏灯不知什么时候自己亮了——北位。没人点它，它就那么亮了，火头朝上，稳稳的。\n\n灯亮了，又走了一个。守灯架的那个年轻人，冲四下作了个揖，跟着那口领路锅滚进来时留下的泥印，一步一步退出了缝口。这一回，谁也没拦，也没人惊讶。\n\n石室里剩下的人不多了：我，把头，鱼哥，草帽人，问灯的老头，做信人，瘦高个和矮个，还有壁根下的酒糟鼻。\n\n\"做信的来了。\"问灯的老头忽然说。\n\n我顺着他的目光看过去——灯影最暗的那个角上，站着一个人。旧褂子，匠人的手，不知道什么时候进来的，脚步声一点没听见。\n\n做信人走到石室当间，蹲下，先验那口领路锅的底纹，再摸西南空位上我这口锅的锅肚，最后冲我伸出手。我把契取出来，他捏着契角那道压模鱼尾，对着灯照了照。\n\n\"四件真。\"他说，\"罐我验过。信——齐了。\"\n\n\"验信就验信。\"问灯的老头在灯影里开口，\"做信的，你验了信，还欠我们一笔账没对。台心那道划痕，你认下了。可你那一路，到底是不是第四路——今儿灯底下，说不清楚，就别怪灯记你一笔。\"\n\n做信人把契还到我手里，站起身，掸了掸膝盖上的土。\n\n\"做信、点灯、问灯，一家分的三股。\"他说，\"分家的时候立过誓：谁也不许碰第四样东西。\"\n\n\"哪第四样？\"\n\n\"骨城的门。\"做信人说，\"三股都守着它。守到今儿，灯满了，六位齐了——它自己来叩，就不关我们的事了。\"\n\n\"那第五件呢？\"草帽人问，\"五部五件信，领路的锅是第五件。它归位了？\"\n\n\"归了。\"做信人指了指当间那口锅，\"它扣在道口，就是它的位。\"\n\n\"那罐呢？\"草帽人把珍珠罐捧出来，\"罐是眼，眼放在哪儿？\"\n\n\"你捧着。\"做信人说，\"灯亮到第五盏，你把它举起来，让眼看着门。\"\n\n问灯的老头站起来，掸了掸褂子上的灰。\n\n\"第五盏。\"他说，\"接灯的，上前。\"\n\n我看了把头一眼。把头站在灯线边上，脸色比石壁还白，可他冲我点了一下头——点得很慢，很沉。\n\n草帽人开坛，舀了满满一勺油。坛底剩下的，一指深——马渡霜说这是\"一盏灯的油\"，果然一分不多，一分不少。\n\n我把芯安进西南空位边那盏最后剩下的灯里——灯纸是白的，芯是白的，油是黑的。\n\n火折子凑上去之前，把头走过来，站在我边上。\n\n\"小子。\"他说。\n\n我等他说后头。他没说后头，就拍了拍我的肩膀，手劲不大，压得沉。跟当年在老屋灶膛边上、他头一回跟我说\"这活儿脏\"的那一晚，一个手劲。\n\n火折子凑上去。\n\n灯亮了。\n\n五盏灯，北、东、西、南、中，一齐亮着。火头齐齐朝上，一盏都不斜。灯亮起来的那一瞬，我听见了锁眼石那边——\n\n叩。\n\n一下。\n\n顿了顿，又两下。\n\n三声叩响，从锁眼石后头、从那道封了不知多少年的门后头，闷闷地传过来，敲在每个人的心口上。\n\n瘦高个头一个动。他没往外跑，反倒一步一步挪到灯线边上，冲锁眼石的方向跪下了，跪得笔直。矮个跟着跪了。酒糟鼻没跪，他把帽子摘了，攥在手里，站着。\n\n把头也没跪。他走到我边上，声音低得只有我们俩能听见：\n\n\"当年撬缝的人说，里头有灯。我当是骗人的鬼话。\"\n\n\"现在呢？\"\n\n\"现在它叩门了。\"把头说，\"鬼话不叩门。\"\n\n做信人站起来，朝着锁眼石，长长地作了一个揖。\n\n\"六位满了。\"他说，\"里头的灯，等这一叩，等了两千年。\"\n\n问灯的老头坐在灯影里没动，只把烟袋摸出来，装了一锅，点着，抽了一口，掐灭，搁在石头上。烫手了才掐的。\n\n\"都听着。\"他说，\"门要开的时候，别问为什么开。跟你当年进这道山一个理——\"\n\n他没说完。灯影里，鱼哥忽然出声，声音发飘，不像他自己：\n\n\"开门的来了。\"\n\n锁眼石的缝隙里，透出一线光。\n\n那光是暖的，黄的，跟外头五盏灯都不一样——照在人身上，像三十多年前那晚，从雨里淌出来的那道光。", "words": 2817, "html": "<p>第二盏灯，点在东位。<\/p>\n<p>草帽人舀油的时候，多看了我一眼：\"这一盏，本该问罐。罐在我身上，名分在您那儿——您点。\"<\/p>\n<p>我又点了一盏。灯亮起来的时候，缝口外头，隐隐约约传来一声响。<\/p>\n<p>不是脚步，不是风。像一口锅，在很远的山道上，磕了一下石头。<\/p>\n<p>酒糟鼻在缝口边上站直了：\"来了。\"<\/p>\n<p>没人说话。那声音隔一阵响一声，一声比一声近，不急不缓，磕磕绊绊地顺着山道下来——一口锅在滚，滚一段，停一段，像认一步，走一步。<\/p>\n<p>\"它不是叫人押着走的。\"酒糟鼻盯着缝口，声音发紧，\"三十年前它领我们进沟，走的就是这个动静。走走停停，它不是累——它是回头看。看后头有没有人跟上。\"<\/p>\n<p>\"这回谁跟上它了？\"鱼哥问。<\/p>\n<p>\"没人。\"酒糟鼻说，\"它自己个儿来赶灯会的。\"<\/p>\n<p>话音没落，缝口的光暗了一暗。<\/p>\n<p>第三盏灯点在西位。灯亮的那一瞬，石室里的石头地微微地颤了一下。<\/p>\n<p>灯亮，人走。这一回走的是抬灯来的一老一少里的那个老的。他把扁担往墙根一靠，冲草帽人拱了拱手，什么也没说，顺着灯线外沿，一步一步走出缝口。少的留在原地，守着灯架，眼圈红了，可没吭声。<\/p>\n<p>\"他们也知道？\"鱼哥的声音都变了。<\/p>\n<p>\"来的没有一个不知道的。\"酒糟鼻靠着壁根说，\"不知道的，进不来这道缝。\"<\/p>\n<p>石室里的人，眼看着一点一点少。剩下的，不是走不了的，就是有账没清的。<\/p>\n<p>第五声磕响停在缝口外头。<\/p>\n<p>一口锅从黑暗里滚了进来。就是它——沟口那口倒吊的、滴黑泥的、会领路的锅。它滚到石室当间，自己一翻，稳稳地扣住，不动了。锅身上糊着半干的黑泥，泥缝里还夹着枯叶。<\/p>\n<p>全场的人都盯着它。它扣在那儿，锅沿冲着西南空位，像一头认了槽的牲口。<\/p>\n<p>\"领路的到了。\"酒糟鼻说，\"四盏灯了。\"<\/p>\n<p>瘦高个的脸在灯影里一阵青一阵白。他们一路三个人，这会儿剩两个，铜锁还捆在麻绳上，没用上。他忽然开口，声音哑了：\"问灯的。你给我句准话——今儿这灯点完，我们那一路的账，怎么算？\"<\/p>\n<p>问灯的老头没睁眼：\"灯亮到第几盏，账就算到第几笔。你急什么，第五盏还没影呢。\"<\/p>\n<p>\"第五盏要什么？\"<\/p>\n<p>\"要人。\"老头睁开了眼，看向西南空位，\"灯要锅，锅要位，位要人。\"<\/p>\n<p>草帽人转向我，把黑坛捧起来，双手递到我跟前。<\/p>\n<p>\"背锅的。\"他说，\"西南的位，本该消奴部自己的人来扣。可他们一门绝了，名分落在你身上——锅你来扣，第五盏灯，你来点。\"<\/p>\n<p>\"灯亮一盏，走一个。\"我把话问出来，\"第五盏亮了，走的是谁？\"<\/p>\n<p>石室里静了。问灯的老头看着灯，草帽人看着坛，酒糟鼻看着那口领路的锅。半天，酒糟鼻笑了一声，还是那个比哭难看的笑：<\/p>\n<p>\"三十年前我走到缝口，也问了这一句。没人答我。今儿我替他们答——走了的，是你身后的名字。消奴部满门，三十年前就该走的那一盏。你替他们点，他们替你走。\"<\/p>\n<p>我捧着锅，往西南空位走。<\/p>\n<p>三步。就三步。可我走出了半辈子的长。<\/p>\n<p>第一步落下去，五盏灯的影子在我身上让开了一条道。第二步，我听见把头在我身后极轻地说了一句什么，声音叫灯影吃了，没听清，可我知道是句吉利话。第三步，锅忽然一轻。<\/p>\n<p>真轻了。一路上压得我直不起腰的那口锅，到了空位跟前，轻得像捧着一兜水。<\/p>\n<p>锅从怀里下来，翻过来，锅口朝下，锅底的鱼尾纹冲着石位——扣下去的那一瞬，严丝合缝，一声轻响，像一枚钉子进了卯眼。<\/p>\n<p>酒糟鼻那枚锅钉还搁在空位边上。他走过来，把钉拾起来，揳进锅耳下的旧钉眼里。松了三十年的钉，进门就咬住了。<\/p>\n<p>\"回家了。\"他说。就三个字，说完把脸别过去，肩膀一抽一抽的。<\/p>\n<p>石室里所有的灯影，齐齐地晃了一下。<\/p>\n<p>第四盏灯不知什么时候自己亮了——北位。没人点它，它就那么亮了，火头朝上，稳稳的。<\/p>\n<p>灯亮了，又走了一个。守灯架的那个年轻人，冲四下作了个揖，跟着那口领路锅滚进来时留下的泥印，一步一步退出了缝口。这一回，谁也没拦，也没人惊讶。<\/p>\n<p>石室里剩下的人不多了：我，把头，鱼哥，草帽人，问灯的老头，做信人，瘦高个和矮个，还有壁根下的酒糟鼻。<\/p>\n<p>\"做信的来了。\"问灯的老头忽然说。<\/p>\n<p>我顺着他的目光看过去——灯影最暗的那个角上，站着一个人。旧褂子，匠人的手，不知道什么时候进来的，脚步声一点没听见。<\/p>\n<p>做信人走到石室当间，蹲下，先验那口领路锅的底纹，再摸西南空位上我这口锅的锅肚，最后冲我伸出手。我把契取出来，他捏着契角那道压模鱼尾，对着灯照了照。<\/p>\n<p>\"四件真。\"他说，\"罐我验过。信——齐了。\"<\/p>\n<p>\"验信就验信。\"问灯的老头在灯影里开口，\"做信的，你验了信，还欠我们一笔账没对。台心那道划痕，你认下了。可你那一路，到底是不是第四路——今儿灯底下，说不清楚，就别怪灯记你一笔。\"<\/p>\n<p>做信人把契还到我手里，站起身，掸了掸膝盖上的土。<\/p>\n<p>\"做信、点灯、问灯，一家分的三股。\"他说，\"分家的时候立过誓：谁也不许碰第四样东西。\"<\/p>\n<p>\"哪第四样？\"<\/p>\n<p>\"骨城的门。\"做信人说，\"三股都守着它。守到今儿，灯满了，六位齐了——它自己来叩，就不关我们的事了。\"<\/p>\n<p>\"那第五件呢？\"草帽人问，\"五部五件信，领路的锅是第五件。它归位了？\"<\/p>\n<p>\"归了。\"做信人指了指当间那口锅，\"它扣在道口，就是它的位。\"<\/p>\n<p>\"那罐呢？\"草帽人把珍珠罐捧出来，\"罐是眼，眼放在哪儿？\"<\/p>\n<p>\"你捧着。\"做信人说，\"灯亮到第五盏，你把它举起来，让眼看着门。\"<\/p>\n<p>问灯的老头站起来，掸了掸褂子上的灰。<\/p>\n<p>\"第五盏。\"他说，\"接灯的，上前。\"<\/p>\n<p>我看了把头一眼。把头站在灯线边上，脸色比石壁还白，可他冲我点了一下头——点得很慢，很沉。<\/p>\n<p>草帽人开坛，舀了满满一勺油。坛底剩下的，一指深——马渡霜说这是\"一盏灯的油\"，果然一分不多，一分不少。<\/p>\n<p>我把芯安进西南空位边那盏最后剩下的灯里——灯纸是白的，芯是白的，油是黑的。<\/p>\n<p>火折子凑上去之前，把头走过来，站在我边上。<\/p>\n<p>\"小子。\"他说。<\/p>\n<p>我等他说后头。他没说后头，就拍了拍我的肩膀，手劲不大，压得沉。跟当年在老屋灶膛边上、他头一回跟我说\"这活儿脏\"的那一晚，一个手劲。<\/p>\n<p>火折子凑上去。<\/p>\n<p>灯亮了。<\/p>\n<p>五盏灯，北、东、西、南、中，一齐亮着。火头齐齐朝上，一盏都不斜。灯亮起来的那一瞬，我听见了锁眼石那边——<\/p>\n<p>叩。<\/p>\n<p>一下。<\/p>\n<p>顿了顿，又两下。<\/p>\n<p>三声叩响，从锁眼石后头、从那道封了不知多少年的门后头，闷闷地传过来，敲在每个人的心口上。<\/p>\n<p>瘦高个头一个动。他没往外跑，反倒一步一步挪到灯线边上，冲锁眼石的方向跪下了，跪得笔直。矮个跟着跪了。酒糟鼻没跪，他把帽子摘了，攥在手里，站着。<\/p>\n<p>把头也没跪。他走到我边上，声音低得只有我们俩能听见：<\/p>\n<p>\"当年撬缝的人说，里头有灯。我当是骗人的鬼话。\"<\/p>\n<p>\"现在呢？\"<\/p>\n<p>\"现在它叩门了。\"把头说，\"鬼话不叩门。\"<\/p>\n<p>做信人站起来，朝着锁眼石，长长地作了一个揖。<\/p>\n<p>\"六位满了。\"他说，\"里头的灯，等这一叩，等了两千年。\"<\/p>\n<p>问灯的老头坐在灯影里没动，只把烟袋摸出来，装了一锅，点着，抽了一口，掐灭，搁在石头上。烫手了才掐的。<\/p>\n<p>\"都听着。\"他说，\"门要开的时候，别问为什么开。跟你当年进这道山一个理——\"<\/p>\n<p>他没说完。灯影里，鱼哥忽然出声，声音发飘，不像他自己：<\/p>\n<p>\"开门的来了。\"<\/p>\n<p>锁眼石的缝隙里，透出一线光。<\/p>\n<p>那光是暖的，黄的，跟外头五盏灯都不一样——照在人身上，像三十多年前那晚，从雨里淌出来的那道光。<\/p>", "plain": "第二盏灯，点在东位。 草帽人舀油的时候，多看了我一眼：\"这一盏，本该问罐。罐在我身上，名分在您那儿——您点。\" 我又点了一盏。灯亮起来的时候，缝口外头，隐隐约约传来一声响。 不是脚步，不是风。像一口锅，在很远的山道上，磕了一下石头。 酒糟鼻在缝口边上站直了：\"来了。\" 没人说话。那声音隔一阵响一声，一声比一声近，不急不缓，磕磕绊绊地顺着山道下来——一口锅在滚，滚一段，停一段，像认一步，走一步。 \"它不是叫人押着走的。\"酒糟鼻盯着缝口，声音发紧，\"三十年前它领我们进沟，走的就是这个动静。走走停停，它不是累——它是回头看。看后头有没有人跟上。\" \"这回谁跟上它了？\"鱼哥问。 \"没人。\"酒糟鼻说，\"它自己个儿来赶灯会的。\" 话音没落，缝口的光暗了一暗。 第三盏灯点在西位。灯亮的那一瞬，石室里的石头地微微地颤了一下。 灯亮，人走。这一回走的是抬灯来的一老一少里的那个老的。他把扁担往墙根一靠，冲草帽人拱了拱手，什么也没说，顺着灯线外沿，一步一步走出缝口。少的留在原地，守着灯架，眼圈红了，可没吭声。 \"他们也知道？\"鱼哥的声音都变了。 \"来的没有一个不知道的。\"酒糟鼻靠着壁根说，\"不知道的，进不来这道缝。\" 石室里的人，眼看着一点一点少。剩下的，不是走不了的，就是有账没清的。 第五声磕响停在缝口外头。 一口锅从黑暗里滚了进来。就是它——沟口那口倒吊的、滴黑泥的、会领路的锅。它滚到石室当间，自己一翻，稳稳地扣住，不动了。锅身上糊着半干的黑泥，泥缝里还夹着枯叶。 全场的人都盯着它。它扣在那儿，锅沿冲着西南空位，像一头认了槽的牲口。 \"领路的到了。\"酒糟鼻说，\"四盏灯了。\" 瘦高个的脸在灯影里一阵青一阵白。他们一路三个人，这会儿剩两个，铜锁还捆在麻绳上，没用上。他忽然开口，声音哑了：\"问灯的。你给我句准话——今儿这灯点完，我们那一路的账，怎么算？\" 问灯的老头没睁眼：\"灯亮到第几盏，账就算到第几笔。你急什么，第五盏还没影呢。\" \"第五盏要什么？\" \"要人。\"老头睁开了眼，看向西南空位，\"灯要锅，锅要位，位要人。\" 草帽人转向我，把黑坛捧起来，双手递到我跟前。 \"背锅的。\"他说，\"西南的位，本该消奴部自己的人来扣。可他们一门绝了，名分落在你身上——锅你来扣，第五盏灯，你来点。\" \"灯亮一盏，走一个。\"我把话问出来，\"第五盏亮了，走的是谁？\" 石室里静了。问灯的老头看着灯，草帽人看着坛，酒糟鼻看着那口领路的锅。半天，酒糟鼻笑了一声，还是那个比哭难看的笑： \"三十年前我走到缝口，也问了这一句。没人答我。今儿我替他们答——走了的，是你身后的名字。消奴部满门，三十年前就该走的那一盏。你替他们点，他们替你走。\" 我捧着锅，往西南空位走。 三步。就三步。可我走出了半辈子的长。 第一步落下去，五盏灯的影子在我身上让开了一条道。第二步，我听见把头在我身后极轻地说了一句什么，声音叫灯影吃了，没听清，可我知道是句吉利话。第三步，锅忽然一轻。 真轻了。一路上压得我直不起腰的那口锅，到了空位跟前，轻得像捧着一兜水。 锅从怀里下来，翻过来，锅口朝下，锅底的鱼尾纹冲着石位——扣下去的那一瞬，严丝合缝，一声轻响，像一枚钉子进了卯眼。 酒糟鼻那枚锅钉还搁在空位边上。他走过来，把钉拾起来，揳进锅耳下的旧钉眼里。松了三十年的钉，进门就咬住了。 \"回家了。\"他说。就三个字，说完把脸别过去，肩膀一抽一抽的。 石室里所有的灯影，齐齐地晃了一下。 第四盏灯不知什么时候自己亮了——北位。没人点它，它就那么亮了，火头朝上，稳稳的。 灯亮了，又走了一个。守灯架的那个年轻人，冲四下作了个揖，跟着那口领路锅滚进来时留下的泥印，一步一步退出了缝口。这一回，谁也没拦，也没人惊讶。 石室里剩下的人不多了：我，把头，鱼哥，草帽人，问灯的老头，做信人，瘦高个和矮个，还有壁根下的酒糟鼻。 \"做信的来了。\"问灯的老头忽然说。 我顺着他的目光看过去——灯影最暗的那个角上，站着一个人。旧褂子，匠人的手，不知道什么时候进来的，脚步声一点没听见。 做信人走到石室当间，蹲下，先验那口领路锅的底纹，再摸西南空位上我这口锅的锅肚，最后冲我伸出手。我把契取出来，他捏着契角那道压模鱼尾，对着灯照了照。 \"四件真。\"他说，\"罐我验过。信——齐了。\" \"验信就验信。\"问灯的老头在灯影里开口，\"做信的，你验了信，还欠我们一笔账没对。台心那道划痕，你认下了。可你那一路，到底是不是第四路——今儿灯底下，说不清楚，就别怪灯记你一笔。\" 做信人把契还到我手里，站起身，掸了掸膝盖上的土。 \"做信、点灯、问灯，一家分的三股。\"他说，\"分家的时候立过誓：谁也不许碰第四样东西。\" \"哪第四样？\" \"骨城的门。\"做信人说，\"三股都守着它。守到今儿，灯满了，六位齐了——它自己来叩，就不关我们的事了。\" \"那第五件呢？\"草帽人问，\"五部五件信，领路的锅是第五件。它归位了？\" \"归了。\"做信人指了指当间那口锅，\"它扣在道口，就是它的位。\" \"那罐呢？\"草帽人把珍珠罐捧出来，\"罐是眼，眼放在哪儿？\" \"你捧着。\"做信人说，\"灯亮到第五盏，你把它举起来，让眼看着门。\" 问灯的老头站起来，掸了掸褂子上的灰。 \"第五盏。\"他说，\"接灯的，上前。\" 我看了把头一眼。把头站在灯线边上，脸色比石壁还白，可他冲我点了一下头——点得很慢，很沉。 草帽人开坛，舀了满满一勺油。坛底剩下的，一指深——马渡霜说这是\"一盏灯的油\"，果然一分不多，一分不少。 我把芯安进西南空位边那盏最后剩下的灯里——灯纸是白的，芯是白的，油是黑的。 火折子凑上去之前，把头走过来，站在我边上。 \"小子。\"他说。 我等他说后头。他没说后头，就拍了拍我的肩膀，手劲不大，压得沉。跟当年在老屋灶膛边上、他头一回跟我说\"这活儿脏\"的那一晚，一个手劲。 火折子凑上去。 灯亮了。 五盏灯，北、东、西、南、中，一齐亮着。火头齐齐朝上，一盏都不斜。灯亮起来的那一瞬，我听见了锁眼石那边—— 叩。 一下。 顿了顿，又两下。 三声叩响，从锁眼石后头、从那道封了不知多少年的门后头，闷闷地传过来，敲在每个人的心口上。 瘦高个头一个动。他没往外跑，反倒一步一步挪到灯线边上，冲锁眼石的方向跪下了，跪得笔直。矮个跟着跪了。酒糟鼻没跪，他把帽子摘了，攥在手里，站着。 把头也没跪。他走到我边上，声音低得只有我们俩能听见： \"当年撬缝的人说，里头有灯。我当是骗人的鬼话。\" \"现在呢？\" \"现在它叩门了。\"把头说，\"鬼话不叩门。\" 做信人站起来，朝着锁眼石，长长地作了一个揖。 \"六位满了。\"他说，\"里头的灯，等这一叩，等了两千年。\" 问灯的老头坐在灯影里没动，只把烟袋摸出来，装了一锅，点着，抽了一口，掐灭，搁在石头上。烫手了才掐的。 \"都听着。\"他说，\"门要开的时候，别问为什么开。跟你当年进这道山一个理——\" 他没说完。灯影里，鱼哥忽然出声，声音发飘，不像他自己： \"开门的来了。\" 锁眼石的缝隙里，透出一线光。 那光是暖的，黄的，跟外头五盏灯都不一样——照在人身上，像三十多年前那晚，从雨里淌出来的那道光。"}, {"id": "A5-101", "arc": "A5", "num": 101, "title": "开门", "md": "没人说话，也没人动。\n\n那道从锁眼石缝里透出来的暖光，正一点一点变宽。不是门开了，是光自己在长——像一口气，从门后头往缝口这儿吹。\n\n草帽人把珍珠罐举起来了。双手，齐眉，罐口冲着锁眼石。罐身一进那道暖光，圈足磨残的鱼尾纹就活了，一圈浅金的水纹似的，在罐肚上慢慢地转。\n\n\"罐看见的，比咱眼睛看见的多。\"他声音压得极低，\"里头——是亮堂的。\"\n\n锁眼石动了。\n\n没响。那么大一块封了不知道多少年的石头，就那么贴着墙根，无声无息地往一边退，石头底下不是土，是石头——是榫。整块石头在它自己的槽里滑，滑出小半尺，停了停，又滑出小半尺，跟它后头那口会领路的锅一个脾气：走一步，停一步。\n\n停到最后，锁眼石彻底让开了。\n\n门后的暖光一下子涌进来，铺了半间石室。灯界的五盏灯还亮着，可火头齐齐往门那边偏——五盏灯，全在朝门里看。\n\n门后是一道往下的石廊。\n\n廊不宽，两边齐腰高的地方，每隔几步凿一个石龛。龛里有灯。大部分龛里是空的，黑着；少部分龛里亮着一点豆大的光，一盏一盏，排进深处，排到暖光化成一片黄的地方，看不清了。\n\n每一盏亮着的灯底下，都摆着一样东西。隔得远，看不清是什么。\n\n把头在我身后极轻地吸了一口气。我跟他说过的话，他一个字没说，可我知道他看见了什么——这道廊，跟当年老屋里那幅画上画的，分毫不差。长顺留的那张背面写着\"第五个还在沟里\"的画，画的就是这儿。画画的没进去过，可他画出来了。\n\n问灯的老头站起来，把烟袋别回腰上，一步一步走到门口，站在暖光的边儿上。\n\n\"灯点完了。\"他说，\"我欠你们的账，也该对一还一了。\"\n\n瘦高个还跪在灯线边上，闻言抬起头来。矮个也抬。\n\n老头背对着我，声音不快不慢：\n\n\"我姓佟。佟家的，问灯的一支。你们在沟里碰见的那个缺耳朵的白头，是我哥。\"\n\n石室里静得能听见灯花爆。\n\n\"三十七年前，桓仁接灯，轮的是我们家。\"老头说，\"我们哥俩一个探路一个问灯，进的山。灯接上了，人该出来一个——出来的是问灯的，我。接灯的该是我哥。\"\n\n\"可他没出来。\"把头的声音哑了。\n\n\"出来了。\"老头说。\n\n就三个字。把头和我对看了一眼，谁也没接话。\n\n\"他出来了，又进去了。\"老头转过半个身子，灯影里那张脸，褶子一条压一条，\"接灯的不归位，问灯的就得看着那盏灯。我看了三十七年，看到今儿，它自己叩了门。\"\n\n\"您哥这会儿——\"鱼哥忍不住，声音发飘，\"在里头？\"\n\n老头没答。他朝廊里看，看着那一排一排暗着的石龛，看了很久。\n\n\"小指的事，也说了吧。\"他把左手抬起来，五根手指头对着光——小指缺了半截，断口老得发白，\"当年哥俩抬灯，灯座压的。不是我哥压的，是我自己压的。抬灯的在里头，问灯的在外头，这一截，我留在门这边抵账。\"\n\n他说完，把手放下去，冲着门，长长作了一个揖。\n\n\"耳朵的事儿，说完了。\"老头直起身，\"门开到这儿，是门自己的事。进不进，是你们的事。我不劝——进去的可以，出来的，从来不行。\"\n\n守山人的老话，从这儿绕了一圈，又落回这道门上。\n\n把头没接这个茬。他往前走了半步，冲那道敞开的门，弯下腰去，仔细看那块退开的锁眼石。\n\n\"这石头走的是榫。\"他说，\"不是谁在里头推——是灯一满，里头的机簧自己松了。这门等咱们等了两千年，等的就是五盏灯齐。\"\n\n\"那要是当年酒糟鼻师兄他们那趟，灯要是点齐了呢？\"鱼哥问。\n\n\"点不齐。\"酒糟鼻说。他没回头，眼睛还在那头一个亮龛上，\"五盏灯得四路到齐、名分归位才点得齐。我们那趟五个人，连名分是什么都不知道，进沟是奔着货去的——山看的是心，不是手。\"\n\n\"所以灯给你们亮了一半，人留下了两个。\"把头说。\n\n\"是这个理。\"酒糟鼻说，\"我逃了半步，欠了三十年。\"\n\n我把这话在心里过了一遍。三十年前五进两出，三十年后灯自己滚进来赶灯会——不是山记仇，是山记账。账没清，门就不开。今儿门开了，不是咱们本事大，是前头那些人，一个一个把账垫平了。\n\n我把头一回在心里承认：这场灯会，从两年前王长顺画那张\"空锅\"的时候，就开场了。咱们五个人，不是主角，是接棒的手。\n\n草帽人把罐举得更正了些。罐口的白汽进了一丝门里的暖光，汽头一颤一颤的，像在深水底下冒泡。\n\n酒糟鼻从壁根站起来了。他把帽子攥在手里，走到灯线边上，往廊里看。他站的地方，正好能看见头一个亮着的石龛。\n\n他看了一眼，腿就软了半截，扶住了墙。\n\n\"老哥。\"他把头冲过去扶他。\n\n\"没事。\"酒糟鼻摆摆手，自己站直了，冲我笑了一下，还是那个比哭难看的笑，\"三十年。我画的道儿没错——亮一盏，走一个。亮着的灯底下摆的，都是走了的人留下的。\"\n\n\"那头一个龛里是什么？\"我问。\n\n\"鞋。\"酒糟鼻说，\"一双布鞋，鞋底子纳得千层那样厚——是准备走进去不出来的走法。\"\n\n石室里没人接话。\n\n瘦高个还跪在灯线边上。这会儿他忽然磕了一个头，冲着那道门，声音发颤：\"问灯的。我们哥俩……要不要也进去？\"\n\n\"你们想进去？\"老头问。\n\n\"高个哥走了。\"瘦高个说，\"他走之前，跟我们交代过——他要真'走'了，让我们哥俩别拦，也别追。他说他这一路吹灯吹了三十年，吹到最后吹着自己头上，不亏。他就求一件事，让我们进廊看看他的灯。\"\n\n老头没言语。做信人在旁边接了一句：\"廊里灯亮不亮，看的是他账清没清。你们两个进来，只能看，不能碰。\"\n\n\"看一眼就走。\"矮个哑着嗓子说。\n\n\"那也等迎人的灯停了再说。\"老头说，\"灯道上的规矩：灯走到哪儿，人不能抢在灯前头。\"\n\n做信人一直站在灯影最暗的角上。这会儿他走出来，走到门口，冲里头看了半晌，回头看草帽人：\n\n\"灯廊。\"他说，\"三股的账上都有这道廊。进去的人，一盏灯一个位。灯亮着，是人有下落；灯黑着，是位子还空着。\"\n\n\"空着的位子多不多？\"把头问。\n\n\"你们自己数。\"做信人说，\"数得清的，都别进去。\"\n\n把头当真往廊里看，眯着眼，一个龛一个龛地数。数到一半他不数了，手按在了我的肩膀上。手劲不大，压得沉。\n\n\"怎么了？\"我问。\n\n\"亮的，我数出来十一盏。\"把头说，\"可你往深处看——\"\n\n我顺着他的手往廊深处看。暖光化开的地方，黑影一层压一层，看着像尽头，又看着不像尽头。\n\n鱼哥站到了我边上。他一路没怎么言语，这会儿忽然低声说：\"峰哥，你听。\"\n\n我听。起初什么都没有，只有灯花偶尔爆一声。听了几口气的工夫，我听出来了——廊深处，有极轻极轻的动静，不是脚步，不是水声，是像很多人同时出气的那种、又匀又长的动静。一声压一声，从深处浮上来。\n\n\"里头有人喘气？\"鱼哥声音都细了。\n\n\"里头有人等气儿。\"酒糟鼻在边上听见了，接口道，\"我当年在缝口就听过这个动静。三十年了，这口气，还这么长。\"\n\n就在这时候，廊里头，最深处，离门最远的那个石龛——\n\n亮了。\n\n一盏灯，无声无息地，自己着了。豆大的火头，朝上。\n\n紧接着是第二个龛。第三个。一盏接一盏，从最深处，往门口这儿亮过来。不急不缓，一亮一停，一亮一停——像有人在最里头，提着一盏灯，一步一步往门口走。\n\n每亮一盏，石室里五盏灯的火头，就齐齐地颤一下。\n\n草帽人举着罐，忽然开口，声音都是平的，平得吓人：\n\n\"别站着了。\"\n\n\"怎么？\"\n\n\"提灯往门口走的，\"他说，\"是来迎人的。\"", "words": 2796, "html": "<p>没人说话，也没人动。<\/p>\n<p>那道从锁眼石缝里透出来的暖光，正一点一点变宽。不是门开了，是光自己在长——像一口气，从门后头往缝口这儿吹。<\/p>\n<p>草帽人把珍珠罐举起来了。双手，齐眉，罐口冲着锁眼石。罐身一进那道暖光，圈足磨残的鱼尾纹就活了，一圈浅金的水纹似的，在罐肚上慢慢地转。<\/p>\n<p>\"罐看见的，比咱眼睛看见的多。\"他声音压得极低，\"里头——是亮堂的。\"<\/p>\n<p>锁眼石动了。<\/p>\n<p>没响。那么大一块封了不知道多少年的石头，就那么贴着墙根，无声无息地往一边退，石头底下不是土，是石头——是榫。整块石头在它自己的槽里滑，滑出小半尺，停了停，又滑出小半尺，跟它后头那口会领路的锅一个脾气：走一步，停一步。<\/p>\n<p>停到最后，锁眼石彻底让开了。<\/p>\n<p>门后的暖光一下子涌进来，铺了半间石室。灯界的五盏灯还亮着，可火头齐齐往门那边偏——五盏灯，全在朝门里看。<\/p>\n<p>门后是一道往下的石廊。<\/p>\n<p>廊不宽，两边齐腰高的地方，每隔几步凿一个石龛。龛里有灯。大部分龛里是空的，黑着；少部分龛里亮着一点豆大的光，一盏一盏，排进深处，排到暖光化成一片黄的地方，看不清了。<\/p>\n<p>每一盏亮着的灯底下，都摆着一样东西。隔得远，看不清是什么。<\/p>\n<p>把头在我身后极轻地吸了一口气。我跟他说过的话，他一个字没说，可我知道他看见了什么——这道廊，跟当年老屋里那幅画上画的，分毫不差。长顺留的那张背面写着\"第五个还在沟里\"的画，画的就是这儿。画画的没进去过，可他画出来了。<\/p>\n<p>问灯的老头站起来，把烟袋别回腰上，一步一步走到门口，站在暖光的边儿上。<\/p>\n<p>\"灯点完了。\"他说，\"我欠你们的账，也该对一还一了。\"<\/p>\n<p>瘦高个还跪在灯线边上，闻言抬起头来。矮个也抬。<\/p>\n<p>老头背对着我，声音不快不慢：<\/p>\n<p>\"我姓佟。佟家的，问灯的一支。你们在沟里碰见的那个缺耳朵的白头，是我哥。\"<\/p>\n<p>石室里静得能听见灯花爆。<\/p>\n<p>\"三十七年前，桓仁接灯，轮的是我们家。\"老头说，\"我们哥俩一个探路一个问灯，进的山。灯接上了，人该出来一个——出来的是问灯的，我。接灯的该是我哥。\"<\/p>\n<p>\"可他没出来。\"把头的声音哑了。<\/p>\n<p>\"出来了。\"老头说。<\/p>\n<p>就三个字。把头和我对看了一眼，谁也没接话。<\/p>\n<p>\"他出来了，又进去了。\"老头转过半个身子，灯影里那张脸，褶子一条压一条，\"接灯的不归位，问灯的就得看着那盏灯。我看了三十七年，看到今儿，它自己叩了门。\"<\/p>\n<p>\"您哥这会儿——\"鱼哥忍不住，声音发飘，\"在里头？\"<\/p>\n<p>老头没答。他朝廊里看，看着那一排一排暗着的石龛，看了很久。<\/p>\n<p>\"小指的事，也说了吧。\"他把左手抬起来，五根手指头对着光——小指缺了半截，断口老得发白，\"当年哥俩抬灯，灯座压的。不是我哥压的，是我自己压的。抬灯的在里头，问灯的在外头，这一截，我留在门这边抵账。\"<\/p>\n<p>他说完，把手放下去，冲着门，长长作了一个揖。<\/p>\n<p>\"耳朵的事儿，说完了。\"老头直起身，\"门开到这儿，是门自己的事。进不进，是你们的事。我不劝——进去的可以，出来的，从来不行。\"<\/p>\n<p>守山人的老话，从这儿绕了一圈，又落回这道门上。<\/p>\n<p>把头没接这个茬。他往前走了半步，冲那道敞开的门，弯下腰去，仔细看那块退开的锁眼石。<\/p>\n<p>\"这石头走的是榫。\"他说，\"不是谁在里头推——是灯一满，里头的机簧自己松了。这门等咱们等了两千年，等的就是五盏灯齐。\"<\/p>\n<p>\"那要是当年酒糟鼻师兄他们那趟，灯要是点齐了呢？\"鱼哥问。<\/p>\n<p>\"点不齐。\"酒糟鼻说。他没回头，眼睛还在那头一个亮龛上，\"五盏灯得四路到齐、名分归位才点得齐。我们那趟五个人，连名分是什么都不知道，进沟是奔着货去的——山看的是心，不是手。\"<\/p>\n<p>\"所以灯给你们亮了一半，人留下了两个。\"把头说。<\/p>\n<p>\"是这个理。\"酒糟鼻说，\"我逃了半步，欠了三十年。\"<\/p>\n<p>我把这话在心里过了一遍。三十年前五进两出，三十年后灯自己滚进来赶灯会——不是山记仇，是山记账。账没清，门就不开。今儿门开了，不是咱们本事大，是前头那些人，一个一个把账垫平了。<\/p>\n<p>我把头一回在心里承认：这场灯会，从两年前王长顺画那张\"空锅\"的时候，就开场了。咱们五个人，不是主角，是接棒的手。<\/p>\n<p>草帽人把罐举得更正了些。罐口的白汽进了一丝门里的暖光，汽头一颤一颤的，像在深水底下冒泡。<\/p>\n<p>酒糟鼻从壁根站起来了。他把帽子攥在手里，走到灯线边上，往廊里看。他站的地方，正好能看见头一个亮着的石龛。<\/p>\n<p>他看了一眼，腿就软了半截，扶住了墙。<\/p>\n<p>\"老哥。\"他把头冲过去扶他。<\/p>\n<p>\"没事。\"酒糟鼻摆摆手，自己站直了，冲我笑了一下，还是那个比哭难看的笑，\"三十年。我画的道儿没错——亮一盏，走一个。亮着的灯底下摆的，都是走了的人留下的。\"<\/p>\n<p>\"那头一个龛里是什么？\"我问。<\/p>\n<p>\"鞋。\"酒糟鼻说，\"一双布鞋，鞋底子纳得千层那样厚——是准备走进去不出来的走法。\"<\/p>\n<p>石室里没人接话。<\/p>\n<p>瘦高个还跪在灯线边上。这会儿他忽然磕了一个头，冲着那道门，声音发颤：\"问灯的。我们哥俩……要不要也进去？\"<\/p>\n<p>\"你们想进去？\"老头问。<\/p>\n<p>\"高个哥走了。\"瘦高个说，\"他走之前，跟我们交代过——他要真'走'了，让我们哥俩别拦，也别追。他说他这一路吹灯吹了三十年，吹到最后吹着自己头上，不亏。他就求一件事，让我们进廊看看他的灯。\"<\/p>\n<p>老头没言语。做信人在旁边接了一句：\"廊里灯亮不亮，看的是他账清没清。你们两个进来，只能看，不能碰。\"<\/p>\n<p>\"看一眼就走。\"矮个哑着嗓子说。<\/p>\n<p>\"那也等迎人的灯停了再说。\"老头说，\"灯道上的规矩：灯走到哪儿，人不能抢在灯前头。\"<\/p>\n<p>做信人一直站在灯影最暗的角上。这会儿他走出来，走到门口，冲里头看了半晌，回头看草帽人：<\/p>\n<p>\"灯廊。\"他说，\"三股的账上都有这道廊。进去的人，一盏灯一个位。灯亮着，是人有下落；灯黑着，是位子还空着。\"<\/p>\n<p>\"空着的位子多不多？\"把头问。<\/p>\n<p>\"你们自己数。\"做信人说，\"数得清的，都别进去。\"<\/p>\n<p>把头当真往廊里看，眯着眼，一个龛一个龛地数。数到一半他不数了，手按在了我的肩膀上。手劲不大，压得沉。<\/p>\n<p>\"怎么了？\"我问。<\/p>\n<p>\"亮的，我数出来十一盏。\"把头说，\"可你往深处看——\"<\/p>\n<p>我顺着他的手往廊深处看。暖光化开的地方，黑影一层压一层，看着像尽头，又看着不像尽头。<\/p>\n<p>鱼哥站到了我边上。他一路没怎么言语，这会儿忽然低声说：\"峰哥，你听。\"<\/p>\n<p>我听。起初什么都没有，只有灯花偶尔爆一声。听了几口气的工夫，我听出来了——廊深处，有极轻极轻的动静，不是脚步，不是水声，是像很多人同时出气的那种、又匀又长的动静。一声压一声，从深处浮上来。<\/p>\n<p>\"里头有人喘气？\"鱼哥声音都细了。<\/p>\n<p>\"里头有人等气儿。\"酒糟鼻在边上听见了，接口道，\"我当年在缝口就听过这个动静。三十年了，这口气，还这么长。\"<\/p>\n<p>就在这时候，廊里头，最深处，离门最远的那个石龛——<\/p>\n<p>亮了。<\/p>\n<p>一盏灯，无声无息地，自己着了。豆大的火头，朝上。<\/p>\n<p>紧接着是第二个龛。第三个。一盏接一盏，从最深处，往门口这儿亮过来。不急不缓，一亮一停，一亮一停——像有人在最里头，提着一盏灯，一步一步往门口走。<\/p>\n<p>每亮一盏，石室里五盏灯的火头，就齐齐地颤一下。<\/p>\n<p>草帽人举着罐，忽然开口，声音都是平的，平得吓人：<\/p>\n<p>\"别站着了。\"<\/p>\n<p>\"怎么？\"<\/p>\n<p>\"提灯往门口走的，\"他说，\"是来迎人的。\"<\/p>", "plain": "没人说话，也没人动。 那道从锁眼石缝里透出来的暖光，正一点一点变宽。不是门开了，是光自己在长——像一口气，从门后头往缝口这儿吹。 草帽人把珍珠罐举起来了。双手，齐眉，罐口冲着锁眼石。罐身一进那道暖光，圈足磨残的鱼尾纹就活了，一圈浅金的水纹似的，在罐肚上慢慢地转。 \"罐看见的，比咱眼睛看见的多。\"他声音压得极低，\"里头——是亮堂的。\" 锁眼石动了。 没响。那么大一块封了不知道多少年的石头，就那么贴着墙根，无声无息地往一边退，石头底下不是土，是石头——是榫。整块石头在它自己的槽里滑，滑出小半尺，停了停，又滑出小半尺，跟它后头那口会领路的锅一个脾气：走一步，停一步。 停到最后，锁眼石彻底让开了。 门后的暖光一下子涌进来，铺了半间石室。灯界的五盏灯还亮着，可火头齐齐往门那边偏——五盏灯，全在朝门里看。 门后是一道往下的石廊。 廊不宽，两边齐腰高的地方，每隔几步凿一个石龛。龛里有灯。大部分龛里是空的，黑着；少部分龛里亮着一点豆大的光，一盏一盏，排进深处，排到暖光化成一片黄的地方，看不清了。 每一盏亮着的灯底下，都摆着一样东西。隔得远，看不清是什么。 把头在我身后极轻地吸了一口气。我跟他说过的话，他一个字没说，可我知道他看见了什么——这道廊，跟当年老屋里那幅画上画的，分毫不差。长顺留的那张背面写着\"第五个还在沟里\"的画，画的就是这儿。画画的没进去过，可他画出来了。 问灯的老头站起来，把烟袋别回腰上，一步一步走到门口，站在暖光的边儿上。 \"灯点完了。\"他说，\"我欠你们的账，也该对一还一了。\" 瘦高个还跪在灯线边上，闻言抬起头来。矮个也抬。 老头背对着我，声音不快不慢： \"我姓佟。佟家的，问灯的一支。你们在沟里碰见的那个缺耳朵的白头，是我哥。\" 石室里静得能听见灯花爆。 \"三十七年前，桓仁接灯，轮的是我们家。\"老头说，\"我们哥俩一个探路一个问灯，进的山。灯接上了，人该出来一个——出来的是问灯的，我。接灯的该是我哥。\" \"可他没出来。\"把头的声音哑了。 \"出来了。\"老头说。 就三个字。把头和我对看了一眼，谁也没接话。 \"他出来了，又进去了。\"老头转过半个身子，灯影里那张脸，褶子一条压一条，\"接灯的不归位，问灯的就得看着那盏灯。我看了三十七年，看到今儿，它自己叩了门。\" \"您哥这会儿——\"鱼哥忍不住，声音发飘，\"在里头？\" 老头没答。他朝廊里看，看着那一排一排暗着的石龛，看了很久。 \"小指的事，也说了吧。\"他把左手抬起来，五根手指头对着光——小指缺了半截，断口老得发白，\"当年哥俩抬灯，灯座压的。不是我哥压的，是我自己压的。抬灯的在里头，问灯的在外头，这一截，我留在门这边抵账。\" 他说完，把手放下去，冲着门，长长作了一个揖。 \"耳朵的事儿，说完了。\"老头直起身，\"门开到这儿，是门自己的事。进不进，是你们的事。我不劝——进去的可以，出来的，从来不行。\" 守山人的老话，从这儿绕了一圈，又落回这道门上。 把头没接这个茬。他往前走了半步，冲那道敞开的门，弯下腰去，仔细看那块退开的锁眼石。 \"这石头走的是榫。\"他说，\"不是谁在里头推——是灯一满，里头的机簧自己松了。这门等咱们等了两千年，等的就是五盏灯齐。\" \"那要是当年酒糟鼻师兄他们那趟，灯要是点齐了呢？\"鱼哥问。 \"点不齐。\"酒糟鼻说。他没回头，眼睛还在那头一个亮龛上，\"五盏灯得四路到齐、名分归位才点得齐。我们那趟五个人，连名分是什么都不知道，进沟是奔着货去的——山看的是心，不是手。\" \"所以灯给你们亮了一半，人留下了两个。\"把头说。 \"是这个理。\"酒糟鼻说，\"我逃了半步，欠了三十年。\" 我把这话在心里过了一遍。三十年前五进两出，三十年后灯自己滚进来赶灯会——不是山记仇，是山记账。账没清，门就不开。今儿门开了，不是咱们本事大，是前头那些人，一个一个把账垫平了。 我把头一回在心里承认：这场灯会，从两年前王长顺画那张\"空锅\"的时候，就开场了。咱们五个人，不是主角，是接棒的手。 草帽人把罐举得更正了些。罐口的白汽进了一丝门里的暖光，汽头一颤一颤的，像在深水底下冒泡。 酒糟鼻从壁根站起来了。他把帽子攥在手里，走到灯线边上，往廊里看。他站的地方，正好能看见头一个亮着的石龛。 他看了一眼，腿就软了半截，扶住了墙。 \"老哥。\"他把头冲过去扶他。 \"没事。\"酒糟鼻摆摆手，自己站直了，冲我笑了一下，还是那个比哭难看的笑，\"三十年。我画的道儿没错——亮一盏，走一个。亮着的灯底下摆的，都是走了的人留下的。\" \"那头一个龛里是什么？\"我问。 \"鞋。\"酒糟鼻说，\"一双布鞋，鞋底子纳得千层那样厚——是准备走进去不出来的走法。\" 石室里没人接话。 瘦高个还跪在灯线边上。这会儿他忽然磕了一个头，冲着那道门，声音发颤：\"问灯的。我们哥俩……要不要也进去？\" \"你们想进去？\"老头问。 \"高个哥走了。\"瘦高个说，\"他走之前，跟我们交代过——他要真'走'了，让我们哥俩别拦，也别追。他说他这一路吹灯吹了三十年，吹到最后吹着自己头上，不亏。他就求一件事，让我们进廊看看他的灯。\" 老头没言语。做信人在旁边接了一句：\"廊里灯亮不亮，看的是他账清没清。你们两个进来，只能看，不能碰。\" \"看一眼就走。\"矮个哑着嗓子说。 \"那也等迎人的灯停了再说。\"老头说，\"灯道上的规矩：灯走到哪儿，人不能抢在灯前头。\" 做信人一直站在灯影最暗的角上。这会儿他走出来，走到门口，冲里头看了半晌，回头看草帽人： \"灯廊。\"他说，\"三股的账上都有这道廊。进去的人，一盏灯一个位。灯亮着，是人有下落；灯黑着，是位子还空着。\" \"空着的位子多不多？\"把头问。 \"你们自己数。\"做信人说，\"数得清的，都别进去。\" 把头当真往廊里看，眯着眼，一个龛一个龛地数。数到一半他不数了，手按在了我的肩膀上。手劲不大，压得沉。 \"怎么了？\"我问。 \"亮的，我数出来十一盏。\"把头说，\"可你往深处看——\" 我顺着他的手往廊深处看。暖光化开的地方，黑影一层压一层，看着像尽头，又看着不像尽头。 鱼哥站到了我边上。他一路没怎么言语，这会儿忽然低声说：\"峰哥，你听。\" 我听。起初什么都没有，只有灯花偶尔爆一声。听了几口气的工夫，我听出来了——廊深处，有极轻极轻的动静，不是脚步，不是水声，是像很多人同时出气的那种、又匀又长的动静。一声压一声，从深处浮上来。 \"里头有人喘气？\"鱼哥声音都细了。 \"里头有人等气儿。\"酒糟鼻在边上听见了，接口道，\"我当年在缝口就听过这个动静。三十年了，这口气，还这么长。\" 就在这时候，廊里头，最深处，离门最远的那个石龛—— 亮了。 一盏灯，无声无息地，自己着了。豆大的火头，朝上。 紧接着是第二个龛。第三个。一盏接一盏，从最深处，往门口这儿亮过来。不急不缓，一亮一停，一亮一停——像有人在最里头，提着一盏灯，一步一步往门口走。 每亮一盏，石室里五盏灯的火头，就齐齐地颤一下。 草帽人举着罐，忽然开口，声音都是平的，平得吓人： \"别站着了。\" \"怎么？\" \"提灯往门口走的，\"他说，\"是来迎人的。\""}, {"id": "A5-102", "arc": "A5", "num": 102, "title": "灯廊", "md": "谁也没先迈步。\n\n迎人的灯一盏一盏往门口亮，亮到廊子中段，停了。最前头那盏灯的火头，冲着门这边，轻轻地歪了一下——像有人站在龛边上，回头看了咱们一眼。\n\n\"三十年前我到缝口，也这么停过一回。\"酒糟鼻把帽子扣回头上，\"灯停下来，是等你。你不进去，它就等。等烦了它自己回去——明儿再等。\"\n\n\"进去会怎么样？\"鱼哥问。\n\n\"不知道。\"酒糟鼻说，\"我就是没敢进，才在外头活了三十年。\"\n\n把头看了我一眼。我没等他开口：\"走。轮上了就不躲。\"\n\n老头在前，酒糟鼻第二，我第三，把头跟着我，鱼哥挨着把头。草帽人举着罐走在中间偏后，做信人断后。瘦高个和矮个还跪在灯线边上没人叫他们——老头进廊前回头撂了一句：\"灭字的不配踩灯道。想补账，自己择日子。\"\n\n进了廊，凉气从脚脖子往上爬。廊里的凉不是山里的凉，是那种存了两千年、没换过一口气的凉。\n\n草帽人的罐这时候显出用处来了。罐口的白汽细成一根线，飘在众人前头半人高的地方，不散，像有人牵着一根看不见的香走。汽走到哪儿，脚下的廊就往下延伸到哪儿——路，是罐先探的。\n\n\"罐走过的道，\"老头在前面走，头也不回，\"不会错。这条廊当年的送油人走过，接灯的走过，我哥走过。今儿你们走——是头一回，有活人揣着信走。\"\n\n做信人一路走，一路用手背贴墙。走到后半截，他贴墙的手停住了。\n\n\"墙是整块的山骨。\"他说，\"没有灰缝，没有包土——这门廊不是修出来的，是山里头本来就长着的。当年的人只是把龛凿了出来。\"\n\n\"凿龛的人，\"把头说，\"就是做信家？\"\n\n\"比我家早。\"做信人说，\"我家是后来守龛的。守着守着，分了三股——守龛的、点灯的、看账的。龛是山里的，账是人的。山里的事，人说了几千年算，今儿算一回准的。\"\n\n头一个亮着的石龛就在眼前。灯底下，真是一双布鞋。千层底，针脚密得数不过来，鞋帮里还塞着两团纸——塞鞋的怕鞋走形，用的是旧报纸。报纸的日期，都发黄成一片影子了。\n\n第二个龛，灯底下搁着一杆烟袋。烟袋锅是黄铜的，杆子盘得油亮，烟嘴缺了一块——缺口的茬是新的，掰断的，不是磕的。\n\n再往里走，龛里摆的东西就杂了。半副护膝。一只手电筒，铁皮的，玻璃罩里还有两节电池，锈成一坨。一把瓦刀，木把儿包着布，布也糟了。麻绳，撬棍，安全帽，一只搪瓷缸子——缸子上印着\"先进生产者\"，磕掉了仨字。\n\n\"都是家什。\"把头低声说，\"走的时候，手里拿什么，就搁什么。\"\n\n\"跟咱们进场子一个规矩。\"我说，\"家伙什不带走，人干干净净地走。\"\n\n鱼哥走在我侧后，一直没出声。走到第七八个龛的时候，他忽然拽了一下我袖子。\n\n\"峰哥。\"他声音低得快听不见，\"你看灯。\"\n\n我看。廊这边一溜龛，亮着四盏。四盏灯的火头，齐齐朝一个方向偏——朝着我们来的方向，朝着门口那五盏灯。\n\n\"灯是迎人的。\"鱼哥说，\"可它们火头朝外——\"\n\n\"是朝门口。\"我说。\n\n\"不是。\"鱼哥摇头，他脸上一点血色都没有，\"我在后头看了半天了。它们不是朝门口。是朝你的后腰。\"\n\n我的后腰上，揣着照魇镜和无字阴契。\n\n我没接话。脚下没停。廊子往下走，龛位越深，摆的东西越老。再往里，报纸换成麻纸，铁器换成铜器——一枚铜带钩，一把铜削刀，一盏巴掌大的陶灯。陶灯龛里的火头，比前头的都稳，纹丝不动。\n\n酒糟鼻越走越慢。走到一盏灯跟前，他站住了。\n\n灯底下摆着一把瓦刀和半截麻绳。麻绳的绳头打着结，打得潦草，一看就是赶急。\n\n\"是他俩的。\"酒糟鼻说。\n\n\"谁？\"\n\n\"跟我一块儿下来的。\"他伸手碰了碰那截麻绳，又缩回来，没敢碰第二下，\"我半步惊退了灯，他俩进去了。三十……整整三十年，我一直当他们在山里烂着。\"\n\n\"那你要进去认认不？\"鱼哥低声问。\n\n\"不了。\"酒糟鼻摇头，\"灯亮着，人就有下落。下落在灯里，不在我想里。我要是进去了，就是一个想进去看看的——这灯廊里，最不缺的就是想进去看看的。\"\n\n他说这话的时候，声音平得吓人。可我看见他攥着帽子的那只手，指节全是白的。\n\n老头在前头听着，忽然说了一句：\"当年你要是有这句话，师兄俩现在兴许都在沟外头晒太阳。\"\n\n\"当年我要有这句话，\"酒糟鼻说，\"我就不是我了。\"\n\n\"灯亮着。\"老头在前头说，\"灯亮着，就是有下落。\"\n\n酒糟鼻在龛跟前蹲下了。这个在外头晃了三十年、烟酒不沾却满脸褶子像腌透了的老头，蹲在灯底下，肩膀一抽一抽，没哭出声。帽子摘了，攥在手里。\n\n没人催他。\n\n把头越过他往前走，走了几步，忽然也站住了。他站在一个龛前头，站得笔直，半天没动。\n\n我凑过去。龛里的灯亮着。灯底下，铺着一块蓝布，蓝布上摆着一样东西——一枚黄铜的鱼尾。一寸来长，鱼尾分岔，岔尖磨得圆熟，鱼身上錾着极细的一道纹。\n\n跟马渡霜家独屋里，那个封油坛的铜订金，一个模子出来的。\n\n\"马家的。\"把头说。他声音平，可我听见他嗓子眼里发紧，\"三十多年前接灯没回来的那个——是马家的人。\"\n\n\"油是人家的。\"老头在前头应了一声，\"接灯的，也是人家的。那年订好的。\"\n\n把头盯着那枚鱼尾看了半天，伸手从兜里摸出一样东西，搁在龛沿上——半张黄表纸，墨点鱼尾，是酒糟那年留下的记号，他一直收着。\n\n\"我把该给的先给了。\"他说，\"马家那笔账，得马家自己来对。\"\n\n我正想问什么叫马家自己来对，前头的草帽人忽然\"咦\"了一声。\n\n我趁这空当，把一路看下来的灯在心里排了排。亮着的灯，火头都朝上，稳；可我注意到一件怪事——离门越近的龛，灯越暗，跟豆大的火头只剩一口气；越往深处，灯反而越亮。廊里的光不是越来越黑，是越来越黄、越来越沉，走到后半截，人像泡在一缸老油里。\n\n\"灯往深处亮，\"我把这个发现说出来，\"不是照路——是里头的东西比外头的亮。\"\n\n\"灯廊的灯不照路。\"老头在前头应了一声，\"照的是名分。名分越重的，位子越深。\"\n\n\"那最深处那盏刚亮起来的呢？\"\n\n老头没答。走了几步，他才说：\"最深的那盏，照的是没人敢接的账。\"\n\n他手里的珍珠罐，罐身正在发热。磨残的鱼尾纹一圈一圈地泛亮，罐口没盖，一股白汽从罐口里冒出来——不多，就一根筷子那么细，笔直地立起来，不散。\n\n白汽冲着的方向，是廊的深处。\n\n\"罐看见路了。\"草帽人说，\"廊有底。底上有门。\"\n\n往深处走之前，瘦高个和矮个到底还是跟进来了。老头许可的，撂了一句话：\"看灯可以，过灯线不行。\"哥俩进来，直奔一个方向——迎人的灯停住的那个龛。\n\n那个龛亮着。灯底下摆着一样东西：一只帆布手套，五指张开，手心里朝天。手套是劳保那种，掌心磨穿了两个洞。\n\n瘦高个在灯前头站住，看了半天，忽然弯腰，从自己裤腰里解下一样东西，轻轻搁在灯座边上——一沓票子，用皮筋勒着。\n\n\"这是啥意思？\"鱼哥没忍住。\n\n\"他买锁的钱。\"瘦高个说，\"钱是他出的，锁是我们仨使的。他走了，钱得归灯——他这辈子最后一笔账，不能烂在我们手里。\"\n\n老头看着那沓票子，半晌，说了句：\"灯不收钱。\"\n\n\"那收什么？\"\n\n\"收你这个心。\"老头说，\"搁下吧。搁下了，你哥那盏灯，能亮久一点。\"\n\n票子搁在灯座边上，没人再动。那盏灯的火头，轻轻往上跳了一下，又稳住了。\n\n我们顺着白汽指的方向往里看。廊的尽头，暖光化开的地方，立着一道门。\n\n石头门，比石室还高。门心嵌着一排铜鱼尾，一枚一枚，排得像鳞。\n\n当中那枚——鱼尾的尾巴，正轻轻地、轻轻地翘着，一翘，一落。\n\n像在喘气。", "words": 2851, "html": "<p>谁也没先迈步。<\/p>\n<p>迎人的灯一盏一盏往门口亮，亮到廊子中段，停了。最前头那盏灯的火头，冲着门这边，轻轻地歪了一下——像有人站在龛边上，回头看了咱们一眼。<\/p>\n<p>\"三十年前我到缝口，也这么停过一回。\"酒糟鼻把帽子扣回头上，\"灯停下来，是等你。你不进去，它就等。等烦了它自己回去——明儿再等。\"<\/p>\n<p>\"进去会怎么样？\"鱼哥问。<\/p>\n<p>\"不知道。\"酒糟鼻说，\"我就是没敢进，才在外头活了三十年。\"<\/p>\n<p>把头看了我一眼。我没等他开口：\"走。轮上了就不躲。\"<\/p>\n<p>老头在前，酒糟鼻第二，我第三，把头跟着我，鱼哥挨着把头。草帽人举着罐走在中间偏后，做信人断后。瘦高个和矮个还跪在灯线边上没人叫他们——老头进廊前回头撂了一句：\"灭字的不配踩灯道。想补账，自己择日子。\"<\/p>\n<p>进了廊，凉气从脚脖子往上爬。廊里的凉不是山里的凉，是那种存了两千年、没换过一口气的凉。<\/p>\n<p>草帽人的罐这时候显出用处来了。罐口的白汽细成一根线，飘在众人前头半人高的地方，不散，像有人牵着一根看不见的香走。汽走到哪儿，脚下的廊就往下延伸到哪儿——路，是罐先探的。<\/p>\n<p>\"罐走过的道，\"老头在前面走，头也不回，\"不会错。这条廊当年的送油人走过，接灯的走过，我哥走过。今儿你们走——是头一回，有活人揣着信走。\"<\/p>\n<p>做信人一路走，一路用手背贴墙。走到后半截，他贴墙的手停住了。<\/p>\n<p>\"墙是整块的山骨。\"他说，\"没有灰缝，没有包土——这门廊不是修出来的，是山里头本来就长着的。当年的人只是把龛凿了出来。\"<\/p>\n<p>\"凿龛的人，\"把头说，\"就是做信家？\"<\/p>\n<p>\"比我家早。\"做信人说，\"我家是后来守龛的。守着守着，分了三股——守龛的、点灯的、看账的。龛是山里的，账是人的。山里的事，人说了几千年算，今儿算一回准的。\"<\/p>\n<p>头一个亮着的石龛就在眼前。灯底下，真是一双布鞋。千层底，针脚密得数不过来，鞋帮里还塞着两团纸——塞鞋的怕鞋走形，用的是旧报纸。报纸的日期，都发黄成一片影子了。<\/p>\n<p>第二个龛，灯底下搁着一杆烟袋。烟袋锅是黄铜的，杆子盘得油亮，烟嘴缺了一块——缺口的茬是新的，掰断的，不是磕的。<\/p>\n<p>再往里走，龛里摆的东西就杂了。半副护膝。一只手电筒，铁皮的，玻璃罩里还有两节电池，锈成一坨。一把瓦刀，木把儿包着布，布也糟了。麻绳，撬棍，安全帽，一只搪瓷缸子——缸子上印着\"先进生产者\"，磕掉了仨字。<\/p>\n<p>\"都是家什。\"把头低声说，\"走的时候，手里拿什么，就搁什么。\"<\/p>\n<p>\"跟咱们进场子一个规矩。\"我说，\"家伙什不带走，人干干净净地走。\"<\/p>\n<p>鱼哥走在我侧后，一直没出声。走到第七八个龛的时候，他忽然拽了一下我袖子。<\/p>\n<p>\"峰哥。\"他声音低得快听不见，\"你看灯。\"<\/p>\n<p>我看。廊这边一溜龛，亮着四盏。四盏灯的火头，齐齐朝一个方向偏——朝着我们来的方向，朝着门口那五盏灯。<\/p>\n<p>\"灯是迎人的。\"鱼哥说，\"可它们火头朝外——\"<\/p>\n<p>\"是朝门口。\"我说。<\/p>\n<p>\"不是。\"鱼哥摇头，他脸上一点血色都没有，\"我在后头看了半天了。它们不是朝门口。是朝你的后腰。\"<\/p>\n<p>我的后腰上，揣着照魇镜和无字阴契。<\/p>\n<p>我没接话。脚下没停。廊子往下走，龛位越深，摆的东西越老。再往里，报纸换成麻纸，铁器换成铜器——一枚铜带钩，一把铜削刀，一盏巴掌大的陶灯。陶灯龛里的火头，比前头的都稳，纹丝不动。<\/p>\n<p>酒糟鼻越走越慢。走到一盏灯跟前，他站住了。<\/p>\n<p>灯底下摆着一把瓦刀和半截麻绳。麻绳的绳头打着结，打得潦草，一看就是赶急。<\/p>\n<p>\"是他俩的。\"酒糟鼻说。<\/p>\n<p>\"谁？\"<\/p>\n<p>\"跟我一块儿下来的。\"他伸手碰了碰那截麻绳，又缩回来，没敢碰第二下，\"我半步惊退了灯，他俩进去了。三十……整整三十年，我一直当他们在山里烂着。\"<\/p>\n<p>\"那你要进去认认不？\"鱼哥低声问。<\/p>\n<p>\"不了。\"酒糟鼻摇头，\"灯亮着，人就有下落。下落在灯里，不在我想里。我要是进去了，就是一个想进去看看的——这灯廊里，最不缺的就是想进去看看的。\"<\/p>\n<p>他说这话的时候，声音平得吓人。可我看见他攥着帽子的那只手，指节全是白的。<\/p>\n<p>老头在前头听着，忽然说了一句：\"当年你要是有这句话，师兄俩现在兴许都在沟外头晒太阳。\"<\/p>\n<p>\"当年我要有这句话，\"酒糟鼻说，\"我就不是我了。\"<\/p>\n<p>\"灯亮着。\"老头在前头说，\"灯亮着，就是有下落。\"<\/p>\n<p>酒糟鼻在龛跟前蹲下了。这个在外头晃了三十年、烟酒不沾却满脸褶子像腌透了的老头，蹲在灯底下，肩膀一抽一抽，没哭出声。帽子摘了，攥在手里。<\/p>\n<p>没人催他。<\/p>\n<p>把头越过他往前走，走了几步，忽然也站住了。他站在一个龛前头，站得笔直，半天没动。<\/p>\n<p>我凑过去。龛里的灯亮着。灯底下，铺着一块蓝布，蓝布上摆着一样东西——一枚黄铜的鱼尾。一寸来长，鱼尾分岔，岔尖磨得圆熟，鱼身上錾着极细的一道纹。<\/p>\n<p>跟马渡霜家独屋里，那个封油坛的铜订金，一个模子出来的。<\/p>\n<p>\"马家的。\"把头说。他声音平，可我听见他嗓子眼里发紧，\"三十多年前接灯没回来的那个——是马家的人。\"<\/p>\n<p>\"油是人家的。\"老头在前头应了一声，\"接灯的，也是人家的。那年订好的。\"<\/p>\n<p>把头盯着那枚鱼尾看了半天，伸手从兜里摸出一样东西，搁在龛沿上——半张黄表纸，墨点鱼尾，是酒糟那年留下的记号，他一直收着。<\/p>\n<p>\"我把该给的先给了。\"他说，\"马家那笔账，得马家自己来对。\"<\/p>\n<p>我正想问什么叫马家自己来对，前头的草帽人忽然\"咦\"了一声。<\/p>\n<p>我趁这空当，把一路看下来的灯在心里排了排。亮着的灯，火头都朝上，稳；可我注意到一件怪事——离门越近的龛，灯越暗，跟豆大的火头只剩一口气；越往深处，灯反而越亮。廊里的光不是越来越黑，是越来越黄、越来越沉，走到后半截，人像泡在一缸老油里。<\/p>\n<p>\"灯往深处亮，\"我把这个发现说出来，\"不是照路——是里头的东西比外头的亮。\"<\/p>\n<p>\"灯廊的灯不照路。\"老头在前头应了一声，\"照的是名分。名分越重的，位子越深。\"<\/p>\n<p>\"那最深处那盏刚亮起来的呢？\"<\/p>\n<p>老头没答。走了几步，他才说：\"最深的那盏，照的是没人敢接的账。\"<\/p>\n<p>他手里的珍珠罐，罐身正在发热。磨残的鱼尾纹一圈一圈地泛亮，罐口没盖，一股白汽从罐口里冒出来——不多，就一根筷子那么细，笔直地立起来，不散。<\/p>\n<p>白汽冲着的方向，是廊的深处。<\/p>\n<p>\"罐看见路了。\"草帽人说，\"廊有底。底上有门。\"<\/p>\n<p>往深处走之前，瘦高个和矮个到底还是跟进来了。老头许可的，撂了一句话：\"看灯可以，过灯线不行。\"哥俩进来，直奔一个方向——迎人的灯停住的那个龛。<\/p>\n<p>那个龛亮着。灯底下摆着一样东西：一只帆布手套，五指张开，手心里朝天。手套是劳保那种，掌心磨穿了两个洞。<\/p>\n<p>瘦高个在灯前头站住，看了半天，忽然弯腰，从自己裤腰里解下一样东西，轻轻搁在灯座边上——一沓票子，用皮筋勒着。<\/p>\n<p>\"这是啥意思？\"鱼哥没忍住。<\/p>\n<p>\"他买锁的钱。\"瘦高个说，\"钱是他出的，锁是我们仨使的。他走了，钱得归灯——他这辈子最后一笔账，不能烂在我们手里。\"<\/p>\n<p>老头看着那沓票子，半晌，说了句：\"灯不收钱。\"<\/p>\n<p>\"那收什么？\"<\/p>\n<p>\"收你这个心。\"老头说，\"搁下吧。搁下了，你哥那盏灯，能亮久一点。\"<\/p>\n<p>票子搁在灯座边上，没人再动。那盏灯的火头，轻轻往上跳了一下，又稳住了。<\/p>\n<p>我们顺着白汽指的方向往里看。廊的尽头，暖光化开的地方，立着一道门。<\/p>\n<p>石头门，比石室还高。门心嵌着一排铜鱼尾，一枚一枚，排得像鳞。<\/p>\n<p>当中那枚——鱼尾的尾巴，正轻轻地、轻轻地翘着，一翘，一落。<\/p>\n<p>像在喘气。<\/p>", "plain": "谁也没先迈步。 迎人的灯一盏一盏往门口亮，亮到廊子中段，停了。最前头那盏灯的火头，冲着门这边，轻轻地歪了一下——像有人站在龛边上，回头看了咱们一眼。 \"三十年前我到缝口，也这么停过一回。\"酒糟鼻把帽子扣回头上，\"灯停下来，是等你。你不进去，它就等。等烦了它自己回去——明儿再等。\" \"进去会怎么样？\"鱼哥问。 \"不知道。\"酒糟鼻说，\"我就是没敢进，才在外头活了三十年。\" 把头看了我一眼。我没等他开口：\"走。轮上了就不躲。\" 老头在前，酒糟鼻第二，我第三，把头跟着我，鱼哥挨着把头。草帽人举着罐走在中间偏后，做信人断后。瘦高个和矮个还跪在灯线边上没人叫他们——老头进廊前回头撂了一句：\"灭字的不配踩灯道。想补账，自己择日子。\" 进了廊，凉气从脚脖子往上爬。廊里的凉不是山里的凉，是那种存了两千年、没换过一口气的凉。 草帽人的罐这时候显出用处来了。罐口的白汽细成一根线，飘在众人前头半人高的地方，不散，像有人牵着一根看不见的香走。汽走到哪儿，脚下的廊就往下延伸到哪儿——路，是罐先探的。 \"罐走过的道，\"老头在前面走，头也不回，\"不会错。这条廊当年的送油人走过，接灯的走过，我哥走过。今儿你们走——是头一回，有活人揣着信走。\" 做信人一路走，一路用手背贴墙。走到后半截，他贴墙的手停住了。 \"墙是整块的山骨。\"他说，\"没有灰缝，没有包土——这门廊不是修出来的，是山里头本来就长着的。当年的人只是把龛凿了出来。\" \"凿龛的人，\"把头说，\"就是做信家？\" \"比我家早。\"做信人说，\"我家是后来守龛的。守着守着，分了三股——守龛的、点灯的、看账的。龛是山里的，账是人的。山里的事，人说了几千年算，今儿算一回准的。\" 头一个亮着的石龛就在眼前。灯底下，真是一双布鞋。千层底，针脚密得数不过来，鞋帮里还塞着两团纸——塞鞋的怕鞋走形，用的是旧报纸。报纸的日期，都发黄成一片影子了。 第二个龛，灯底下搁着一杆烟袋。烟袋锅是黄铜的，杆子盘得油亮，烟嘴缺了一块——缺口的茬是新的，掰断的，不是磕的。 再往里走，龛里摆的东西就杂了。半副护膝。一只手电筒，铁皮的，玻璃罩里还有两节电池，锈成一坨。一把瓦刀，木把儿包着布，布也糟了。麻绳，撬棍，安全帽，一只搪瓷缸子——缸子上印着\"先进生产者\"，磕掉了仨字。 \"都是家什。\"把头低声说，\"走的时候，手里拿什么，就搁什么。\" \"跟咱们进场子一个规矩。\"我说，\"家伙什不带走，人干干净净地走。\" 鱼哥走在我侧后，一直没出声。走到第七八个龛的时候，他忽然拽了一下我袖子。 \"峰哥。\"他声音低得快听不见，\"你看灯。\" 我看。廊这边一溜龛，亮着四盏。四盏灯的火头，齐齐朝一个方向偏——朝着我们来的方向，朝着门口那五盏灯。 \"灯是迎人的。\"鱼哥说，\"可它们火头朝外——\" \"是朝门口。\"我说。 \"不是。\"鱼哥摇头，他脸上一点血色都没有，\"我在后头看了半天了。它们不是朝门口。是朝你的后腰。\" 我的后腰上，揣着照魇镜和无字阴契。 我没接话。脚下没停。廊子往下走，龛位越深，摆的东西越老。再往里，报纸换成麻纸，铁器换成铜器——一枚铜带钩，一把铜削刀，一盏巴掌大的陶灯。陶灯龛里的火头，比前头的都稳，纹丝不动。 酒糟鼻越走越慢。走到一盏灯跟前，他站住了。 灯底下摆着一把瓦刀和半截麻绳。麻绳的绳头打着结，打得潦草，一看就是赶急。 \"是他俩的。\"酒糟鼻说。 \"谁？\" \"跟我一块儿下来的。\"他伸手碰了碰那截麻绳，又缩回来，没敢碰第二下，\"我半步惊退了灯，他俩进去了。三十……整整三十年，我一直当他们在山里烂着。\" \"那你要进去认认不？\"鱼哥低声问。 \"不了。\"酒糟鼻摇头，\"灯亮着，人就有下落。下落在灯里，不在我想里。我要是进去了，就是一个想进去看看的——这灯廊里，最不缺的就是想进去看看的。\" 他说这话的时候，声音平得吓人。可我看见他攥着帽子的那只手，指节全是白的。 老头在前头听着，忽然说了一句：\"当年你要是有这句话，师兄俩现在兴许都在沟外头晒太阳。\" \"当年我要有这句话，\"酒糟鼻说，\"我就不是我了。\" \"灯亮着。\"老头在前头说，\"灯亮着，就是有下落。\" 酒糟鼻在龛跟前蹲下了。这个在外头晃了三十年、烟酒不沾却满脸褶子像腌透了的老头，蹲在灯底下，肩膀一抽一抽，没哭出声。帽子摘了，攥在手里。 没人催他。 把头越过他往前走，走了几步，忽然也站住了。他站在一个龛前头，站得笔直，半天没动。 我凑过去。龛里的灯亮着。灯底下，铺着一块蓝布，蓝布上摆着一样东西——一枚黄铜的鱼尾。一寸来长，鱼尾分岔，岔尖磨得圆熟，鱼身上錾着极细的一道纹。 跟马渡霜家独屋里，那个封油坛的铜订金，一个模子出来的。 \"马家的。\"把头说。他声音平，可我听见他嗓子眼里发紧，\"三十多年前接灯没回来的那个——是马家的人。\" \"油是人家的。\"老头在前头应了一声，\"接灯的，也是人家的。那年订好的。\" 把头盯着那枚鱼尾看了半天，伸手从兜里摸出一样东西，搁在龛沿上——半张黄表纸，墨点鱼尾，是酒糟那年留下的记号，他一直收着。 \"我把该给的先给了。\"他说，\"马家那笔账，得马家自己来对。\" 我正想问什么叫马家自己来对，前头的草帽人忽然\"咦\"了一声。 我趁这空当，把一路看下来的灯在心里排了排。亮着的灯，火头都朝上，稳；可我注意到一件怪事——离门越近的龛，灯越暗，跟豆大的火头只剩一口气；越往深处，灯反而越亮。廊里的光不是越来越黑，是越来越黄、越来越沉，走到后半截，人像泡在一缸老油里。 \"灯往深处亮，\"我把这个发现说出来，\"不是照路——是里头的东西比外头的亮。\" \"灯廊的灯不照路。\"老头在前头应了一声，\"照的是名分。名分越重的，位子越深。\" \"那最深处那盏刚亮起来的呢？\" 老头没答。走了几步，他才说：\"最深的那盏，照的是没人敢接的账。\" 他手里的珍珠罐，罐身正在发热。磨残的鱼尾纹一圈一圈地泛亮，罐口没盖，一股白汽从罐口里冒出来——不多，就一根筷子那么细，笔直地立起来，不散。 白汽冲着的方向，是廊的深处。 \"罐看见路了。\"草帽人说，\"廊有底。底上有门。\" 往深处走之前，瘦高个和矮个到底还是跟进来了。老头许可的，撂了一句话：\"看灯可以，过灯线不行。\"哥俩进来，直奔一个方向——迎人的灯停住的那个龛。 那个龛亮着。灯底下摆着一样东西：一只帆布手套，五指张开，手心里朝天。手套是劳保那种，掌心磨穿了两个洞。 瘦高个在灯前头站住，看了半天，忽然弯腰，从自己裤腰里解下一样东西，轻轻搁在灯座边上——一沓票子，用皮筋勒着。 \"这是啥意思？\"鱼哥没忍住。 \"他买锁的钱。\"瘦高个说，\"钱是他出的，锁是我们仨使的。他走了，钱得归灯——他这辈子最后一笔账，不能烂在我们手里。\" 老头看着那沓票子，半晌，说了句：\"灯不收钱。\" \"那收什么？\" \"收你这个心。\"老头说，\"搁下吧。搁下了，你哥那盏灯，能亮久一点。\" 票子搁在灯座边上，没人再动。那盏灯的火头，轻轻往上跳了一下，又稳住了。 我们顺着白汽指的方向往里看。廊的尽头，暖光化开的地方，立着一道门。 石头门，比石室还高。门心嵌着一排铜鱼尾，一枚一枚，排得像鳞。 当中那枚——鱼尾的尾巴，正轻轻地、轻轻地翘着，一翘，一落。 像在喘气。"}, {"id": "A5-103", "arc": "A5", "num": 103, "title": "还灯", "md": "离那道门还有二十来步，脚底下起了台阶。\n\n三步一阶，阶面上磨得溜光，当中凹下去一道——两千年里，不知多少双脚从这儿踩过去，硬是踩出了一道辙。\n\n门跟前的地上，正对着门心，摆着一个石碗。碗不大，口径也就一拃，碗里是空的，碗沿上搭着一道旧磨痕。\n\n\"还灯处。\"做信人说。他走到碗边，蹲下看那道磨痕，\"进门的人，把随身的东西搁进碗里。搁了，人才算进去。\"\n\n\"跟龛里摆的家什一个理。\"把头说。\n\n\"不一样。\"做信人摇头，\"龛里搁的是'留下的'。碗里还的是'借来的'。灯是山的，人是借的——借的东西，得还。\"\n\n老头把这句话接了过去，一字一顿：\"还的要是名分，还的就是命。\"\n\n瘦高个和矮个不知什么时候也挪到了门口，跪在廊口没进来。这会儿瘦高个往前膝行了两步：\"问灯的。俺们哥俩……有东西还不？\"\n\n\"你们那一路，借得最多。\"老头说，\"三十年吹七盏灯——灯上的油、芯、位，一样没还。可这碗不收你们的东西。\"\n\n\"为啥？\"\n\n\"还账得先认账。\"老头说，\"你们今儿认的是灯，欠的是名分。名分这东西，碗收不了——得拿年头换。\"\n\n瘦高个把头磕下去，没再争。矮个从怀里摸出一样东西，隔着廊口，轻轻搁在阶边——那把铜锁。买来拴灯的那把。锁搁下，他往回退，一步没多站。\n\n\"这锁俺买的时候就想好了。\"矮个哑着嗓子说，\"锁是死的，搁这儿，算俺们哥俩先认一头。\"\n\n石碗前头，一时没人动。\n\n酒糟鼻先走过去了。他把那顶旧帽子摘下来，在手里翻了个面，帽子里的汗圈都磨秃了。他没犹豫，把帽子放进石碗。\n\n碗里的帽子，\"噗\"地瘪了下去。不是被压瘪的——是像被什么东西收走了里头的魂儿，布一下就糟了，塌成一顶旧年代的老帽子，跟龛里那些家什一个成色。\n\n\"记上了。\"老头说。\n\n碗里的东西不显堆。帽子搁进去，碗沿一点没变——像这物件进了碗，就不再是物件了，是账本上添的一笔。\n\n酒糟鼻站在碗边，看着自己那顶帽子，看了半天，忽然咧嘴笑了：\"三十年了。这帽子我戴了三十年，洗都舍不得洗。敢情是替人拿着的。\"\n\n他侧过身，把道让出来。\n\n草帽人第二个上。他把那只空油坛搁进碗里。坛子进碗，坛身上那圈黑蜡封印慢慢地褪了色，褪成一片素白。\n\n\"油过了江，也过了夜，还点过了灯。\"草帽人说，\"三规矩我替油背了。今儿还给山。\"\n\n轮到把头。他手伸进怀里，摸了很久。\n\n摸出来的时候，我看见是那个黄铜烟嘴。河滩验灰那晚，落在老柳树底下的烟嘴——烫手才扔的那个掐烟做派的物件。我一直当它是别处捡的。\n\n\"三十七年前，桓仁。\"把头捏着烟嘴，冲着老头，\"你受镜那晚，是不是有人递过你一根烟？\"\n\n老头的眼睛在灯影里眯了眯：\"递烟的是我哥。\"\n\n\"烟接了，命改了。\"把头把烟嘴搁进石碗，\"这烟嘴我带在身上三十七年，睡觉都搁枕头底下。今儿才明白——不是我的物件，是人家记我名的凭据。\"\n\n烟嘴落碗，铜色一暗，暗得跟龛里那杆烟袋一个色。\n\n把头退回来，走过我身边的时候，脚步顿了一下：\"小子。\"\n\n\"嗯。\"\n\n\"该你了。\"\n\n我身上有什么可还的？契是我的名分，不能还。镜是我看的眼睛，不能还。铜模和旧纸缝在褥子里——\n\n我摸到了那块蓝布。\n\n细针脚的蓝补丁布，问灯老头在扣锅台上给我的。\"线头在谁手里谁接线。\"我攥着它走了一路，一直没想明白这句话的分量。布角上那圈细针脚，一针挨着一针，密得像鱼鳞——针脚密到这个份上，就不是缝补，是记账。一针一笔，一笔一年。\n\n\"蓝布也是借的。\"我说。\n\n\"是。\"老头在门边说，\"三股分家那年，一人分了一块蓝布。做信的缝在模子上，掌灯的缝在灯笼上，问灯的——缝在账本上。你手里那块，是我哥的。他替我看灯，我看账，蓝布在我手里断了几十年，我把它给了你，是想让线接着。\"\n\n\"线接上了吗？\"\n\n\"你摸摸它。\"\n\n我把蓝布从怀里抽出来。就这一路，布角上多了一道针脚——不是针脚，是线。一根黑线，从布角钻出来，垂着，线头上拴着一个小小的结。\n\n结没拴死。是活扣。\n\n\"线活了，就说明有人在那头接。\"老头说，\"还了吧。别攥着。攥着线，你就走不出去了。\"\n\n我把蓝布放进了石碗。\n\n布一进碗，那根黑线\"嗖\"地缩了回去，线头带着活扣，消失在布纹里。布色一下沉了，沉成一块旧蓝布，躺在碗里，跟帽子、烟嘴、油坛躺成一片。\n\n碗没响。可我听见老头出了一口气——这口气，他憋了三十七年。三十七年，换碗里这一下轻轻的挨上。值不值，只有问灯的自己心里有数。\n\n收回手的时候，我发现自己的手在抖。不是怕——是这布我揣了这么些天，夜里睡觉都压在枕头底下。人是这么个贱性：东西不值钱，揣久了就长肉里。还东西那一刻，像自己揭自己一块皮。\n\n把头在我旁边站着，看着碗，忽然说：\"疼就对了。还东西不疼的，那还不是还——是扔。\"\n\n我一愣。这话糙，理不糙。酒糟鼻那顶帽子，把头那个烟嘴，草帽人那坛油——没有一样是好还的。可正因为疼，才说明这账是真账，不是应付山的手势。\n\n\"你们四个，\"老头看着石碗，声音低下去，\"一个是外路来还帽子的，一个是借烟看了一辈子道的，一个替油背了三规矩的，一个替我哥续了线的。这碗里的东西，比我三十七年问下来的账，都齐整。\"\n\n他说完，弯腰把石碗端了起来，端得很稳，往门心那枚铜鱼尾底下一放。\n\n碗一挨着门根，那枚鱼尾的尾巴，又轻轻地动了一下——比先前那次动得缓，也动得实。像一只手，把递过来的东西，接住了。\n\n鱼哥没东西还。他两手空空站在碗边，急得直搓手。老头看了他一眼：\"你没借。你的账在梦那头记着，山知道。\"\n\n\"梦那头？\"鱼哥一头雾水，\"我欠山啥了？\"\n\n\"你没欠。\"老头说，\"是山欠你的，欠你一双醒着的眼睛。七盏灯的梦，不是病——是山借你的眼睛看事儿。看完了，山自会还你。\"\n\n鱼哥张了张嘴，没敢再问。他退到我身边，压着嗓子：\"峰哥，他这话我咋听着像说我，又不像说我。\"\n\n\"别琢磨了。\"我说，\"山借的东西，它自己会收。你把梦记全了，比什么都强。\"\n\n做信人退开半步，冲着那道门，抬手——\n\n做信人最后。他解开褂子，从贴胸的口袋里，摸出一个布包，一层一层打开——一块铜模子，鱼尾阴纹，跟缝在我褥子里的那个，一模一样。\n\n\"双模。\"他跟我说，\"你家匣子里那个，是我搁的。这个，是祖上留下的。两块模子，一块做信，一块验信——验信的这块，今儿还给山。\"\n\n铜模落碗，\"当啷\"一声，是这一晚上，石碗里第一声金属的响。\n\n做信人直起身，冲着碗又作了一个揖。他这个揖作得跟老头那个不一样——老头的揖是给门的，他这个是给碗里那些东西的。\n\n\"做信的辈子不欠。\"他说，\"欠了，就还模子。这规矩是我太爷爷立下的——他说做信家手上过的每一样信物，都是替山保管的，保管人只许传，不许留。我今儿还了模子，才算把祖上那句话，落到了自己手上。\"\n\n都还完了，做信人退开半步，冲着那道门，抬手——\n\n门心的铜鱼尾，当中那一枚，不翘了。\n\n它直了。\n\n直得笔挺，像一枚刚钉上去的钉子。\n\n就在这时候，廊深处，很远的很深的地方，飘出来一个声音。\n\n不是男声，也不是女声。是喊——\n\n\"马家的闺女——\"\n\n那声音在石廊里转了一圈，转得又空又长。\n\n\"你师父的灯，亮了——\"\n\n草帽人手里的珍珠罐，\"嗡\"地一声，烫了起来。", "words": 2787, "html": "<p>离那道门还有二十来步，脚底下起了台阶。<\/p>\n<p>三步一阶，阶面上磨得溜光，当中凹下去一道——两千年里，不知多少双脚从这儿踩过去，硬是踩出了一道辙。<\/p>\n<p>门跟前的地上，正对着门心，摆着一个石碗。碗不大，口径也就一拃，碗里是空的，碗沿上搭着一道旧磨痕。<\/p>\n<p>\"还灯处。\"做信人说。他走到碗边，蹲下看那道磨痕，\"进门的人，把随身的东西搁进碗里。搁了，人才算进去。\"<\/p>\n<p>\"跟龛里摆的家什一个理。\"把头说。<\/p>\n<p>\"不一样。\"做信人摇头，\"龛里搁的是'留下的'。碗里还的是'借来的'。灯是山的，人是借的——借的东西，得还。\"<\/p>\n<p>老头把这句话接了过去，一字一顿：\"还的要是名分，还的就是命。\"<\/p>\n<p>瘦高个和矮个不知什么时候也挪到了门口，跪在廊口没进来。这会儿瘦高个往前膝行了两步：\"问灯的。俺们哥俩……有东西还不？\"<\/p>\n<p>\"你们那一路，借得最多。\"老头说，\"三十年吹七盏灯——灯上的油、芯、位，一样没还。可这碗不收你们的东西。\"<\/p>\n<p>\"为啥？\"<\/p>\n<p>\"还账得先认账。\"老头说，\"你们今儿认的是灯，欠的是名分。名分这东西，碗收不了——得拿年头换。\"<\/p>\n<p>瘦高个把头磕下去，没再争。矮个从怀里摸出一样东西，隔着廊口，轻轻搁在阶边——那把铜锁。买来拴灯的那把。锁搁下，他往回退，一步没多站。<\/p>\n<p>\"这锁俺买的时候就想好了。\"矮个哑着嗓子说，\"锁是死的，搁这儿，算俺们哥俩先认一头。\"<\/p>\n<p>石碗前头，一时没人动。<\/p>\n<p>酒糟鼻先走过去了。他把那顶旧帽子摘下来，在手里翻了个面，帽子里的汗圈都磨秃了。他没犹豫，把帽子放进石碗。<\/p>\n<p>碗里的帽子，\"噗\"地瘪了下去。不是被压瘪的——是像被什么东西收走了里头的魂儿，布一下就糟了，塌成一顶旧年代的老帽子，跟龛里那些家什一个成色。<\/p>\n<p>\"记上了。\"老头说。<\/p>\n<p>碗里的东西不显堆。帽子搁进去，碗沿一点没变——像这物件进了碗，就不再是物件了，是账本上添的一笔。<\/p>\n<p>酒糟鼻站在碗边，看着自己那顶帽子，看了半天，忽然咧嘴笑了：\"三十年了。这帽子我戴了三十年，洗都舍不得洗。敢情是替人拿着的。\"<\/p>\n<p>他侧过身，把道让出来。<\/p>\n<p>草帽人第二个上。他把那只空油坛搁进碗里。坛子进碗，坛身上那圈黑蜡封印慢慢地褪了色，褪成一片素白。<\/p>\n<p>\"油过了江，也过了夜，还点过了灯。\"草帽人说，\"三规矩我替油背了。今儿还给山。\"<\/p>\n<p>轮到把头。他手伸进怀里，摸了很久。<\/p>\n<p>摸出来的时候，我看见是那个黄铜烟嘴。河滩验灰那晚，落在老柳树底下的烟嘴——烫手才扔的那个掐烟做派的物件。我一直当它是别处捡的。<\/p>\n<p>\"三十七年前，桓仁。\"把头捏着烟嘴，冲着老头，\"你受镜那晚，是不是有人递过你一根烟？\"<\/p>\n<p>老头的眼睛在灯影里眯了眯：\"递烟的是我哥。\"<\/p>\n<p>\"烟接了，命改了。\"把头把烟嘴搁进石碗，\"这烟嘴我带在身上三十七年，睡觉都搁枕头底下。今儿才明白——不是我的物件，是人家记我名的凭据。\"<\/p>\n<p>烟嘴落碗，铜色一暗，暗得跟龛里那杆烟袋一个色。<\/p>\n<p>把头退回来，走过我身边的时候，脚步顿了一下：\"小子。\"<\/p>\n<p>\"嗯。\"<\/p>\n<p>\"该你了。\"<\/p>\n<p>我身上有什么可还的？契是我的名分，不能还。镜是我看的眼睛，不能还。铜模和旧纸缝在褥子里——<\/p>\n<p>我摸到了那块蓝布。<\/p>\n<p>细针脚的蓝补丁布，问灯老头在扣锅台上给我的。\"线头在谁手里谁接线。\"我攥着它走了一路，一直没想明白这句话的分量。布角上那圈细针脚，一针挨着一针，密得像鱼鳞——针脚密到这个份上，就不是缝补，是记账。一针一笔，一笔一年。<\/p>\n<p>\"蓝布也是借的。\"我说。<\/p>\n<p>\"是。\"老头在门边说，\"三股分家那年，一人分了一块蓝布。做信的缝在模子上，掌灯的缝在灯笼上，问灯的——缝在账本上。你手里那块，是我哥的。他替我看灯，我看账，蓝布在我手里断了几十年，我把它给了你，是想让线接着。\"<\/p>\n<p>\"线接上了吗？\"<\/p>\n<p>\"你摸摸它。\"<\/p>\n<p>我把蓝布从怀里抽出来。就这一路，布角上多了一道针脚——不是针脚，是线。一根黑线，从布角钻出来，垂着，线头上拴着一个小小的结。<\/p>\n<p>结没拴死。是活扣。<\/p>\n<p>\"线活了，就说明有人在那头接。\"老头说，\"还了吧。别攥着。攥着线，你就走不出去了。\"<\/p>\n<p>我把蓝布放进了石碗。<\/p>\n<p>布一进碗，那根黑线\"嗖\"地缩了回去，线头带着活扣，消失在布纹里。布色一下沉了，沉成一块旧蓝布，躺在碗里，跟帽子、烟嘴、油坛躺成一片。<\/p>\n<p>碗没响。可我听见老头出了一口气——这口气，他憋了三十七年。三十七年，换碗里这一下轻轻的挨上。值不值，只有问灯的自己心里有数。<\/p>\n<p>收回手的时候，我发现自己的手在抖。不是怕——是这布我揣了这么些天，夜里睡觉都压在枕头底下。人是这么个贱性：东西不值钱，揣久了就长肉里。还东西那一刻，像自己揭自己一块皮。<\/p>\n<p>把头在我旁边站着，看着碗，忽然说：\"疼就对了。还东西不疼的，那还不是还——是扔。\"<\/p>\n<p>我一愣。这话糙，理不糙。酒糟鼻那顶帽子，把头那个烟嘴，草帽人那坛油——没有一样是好还的。可正因为疼，才说明这账是真账，不是应付山的手势。<\/p>\n<p>\"你们四个，\"老头看着石碗，声音低下去，\"一个是外路来还帽子的，一个是借烟看了一辈子道的，一个替油背了三规矩的，一个替我哥续了线的。这碗里的东西，比我三十七年问下来的账，都齐整。\"<\/p>\n<p>他说完，弯腰把石碗端了起来，端得很稳，往门心那枚铜鱼尾底下一放。<\/p>\n<p>碗一挨着门根，那枚鱼尾的尾巴，又轻轻地动了一下——比先前那次动得缓，也动得实。像一只手，把递过来的东西，接住了。<\/p>\n<p>鱼哥没东西还。他两手空空站在碗边，急得直搓手。老头看了他一眼：\"你没借。你的账在梦那头记着，山知道。\"<\/p>\n<p>\"梦那头？\"鱼哥一头雾水，\"我欠山啥了？\"<\/p>\n<p>\"你没欠。\"老头说，\"是山欠你的，欠你一双醒着的眼睛。七盏灯的梦，不是病——是山借你的眼睛看事儿。看完了，山自会还你。\"<\/p>\n<p>鱼哥张了张嘴，没敢再问。他退到我身边，压着嗓子：\"峰哥，他这话我咋听着像说我，又不像说我。\"<\/p>\n<p>\"别琢磨了。\"我说，\"山借的东西，它自己会收。你把梦记全了，比什么都强。\"<\/p>\n<p>做信人退开半步，冲着那道门，抬手——<\/p>\n<p>做信人最后。他解开褂子，从贴胸的口袋里，摸出一个布包，一层一层打开——一块铜模子，鱼尾阴纹，跟缝在我褥子里的那个，一模一样。<\/p>\n<p>\"双模。\"他跟我说，\"你家匣子里那个，是我搁的。这个，是祖上留下的。两块模子，一块做信，一块验信——验信的这块，今儿还给山。\"<\/p>\n<p>铜模落碗，\"当啷\"一声，是这一晚上，石碗里第一声金属的响。<\/p>\n<p>做信人直起身，冲着碗又作了一个揖。他这个揖作得跟老头那个不一样——老头的揖是给门的，他这个是给碗里那些东西的。<\/p>\n<p>\"做信的辈子不欠。\"他说，\"欠了，就还模子。这规矩是我太爷爷立下的——他说做信家手上过的每一样信物，都是替山保管的，保管人只许传，不许留。我今儿还了模子，才算把祖上那句话，落到了自己手上。\"<\/p>\n<p>都还完了，做信人退开半步，冲着那道门，抬手——<\/p>\n<p>门心的铜鱼尾，当中那一枚，不翘了。<\/p>\n<p>它直了。<\/p>\n<p>直得笔挺，像一枚刚钉上去的钉子。<\/p>\n<p>就在这时候，廊深处，很远的很深的地方，飘出来一个声音。<\/p>\n<p>不是男声，也不是女声。是喊——<\/p>\n<p>\"马家的闺女——\"<\/p>\n<p>那声音在石廊里转了一圈，转得又空又长。<\/p>\n<p>\"你师父的灯，亮了——\"<\/p>\n<p>草帽人手里的珍珠罐，\"嗡\"地一声，烫了起来。<\/p>", "plain": "离那道门还有二十来步，脚底下起了台阶。 三步一阶，阶面上磨得溜光，当中凹下去一道——两千年里，不知多少双脚从这儿踩过去，硬是踩出了一道辙。 门跟前的地上，正对着门心，摆着一个石碗。碗不大，口径也就一拃，碗里是空的，碗沿上搭着一道旧磨痕。 \"还灯处。\"做信人说。他走到碗边，蹲下看那道磨痕，\"进门的人，把随身的东西搁进碗里。搁了，人才算进去。\" \"跟龛里摆的家什一个理。\"把头说。 \"不一样。\"做信人摇头，\"龛里搁的是'留下的'。碗里还的是'借来的'。灯是山的，人是借的——借的东西，得还。\" 老头把这句话接了过去，一字一顿：\"还的要是名分，还的就是命。\" 瘦高个和矮个不知什么时候也挪到了门口，跪在廊口没进来。这会儿瘦高个往前膝行了两步：\"问灯的。俺们哥俩……有东西还不？\" \"你们那一路，借得最多。\"老头说，\"三十年吹七盏灯——灯上的油、芯、位，一样没还。可这碗不收你们的东西。\" \"为啥？\" \"还账得先认账。\"老头说，\"你们今儿认的是灯，欠的是名分。名分这东西，碗收不了——得拿年头换。\" 瘦高个把头磕下去，没再争。矮个从怀里摸出一样东西，隔着廊口，轻轻搁在阶边——那把铜锁。买来拴灯的那把。锁搁下，他往回退，一步没多站。 \"这锁俺买的时候就想好了。\"矮个哑着嗓子说，\"锁是死的，搁这儿，算俺们哥俩先认一头。\" 石碗前头，一时没人动。 酒糟鼻先走过去了。他把那顶旧帽子摘下来，在手里翻了个面，帽子里的汗圈都磨秃了。他没犹豫，把帽子放进石碗。 碗里的帽子，\"噗\"地瘪了下去。不是被压瘪的——是像被什么东西收走了里头的魂儿，布一下就糟了，塌成一顶旧年代的老帽子，跟龛里那些家什一个成色。 \"记上了。\"老头说。 碗里的东西不显堆。帽子搁进去，碗沿一点没变——像这物件进了碗，就不再是物件了，是账本上添的一笔。 酒糟鼻站在碗边，看着自己那顶帽子，看了半天，忽然咧嘴笑了：\"三十年了。这帽子我戴了三十年，洗都舍不得洗。敢情是替人拿着的。\" 他侧过身，把道让出来。 草帽人第二个上。他把那只空油坛搁进碗里。坛子进碗，坛身上那圈黑蜡封印慢慢地褪了色，褪成一片素白。 \"油过了江，也过了夜，还点过了灯。\"草帽人说，\"三规矩我替油背了。今儿还给山。\" 轮到把头。他手伸进怀里，摸了很久。 摸出来的时候，我看见是那个黄铜烟嘴。河滩验灰那晚，落在老柳树底下的烟嘴——烫手才扔的那个掐烟做派的物件。我一直当它是别处捡的。 \"三十七年前，桓仁。\"把头捏着烟嘴，冲着老头，\"你受镜那晚，是不是有人递过你一根烟？\" 老头的眼睛在灯影里眯了眯：\"递烟的是我哥。\" \"烟接了，命改了。\"把头把烟嘴搁进石碗，\"这烟嘴我带在身上三十七年，睡觉都搁枕头底下。今儿才明白——不是我的物件，是人家记我名的凭据。\" 烟嘴落碗，铜色一暗，暗得跟龛里那杆烟袋一个色。 把头退回来，走过我身边的时候，脚步顿了一下：\"小子。\" \"嗯。\" \"该你了。\" 我身上有什么可还的？契是我的名分，不能还。镜是我看的眼睛，不能还。铜模和旧纸缝在褥子里—— 我摸到了那块蓝布。 细针脚的蓝补丁布，问灯老头在扣锅台上给我的。\"线头在谁手里谁接线。\"我攥着它走了一路，一直没想明白这句话的分量。布角上那圈细针脚，一针挨着一针，密得像鱼鳞——针脚密到这个份上，就不是缝补，是记账。一针一笔，一笔一年。 \"蓝布也是借的。\"我说。 \"是。\"老头在门边说，\"三股分家那年，一人分了一块蓝布。做信的缝在模子上，掌灯的缝在灯笼上，问灯的——缝在账本上。你手里那块，是我哥的。他替我看灯，我看账，蓝布在我手里断了几十年，我把它给了你，是想让线接着。\" \"线接上了吗？\" \"你摸摸它。\" 我把蓝布从怀里抽出来。就这一路，布角上多了一道针脚——不是针脚，是线。一根黑线，从布角钻出来，垂着，线头上拴着一个小小的结。 结没拴死。是活扣。 \"线活了，就说明有人在那头接。\"老头说，\"还了吧。别攥着。攥着线，你就走不出去了。\" 我把蓝布放进了石碗。 布一进碗，那根黑线\"嗖\"地缩了回去，线头带着活扣，消失在布纹里。布色一下沉了，沉成一块旧蓝布，躺在碗里，跟帽子、烟嘴、油坛躺成一片。 碗没响。可我听见老头出了一口气——这口气，他憋了三十七年。三十七年，换碗里这一下轻轻的挨上。值不值，只有问灯的自己心里有数。 收回手的时候，我发现自己的手在抖。不是怕——是这布我揣了这么些天，夜里睡觉都压在枕头底下。人是这么个贱性：东西不值钱，揣久了就长肉里。还东西那一刻，像自己揭自己一块皮。 把头在我旁边站着，看着碗，忽然说：\"疼就对了。还东西不疼的，那还不是还——是扔。\" 我一愣。这话糙，理不糙。酒糟鼻那顶帽子，把头那个烟嘴，草帽人那坛油——没有一样是好还的。可正因为疼，才说明这账是真账，不是应付山的手势。 \"你们四个，\"老头看着石碗，声音低下去，\"一个是外路来还帽子的，一个是借烟看了一辈子道的，一个替油背了三规矩的，一个替我哥续了线的。这碗里的东西，比我三十七年问下来的账，都齐整。\" 他说完，弯腰把石碗端了起来，端得很稳，往门心那枚铜鱼尾底下一放。 碗一挨着门根，那枚鱼尾的尾巴，又轻轻地动了一下——比先前那次动得缓，也动得实。像一只手，把递过来的东西，接住了。 鱼哥没东西还。他两手空空站在碗边，急得直搓手。老头看了他一眼：\"你没借。你的账在梦那头记着，山知道。\" \"梦那头？\"鱼哥一头雾水，\"我欠山啥了？\" \"你没欠。\"老头说，\"是山欠你的，欠你一双醒着的眼睛。七盏灯的梦，不是病——是山借你的眼睛看事儿。看完了，山自会还你。\" 鱼哥张了张嘴，没敢再问。他退到我身边，压着嗓子：\"峰哥，他这话我咋听着像说我，又不像说我。\" \"别琢磨了。\"我说，\"山借的东西，它自己会收。你把梦记全了，比什么都强。\" 做信人退开半步，冲着那道门，抬手—— 做信人最后。他解开褂子，从贴胸的口袋里，摸出一个布包，一层一层打开——一块铜模子，鱼尾阴纹，跟缝在我褥子里的那个，一模一样。 \"双模。\"他跟我说，\"你家匣子里那个，是我搁的。这个，是祖上留下的。两块模子，一块做信，一块验信——验信的这块，今儿还给山。\" 铜模落碗，\"当啷\"一声，是这一晚上，石碗里第一声金属的响。 做信人直起身，冲着碗又作了一个揖。他这个揖作得跟老头那个不一样——老头的揖是给门的，他这个是给碗里那些东西的。 \"做信的辈子不欠。\"他说，\"欠了，就还模子。这规矩是我太爷爷立下的——他说做信家手上过的每一样信物，都是替山保管的，保管人只许传，不许留。我今儿还了模子，才算把祖上那句话，落到了自己手上。\" 都还完了，做信人退开半步，冲着那道门，抬手—— 门心的铜鱼尾，当中那一枚，不翘了。 它直了。 直得笔挺，像一枚刚钉上去的钉子。 就在这时候，廊深处，很远的很深的地方，飘出来一个声音。 不是男声，也不是女声。是喊—— \"马家的闺女——\" 那声音在石廊里转了一圈，转得又空又长。 \"你师父的灯，亮了——\" 草帽人手里的珍珠罐，\"嗡\"地一声，烫了起来。"}, {"id": "A5-104", "arc": "A5", "num": 104, "title": "数人", "md": "罐烫，草帽人却没撒手。\n\n\"罐说这门后头有人。\"他哑着嗓子说，\"可我数了三遍了——廊里就咱们八个。\"\n\n\"谁说人得是喘气的。\"老头说。\n\n门没推。做信人把手掌贴在门心那枚直挺挺的铜鱼尾上，往外一带——门是活的，里头有轴，两千年没锈，就那么无声无息地朝里开了。\n\n门后没有廊，是一间圆厅。\n\n圆厅比盟坛石室大出三四倍。顶是整块的石头穹着，正当中凿着一个灯架——木头架，架身乌黑，像叫烟火熏了几千年。灯架上七层，每层一盏灯位。\n\n六盏亮着。第七层，空着。\n\n灯架四周，一圈一圈排着石墩。石墩不高，齐膝，一个挨一个，从灯架底下排出去，排到厅边的黑影里。每一个石墩上，都立着一盏灯。\n\n亮着的，百十来盏。黑着的，更多。\n\n每盏灯底下，压着一块木牌。\n\n老头进门就站住了，冲着那些石墩，慢慢摘了帽子。\n\n\"问灯的见了三代人。\"他说，\"头一代告诉我里头有灯，我不信。第二代领我到门口，我没敢进。第三代——\"\n\n他顿了顿。\n\n\"第三代就是你们。\"\n\n没人应声。这厅太大，太静，静得不像埋在地底下的地方——像有人常年在这儿住着，只是今儿都出去了。脚踩在石头地上，回音来得又快又短，走了两步我就放轻了脚——不是怕惊动什么，是这地方的静，压得人不敢出大声。\n\n草帽人举着罐，跟在老头身后。罐口的白汽进了厅，忽然散了，一缕一缕往四面八方飘——飘向那些亮着的灯。哪盏灯跟前有汽，哪盏灯的火头就亮一分。\n\n\"罐在点名。\"草帽人哑声说，\"有汽的，是信到过的。\"\n\n\"那没汽的呢？\"鱼哥问。\n\n草帽人没答。我顺着没汽的灯看过去——那些灯也都亮着，火头却发蓝，蓝得像隔着层冰。我不知道那些灯底下压的是什么账，可我心里咯噔一下：信没到过的位子，人也未必是安生的。\n\n做信人绕着石墩走了一圈，蹲下去看牌子。牌子上的字，刻得深，一笔一笔都是凿出来的。他看了一排，站起来，脸上没什么表情，可手在抖。\n\n\"都是名姓。\"他说，\"有名，有姓，有年头。最早的一块——\"\n\n他念：\"东明，建国前，灯位一座。\"\n\n再往后，朝代一年一年往下排。牌子越排越新，字越刻越浅。最深一排的木牌上，有的字还没干透——是墨写的，没来得及刻。\n\n把头也蹲下去看。他看的不是年头，是姓氏。看了一排，直起腰，又看下一排，嘴里低声念：\"佟、马、关、白、富……\"念了一串，他站起来，脸上的沟壑更深了。\n\n\"东北的老姓。\"他说，\"一半是闯关东的，一半是山里土生土长的。这满厅的灯，一盏一个姓——不是一群人守一座山，是山里千百年，一辈一辈出的守灯人。\"\n\n\"咱们这样的外路人呢？\"鱼哥问。\n\n\"外路人不立牌。\"老头说，\"外路人的位子，一进门就悬在头上。悬多久，看账清多久。\"\n\n草帽人一直没挪窝。他举着罐，把整个厅看了一遍，忽然说：\"这厅里的灯，怎么都对。\"\n\n\"对？\"\n\n\"火头。\"草帽人说，\"我掌了这些年灯，灯的火头没有一盏是直的——外头的灯，风也好火也好，多少都歪。这厅里的灯，一盏是一盏，火头齐上，齐得像排过队。\"\n\n\"灯对火头，\"老头说，\"是里头的名分都服管。\"\n\n\"管它们的是谁？\"\n\n老头抬起头，看着穹顶正中那七层的木灯架，半晌，答非所问地说了一句：\"老架子。厅里就它一样新东西没有——连它自己，都比外头那些石墩老。\"\n\n\"架子是谁搭的？\"\n\n\"没人搭。\"老头说，\"架子是山里的根。灯是挂上去的，架子是本来就有的。\"\n\n鱼哥一直贴着把头走。走到一排石墩跟前，他忽然不走了。\n\n\"峰哥。\"他声音不对，\"你过来。\"\n\n我过去。他指给我看其中一个石墩。灯亮着，灯底下压着一块木牌，牌上刻着三个字。\n\n\"马，承，灯。\"\n\n马承灯。\n\n\"马家接灯的。\"把头走过来，看了一眼，脸上的褶子全沉下去了，\"马渡霜的太爷爷，就叫这个名。她跟我说过——家里祖上出过一个'进去的'，名讳犯忌讳，家里不提。\"\n\n\"灯亮着。\"老头说，\"三十年前那年接灯，廊里还回来的，是这盏灯后头的人。\"\n\n他冲那盏灯拱了拱手：\"马家这盏，我问了三代。今儿见了灯，我这本账，也算画上一个数。\"\n\n\"是马渡霜的太爷爷，还是她师父的师兄？\"我问。\n\n\"都是。\"老头说，\"一盏灯，一个位。接灯的换了人，位不变。\"\n\n我盯着那块牌子。马承灯。灯亮着，火头稳稳的，跟龛里的灯一样纹丝不动。可灯座跟前，摆着一双鞋——女式的，千层底，鞋帮上绣着一圈极小的鱼尾纹。\n\n绣工，跟马渡霜纳的鞋，一个路数。\n\n\"这是她做的鞋。\"我说。\n\n\"做鞋的不一定给活人穿。\"老头说。\n\n瘦高个和矮个一直没进来——老头不许。这会儿厅里的话传出去，瘦高个在门外忽然喊了一声：\"问灯的！我们那一路的账，今儿到底怎么算！\"\n\n老头没回头：\"灯记着。\"\n\n\"记着什么！\"\n\n\"你们灭字一路，三十年吹了七盏灯。\"老头说，\"吹一盏，这厅里就黑一位。你们吹的是灯——欠的是名分。今儿灯自己亮回来了，欠的就得补。\"\n\n\"怎么补？\"\n\n\"一盏一盏，赔。\"老头说，\"人在廊里守灯，灯亮一盏，守一年。守到百十来盏全亮回来——你们的账，才算平。\"\n\n\"多少年？\"瘦高个的声音抖了。\n\n\"账没算清之前，不问年头。\"老头说，\"你们那一道的人，三十年前就该懂这个规矩——山上的账，从来不按天算。\"\n\n门外没声了。半晌，传来\"咚\"的一声——是膝盖磕在石头地上的响。跟着是第二声。瘦高个和矮个，冲着厅门磕了头。\n\n\"我们守。\"瘦高个说，\"高个哥的灯要是亮在里头，我们哥俩替他守。守到账平，我们再出去——出去的那天，这只手欠下的，我们连本带利认。\"\n\n老头这才回过身，隔着门看他们哥俩一眼：\"灯记你们这一笔。\"\n\n哥俩退回廊口守着。厅里这一场对账，才算翻过篇去。我借灯亮的当口把厅又扫了一遍——石墩一圈套着一圈，越往外，灯越黑，牌上的名姓也越旧。最外圈的黑灯，牌子都朽了边，字只剩个轮廓。可没有一个牌子是空的。\n\n位子空着不立牌，牌立着人不空——这厅里的规矩，就这么硬。硬得叫人心里发沉，又叫人挑不出一个字的错。这规矩比外头任何一行的行规都老，老到没人记得是谁立的——可一进这厅，没人想试。\n\n把头一直没说话。他从进门起，眼睛就没离开正当中那个七层灯架。我顺着他的目光看过去——七盏灯，六亮一空。\n\n\"鱼哥。\"把头忽然说，\"你数数。\"\n\n鱼哥不明白：\"数啥？\"\n\n\"数灯。\"\n\n鱼哥抬头，一层一层地数：\"一、二、三……六。\"他数完六，目光落到空着的第七层，嘴唇动了两下，没出声。\n\n\"说。\"把头盯着他。\n\n\"七盏。\"鱼哥的声音抖了，\"七盏灯，六亮……少一盏。\"\n\n他忽然伸手抓住了我的胳膊，抓得死紧，眼睛瞪得极大——那不是害怕的眼神，是梦里见过一遍、如今睁着眼又看见一遍的眼神。\n\n\"峰哥，\"他说，\"我那梦。七盏灯，一盏往外爬——爬的不是灯。\"\n\n\"是什么？\"\n\n\"是位子。\"鱼哥一个字一个字地说，\"位子往外爬。爬到门口……等人坐。\"\n\n厅里所有的灯，火头齐齐一压。\n\n我们都朝那个空着的第七层看过去。第七层的灯位上没有灯，可灯座上——压着一块牌子。\n\n别处的牌子都是旧木头，旧墨。\n\n这一块，是新的。刀茬白生生的，顶多十天。\n\n我走近了两步，看清了上头刻的字。\n\n就一个字。刻得深，刻得狠，一笔一笔都是当真下过力气凿的——\n\n项。\n\n我姓项。这满厅的名姓，姓这个的，只有我一个。", "words": 2790, "html": "<p>罐烫，草帽人却没撒手。<\/p>\n<p>\"罐说这门后头有人。\"他哑着嗓子说，\"可我数了三遍了——廊里就咱们八个。\"<\/p>\n<p>\"谁说人得是喘气的。\"老头说。<\/p>\n<p>门没推。做信人把手掌贴在门心那枚直挺挺的铜鱼尾上，往外一带——门是活的，里头有轴，两千年没锈，就那么无声无息地朝里开了。<\/p>\n<p>门后没有廊，是一间圆厅。<\/p>\n<p>圆厅比盟坛石室大出三四倍。顶是整块的石头穹着，正当中凿着一个灯架——木头架，架身乌黑，像叫烟火熏了几千年。灯架上七层，每层一盏灯位。<\/p>\n<p>六盏亮着。第七层，空着。<\/p>\n<p>灯架四周，一圈一圈排着石墩。石墩不高，齐膝，一个挨一个，从灯架底下排出去，排到厅边的黑影里。每一个石墩上，都立着一盏灯。<\/p>\n<p>亮着的，百十来盏。黑着的，更多。<\/p>\n<p>每盏灯底下，压着一块木牌。<\/p>\n<p>老头进门就站住了，冲着那些石墩，慢慢摘了帽子。<\/p>\n<p>\"问灯的见了三代人。\"他说，\"头一代告诉我里头有灯，我不信。第二代领我到门口，我没敢进。第三代——\"<\/p>\n<p>他顿了顿。<\/p>\n<p>\"第三代就是你们。\"<\/p>\n<p>没人应声。这厅太大，太静，静得不像埋在地底下的地方——像有人常年在这儿住着，只是今儿都出去了。脚踩在石头地上，回音来得又快又短，走了两步我就放轻了脚——不是怕惊动什么，是这地方的静，压得人不敢出大声。<\/p>\n<p>草帽人举着罐，跟在老头身后。罐口的白汽进了厅，忽然散了，一缕一缕往四面八方飘——飘向那些亮着的灯。哪盏灯跟前有汽，哪盏灯的火头就亮一分。<\/p>\n<p>\"罐在点名。\"草帽人哑声说，\"有汽的，是信到过的。\"<\/p>\n<p>\"那没汽的呢？\"鱼哥问。<\/p>\n<p>草帽人没答。我顺着没汽的灯看过去——那些灯也都亮着，火头却发蓝，蓝得像隔着层冰。我不知道那些灯底下压的是什么账，可我心里咯噔一下：信没到过的位子，人也未必是安生的。<\/p>\n<p>做信人绕着石墩走了一圈，蹲下去看牌子。牌子上的字，刻得深，一笔一笔都是凿出来的。他看了一排，站起来，脸上没什么表情，可手在抖。<\/p>\n<p>\"都是名姓。\"他说，\"有名，有姓，有年头。最早的一块——\"<\/p>\n<p>他念：\"东明，建国前，灯位一座。\"<\/p>\n<p>再往后，朝代一年一年往下排。牌子越排越新，字越刻越浅。最深一排的木牌上，有的字还没干透——是墨写的，没来得及刻。<\/p>\n<p>把头也蹲下去看。他看的不是年头，是姓氏。看了一排，直起腰，又看下一排，嘴里低声念：\"佟、马、关、白、富……\"念了一串，他站起来，脸上的沟壑更深了。<\/p>\n<p>\"东北的老姓。\"他说，\"一半是闯关东的，一半是山里土生土长的。这满厅的灯，一盏一个姓——不是一群人守一座山，是山里千百年，一辈一辈出的守灯人。\"<\/p>\n<p>\"咱们这样的外路人呢？\"鱼哥问。<\/p>\n<p>\"外路人不立牌。\"老头说，\"外路人的位子，一进门就悬在头上。悬多久，看账清多久。\"<\/p>\n<p>草帽人一直没挪窝。他举着罐，把整个厅看了一遍，忽然说：\"这厅里的灯，怎么都对。\"<\/p>\n<p>\"对？\"<\/p>\n<p>\"火头。\"草帽人说，\"我掌了这些年灯，灯的火头没有一盏是直的——外头的灯，风也好火也好，多少都歪。这厅里的灯，一盏是一盏，火头齐上，齐得像排过队。\"<\/p>\n<p>\"灯对火头，\"老头说，\"是里头的名分都服管。\"<\/p>\n<p>\"管它们的是谁？\"<\/p>\n<p>老头抬起头，看着穹顶正中那七层的木灯架，半晌，答非所问地说了一句：\"老架子。厅里就它一样新东西没有——连它自己，都比外头那些石墩老。\"<\/p>\n<p>\"架子是谁搭的？\"<\/p>\n<p>\"没人搭。\"老头说，\"架子是山里的根。灯是挂上去的，架子是本来就有的。\"<\/p>\n<p>鱼哥一直贴着把头走。走到一排石墩跟前，他忽然不走了。<\/p>\n<p>\"峰哥。\"他声音不对，\"你过来。\"<\/p>\n<p>我过去。他指给我看其中一个石墩。灯亮着，灯底下压着一块木牌，牌上刻着三个字。<\/p>\n<p>\"马，承，灯。\"<\/p>\n<p>马承灯。<\/p>\n<p>\"马家接灯的。\"把头走过来，看了一眼，脸上的褶子全沉下去了，\"马渡霜的太爷爷，就叫这个名。她跟我说过——家里祖上出过一个'进去的'，名讳犯忌讳，家里不提。\"<\/p>\n<p>\"灯亮着。\"老头说，\"三十年前那年接灯，廊里还回来的，是这盏灯后头的人。\"<\/p>\n<p>他冲那盏灯拱了拱手：\"马家这盏，我问了三代。今儿见了灯，我这本账，也算画上一个数。\"<\/p>\n<p>\"是马渡霜的太爷爷，还是她师父的师兄？\"我问。<\/p>\n<p>\"都是。\"老头说，\"一盏灯，一个位。接灯的换了人，位不变。\"<\/p>\n<p>我盯着那块牌子。马承灯。灯亮着，火头稳稳的，跟龛里的灯一样纹丝不动。可灯座跟前，摆着一双鞋——女式的，千层底，鞋帮上绣着一圈极小的鱼尾纹。<\/p>\n<p>绣工，跟马渡霜纳的鞋，一个路数。<\/p>\n<p>\"这是她做的鞋。\"我说。<\/p>\n<p>\"做鞋的不一定给活人穿。\"老头说。<\/p>\n<p>瘦高个和矮个一直没进来——老头不许。这会儿厅里的话传出去，瘦高个在门外忽然喊了一声：\"问灯的！我们那一路的账，今儿到底怎么算！\"<\/p>\n<p>老头没回头：\"灯记着。\"<\/p>\n<p>\"记着什么！\"<\/p>\n<p>\"你们灭字一路，三十年吹了七盏灯。\"老头说，\"吹一盏，这厅里就黑一位。你们吹的是灯——欠的是名分。今儿灯自己亮回来了，欠的就得补。\"<\/p>\n<p>\"怎么补？\"<\/p>\n<p>\"一盏一盏，赔。\"老头说，\"人在廊里守灯，灯亮一盏，守一年。守到百十来盏全亮回来——你们的账，才算平。\"<\/p>\n<p>\"多少年？\"瘦高个的声音抖了。<\/p>\n<p>\"账没算清之前，不问年头。\"老头说，\"你们那一道的人，三十年前就该懂这个规矩——山上的账，从来不按天算。\"<\/p>\n<p>门外没声了。半晌，传来\"咚\"的一声——是膝盖磕在石头地上的响。跟着是第二声。瘦高个和矮个，冲着厅门磕了头。<\/p>\n<p>\"我们守。\"瘦高个说，\"高个哥的灯要是亮在里头，我们哥俩替他守。守到账平，我们再出去——出去的那天，这只手欠下的，我们连本带利认。\"<\/p>\n<p>老头这才回过身，隔着门看他们哥俩一眼：\"灯记你们这一笔。\"<\/p>\n<p>哥俩退回廊口守着。厅里这一场对账，才算翻过篇去。我借灯亮的当口把厅又扫了一遍——石墩一圈套着一圈，越往外，灯越黑，牌上的名姓也越旧。最外圈的黑灯，牌子都朽了边，字只剩个轮廓。可没有一个牌子是空的。<\/p>\n<p>位子空着不立牌，牌立着人不空——这厅里的规矩，就这么硬。硬得叫人心里发沉，又叫人挑不出一个字的错。这规矩比外头任何一行的行规都老，老到没人记得是谁立的——可一进这厅，没人想试。<\/p>\n<p>把头一直没说话。他从进门起，眼睛就没离开正当中那个七层灯架。我顺着他的目光看过去——七盏灯，六亮一空。<\/p>\n<p>\"鱼哥。\"把头忽然说，\"你数数。\"<\/p>\n<p>鱼哥不明白：\"数啥？\"<\/p>\n<p>\"数灯。\"<\/p>\n<p>鱼哥抬头，一层一层地数：\"一、二、三……六。\"他数完六，目光落到空着的第七层，嘴唇动了两下，没出声。<\/p>\n<p>\"说。\"把头盯着他。<\/p>\n<p>\"七盏。\"鱼哥的声音抖了，\"七盏灯，六亮……少一盏。\"<\/p>\n<p>他忽然伸手抓住了我的胳膊，抓得死紧，眼睛瞪得极大——那不是害怕的眼神，是梦里见过一遍、如今睁着眼又看见一遍的眼神。<\/p>\n<p>\"峰哥，\"他说，\"我那梦。七盏灯，一盏往外爬——爬的不是灯。\"<\/p>\n<p>\"是什么？\"<\/p>\n<p>\"是位子。\"鱼哥一个字一个字地说，\"位子往外爬。爬到门口……等人坐。\"<\/p>\n<p>厅里所有的灯，火头齐齐一压。<\/p>\n<p>我们都朝那个空着的第七层看过去。第七层的灯位上没有灯，可灯座上——压着一块牌子。<\/p>\n<p>别处的牌子都是旧木头，旧墨。<\/p>\n<p>这一块，是新的。刀茬白生生的，顶多十天。<\/p>\n<p>我走近了两步，看清了上头刻的字。<\/p>\n<p>就一个字。刻得深，刻得狠，一笔一笔都是当真下过力气凿的——<\/p>\n<p>项。<\/p>\n<p>我姓项。这满厅的名姓，姓这个的，只有我一个。<\/p>", "plain": "罐烫，草帽人却没撒手。 \"罐说这门后头有人。\"他哑着嗓子说，\"可我数了三遍了——廊里就咱们八个。\" \"谁说人得是喘气的。\"老头说。 门没推。做信人把手掌贴在门心那枚直挺挺的铜鱼尾上，往外一带——门是活的，里头有轴，两千年没锈，就那么无声无息地朝里开了。 门后没有廊，是一间圆厅。 圆厅比盟坛石室大出三四倍。顶是整块的石头穹着，正当中凿着一个灯架——木头架，架身乌黑，像叫烟火熏了几千年。灯架上七层，每层一盏灯位。 六盏亮着。第七层，空着。 灯架四周，一圈一圈排着石墩。石墩不高，齐膝，一个挨一个，从灯架底下排出去，排到厅边的黑影里。每一个石墩上，都立着一盏灯。 亮着的，百十来盏。黑着的，更多。 每盏灯底下，压着一块木牌。 老头进门就站住了，冲着那些石墩，慢慢摘了帽子。 \"问灯的见了三代人。\"他说，\"头一代告诉我里头有灯，我不信。第二代领我到门口，我没敢进。第三代——\" 他顿了顿。 \"第三代就是你们。\" 没人应声。这厅太大，太静，静得不像埋在地底下的地方——像有人常年在这儿住着，只是今儿都出去了。脚踩在石头地上，回音来得又快又短，走了两步我就放轻了脚——不是怕惊动什么，是这地方的静，压得人不敢出大声。 草帽人举着罐，跟在老头身后。罐口的白汽进了厅，忽然散了，一缕一缕往四面八方飘——飘向那些亮着的灯。哪盏灯跟前有汽，哪盏灯的火头就亮一分。 \"罐在点名。\"草帽人哑声说，\"有汽的，是信到过的。\" \"那没汽的呢？\"鱼哥问。 草帽人没答。我顺着没汽的灯看过去——那些灯也都亮着，火头却发蓝，蓝得像隔着层冰。我不知道那些灯底下压的是什么账，可我心里咯噔一下：信没到过的位子，人也未必是安生的。 做信人绕着石墩走了一圈，蹲下去看牌子。牌子上的字，刻得深，一笔一笔都是凿出来的。他看了一排，站起来，脸上没什么表情，可手在抖。 \"都是名姓。\"他说，\"有名，有姓，有年头。最早的一块——\" 他念：\"东明，建国前，灯位一座。\" 再往后，朝代一年一年往下排。牌子越排越新，字越刻越浅。最深一排的木牌上，有的字还没干透——是墨写的，没来得及刻。 把头也蹲下去看。他看的不是年头，是姓氏。看了一排，直起腰，又看下一排，嘴里低声念：\"佟、马、关、白、富……\"念了一串，他站起来，脸上的沟壑更深了。 \"东北的老姓。\"他说，\"一半是闯关东的，一半是山里土生土长的。这满厅的灯，一盏一个姓——不是一群人守一座山，是山里千百年，一辈一辈出的守灯人。\" \"咱们这样的外路人呢？\"鱼哥问。 \"外路人不立牌。\"老头说，\"外路人的位子，一进门就悬在头上。悬多久，看账清多久。\" 草帽人一直没挪窝。他举着罐，把整个厅看了一遍，忽然说：\"这厅里的灯，怎么都对。\" \"对？\" \"火头。\"草帽人说，\"我掌了这些年灯，灯的火头没有一盏是直的——外头的灯，风也好火也好，多少都歪。这厅里的灯，一盏是一盏，火头齐上，齐得像排过队。\" \"灯对火头，\"老头说，\"是里头的名分都服管。\" \"管它们的是谁？\" 老头抬起头，看着穹顶正中那七层的木灯架，半晌，答非所问地说了一句：\"老架子。厅里就它一样新东西没有——连它自己，都比外头那些石墩老。\" \"架子是谁搭的？\" \"没人搭。\"老头说，\"架子是山里的根。灯是挂上去的，架子是本来就有的。\" 鱼哥一直贴着把头走。走到一排石墩跟前，他忽然不走了。 \"峰哥。\"他声音不对，\"你过来。\" 我过去。他指给我看其中一个石墩。灯亮着，灯底下压着一块木牌，牌上刻着三个字。 \"马，承，灯。\" 马承灯。 \"马家接灯的。\"把头走过来，看了一眼，脸上的褶子全沉下去了，\"马渡霜的太爷爷，就叫这个名。她跟我说过——家里祖上出过一个'进去的'，名讳犯忌讳，家里不提。\" \"灯亮着。\"老头说，\"三十年前那年接灯，廊里还回来的，是这盏灯后头的人。\" 他冲那盏灯拱了拱手：\"马家这盏，我问了三代。今儿见了灯，我这本账，也算画上一个数。\" \"是马渡霜的太爷爷，还是她师父的师兄？\"我问。 \"都是。\"老头说，\"一盏灯，一个位。接灯的换了人，位不变。\" 我盯着那块牌子。马承灯。灯亮着，火头稳稳的，跟龛里的灯一样纹丝不动。可灯座跟前，摆着一双鞋——女式的，千层底，鞋帮上绣着一圈极小的鱼尾纹。 绣工，跟马渡霜纳的鞋，一个路数。 \"这是她做的鞋。\"我说。 \"做鞋的不一定给活人穿。\"老头说。 瘦高个和矮个一直没进来——老头不许。这会儿厅里的话传出去，瘦高个在门外忽然喊了一声：\"问灯的！我们那一路的账，今儿到底怎么算！\" 老头没回头：\"灯记着。\" \"记着什么！\" \"你们灭字一路，三十年吹了七盏灯。\"老头说，\"吹一盏，这厅里就黑一位。你们吹的是灯——欠的是名分。今儿灯自己亮回来了，欠的就得补。\" \"怎么补？\" \"一盏一盏，赔。\"老头说，\"人在廊里守灯，灯亮一盏，守一年。守到百十来盏全亮回来——你们的账，才算平。\" \"多少年？\"瘦高个的声音抖了。 \"账没算清之前，不问年头。\"老头说，\"你们那一道的人，三十年前就该懂这个规矩——山上的账，从来不按天算。\" 门外没声了。半晌，传来\"咚\"的一声——是膝盖磕在石头地上的响。跟着是第二声。瘦高个和矮个，冲着厅门磕了头。 \"我们守。\"瘦高个说，\"高个哥的灯要是亮在里头，我们哥俩替他守。守到账平，我们再出去——出去的那天，这只手欠下的，我们连本带利认。\" 老头这才回过身，隔着门看他们哥俩一眼：\"灯记你们这一笔。\" 哥俩退回廊口守着。厅里这一场对账，才算翻过篇去。我借灯亮的当口把厅又扫了一遍——石墩一圈套着一圈，越往外，灯越黑，牌上的名姓也越旧。最外圈的黑灯，牌子都朽了边，字只剩个轮廓。可没有一个牌子是空的。 位子空着不立牌，牌立着人不空——这厅里的规矩，就这么硬。硬得叫人心里发沉，又叫人挑不出一个字的错。这规矩比外头任何一行的行规都老，老到没人记得是谁立的——可一进这厅，没人想试。 把头一直没说话。他从进门起，眼睛就没离开正当中那个七层灯架。我顺着他的目光看过去——七盏灯，六亮一空。 \"鱼哥。\"把头忽然说，\"你数数。\" 鱼哥不明白：\"数啥？\" \"数灯。\" 鱼哥抬头，一层一层地数：\"一、二、三……六。\"他数完六，目光落到空着的第七层，嘴唇动了两下，没出声。 \"说。\"把头盯着他。 \"七盏。\"鱼哥的声音抖了，\"七盏灯，六亮……少一盏。\" 他忽然伸手抓住了我的胳膊，抓得死紧，眼睛瞪得极大——那不是害怕的眼神，是梦里见过一遍、如今睁着眼又看见一遍的眼神。 \"峰哥，\"他说，\"我那梦。七盏灯，一盏往外爬——爬的不是灯。\" \"是什么？\" \"是位子。\"鱼哥一个字一个字地说，\"位子往外爬。爬到门口……等人坐。\" 厅里所有的灯，火头齐齐一压。 我们都朝那个空着的第七层看过去。第七层的灯位上没有灯，可灯座上——压着一块牌子。 别处的牌子都是旧木头，旧墨。 这一块，是新的。刀茬白生生的，顶多十天。 我走近了两步，看清了上头刻的字。 就一个字。刻得深，刻得狠，一笔一笔都是当真下过力气凿的—— 项。 我姓项。这满厅的名姓，姓这个的，只有我一个。"}, {"id": "A5-105", "arc": "A5", "num": 105, "title": "大事", "md": "那块牌子底下压着的东西，也露出一角。\n\n蓝布。跟我还进石碗里的那块，一样的蓝，一样的细针脚。\n\n\"谁的？\"把头在我身后问，声音沉得像从地底下上来的。\n\n\"不知道。\"老头说。他走过来，看了看那个字，眉头拧紧了，\"做牌的规矩，厅里名姓，人走了才立牌。这牌——人没走，牌先立了。\"\n\n\"谁立的？\"\n\n\"立牌的刀法，我认得。\"做信人在一边说。他把那块牌拿起来，对着灯看凿痕，\"不是凿，是刻。用刻碑的手——满厅里头，会用这手的，一家。\"\n\n\"做信家？\"\n\n\"做信家立牌三十年了。\"做信人说，\"可这块，不是我立的。\"\n\n他把牌子翻过来。牌子背面，还刻着一行小字，字更小，凑着灯才看得清：\n\n\"灯记名分。认账那日，牌已成。\"\n\n认账那日。四月廿七夜里，扣锅台上，我说了那个\"认\"字。\n\n我把日子在心里过了一遍，后脊梁一层一层地冒凉气。那晚我认账，天南地北的人都在，灯芯还攥在老头手里——那晚之后，这块牌子就刻好了。刻牌的人不知道是谁，可他听见了那一声\"认\"。\n\n\"灯亮一盏，走一个。\"老头把牌子放回灯座，看着我，\"你认了账，牌就等你。今儿七盏里空的那一盏，是你的。\"\n\n\"我不进去。\"我把话说死了，\"我的位子在沟外头。\"\n\n\"位子不归你挑。\"老头说，\"名分也不归。契在你身上，牌在灯座上——这厅里从来就没讲过'归不归'，只讲'轮没轮'。\"\n\n我梗着脖子还想争，把头抬手拦了我。\n\n\"先别争。\"他说，\"牌是牌子，灯是灯。牌立了没点灯，就还有话说。\"\n\n他把头转向门那边：\"外头那位——既然来了，进来吧。\"\n\n我们都朝门看过去。\n\n门外的廊里，不知什么时候，多了一双鞋。一双黑布鞋，鞋帮干净，鞋底沾着泥——泥是山里的黄泥，不是沟里的黑泥。\n\n那个人从门外一步一步走进来。旧布褂子，头上包着围巾，包袱斜挎着。走进门里的暖光，她摘了围巾——\n\n马渡霜。\n\n\"你怎么——\"草帽人的话噎在半截。\n\n\"初三我出城，往东走的是马家的油道。\"马渡霜把包袱搁在地上，解开，\"祖上送油的小路，翻过老岭就能进来。你们走沟，我走山后。我初三出门，就是算好了初五夜里到。\"\n\n\"你早知道今儿灯会。\"把头说。\n\n\"我家账上写着呢。\"马渡霜说，\"五月初五，六位满，门自开——账上记了三代。\"\n\n\"账上还有啥？\"把头问。他问得慢，一个字一个字地抠，\"师爷接灯没回来，师父守了一辈子独屋。到你这儿，账上最后一笔是什么？\"\n\n马渡霜看了把头一眼，没立刻答。她先把包袱里最后一样东西拿了出来——不是物件，是一张纸。老黄纸，折成四折，折口都磨圆了。她展开，冲灯举起来。\n\n纸上没字。只有五个墨点鱼尾，四个浓，一个淡。第五个鱼尾旁边，点着一个朱砂点。\n\n\"马家的账，不使字。\"她说，\"鱼尾是灯，朱砂是人。第五盏灯旁边的朱砂点，点在三十年前——点了就没洗过。我师父走之前，把这纸交给我，说朱砂点还没落：这一笔，落谁头上，谁就是马家还灯的人。\"\n\n\"你师父让你来落这个点？\"我问。\n\n\"我师父让我来'看'这个点。\"马渡霜纠正我，\"看，就是看清楚落谁头上。我初三出门走这两天，就是来'看'的——\"\n\n她把纸折回去，收回怀里。\n\n\"现在我看清了。落我头上。\"\n\n我拦在她前头：\"你看得清，我看得也清——那块刻'项'字的牌，还压在第七层没动呢。马家的账落你头上，那盏新亮的灯算谁的？\"\n\n\"算山的。\"马渡霜说，\"项掌柜，你家那块牌立了，可你家那盏灯还空着——空着，就还有的商量。山今儿收两笔账，一笔记在你名下，一笔记在我名下。哪笔先清，山说了算，可怎么个清法，人还能递句话。\"\n\n\"你想递什么话？\"\n\n\"我想拿我这笔，换你家那笔的宽限。\"她看着我，目光稳得很，\"马家还灯是三代排好的，山认这个序。你家那笔是半道上撞上的——撞上的账，讲不了序，只能讲价。\"\n\n厅里的灯，在我们说话这工夫，火头又齐齐往上抬了一分。不是要灭，是要够着什么——够着厅顶，够着外头，够着那五盏已经归位的灯。\n\n老头在边上看着，低声说了一句：\"灯听懂了。山这个当家的，从来不聋。\"\n\n她不看我们，径直往厅里走。走过一排一排石墩，走到那盏亮着的灯底下——马承灯那盏。灯前头摆着一双女式千层底，绣着鱼尾纹。\n\n她在灯前站定，把包袱里的东西一样一样往外拿。\n\n一块蓝布。一双没绣完的鞋。最后一个布包，一层一层打开——\n\n那枚黄铜鱼尾订金。\n\n\"独屋木匣里的。\"她说，\"初三出门，我取了它。\"\n\n\"你还什么？\"我问，\"油不是已经点了吗？\"\n\n\"油还了，订金还了。\"马渡霜说，\"可我家欠的不是油。\"\n\n她抬起头。灯把她半张脸照着，另外半张沉在影子里。\n\n\"三十年前接灯的没回来，我师爷没回来。我师父守了一辈子独屋，守到走，也没敢吹那盏佛灯——她跟我说，马家欠山一盏灯。欠的不是灯油，是接灯的人。\"\n\n\"你师父师兄——\"鱼哥话没说完。\n\n\"账上写的是：灯还一个，账平一代。\"马渡霜说，\"我师父那代没还上，轮到我这代。\"\n\n她说\"轮\"这个字的时候，和把头那晚问我的话，一个字不差。我这才明白——山里的账，翻来覆去就一个字，轮。轮到谁，谁躲不开；躲开了，就欠三十年。\n\n\"你要接灯？\"\n\n\"我家管这个叫——\"她顿了顿，把那个词说出来，\"还灯。\"\n\n厅里静得吓人。百十来盏灯的火头，齐齐地朝她那盏偏过去，像满厅的名姓都在看。\n\n\"不行。\"我说，\"你师父告诉你的是'灯亮一盏走一个人'，不是让你自己走过去。\"\n\n\"峰哥。\"马渡霜看了我一眼，居然笑了一下，\"你猜我为什么初三就出门？我路上走了两天，把这笔账从头到尾想了一遍。不还，你家那块牌子空着，我马家那盏灯年年有人来点，年年点不灭——山不催人，山等人。等烦了，它自己找。\"\n\n\"它找谁？\"\n\n\"它找谁，谁替它。\"\n\n她这句话说完，厅里落针可闻。把头忽然开口，声
