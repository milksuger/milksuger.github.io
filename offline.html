蹭一下，蹭出那声\"吱嘎\"。 锅底下，滴滴答答，往下淌着水。 不，不是水。 手电的光圈里，那液体拉出细细的一条线，黑得发亮，落在卵石上，洇开一小片，又腥又凉的味道顺着沟风飘下来。 我认得这个味道。 跟敲老周店门那人鞋底的黑泥，一模一样。 \"别看了。\"把头在我身后用气声说，声音平得像一碗凉水。 \"顺着它滴的方向走。\" \"锅会领咱们到地方。\" 我压下手电，回头看他。 把头站在黑暗里，眼睛望着那口还在轻轻晃的锅，脸上一丝表情也没有。 \"三十年前那晚，\"他说，\"它也是这么，给我领的路。\""}, {"id": "A5-066", "arc": "A5", "num": 66, "title": "黑眉", "md": "那口吊锅在半空晃着，滴出来的黑泥在地上洇出一条线。\n\n线的方向，往沟的深处去。\n\n我们跟着它走。\n\n走出百来步，两壁又收拢了，头顶的天窗细成一条缝。黑泥线在卵石上断断续续，每一段洇痕都不大，像有人提着锅一路走一路漏。\n\n我越走越觉得不对。\n\n不是因为邪性——是因为这泥滴得太**匀**了。每隔七八步一滴，每滴大小相当，滴痕边缘齐整。提着锅的人再稳，走山路也不会这么匀。\n\n除非提锅的，不是人。\n\n前头的王药根忽然站住了。\n\n他站的位置很讲究：左脚虚点地，重心在后，响哨棍横在身前。两只老避龙蹲在他两边的卵石上，脖子上的毛炸到极限，喉咙里滚着几乎听不见的咕声。\n\n我顺着他的目光往前看。\n\n前方七八步，黑泥线的尽头，是一块从西壁塌下来的巨石，半人高，像个塌了肩膀的驼子。\n\n巨石的阴影里，盘着一样东西。\n\n起先我以为是树根——黑褐油亮，一圈盘着一圈。等我的眼睛适应了黑暗，看清那\"树根\"上有一道白线，从\"根\"的最粗处笔直地划到尖上——\n\n眉毛。\n\n两条黑眉中间，一道雪白的眉心纹。\n\n黑眉。\n\n王药根的气声细得像蚊子：\"两米半……比我爹跟我说的那条还长……\"\n\n蛇盘着，头搁在盘顶上，正对着我们。它的眼睛在黑暗里泛着一层黄，瞳孔竖着，一动不动。\n\n它不躲，也不攻，就那么看着我们——像在**数数**。\n\n长顺的那句话毫无预兆地撞进我脑子：第五个在数我。\n\n我胳膊上的鸡皮疙瘩一层压着一层。\n\n\"都别动。\"王药根的气声抖得厉害，\"它是黑眉王。它不动，是在等咱们先动。老话讲，'贴树皮让路，黑眉王让命'——退，慢慢退，从右边绕，别踩它的影子。\"\n\n我们开始退。\n\n一步，两步。\n\n第三步上，鱼哥脚下的卵石滚了一下。\n\n就这一声轻响——\n\n黑眉动了。\n\n没有预备动作。那盘成塔状的黑影\"哗\"地散开，两米半的身子弹起来半人高，速度快得像鞭子甩出去，直取最前头的王药根面门！\n\n老头到底是玩了一辈子蛇的人。响哨棍横里一架，蛇身\"啪\"地抽在棍身上，震得他连退三步，后腰撞在石壁上。\n\n蛇头悬在半空，离他的脸不到一尺，腥气喷在他脸上。\n\n\"老避龙！\"\n\n两只黑鸡同时扑了出去。\n\n不是逃跑——是**进攻**。两只黑鸡一左一右，翅膀炸开，啄向蛇身的七寸两侧。黑眉王的身子横着一扫，\"咔\"一声，左边那只黑鸡被扫飞出去，撞在石壁上，落地就没了声息。\n\n右边那只黑鸡却死死咬住了蛇的尾巴根。\n\n黑眉王回身来救。\n\n就是这一回身的空当——\n\n鱼哥动了。\n\n他从我身边擦过去，像一堵墙倒过来。我不知道他什么时候蓄的劲，只见他半步踏进，腰胯一拧，右拳从下往上，短促、极快，拳面砸在蛇头侧面——\n\n没有声音。\n\n真的没有声音。那么大一拳，砸在那么大一颗蛇头上，声音像是被拳头吸走了。\n\n黑眉王整个身子僵在半空，僵了足有两秒，然后\"啪嗒\"一声瘫下来，从巨石上滑下去，蛇身抽搐着，越抽越慢。\n\n那只咬着蛇尾的黑鸡还死死不撒口，脖子上的毛全断了，断口渗着血。\n\n\"退开！\"王药根嘶声喊，\"它没死！它在装——\"\n\n话音没落，蛇尾猛地一卷。\n\n黑鸡被卷住了。\n\n黑眉王卷着自己的猎物往巨石的缝隙里缩，速度陡然又快起来。王药根扑上去拽黑鸡，蛇尾一甩，把他整个人甩了个趔趄，右手背上顿时绷起两排血洞。\n\n\"大爷！\"\n\n黑鸡连着两声短促的咯咯，声音戛然而止。\n\n蛇身彻底缩进了巨石底的石缝，最后消失的，是那道雪白的眉心纹。\n\n石缝里安静下来。\n\n黑鸡没再出来。\n\n王药根跪坐在卵石上，右手背血往下淌。他顾不上手，伸手去摸石缝，被鱼哥一把按住：\"大爷！蛇还在里头！\"\n\n\"里头……\"老头喘着粗气，\"里头不是我儿说的那条路……这缝是活的，是空的……\"\n\n鱼哥把我带的手电拧开，光柱探进石缝。\n\n缝比看上去深，两壁齐整——不是天然的齐整，是人凿出来的齐整。光柱打进去七八米，照见缝底一层黑泥，泥上盘着黑眉王刚蜕下来的半张蛇皮，皮上的白眉纹完整得刺眼。\n\n蛇皮后头，泥地的尽头，立着一堵墙。\n\n垒砌的墙。\n\n黑眉王死了没有，没人知道。它拖着那只为我们死的黑鸡，缩进了这道人工的石缝深处。王药根看着自己血淋淋的右手背，忽然笑了，笑得眼角全是泪。\n\n\"好，好……老避龙没白养……\"\n\n他从怀里摸出一个小瓷瓶，倒出点黑褐色的膏子按在伤口上。\n\n\"大爷，你手——\"\n\n\"不碍事。\"他摆摆手，盯着那道石缝，一字一字地说：\n\n\"这一趟，值了。\"\n\n\"我儿子的魂儿，就压在这缝里头。\"", "words": 1669, "html": "<p>那口吊锅在半空晃着，滴出来的黑泥在地上洇出一条线。<\/p>\n<p>线的方向，往沟的深处去。<\/p>\n<p>我们跟着它走。<\/p>\n<p>走出百来步，两壁又收拢了，头顶的天窗细成一条缝。黑泥线在卵石上断断续续，每一段洇痕都不大，像有人提着锅一路走一路漏。<\/p>\n<p>我越走越觉得不对。<\/p>\n<p>不是因为邪性——是因为这泥滴得太<strong>匀<\/strong>了。每隔七八步一滴，每滴大小相当，滴痕边缘齐整。提着锅的人再稳，走山路也不会这么匀。<\/p>\n<p>除非提锅的，不是人。<\/p>\n<p>前头的王药根忽然站住了。<\/p>\n<p>他站的位置很讲究：左脚虚点地，重心在后，响哨棍横在身前。两只老避龙蹲在他两边的卵石上，脖子上的毛炸到极限，喉咙里滚着几乎听不见的咕声。<\/p>\n<p>我顺着他的目光往前看。<\/p>\n<p>前方七八步，黑泥线的尽头，是一块从西壁塌下来的巨石，半人高，像个塌了肩膀的驼子。<\/p>\n<p>巨石的阴影里，盘着一样东西。<\/p>\n<p>起先我以为是树根——黑褐油亮，一圈盘着一圈。等我的眼睛适应了黑暗，看清那\"树根\"上有一道白线，从\"根\"的最粗处笔直地划到尖上——<\/p>\n<p>眉毛。<\/p>\n<p>两条黑眉中间，一道雪白的眉心纹。<\/p>\n<p>黑眉。<\/p>\n<p>王药根的气声细得像蚊子：\"两米半……比我爹跟我说的那条还长……\"<\/p>\n<p>蛇盘着，头搁在盘顶上，正对着我们。它的眼睛在黑暗里泛着一层黄，瞳孔竖着，一动不动。<\/p>\n<p>它不躲，也不攻，就那么看着我们——像在<strong>数数<\/strong>。<\/p>\n<p>长顺的那句话毫无预兆地撞进我脑子：第五个在数我。<\/p>\n<p>我胳膊上的鸡皮疙瘩一层压着一层。<\/p>\n<p>\"都别动。\"王药根的气声抖得厉害，\"它是黑眉王。它不动，是在等咱们先动。老话讲，'贴树皮让路，黑眉王让命'——退，慢慢退，从右边绕，别踩它的影子。\"<\/p>\n<p>我们开始退。<\/p>\n<p>一步，两步。<\/p>\n<p>第三步上，鱼哥脚下的卵石滚了一下。<\/p>\n<p>就这一声轻响——<\/p>\n<p>黑眉动了。<\/p>\n<p>没有预备动作。那盘成塔状的黑影\"哗\"地散开，两米半的身子弹起来半人高，速度快得像鞭子甩出去，直取最前头的王药根面门！<\/p>\n<p>老头到底是玩了一辈子蛇的人。响哨棍横里一架，蛇身\"啪\"地抽在棍身上，震得他连退三步，后腰撞在石壁上。<\/p>\n<p>蛇头悬在半空，离他的脸不到一尺，腥气喷在他脸上。<\/p>\n<p>\"老避龙！\"<\/p>\n<p>两只黑鸡同时扑了出去。<\/p>\n<p>不是逃跑——是<strong>进攻<\/strong>。两只黑鸡一左一右，翅膀炸开，啄向蛇身的七寸两侧。黑眉王的身子横着一扫，\"咔\"一声，左边那只黑鸡被扫飞出去，撞在石壁上，落地就没了声息。<\/p>\n<p>右边那只黑鸡却死死咬住了蛇的尾巴根。<\/p>\n<p>黑眉王回身来救。<\/p>\n<p>就是这一回身的空当——<\/p>\n<p>鱼哥动了。<\/p>\n<p>他从我身边擦过去，像一堵墙倒过来。我不知道他什么时候蓄的劲，只见他半步踏进，腰胯一拧，右拳从下往上，短促、极快，拳面砸在蛇头侧面——<\/p>\n<p>没有声音。<\/p>\n<p>真的没有声音。那么大一拳，砸在那么大一颗蛇头上，声音像是被拳头吸走了。<\/p>\n<p>黑眉王整个身子僵在半空，僵了足有两秒，然后\"啪嗒\"一声瘫下来，从巨石上滑下去，蛇身抽搐着，越抽越慢。<\/p>\n<p>那只咬着蛇尾的黑鸡还死死不撒口，脖子上的毛全断了，断口渗着血。<\/p>\n<p>\"退开！\"王药根嘶声喊，\"它没死！它在装——\"<\/p>\n<p>话音没落，蛇尾猛地一卷。<\/p>\n<p>黑鸡被卷住了。<\/p>\n<p>黑眉王卷着自己的猎物往巨石的缝隙里缩，速度陡然又快起来。王药根扑上去拽黑鸡，蛇尾一甩，把他整个人甩了个趔趄，右手背上顿时绷起两排血洞。<\/p>\n<p>\"大爷！\"<\/p>\n<p>黑鸡连着两声短促的咯咯，声音戛然而止。<\/p>\n<p>蛇身彻底缩进了巨石底的石缝，最后消失的，是那道雪白的眉心纹。<\/p>\n<p>石缝里安静下来。<\/p>\n<p>黑鸡没再出来。<\/p>\n<p>王药根跪坐在卵石上，右手背血往下淌。他顾不上手，伸手去摸石缝，被鱼哥一把按住：\"大爷！蛇还在里头！\"<\/p>\n<p>\"里头……\"老头喘着粗气，\"里头不是我儿说的那条路……这缝是活的，是空的……\"<\/p>\n<p>鱼哥把我带的手电拧开，光柱探进石缝。<\/p>\n<p>缝比看上去深，两壁齐整——不是天然的齐整，是人凿出来的齐整。光柱打进去七八米，照见缝底一层黑泥，泥上盘着黑眉王刚蜕下来的半张蛇皮，皮上的白眉纹完整得刺眼。<\/p>\n<p>蛇皮后头，泥地的尽头，立着一堵墙。<\/p>\n<p>垒砌的墙。<\/p>\n<p>黑眉王死了没有，没人知道。它拖着那只为我们死的黑鸡，缩进了这道人工的石缝深处。王药根看着自己血淋淋的右手背，忽然笑了，笑得眼角全是泪。<\/p>\n<p>\"好，好……老避龙没白养……\"<\/p>\n<p>他从怀里摸出一个小瓷瓶，倒出点黑褐色的膏子按在伤口上。<\/p>\n<p>\"大爷，你手——\"<\/p>\n<p>\"不碍事。\"他摆摆手，盯着那道石缝，一字一字地说：<\/p>\n<p>\"这一趟，值了。\"<\/p>\n<p>\"我儿子的魂儿，就压在这缝里头。\"<\/p>", "plain": "那口吊锅在半空晃着，滴出来的黑泥在地上洇出一条线。 线的方向，往沟的深处去。 我们跟着它走。 走出百来步，两壁又收拢了，头顶的天窗细成一条缝。黑泥线在卵石上断断续续，每一段洇痕都不大，像有人提着锅一路走一路漏。 我越走越觉得不对。 不是因为邪性——是因为这泥滴得太匀了。每隔七八步一滴，每滴大小相当，滴痕边缘齐整。提着锅的人再稳，走山路也不会这么匀。 除非提锅的，不是人。 前头的王药根忽然站住了。 他站的位置很讲究：左脚虚点地，重心在后，响哨棍横在身前。两只老避龙蹲在他两边的卵石上，脖子上的毛炸到极限，喉咙里滚着几乎听不见的咕声。 我顺着他的目光往前看。 前方七八步，黑泥线的尽头，是一块从西壁塌下来的巨石，半人高，像个塌了肩膀的驼子。 巨石的阴影里，盘着一样东西。 起先我以为是树根——黑褐油亮，一圈盘着一圈。等我的眼睛适应了黑暗，看清那\"树根\"上有一道白线，从\"根\"的最粗处笔直地划到尖上—— 眉毛。 两条黑眉中间，一道雪白的眉心纹。 黑眉。 王药根的气声细得像蚊子：\"两米半……比我爹跟我说的那条还长……\" 蛇盘着，头搁在盘顶上，正对着我们。它的眼睛在黑暗里泛着一层黄，瞳孔竖着，一动不动。 它不躲，也不攻，就那么看着我们——像在数数。 长顺的那句话毫无预兆地撞进我脑子：第五个在数我。 我胳膊上的鸡皮疙瘩一层压着一层。 \"都别动。\"王药根的气声抖得厉害，\"它是黑眉王。它不动，是在等咱们先动。老话讲，'贴树皮让路，黑眉王让命'——退，慢慢退，从右边绕，别踩它的影子。\" 我们开始退。 一步，两步。 第三步上，鱼哥脚下的卵石滚了一下。 就这一声轻响—— 黑眉动了。 没有预备动作。那盘成塔状的黑影\"哗\"地散开，两米半的身子弹起来半人高，速度快得像鞭子甩出去，直取最前头的王药根面门！ 老头到底是玩了一辈子蛇的人。响哨棍横里一架，蛇身\"啪\"地抽在棍身上，震得他连退三步，后腰撞在石壁上。 蛇头悬在半空，离他的脸不到一尺，腥气喷在他脸上。 \"老避龙！\" 两只黑鸡同时扑了出去。 不是逃跑——是进攻。两只黑鸡一左一右，翅膀炸开，啄向蛇身的七寸两侧。黑眉王的身子横着一扫，\"咔\"一声，左边那只黑鸡被扫飞出去，撞在石壁上，落地就没了声息。 右边那只黑鸡却死死咬住了蛇的尾巴根。 黑眉王回身来救。 就是这一回身的空当—— 鱼哥动了。 他从我身边擦过去，像一堵墙倒过来。我不知道他什么时候蓄的劲，只见他半步踏进，腰胯一拧，右拳从下往上，短促、极快，拳面砸在蛇头侧面—— 没有声音。 真的没有声音。那么大一拳，砸在那么大一颗蛇头上，声音像是被拳头吸走了。 黑眉王整个身子僵在半空，僵了足有两秒，然后\"啪嗒\"一声瘫下来，从巨石上滑下去，蛇身抽搐着，越抽越慢。 那只咬着蛇尾的黑鸡还死死不撒口，脖子上的毛全断了，断口渗着血。 \"退开！\"王药根嘶声喊，\"它没死！它在装——\" 话音没落，蛇尾猛地一卷。 黑鸡被卷住了。 黑眉王卷着自己的猎物往巨石的缝隙里缩，速度陡然又快起来。王药根扑上去拽黑鸡，蛇尾一甩，把他整个人甩了个趔趄，右手背上顿时绷起两排血洞。 \"大爷！\" 黑鸡连着两声短促的咯咯，声音戛然而止。 蛇身彻底缩进了巨石底的石缝，最后消失的，是那道雪白的眉心纹。 石缝里安静下来。 黑鸡没再出来。 王药根跪坐在卵石上，右手背血往下淌。他顾不上手，伸手去摸石缝，被鱼哥一把按住：\"大爷！蛇还在里头！\" \"里头……\"老头喘着粗气，\"里头不是我儿说的那条路……这缝是活的，是空的……\" 鱼哥把我带的手电拧开，光柱探进石缝。 缝比看上去深，两壁齐整——不是天然的齐整，是人凿出来的齐整。光柱打进去七八米，照见缝底一层黑泥，泥上盘着黑眉王刚蜕下来的半张蛇皮，皮上的白眉纹完整得刺眼。 蛇皮后头，泥地的尽头，立着一堵墙。 垒砌的墙。 黑眉王死了没有，没人知道。它拖着那只为我们死的黑鸡，缩进了这道人工的石缝深处。王药根看着自己血淋淋的右手背，忽然笑了，笑得眼角全是泪。 \"好，好……老避龙没白养……\" 他从怀里摸出一个小瓷瓶，倒出点黑褐色的膏子按在伤口上。 \"大爷，你手——\" \"不碍事。\"他摆摆手，盯着那道石缝，一字一字地说： \"这一趟，值了。\" \"我儿子的魂儿，就压在这缝里头。\""}, {"id": "A5-067", "arc": "A5", "num": 67, "title": "石缝", "md": "王药根右手背敷了药，用布条一缠，说声\"不耽误\"，就要往石缝里钻。\n\n把头一把攥住他胳膊。\n\n\"老丈，蛇还在里头。\"\n\n\"蛇是护东西的。\"王药根说，\"它咬完人缩回去，一时半会儿不出来。这是我家的手艺，我比谁都清楚。\"\n\n\"我知道蛇不出来的道理。\"把头说，\"可我不知道里头还有没有别的。都等一等。\"\n\n他把鱼哥和我也拦了，让我们就地歇脚，把干粮和水分了，自己却蹲到那道石缝跟前，打着手电，一寸一寸地看。\n\n我凑过去。\n\n缝宽不到半米，两壁齐整，凿痕一层压着一层，每一层的走向都一样。把头看了半晌，忽然说：\"云峰，你看这凿痕，是干茬还是湿茬？\"\n\n我贴上去细看。凿痕干净，石粉早被雨水冲走了，茬口却是毛的，没有后来修整的痕迹。\n\n\"干茬。\"我说，\"凿完没修。\"\n\n\"说明什么？\"\n\n\"赶工。\"\n\n\"对喽。\"把头直起腰，\"不是怕人看见——深山老林没人看见。是怕**蛇**看见。\"\n\n我和鱼哥对了个眼神。\n\n\"这缝是给蛇留的门。\"我说。\n\n\"不是给蛇留的门。\"把头摇头，\"是给蛇留的**岗**。你想想，谁家封门，特意在门底下留一条两米半的毒蛇能进出的缝？\"\n\n我心里转了个弯，想明白了。\n\n\"守墓的。\"我说，\"这条缝，两千年里就是这堵墙的岗哨。有东西从缝里过，先过蛇这一关。\"\n\n\"所以黑眉王不是碰上的。\"鱼哥在旁边低声说，\"它是这儿土生土长的岗。两千年里换了一茬又一茬，这一茬最小，才两米半。\"\n\n王药根在旁边听着，脸上的表情说不上是惊还是喜。他忽然扭头问：\"你们说的这些，跟我儿子——\"\n\n\"先看墙。\"把头打断他。\n\n石缝右边，就是那堵墙。\n\n墙从缝口往右延伸，一头扎进西壁的石体里，另一头被塌下来的巨石压着。看走向，是横着把这条支沟封死了。墙面上的石头大大小小，没有一块经凿，全是拣来的河卵石，可垒法极讲究：三块大石垫底，上头一层小石找平，再一层大石压顶，层层咬合，不用一点泥灰。\n\n\"干岔垒。\"我说，\"跟高句丽积石墓的墙法是一个路数。\"\n\n\"不是路数一样。\"把头说，\"这就是积石。云峰，你记住，高句丽人砌石头，跟汉人砌砖是一个道理——他们一辈子跟石头打交道，垒出来的墙，石头之间是**咬**上的，不是堆上的。\"\n\n他让我把光打在墙的某一处，我照办。\n\n那一处，两块大石的咬合缝里，嵌着一枚小小的石片。石片打掉了一角，卡在缝里，严丝合缝。\n\n\"看见没有，这是'锁眼石'。\"把头说，\"拆墙的人只要动了这一块，上头的石头自己就下来压他。这墙不光是封门，是**设了手**的封门。\"\n\n鱼哥倒吸了一口凉气：\"那咱们还拆吗？\"\n\n\"不拆。\"把头说。\n\n我们都看着他。\n\n\"墙是死的，缝是活的。\"他把下巴朝那道蛇缝一点，\"两千年的岗哨，认的是缝，不认墙。老规矩，进封门，不走门，走狗洞。\"\n\n王药根咧嘴想笑，牵动了手背的伤，\"嘶\"了一声。\n\n把头让我打光，他自己趴在缝口，探进半个身子，手电的光柱贴着缝底的黑泥扫过去。\n\n\"云峰，拿我的撬棍来。轻点，别碰两壁。\"\n\n我把撬棍递给他。他侧身挤进缝里，我在缝口打光，鱼哥攥着他的腰带。\n\n缝底的泥有半尺厚。把头用撬棍一点一点地探，探了几下，\"当\"的一声轻响。\n\n他停住，换了手势。我把光压低。\n\n撬棍尖挑出来的时候，泥里带上来两样东西。\n\n一片陶。\n\n一枚铜。\n\n陶片巴掌大，灰陶，素面，边缘齐整，是器物的腹片。把头用拇指抹去泥，翻过来，指腹在断茬上搓了搓：\"两千年的茬口，摸着跟刀切的一样。\"\n\n那枚铜是带钩。\n\n钩身一拃长，钩头是个简化的兽首，通体黑漆古，翻过来，背面圆钮完好。\n\n\"战国到西汉的式样。\"我说，\"中原的东西。\"\n\n\"中原的东西，出现在高句丽早期封门的墙缝里。\"把头把带钩托在手心，\"云峰，这话你接得住吗？\"\n\n我接得住。\n\n\"封门的人里，有中原人。\"我说，\"而且是亲手砌墙的人——带钩是在干活的人身上蹭下来的。\"\n\n把头点了点头，正要说话，忽然停住。\n\n\"别动。\"\n\n他把整张脸转向缝的深处。\n\n\"你们感觉。\"他说。\n\n我趴下去，学着他的样子朝缝里探。\n\n缝底有风。\n\n极细，极凉，一丝一丝地往外走，带着一股说不出的味道——不是泥腥，不是蛇腥。\n\n是烟。\n\n烧了很久的柴火的烟味，混着一丝若有若无的、类似香灰的甜。\n\n把头从缝里退出来，坐在卵石上，仰头看着两壁之间的那一线天，半天没说话。\n\n\"把头，\"我低声问，\"里头有人？\"\n\n\"里头不光有人。\"把头说。\n\n\"里头有人，点了灯。\"\n\n\"而且这灯——\"他站起身，拍拍裤子上的泥，眼睛望着缝口那片黑暗，\"**从两千年前，一直点到了今天。**\"", "words": 1728, "html": "<p>王药根右手背敷了药，用布条一缠，说声\"不耽误\"，就要往石缝里钻。<\/p>\n<p>把头一把攥住他胳膊。<\/p>\n<p>\"老丈，蛇还在里头。\"<\/p>\n<p>\"蛇是护东西的。\"王药根说，\"它咬完人缩回去，一时半会儿不出来。这是我家的手艺，我比谁都清楚。\"<\/p>\n<p>\"我知道蛇不出来的道理。\"把头说，\"可我不知道里头还有没有别的。都等一等。\"<\/p>\n<p>他把鱼哥和我也拦了，让我们就地歇脚，把干粮和水分了，自己却蹲到那道石缝跟前，打着手电，一寸一寸地看。<\/p>\n<p>我凑过去。<\/p>\n<p>缝宽不到半米，两壁齐整，凿痕一层压着一层，每一层的走向都一样。把头看了半晌，忽然说：\"云峰，你看这凿痕，是干茬还是湿茬？\"<\/p>\n<p>我贴上去细看。凿痕干净，石粉早被雨水冲走了，茬口却是毛的，没有后来修整的痕迹。<\/p>\n<p>\"干茬。\"我说，\"凿完没修。\"<\/p>\n<p>\"说明什么？\"<\/p>\n<p>\"赶工。\"<\/p>\n<p>\"对喽。\"把头直起腰，\"不是怕人看见——深山老林没人看见。是怕<strong>蛇<\/strong>看见。\"<\/p>\n<p>我和鱼哥对了个眼神。<\/p>\n<p>\"这缝是给蛇留的门。\"我说。<\/p>\n<p>\"不是给蛇留的门。\"把头摇头，\"是给蛇留的<strong>岗<\/strong>。你想想，谁家封门，特意在门底下留一条两米半的毒蛇能进出的缝？\"<\/p>\n<p>我心里转了个弯，想明白了。<\/p>\n<p>\"守墓的。\"我说，\"这条缝，两千年里就是这堵墙的岗哨。有东西从缝里过，先过蛇这一关。\"<\/p>\n<p>\"所以黑眉王不是碰上的。\"鱼哥在旁边低声说，\"它是这儿土生土长的岗。两千年里换了一茬又一茬，这一茬最小，才两米半。\"<\/p>\n<p>王药根在旁边听着，脸上的表情说不上是惊还是喜。他忽然扭头问：\"你们说的这些，跟我儿子——\"<\/p>\n<p>\"先看墙。\"把头打断他。<\/p>\n<p>石缝右边，就是那堵墙。<\/p>\n<p>墙从缝口往右延伸，一头扎进西壁的石体里，另一头被塌下来的巨石压着。看走向，是横着把这条支沟封死了。墙面上的石头大大小小，没有一块经凿，全是拣来的河卵石，可垒法极讲究：三块大石垫底，上头一层小石找平，再一层大石压顶，层层咬合，不用一点泥灰。<\/p>\n<p>\"干岔垒。\"我说，\"跟高句丽积石墓的墙法是一个路数。\"<\/p>\n<p>\"不是路数一样。\"把头说，\"这就是积石。云峰，你记住，高句丽人砌石头，跟汉人砌砖是一个道理——他们一辈子跟石头打交道，垒出来的墙，石头之间是<strong>咬<\/strong>上的，不是堆上的。\"<\/p>\n<p>他让我把光打在墙的某一处，我照办。<\/p>\n<p>那一处，两块大石的咬合缝里，嵌着一枚小小的石片。石片打掉了一角，卡在缝里，严丝合缝。<\/p>\n<p>\"看见没有，这是'锁眼石'。\"把头说，\"拆墙的人只要动了这一块，上头的石头自己就下来压他。这墙不光是封门，是<strong>设了手<\/strong>的封门。\"<\/p>\n<p>鱼哥倒吸了一口凉气：\"那咱们还拆吗？\"<\/p>\n<p>\"不拆。\"把头说。<\/p>\n<p>我们都看着他。<\/p>\n<p>\"墙是死的，缝是活的。\"他把下巴朝那道蛇缝一点，\"两千年的岗哨，认的是缝，不认墙。老规矩，进封门，不走门，走狗洞。\"<\/p>\n<p>王药根咧嘴想笑，牵动了手背的伤，\"嘶\"了一声。<\/p>\n<p>把头让我打光，他自己趴在缝口，探进半个身子，手电的光柱贴着缝底的黑泥扫过去。<\/p>\n<p>\"云峰，拿我的撬棍来。轻点，别碰两壁。\"<\/p>\n<p>我把撬棍递给他。他侧身挤进缝里，我在缝口打光，鱼哥攥着他的腰带。<\/p>\n<p>缝底的泥有半尺厚。把头用撬棍一点一点地探，探了几下，\"当\"的一声轻响。<\/p>\n<p>他停住，换了手势。我把光压低。<\/p>\n<p>撬棍尖挑出来的时候，泥里带上来两样东西。<\/p>\n<p>一片陶。<\/p>\n<p>一枚铜。<\/p>\n<p>陶片巴掌大，灰陶，素面，边缘齐整，是器物的腹片。把头用拇指抹去泥，翻过来，指腹在断茬上搓了搓：\"两千年的茬口，摸着跟刀切的一样。\"<\/p>\n<p>那枚铜是带钩。<\/p>\n<p>钩身一拃长，钩头是个简化的兽首，通体黑漆古，翻过来，背面圆钮完好。<\/p>\n<p>\"战国到西汉的式样。\"我说，\"中原的东西。\"<\/p>\n<p>\"中原的东西，出现在高句丽早期封门的墙缝里。\"把头把带钩托在手心，\"云峰，这话你接得住吗？\"<\/p>\n<p>我接得住。<\/p>\n<p>\"封门的人里，有中原人。\"我说，\"而且是亲手砌墙的人——带钩是在干活的人身上蹭下来的。\"<\/p>\n<p>把头点了点头，正要说话，忽然停住。<\/p>\n<p>\"别动。\"<\/p>\n<p>他把整张脸转向缝的深处。<\/p>\n<p>\"你们感觉。\"他说。<\/p>\n<p>我趴下去，学着他的样子朝缝里探。<\/p>\n<p>缝底有风。<\/p>\n<p>极细，极凉，一丝一丝地往外走，带着一股说不出的味道——不是泥腥，不是蛇腥。<\/p>\n<p>是烟。<\/p>\n<p>烧了很久的柴火的烟味，混着一丝若有若无的、类似香灰的甜。<\/p>\n<p>把头从缝里退出来，坐在卵石上，仰头看着两壁之间的那一线天，半天没说话。<\/p>\n<p>\"把头，\"我低声问，\"里头有人？\"<\/p>\n<p>\"里头不光有人。\"把头说。<\/p>\n<p>\"里头有人，点了灯。\"<\/p>\n<p>\"而且这灯——\"他站起身，拍拍裤子上的泥，眼睛望着缝口那片黑暗，\"<strong>从两千年前，一直点到了今天。<\/strong>\"<\/p>", "plain": "王药根右手背敷了药，用布条一缠，说声\"不耽误\"，就要往石缝里钻。 把头一把攥住他胳膊。 \"老丈，蛇还在里头。\" \"蛇是护东西的。\"王药根说，\"它咬完人缩回去，一时半会儿不出来。这是我家的手艺，我比谁都清楚。\" \"我知道蛇不出来的道理。\"把头说，\"可我不知道里头还有没有别的。都等一等。\" 他把鱼哥和我也拦了，让我们就地歇脚，把干粮和水分了，自己却蹲到那道石缝跟前，打着手电，一寸一寸地看。 我凑过去。 缝宽不到半米，两壁齐整，凿痕一层压着一层，每一层的走向都一样。把头看了半晌，忽然说：\"云峰，你看这凿痕，是干茬还是湿茬？\" 我贴上去细看。凿痕干净，石粉早被雨水冲走了，茬口却是毛的，没有后来修整的痕迹。 \"干茬。\"我说，\"凿完没修。\" \"说明什么？\" \"赶工。\" \"对喽。\"把头直起腰，\"不是怕人看见——深山老林没人看见。是怕蛇看见。\" 我和鱼哥对了个眼神。 \"这缝是给蛇留的门。\"我说。 \"不是给蛇留的门。\"把头摇头，\"是给蛇留的岗。你想想，谁家封门，特意在门底下留一条两米半的毒蛇能进出的缝？\" 我心里转了个弯，想明白了。 \"守墓的。\"我说，\"这条缝，两千年里就是这堵墙的岗哨。有东西从缝里过，先过蛇这一关。\" \"所以黑眉王不是碰上的。\"鱼哥在旁边低声说，\"它是这儿土生土长的岗。两千年里换了一茬又一茬，这一茬最小，才两米半。\" 王药根在旁边听着，脸上的表情说不上是惊还是喜。他忽然扭头问：\"你们说的这些，跟我儿子——\" \"先看墙。\"把头打断他。 石缝右边，就是那堵墙。 墙从缝口往右延伸，一头扎进西壁的石体里，另一头被塌下来的巨石压着。看走向，是横着把这条支沟封死了。墙面上的石头大大小小，没有一块经凿，全是拣来的河卵石，可垒法极讲究：三块大石垫底，上头一层小石找平，再一层大石压顶，层层咬合，不用一点泥灰。 \"干岔垒。\"我说，\"跟高句丽积石墓的墙法是一个路数。\" \"不是路数一样。\"把头说，\"这就是积石。云峰，你记住，高句丽人砌石头，跟汉人砌砖是一个道理——他们一辈子跟石头打交道，垒出来的墙，石头之间是咬上的，不是堆上的。\" 他让我把光打在墙的某一处，我照办。 那一处，两块大石的咬合缝里，嵌着一枚小小的石片。石片打掉了一角，卡在缝里，严丝合缝。 \"看见没有，这是'锁眼石'。\"把头说，\"拆墙的人只要动了这一块，上头的石头自己就下来压他。这墙不光是封门，是设了手的封门。\" 鱼哥倒吸了一口凉气：\"那咱们还拆吗？\" \"不拆。\"把头说。 我们都看着他。 \"墙是死的，缝是活的。\"他把下巴朝那道蛇缝一点，\"两千年的岗哨，认的是缝，不认墙。老规矩，进封门，不走门，走狗洞。\" 王药根咧嘴想笑，牵动了手背的伤，\"嘶\"了一声。 把头让我打光，他自己趴在缝口，探进半个身子，手电的光柱贴着缝底的黑泥扫过去。 \"云峰，拿我的撬棍来。轻点，别碰两壁。\" 我把撬棍递给他。他侧身挤进缝里，我在缝口打光，鱼哥攥着他的腰带。 缝底的泥有半尺厚。把头用撬棍一点一点地探，探了几下，\"当\"的一声轻响。 他停住，换了手势。我把光压低。 撬棍尖挑出来的时候，泥里带上来两样东西。 一片陶。 一枚铜。 陶片巴掌大，灰陶，素面，边缘齐整，是器物的腹片。把头用拇指抹去泥，翻过来，指腹在断茬上搓了搓：\"两千年的茬口，摸着跟刀切的一样。\" 那枚铜是带钩。 钩身一拃长，钩头是个简化的兽首，通体黑漆古，翻过来，背面圆钮完好。 \"战国到西汉的式样。\"我说，\"中原的东西。\" \"中原的东西，出现在高句丽早期封门的墙缝里。\"把头把带钩托在手心，\"云峰，这话你接得住吗？\" 我接得住。 \"封门的人里，有中原人。\"我说，\"而且是亲手砌墙的人——带钩是在干活的人身上蹭下来的。\" 把头点了点头，正要说话，忽然停住。 \"别动。\" 他把整张脸转向缝的深处。 \"你们感觉。\"他说。 我趴下去，学着他的样子朝缝里探。 缝底有风。 极细，极凉，一丝一丝地往外走，带着一股说不出的味道——不是泥腥，不是蛇腥。 是烟。 烧了很久的柴火的烟味，混着一丝若有若无的、类似香灰的甜。 把头从缝里退出来，坐在卵石上，仰头看着两壁之间的那一线天，半天没说话。 \"把头，\"我低声问，\"里头有人？\" \"里头不光有人。\"把头说。 \"里头有人，点了灯。\" \"而且这灯——\"他站起身，拍拍裤子上的泥，眼睛望着缝口那片黑暗，\"从两千年前，一直点到了今天。\""}, {"id": "A5-068", "arc": "A5", "num": 68, "title": "锅", "md": "进缝之前，把头立了三条规矩。\n\n\"第一，都把嘴闭上，用眼神和手势。第二，手电一律压到最低，别直射。第三——\"他看了一眼王药根那只缠着布的手，\"老丈，你的黑鸡带一只进去。活鸡在，咱们心里有底。\"\n\n王药根把剩下那只老避龙从笼里请出来，塞进胸前的布兜，只露个脑袋。黑鸡在兜里睁着眼，一声不吭。\n\n我们鱼贯进缝。\n\n缝比看上去长，手脚并用走了约莫三十步，两壁忽然散开，一个向上的缓坡，再十来步，头顶一空——\n\n到了。\n\n我把手电拧开一丝，光晕贴着地皮铺出去。\n\n这是一间人工开凿的石室，比昨天藏铁器的仓库还大一圈。四壁凿得平整，顶是拱的，拱顶正中垂下一根石钟乳，水珠顺着它一滴一滴地落在地面一个浅浅的石窝里，滴答，滴答——那滴水声，就是我们在缝口听见的声音。\n\n石室正中，摆着五口锅。\n\n五口陶锅，倒扣着，锅足朝天，沿地一圈摆开。方位我一眼就认出来了——不熟行的人看着是随便一圈，其实按的是正经方位：正北、正南、正东、正西，第五口，在正中。\n\n每一口锅，都比家里的大铁锅小些，灰陶，素面，锅身上结着一层黑灰，黑得发亮，像上了一层釉。\n\n把头没有立刻靠近。他站在缝口，看了足足一分钟，才抬手示意：跟我来，踩我的脚印。\n\n我们贴着墙根走，一步不落。\n\n到了锅圈外一尺，把头蹲下，手电压得极低，光晕只照住正北那一口。\n\n锅足朝天。锅底的烟灰积得极厚。\n\n\"都看清楚了？\"他用气声说，\"这五口锅，摆的是**位子**。\"\n\n鱼哥蹲在我旁边，呼吸放得很轻：\"位子？\"\n\n\"北、南、东、西，四口，加当中一口。\"把头的手电缓缓转了一圈，\"我考考你，云峰。高句丽五部，哪一部在上座？\"\n\n\"桂娄部。\"我脱口而出，\"桂娄部世代为王。\"\n\n\"王在哪儿？\"\n\n我看着那五口锅。\n\n正当中那一口——王的位置。\n\n可把头的手电，在正中那口锅上只停了一停，就移开了。\n\n\"都错了。\"他说。\n\n\"啊？\"\n\n\"你数数。\"把头的手电在四壁慢慢转，\"这间屋子，四个方向，四个角。锅里头摆北南东西加正中——**缺的是什么？**\"\n\n我在心里把石室转了一圈，猛地反应过来。\n\n四个角。\n\n四隅。\n\n\"缺的是四隅。\"我说，\"辰巳、戌亥……东南、西南、东北、西北，这四个角上，没有锅。\"\n\n\"高句丽的五部，不是这么坐的。\"把头的声音压得更低，\"高句丽人分部，不按汉人的四方中方坐。他们是按**纥升骨城的山口**坐的——五个部，各守一条进山的谷道。\"\n\n他把光移向石室的四壁。\n\n我这才注意到，四壁上各凿着一道浅槽，浅槽从地面起，斜着向上，通向拱顶，像四条干涸的河道。而石室朝沟的那面墙——就是我们进来的这面——比其他三面厚出一倍。\n\n\"这屋子不是墓。\"把头站起身，\"也不是仓。这是**坛**。\"\n\n\"坛？\"\n\n\"祭坛，也是盟坛。\"把头绕着锅圈外走了半圈，光圈扫过每一口锅的足底，\"五口锅倒扣，锅底朝天——云峰，倒扣的锅是什么？\"\n\n我想了想：\"……盖印？\"\n\n\"是**歇伙**。\"把头说，\"江湖上，伙里散伙，把锅倒扣；伙里立誓，把锅埋土。这五口锅倒扣在这儿，是五部当年在这里**起了誓又散了伙**。\"\n\n鱼哥忽然伸手按住胸口的布兜。那只老避龙在兜里扑腾了两下。\n\n我们仨一齐看过去。\n\n黑鸡从布兜里探出脑袋，脖子上的毛炸着，两只芝麻眼直勾勾地盯着——\n\n西南角。\n\n四隅里，西南方向的那面墙根。\n\n把头的手电慢慢移过去。\n\n光晕里，西南墙根的地面上，干干净净。\n\n什么都没有。\n\n可那圈摆锅的方位线上，我数了三遍——\n\n北、南、东、西、中，五口锅。\n\n加上西南这个\"空位\"。\n\n是六。", "words": 1344, "html": "<p>进缝之前，把头立了三条规矩。<\/p>\n<p>\"第一，都把嘴闭上，用眼神和手势。第二，手电一律压到最低，别直射。第三——\"他看了一眼王药根那只缠着布的手，\"老丈，你的黑鸡带一只进去。活鸡在，咱们心里有底。\"<\/p>\n<p>王药根把剩下那只老避龙从笼里请出来，塞进胸前的布兜，只露个脑袋。黑鸡在兜里睁着眼，一声不吭。<\/p>\n<p>我们鱼贯进缝。<\/p>\n<p>缝比看上去长，手脚并用走了约莫三十步，两壁忽然散开，一个向上的缓坡，再十来步，头顶一空——<\/p>\n<p>到了。<\/p>\n<p>我把手电拧开一丝，光晕贴着地皮铺出去。<\/p>\n<p>这是一间人工开凿的石室，比昨天藏铁器的仓库还大一圈。四壁凿得平整，顶是拱的，拱顶正中垂下一根石钟乳，水珠顺着它一滴一滴地落在地面一个浅浅的石窝里，滴答，滴答——那滴水声，就是我们在缝口听见的声音。<\/p>\n<p>石室正中，摆着五口锅。<\/p>\n<p>五口陶锅，倒扣着，锅足朝天，沿地一圈摆开。方位我一眼就认出来了——不熟行的人看着是随便一圈，其实按的是正经方位：正北、正南、正东、正西，第五口，在正中。<\/p>\n<p>每一口锅，都比家里的大铁锅小些，灰陶，素面，锅身上结着一层黑灰，黑得发亮，像上了一层釉。<\/p>\n<p>把头没有立刻靠近。他站在缝口，看了足足一分钟，才抬手示意：跟我来，踩我的脚印。<\/p>\n<p>我们贴着墙根走，一步不落。<\/p>\n<p>到了锅圈外一尺，把头蹲下，手电压得极低，光晕只照住正北那一口。<\/p>\n<p>锅足朝天。锅底的烟灰积得极厚。<\/p>\n<p>\"都看清楚了？\"他用气声说，\"这五口锅，摆的是<strong>位子<\/strong>。\"<\/p>\n<p>鱼哥蹲在我旁边，呼吸放得很轻：\"位子？\"<\/p>\n<p>\"北、南、东、西，四口，加当中一口。\"把头的手电缓缓转了一圈，\"我考考你，云峰。高句丽五部，哪一部在上座？\"<\/p>\n<p>\"桂娄部。\"我脱口而出，\"桂娄部世代为王。\"<\/p>\n<p>\"王在哪儿？\"<\/p>\n<p>我看着那五口锅。<\/p>\n<p>正当中那一口——王的位置。<\/p>\n<p>可把头的手电，在正中那口锅上只停了一停，就移开了。<\/p>\n<p>\"都错了。\"他说。<\/p>\n<p>\"啊？\"<\/p>\n<p>\"你数数。\"把头的手电在四壁慢慢转，\"这间屋子，四个方向，四个角。锅里头摆北南东西加正中——<strong>缺的是什么？<\/strong>\"<\/p>\n<p>我在心里把石室转了一圈，猛地反应过来。<\/p>\n<p>四个角。<\/p>\n<p>四隅。<\/p>\n<p>\"缺的是四隅。\"我说，\"辰巳、戌亥……东南、西南、东北、西北，这四个角上，没有锅。\"<\/p>\n<p>\"高句丽的五部，不是这么坐的。\"把头的声音压得更低，\"高句丽人分部，不按汉人的四方中方坐。他们是按<strong>纥升骨城的山口<\/strong>坐的——五个部，各守一条进山的谷道。\"<\/p>\n<p>他把光移向石室的四壁。<\/p>\n<p>我这才注意到，四壁上各凿着一道浅槽，浅槽从地面起，斜着向上，通向拱顶，像四条干涸的河道。而石室朝沟的那面墙——就是我们进来的这面——比其他三面厚出一倍。<\/p>\n<p>\"这屋子不是墓。\"把头站起身，\"也不是仓。这是<strong>坛<\/strong>。\"<\/p>\n<p>\"坛？\"<\/p>\n<p>\"祭坛，也是盟坛。\"把头绕着锅圈外走了半圈，光圈扫过每一口锅的足底，\"五口锅倒扣，锅底朝天——云峰，倒扣的锅是什么？\"<\/p>\n<p>我想了想：\"……盖印？\"<\/p>\n<p>\"是<strong>歇伙<\/strong>。\"把头说，\"江湖上，伙里散伙，把锅倒扣；伙里立誓，把锅埋土。这五口锅倒扣在这儿，是五部当年在这里<strong>起了誓又散了伙<\/strong>。\"<\/p>\n<p>鱼哥忽然伸手按住胸口的布兜。那只老避龙在兜里扑腾了两下。<\/p>\n<p>我们仨一齐看过去。<\/p>\n<p>黑鸡从布兜里探出脑袋，脖子上的毛炸着，两只芝麻眼直勾勾地盯着——<\/p>\n<p>西南角。<\/p>\n<p>四隅里，西南方向的那面墙根。<\/p>\n<p>把头的手电慢慢移过去。<\/p>\n<p>光晕里，西南墙根的地面上，干干净净。<\/p>\n<p>什么都没有。<\/p>\n<p>可那圈摆锅的方位线上，我数了三遍——<\/p>\n<p>北、南、东、西、中，五口锅。<\/p>\n<p>加上西南这个\"空位\"。<\/p>\n<p>是六。<\/p>", "plain": "进缝之前，把头立了三条规矩。 \"第一，都把嘴闭上，用眼神和手势。第二，手电一律压到最低，别直射。第三——\"他看了一眼王药根那只缠着布的手，\"老丈，你的黑鸡带一只进去。活鸡在，咱们心里有底。\" 王药根把剩下那只老避龙从笼里请出来，塞进胸前的布兜，只露个脑袋。黑鸡在兜里睁着眼，一声不吭。 我们鱼贯进缝。 缝比看上去长，手脚并用走了约莫三十步，两壁忽然散开，一个向上的缓坡，再十来步，头顶一空—— 到了。 我把手电拧开一丝，光晕贴着地皮铺出去。 这是一间人工开凿的石室，比昨天藏铁器的仓库还大一圈。四壁凿得平整，顶是拱的，拱顶正中垂下一根石钟乳，水珠顺着它一滴一滴地落在地面一个浅浅的石窝里，滴答，滴答——那滴水声，就是我们在缝口听见的声音。 石室正中，摆着五口锅。 五口陶锅，倒扣着，锅足朝天，沿地一圈摆开。方位我一眼就认出来了——不熟行的人看着是随便一圈，其实按的是正经方位：正北、正南、正东、正西，第五口，在正中。 每一口锅，都比家里的大铁锅小些，灰陶，素面，锅身上结着一层黑灰，黑得发亮，像上了一层釉。 把头没有立刻靠近。他站在缝口，看了足足一分钟，才抬手示意：跟我来，踩我的脚印。 我们贴着墙根走，一步不落。 到了锅圈外一尺，把头蹲下，手电压得极低，光晕只照住正北那一口。 锅足朝天。锅底的烟灰积得极厚。 \"都看清楚了？\"他用气声说，\"这五口锅，摆的是位子。\" 鱼哥蹲在我旁边，呼吸放得很轻：\"位子？\" \"北、南、东、西，四口，加当中一口。\"把头的手电缓缓转了一圈，\"我考考你，云峰。高句丽五部，哪一部在上座？\" \"桂娄部。\"我脱口而出，\"桂娄部世代为王。\" \"王在哪儿？\" 我看着那五口锅。 正当中那一口——王的位置。 可把头的手电，在正中那口锅上只停了一停，就移开了。 \"都错了。\"他说。 \"啊？\" \"你数数。\"把头的手电在四壁慢慢转，\"这间屋子，四个方向，四个角。锅里头摆北南东西加正中——缺的是什么？\" 我在心里把石室转了一圈，猛地反应过来。 四个角。 四隅。 \"缺的是四隅。\"我说，\"辰巳、戌亥……东南、西南、东北、西北，这四个角上，没有锅。\" \"高句丽的五部，不是这么坐的。\"把头的声音压得更低，\"高句丽人分部，不按汉人的四方中方坐。他们是按纥升骨城的山口坐的——五个部，各守一条进山的谷道。\" 他把光移向石室的四壁。 我这才注意到，四壁上各凿着一道浅槽，浅槽从地面起，斜着向上，通向拱顶，像四条干涸的河道。而石室朝沟的那面墙——就是我们进来的这面——比其他三面厚出一倍。 \"这屋子不是墓。\"把头站起身，\"也不是仓。这是坛。\" \"坛？\" \"祭坛，也是盟坛。\"把头绕着锅圈外走了半圈，光圈扫过每一口锅的足底，\"五口锅倒扣，锅底朝天——云峰，倒扣的锅是什么？\" 我想了想：\"……盖印？\" \"是歇伙。\"把头说，\"江湖上，伙里散伙，把锅倒扣；伙里立誓，把锅埋土。这五口锅倒扣在这儿，是五部当年在这里起了誓又散了伙。\" 鱼哥忽然伸手按住胸口的布兜。那只老避龙在兜里扑腾了两下。 我们仨一齐看过去。 黑鸡从布兜里探出脑袋，脖子上的毛炸着，两只芝麻眼直勾勾地盯着—— 西南角。 四隅里，西南方向的那面墙根。 把头的手电慢慢移过去。 光晕里，西南墙根的地面上，干干净净。 什么都没有。 可那圈摆锅的方位线上，我数了三遍—— 北、南、东、西、中，五口锅。 加上西南这个\"空位\"。 是六。"}, {"id": "A5-069", "arc": "A5", "num": 69, "title": "空锅", "md": "\"六？\"鱼哥的气声里透着不敢信。\n\n\"五部，五口锅。\"我说，\"可方位线上留了六的数。\"\n\n把头蹲在西南墙根，手电贴着地皮，看了很久。\n\n\"云峰，你过来。\"他说，\"看这个角的地。\"\n\n我蹲过去。西南墙根的地面上，石板和其他地方一样平，一样干。可细看，石板的色气不一样——这一块地方的石板颜色深，深得发乌，接缝里的石茬是新的，茬面上还挂着石末。\n\n\"起过东西。\"我说，\"这里原本摆着第六样，被人起走了。\"\n\n\"多久？\"\n\n我拿指腹蹭了蹭石茬。石末还松，没长新苔。\n\n\"两三年。\"我说，\"跟老周收珍珠罐那批货出土的日子，对得上。\"\n\n鱼哥和把头对了个眼神。\n\n把头站起身，走到正中那口锅前，蹲下，双手按住锅的两耳。\n\n\"都退后，捂住口鼻。\"\n\n我们退开。他把头猛地一掀——\n\n\"轰\"的一声闷响，一股两千年没见过天日的灰气从锅底腾起来。锅掀翻在地，锅底朝天翻过来，露出底下的地面。\n\n地面正中，浅浅一个圆坑。\n\n坑里没有随葬，没有骨头，只有一片烧过的黑灰。\n\n灰上，压着一样东西。\n\n一锭银。\n\n不对——走近了看，是一块银牌。巴掌长，一指宽，边角齐整，银色黑里透白。我一眼就认出了它的制式——和我们手里那四块，一模一样。\n\n\"太官署食契。\"鱼哥低声说。\n\n把头拿起来，翻过正面。\n\n正面是空的。\n\n四块银符，分别铸着\"肉\"\"米\"\"酱\"\"酒\"四个字。这一块，铸纹的位置上，什么都没有。\n\n不是字磨没了。铸的时候，就没有字。\n\n一整块素面无字的银符。\n\n石室里静得只剩拱顶的水滴声。滴答。滴答。\n\n把头托着那块无字银符，翻来覆去看了三遍，忽然问：\"云峰，太官署是什么衙门？\"\n\n\"少府属官。\"我说，\"皇家的灶。天子的饭，从太官署出。\"\n\n\"食契呢？\"\n\n\"吃饭的凭据。\"我说，\"后宫里按位分领膳，凭契领食。什么位分，领什么食，肉、米、酱、酒，各是一路。\"\n\n\"那这一块没字的，\"把头把银符举到我眼前，\"领的是什么饭？\"\n\n我盯着那片空白的银面，脑子里把两天来所有的线头一根根捋过去。\n\n被杀绝的消奴部。\n\n壁画上被涂改的四个小人，和那口特意留白的空锅。\n\n长顺画的空锅，锅里什么都没有。\n\n\"领不着饭的。\"我听见自己说，\"把头——这一块，是给消奴部的。\"\n\n\"说下去。\"\n\n\"五部盟誓，共立此坛，太官署铸契为凭。肉米酱酒，四部各领一块。\"我指着自己的心口，\"可后来消奴部被杀绝了。绝人之国，夺人之名——他们连'消奴'两个字都不许再存在。\"\n\n\"所以这一块上的字，被人为地取消了？\"\n\n\"不是取消。\"我说，\"是**留空**。\"\n\n\"留空？\"\n\n\"字铸不上去，因为名号被抹了。可盟约是五家的盟约，太官署的契是五家的契——**契不能少，字不能有**。\"我说，\"于是铸了一块空契。名分没了，饭还得给他留着。这是当年铸契的人，唯一敢做的事。\"\n\n把头托着那块银符，站了很久。\n\n拱顶的水珠又落下来一滴。\n\n\"云峰。\"他忽然说，\"你知道这块东西，在道上叫什么吗？\"\n\n\"请把头赐教。\"\n\n\"这叫**阴契**。\"把头把银符轻轻放进我手心，合上我的手指，\"阴契在谁手里，谁就是那一房的人。\"\n\n我的手一沉。\n\n\"把头，这——\"\n\n\"四块有字的，是死人的饭，收到咱们手里，那是财。\"把头看着我，一字一顿，\"这一块没字的，是活人的**名分**。云峰，你从它落在你手心里那一刻起，在这条线上，你就是消奴部的人了。\"\n\n\"这江湖上有多少双眼睛盯着这块东西——我要的不是你拿着它，是**认下它**。\"\n\n我攥着那块冰凉的银符，掌心出汗了。\n\n\"我认。\"我说。\n\n把头看了我很久，忽然笑了，皱纹全堆到眼角。\n\n\"好。\"他说，\"当年那白毛老头给我镜子的时候，也是这么说的。\"\n\n他弯腰，把掀翻的那口锅重新扣回原位，锅足朝天，一丝不差。\n\n\"这一锅，是消奴部的锅。\"他直起腰，\"锅在坛在。\"\n\n正说着，鱼哥胸口的布兜里，那只老避龙忽然剧烈地扑腾起来，扑得鱼哥整条胳膊都在抖。\n\n鱼哥把它掏出来。\n\n黑鸡在他掌心炸着毛，头扭向石室的北墙，喉咙里滚着咕声。\n\n北墙——正北那口锅的方位——墙根的阴影里。\n\n不知什么时候，多了一样东西。\n\n一只白纸灯笼。\n\n灯上画着一圈黑字。", "words": 1567, "html": "<p>\"六？\"鱼哥的气声里透着不敢信。<\/p>\n<p>\"五部，五口锅。\"我说，\"可方位线上留了六的数。\"<\/p>\n<p>把头蹲在西南墙根，手电贴着地皮，看了很久。<\/p>\n<p>\"云峰，你过来。\"他说，\"看这个角的地。\"<\/p>\n<p>我蹲过去。西南墙根的地面上，石板和其他地方一样平，一样干。可细看，石板的色气不一样——这一块地方的石板颜色深，深得发乌，接缝里的石茬是新的，茬面上还挂着石末。<\/p>\n<p>\"起过东西。\"我说，\"这里原本摆着第六样，被人起走了。\"<\/p>\n<p>\"多久？\"<\/p>\n<p>我拿指腹蹭了蹭石茬。石末还松，没长新苔。<\/p>\n<p>\"两三年。\"我说，\"跟老周收珍珠罐那批货出土的日子，对得上。\"<\/p>\n<p>鱼哥和把头对了个眼神。<\/p>\n<p>把头站起身，走到正中那口锅前，蹲下，双手按住锅的两耳。<\/p>\n<p>\"都退后，捂住口鼻。\"<\/p>\n<p>我们退开。他把头猛地一掀——<\/p>\n<p>\"轰\"的一声闷响，一股两千年没见过天日的灰气从锅底腾起来。锅掀翻在地，锅底朝天翻过来，露出底下的地面。<\/p>\n<p>地面正中，浅浅一个圆坑。<\/p>\n<p>坑里没有随葬，没有骨头，只有一片烧过的黑灰。<\/p>\n<p>灰上，压着一样东西。<\/p>\n<p>一锭银。<\/p>\n<p>不对——走近了看，是一块银牌。巴掌长，一指宽，边角齐整，银色黑里透白。我一眼就认出了它的制式——和我们手里那四块，一模一样。<\/p>\n<p>\"太官署食契。\"鱼哥低声说。<\/p>\n<p>把头拿起来，翻过正面。<\/p>\n<p>正面是空的。<\/p>\n<p>四块银符，分别铸着\"肉\"\"米\"\"酱\"\"酒\"四个字。这一块，铸纹的位置上，什么都没有。<\/p>\n<p>不是字磨没了。铸的时候，就没有字。<\/p>\n<p>一整块素面无字的银符。<\/p>\n<p>石室里静得只剩拱顶的水滴声。滴答。滴答。<\/p>\n<p>把头托着那块无字银符，翻来覆去看了三遍，忽然问：\"云峰，太官署是什么衙门？\"<\/p>\n<p>\"少府属官。\"我说，\"皇家的灶。天子的饭，从太官署出。\"<\/p>\n<p>\"食契呢？\"<\/p>\n<p>\"吃饭的凭据。\"我说，\"后宫里按位分领膳，凭契领食。什么位分，领什么食，肉、米、酱、酒，各是一路。\"<\/p>\n<p>\"那这一块没字的，\"把头把银符举到我眼前，\"领的是什么饭？\"<\/p>\n<p>我盯着那片空白的银面，脑子里把两天来所有的线头一根根捋过去。<\/p>\n<p>被杀绝的消奴部。<\/p>\n<p>壁画上被涂改的四个小人，和那口特意留白的空锅。<\/p>\n<p>长顺画的空锅，锅里什么都没有。<\/p>\n<p>\"领不着饭的。\"我听见自己说，\"把头——这一块，是给消奴部的。\"<\/p>\n<p>\"说下去。\"<\/p>\n<p>\"五部盟誓，共立此坛，太官署铸契为凭。肉米酱酒，四部各领一块。\"我指着自己的心口，\"可后来消奴部被杀绝了。绝人之国，夺人之名——他们连'消奴'两个字都不许再存在。\"<\/p>\n<p>\"所以这一块上的字，被人为地取消了？\"<\/p>\n<p>\"不是取消。\"我说，\"是<strong>留空<\/strong>。\"<\/p>\n<p>\"留空？\"<\/p>\n<p>\"字铸不上去，因为名号被抹了。可盟约是五家的盟约，太官署的契是五家的契——<strong>契不能少，字不能有<\/strong>。\"我说，\"于是铸了一块空契。名分没了，饭还得给他留着。这是当年铸契的人，唯一敢做的事。\"<\/p>\n<p>把头托着那块银符，站了很久。<\/p>\n<p>拱顶的水珠又落下来一滴。<\/p>\n<p>\"云峰。\"他忽然说，\"你知道这块东西，在道上叫什么吗？\"<\/p>\n<p>\"请把头赐教。\"<\/p>\n<p>\"这叫<strong>阴契<\/strong>。\"把头把银符轻轻放进我手心，合上我的手指，\"阴契在谁手里，谁就是那一房的人。\"<\/p>\n<p>我的手一沉。<\/p>\n<p>\"把头，这——\"<\/p>\n<p>\"四块有字的，是死人的饭，收到咱们手里，那是财。\"把头看着我，一字一顿，\"这一块没字的，是活人的<strong>名分<\/strong>。云峰，你从它落在你手心里那一刻起，在这条线上，你就是消奴部的人了。\"<\/p>\n<p>\"这江湖上有多少双眼睛盯着这块东西——我要的不是你拿着它，是<strong>认下它<\/strong>。\"<\/p>\n<p>我攥着那块冰凉的银符，掌心出汗了。<\/p>\n<p>\"我认。\"我说。<\/p>\n<p>把头看了我很久，忽然笑了，皱纹全堆到眼角。<\/p>\n<p>\"好。\"他说，\"当年那白毛老头给我镜子的时候，也是这么说的。\"<\/p>\n<p>他弯腰，把掀翻的那口锅重新扣回原位，锅足朝天，一丝不差。<\/p>\n<p>\"这一锅，是消奴部的锅。\"他直起腰，\"锅在坛在。\"<\/p>\n<p>正说着，鱼哥胸口的布兜里，那只老避龙忽然剧烈地扑腾起来，扑得鱼哥整条胳膊都在抖。<\/p>\n<p>鱼哥把它掏出来。<\/p>\n<p>黑鸡在他掌心炸着毛，头扭向石室的北墙，喉咙里滚着咕声。<\/p>\n<p>北墙——正北那口锅的方位——墙根的阴影里。<\/p>\n<p>不知什么时候，多了一样东西。<\/p>\n<p>一只白纸灯笼。<\/p>\n<p>灯上画着一圈黑字。<\/p>", "plain": "\"六？\"鱼哥的气声里透着不敢信。 \"五部，五口锅。\"我说，\"可方位线上留了六的数。\" 把头蹲在西南墙根，手电贴着地皮，看了很久。 \"云峰，你过来。\"他说，\"看这个角的地。\" 我蹲过去。西南墙根的地面上，石板和其他地方一样平，一样干。可细看，石板的色气不一样——这一块地方的石板颜色深，深得发乌，接缝里的石茬是新的，茬面上还挂着石末。 \"起过东西。\"我说，\"这里原本摆着第六样，被人起走了。\" \"多久？\" 我拿指腹蹭了蹭石茬。石末还松，没长新苔。 \"两三年。\"我说，\"跟老周收珍珠罐那批货出土的日子，对得上。\" 鱼哥和把头对了个眼神。 把头站起身，走到正中那口锅前，蹲下，双手按住锅的两耳。 \"都退后，捂住口鼻。\" 我们退开。他把头猛地一掀—— \"轰\"的一声闷响，一股两千年没见过天日的灰气从锅底腾起来。锅掀翻在地，锅底朝天翻过来，露出底下的地面。 地面正中，浅浅一个圆坑。 坑里没有随葬，没有骨头，只有一片烧过的黑灰。 灰上，压着一样东西。 一锭银。 不对——走近了看，是一块银牌。巴掌长，一指宽，边角齐整，银色黑里透白。我一眼就认出了它的制式——和我们手里那四块，一模一样。 \"太官署食契。\"鱼哥低声说。 把头拿起来，翻过正面。 正面是空的。 四块银符，分别铸着\"肉\"\"米\"\"酱\"\"酒\"四个字。这一块，铸纹的位置上，什么都没有。 不是字磨没了。铸的时候，就没有字。 一整块素面无字的银符。 石室里静得只剩拱顶的水滴声。滴答。滴答。 把头托着那块无字银符，翻来覆去看了三遍，忽然问：\"云峰，太官署是什么衙门？\" \"少府属官。\"我说，\"皇家的灶。天子的饭，从太官署出。\" \"食契呢？\" \"吃饭的凭据。\"我说，\"后宫里按位分领膳，凭契领食。什么位分，领什么食，肉、米、酱、酒，各是一路。\" \"那这一块没字的，\"把头把银符举到我眼前，\"领的是什么饭？\" 我盯着那片空白的银面，脑子里把两天来所有的线头一根根捋过去。 被杀绝的消奴部。 壁画上被涂改的四个小人，和那口特意留白的空锅。 长顺画的空锅，锅里什么都没有。 \"领不着饭的。\"我听见自己说，\"把头——这一块，是给消奴部的。\" \"说下去。\" \"五部盟誓，共立此坛，太官署铸契为凭。肉米酱酒，四部各领一块。\"我指着自己的心口，\"可后来消奴部被杀绝了。绝人之国，夺人之名——他们连'消奴'两个字都不许再存在。\" \"所以这一块上的字，被人为地取消了？\" \"不是取消。\"我说，\"是留空。\" \"留空？\" \"字铸不上去，因为名号被抹了。可盟约是五家的盟约，太官署的契是五家的契——契不能少，字不能有。\"我说，\"于是铸了一块空契。名分没了，饭还得给他留着。这是当年铸契的人，唯一敢做的事。\" 把头托着那块银符，站了很久。 拱顶的水珠又落下来一滴。 \"云峰。\"他忽然说，\"你知道这块东西，在道上叫什么吗？\" \"请把头赐教。\" \"这叫阴契。\"把头把银符轻轻放进我手心，合上我的手指，\"阴契在谁手里，谁就是那一房的人。\" 我的手一沉。 \"把头，这——\" \"四块有字的，是死人的饭，收到咱们手里，那是财。\"把头看着我，一字一顿，\"这一块没字的，是活人的名分。云峰，你从它落在你手心里那一刻起，在这条线上，你就是消奴部的人了。\" \"这江湖上有多少双眼睛盯着这块东西——我要的不是你拿着它，是认下它。\" 我攥着那块冰凉的银符，掌心出汗了。 \"我认。\"我说。 把头看了我很久，忽然笑了，皱纹全堆到眼角。 \"好。\"他说，\"当年那白毛老头给我镜子的时候，也是这么说的。\" 他弯腰，把掀翻的那口锅重新扣回原位，锅足朝天，一丝不差。 \"这一锅，是消奴部的锅。\"他直起腰，\"锅在坛在。\" 正说着，鱼哥胸口的布兜里，那只老避龙忽然剧烈地扑腾起来，扑得鱼哥整条胳膊都在抖。 鱼哥把它掏出来。 黑鸡在他掌心炸着毛，头扭向石室的北墙，喉咙里滚着咕声。 北墙——正北那口锅的方位——墙根的阴影里。 不知什么时候，多了一样东西。 一只白纸灯笼。 灯上画着一圈黑字。"}, {"id": "A5-070", "arc": "A5", "num": 70, "title": "有人来过", "md": "谁都没动。\n\n那只白纸灯笼就挂在北墙根，用一根细麻绳吊在墙上凿出的浅槽里，离地半尺，微微地晃。\n\n灯笼不大，白纸的罩子，竹篾的骨。罩子上用墨画着一圈字，一圈连着一圈，首尾相接，转着灯看，那字像是在纸上走。\n\n鱼哥盯着那圈字，脸色一点点变了。\n\n\"云峰，\"他的气声发紧，\"这灯笼……我在哪儿见过。\"\n\n\"沈清荷的梦里。\"\n\n\"不止。\"鱼哥说，\"十年前，少林寺后山的塔林。我师傅圆寂那天夜里，塔林里也挑着一只这样的灯笼。白纸，墨圈字。当时老人们都说是塔林的老和尚挑的，可塔林里只有塔。\"\n\n\"墨圈字认得吗？\"\n\n\"认得一半。\"鱼哥眯着眼，\"转圈写的，得连起来念。是——'**一灯既起，五部来归；六位既满，骨城自开**'。\"\n\n骨城。\n\n纥升骨城。\n\n我攥着兜里那块无字阴契，手心一下子全湿了。\n\n\"这是**请**。\"把头的气声很低，\"挂灯，是江湖上请人的规矩。这灯挂在这儿——\"\n\n\"请谁？\"\n\n把头没答。他抬手，示意我看灯底下。\n\n灯底下，垫着半块青砖。砖面上，端端正正摆着一样东西。\n\n一截烟屁股。\n\n烟丝还潮着，过滤嘴上咬痕新鲜。鱼哥用蛇叉子挑起来，凑到鼻子底下闻了闻，眉毛拧成一团。\n\n\"东北烟，烤的。抽得急，没抽完就掐了。\"他说，\"顶多，是今天的事。\"\n\n今天。\n\n我们进沟这半宿，有人先进了这间石室，在这儿抽了半支烟，挂了灯，走了。\n\n\"还有。\"王药根忽然蹲下去，指着砖旁边墙根的石面。\n\n石面上有字。\n\n粉笔写的，字很粗，笔画乱，像是用半截粉笔头仓促划的。不是汉字——是拼音，夹杂着两个汉字，歪歪扭扭一行：\n\n**\"lao san si zai zhe li  05.7.11  老五别找我\"**\n\n我的呼吸停了一拍。\n\n05.7.11。\n\n2005年7月11日。\n\n王长顺画的那张纸背面，铅笔字：**七月十一。**\n\n\"老三……死在这里。\"鱼哥一字一字念出声，\"老五，别找我。\"\n\n王药根整个人扑到墙根前，手电的光在他手里乱颤。他看着那行字，看了很久很久，忽然伸手去摸那个\"三\"字，摸了一遍又一遍。\n\n\"五年了……\"老头的声音哑得不成样子，\"我找了他五年……我儿子到死都说'锅是空的'，原来是替这个'老三'捎的话……\"\n\n\"大爷。\"我把手按在他肩膀上。\n\n\"这字不对。\"他把头忽然蹲下来。\n\n\"哪儿不对？\"\n\n\"落款。\"把头指着自己看到的疑点，\"2005年7月11日，你儿子还没进沟。进沟是两年前——2005年的夏天，那五个人刚走。这行字是**他们五个人里的人**写的，写的时候，'老三'刚死。\"\n\n他抬起头，看着我们。\n\n\"可是云峰，你想——断崖底下那三具尸骨，是**没有头**的。'老三死在这里'——死在这里的人，头呢？\"\n\n石室里的水滴声，一滴，一滴。\n\n\"还有更邪的。\"鱼哥站起身，走到石室的另一头，手电压得极低。\n\n\"你们来看这个。\"\n\n西北角，墙根。\n\n石壁上，打着两个钢钎眼。\n\n眼是新打的，眼壁的石茬雪白，石粉还没被潮气浸透，我们进来到现在，最多三个时辰——这钎眼，就是这两天里打的。\n\n钎眼里楔着一根钢钎，钎头上，系着半截红布条。\n\n布条鲜红，新崭崭的，边角剪得齐齐整整，上头用红丝线锁着一圈小字。\n\n我凑近了一看，头皮\"轰\"地炸开。\n\n红丝线锁的字，和加油站那两条飘带上的绣字，是同一种针脚。\n\n老鼠男的针脚。\n\n\"大爷。\"我回头。\n\n王药根还在墙根摸着那行粉笔字，没回头。\n\n\"这布条上的针脚，\"我说，\"跟加油站那个老鼠男的，一模一样。\"\n\n把头沉默了很久。\n\n他走过去，把那根钢钎拔出来看了看，又原样楔回去，红布条理顺，退开一步。\n\n\"云峰，\"他说，\"你还记得老鼠男的话吗。\"\n\n\"'进去的可以，出来的不行。'\"我说。\n\n\"还有后半句呢？\"\n\n我想了想：\"……他说两年前那五个人，四个没出来。\"\n\n\"对。\"把头说，\"五进两出，是王老丈的说法。四个没出来，是他的说法。现在你再把这行字连起来看——\"\n\n他一个字一个字地往下说：\n\n\"'老三死在这里'——老三没出来。\"\n\n\"'老五别找我'——写这行字的人，也不是出来的那个。\"\n\n\"五个外路人。一个死在沟里，写字的这个，也留在了沟里。真正走出去的，从头到尾——**只有酒糟鼻一个。**\"\n\n\"那王药根看见的另一个出来的呢？\"\n\n\"白头发。\"把头说，\"你还没想过一个问题——那个'白头发瘦子'，跟我三十七年前见过的白毛老头，是一个岁数。\"\n\n我浑身的血一下子凉了。\n\n鱼哥胸口的布兜里，老避龙忽然疯了一样扑腾起来。\n\n紧跟着——\n\n\"吱——嘎。\"\n\n锅盖磨石头的声音。\n\n不在石室里。\n\n在缝外。在沟里。在我们头顶的鹰嘴石梁上，一声，又一声，不紧不慢，朝这边来了。\n\n把头一口气吹灭了鱼哥的手电。\n\n黑暗里，他抓住我的手腕，把一样小东西按进我手心——是无字阴契。\n\n\"背熟我这句话。\"他的气声贴着我耳朵，轻得像一缕烟：\n\n\"灯要是问你要锅——\"\n\n\"**你就把阴契亮给它看。**\"", "words": 1837, "html": "<p>谁都没动。<\/p>\n<p>那只白纸灯笼就挂在北墙根，用一根细麻绳吊在墙上凿出的浅槽里，离地半尺，微微地晃。<\/p>\n<p>灯笼不大，白纸的罩子，竹篾的骨。罩子上用墨画着一圈字，一圈连着一圈，首尾相接，转着灯看，那字像是在纸上走。<\/p>\n<p>鱼哥盯着那圈字，脸色一点点变了。<\/p>\n<p>\"云峰，\"他的气声发紧，\"这灯笼……我在哪儿见过。\"<\/p>\n<p>\"沈清荷的梦里。\"<\/p>\n<p>\"不止。\"鱼哥说，\"十年前，少林寺后山的塔林。我师傅圆寂那天夜里，塔林里也挑着一只这样的灯笼。白纸，墨圈字。当时老人们都说是塔林的老和尚挑的，可塔林里只有塔。\"<\/p>\n<p>\"墨圈字认得吗？\"<\/p>\n<p>\"认得一半。\"鱼哥眯着眼，\"转圈写的，得连起来念。是——'<strong>一灯既起，五部来归；六位既满，骨城自开<\/strong>'。\"<\/p>\n<p>骨城。<\/p>\n<p>纥升骨城。<\/p>\n<p>我攥着兜里那块无字阴契，手心一下子全湿了。<\/p>\n<p>\"这是<strong>请<\/strong>。\"把头的气声很低，\"挂灯，是江湖上请人的规矩。这灯挂在这儿——\"<\/p>\n<p>\"请谁？\"<\/p>\n<p>把头没答。他抬手，示意我看灯底下。<\/p>\n<p>灯底下，垫着半块青砖。砖面上，端端正正摆着一样东西。<\/p>\n<p>一截烟屁股。<\/p>\n<p>烟丝还潮着，过滤嘴上咬痕新鲜。鱼哥用蛇叉子挑起来，凑到鼻子底下闻了闻，眉毛拧成一团。<\/p>\n<p>\"东北烟，烤的。抽得急，没抽完就掐了。\"他说，\"顶多，是今天的事。\"<\/p>\n<p>今天。<\/p>\n<p>我们进沟这半宿，有人先进了这间石室，在这儿抽了半支烟，挂了灯，走了。<\/p>\n<p>\"还有。\"王药根忽然蹲下去，指着砖旁边墙根的石面。<\/p>\n<p>石面上有字。<\/p>\n<p>粉笔写的，字很粗，笔画乱，像是用半截粉笔头仓促划的。不是汉字——是拼音，夹杂着两个汉字，歪歪扭扭一行：<\/p>\n<p><strong>\"lao san si zai zhe li  05.7.11  老五别找我\"<\/strong><\/p>\n<p>我的呼吸停了一拍。<\/p>\n<p>05.7.11。<\/p>\n<p>2005年7月11日。<\/p>\n<p>王长顺画的那张纸背面，铅笔字：<strong>七月十一。<\/strong><\/p>\n<p>\"老三……死在这里。\"鱼哥一字一字念出声，\"老五，别找我。\"<\/p>\n<p>王药根整个人扑到墙根前，手电的光在他手里乱颤。他看着那行字，看了很久很久，忽然伸手去摸那个\"三\"字，摸了一遍又一遍。<\/p>\n<p>\"五年了……\"老头的声音哑得不成样子，\"我找了他五年……我儿子到死都说'锅是空的'，原来是替这个'老三'捎的话……\"<\/p>\n<p>\"大爷。\"我把手按在他肩膀上。<\/p>\n<p>\"这字不对。\"他把头忽然蹲下来。<\/p>\n<p>\"哪儿不对？\"<\/p>\n<p>\"落款。\"把头指着自己看到的疑点，\"2005年7月11日，你儿子还没进沟。进沟是两年前——2005年的夏天，那五个人刚走。这行字是<strong>他们五个人里的人<\/strong>写的，写的时候，'老三'刚死。\"<\/p>\n<p>他抬起头，看着我们。<\/p>\n<p>\"可是云峰，你想——断崖底下那三具尸骨，是<strong>没有头<\/strong>的。'老三死在这里'——死在这里的人，头呢？\"<\/p>\n<p>石室里的水滴声，一滴，一滴。<\/p>\n<p>\"还有更邪的。\"鱼哥站起身，走到石室的另一头，手电压得极低。<\/p>\n<p>\"你们来看这个。\"<\/p>\n<p>西北角，墙根。<\/p>\n<p>石壁上，打着两个钢钎眼。<\/p>\n<p>眼是新打的，眼壁的石茬雪白，石粉还没被潮气浸透，我们进来到现在，最多三个时辰——这钎眼，就是这两天里打的。<\/p>\n<p>钎眼里楔着一根钢钎，钎头上，系着半截红布条。<\/p>\n<p>布条鲜红，新崭崭的，边角剪得齐齐整整，上头用红丝线锁着一圈小字。<\/p>\n<p>我凑近了一看，头皮\"轰\"地炸开。<\/p>\n<p>红丝线锁的字，和加油站那两条飘带上的绣字，是同一种针脚。<\/p>\n<p>老鼠男的针脚。<\/p>\n<p>\"大爷。\"我回头。<\/p>\n<p>王药根还在墙根摸着那行粉笔字，没回头。<\/p>\n<p>\"这布条上的针脚，\"我说，\"跟加油站那个老鼠男的，一模一样。\"<\/p>\n<p>把头沉默了很久。<\/p>\n<p>他走过去，把那根钢钎拔出来看了看，又原样楔回去，红布条理顺，退开一步。<\/p>\n<p>\"云峰，\"他说，\"你还记得老鼠男的话吗。\"<\/p>\n<p>\"'进去的可以，出来的不行。'\"我说。<\/p>\n<p>\"还有后半句呢？\"<\/p>\n<p>我想了想：\"……他说两年前那五个人，四个没出来。\"<\/p>\n<p>\"对。\"把头说，\"五进两出，是王老丈的说法。四个没出来，是他的说法。现在你再把这行字连起来看——\"<\/p>\n<p>他一个字一个字地往下说：<\/p>\n<p>\"'老三死在这里'——老三没出来。\"<\/p>\n<p>\"'老五别找我'——写这行字的人，也不是出来的那个。\"<\/p>\n<p>\"五个外路人。一个死在沟里，写字的这个，也留在了沟里。真正走出去的，从头到尾——<strong>只有酒糟鼻一个。<\/strong>\"<\/p>\n<p>\"那王药根看见的另一个出来的呢？\"<\/p>\n<p>\"白头发。\"把头说，\"你还没想过一个问题——那个'白头发瘦子'，跟我三十七年前见过的白毛老头，是一个岁数。\"<\/p>\n<p>我浑身的血一下子凉了。<\/p>\n<p>鱼哥胸口的布兜里，老避龙忽然疯了一样扑腾起来。<\/p>\n<p>紧跟着——<\/p>\n<p>\"吱——嘎。\"<\/p>\n<p>锅盖磨石头的声音。<\/p>\n<p>不在石室里。<\/p>\n<p>在缝外。在沟里。在我们头顶的鹰嘴石梁上，一声，又一声，不紧不慢，朝这边来了。<\/p>\n<p>把头一口气吹灭了鱼哥的手电。<\/p>\n<p>黑暗里，他抓住我的手腕，把一样小东西按进我手心——是无字阴契。<\/p>\n<p>\"背熟我这句话。\"他的气声贴着我耳朵，轻得像一缕烟：<\/p>\n<p>\"灯要是问你要锅——\"<\/p>\n<p>\"<strong>你就把阴契亮给它看。<\/strong>\"<\/p>", "plain": "谁都没动。 那只白纸灯笼就挂在北墙根，用一根细麻绳吊在墙上凿出的浅槽里，离地半尺，微微地晃。 灯笼不大，白纸的罩子，竹篾的骨。罩子上用墨画着一圈字，一圈连着一圈，首尾相接，转着灯看，那字像是在纸上走。 鱼哥盯着那圈字，脸色一点点变了。 \"云峰，\"他的气声发紧，\"这灯笼……我在哪儿见过。\" \"沈清荷的梦里。\" \"不止。\"鱼哥说，\"十年前，少林寺后山的塔林。我师傅圆寂那天夜里，塔林里也挑着一只这样的灯笼。白纸，墨圈字。当时老人们都说是塔林的老和尚挑的，可塔林里只有塔。\" \"墨圈字认得吗？\" \"认得一半。\"鱼哥眯着眼，\"转圈写的，得连起来念。是——'一灯既起，五部来归；六位既满，骨城自开'。\" 骨城。 纥升骨城。 我攥着兜里那块无字阴契，手心一下子全湿了。 \"这是请。\"把头的气声很低，\"挂灯，是江湖上请人的规矩。这灯挂在这儿——\" \"请谁？\" 把头没答。他抬手，示意我看灯底下。 灯底下，垫着半块青砖。砖面上，端端正正摆着一样东西。 一截烟屁股。 烟丝还潮着，过滤嘴上咬痕新鲜。鱼哥用蛇叉子挑起来，凑到鼻子底下闻了闻，眉毛拧成一团。 \"东北烟，烤的。抽得急，没抽完就掐了。\"他说，\"顶多，是今天的事。\" 今天。 我们进沟这半宿，有人先进了这间石室，在这儿抽了半支烟，挂了灯，走了。 \"还有。\"王药根忽然蹲下去，指着砖旁边墙根的石面。 石面上有字。 粉笔写的，字很粗，笔画乱，像是用半截粉笔头仓促划的。不是汉字——是拼音，夹杂着两个汉字，歪歪扭扭一行： \"lao san si zai zhe li 05.7.11 老五别找我\" 我的呼吸停了一拍。 05.7.11。 2005年7月11日。 王长顺画的那张纸背面，铅笔字：七月十一。 \"老三……死在这里。\"鱼哥一字一字念出声，\"老五，别找我。\" 王药根整个人扑到墙根前，手电的光在他手里乱颤。他看着那行字，看了很久很久，忽然伸手去摸那个\"三\"字，摸了一遍又一遍。 \"五年了……\"老头的声音哑得不成样子，\"我找了他五年……我儿子到死都说'锅是空的'，原来是替这个'老三'捎的话……\" \"大爷。\"我把手按在他肩膀上。 \"这字不对。\"他把头忽然蹲下来。 \"哪儿不对？\" \"落款。\"把头指着自己看到的疑点，\"2005年7月11日，你儿子还没进沟。进沟是两年前——2005年的夏天，那五个人刚走。这行字是他们五个人里的人写的，写的时候，'老三'刚死。\" 他抬起头，看着我们。 \"可是云峰，你想——断崖底下那三具尸骨，是没有头的。'老三死在这里'——死在这里的人，头呢？\" 石室里的水滴声，一滴，一滴。 \"还有更邪的。\"鱼哥站起身，走到石室的另一头，手电压得极低。 \"你们来看这个。\" 西北角，墙根。 石壁上，打着两个钢钎眼。 眼是新打的，眼壁的石茬雪白，石粉还没被潮气浸透，我们进来到现在，最多三个时辰——这钎眼，就是这两天里打的。 钎眼里楔着一根钢钎，钎头上，系着半截红布条。 布条鲜红，新崭崭的，边角剪得齐齐整整，上头用红丝线锁着一圈小字。 我凑近了一看，头皮\"轰\"地炸开。 红丝线锁的字，和加油站那两条飘带上的绣字，是同一种针脚。 老鼠男的针脚。 \"大爷。\"我回头。 王药根还在墙根摸着那行粉笔字，没回头。 \"这布条上的针脚，\"我说，\"跟加油站那个老鼠男的，一模一样。\" 把头沉默了很久。 他走过去，把那根钢钎拔出来看了看，又原样楔回去，红布条理顺，退开一步。 \"云峰，\"他说，\"你还记得老鼠男的话吗。\" \"'进去的可以，出来的不行。'\"我说。 \"还有后半句呢？\" 我想了想：\"……他说两年前那五个人，四个没出来。\" \"对。\"把头说，\"五进两出，是王老丈的说法。四个没出来，是他的说法。现在你再把这行字连起来看——\" 他一个字一个字地往下说： \"'老三死在这里'——老三没出来。\" \"'老五别找我'——写这行字的人，也不是出来的那个。\" \"五个外路人。一个死在沟里，写字的这个，也留在了沟里。真正走出去的，从头到尾——只有酒糟鼻一个。\" \"那王药根看见的另一个出来的呢？\" \"白头发。\"把头说，\"你还没想过一个问题——那个'白头发瘦子'，跟我三十七年前见过的白毛老头，是一个岁数。\" 我浑身的血一下子凉了。 鱼哥胸口的布兜里，老避龙忽然疯了一样扑腾起来。 紧跟着—— \"吱——嘎。\" 锅盖磨石头的声音。 不在石室里。 在缝外。在沟里。在我们头顶的鹰嘴石梁上，一声，又一声，不紧不慢，朝这边来了。 把头一口气吹灭了鱼哥的手电。 黑暗里，他抓住我的手腕，把一样小东西按进我手心——是无字阴契。 \"背熟我这句话。\"他的气声贴着我耳朵，轻得像一缕烟： \"灯要是问你要锅——\" \"你就把阴契亮给它看。\""}, {"id": "A5-071", "arc": "A5", "num": 71, "title": "雨", "md": "黑暗里，谁都没敢出气。\n\n那块无字阴契被我攥在手心，攥得手心全是汗。我把头说的那两句话在舌头上翻来覆去过了几十遍——\n\n灯要是问你要锅，你就把阴契亮给它看。\n\n可那声音根本不是朝我们要锅来了。\n\n它是朝我们**来了**。\n\n\"吱——嘎。\"锅沿磨石头的动静在缝外响一声，停很久，再响一声，一声比一声近。我从没觉得黑暗里的等待这么熬人，我甚至能听见王药根胸腔里那颗心，跳得又重又乱。\n\n鱼哥把那只老避龙从布兜里掏出来，捂在胸口。黑鸡在他掌心里一动不动，脖子上的毛全炸着，两只芝麻眼直勾勾盯着同一个方向——\n\n缝口。\n\n就在这时，石室里忽然暗了一下。\n\n黑是不该有\"暗\"这个说法的，我闭着眼跟睁着眼没两样。可我清清楚楚感觉到，天光没变，是有什么东西，把缝口最后那点夜气挡住了。\n\n有什么东西，站在了缝口外面。\n\n我后背的汗一下子凉了。\n\n\"——哗啦。\"\n\n雨来了。\n\n不是一滴一滴落下来的，是一整堵墙一样拍下来的。那声\"哗啦\"刚起来就被吞没了，紧跟着是雷——一声炸雷贴着山脊滚过去，震得脚底下的石板都在颤。闪电的光从缝口灌进来，石室里白了一瞬。\n\n就那一瞬，我看清了站在对面的王药根：脸白得没一点血色，嘴唇在动，无声地念叨着什么。\n\n那声音没了。\n\n锅盖磨石头的声、脚步声、所有声响，全被暴雨的轰鸣盖得干干净净。缝口像被人泼了一盆瀑布，浑黄的泥水顺着石壁灌进来，在入口的地面上漫开一片，又顺着斜坡哗哗地淌下去。\n\n我这才觉出自己腿肚子在转筋。\n\n\"往里退。\"把头的气声几乎听不见，\"贴着东壁，别碰锅。\"\n\n我们四个贴着墙根往石室里退。雨水只跟进到入口两三步就退了，石室正中还是干的。拱顶那根石钟乳上的水滴得急了，从滴答变成了连成线的\"嗒嗒嗒\"，落在那个浅浅的石窝里，溅起的水星子冰凉。\n\n雨下了半个时辰，没有要停的意思。\n\n没有火，没有亮，四个人缩在东壁的阴影里，听着外头整座山都在嚎。王药根摸索着从怀里掏出干粮袋子，又摸出个军用水壶，先递给把头。\n\n把头没接。\n\n\"老丈，\"他的声音平得像在说今天吃啥，\"你先前说，你儿子压在这缝里头。\"\n\"嗯。\"\n\n\"这雨，是山雨还是天雨？\"\n\n王药根握着水壶的手停了停。\n\n老辈人管雨分两样。沟外下的、哪都下的，叫天雨；光是这一片山、这一条沟里下的，山洪冲下来的，叫山雨。山雨不是老天爷下的，是\"那位\"的脾气。\n\n\"天雨。\"老头隔了半晌才答，\"这雨脚粗，云头低，是压过来的雨，不是山根底下冒上来的。\"\n\n\"那就好。\"把头点了点头，接过水壶抿了一口，\"天雨，咱们就等得起。沟口那两堵收拢的石头，平时过人还擦肩膀，这一夜山洪下去，明早准保叫石头缝里卡满了树桩子。走不了。\"\n\n\"走不了？\"鱼哥的声音哑得厉害。\n\n\"走不了。\"把头说，\"这雨不停，水不退，谁也出不去。连夜走那两道收拢口，是往鬼门关里送。\"\n\n我们四个把行头都拖到东壁根底下，贴着石壁坐下。我趁着雨声的掩护摸到缝口边看了一眼——雨水顺着石壁倒灌进来，在入口聚成一汪浑汤，又顺着斜坡往下淌，把地面冲出一道新沟。浑汤里卷着草根、树皮、烂树叶子，还有一截烧焦的木棍，一头黑糊糊的，像让火燎过，又让水浸得透透的。\n\n我拿脚尖把它拨到一边，没敢上手。\n\n王药根在黑暗里像是看见了，压着嗓子说：\"雨打山头，焦木头往下滚，常有的事。\"停了一停，又补了一句，\"只是这一截，燎的是松明子。山里拢火才用松明子，劈柴燎不出这色气。\"\n\n我没接话。\n\n松明子。我在心里把这三个字搁下了。进缝以前，我趴在那道人工石缝口上，闻到过一股烟味，混着香灰的甜，又细又凉地往外走。当时把头说，里头有人点了灯，从两千年前一直点到了今天。\n\n这一场雨把外头冲得稀里哗啦，却把缝里那股烟味，压得一丝也闻不见了。\n\n我在黑暗里听着把头刚才那番话，心里清楚他还有半句没说出来——这雨把我们困在这儿，可他也未必真想走。\n\n灯还挂在那儿。\n\n挂灯是请人。请的人没露面，被请的先抬脚走了，传出去就是不懂规矩。把头这人干了一辈子，最忌讳的从来不是死，是**坏规矩**。\n\n\"都歇着吧。\"把头说，\"把湿衣裳拧了，靠墙睡。云峰你头班。\"\n\n\"我守。\"王药根忽然说，\"让云峰小子先睡，他眼睛熬不住。\"\n\n\"老丈，你手——\"\n\n\"手不碍事。心里有事，睡也睡不实。\"老头把干粮塞到我手里，\"吃。吃饱了好换我。\"\n\n我嚼着那两块干巴巴的贴饼子，饼子是冷的，掰开能看到里头的面渣。我一边嚼一边往石室深处看——那头，正北墙根底下，那盏白纸灯笼还挂在那。黑咕隆咚的什么也看不见，可我总觉得，它在那儿。\n\n看得见看不见，它都在那儿。\n\n雨声里，王药根忽然开口，声音低得像是自言自语：\n\n\"我儿子小时候，我教过他看锅。\"\n\n我咽下饼子：\"看锅？\"\n\n\"山里人家，灶上那口锅是有讲究的。\"老头的嗓音在黑暗里显得又干又涩，\"锅盖掀开，饭在里头，那叫锅是满的，家里人齐。锅盖扣着，饭在里头温着，那是等人。锅盖掀开，锅是空的——那就是告诉外头：这家没饭了，这家人，走绝了。\"\n\n雨声灌满石室。\n\n\"长顺这孩子，打小就爱学我这些老话。\"王药根的声音顿了顿，\"他死前跟我说，他看见一口空锅。我一直当他是说胡话。\"\n\n\"现在呢？\"\n\n\"现在我知道了。\"老头说，\"他没说胡话。他是真看见了——他不是看见，他是**替谁捎话**。有人走不出去，借着活人的嘴，把'锅是空的'这五个字，捎给他爹。\"\n\n\"捎给您的？\"\n\n\"捎给能听懂的人。\"王药根慢慢地说，\"就像这灯，它不是给咱们挂的。它是挂给——走得动的人看的。\"\n\n石室里的滴水声和他的话音混在一起。鱼哥靠在墙上，半天没出声。\n\n\"大爷，\"他忽然问，\"你说这灯是挂给走得动的人看的。那你儿子，算走得动的，还是走不动的？\"\n\n王药根没答。\n\n过了很久，久到我以为他睡过去了，才听见黑暗里传来一声极轻的、像是咽了口气的声音：\n\n\"……他要是走得动，就不会让我找五年了。\"\n\n雨下到后半夜才小了些。\n\n我靠在东壁的墙角，把湿透了的外套裹紧，身上一阵一阵发冷。眼皮沉得厉害，可我不敢睡实——头班的人守不实，是给全伙人找不自在。\n\n鱼哥睡了。他睡在离北墙最远的位置，蜷着，呼吸又轻又匀。那只老避龙被他重新揣回布兜里，黑鸡的脑袋搭在兜沿上，眼睛半闭，像是也睡了。\n\n王药根坐在我斜对面，背靠石壁，响哨棍横在膝上。他没睡，浑浊的眼睛半睁着，望着正北墙根那一点看不真切的黑暗——望着那盏灯笼。\n\n把头坐在最靠缝口的地方。他是殿后的。\n\n我盯着他看了好一会儿。\n\n他坐在那，脊背挺得笔直，不像是在躲雨，倒像是在等雨停，好去会一会外头那个挂灯的人。我跟了他这么多年，还从没见过他这副神气——不是怕，也不是狠，是**早定了主意**的神气。\n\n我摸了摸怀里的手机，没敢掏出来看亮。这一天一夜，信号早就断在山外头了。\n\n\"第三宿了。\"王药根像是知道我在想什么，声音低得像从石头缝里挤出来的，\"山里行路的老话——头一宿是探路，二一宿是过堂，到第三宿，才是正主儿出来答话的时候。\"\n\n\"大爷是说，咱们赶上正主儿答话了？\"\n\n\"赶上没赶上，\"他说，\"天亮就知道了。\"\n\n我没再问。那块阴契贴着心口，凉得跟块铁一样。\n\n雨声稀疏下来以后，石室里重新听见了拱顶的水滴声。嗒，嗒，嗒。\n\n我数着水滴声提神。数到第四十几下的时候，我忽然觉出不对——\n\n那滴水声，变慢了。\n\n不是慢一点点。是慢了整整一半。\n\n我抬起头，拱顶黑糊糊的，什么也看不见。水滴还是往下落，可它落下来的声音，从\"嗒……嗒……\"变成了隔得很长的一声：\n\n嗒。\n\n——\n\n嗒。\n\n——\n\n像是有个什么东西，在石窝上头，把那水珠一颗一颗地**接**住了。\n\n我浑身的汗毛一下子竖了起来。\n\n王药根几乎同时动了。他腰杆猛地一直，响哨棍横在身前，压着嗓子低喝了一声：\n\n\"谁？！\"\n\n石室里静了一瞬。\n\n然后，从正北墙根那盏灯笼的方向，传来了一声极轻的、纸张摩挲的动静——\n\n\"窸。\"", "words": 3026, "html": "<p>黑暗里，谁都没敢出气。<\/p>\n<p>那块无字阴契被我攥在手心，攥得手心全是汗。我把头说的那两句话在舌头上翻来覆去过了几十遍——<\/p>\n<p>灯要是问你要锅，你就把阴契亮给它看。<\/p>\n<p>可那声音根本不是朝我们要锅来了。<\/p>\n<p>它是朝我们<strong>来了<\/strong>。<\/p>\n<p>\"吱——嘎。\"锅沿磨石头的动静在缝外响一声，停很久，再响一声，一声比一声近。我从没觉得黑暗里的等待这么熬人，我甚至能听见王药根胸腔里那颗心，跳得又重又乱。<\/p>\n<p>鱼哥把那只老避龙从布兜里掏出来，捂在胸口。黑鸡在他掌心里一动不动，脖子上的毛全炸着，两只芝麻眼直勾勾盯着同一个方向——<\/p>\n<p>缝口。<\/p>\n<p>就在这时，石室里忽然暗了一下。<\/p>\n<p>黑是不该有\"暗\"这个说法的，我闭着眼跟睁着眼没两样。可我清清楚楚感觉到，天光没变，是有什么东西，把缝口最后那点夜气挡住了。<\/p>\n<p>有什么东西，站在了缝口外面。<\/p>\n<p>我后背的汗一下子凉了。<\/p>\n<p>\"——哗啦。\"<\/p>\n<p>雨来了。<\/p>\n<p>不是一滴一滴落下来的，是一整堵墙一样拍下来的。那声\"哗啦\"刚起来就被吞没了，紧跟着是雷——一声炸雷贴着山脊滚过去，震得脚底下的石板都在颤。闪电的光从缝口灌进来，石室里白了一瞬。<\/p>\n<p>就那一瞬，我看清了站在对面的王药根：脸白得没一点血色，嘴唇在动，无声地念叨着什么。<\/p>\n<p>那声音没了。<\/p>\n<p>锅盖磨石头的声、脚步声、所有声响，全被暴雨的轰鸣盖得干干净净。缝口像被人泼了一盆瀑布，浑黄的泥水顺着石壁灌进来，在入口的地面上漫开一片，又顺着斜坡哗哗地淌下去。<\/p>\n<p>我这才觉出自己腿肚子在转筋。<\/p>\n<p>\"往里退。\"把头的气声几乎听不见，\"贴着东壁，别碰锅。\"<\/p>\n<p>我们四个贴着墙根往石室里退。雨水只跟进到入口两三步就退了，石室正中还是干的。拱顶那根石钟乳上的水滴得急了，从滴答变成了连成线的\"嗒嗒嗒\"，落在那个浅浅的石窝里，溅起的水星子冰凉。<\/p>\n<p>雨下了半个时辰，没有要停的意思。<\/p>\n<p>没有火，没有亮，四个人缩在东壁的阴影里，听着外头整座山都在嚎。王药根摸索着从怀里掏出干粮袋子，又摸出个军用水壶，先递给把头。<\/p>\n<p>把头没接。<\/p>\n<p>\"老丈，\"他的声音平得像在说今天吃啥，\"你先前说，你儿子压在这缝里头。\"\"嗯。\"<\/p>\n<p>\"这雨，是山雨还是天雨？\"<\/p>\n<p>王药根握着水壶的手停了停。<\/p>\n<p>老辈人管雨分两样。沟外下的、哪都下的，叫天雨；光是这一片山、这一条沟里下的，山洪冲下来的，叫山雨。山雨不是老天爷下的，是\"那位\"的脾气。<\/p>\n<p>\"天雨。\"老头隔了半晌才答，\"这雨脚粗，云头低，是压过来的雨，不是山根底下冒上来的。\"<\/p>\n<p>\"那就好。\"把头点了点头，接过水壶抿了一口，\"天雨，咱们就等得起。沟口那两堵收拢的石头，平时过人还擦肩膀，这一夜山洪下去，明早准保叫石头缝里卡满了树桩子。走不了。\"<\/p>\n<p>\"走不了？\"鱼哥的声音哑得厉害。<\/p>\n<p>\"走不了。\"把头说，\"这雨不停，水不退，谁也出不去。连夜走那两道收拢口，是往鬼门关里送。\"<\/p>\n<p>我们四个把行头都拖到东壁根底下，贴着石壁坐下。我趁着雨声的掩护摸到缝口边看了一眼——雨水顺着石壁倒灌进来，在入口聚成一汪浑汤，又顺着斜坡往下淌，把地面冲出一道新沟。浑汤里卷着草根、树皮、烂树叶子，还有一截烧焦的木棍，一头黑糊糊的，像让火燎过，又让水浸得透透的。<\/p>\n<p>我拿脚尖把它拨到一边，没敢上手。<\/p>\n<p>王药根在黑暗里像是看见了，压着嗓子说：\"雨打山头，焦木头往下滚，常有的事。\"停了一停，又补了一句，\"只是这一截，燎的是松明子。山里拢火才用松明子，劈柴燎不出这色气。\"<\/p>\n<p>我没接话。<\/p>\n<p>松明子。我在心里把这三个字搁下了。进缝以前，我趴在那道人工石缝口上，闻到过一股烟味，混着香灰的甜，又细又凉地往外走。当时把头说，里头有人点了灯，从两千年前一直点到了今天。<\/p>\n<p>这一场雨把外头冲得稀里哗啦，却把缝里那股烟味，压得一丝也闻不见了。<\/p>\n<p>我在黑暗里听着把头刚才那番话，心里清楚他还有半句没说出来——这雨把我们困在这儿，可他也未必真想走。<\/p>\n<p>灯还挂在那儿。<\/p>\n<p>挂灯是请人。请的人没露面，被请的先抬脚走了，传出去就是不懂规矩。把头这人干了一辈子，最忌讳的从来不是死，是<strong>坏规矩<\/strong>。<\/p>\n<p>\"都歇着吧。\"把头说，\"把湿衣裳拧了，靠墙睡。云峰你头班。\"<\/p>\n<p>\"我守。\"王药根忽然说，\"让云峰小子先睡，他眼睛熬不住。\"<\/p>\n<p>\"老丈，你手——\"<\/p>\n<p>\"手不碍事。心里有事，睡也睡不实。\"老头把干粮塞到我手里，\"吃。吃饱了好换我。\"<\/p>\n<p>我嚼着那两块干巴巴的贴饼子，饼子是冷的，掰开能看到里头的面渣。我一边嚼一边往石室深处看——那头，正北墙根底下，那盏白纸灯笼还挂在那。黑咕隆咚的什么也看不见，可我总觉得，它在那儿。<\/p>\n<p>看得见看不见，它都在那儿。<\/p>\n<p>雨声里，王药根忽然开口，声音低得像是自言自语：<\/p>\n<p>\"我儿子小时候，我教过他看锅。\"<\/p>\n<p>我咽下饼子：\"看锅？\"<\/p>\n<p>\"山里人家，灶上那口锅是有讲究的。\"老头的嗓音在黑暗里显得又干又涩，\"锅盖掀开，饭在里头，那叫锅是满的，家里人齐。锅盖扣着，饭在里头温着，那是等人。锅盖掀开，锅是空的——那就是告诉外头：这家没饭了，这家人，走绝了。\"<\/p>\n<p>雨声灌满石室。<\/p>\n<p>\"长顺这孩子，打小就爱学我这些老话。\"王药根的声音顿了顿，\"他死前跟我说，他看见一口空锅。我一直当他是说胡话。\"<\/p>\n<p>\"现在呢？\"<\/p>\n<p>\"现在我知道了。\"老头说，\"他没说胡话。他是真看见了——他不是看见，他是<strong>替谁捎话<\/strong>。有人走不出去，借着活人的嘴，把'锅是空的'这五个字，捎给他爹。\"<\/p>\n<p>\"捎给您的？\"<\/p>\n<p>\"捎给能听懂的人。\"王药根慢慢地说，\"就像这灯，它不是给咱们挂的。它是挂给——走得动的人看的。\"<\/p>\n<p>石室里的滴水声和他的话音混在一起。鱼哥靠在墙上，半天没出声。<\/p>\n<p>\"大爷，\"他忽然问，\"你说这灯是挂给走得动的人看的。那你儿子，算走得动的，还是走不动的？\"<\/p>\n<p>王药根没答。<\/p>\n<p>过了很久，久到我以为他睡过去了，才听见黑暗里传来一声极轻的、像是咽了口气的声音：<\/p>\n<p>\"……他要是走得动，就不会让我找五年了。\"<\/p>\n<p>雨下到后半夜才小了些。<\/p>\n<p>我靠在东壁的墙角，把湿透了的外套裹紧，身上一阵一阵发冷。眼皮沉得厉害，可我不敢睡实——头班的人守不实，是给全伙人找不自在。<\/p>\n<p>鱼哥睡了。他睡在离北墙最远的位置，蜷着，呼吸又轻又匀。那只老避龙被他重新揣回布兜里，黑鸡的脑袋搭在兜沿上，眼睛半闭，像是也睡了。<\/p>\n<p>王药根坐在我斜对面，背靠石壁，响哨棍横在膝上。他没睡，浑浊的眼睛半睁着，望着正北墙根那一点看不真切的黑暗——望着那盏灯笼。<\/p>\n<p>把头坐在最靠缝口的地方。他是殿后的。<\/p>\n<p>我盯着他看了好一会儿。<\/p>\n<p>他坐在那，脊背挺得笔直，不像是在躲雨，倒像是在等雨停，好去会一会外头那个挂灯的人。我跟了他这么多年，还从没见过他这副神气——不是怕，也不是狠，是<strong>早定了主意<\/strong>的神气。<\/p>\n<p>我摸了摸怀里的手机，没敢掏出来看亮。这一天一夜，信号早就断在山外头了。<\/p>\n<p>\"第三宿了。\"王药根像是知道我在想什么，声音低得像从石头缝里挤出来的，\"山里行路的老话——头一宿是探路，二一宿是过堂，到第三宿，才是正主儿出来答话的时候。\"<\/p>\n<p>\"大爷是说，咱们赶上正主儿答话了？\"<\/p>\n<p>\"赶上没赶上，\"他说，\"天亮就知道了。\"<\/p>\n<p>我没再问。那块阴契贴着心口，凉得跟块铁一样。<\/p>\n<p>雨声稀疏下来以后，石室里重新听见了拱顶的水滴声。嗒，嗒，嗒。<\/p>\n<p>我数着水滴声提神。数到第四十几下的时候，我忽然觉出不对——<\/p>\n<p>那滴水声，变慢了。<\/p>\n<p>不是慢一点点。是慢了整整一半。<\/p>\n<p>我抬起头，拱顶黑糊糊的，什么也看不见。水滴还是往下落，可它落下来的声音，从\"嗒……嗒……\"变成了隔得很长的一声：<\/p>\n<p>嗒。<\/p>\n<p>——<\/p>\n<p>嗒。<\/p>\n<p>——<\/p>\n<p>像是有个什么东西，在石窝上头，把那水珠一颗一颗地<strong>接<\/strong>住了。<\/p>\n<p>我浑身的汗毛一下子竖了起来。<\/p>\n<p>王药根几乎同时动了。他腰杆猛地一直，响哨棍横在身前，压着嗓子低喝了一声：<\/p>\n<p>\"谁？！\"<\/p>\n<p>石室里静了一瞬。<\/p>\n<p>然后，从正北墙根那盏灯笼的方向，传来了一声极轻的、纸张摩挲的动静——<\/p>\n<p>\"窸。\"<\/p>", "plain": "黑暗里，谁都没敢出气。 那块无字阴契被我攥在手心，攥得手心全是汗。我把头说的那两句话在舌头上翻来覆去过了几十遍—— 灯要是问你要锅，你就把阴契亮给它看。 可那声音根本不是朝我们要锅来了。 它是朝我们来了。 \"吱——嘎。\"锅沿磨石头的动静在缝外响一声，停很久，再响一声，一声比一声近。我从没觉得黑暗里的等待这么熬人，我甚至能听见王药根胸腔里那颗心，跳得又重又乱。 鱼哥把那只老避龙从布兜里掏出来，捂在胸口。黑鸡在他掌心里一动不动，脖子上的毛全炸着，两只芝麻眼直勾勾盯着同一个方向—— 缝口。 就在这时，石室里忽然暗了一下。 黑是不该有\"暗\"这个说法的，我闭着眼跟睁着眼没两样。可我清清楚楚感觉到，天光没变，是有什么东西，把缝口最后那点夜气挡住了。 有什么东西，站在了缝口外面。 我后背的汗一下子凉了。 \"——哗啦。\" 雨来了。 不是一滴一滴落下来的，是一整堵墙一样拍下来的。那声\"哗啦\"刚起来就被吞没了，紧跟着是雷——一声炸雷贴着山脊滚过去，震得脚底下的石板都在颤。闪电的光从缝口灌进来，石室里白了一瞬。 就那一瞬，我看清了站在对面的王药根：脸白得没一点血色，嘴唇在动，无声地念叨着什么。 那声音没了。 锅盖磨石头的声、脚步声、所有声响，全被暴雨的轰鸣盖得干干净净。缝口像被人泼了一盆瀑布，浑黄的泥水顺着石壁灌进来，在入口的地面上漫开一片，又顺着斜坡哗哗地淌下去。 我这才觉出自己腿肚子在转筋。 \"往里退。\"把头的气声几乎听不见，\"贴着东壁，别碰锅。\" 我们四个贴着墙根往石室里退。雨水只跟进到入口两三步就退了，石室正中还是干的。拱顶那根石钟乳上的水滴得急了，从滴答变成了连成线的\"嗒嗒嗒\"，落在那个浅浅的石窝里，溅起的水星子冰凉。 雨下了半个时辰，没有要停的意思。 没有火，没有亮，四个人缩在东壁的阴影里，听着外头整座山都在嚎。王药根摸索着从怀里掏出干粮袋子，又摸出个军用水壶，先递给把头。 把头没接。 \"老丈，\"他的声音平得像在说今天吃啥，\"你先前说，你儿子压在这缝里头。\"\"嗯。\" \"这雨，是山雨还是天雨？\" 王药根握着水壶的手停了停。 老辈人管雨分两样。沟外下的、哪都下的，叫天雨；光是这一片山、这一条沟里下的，山洪冲下来的，叫山雨。山雨不是老天爷下的，是\"那位\"的脾气。 \"天雨。\"老头隔了半晌才答，\"这雨脚粗，云头低，是压过来的雨，不是山根底下冒上来的。\" \"那就好。\"把头点了点头，接过水壶抿了一口，\"天雨，咱们就等得起。沟口那两堵收拢的石头，平时过人还擦肩膀，这一夜山洪下去，明早准保叫石头缝里卡满了树桩子。走不了。\" \"走不了？\"鱼哥的声音哑得厉害。 \"走不了。\"把头说，\"这雨不停，水不退，谁也出不去。连夜走那两道收拢口，是往鬼门关里送。\" 我们四个把行头都拖到东壁根底下，贴着石壁坐下。我趁着雨声的掩护摸到缝口边看了一眼——雨水顺着石壁倒灌进来，在入口聚成一汪浑汤，又顺着斜坡往下淌，把地面冲出一道新沟。浑汤里卷着草根、树皮、烂树叶子，还有一截烧焦的木棍，一头黑糊糊的，像让火燎过，又让水浸得透透的。 我拿脚尖把它拨到一边，没敢上手。 王药根在黑暗里像是看见了，压着嗓子说：\"雨打山头，焦木头往下滚，常有的事。\"停了一停，又补了一句，\"只是这一截，燎的是松明子。山里拢火才用松明子，劈柴燎不出这色气。\" 我没接话。 松明子。我在心里把这三个字搁下了。进缝以前，我趴在那道人工石缝口上，闻到过一股烟味，混着香灰的甜，又细又凉地往外走。当时把头说，里头有人点了灯，从两千年前一直点到了今天。 这一场雨把外头冲得稀里哗啦，却把缝里那股烟味，压得一丝也闻不见了。 我在黑暗里听着把头刚才那番话，心里清楚他还有半句没说出来——这雨把我们困在这儿，可他也未必真想走。 灯还挂在那儿。 挂灯是请人。请的人没露面，被请的先抬脚走了，传出去就是不懂规矩。把头这人干了一辈子，最忌讳的从来不是死，是坏规矩。 \"都歇着吧。\"把头说，\"把湿衣裳拧了，靠墙睡。云峰你头班。\" \"我守。\"王药根忽然说，\"让云峰小子先睡，他眼睛熬不住。\" \"老丈，你手——\" \"手不碍事。心里有事，睡也睡不实。\"老头把干粮塞到我手里，\"吃。吃饱了好换我。\" 我嚼着那两块干巴巴的贴饼子，饼子是冷的，掰开能看到里头的面渣。我一边嚼一边往石室深处看——那头，正北墙根底下，那盏白纸灯笼还挂在那。黑咕隆咚的什么也看不见，可我总觉得，它在那儿。 看得见看不见，它都在那儿。 雨声里，王药根忽然开口，声音低得像是自言自语： \"我儿子小时候，我教过他看锅。\" 我咽下饼子：\"看锅？\" \"山里人家，灶上那口锅是有讲究的。\"老头的嗓音在黑暗里显得又干又涩，\"锅盖掀开，饭在里头，那叫锅是满的，家里人齐。锅盖扣着，饭在里头温着，那是等人。锅盖掀开，锅是空的——那就是告诉外头：这家没饭了，这家人，走绝了。\" 雨声灌满石室。 \"长顺这孩子，打小就爱学我这些老话。\"王药根的声音顿了顿，\"他死前跟我说，他看见一口空锅。我一直当他是说胡话。\" \"现在呢？\" \"现在我知道了。\"老头说，\"他没说胡话。他是真看见了——他不是看见，他是替谁捎话。有人走不出去，借着活人的嘴，把'锅是空的'这五个字，捎给他爹。\" \"捎给您的？\" \"捎给能听懂的人。\"王药根慢慢地说，\"就像这灯，它不是给咱们挂的。它是挂给——走得动的人看的。\" 石室里的滴水声和他的话音混在一起。鱼哥靠在墙上，半天没出声。 \"大爷，\"他忽然问，\"你说这灯是挂给走得动的人看的。那你儿子，算走得动的，还是走不动的？\" 王药根没答。 过了很久，久到我以为他睡过去了，才听见黑暗里传来一声极轻的、像是咽了口气的声音： \"……他要是走得动，就不会让我找五年了。\" 雨下到后半夜才小了些。 我靠在东壁的墙角，把湿透了的外套裹紧，身上一阵一阵发冷。眼皮沉得厉害，可我不敢睡实——头班的人守不实，是给全伙人找不自在。 鱼哥睡了。他睡在离北墙最远的位置，蜷着，呼吸又轻又匀。那只老避龙被他重新揣回布兜里，黑鸡的脑袋搭在兜沿上，眼睛半闭，像是也睡了。 王药根坐在我斜对面，背靠石壁，响哨棍横在膝上。他没睡，浑浊的眼睛半睁着，望着正北墙根那一点看不真切的黑暗——望着那盏灯笼。 把头坐在最靠缝口的地方。他是殿后的。 我盯着他看了好一会儿。 他坐在那，脊背挺得笔直，不像是在躲雨，倒像是在等雨停，好去会一会外头那个挂灯的人。我跟了他这么多年，还从没见过他这副神气——不是怕，也不是狠，是早定了主意的神气。 我摸了摸怀里的手机，没敢掏出来看亮。这一天一夜，信号早就断在山外头了。 \"第三宿了。\"王药根像是知道我在想什么，声音低得像从石头缝里挤出来的，\"山里行路的老话——头一宿是探路，二一宿是过堂，到第三宿，才是正主儿出来答话的时候。\" \"大爷是说，咱们赶上正主儿答话了？\" \"赶上没赶上，\"他说，\"天亮就知道了。\" 我没再问。那块阴契贴着心口，凉得跟块铁一样。 雨声稀疏下来以后，石室里重新听见了拱顶的水滴声。嗒，嗒，嗒。 我数着水滴声提神。数到第四十几下的时候，我忽然觉出不对—— 那滴水声，变慢了。 不是慢一点点。是慢了整整一半。 我抬起头，拱顶黑糊糊的，什么也看不见。水滴还是往下落，可它落下来的声音，从\"嗒……嗒……\"变成了隔得很长的一声： 嗒。 —— 嗒。 —— 像是有个什么东西，在石窝上头，把那水珠一颗一颗地接住了。 我浑身的汗毛一下子竖了起来。 王药根几乎同时动了。他腰杆猛地一直，响哨棍横在身前，压着嗓子低喝了一声： \"谁？！\" 石室里静了一瞬。 然后，从正北墙根那盏灯笼的方向，传来了一声极轻的、纸张摩挲的动静—— \"窸。\""}, {"id": "A5-072", "arc": "A5", "num": 72, "title": "魇", "md": "那声\"窸\"，只响了一下。\n\n王药根的\"谁\"字还卡在喉咙里，纸声就没了，像被雨声一口吞了。石室里重新只剩下水和石头的动静。我攥着响哨棍的手心全是冷汗，等了一盏茶的功夫，什么也没再等到。\n\n\"……潮气。\"把头的声音从缝口那边传过来，低而稳，\"纸受潮，自己会胀。都睡。换岗，我盯后半夜。\"\n\n他说得轻描淡写，可我听得出，他没动地方——他坐的那块石头，离那盏灯笼，一夜都没挪。\n\n我后来是真睡着了。\n\n不知道睡了多久，我是被一阵呼吸声吵醒的。\n\n那呼吸声不对。\n\n我旁边睡的是鱼哥。他的呼吸一向又轻又匀，少林练气十年的人，睡熟了跟一盏没风的灯似的。可这会儿那呼吸又粗又涩，一口进去，半天不出来，隔好久，猛地\"呼\"地一声全喷出来，像有人掐着他的脖子，又松了手。\n\n我一下子就醒了。\n\n黑暗里看不清他的脸。我伸手去摸他的肩，手刚搭上去，旁边的王药根\"啪\"地一把攥住我手腕。\n\n\"别碰。\"老头的声音又低又急，\"魇着呢。\"\n\n\"大爷，他——\"\n\n\"魇着的人，你一巴掌拍醒，魂儿叫吓飞了，回来不全。\"王药根的手劲大得吓人，\"叫名字。小声叫，一下一下叫，叫到他认得路。\"\n\n我缩回手，压着嗓子喊：\"鱼哥。鱼哥——文斌。\"\n\n他不应。\n\n他的呼吸还是一样粗。我听见他喉咙里咕噜了一下，像是想说话，又说不出来。然后，从极深的地方，挤出半句含混的话：\n\n\"……锅……里……\"\n\n\"他说什么？\"我心跳到了嗓子眼。\n\n\"……有人。\"这回听清了。鱼哥的声音不像他的——太哑，太老，像一口用了五十年的破风箱，\"锅里有个人……\"\n\n王药根的手指在我手腕上紧了紧。\n\n\"他魇见的……\"老头的气声几乎听不见，\"是屋里这口锅，还是他自个儿脑子里的？\"\n\n我没法答。\n\n鱼哥的呼吸忽然停了。停得彻底，一点动静都没有。我吓得魂飞魄散，刚要扑过去——石室正北方向，忽然亮了起来。\n\n那盏白纸灯笼，亮了。\n\n不是有人点了它。是灯笼的纸壁从里往外透出一层极弱的、昏黄的光，隔着纸看，像里头点着一豆灯芯，火苗让纸拢着，明明暗暗地晃。没有烟，没有\"哔剥\"的灯花声，就只是亮。\n\n黑暗里，四个人的呼吸全停了。\n\n那光不烈，拢共照不亮三步远。可就这点光，正好照出那盏灯笼底下，鱼哥半抬起来的那张脸。\n\n他的眼睛是睁着的。\n\n瞳仁往上翻着，只剩两线白眼。脸上全是汗，汗珠子顺着下巴往下淌。那光落在他脸上，他整个人忽然不动了，呼吸也回来了，一丝一丝，匀了下来。\n\n\"镜子。\"把头的声音忽然从黑暗中传来，稳得像没事人一样，\"云峰，把你手边那面镜子，光对着他的脸。\"\n\n我这才想起那面照魇镜——临进沟前，把头亲手把它交给鱼哥，让他贴身收着，魇症再犯时好用它镇魂。镜子就压在鱼哥枕边的包袱底下。\n\n我屏着气，把镜子从他包袱底下摸了出来。镜面冰凉，我对着那灯笼的光一斜——\n\n昏黄的光在镜面上一转，折成一小片白亮的圆，正落在鱼哥脸上。\n\n就那一瞬，鱼哥的瞳仁\"唰\"地落下来了。\n\n他直勾勾地看着那片光，像是看见了什么。我听见他喉咙里滚出一声极轻的呜咽，然后，他的嘴唇动了动，清清楚楚说了四个字：\n\n\"别数了……\"\n\n我握着镜子的手一抖。\n\n\"文斌。\"把头的声音不高，却像一根针，一寸一寸往黑暗里扎，\"认得回家的路不？\"\n\n鱼哥没答。他的眼睛却慢慢对上了焦，直直地看着我——看进我眼睛里。\n\n过了好几息，他忽然浑身一哆嗦，像是从水里被人一把拽上来，\"呼\"地长出一口气，整个人软了下去。\n\n\"……云峰？\"他哑着嗓子问，\"我……又魇着了？\"\n\n灯笼的光，在这时候灭了。\n\n灭得干净利落，像是从没人点过它。我死死盯着那团纸壁，直到眼睛适应了黑暗，什么也看不见。\n\n石室里静得能听见四个人此起彼伏的喘气声。\n\n王药根摸黑爬到鱼哥身边，摸他的额头、摸他的脉，摸了半晌，才松一口气：\"回来了。魂儿回来了。\"\n\n鱼哥靠在我身上，浑身抖得跟筛糠似的。他平时多稳的一个人，这会儿说话都带着牙颤：\n\n\"云峰……我梦见，我在一口锅里。\"\n\n\"锅？\"\n\n\"锅扣着，我在里头，出不去。\"他咽了口唾沫，\"外头有个人，在敲锅。一下，一下，敲一下，数一声。\"\n\n我的手指不自觉地攥紧了。\n\n\"他数到三……\"鱼哥的声音低下去，\"就不数了。\"\n\n\"三？\"\n\n\"老三的老？\"王药根的声音忽然从旁边插进来，又干又涩，\"……还是，数到三，就该轮到第四个？\"\n\n石室里谁也没接话。\n\n过了很久，王药根才又开口。这一回，他的声音平得吓人，像在讲一个讲了无数遍的老故事：\n\n\"山里人讲，人要是死在洞里，寻不着尸首，家里人就在他最后待的洞口，倒扣一口锅。这叫**扣魂锅**——把魂扣住，等它自己寻回家。\"\n\n雨声在石室顶上滚。\n\n\"扣魂锅有一样忌讳。\"王药根说，\"扣下的锅，不能掀。掀了，扣着的魂就散了，寻不着家，往后夜夜在外头飘，飘到谁家，算谁家。\"\n\n我的脊梁一阵一阵发凉。\n\n我们掀过。昨天，把头亲手掀了正中那口锅，掀开之前，没人知道锅底下扣着什么——一坑黑灰，一块无字阴契。\n\n\"大爷，\"我的嗓子有点哑，\"那您说，咱们掀的那口锅——\"\n\n\"那不是扣魂锅。\"把头的声音从黑暗里平平地插进来，截断了我的话，\"那是消奴部的锅。云峰认下了阴契，这口锅就是他的名分。名分不是魂，扣不住，也掀不散。\"\n\n王药根没再说话。\n\n我看不见他的脸，可我总觉得，他那一肚子老话，并没有全倒出来。\n\n后半夜没人再睡。\n\n雨声渐小，天光从缝口透进来的时候，石室里终于有了点灰蒙蒙的亮。我扶着墙站起来，腿都是软的，先去看那盏灯笼。\n\n灯笼还挂在北墙根。\n\n纸壁干干净净，没有烧灼的痕迹，也没有潮气洇开的黄斑。我把它摘下来，凑到光里看——灯是空的。没有蜡烛，没有灯芯，连一根引火的捻子都没有。\n\n一具空纸壳。\n\n我盯着它看了很久。没有捻子的灯笼，方才那光是从哪儿来的？我没法答。\n\n\"云峰。\"鱼哥的声音从身后传来。\n\n他不知什么时候也起来了，靠在墙边，脸色蜡黄，眼睛却直直地盯着石室正中那五口锅。\n\n\"怎么了？\"\n\n\"那口锅……\"他抬起手，指着正中那口，\"梦里敲锅的，敲的就是它。\"\n\n我顺着他指的方向看过去。\n\n正中那口消奴部的锅，还倒扣在原地，锅足朝天。可我心里\"咯噔\"一下——昨天把头把它放回去的时候，我亲眼看着，锅耳冲着正东，一丝不差。\n\n这会儿，锅耳冲着**西南**。\n\n有人趁夜动过它。\n\n我扭过头，四个人你看看我，我看看你，谁都没说话。夜里魇着的只有鱼哥，可他连起身的力气都没有，遑论去搬一口陶锅。\n\n那会是谁？\n\n把头慢慢走到那口锅前，蹲下去，围着锅看了一圈。他伸出手，指腹在锅沿上蹭了一下，凑到眼前看了看。\n\n\"潮的。\"他说，\"有人上半夜来过，掀开过它，又盖回去了。\"\n\n\"掀开做什么？\"\n\n\"看看东西在不在。\"把头站起身，拍拍手上的灰，\"看完，又放回去了。这人熟得很——他知道锅底下该有什么，也知道昨天被咱们取走了。\"\n\n我脑子里\"嗡\"的一声。\n\n他抬头看了我一眼：\"云峰，你还记得那话说全乎了吗？'灯要是问你要锅——'\"\n\n\"……你就把阴契亮给它看。\"\n\n\"灯没问。\"把头说，\"可有人，半夜替灯来翻过了。\"\n\n他转过身，正对着一屋子人，声音不高不低：\n\n\"这人不是来抢的。是来**点卯**的——看名分还在不在正主儿身上。文斌。\"\n\n鱼哥抬起头。\n\n\"你魇着的时候，那人进门、掀锅、验东西、出门，你从头到尾，连哼都没哼一声。\"把头看着他，\"你告诉云峰的那些话——'锅里有人''数到三'——是你魇见的，还是有人魇着你，**借你的嘴说的**？\"\n\n鱼哥的脸一下子白了。\n\n石室里的水汽像是全凝在了这一句话上。我攥着那面照魇镜，镜背的鱼尾文\"守\"字硌着我的手心。\n\n鱼哥张了张嘴，过了好一会儿，才哑着嗓子说了句我做梦都没想到的话：\n\n\"魇到后头，我确实看见了一个人。他就蹲在那口锅边上，背对着我。我喊他，他不回头。\"\n\n\"他蹲那做什么？\"\n\n\"数锅。\"鱼哥说，\"他从北边那口数起，一口一口数过去。数到西南那个空位子，他停住了，回过头——\"\n\n\"跟你说话了？\"\n\n\"说了。\"鱼哥的声音抖得不成样子，\"他说——\n\n'灯还差三盏。'\"\n\n\"灯还差三盏。\"\n\n这四个字，我只听一个人说过——五女山的凉亭里，沈清荷说她梦里那个提灯的矮个子，冲她笑着说的。那天我回据点，一个字都没跟鱼哥提。\n\n他不该知道这句话。\n\n可他把它从魇里，带回来了。\n\n我把那面照魇镜揣回怀里，镜背的\"守\"字贴着心口，一整天都没再掏出来过。", "words": 3210, "html": "<p>那声\"窸\"，只响了一下。<\/p>\n<p>王药根的\"谁\"字还卡在喉咙里，纸声就没了，像被雨声一口吞了。石室里重新只剩下水和石头的动静。我攥着响哨棍的手心全是冷汗，等了一盏茶的功夫，什么也没再等到。<\/p>\n<p>\"……潮气。\"把头的声音从缝口那边传过来，低而稳，\"纸受潮，自己会胀。都睡。换岗，我盯后半夜。\"<\/p>\n<p>他说得轻描淡写，可我听得出，他没动地方——他坐的那块石头，离那盏灯笼，一夜都没挪。<\/p>\n<p>我后来是真睡着了。<\/p>\n<p>不知道睡了多久，我是被一阵呼吸声吵醒的。<\/p>\n<p>那呼吸声不对。<\/p>\n<p>我旁边睡的是鱼哥。他的呼吸一向又轻又匀，少林练气十年的人，睡熟了跟一盏没风的灯似的。可这会儿那呼吸又粗又涩，一口进去，半天不出来，隔好久，猛地\"呼\"地一声全喷出来，像有人掐着他的脖子，又松了手。<\/p>\n<p>我一下子就醒了。<\/p>\n<p>黑暗里看不清他的脸。我伸手去摸他的肩，手刚搭上去，旁边的王药根\"啪\"地一把攥住我手腕。<\/p>\n<p>\"别碰。\"老头的声音又低又急，\"魇着呢。\"<\/p>\n<p>\"大爷，他——\"<\/p>\n<p>\"魇着的人，你一巴掌拍醒，魂儿叫吓飞了，回来不全。\"王药根的手劲大得吓人，\"叫名字。小声叫，一下一下叫，叫到他认得路。\"<\/p>\n<p>我缩回手，压着嗓子喊：\"鱼哥。鱼哥——文斌。\"<\/p>\n<p>他不应。<\/p>\n<p>他的呼吸还是一样粗。我听见他喉咙里咕噜了一下，像是想说话，又说不出来。然后，从极深的地方，挤出半句含混的话：<\/p>\n<p>\"……锅……里……\"<\/p>\n<p>\"他说什么？\"我心跳到了嗓子眼。<\/p>\n<p>\"……有人。\"这回听清了。鱼哥的声音不像他的——太哑，太老，像一口用了五十年的破风箱，\"锅里有个人……\"<\/p>\n<p>王药根的手指在我手腕上紧了紧。<\/p>\n<p>\"他魇见的……\"老头的气声几乎听不见，\"是屋里这口锅，还是他自个儿脑子里的？\"<\/p>\n<p>我没法答。<\/p>\n<p>鱼哥的呼吸忽然停了。停得彻底，一点动静都没有。我吓得魂飞魄散，刚要扑过去——石室正北方向，忽然亮了起来。<\/p>\n<p>那盏白纸灯笼，亮了。<\/p>\n<p>不是有人点了它。是灯笼的纸壁从里往外透出一层极弱的、昏黄的光，隔着纸看，像里头点着一豆灯芯，火苗让纸拢着，明明暗暗地晃。没有烟，没有\"哔剥\"的灯花声，就只是亮。<\/p>\n<p>黑暗里，四个人的呼吸全停了。<\/p>\n<p>那光不烈，拢共照不亮三步远。可就这点光，正好照出那盏灯笼底下，鱼哥半抬起来的那张脸。<\/p>\n<p>他的眼睛是睁着的。<\/p>\n<p>瞳仁往上翻着，只剩两线白眼。脸上全是汗，汗珠子顺着下巴往下淌。那光落在他脸上，他整个人忽然不动了，呼吸也回来了，一丝一丝，匀了下来。<\/p>\n<p>\"镜子。\"把头的声音忽然从黑暗中传来，稳得像没事人一样，\"云峰，把你手边那面镜子，光对着他的脸。\"<\/p>\n<p>我这才想起那面照魇镜——临进沟前，把头亲手把它交给鱼哥，让他贴身收着，魇症再犯时好用它镇魂。镜子就压在鱼哥枕边的包袱底下。<\/p>\n<p>我屏着气，把镜子从他包袱底下摸了出来。镜面冰凉，我对着那灯笼的光一斜——<\/p>\n<p>昏黄的光在镜面上一转，折成一小片白亮的圆，正落在鱼哥脸上。<\/p>\n<p>就那一瞬，鱼哥的瞳仁\"唰\"地落下来了。<\/p>\n<p>他直勾勾地看着那片光，像是看见了什么。我听见他喉咙里滚出一声极轻的呜咽，然后，他的嘴唇动了动，清清楚楚说了四个字：<\/p>\n<p>\"别数了……\"<\/p>\n<p>我握着镜子的手一抖。<\/p>\n<p>\"文斌。\"把头的声音不高，却像一根针，一寸一寸往黑暗里扎，\"认得回家的路不？\"<\/p>\n<p>鱼哥没答。他的眼睛却慢慢对上了焦，直直地看着我——看进我眼睛里。<\/p>\n<p>过了好几息，他忽然浑身一哆嗦，像是从水里被人一把拽上来，\"呼\"地长出一口气，整个人软了下去。<\/p>\n<p>\"……云峰？\"他哑着嗓子问，\"我……又魇着了？\"<\/p>\n<p>灯笼的光，在这时候灭了。<\/p>\n<p>灭得干净利落，像是从没人点过它。我死死盯着那团纸壁，直到眼睛适应了黑暗，什么也看不见。<\/p>\n<p>石室里静得能听见四个人此起彼伏的喘气声。<\/p>\n<p>王药根摸黑爬到鱼哥身边，摸他的额头、摸他的脉，摸了半晌，才松一口气：\"回来了。魂儿回来了。\"<\/p>\n<p>鱼哥靠在我身上，浑身抖得跟筛糠似的。他平时多稳的一个人，这会儿说话都带着牙颤：<\/p>\n<p>\"云峰……我梦见，我在一口锅里。\"<\/p>\n<p>\"锅？\"<\/p>\n<p>\"锅扣着，我在里头，出不去。\"他咽了口唾沫，\"外头有个人，在敲锅。一下，一下，敲一下，数一声。\"<\/p>\n<p>我的手指不自觉地攥紧了。<\/p>\n<p>\"他数到三……\"鱼哥的声音低下去，\"就不数了。\"<\/p>\n<p>\"三？\"<\/p>\n<p>\"老三的老？\"王药根的声音忽然从旁边插进来，又干又涩，\"……还是，数到三，就该轮到第四个？\"<\/p>\n<p>石室里谁也没接话。<\/p>\n<p>过了很久，王药根才又开口。这一回，他的声音平得吓人，像在讲一个讲了无数遍的老故事：<\/p>\n<p>\"山里人讲，人要是死在洞里，寻不着尸首，家里人就在他最后待的洞口，倒扣一口锅。这叫<strong>扣魂锅<\/strong>——把魂扣住，等它自己寻回家。\"<\/p>\n<p>雨声在石室顶上滚。<\/p>\n<p>\"扣魂锅有一样忌讳。\"王药根说，\"扣下的锅，不能掀。掀了，扣着的魂就散了，寻不着家，往后夜夜在外头飘，飘到谁家，算谁家。\"<\/p>\n<p>我的脊梁一阵一阵发凉。<\/p>\n<p>我们掀过。昨天，把头亲手掀了正中那口锅，掀开之前，没人知道锅底下扣着什么——一坑黑灰，一块无字阴契。<\/p>\n<p>\"大爷，\"我的嗓子有点哑，\"那您说，咱们掀的那口锅——\"<\/p>\n<p>\"那不是扣魂锅。\"把头的声音从黑暗里平平地插进来，截断了我的话，\"那是消奴部的锅。云峰认下了阴契，这口锅就是他的名分。名分不是魂，扣不住，也掀不散。\"<\/p>\n<p>王药根没再说话。<\/p>\n<p>我看不见他的脸，可我总觉得，他那一肚子老话，并没有全倒出来。<\/p>\n<p>后半夜没人再睡。<\/p>\n<p>雨声渐小，天光从缝口透进来的时候，石室里终于有了点灰蒙蒙的亮。我扶着墙站起来，腿都是软的，先去看那盏灯笼。<\/p>\n<p>灯笼还挂在北墙根。<\/p>\n<p>纸壁干干净净，没有烧灼的痕迹，也没有潮气洇开的黄斑。我把它摘下来，凑到光里看——灯是空的。没有蜡烛，没有灯芯，连一根引火的捻子都没有。<\/p>\n<p>一具空纸壳。<\/p>\n<p>我盯着它看了很久。没有捻子的灯笼，方才那光是从哪儿来的？我没法答。<\/p>\n<p>\"云峰。\"鱼哥的声音从身后传来。<\/p>\n<p>他不知什么时候也起来了，靠在墙边，脸色蜡黄，眼睛却直直地盯着石室正中那五口锅。<\/p>\n<p>\"怎么了？\"<\/p>\n<p>\"那口锅……\"他抬起手，指着正中那口，\"梦里敲锅的，敲的就是它。\"<\/p>\n<p>我顺着他指的方向看过去。<\/p>\n<p>正中那口消奴部的锅，还倒扣在原地，锅足朝天。可我心里\"咯噔\"一下——昨天把头把它放回去的时候，我亲眼看着，锅耳冲着正东，一丝不差。<\/p>\n<p>这会儿，锅耳冲着<strong>西南<\/strong>。<\/p>\n<p>有人趁夜动过它。<\/p>\n<p>我扭过头，四个人你看看我，我看看你，谁都没说话。夜里魇着的只有鱼哥，可他连起身的力气都没有，遑论去搬一口陶锅。<\/p>\n<p>那会是谁？<\/p>\n<p>把头慢慢走到那口锅前，蹲下去，围着锅看了一圈。他伸出手，指腹在锅沿上蹭了一下，凑到眼前看了看。<\/p>\n<p>\"潮的。\"他说，\"有人上半夜来过，掀开过它，又盖回去了。\"<\/p>\n<p>\"掀开做什么？\"<\/p>\n<p>\"看看东西在不在。\"把头站起身，拍拍手上的灰，\"看完，又放回去了。这人熟得很——他知道锅底下该有什么，也知道昨天被咱们取走了。\"<\/p>\n<p>我脑子里\"嗡\"的一声。<\/p>\n<p>他抬头看了我一眼：\"云峰，你还记得那话说全乎了吗？'灯要是问你要锅——'\"<\/p>\n<p>\"……你就把阴契亮给它看。\"<\/p>\n<p>\"灯没问。\"把头说，\"可有人，半夜替灯来翻过了。\"<\/p>\n<p>他转过身，正对着一屋子人，声音不高不低：<\/p>\n<p>\"这人不是来抢的。是来<strong>点卯<\/strong>的——看名分还在不在正主儿身上。文斌。\"<\/p>\n<p>鱼哥抬起头。<\/p>\n<p>\"你魇着的时候，那人进门、掀锅、验东西、出门，你从头到尾，连哼都没哼一声。\"把头看着他，\"你告诉云峰的那些话——'锅里有人''数到三'——是你魇见的，还是有人魇着你，<strong>借你的嘴说的<\/strong>？\"<\/p>\n<p>鱼哥的脸一下子白了。<\/p>\n<p>石室里的水汽像是全凝在了这一句话上。我攥着那面照魇镜，镜背的鱼尾文\"守\"字硌着我的手心。<\/p>\n<p>鱼哥张了张嘴，过了好一会儿，才哑着嗓子说了句我做梦都没想到的话：<\/p>\n<p>\"魇到后头，我确实看见了一个人。他就蹲在那口锅边上，背对着我。我喊他，他不回头。\"<\/p>\n<p>\"他蹲那做什么？\"<\/p>\n<p>\"数锅。\"鱼哥说，\"他从北边那口数起，一口一口数过去。数到西南那个空位子，他停住了，回过头——\"<\/p>\n<p>\"跟你说话了？\"<\/p>\n<p>\"说了。\"鱼哥的声音抖得不成样子，\"他说——<\/p>\n<p>'灯还差三盏。'\"<\/p>\n<p>\"灯还差三盏。\"<\/p>\n<p>这四个字，我只听一个人说过——五女山的凉亭里，沈清荷说她梦里那个提灯的矮个子，冲她笑着说的。那天我回据点，一个字都没跟鱼哥提。<\/p>\n<p>他不该知道这句话。<\/p>\n<p>可他把它从魇里，带回来了。<\/p>\n<p>我把那面照魇镜揣回怀里，镜背的\"守\"字贴着心口，一整天都没再掏出来过。<\/p>", "plain": "那声\"窸\"，只响了一下。 王药根的\"谁\"字还卡在喉咙里，纸声就没了，像被雨声一口吞了。石室里重新只剩下水和石头的动静。我攥着响哨棍的手心全是冷汗，等了一盏茶的功夫，什么也没再等到。 \"……潮气。\"把头的声音从缝口那边传过来，低而稳，\"纸受潮，自己会胀。都睡。换岗，我盯后半夜。\" 他说得轻描淡写，可我听得出，他没动地方——他坐的那块石头，离那盏灯笼，一夜都没挪。 我后来是真睡着了。 不知道睡了多久，我是被一阵呼吸声吵醒的。 那呼吸声不对。 我旁边睡的是鱼哥。他的呼吸一向又轻又匀，少林练气十年的人，睡熟了跟一盏没风的灯似的。可这会儿那呼吸又粗又涩，一口进去，半天不出来，隔好久，猛地\"呼\"地一声全喷出来，像有人掐着他的脖子，又松了手。 我一下子就醒了。 黑暗里看不清他的脸。我伸手去摸他的肩，手刚搭上去，旁边的王药根\"啪\"地一把攥住我手腕。 \"别碰。\"老头的声音又低又急，\"魇着呢。\" \"大爷，他——\" \"魇着的人，你一巴掌拍醒，魂儿叫吓飞了，回来不全。\"王药根的手劲大得吓人，\"叫名字。小声叫，一下一下叫，叫到他认得路。\" 我缩回手，压着嗓子喊：\"鱼哥。鱼哥——文斌。\" 他不应。 他的呼吸还是一样粗。我听见他喉咙里咕噜了一下，像是想说话，又说不出来。然后，从极深的地方，挤出半句含混的话： \"……锅……里……\" \"他说什么？\"我心跳到了嗓子眼。 \"……有人。\"这回听清了。鱼哥的声音不像他的——太哑，太老，像一口用了五十年的破风箱，\"锅里有个人……\" 王药根的手指在我手腕上紧了紧。 \"他魇见的……\"老头的气声几乎听不见，\"是屋里这口锅，还是他自个儿脑子里的？\" 我没法答。 鱼哥的呼吸忽然停了。停得彻底，一点动静都没有。我吓得魂飞魄散，刚要扑过去——石室正北方向，忽然亮了起来。 那盏白纸灯笼，亮了。 不是有人点了它。是灯笼的纸壁从里往外透出一层极弱的、昏黄的光，隔着纸看，像里头点着一豆灯芯，火苗让纸拢着，明明暗暗地晃。没有烟，没有\"哔剥\"的灯花声，就只是亮。 黑暗里，四个人的呼吸全停了。 那光不烈，拢共照不亮三步远。可就这点光，正好照出那盏灯笼底下，鱼哥半抬起来的那张脸。 他的眼睛是睁着的。 瞳仁往上翻着，只剩两线白眼。脸上全是汗，汗珠子顺着下巴往下淌。那光落在他脸上，他整个人忽然不动了，呼吸也回来了，一丝一丝，匀了下来。 \"镜子。\"把头的声音忽然从黑暗中传来，稳得像没事人一样，\"云峰，把你手边那面镜子，光对着他的脸。\" 我这才想起那面照魇镜——临进沟前，把头亲手把它交给鱼哥，让他贴身收着，魇症再犯时好用它镇魂。镜子就压在鱼哥枕边的包袱底下。 我屏着气，把镜子从他包袱底下摸了出来。镜面冰凉，我对着那灯笼的光一斜—— 昏黄的光在镜面上一转，折成一小片白亮的圆，正落在鱼哥脸上。 就那一瞬，鱼哥的瞳仁\"唰\"地落下来了。 他直勾勾地看着那片光，像是看见了什么。我听见他喉咙里滚出一声极轻的呜咽，然后，他的嘴唇动了动，清清楚楚说了四个字： \"别数了……\" 我握着镜子的手一抖。 \"文斌。\"把头的声音不高，却像一根针，一寸一寸往黑暗里扎，\"认得回家的路不？\" 鱼哥没答。他的眼睛却慢慢对上了焦，直直地看着我——看进我眼睛里。 过了好几息，他忽然浑身一哆嗦，像是从水里被人一把拽上来，\"呼\"地长出一口气，整个人软了下去。 \"……云峰？\"他哑着嗓子问，\"我……又魇着了？\" 灯笼的光，在这时候灭了。 灭得干净利落，像是从没人点过它。我死死盯着那团纸壁，直到眼睛适应了黑暗，什么也看不见。 石室里静得能听见四个人此起彼伏的喘气声。 王药根摸黑爬到鱼哥身边，摸他的额头、摸他的脉，摸了半晌，才松一口气：\"回来了。魂儿回来了。\" 鱼哥靠在我身上，浑身抖得跟筛糠似的。他平时多稳的一个人，这会儿说话都带着牙颤： \"云峰……我梦见，我在一口锅里。\" \"锅？\" \"锅扣着，我在里头，出不去。\"他咽了口唾沫，\"外头有个人，在敲锅。一下，一下，敲一下，数一声。\" 我的手指不自觉地攥紧了。 \"他数到三……\"鱼哥的声音低下去，\"就不数了。\" \"三？\" \"老三的老？\"王药根的声音忽然从旁边插进来，又干又涩，\"……还是，数到三，就该轮到第四个？\" 石室里谁也没接话。 过了很久，王药根才又开口。这一回，他的声音平得吓人，像在讲一个讲了无数遍的老故事： \"山里人讲，人要是死在洞里，寻不着尸首，家里人就在他最后待的洞口，倒扣一口锅。这叫扣魂锅——把魂扣住，等它自己寻回家。\" 雨声在石室顶上滚。 \"扣魂锅有一样忌讳。\"王药根说，\"扣下的锅，不能掀。掀了，扣着的魂就散了，寻不着家，往后夜夜在外头飘，飘到谁家，算谁家。\" 我的脊梁一阵一阵发凉。 我们掀过。昨天，把头亲手掀了正中那口锅，掀开之前，没人知道锅底下扣着什么——一坑黑灰，一块无字阴契。 \"大爷，\"我的嗓子有点哑，\"那您说，咱们掀的那口锅——\" \"那不是扣魂锅。\"把头的声音从黑暗里平平地插进来，截断了我的话，\"那是消奴部的锅。云峰认下了阴契，这口锅就是他的名分。名分不是魂，扣不住，也掀不散。\" 王药根没再说话。 我看不见他的脸，可我总觉得，他那一肚子老话，并没有全倒出来。 后半夜没人再睡。 雨声渐小，天光从缝口透进来的时候，石室里终于有了点灰蒙蒙的亮。我扶着墙站起来，腿都是软的，先去看那盏灯笼。 灯笼还挂在北墙根。 纸壁干干净净，没有烧灼的痕迹，也没有潮气洇开的黄斑。我把它摘下来，凑到光里看——灯是空的。没有蜡烛，没有灯芯，连一根引火的捻子都没有。 一具空纸壳。 我盯着它看了很久。没有捻子的灯笼，方才那光是从哪儿来的？我没法答。 \"云峰。\"鱼哥的声音从身后传来。 他不知什么时候也起来了，靠在墙边，脸色蜡黄，眼睛却直直地盯着石室正中那五口锅。 \"怎么了？\" \"那口锅……\"他抬起手，指着正中那口，\"梦里敲锅的，敲的就是它。\" 我顺着他指的方向看过去。 正中那口消奴部的锅，还倒扣在原地，锅足朝天。可我心里\"咯噔\"一下——昨天把头把它放回去的时候，我亲眼看着，锅耳冲着正东，一丝不差。 这会儿，锅耳冲着西南。 有人趁夜动过它。 我扭过头，四个人你看看我，我看看你，谁都没说话。夜里魇着的只有鱼哥，可他连起身的力气都没有，遑论去搬一口陶锅。 那会是谁？ 把头慢慢走到那口锅前，蹲下去，围着锅看了一圈。他伸出手，指腹在锅沿上蹭了一下，凑到眼前看了看。 \"潮的。\"他说，\"有人上半夜来过，掀开过它，又盖回去了。\" \"掀开做什么？\" \"看看东西在不在。\"把头站起身，拍拍手上的灰，\"看完，又放回去了。这人熟得很——他知道锅底下该有什么，也知道昨天被咱们取走了。\" 我脑子里\"嗡\"的一声。 他抬头看了我一眼：\"云峰，你还记得那话说全乎了吗？'灯要是问你要锅——'\" \"……你就把阴契亮给它看。\" \"灯没问。\"把头说，\"可有人，半夜替灯来翻过了。\" 他转过身，正对着一屋子人，声音不高不低： \"这人不是来抢的。是来点卯的——看名分还在不在正主儿身上。文斌。\" 鱼哥抬起头。 \"你魇着的时候，那人进门、掀锅、验东西、出门，你从头到尾，连哼都没哼一声。\"把头看着他，\"你告诉云峰的那些话——'锅里有人''数到三'——是你魇见的，还是有人魇着你，借你的嘴说的？\" 鱼哥的脸一下子白了。 石室里的水汽像是全凝在了这一句话上。我攥着那面照魇镜，镜背的鱼尾文\"守\"字硌着我的手心。 鱼哥张了张嘴，过了好一会儿，才哑着嗓子说了句我做梦都没想到的话： \"魇到后头，我确实看见了一个人。他就蹲在那口锅边上，背对着我。我喊他，他不回头。\" \"他蹲那做什么？\" \"数锅。\"鱼哥说，\"他从北边那口数起，一口一口数过去。数到西南那个空位子，他停住了，回过头——\" \"跟你说话了？\" \"说了。\"鱼哥的声音抖得不成样子，\"他说—— '灯还差三盏。'\" \"灯还差三盏。\" 这四个字，我只听一个人说过——五女山的凉亭里，沈清荷说她梦里那个提灯的矮个子，冲她笑着说的。那天我回据点，一个字都没跟鱼哥提。 他不该知道这句话。 可他把它从魇里，带回来了。 我把那面照魇镜揣回怀里，镜背的\"守\"字贴着心口，一整天都没再掏出来过。"}, {"id": "A5-073", "arc": "A5", "num": 73, "title": "出沟", "md": "天亮的时候，雨停了。\n\n雨停得跟来时一样利索。前一息还听见石室顶上水声哗哗，后一息，外头的天光就从缝口斜斜地扫进来，在石壁上切出几道湿漉漉的白。\n\n沟里的水声却还没停，轰轰的，闷得人心里发沉。\n\n\"水退得下去。\"把头站在缝口听了一会儿，回过头来，\"雨停了，山上的水两个时辰就能退净。收拾东西，咱们走。\"\n\n我蹲下身，把地上散着的干粮袋子、水壶一件件归拢。那面照魇镜揣在怀里，贴着心口，凉得硌人。我把头哥那件防雨布衣裳叠好，放在鱼哥手边——他脸色还蜡黄着，蹲在墙根，半天没动。\n\n\"鱼哥，能走不？\"\n\n\"能。\"他答得干脆，可站起来的时候，手在墙上扶了一把。\n\n石室正中那五口锅，还倒扣在原地。\n\n我心里莫名地松了口气——锅还在，什么都没少。可转头一想又觉得好笑：昨夜有人半夜掀过锅，把五口锅数了个遍，如今锅好好地在这儿，咱们这一屋子人，反倒成了被数的那一拨。\n\n\"云峰。\"把头叫住我，\"看什么呢？\"\n\n\"看锅。\"我说，\"不带一口走？\"\n\n把头蹲下来，拍了拍正中那口消奴部锅的锅沿，灰扑扑的陶面在晨光里泛着暗色。\n\n\"带不走。\"他说，\"这口锅是拴着名分的。你认下阴契，名分就是你的，锅早晚是咱们的。现在当着外头那么多双眼睛把它背出沟，那不是取锅，是给人递话把儿。\"\n\n\"外头有眼睛？\"\n\n\"挂灯的人，能看见咱们进沟，就看不见咱们出沟？\"他把手收回来，\"先让它在这儿待着。等咱们把外头那几路人弄明白了，再来请它。东西是死的，跑不了；人是活的，说不准就跑了。\"\n\n我听着他这话，总觉得他还有半句没说。\n\n最后看一眼石室的时候，我数了一遍那五口锅。\n\n还是五口。可不知怎么的，我总觉得屋里比来时少了一样东西——少了什么，我说不上来。\n\n出去的路比进来时难走。\n\n那夜山洪在沟里发了威，把进缝前那段崖根冲得乱七八糟。水退以后，石头缝里卡满了树桩子、烂草，还有半截不知从哪冲下来的断磨盘。王药根在前头开路，响哨棍一下一下拨着那些烂树枝子，手上有伤，使不上力，走得龇牙咧嘴。\n\n我伸手去扶他，被他一把挡开。\n\n\"走走走，别管我。\"老头梗着脖子，\"这点路，我闭着眼都走得出去。\"\n\n话是这么说，可他扶着石壁喘气的次数，比进沟时多了不止一倍。\n\n鱼哥跟在最后头，一路没怎么说话。我回头看他，他就冲我摆摆手，意思是没事。可他眼睛底下那两圈青，看着比沟里的烂泥还沉。\n\n出了人工石缝，绕过那块卧牛大的青石，就到了黑眉王盘过的那片石窝子。两夜前，那东西就是从这石窝子里弹出来的，快得看不清，一口咬死了王药根一只老避龙。\n\n如今石窝子让山洪冲得干干净净，连根蛇蜕都没剩下。王药根在那站了一会儿，盯着那片空石窝看了很久。\n\n\"那畜生，是山根底下养出来的。\"他忽然没头没脑地说了一句，\"让水一冲，就回山根底下去了。它认路。\"\n\n我没接话。\n\n老头收回目光，闷头往前走。走了两步，又像是自言自语：\"它认得回家的路。有些人，反倒不如一条蛇。\"\n\n出了那道蛇缝，沟底的景象把我吓了一跳。\n\n那条只容一两个人并排走的窄沟，被山洪冲得整个变了样。两壁的石头被水剥下一层皮，露出黄生生的新茬；沟底的淤泥上横七竖八躺着断树，最粗的一棵，两个人合抱都抱不拢。\n\n来时的路，认不出了。\n\n王药根在前头绕来绕去，靠着山势认路，走得很慢。我一路走一路记，把每个拐弯都刻在脑子里——这沟认得越熟，往后走夜路就越少踩空。\n\n走到第一道鹰嘴石梁底下，我停住了。\n\n\"那口锅呢？\"\n\n进沟那晚，石梁上垂下来一口黑锅，吊在半空，锅沿磨着石头，\"吱嘎吱嘎\"地响。老周说过，那口锅是领路的——它往哪儿滴黑泥水，路就往哪儿引。那天晚上，就是它把我们领进了这条沟。\n\n如今石梁上干干净净。\n\n吊锅的绳头还垂在那，断口齐整，不像是山洪扯断的——绳子上连一丝毛刺都没有。\n\n是被人拿刀割断的。\n\n\"锅让人起走了。\"我听见自己的声音有点干。\n\n王药根仰头看了那绳头半天，喉咙里滚出一个字：\"嗯。\"\n\n\"谁起的？\"\n\n\"锅走了，就是领路的人换了。\"老头收回目光，闷头往前走，走两步，又补了一句，\"别回头找它。它要是还认你，早晚自己回来。\"\n\n我站在石梁底下，仰头看着那根空荡荡的绳头，心里翻来覆去就一句话——\n\n昨夜雨里那阵锅盖磨石头的声，究竟是风，还是有人，摸着黑，把我们头顶那口锅，一刀一刀地解下来了？\n\n出沟的路走了大半天。\n\n到了村口那道漫水桥边上，远远就看见豆芽仔蹲在桥头的土坡上，看见我们，连滚带爬地跑过来，嗓子都劈了：\n\n\"哥！大哥！你们可算出来了！我他妈在这儿守了三天三宿，眼都没敢合！\"\n\n他一边说一边往后头张望，看见我们四个一个不少，眼圈一下子就红了，扑过来就要抱，被鱼哥一个眼神钉在原地。\n\n\"行了行了。\"我拍拍他肩膀，\"车呢？\"\n\n\"前头，老周那台面包。\"豆芽仔抹了把脸，\"我手机也没电了，你们要是再不出来，我都打算报警了——就报那个……走失，对，走失。\"\n\n他絮絮叨叨说着这两天的见闻：雨有多大，路冲断了几段，他半夜在车里冻得直哆嗦。我听得心不在焉，直到他说到一句，我才猛地抬起头。\n\n\"对了哥，\"豆芽仔压低声音，\"老周前天打电话来，说店门口来了个人，问咱们。\" \n\n\"什么人？\"\n\n\"四十来岁，瘦高个，戴着顶旧草帽，说话有点山西那边的口音。\"豆芽仔挠挠头，\"他说他姓谢，是替一个'收老物件'的老板跑腿的，想问问老周，知不知道桓仁一带有人收过'一种倒扣的陶锅'。\"\n\n我看了把头一眼。\n\n把头正闭着眼靠在车座上，像是睡着了。可我知道他没睡。\n\n\"老周咋回的？\"\n\n\"老周说不知道，那人也没多问，就走了。\"豆芽仔小声说，\"老周让我转告大哥——那人走的时候，在店门口站了好一会儿，不是看店，是看马路对面的山头。\"\n\n回据点是下午三点多。\n\n小萱把鸭子喂了，看见我们回来，眼圈也红红的，嘴上却硬：\"四天三宿，连个电话都没有，我还以为你们让熊瞎子叼走了。\"\n\n\"鸭蛋呢？\"鱼哥难得问了一句。\n\n\"下了三个。\"小萱说，\"有个事跟你们说——昨儿夜里，据点座机响了两回。我接起来，那边没人说话。\"\n\n\"响两回？\"我皱了皱眉。\n\n\"嗯。第二回我特意等了一会儿才接，还是没人。我让豆芽仔查了，不是断线，就是有人打过来，不说话。\"\n\n座机号只有老周和几个熟人知道。\n\n我一时没说话。据点这地方，是从前一个看林人留下的土房，前后不挨村，院墙外头就是柞树林子。真有人摸到这儿来打电话，却不出声，那意思比出声还明白——\n\n他在告诉咱们：我找得着你们。\n\n我把这层意思在肚子里滚了一圈，没当着小萱的面说出来。\n\n晚饭是豆芽仔炖的酸菜，就着贴饼子。我吃了两大碗，把四天的亏空往回找补。鱼哥吃得少，吃了半碗就撂了筷子，坐在炕沿上发呆。\n\n\"睡不着？\"\n\n\"不敢睡。\"他老实说，\"一合眼，就听见敲锅声。\"\n\n我从怀里把那面照魇镜掏出来，塞回他手里：\"还你，收好。夜里要是再魇着，镜子硌着胸口，能醒得快些。\"\n\n鱼哥看着镜背上那道鱼尾文，半天没说话。他抬头看了我一眼，像是想说什么，又咽了回去。\n\n晚上，把头把我们几个叫到里屋。\n\n他盘腿坐在炕上，面前摊着一张桓仁的地图，红铅笔在几个点子上画了圈。他先讲了讲白天在沟里我看到的那些事——锅让谁起了、灯是谁挂的、有人半夜翻锅验名分——讲完，他拿铅笔点了点地图上两个点。\n\n\"这一趟，值。\"他说，\"锅、灯、字、人，都见着了一半。剩下一半，全在这上头——人。\"\n\n\"沟先不进了？\"\n\n\"不进了。\"把头把铅笔搁下，\"底下那石室，跑不了；阴契在咱们手里，名分也跑不了。可外头这几路人要是弄不明白，咱们就算把骨城挖出来，也是给人做嫁衣裳。\"\n\n\"先摸人。\"他说，\"缺指人那台辽P车，包头卖珍珠罐那俩，还有那个半夜翻锅、能把灯挂得这么熟的主儿——三路人，三天，一条一条捋清楚。捋不明白，咱们就停在这一步，谁也别想再进沟。\"\n\n他说这话的时候，窗外的风把窗纸吹得哗啦响。豆芽仔坐在墙角，大气不敢出。\n\n那一夜我睡得极沉，一觉到天亮，连梦都没做。\n\n第二天一早，我蹲在院里刷牙，兜里的手机震了一下。\n\n我掏出来一看，是一条短信。号码陌生，连归属地都查不出来，就一句话：\n\n\"锅盖给您留着呢。下回见面，带灯的可就不止一个了。\"", "words": 3164, "html": "<p>天亮的时候，雨停了。<\/p>\n<p>雨停得跟来时一样利索。前一息还听见石室顶上水声哗哗，后一息，外头的天光就从缝口斜斜地扫进来，在石壁上切出几道湿漉漉的白。<\/p>\n<p>沟里的水声却还没停，轰轰的，闷得人心里发沉。<\/p>\n<p>\"水退得下去。\"把头站在缝口听了一会儿，回过头来，\"雨停了，山上的水两个时辰就能退净。收拾东西，咱们走。\"<\/p>\n<p>我蹲下身，把地上散着的干粮袋子、水壶一件件归拢。那面照魇镜揣在怀里，贴着心口，凉得硌人。我把头哥那件防雨布衣裳叠好，放在鱼哥手边——他脸色还蜡黄着，蹲在墙根，半天没动。<\/p>\n<p>\"鱼哥，能走不？\"<\/p>\n<p>\"能。\"他答得干脆，可站起来的时候，手在墙上扶了一把。<\/p>\n<p>石室正中那五口锅，还倒扣在原地。<\/p>\n<p>我心里莫名地松了口气——锅还在，什么都没少。可转头一想又觉得好笑：昨夜有人半夜掀过锅，把五口锅数了个遍，如今锅好好地在这儿，咱们这一屋子人，反倒成了被数的那一拨。<\/p>\n<p>\"云峰。\"把头叫住我，\"看什么呢？\"<\/p>\n<p>\"看锅。\"我说，\"不带一口走？\"<\/p>\n<p>把头蹲下来，拍了拍正中那口消奴部锅的锅沿，灰扑扑的陶面在晨光里泛着暗色。<\/p>\n<p>\"带不走。\"他说，\"这口锅是拴着名分的。你认下阴契，名分就是你的，锅早晚是咱们的。现在当着外头那么多双眼睛把它背出沟，那不是取锅，是给人递话把儿。\"<\/p>\n<p>\"外头有眼睛？\"<\/p>\n<p>\"挂灯的人，能看见咱们进沟，就看不见咱们出沟？\"他把手收回来，\"先让它在这儿待着。等咱们把外头那几路人弄明白了，再来请它。东西是死的，跑不了；人是活的，说不准就跑了。\"<\/p>\n<p>我听着他这话，总觉得他还有半句没说。<\/p>\n<p>最后看一眼石室的时候，我数了一遍那五口锅。<\/p>\n<p>还是五口。可不知怎么的，我总觉得屋里比来时少了一样东西——少了什么，我说不上来。<\/p>\n<p>出去的路比进来时难走。<\/p>\n<p>那夜山洪在沟里发了威，把进缝前那段崖根冲得乱七八糟。水退以后，石头缝里卡满了树桩子、烂草，还有半截不知从哪冲下来的断磨盘。王药根在前头开路，响哨棍一下一下拨着那些烂树枝子，手上有伤，使不上力，走得龇牙咧嘴。<\/p>\n<p>我伸手去扶他，被他一把挡开。<\/p>\n<p>\"走走走，别管我。\"老头梗着脖子，\"这点路，我闭着眼都走得出去。\"<\/p>\n<p>话是这么说，可他扶着石壁喘气的次数，比进沟时多了不止一倍。<\/p>\n<p>鱼哥跟在最后头，一路没怎么说话。我回头看他，他就冲我摆摆手，意思是没事。可他眼睛底下那两圈青，看着比沟里的烂泥还沉。<\/p>\n<p>出了人工石缝，绕过那块卧牛大的青石，就到了黑眉王盘过的那片石窝子。两夜前，那东西就是从这石窝子里弹出来的，快得看不清，一口咬死了王药根一只老避龙。<\/p>\n<p>如今石窝子让山洪冲得干干净净，连根蛇蜕都没剩下。王药根在那站了一会儿，盯着那片空石窝看了很久。<\/p>\n<p>\"那畜生，是山根底下养出来的。\"他忽然没头没脑地说了一句，\"让水一冲，就回山根底下去了。它认路。\"<\/p>\n<p>我没接话。<\/p>\n<p>老头收回目光，闷头往前走。走了两步，又像是自言自语：\"它认得回家的路。有些人，反倒不如一条蛇。\"<\/p>\n<p>出了那道蛇缝，沟底的景象把我吓了一跳。<\/p>\n<p>那条只容一两个人并排走的窄沟，被山洪冲得整个变了样。两壁的石头被水剥下一层皮，露出黄生生的新茬；沟底的淤泥上横七竖八躺着断树，最粗的一棵，两个人合抱都抱不拢。<\/p>\n<p>来时的路，认不出了。<\/p>\n<p>王药根在前头绕来绕去，靠着山势认路，走得很慢。我一路走一路记，把每个拐弯都刻在脑子里——这沟认得越熟，往后走夜路就越少踩空。<\/p>\n<p>走到第一道鹰嘴石梁底下，我停住了。<\/p>\n<p>\"那口锅呢？\"<\/p>\n<p>进沟那晚，石梁上垂下来一口黑锅，吊在半空，锅沿磨着石头，\"吱嘎吱嘎\"地响。老周说过，那口锅是领路的——它往哪儿滴黑泥水，路就往哪儿引。那天晚上，就是它把我们领进了这条沟。<\/p>\n<p>如今石梁上干干净净。<\/p>\n<p>吊锅的绳头还垂在那，断口齐整，不像是山洪扯断的——绳子上连一丝毛刺都没有。<\/p>\n<p>是被人拿刀割断的。<\/p>\n<p>\"锅让人起走了。\"我听见自己的声音有点干。<\/p>\n<p>王药根仰头看了那绳头半天，喉咙里滚出一个字：\"嗯。\"<\/p>\n<p>\"谁起的？\"<\/p>\n<p>\"锅走了，就是领路的人换了。\"老头收回目光，闷头往前走，走两步，又补了一句，\"别回头找它。它要是还认你，早晚自己回来。\"<\/p>\n<p>我站在石梁底下，仰头看着那根空荡荡的绳头，心里翻来覆去就一句话——<\/p>\n<p>昨夜雨里那阵锅盖磨石头的声，究竟是风，还是有人，摸着黑，把我们头顶那口锅，一刀一刀地解下来了？<\/p>\n<p>出沟的路走了大半天。<\/p>\n<p>到了村口那道漫水桥边上，远远就看见豆芽仔蹲在桥头的土坡上，看见我们，连滚带爬地跑过来，嗓子都劈了：<\/p>\n<p>\"哥！大哥！你们可算出来了！我他妈在这儿守了三天三宿，眼都没敢合！\"<\/p>\n<p>他一边说一边往后头张望，看见我们四个一个不少，眼圈一下子就红了，扑过来就要抱，被鱼哥一个眼神钉在原地。<\/p>\n<p>\"行了行了。\"我拍拍他肩膀，\"车呢？\"<\/p>\n<p>\"前头，老周那台面包。\"豆芽仔抹了把脸，\"我手机也没电了，你们要是再不出来，我都打算报警了——就报那个……走失，对，走失。\"<\/p>\n<p>他絮絮叨叨说着这两天的见闻：雨有多大，路冲断了几段，他半夜在车里冻得直哆嗦。我听得心不在焉，直到他说到一句，我才猛地抬起头。<\/p>\n<p>\"对了哥，\"豆芽仔压低声音，\"老周前天打电话来，说店门口来了个人，问咱们。\"<\/p>\n<p>\"什么人？\"<\/p>\n<p>\"四十来岁，瘦高个，戴着顶旧草帽，说话有点山西那边的口音。\"豆芽仔挠挠头，\"他说他姓谢，是替一个'收老物件'的老板跑腿的，想问问老周，知不知道桓仁一带有人收过'一种倒扣的陶锅'。\"<\/p>\n<p>我看了把头一眼。<\/p>\n<p>把头正闭着眼靠在车座上，像是睡着了。可我知道他没睡。<\/p>\n<p>\"老周咋回的？\"<\/p>\n<p>\"老周说不知道，那人也没多问，就走了。\"豆芽仔小声说，\"老周让我转告大哥——那人走的时候，在店门口站了好一会儿，不是看店，是看马路对面的山头。\"<\/p>\n<p>回据点是下午三点多。<\/p>\n<p>小萱把鸭子喂了，看见我们回来，眼圈也红红的，嘴上却硬：\"四天三宿，连个电话都没有，我还以为你们让熊瞎子叼走了。\"<\/p>\n<p>\"鸭蛋呢？\"鱼哥难得问了一句。<\/p>\n<p>\"下了三个。\"小萱说，\"有个事跟你们说——昨儿夜里，据点座机响了两回。我接起来，那边没人说话。\"<\/p>\n<p>\"响两回？\"我皱了皱眉。<\/p>\n<p>\"嗯。第二回我特意等了一会儿才接，还是没人。我让豆芽仔查了，不是断线，就是有人打过来，不说话。\"<\/p>\n<p>座机号只有老周和几个熟人知道。<\/p>\n<p>我一时没说话。据点这地方，是从前一个看林人留下的土房，前后不挨村，院墙外头就是柞树林子。真有人摸到这儿来打电话，却不出声，那意思比出声还明白——<\/p>\n<p>他在告诉咱们：我找得着你们。<\/p>\n<p>我把这层意思在肚子里滚了一圈，没当着小萱的面说出来。<\/p>\n<p>晚饭是豆芽仔炖的酸菜，就着贴饼子。我吃了两大碗，把四天的亏空往回找补。鱼哥吃得少，吃了半碗就撂了筷子，坐在炕沿上发呆。<\/p>\n<p>\"睡不着？\"<\/p>\n<p>\"不敢睡。\"他老实说，\"一合眼，就听见敲锅声。\"<\/p>\n<p>我从怀里把那面照魇镜掏出来，塞回他手里：\"还你，收好。夜里要是再魇着，镜子硌着胸口，能醒得快些。\"<\/p>\n<p>鱼哥看着镜背上那道鱼尾文，半天没说话。他抬头看了我一眼，像是想说什么，又咽了回去。<\/p>\n<p>晚上，把头把我们几个叫到里屋。<\/p>\n<p>他盘腿坐在炕上，面前摊着一张桓仁的地图，红铅笔在几个点子上画了圈。他先讲了讲白天在沟里我看到的那些事——锅让谁起了、灯是谁挂的、有人半夜翻锅验名分——讲完，他拿铅笔点了点地图上两个点。<\/p>\n<p>\"这一趟，值。\"他说，\"锅、灯、字、人，都见着了一半。剩下一半，全在这上头——人。\"<\/p>\n<p>\"沟先不进了？\"<\/p>\n<p>\"不进了。\"把头把铅笔搁下，\"底下那石室，跑不了；阴契在咱们手里，名分也跑不了。可外头这几路人要是弄不明白，咱们就算把骨城挖出来，也是给人做嫁衣裳。\"<\/p>\n<p>\"先摸人。\"他说，\"缺指人那台辽P车，包头卖珍珠罐那俩，还有那个半夜翻锅、能把灯挂得这么熟的主儿——三路人，三天，一条一条捋清楚。捋不明白，咱们就停在这一步，谁也别想再进沟。\"<\/p>\n<p>他说这话的时候，窗外的风把窗纸吹得哗啦响。豆芽仔坐在墙角，大气不敢出。<\/p>\n<p>那一夜我睡得极沉，一觉到天亮，连梦都没做。<\/p>\n<p>第二天一早，我蹲在院里刷牙，兜里的手机震了一下。<\/p>\n<p>我掏出来一看，是一条短信。号码陌生，连归属地都查不出来，就一句话：<\/p>\n<p>\"锅盖给您留着呢。下回见面，带灯的可就不止一个了。\"<\/p>", "plain": "天亮的时候，雨停了。 雨停得跟来时一样利索。前一息还听见石室顶上水声哗哗，后一息，外头的天光就从缝口斜斜地扫进来，在石壁上切出几道湿漉漉的白。 沟里的水声却还没停，轰轰的，闷得人心里发沉。 \"水退得下去。\"把头站在缝口听了一会儿，回过头来，\"雨停了，山上的水两个时辰就能退净。收拾东西，咱们走。\" 我蹲下身，把地上散着的干粮袋子、水壶一件件归拢。那面照魇镜揣在怀里，贴着心口，凉得硌人。我把头哥那件防雨布衣裳叠好，放在鱼哥手边——他脸色还蜡黄着，蹲在墙根，半天没动。 \"鱼哥，能走不？\" \"能。\"他答得干脆，可站起来的时候，手在墙上扶了一把。 石室正中那五口锅，还倒扣在原地。 我心里莫名地松了口气——锅还在，什么都没少。可转头一想又觉得好笑：昨夜有人半夜掀过锅，把五口锅数了个遍，如今锅好好地在这儿，咱们这一屋子人，反倒成了被数的那一拨。 \"云峰。\"把头叫住我，\"看什么呢？\" \"看锅。\"我说，\"不带一口走？\" 把头蹲下来，拍了拍正中那口消奴部锅的锅沿，灰扑扑的陶面在晨光里泛着暗色。 \"带不走。\"他说，\"这口锅是拴着名分的。你认下阴契，名分就是你的，锅早晚是咱们的。现在当着外头那么多双眼睛把它背出沟，那不是取锅，是给人递话把儿。\" \"外头有眼睛？\" \"挂灯的人，能看见咱们进沟，就看不见咱们出沟？\"他把手收回来，\"先让它在这儿待着。等咱们把外头那几路人弄明白了，再来请它。东西是死的，跑不了；人是活的，说不准就跑了。\" 我听着他这话，总觉得他还有半句没说。 最后看一眼石室的时候，我数了一遍那五口锅。 还是五口。可不知怎么的，我总觉得屋里比来时少了一样东西——少了什么，我说不上来。 出去的路比进来时难走。 那夜山洪在沟里发了威，把进缝前那段崖根冲得乱七八糟。水退以后，石头缝里卡满了树桩子、烂草，还有半截不知从哪冲下来的断磨盘。王药根在前头开路，响哨棍一下一下拨着那些烂树枝子，手上有伤，使不上力，走得龇牙咧嘴。 我伸手去扶他，被他一把挡开。 \"走走走，别管我。\"老头梗着脖子，\"这点路，我闭着眼都走得出去。\" 话是这么说，可他扶着石壁喘气的次数，比进沟时多了不止一倍。 鱼哥跟在最后头，一路没怎么说话。我回头看他，他就冲我摆摆手，意思是没事。可他眼睛底下那两圈青，看着比沟里的烂泥还沉。 出了人工石缝，绕过那块卧牛大的青石，就到了黑眉王盘过的那片石窝子。两夜前，那东西就是从这石窝子里弹出来的，快得看不清，一口咬死了王药根一只老避龙。 如今石窝子让山洪冲得干干净净，连根蛇蜕都没剩下。王药根在那站了一会儿，盯着那片空石窝看了很久。 \"那畜生，是山根底下养出来的。\"他忽然没头没脑地说了一句，\"让水一冲，就回山根底下去了。它认路。\" 我没接话。 老头收回目光，闷头往前走。走了两步，又像是自言自语：\"它认得回家的路。有些人，反倒不如一条蛇。\" 出了那道蛇缝，沟底的景象把我吓了一跳。 那条只容一两个人并排走的窄沟，被山洪冲得整个变了样。两壁的石头被水剥下一层皮，露出黄生生的新茬；沟底的淤泥上横七竖八躺着断树，最粗的一棵，两个人合抱都抱不拢。 来时的路，认不出了。 王药根在前头绕来绕去，靠着山势认路，走得很慢。我一路走一路记，把每个拐弯都刻在脑子里——这沟认得越熟，往后走夜路就越少踩空。 走到第一道鹰嘴石梁底下，我停住了。 \"那口锅呢？\" 进沟那晚，石梁上垂下来一口黑锅，吊在半空，锅沿磨着石头，\"吱嘎吱嘎\"地响。老周说过，那口锅是领路的——它往哪儿滴黑泥水，路就往哪儿引。那天晚上，就是它把我们领进了这条沟。 如今石梁上干干净净。 吊锅的绳头还垂在那，断口齐整，不像是山洪扯断的——绳子上连一丝毛刺都没有。 是被人拿刀割断的。 \"锅让人起走了。\"我听见自己的声音有点干。 王药根仰头看了那绳头半天，喉咙里滚出一个字：\"嗯。\" \"谁起的？\" \"锅走了，就是领路的人换了。\"老头收回目光，闷头往前走，走两步，又补了一句，\"别回头找它。它要是还认你，早晚自己回来。\" 我站在石梁底下，仰头看着那根空荡荡的绳头，心里翻来覆去就一句话—— 昨夜雨里那阵锅盖磨石头的声，究竟是风，还是有人，摸着黑，把我们头顶那口锅，一刀一刀地解下来了？ 出沟的路走了大半天。 到了村口那道漫水桥边上，远远就看见豆芽仔蹲在桥头的土坡上，看见我们，连滚带爬地跑过来，嗓子都劈了： \"哥！大哥！你们可算出来了！我他妈在这儿守了三天三宿，眼都没敢合！\" 他一边说一边往后头张望，看见我们四个一个不少，眼圈一下子就红了，扑过来就要抱，被鱼哥一个眼神钉在原地。 \"行了行了。\"我拍拍他肩膀，\"车呢？\" \"前头，老周那台面包。\"豆芽仔抹了把脸，\"我手机也没电了，你们要是再不出来，我都打算报警了——就报那个……走失，对，走失。\" 他絮絮叨叨说着这两天的见闻：雨有多大，路冲断了几段，他半夜在车里冻得直哆嗦。我听得心不在焉，直到他说到一句，我才猛地抬起头。 \"对了哥，\"豆芽仔压低声音，\"老周前天打电话来，说店门口来了个人，问咱们。\" \"什么人？\" \"四十来岁，瘦高个，戴着顶旧草帽，说话有点山西那边的口音。\"豆芽仔挠挠头，\"他说他姓谢，是替一个'收老物件'的老板跑腿的，想问问老周，知不知道桓仁一带有人收过'一种倒扣的陶锅'。\" 我看了把头一眼。 把头正闭着眼靠在车座上，像是睡着了。可我知道他没睡。 \"老周咋回的？\" \"老周说不知道，那人也没多问，就走了。\"豆芽仔小声说，\"老周让我转告大哥——那人走的时候，在店门口站了好一会儿，不是看店，是看马路对面的山头。\" 回据点是下午三点多。 小萱把鸭子喂了，看见我们回来，眼圈也红红的，嘴上却硬：\"四天三宿，连个电话都没有，我还以为你们让熊瞎子叼走了。\" \"鸭蛋呢？\"鱼哥难得问了一句。 \"下了三个。\"小萱说，\"有个事跟你们说——昨儿夜里，据点座机响了两回。我接起来，那边没人说话。\" \"响两回？\"我皱了皱眉。 \"嗯。第二回我特意等了一会儿才接，还是没人。我让豆芽仔查了，不是断线，就是有人打过来，不说话。\" 座机号只有老周和几个熟人知道。 我一时没说话。据点这地方，是从前一个看林人留下的土房，前后不挨村，院墙外头就是柞树林子。真有人摸到这儿来打电话，却不出声，那意思比出声还明白—— 他在告诉咱们：我找得着你们。 我把这层意思在肚子里滚了一圈，没当着小萱的面说出来。 晚饭是豆芽仔炖的酸菜，就着贴饼子。我吃了两大碗，把四天的亏空往回找补。鱼哥吃得少，吃了半碗就撂了筷子，坐在炕沿上发呆。 \"睡不着？\" \"不敢睡。\"他老实说，\"一合眼，就听见敲锅声。\" 我从怀里把那面照魇镜掏出来，塞回他手里：\"还你，收好。夜里要是再魇着，镜子硌着胸口，能醒得快些。\" 鱼哥看着镜背上那道鱼尾文，半天没说话。他抬头看了我一眼，像是想说什么，又咽了回去。 晚上，把头把我们几个叫到里屋。 他盘腿坐在炕上，面前摊着一张桓仁的地图，红铅笔在几个点子上画了圈。他先讲了讲白天在沟里我看到的那些事——锅让谁起了、灯是谁挂的、有人半夜翻锅验名分——讲完，他拿铅笔点了点地图上两个点。 \"这一趟，值。\"他说，\"锅、灯、字、人，都见着了一半。剩下一半，全在这上头——人。\" \"沟先不进了？\" \"不进了。\"把头把铅笔搁下，\"底下那石室，跑不了；阴契在咱们手里，名分也跑不了。可外头这几路人要是弄不明白，咱们就算把骨城挖出来，也是给人做嫁衣裳。\" \"先摸人。\"他说，\"缺指人那台辽P车，包头卖珍珠罐那俩，还有那个半夜翻锅、能把灯挂得这么熟的主儿——三路人，三天，一条一条捋清楚。捋不明白，咱们就停在这一步，谁也别想再进沟。\" 他说这话的时候，窗外的风把窗纸吹得哗啦响。豆芽仔坐在墙角，大气不敢出。 那一夜我睡得极沉，一觉到天亮，连梦都没做。 第二天一早，我蹲在院里刷牙，兜里的手机震了一下。 我掏出来一看，是一条短信。号码陌生，连归属地都查不出来，就一句话： \"锅盖给您留着呢。下回见面，带灯的可就不止一个了。\""}, {"id": "A5-074", "arc": "A5", "num": 74, "title": "摸底", "md": "那条短信的号码，我回拨了三次——空号、停机、忙音，一次比一次干净。\n\n我捏着手机在院里站了一会儿。号码是假的，用完了就扔。可话说得明白——\"锅盖给您留着呢\"。这人知道我们从沟里出来了，知道我们看见了那口空锅，还知道我们没敢动它。\n\n我揣起手机，走进堂屋。把头正蹲在炉子跟前烧水，听见脚步声，头也没回：\n\n\"打通了？\"\n\n\"打不通。\"我说，\"机主把卡都停了。\"\n\n\"嗯。\"他把搪瓷缸子从炉子上端下来，\"这话，你信几分？\"\n\n\"三分。\"\n\n\"哪三分？\"\n\n\"锅盖是真留着。\"我说，\"我们在沟里三宿，那口锅原样没动过——他说的是实话。剩下七分，全是吓唬。\"\n\n把头把茶缸递给我，自己点了一根烟。\n\n\"吓唬人的人，最怕你不当回事。\"他说，\"可他也最怕你太当回事。云峰，你把那七分吓得掉在地上，他那三分实话，就得自己来收了。\"\n\n\"今天分三路。\"把头拿烟点了点我，\"你跟文斌去县城找老周，把两年前那伙包头人的底细，从根儿上刨一刨。芽仔去加油站那条路盯着，看看今儿个老鼠男出不出摊。我留下，跟王老丈把沟里的账再对一遍。\"\n\n\"对账？\"\n\n\"沟里那几口锅，谁先放的，谁后放的，放了多少年，你我都说不清。\"把头吐了口烟，\"可有人清楚。王老丈在这山脚下守了半辈子，心里那本账，比咱们画在纸上的细。\"\n\n我看了他一眼，点了点头。\n\n老周一见我，先把我拽到柜台后头，压低声音：\n\n\"兄弟，你可算来了！上回你说让那店关十天，我关了。可前天——就前天——有个戴草帽的瘦高个儿，又来了！\"\n\n\"我听芽仔说了。姓谢？\"\n\n\"他这回没报名号。\"老周咽了口唾沫，\"就隔着门缝问我：'老周，听说你这儿收过一对包头客人的珍珠罐儿？'\"\n\n我心里一紧：\"你怎么答的？\"\n\n\"我说收过啊——那罐子还在后屋柜子里锁着呢，他要是想出手，我原价退给他都行。\"老周搓着手，\"他就笑了，说不用退。说——'那罐子是我卖给你的。你留着，往后有用。'\"\n\n\"他说珍珠罐是他的？\"\n\n\"他是这么说的。\"老周挠头，\"可当年卖罐子的是那个红鼻头，说话跟吵架似的那个，不是他啊。这瘦高个儿说话慢声细语的，带着股山西那边的味儿，压根不是一路人。\"\n\n我心里慢慢转过一个念头。\n\n\"后来呢？\"\n\n\"后来他就走了。\"老周说，\"走了两步，又回头补了一句。他说：'跟你们掌柜的说——去年撒出去的货，是给山里的东西打记号，不是卖钱。叫他别怕。'\"\n\n\"山里的东西？\"\n\n\"他是这么说的！\"老周一拍大腿，\"兄弟，我听着瘆得慌，这话我憋了两天了，谁都没敢告诉！\"\n\n我掏出口袋里的小本子，凑到老周跟前：\n\n\"老周，你仔细回忆回忆——当年卖你珍珠罐那俩人，一个红鼻头，四十来岁，说话冲。另一个什么样？\"\n\n\"另一个不爱说话。\"老周想都不想，\"瘦，头发花白，看着快六十了。全程蹲在门口抽烟，我递烟他也不接，就抽自个儿的。\"\n\n\"他穿的什么？\"\n\n\"灰褂子，黑布鞋。\"老周想了想，忽然一拍手，\"哎，对！他那灰褂子袖口上，补着一块蓝补丁——补得针脚那叫一个细，比机器缝的还匀。我当时还想呢，这年头哪还有男人会补衣裳，补得这么好。\"\n\n补丁。\n\n针脚细。\n\n我跟鱼哥对视了一眼——在沟里石室北壁上，那两枚新打的钢钎眼里，系着的红布条，也是这么细的针脚。\n\n\"他手上呢？\"我追问道，\"有没有什么记号？\"\n\n\"记号？\"老周愣住了，\"……手上能有什么记号？我就记着他左手一直揣在褂子兜里，掏烟都是右手掏的。哦对了，\"他又想起什么，\"他蹲门口抽烟那会儿，我瞧见他烟盒上写着一行小字，像是谁给抄的地址。\"\n\n\"写的什么？\"\n\n\"记不清了。\"老周摇头，\"就记得是'桓仁'俩字儿，别的没看清。\"\n\n桓仁。\n\n\"老周，\"我站起来，\"替我找个人——县城里那个猴三儿。\"\n\n猴三儿是桓仁县城一个跑单帮的老贩子，收古钱、收杂件，也替人牵线。老周一个电话就把他从早市上叫了过来。\n\n猴三儿五十多岁，瘦小枯干，进门先打量了我两眼，才坐下。\n\n\"二位是要问那对包头客吧？\"他开门见山，\"老周在电话里说了。那俩人，我熟。\"\n\n\"怎么个熟法？\"\n\n\"去年开春，他俩在雅河乡王瘸子那间废蜂房里住过小半年。\"猴三儿伸出三根手指，\"租钱给了四百，王瘸子要三百，他俩多给一百，说是'添点柴火钱'。就冲这一百块钱，王瘸子记了他俩一辈子。\"\n\n\"住小半年，干什么？\"\n\n\"说是收山货。\"猴三儿咧嘴一笑，露出半口黄牙，\"可山货哪有那么收的？你们去问问，雅河乡这一冬，有谁见着他们收过一麻袋蘑菇？\"\n\n我身子往前倾了倾。\n\n\"他们隔个十天半月就进一回山，每回进山前，都在蜂房后头烧一回纸。\"猴三儿压低声音，\"有回我正好路过，看见那纸灰堆里插着三根没烧完的香——那可不是给活人烧的。\"\n\n给山里的东西烧纸。\n\n\"后来呢？\"\n\n\"后来到五月，他们走了。\"猴三儿说，\"走之前，把蜂房扫得干干净净，连根柴火棍都没留下。王瘸子还纳闷，说住了小半年，连个破碗都没落下，讲究人。\"\n\n我把这几个字记下，又问：\"最近呢？\"\n\n\"最近？\"猴三儿眼珠子转了转，\"你算问着了。上月，有人瞧见那白头发的瘦老头，一个人坐在五女山北坡的护林道口上，坐了一下午，就干坐着抽烟。护林员老陈过去问他等谁，他说等个人，等不着就走。\"\n\n\"走了吗？\"\n\n\"走了。\"猴三儿说，\"老陈说他走得快，一双黑布鞋，走的全是山路，跟本地老山民一个步子。\"\n\n\"他等的，会不会是进沟没出来的人？\"鱼哥忽然开口。\n\n猴三儿一愣：\"那我就不知道了。\"\n\n老周在边上插嘴：\"那俩人当年不是从沟里出来的吗？一个红鼻头，一个白头发的……\"\n\n五个人进了沟，出来俩。那个白头发瘦子，两年前跟着红鼻头撒货，两年后，又一个人回到五女山北坡，坐着等\"人\"。\n\n离开老周店之前，我用他店里的座机拨了太清宫南街那家佛具店的号——马渡霜的店。\n\n响了七八声才有人接，是个年轻女声：\"福香店，婶子闭堂，不见客。\"\n\n\"我是项云峰，桓仁的。就说上次那个破财的小子，有事问她。\"\n\n那边停了一下：\"……桓仁的？婶子走前留过话——桓仁要是来人问，就说一句：别接灯。灯亮一盏，走一个人。\"\n\n\"还有别的吗？\"\n\n\"没了。\"女声说，\"婶子说，就这一句，他听得懂。\"\n\n我挂了电话，站在柜台边上，半天没动。\n\n别接灯。\n\n灯亮一盏，走一个人。\n\n那盏白纸灯笼挂在我们面前，我们没有点它。可鱼哥魇着的时候，它自己亮过一回。\n\n那算不算接了？\n\n我走出店门，鱼哥跟上来，没问电话里说了什么。他从不问我不想说的事。\n\n豆芽仔的电话是在傍晚打来的。\n\n\"哥，我蹲了一天，老鼠男今儿没出摊。\"他声音有点紧，\"那摊子东西都在，锅碗瓢盆、墨镜土豆，一样没少，就是人没来。我问了隔壁卖茶叶蛋的婶子，她说昨儿就没见着他出摊。\"\n\n老鼠男不在了。\n\n那个守着加油站、看着这条路上进出的人，忽然不见了。\n\n\"还有件事。\"豆芽仔又说，\"我回来的路上，绕到普乐堡去看了一眼满意。满意说，昨儿后晌，有人给他送了个纸包，说是'王老爷子订的蛇药引子'。他也没多想，就收了。\"\n\n我心头一沉。\n\n\"包呢？\"\n\n\"我拆开看了。\"豆芽仔的声音低得几乎听不见，\"里头没有药。就一根带子——红一道黑一道，跟加油站那老鼠男摊上挂的一模一样。\"\n\n我握着手机的手慢慢收紧。\n\n\"满意呢？\"\n\n\"在家呢，好端端的。\"豆芽仔说，\"他说那人戴着草帽，瘦高个，说话客客气气的，放下东西就走了。哥，我觉着这事儿不对，要不要把满意接出来？\"\n\n\"你先别动。\"我说，\"就在老屋附近盯着，别让人看见。我这就往回赶。\"\n\n挂了电话，我把手机攥在手心里，指节捏得发白。\n\n一条红黑飘带，送到王药根的孙子手里。去年他们在石室打钎眼、系红布，是给山里看的；今天他们把带子送进人家里，是给人看的。\n\n我们以为那伙人惦记的是那口锅。\n\n可他们把带子送到了王药根门上。\n\n我一路没说话，三蹦子突突突地往回开。鱼哥坐在后斗里，忽然开口：\n\n\"云峰，那条带子，到底是给谁的？\"\n\n\"给王老丈的。\"我说，\"他们在告诉他——山门关了。\"\n\n三蹦子拐过最后一个弯，据点土房的灯亮着。我推门进去的时候，王药根正坐在堂屋的灯底下，手里捏着一根纸烟，没点。\n\n他抬起头，看着我，半天没说话。\n\n我把豆芽仔的话原原本本说了一遍。说到那根带子的时候，老头的眼皮颤了一下。\n\n\"满意呢？\"他问。\n\n\"在家，好端端的。\"我说，\"芽仔守在那呢。\"\n\n王药根低下头，把烟搁回烟盒里。他摩挲着那盒烟，过了很久，才开口，声音平得出奇：\n\n\"云峰小友。\"\n\n\"大爷，您说。\"\n\n\"明天，你把那根带子给我捎回来。\"他说，\"还有，把你那份分金约，也一起拿来。\"\n\n\"做什么？\"\n\n老头抬眼看我，灶火在他眼睛里跳了一下，又暗下去：\n\n\"退伙。\"他说，\"我王药根，要退伙。\"", "words": 3355, "html": "<p>那条短信的号码，我回拨了三次——空号、停机、忙音，一次比一次干净。<\/p>\n<p>我捏着手机在院里站了一会儿。号码是假的，用完了就扔。可话说得明白——\"锅盖给您留着呢\"。这人知道我们从沟里出来了，知道我们看见了那口空锅，还知道我们没敢动它。<\/p>\n<p>我揣起手机，走进堂屋。把头正蹲在炉子跟前烧水，听见脚步声，头也没回：<\/p>\n<p>\"打通了？\"<\/p>\n<p>\"打不通。\"我说，\"机主把卡都停了。\"<\/p>\n<p>\"嗯。\"他把搪瓷缸子从炉子上端下来，\"这话，你信几分？\"<\/p>\n<p>\"三分。\"<\/p>\n<p>\"哪三分？\"<\/p>\n<p>\"锅盖是真留着。\"我说，\"我们在沟里三宿，那口锅原样没动过——他说的是实话。剩下七分，全是吓唬。\"<\/p>\n<p>把头把茶缸递给我，自己点了一根烟。<\/p>\n<p>\"吓唬人的人，最怕你不当回事。\"他说，\"可他也最怕你太当回事。云峰，你把那七分吓得掉在地上，他那三分实话，就得自己来收了。\"<\/p>\n<p>\"今天分三路。\"把头拿烟点了点我，\"你跟文斌去县城找老周，把两年前那伙包头人的底细，从根儿上刨一刨。芽仔去加油站那条路盯着，看看今儿个老鼠男出不出摊。我留下，跟王老丈把沟里的账再对一遍。\"<\/p>\n<p>\"对账？\"<\/p>\n<p>\"沟里那几口锅，谁先放的，谁后放的，放了多少年，你我都说不清。\"把头吐了口烟，\"可有人清楚。王老丈在这山脚下守了半辈子，心里那本账，比咱们画在纸上的细。\"<\/p>\n<p>我看了他一眼，点了点头。<\/p>\n<p>老周一见我，先把我拽到柜台后头，压低声音：<\/p>\n<p>\"兄弟，你可算来了！上回你说让那店关十天，我关了。可前天——就前天——有个戴草帽的瘦高个儿，又来了！\"<\/p>\n<p>\"我听芽仔说了。姓谢？\"<\/p>\n<p>\"他这回没报名号。\"老周咽了口唾沫，\"就隔着门缝问我：'老周，听说你这儿收过一对包头客人的珍珠罐儿？'\"<\/p>\n<p>我心里一紧：\"你怎么答的？\"<\/p>\n<p>\"我说收过啊——那罐子还在后屋柜子里锁着呢，他要是想出手，我原价退给他都行。\"老周搓着手，\"他就笑了，说不用退。说——'那罐子是我卖给你的。你留着，往后有用。'\"<\/p>\n<p>\"他说珍珠罐是他的？\"<\/p>\n<p>\"他是这么说的。\"老周挠头，\"可当年卖罐子的是那个红鼻头，说话跟吵架似的那个，不是他啊。这瘦高个儿说话慢声细语的，带着股山西那边的味儿，压根不是一路人。\"<\/p>\n<p>我心里慢慢转过一个念头。<\/p>\n<p>\"后来呢？\"<\/p>\n<p>\"后来他就走了。\"老周说，\"走了两步，又回头补了一句。他说：'跟你们掌柜的说——去年撒出去的货，是给山里的东西打记号，不是卖钱。叫他别怕。'\"<\/p>\n<p>\"山里的东西？\"<\/p>\n<p>\"他是这么说的！\"老周一拍大腿，\"兄弟，我听着瘆得慌，这话我憋了两天了，谁都没敢告诉！\"<\/p>\n<p>我掏出口袋里的小本子，凑到老周跟前：<\/p>\n<p>\"老周，你仔细回忆回忆——当年卖你珍珠罐那俩人，一个红鼻头，四十来岁，说话冲。另一个什么样？\"<\/p>\n<p>\"另一个不爱说话。\"老周想都不想，\"瘦，头发花白，看着快六十了。全程蹲在门口抽烟，我递烟他也不接，就抽自个儿的。\"<\/p>\n<p>\"他穿的什么？\"<\/p>\n<p>\"灰褂子，黑布鞋。\"老周想了想，忽然一拍手，\"哎，对！他那灰褂子袖口上，补着一块蓝补丁——补得针脚那叫一个细，比机器缝的还匀。我当时还想呢，这年头哪还有男人会补衣裳，补得这么好。\"<\/p>\n<p>补丁。<\/p>\n<p>针脚细。<\/p>\n<p>我跟鱼哥对视了一眼——在沟里石室北壁上，那两枚新打的钢钎眼里，系着的红布条，也是这么细的针脚。<\/p>\n<p>\"他手上呢？\"我追问道，\"有没有什么记号？\"<\/p>\n<p>\"记号？\"老周愣住了，\"……手上能有什么记号？我就记着他左手一直揣在褂子兜里，掏烟都是右手掏的。哦对了，\"他又想起什么，\"他蹲门口抽烟那会儿，我瞧见他烟盒上写着一行小字，像是谁给抄的地址。\"<\/p>\n<p>\"写的什么？\"<\/p>\n<p>\"记不清了。\"老周摇头，\"就记得是'桓仁'俩字儿，别的没看清。\"<\/p>\n<p>桓仁。<\/p>\n<p>\"老周，\"我站起来，\"替我找个人——县城里那个猴三儿。\"<\/p>\n<p>猴三儿是桓仁县城一个跑单帮的老贩子，收古钱、收杂件，也替人牵线。老周一个电话就把他从早市上叫了过来。<\/p>\n<p>猴三儿五十多岁，瘦小枯干，进门先打量了我两眼，才坐下。<\/p>\n<p>\"二位是要问那对包头客吧？\"他开门见山，\"老周在电话里说了。那俩人，我熟。\"<\/p>\n<p>\"怎么个熟法？\"<\/p>\n<p>\"去年开春，他俩在雅河乡王瘸子那间废蜂房里住过小半年。\"猴三儿伸出三根手指，\"租钱给了四百，王瘸子要三百，他俩多给一百，说是'添点柴火钱'。就冲这一百块钱，王瘸子记了他俩一辈子。\"<\/p>\n<p>\"住小半年，干什么？\"<\/p>\n<p>\"说是收山货。\"猴三儿咧嘴一笑，露出半口黄牙，\"可山货哪有那么收的？你们去问问，雅河乡这一冬，有谁见着他们收过一麻袋蘑菇？\"<\/p>\n<p>我身子往前倾了倾。<\/p>\n<p>\"他们隔个十天半月就进一回山，每回进山前，都在蜂房后头烧一回纸。\"猴三儿压低声音，\"有回我正好路过，看见那纸灰堆里插着三根没烧完的香——那可不是给活人烧的。\"<\/p>\n<p>给山里的东西烧纸。<\/p>\n<p>\"后来呢？\"<\/p>\n<p>\"后来到五月，他们走了。\"猴三儿说，\"走之前，把蜂房扫得干干净净，连根柴火棍都没留下。王瘸子还纳闷，说住了小半年，连个破碗都没落下，讲究人。\"<\/p>\n<p>我把这几个字记下，又问：\"最近呢？\"<\/p>\n<p>\"最近？\"猴三儿眼珠子转了转，\"你算问着了。上月，有人瞧见那白头发的瘦老头，一个人坐在五女山北坡的护林道口上，坐了一下午，就干坐着抽烟。护林员老陈过去问他等谁，他说等个人，等不着就走。\"<\/p>\n<p>\"走了吗？\"<\/p>\n<p>\"走了。\"猴三儿说，\"老陈说他走得快，一双黑布鞋，走的全是山路，跟本地老山民一个步子。\"<\/p>\n<p>\"他等的，会不会是进沟没出来的人？\"鱼哥忽然开口。<\/p>\n<p>猴三儿一愣：\"那我就不知道了。\"<\/p>\n<p>老周在边上插嘴：\"那俩人当年不是从沟里出来的吗？一个红鼻头，一个白头发的……\"<\/p>\n<p>五个人进了沟，出来俩。那个白头发瘦子，两年前跟着红鼻头撒货，两年后，又一个人回到五女山北坡，坐着等\"人\"。<\/p>\n<p>离开老周店之前，我用他店里的座机拨了太清宫南街那家佛具店的号——马渡霜的店。<\/p>\n<p>响了七八声才有人接，是个年轻女声：\"福香店，婶子闭堂，不见客。\"<\/p>\n<p>\"我是项云峰，桓仁的。就说上次那个破财的小子，有事问她。\"<\/p>\n<p>那边停了一下：\"……桓仁的？婶子走前留过话——桓仁要是来人问，就说一句：别接灯。灯亮一盏，走一个人。\"<\/p>\n<p>\"还有别的吗？\"<\/p>\n<p>\"没了。\"女声说，\"婶子说，就这一句，他听得懂。\"<\/p>\n<p>我挂了电话，站在柜台边上，半天没动。<\/p>\n<p>别接灯。<\/p>\n<p>灯亮一盏，走一个人。<\/p>\n<p>那盏白纸灯笼挂在我们面前，我们没有点它。可鱼哥魇着的时候，它自己亮过一回。<\/p>\n<p>那算不算接了？<\/p>\n<p>我走出店门，鱼哥跟上来，没问电话里说了什么。他从不问我不想说的事。<\/p>\n<p>豆芽仔的电话是在傍晚打来的。<\/p>\n<p>\"哥，我蹲了一天，老鼠男今儿没出摊。\"他声音有点紧，\"那摊子东西都在，锅碗瓢盆、墨镜土豆，一样没少，就是人没来。我问了隔壁卖茶叶蛋的婶子，她说昨儿就没见着他出摊。\"<\/p>\n<p>老鼠男不在了。<\/p>\n<p>那个守着加油站、看着这条路上进出的人，忽然不见了。<\/p>\n<p>\"还有件事。\"豆芽仔又说，\"我回来的路上，绕到普乐堡去看了一眼满意。满意说，昨儿后晌，有人给他送了个纸包，说是'王老爷子订的蛇药引子'。他也没多想，就收了。\"<\/p>\n<p>我心头一沉。<\/p>\n<p>\"包呢？\"<\/p>\n<p>\"我拆开看了。\"豆芽仔的声音低得几乎听不见，\"里头没有药。就一根带子——红一道黑一道，跟加油站那老鼠男摊上挂的一模一样。\"<\/p>\n<p>我握着手机的手慢慢收紧。<\/p>\n<p>\"满意呢？\"<\/p>\n<p>\"在家呢，好端端的。\"豆芽仔说，\"他说那人戴着草帽，瘦高个，说话客客气气的，放下东西就走了。哥，我觉着这事儿不对，要不要把满意接出来？\"<\/p>\n<p>\"你先别动。\"我说，\"就在老屋附近盯着，别让人看见。我这就往回赶。\"<\/p>\n<p>挂了电话，我把手机攥在手心里，指节捏得发白。<\/p>\n<p>一条红黑飘带，送到王药根的孙子手里。去年他们在石室打钎眼、系红布，是给山里看的；今天他们把带子送进人家里，是给人看的。<\/p>\n<p>我们以为那伙人惦记的是那口锅。<\/p>\n<p>可他们把带子送到了王药根门上。<\/p>\n<p>我一路没说话，三蹦子突突突地往回开。鱼哥坐在后斗里，忽然开口：<\/p>\n<p>\"云峰，那条带子，到底是给谁的？\"<\/p>\n<p>\"给王老丈的。\"我说，\"他们在告诉他——山门关了。\"<\/p>\n<p>三蹦子拐过最后一个弯，据点土房的灯亮着。我推门进去的时候，王药根正坐在堂屋的灯底下，手里捏着一根纸烟，没点。<\/p>\n<p>他抬起头，看着我，半天没说话。<\/p>\n<p>我把豆芽仔的话原原本本说了一遍。说到那根带子的时候，老头的眼皮颤了一下。<\/p>\n<p>\"满意呢？\"他问。<\/p>\n<p>\"在家，好端端的。\"我说，\"芽仔守在那呢。\"<\/p>\n<p>王药根低下头，把烟搁回烟盒里。他摩挲着那盒烟，过了很久，才开口，声音平得出奇：<\/p>\n<p>\"云峰小友。\"<\/p>\n<p>\"大爷，您说。\"<\/p>\n<p>\"明天，你把那根带子给我捎回来。\"他说，\"还有，把你那份分金约，也一起拿来。\"<\/p>\n<p>\"做什么？\"<\/p>\n<p>老头抬眼看我，灶火在他眼睛里跳了一下，又暗下去：<\/p>\n<p>\"退伙。\"他说，\"我王药根，要退伙。\"<\/p>", "plain": "那条短信的号码，我回拨了三次——空号、停机、忙音，一次比一次干净。 我捏着手机在院里站了一会儿。号码是假的，用完了就扔。可话说得明白——\"锅盖给您留着呢\"。这人知道我们从沟里出来了，知道我们看见了那口空锅，还知道我们没敢动它。 我揣起手机，走进堂屋。把头正蹲在炉子跟前烧水，听见脚步声，头也没回： \"打通了？\" \"打不通。\"我说，\"机主把卡都停了。\" \"嗯。\"他把搪瓷缸子从炉子上端下来，\"这话，你信几分？\" \"三分。\" \"哪三分？\" \"锅盖是真留着。\"我说，\"我们在沟里三宿，那口锅原样没动过——他说的是实话。剩下七分，全是吓唬。\" 把头把茶缸递给我，自己点了一根烟。 \"吓唬人的人，最怕你不当回事。\"他说，\"可他也最怕你太当回事。云峰，你把那七分吓得掉在地上，他那三分实话，就得自己来收了。\" \"今天分三路。\"把头拿烟点了点我，\"你跟文斌去县城找老周，把两年前那伙包头人的底细，从根儿上刨一刨。芽仔去加油站那条路盯着，看看今儿个老鼠男出不出摊。我留下，跟王老丈把沟里的账再对一遍。\" \"对账？\" \"沟里那几口锅，谁先放的，谁后放的，放了多少年，你我都说不清。\"把头吐了口烟，\"可有人清楚。王老丈在这山脚下守了半辈子，心里那本账，比咱们画在纸上的细。\" 我看了他一眼，点了点头。 老周一见我，先把我拽到柜台后头，压低声音： \"兄弟，你可算来了！上回你说让那店关十天，我关了。可前天——就前天——有个戴草帽的瘦高个儿，又来了！\" \"我听芽仔说了。姓谢？\" \"他这回没报名号。\"老周咽了口唾沫，\"就隔着门缝问我：'老周，听说你这儿收过一对包头客人的珍珠罐儿？'\" 我心里一紧：\"你怎么答的？\" \"我说收过啊——那罐子还在后屋柜子里锁着呢，他要是想出手，我原价退给他都行。\"老周搓着手，\"他就笑了，说不用退。说——'那罐子是我卖给你的。你留着，往后有用。'\" \"他说珍珠罐是他的？\" \"他是这么说的。\"老周挠头，\"可当年卖罐子的是那个红鼻头，说话跟吵架似的那个，不是他啊。这瘦高个儿说话慢声细语的，带着股山西那边的味儿，压根不是一路人。\" 我心里慢慢转过一个念头。 \"后来呢？\" \"后来他就走了。\"老周说，\"走了两步，又回头补了一句。他说：'跟你们掌柜的说——去年撒出去的货，是给山里的东西打记号，不是卖钱。叫他别怕。'\" \"山里的东西？\" \"他是这么说的！\"老周一拍大腿，\"兄弟，我听着瘆得慌，这话我憋了两天了，谁都没敢告诉！\" 我掏出口袋里的小本子，凑到老周跟前： \"老周，你仔细回忆回忆——当年卖你珍珠罐那俩人，一个红鼻头，四十来岁，说话冲。另一个什么样？\" \"另一个不爱说话。\"老周想都不想，\"瘦，头发花白，看着快六十了。全程蹲在门口抽烟，我递烟他也不接，就抽自个儿的。\" \"他穿的什么？\" \"灰褂子，黑布鞋。\"老周想了想，忽然一拍手，\"哎，对！他那灰褂子袖口上，补着一块蓝补丁——补得针脚那叫一个细，比机器缝的还匀。我当时还想呢，这年头哪还有男人会补衣裳，补得这么好。\" 补丁。 针脚细。 我跟鱼哥对视了一眼——在沟里石室北壁上，那两枚新打的钢钎眼里，系着的红布条，也是这么细的针脚。 \"他手上呢？\"我追问道，\"有没有什么记号？\" \"记号？\"老周愣住了，\"……手上能有什么记号？我就记着他左手一直揣在褂子兜里，掏烟都是右手掏的。哦对了，\"他又想起什么，\"他蹲门口抽烟那会儿，我瞧见他烟盒上写着一行小字，像是谁给抄的地址。\" \"写的什么？\" \"记不清了。\"老周摇头，\"就记得是'桓仁'俩字儿，别的没看清。\" 桓仁。 \"老周，\"我站起来，\"替我找个人——县城里那个猴三儿。\" 猴三儿是桓仁县城一个跑单帮的老贩子，收古钱、收杂件，也替人牵线。老周一个电话就把他从早市上叫了过来。 猴三儿五十多岁，瘦小枯干，进门先打量了我两眼，才坐下。 \"二位是要问那对包头客吧？\"他开门见山，\"老周在电话里说了。那俩人，我熟。\" \"怎么个熟法？\" \"去年开春，他俩在雅河乡王瘸子那间废蜂房里住过小半年。\"猴三儿伸出三根手指，\"租钱给了四百，王瘸子要三百，他俩多给一百，说是'添点柴火钱'。就冲这一百块钱，王瘸子记了他俩一辈子。\" \"住小半年，干什么？\" \"说是收山货。\"猴三儿咧嘴一笑，露出半口黄牙，\"可山货哪有那么收的？你们去问问，雅河乡这一冬，有谁见着他们收过一麻袋蘑菇？\" 我身子往前倾了倾。 \"他们隔个十天半月就进一回山，每回进山前，都在蜂房后头烧一回纸。\"猴三儿压低声音，\"有回我正好路过，看见那纸灰堆里插着三根没烧完的香——那可不是给活人烧的。\" 给山里的东西烧纸。 \"后来呢？\" \"后来到五月，他们走了。\"猴三儿说，\"走之前，把蜂房扫得干干净净，连根柴火棍都没留下。王瘸子还纳闷，说住了小半年，连个破碗都没落下，讲究人。\" 我把这几个字记下，又问：\"最近呢？\" \"最近？\"猴三儿眼珠子转了转，\"你算问着了。上月，有人瞧见那白头发的瘦老头，一个人坐在五女山北坡的护林道口上，坐了一下午，就干坐着抽烟。护林员老陈过去问他等谁，他说等个人，等不着就走。\" \"走了吗？\" \"走了。\"猴三儿说，\"老陈说他走得快，一双黑布鞋，走的全是山路，跟本地老山民一个步子。\" \"他等的，会不会是进沟没出来的人？\"鱼哥忽然开口。 猴三儿一愣：\"那我就不知道了。\" 老周在边上插嘴：\"那俩人当年不是从沟里出来的吗？一个红鼻头，一个白头发的……\" 五个人进了沟，出来俩。那个白头发瘦子，两年前跟着红鼻头撒货，两年后，又一个人回到五女山北坡，坐着等\"人\"。 离开老周店之前，我用他店里的座机拨了太清宫南街那家佛具店的号——马渡霜的店。 响了七八声才有人接，是个年轻女声：\"福香店，婶子闭堂，不见客。\" \"我是项云峰，桓仁的。就说上次那个破财的小子，有事问她。\" 那边停了一下：\"……桓仁的？婶子走前留过话——桓仁要是来人问，就说一句：别接灯。灯亮一盏，走一个人。\" \"还有别的吗？\" \"没了。\"女声说，\"婶子说，就这一句，他听得懂。\" 我挂了电话，站在柜台边上，半天没动。 别接灯。 灯亮一盏，走一个人。 那盏白纸灯笼挂在我们面前，我们没有点它。可鱼哥魇着的时候，它自己亮过一回。 那算不算接了？ 我走出店门，鱼哥跟上来，没问电话里说了什么。他从不问我不想说的事。 豆芽仔的电话是在傍晚打来的。 \"哥，我蹲了一天，老鼠男今儿没出摊。\"他声音有点紧，\"那摊子东西都在，锅碗瓢盆、墨镜土豆，一样没少，就是人没来。我问了隔壁卖茶叶蛋的婶子，她说昨儿就没见着他出摊。\" 老鼠男不在了。 那个守着加油站、看着这条路上进出的人，忽然不见了。 \"还有件事。\"豆芽仔又说，\"我回来的路上，绕到普乐堡去看了一眼满意。满意说，昨儿后晌，有人给他送了个纸包，说是'王老爷子订的蛇药引子'。他也没多想，就收了。\" 我心头一沉。 \"包呢？\" \"我拆开看了。\"豆芽仔的声音低得几乎听不见，\"里头没有药。就一根带子——红一道黑一道，跟加油站那老鼠男摊上挂的一模一样。\" 我握着手机的手慢慢收紧。 \"满意呢？\" \"在家呢，好端端的。\"豆芽仔说，\"他说那人戴着草帽，瘦高个，说话客客气气的，放下东西就走了。哥，我觉着这事儿不对，要不要把满意接出来？\" \"你先别动。\"我说，\"就在老屋附近盯着，别让人看见。我这就往回赶。\" 挂了电话，我把手机攥在手心里，指节捏得发白。 一条红黑飘带，送到王药根的孙子手里。去年他们在石室打钎眼、系红布，是给山里看的；今天他们把带子送进人家里，是给人看的。 我们以为那伙人惦记的是那口锅。 可他们把带子送到了王药根门上。 我一路没说话，三蹦子突突突地往回开。鱼哥坐在后斗里，忽然开口： \"云峰，那条带子，到底是给谁的？\" \"给王老丈的。\"我说，\"他们在告诉他——山门关了。\" 三蹦子拐过最后一个弯，据点土房的灯亮着。我推门进去的时候，王药根正坐在堂屋的灯底下，手里捏着一根纸烟，没点。 他抬起头，看着我，半天没说话。 我把豆芽仔的话原原本本说了一遍。说到那根带子的时候，老头的眼皮颤了一下。 \"满意呢？\"他问。 \"在家，好端端的。\"我说，\"芽仔守在那呢。\" 王药根低下头，把烟搁回烟盒里。他摩挲着那盒烟，过了很久，才开口，声音平得出奇： \"云峰小友。\" \"大爷，您说。\" \"明天，你把那根带子给我捎回来。\"他说，\"还有，把你那份分金约，也一起拿来。\" \"做什么？\" 老头抬眼看我，灶火在他眼睛里跳了一下，又暗下去： \"退伙。\"他说，\"我王药根，要退伙。\""}, {"id": "A5-075", "arc": "A5", "num": 75, "title": "选择", "md": "第二天一早，豆芽仔就把那根带子带了回来。\n\n他跑了一夜，眼圈青着，进门把一个塑料袋放在桌上，又从怀里掏出一张纸片：\"满意天没亮就让他舅接去宽甸他姨奶家了。这是那人留下的纸包皮，上头有字。\"\n\n王药根接过纸片，就着天光看了很久。\n\n纸皮上只有一行字，铅笔写的，笔画很硬：\n\n\"王老爷子收。货已验，人已出，山门从此关。\"\n\n\"货已验，人已出。\"我念了一遍，\"什么叫货已验？\"\n\n\"验的就是咱们。\"鱼哥靠在门框上，声音淡淡的，\"咱们从沟里出来，一个没少。他们把咱们当'货'数过了。\"\n\n我后脊梁一凉。\n\n那夜石室里有人掀锅、有人数锅——原来数的不是锅。\n\n是我们。\n\n王药根把纸片折好，收进怀里。他没提退伙的事，只把那根红黑带子平铺在桌上，抚平，用指腹一道一道地压过去。\n\n\"老辈人讲，\"他开口了，\"山里把门人传信，不用纸笔。红带子横送上门，是封门——山不让你进了；黑带子竖别门框，是请——山里头有人等你。\"\n\n\"横的送的是红的黑的？\"\n\n\"红黑一道儿，是封门里的死封。\"老头说，\"意思是：往后这座山，你连望都不许望一眼。\"\n\n\"封的是您？\"\n\n\"封的是咱们这几个从沟里出来的人。\"王药根抬起头，\"进去的可以，出来的不行——这是把门人几十年的规矩。我年轻时不信，只当是老古话。今儿知道了，那不是古话，是话。\"\n\n他顿了顿：\"咱们破了规矩。破了规矩的人，山要收账。\"\n\n屋里静了一瞬。\n\n小萱从里屋端了茶出来，给我们一人倒了一碗，又默默地退回里屋去了。\n\n\"老丈。\"把头开口，\"你打算怎么走？\"\n\n王药根从怀里摸出一样东西，放在桌上——一张折成四方块的黄纸，纸边磨得起毛，用红绳系着。\n\n那是他的那一份分金约。\n\n\"我这一份，在这儿。\"他说，\"今儿请你们诸位做个见证：我王药根，退伙。\"\n\n他说完，把红绳解开，将那张黄纸在桌上摊平。纸上的字，是把头的字。行里的约，从来不叫外人写。\n\n\"老丈。\"我忍不住开口，\"您想清楚——\"\n\n\"想清楚了。\"王药根打断我，\"我这辈子进过三回山。头一回，我自个儿回来，丢了半条命；第二回，我把儿子送进去，儿子再没出得来；第三回，是你把我领进去的——我见了我想见的东西，可我也惊动了把门人。\"\n\n他摩挲着那张约：\"头一回我年轻，不懂退；第二回我贪，不肯退。这第三回要是再不退，第四回，就该是满意替我进了。\"\n\n他把约推到桌子中间。\n\n\"我要退伙。这份约，请把头收回去。我应的分成，一文不要。\"\n\n豆芽仔张了张嘴，又闭上。鱼哥抱着膀子站在门口，没动。\n\n把头坐在上首，看着那张摊开的约，看了很久。\n\n\"老丈。\"他终于开口，\"约，我不能收。\"\n\n\"怎么？\"\n\n\"你的约在我这儿留着，你在道上才算'还有人管着'。\"把头说，\"我把约收了，你前脚出门，后脚就有人敢动你——一个没约没主的蛇花子，谁都敢捏一把。\"\n\n\"可是——\"\n\n\"可是你想干干净净地退。\"把头接口道，\"这行里，没有'退伙'这个说法。只有两种走法：一种是散伙，伙没了，约自然作废；另一种是——\"他顿了一下，\"办结。\"\n\n\"办结？\"\n\n把头站起身，从贴身夹袄的暗兜里摸出一张纸来。那纸比桌上的新，折成窄窄的长条，封皮上写着三个字——\"分金约\"。\n\n他把它放在桌上，压在王药根那张约的旁边。\n\n\"老丈，你还记得签约那天，我说过一句话么？\"\n\n\"你说，\"王药根看着那张纸，\"咱们这约，不是两份，是三份。第三张，是给道上看。\"\n\n\"对。\"把头说，\"就是这张。\"\n\n我心里一紧。\n\n两份约——你一份，我们一份。可这第三份，我从来没听他提起过。\n\n\"三份约，\"把头把那张长纸展开，\"头两份，是咱们自己看的，写的是真话：你应几成，我们应几成，私藏者三刀六洞。这第三份——\"\n\n他把它转过来，冲着我们，一字一字念道：\n\n\"'立约人：桓仁坐地户王药根。事由：代清运旧铁杂件一宗，工讫两讫，各不相欠。事讫人散，永不追讨。'\"\n\n我愣住了。\n\n没有分成，没有三刀六洞，没有山，没有沟，没有锅。\n\n通篇只有八个字是实的：**事讫人散，永不追讨。*
