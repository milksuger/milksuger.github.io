音发飘，\"哥，你们那边，到底要出什么事啊？\"\n\n我没回答。我把话筒搁回去，走出小屋，站在护林道口，往上看。\n\n半坡上，那片青石台子在晨光里泛着白。台上扣着一口锅，锅底朝天。\n\n灯，让他们点。\n\n账，不能认。\n\n我站在那儿，忽然明白把头这两句话是替我挡的——灯点起来，账记在他名下，认账的是他，不是我。他把我推到台前头，是想让我只做\"认字的\"，不沾那笔账。\n\n可昨夜那个白头发老头说得也明白：账主不上台，账就落认名分的人头上。\n\n明儿日落，把头要是上了台，那笔账，就是他的。", "words": 3085, "html": "<p>那盏灯上来得很慢。<\/p>\n<p>我跟鱼哥退到台子东边的老榆树后头，贴着树干看。来人走得不快，可脚下没有一点声音——枯叶、碎石、树根，他踩过去，跟踩在水面上一样。到了台下，他把灯往台沿上一搁，自己也在台边那块平石头上坐下了，背对着我们，一头白发在灯苗底下泛着灰。<\/p>\n<p>灰褂子。瘦。肩膀薄得像两块板。<\/p>\n<p>他没回头，也没四下看，就那么坐着，抽出一根烟，凑着灯苗点着。烟头的红点一明一灭，是东北烤烟那股子冲味。<\/p>\n<p>我攥着照魇镜的手心里全是汗。<\/p>\n<p>\"背锅的。\"他忽然开口，声音不高，带着点痰音，\"把锅扣上去。\"<\/p>\n<p>我心里一紧。他知道我们在这儿。他早知道。<\/p>\n<p>\"扣锅？\"<\/p>\n<p>\"扣。\"他说，\"口朝下。\"<\/p>\n<p>我看了鱼哥一眼。鱼哥没拦我，只把老避龙的布兜往怀里抱了抱，退到了榆树外头去。我抱着锅走到台心，蹲下，把那口锅端起来，慢慢翻了个个儿——<\/p>\n<p>锅口朝下，扣在台上。<\/p>\n<p>锅底冲上，露着那圈被我擦出来的鱼尾纹。灯苗的光落在上面，一深一浅两道刻痕，像水里游过去的一条鱼，尾巴还在。<\/p>\n<p>锅一落台，我手心里就空了一下。<\/p>\n<p>那口锅在台上扣得极稳，稳得不像是我摆上去的，倒像它自己寻着了地方。台心的圆印跟锅底严丝合缝，扣上去那一瞬，我心里\"咔\"地响了一声，像一把锁落进了锁眼。<\/p>\n<p>老头抽着烟，没看我，也没看锅，只看着台子底下那片黑林子。半晌，他才问：\"擦过没有？\"<\/p>\n<p>\"擦过。\"<\/p>\n<p>\"谁教你擦的？\"<\/p>\n<p>\"没人教。\"我说，\"灰厚，我顺手擦的。\"<\/p>\n<p>\"顺手。\"他把这两个字在嘴里嚼了一遍，\"不是顺手。是锅认你。别人的手摸上去，是一层灰；你的手摸上去，是一道纹。锅这东西，认手。\"<\/p>\n<p>我没接话。台子上风小，灯苗一动不动。<\/p>\n<p>\"你身上，有几样守字的东西？\"他又问。<\/p>\n<p>我想了想，把照魇镜从怀里掏出来，又把阴契从贴身的衣兜里摸出来，托在手里：\"镜子背上有'守'字。契是素面的，没字。\"<\/p>\n<p>\"镜子给我看。\"<\/p>\n<p>我把镜子递过去。他没接，只侧过头，就着灯苗看了一眼镜背，点点头：\"镜是眼。\"<\/p>\n<p>\"罐子上的纹，你见过了？\"<\/p>\n<p>\"见过。\"我说，\"圈足内侧，一深一浅，是刻了又磨的。\"<\/p>\n<p>\"罐是口。\"<\/p>\n<p>\"锅呢？\"<\/p>\n<p>\"锅是肚。\"他抬手，虚虚地朝台心一指，\"你扣着的那口，就是肚。\"<\/p>\n<p>我心里数了数：镜、罐、锅，三样。正要开口，他先说了：\"四样。\"<\/p>\n<p>\"哪来的四样？\"<\/p>\n<p>\"你自己看。\"他下巴朝我手里一抬，\"契。\"<\/p>\n<p>我把阴契凑到灯苗底下，斜着翻了几个角度。前几次看，那银符都是素面，光溜溜的。可这回，灯苗贴着边角照过去，符牌的右下角，隐隐浮出一道极浅的鱼尾印子——<\/p>\n<p>不是刻的。是拿模子压的。浅得几乎看不出，只有在灯苗斜着燎过去的时候，才显一显。<\/p>\n<p>我后脊梁上像被人浇了一瓢凉水。<\/p>\n<p>\"压的。\"我声音有点发干，\"跟刻的不一样。\"<\/p>\n<p>\"刻的是明账，压的是暗账。\"老头把烟头在石头上按灭，\"镜是眼，罐是口，锅是肚，契是名。四样凑齐了，一个人才算立得住。\"<\/p>\n<p>我把阴契和镜子一样一样收好，手心还是湿的。<\/p>\n<p>\"还有一样。\"我说，\"我们掌柜的让我先来，是把话说全。\"<\/p>\n<p>\"说。\"<\/p>\n<p>我就把鹰嘴沟石室里那一晚，捡要紧的说了。五口锅倒扣着，西南空一个位子，第五块素面无字的银符，还有北墙根那只白纸灯笼。我一句一句说，没添没减。<\/p>\n<p>老头一直没插话，等我说完，才慢慢开口：\"五口扣着，缺一口。那缺的一口，就是空出来的那一口。\"<\/p>\n<p>\"是消奴部？\"<\/p>\n<p>\"是你手里这口。\"他下巴朝台心一抬，\"你们把它从沟里背出来，那个位子就空了。空位子，山记得住。\"<\/p>\n<p>我心里一沉。原来我们取锅那一趟，不是从石室里搬走一样东西，是给那间石室留了个空。<\/p>\n<p>\"那台上这圈印子呢？\"我指了指锅底压着的那道圆印，\"这印子里头，还叠着一圈更浅的。\"<\/p>\n<p>\"你看见了。\"他语气平平，\"台上先头扣过一口。比你这口大。\"<\/p>\n<p>\"那口锅呢？\"<\/p>\n<p>\"走了。\"<\/p>\n<p>\"自己走的？\"<\/p>\n<p>\"这话，我不说。\"他重新摸出一根烟，凑着灯苗点着，\"锅是死物，谁都能搬。可搬得动它，跟搬得走它，是两码事。\"<\/p>\n<p>我又想起石室缝口他——不，是那个人说过的话。锅是死物，谁都能搬。可眼前这个白头发老头，跟沟里那个缺耳的老头，是不是一个人，我到这会儿也没瞧清。<\/p>\n<p>他始终侧着身，脸埋在灯苗那头的暗里，只露着半边白发。<\/p>\n<p>\"明儿日落，\"他抽了口烟，忽然转了话头，\"我在这台上点一盅灯。\"<\/p>\n<p>\"点灯做什么？\"<\/p>\n<p>\"灯一离地，名分就过明路。\"他说，\"点灯的来验，吹灯的来夺。谁的名分，谁自己站出来接。\"<\/p>\n<p>我心里一跳：\"您是哪一路的？\"<\/p>\n<p>\"我是问灯的。\"他说，\"我问了半辈子。谁想点，我问他想清没有；谁想吹，我问他还记不记得自己姓什么。\"<\/p>\n<p>\"那您问我什么？\"<\/p>\n<p>他没答，反问我一句：\"你们掌柜的，什么时候到？\"<\/p>\n<p>\"天黑前。\"我说，\"他让我先来，把话听全。\"<\/p>\n<p>\"话，我这就说全。\"他把烟在指间转了半圈，\"明儿日落，灯一起，你们掌柜的要是上了台，这笔账就记在他名下；他要是不上，账就落你头上。\"<\/p>\n<p>\"落我头上，是多大一笔账？\"<\/p>\n<p>\"不大。\"他笑了一下，笑得很淡，\"就是往后这山里的路，你走一条，就记一笔。记满了，山要收，你就得还。\"<\/p>\n<p>\"我要是不想认呢？\"<\/p>\n<p>\"那你今夜就把锅背下山。\"他抬手往坡下指了指，\"谁也不拦你。锅背走，就当没这回事，山里的账另找日子算。\"<\/p>\n<p>\"另找哪个日子？\"<\/p>\n<p>\"你问不着。\"他说，\"该来的时候，它自己会来。\"<\/p>\n<p>台子上静了半晌。灯苗在风里缩了一下，又立起来。<\/p>\n<p>\"还有一句。\"我咬了咬牙，把压了一路的话问出来，\"五盏灯，四盏有主。剩那一盏，是给我们掌柜留的？\"<\/p>\n<p>老头抽着烟，没看我：\"你们掌柜的，把账算错了。\"<\/p>\n<p>\"哪错了？\"<\/p>\n<p>\"数灯，不是数人。\"他说，\"是数名分。人有一个，名分可以有两个；名分有一个，人能换好几个。你们数的是人头，山里数的是名分。\"<\/p>\n<p>\"那第五盏——\"<\/p>\n<p>\"第五盏，不是没主。\"他把烟头弹进台下的林子里，那点红火划了道弧，灭了，\"是主还没认。名分这东西，得有人拿自己的手，按下去才算。\"<\/p>\n<p>他说完，站起来，把台沿上那盏油灯端起来，往台下走。<\/p>\n<p>\"您这就走？\"我追了两步。<\/p>\n<p>\"天亮前，我得下山。\"他头也没回，\"上了年纪的人，怕日头。\"<\/p>\n<p>\"我怎么找您？\"<\/p>\n<p>\"不用找。\"他的声音从林子里传上来，已经隔了老远，\"灯在我这儿。灯会开的时候，我自然来。\"<\/p>\n<p>那点灯火在獾子道上晃了两晃，往下沉，沉到林子里去，就看不见了。<\/p>\n<p>我站在原地，盯着他坐过的那块平石头。<\/p>\n<p>石沿上，压着一个摁灭的烟头。烟灰压得扁扁的，烟纸卷得很紧，是拿指头一下一下摁进去的，摁完还在石头上蹭了半圈。<\/p>\n<p>跟沟里缝口那个人掐烟的样子，一模一样。<\/p>\n<p>我站在那儿，心里那点说不清的疑影子，又沉了一层。<\/p>\n<p>我在台上站了很久。锅还扣在台心，锅底的纹冲着天。<\/p>\n<p>天蒙蒙亮的时候，我下到护林道口，借老陈屋里的座机给豆芽仔打了个电话。<\/p>\n<p>电话那头，豆芽仔的声音哑得厉害，像是没睡。<\/p>\n<p>\"哥，\"他头一句话就把我钉住了，\"昨儿后半夜，桓仁老周那铺子，叫人把临街的玻璃砸了。\"<\/p>\n<p>\"人没事吧？\"<\/p>\n<p>\"人没事，老周躲在里屋，吓了一宿。\"豆芽仔咽了口唾沫，\"玻璃碴子里头，压着一张纸，上头写了一行字——'锅再上山，就别下来了'。\"<\/p>\n<p>我捏着话筒，指节发白。<\/p>\n<p>\"把头呢？\"<\/p>\n<p>\"把头昨晚进的桓仁，见了老鼠男，带回来一句话。\"豆芽仔顿了顿，\"他说——'台上那盏灯，让他们点；账，不能认。'\"<\/p>\n<p>\"他还说什么？\"<\/p>\n<p>\"他说天黑前上到台子上，让你在台上等他。\"豆芽仔的声音发飘，\"哥，你们那边，到底要出什么事啊？\"<\/p>\n<p>我没回答。我把话筒搁回去，走出小屋，站在护林道口，往上看。<\/p>\n<p>半坡上，那片青石台子在晨光里泛着白。台上扣着一口锅，锅底朝天。<\/p>\n<p>灯，让他们点。<\/p>\n<p>账，不能认。<\/p>\n<p>我站在那儿，忽然明白把头这两句话是替我挡的——灯点起来，账记在他名下，认账的是他，不是我。他把我推到台前头，是想让我只做\"认字的\"，不沾那笔账。<\/p>\n<p>可昨夜那个白头发老头说得也明白：账主不上台，账就落认名分的人头上。<\/p>\n<p>明儿日落，把头要是上了台，那笔账，就是他的。<\/p>", "plain": "那盏灯上来得很慢。 我跟鱼哥退到台子东边的老榆树后头，贴着树干看。来人走得不快，可脚下没有一点声音——枯叶、碎石、树根，他踩过去，跟踩在水面上一样。到了台下，他把灯往台沿上一搁，自己也在台边那块平石头上坐下了，背对着我们，一头白发在灯苗底下泛着灰。 灰褂子。瘦。肩膀薄得像两块板。 他没回头，也没四下看，就那么坐着，抽出一根烟，凑着灯苗点着。烟头的红点一明一灭，是东北烤烟那股子冲味。 我攥着照魇镜的手心里全是汗。 \"背锅的。\"他忽然开口，声音不高，带着点痰音，\"把锅扣上去。\" 我心里一紧。他知道我们在这儿。他早知道。 \"扣锅？\" \"扣。\"他说，\"口朝下。\" 我看了鱼哥一眼。鱼哥没拦我，只把老避龙的布兜往怀里抱了抱，退到了榆树外头去。我抱着锅走到台心，蹲下，把那口锅端起来，慢慢翻了个个儿—— 锅口朝下，扣在台上。 锅底冲上，露着那圈被我擦出来的鱼尾纹。灯苗的光落在上面，一深一浅两道刻痕，像水里游过去的一条鱼，尾巴还在。 锅一落台，我手心里就空了一下。 那口锅在台上扣得极稳，稳得不像是我摆上去的，倒像它自己寻着了地方。台心的圆印跟锅底严丝合缝，扣上去那一瞬，我心里\"咔\"地响了一声，像一把锁落进了锁眼。 老头抽着烟，没看我，也没看锅，只看着台子底下那片黑林子。半晌，他才问：\"擦过没有？\" \"擦过。\" \"谁教你擦的？\" \"没人教。\"我说，\"灰厚，我顺手擦的。\" \"顺手。\"他把这两个字在嘴里嚼了一遍，\"不是顺手。是锅认你。别人的手摸上去，是一层灰；你的手摸上去，是一道纹。锅这东西，认手。\" 我没接话。台子上风小，灯苗一动不动。 \"你身上，有几样守字的东西？\"他又问。 我想了想，把照魇镜从怀里掏出来，又把阴契从贴身的衣兜里摸出来，托在手里：\"镜子背上有'守'字。契是素面的，没字。\" \"镜子给我看。\" 我把镜子递过去。他没接，只侧过头，就着灯苗看了一眼镜背，点点头：\"镜是眼。\" \"罐子上的纹，你见过了？\" \"见过。\"我说，\"圈足内侧，一深一浅，是刻了又磨的。\" \"罐是口。\" \"锅呢？\" \"锅是肚。\"他抬手，虚虚地朝台心一指，\"你扣着的那口，就是肚。\" 我心里数了数：镜、罐、锅，三样。正要开口，他先说了：\"四样。\" \"哪来的四样？\" \"你自己看。\"他下巴朝我手里一抬，\"契。\" 我把阴契凑到灯苗底下，斜着翻了几个角度。前几次看，那银符都是素面，光溜溜的。可这回，灯苗贴着边角照过去，符牌的右下角，隐隐浮出一道极浅的鱼尾印子—— 不是刻的。是拿模子压的。浅得几乎看不出，只有在灯苗斜着燎过去的时候，才显一显。 我后脊梁上像被人浇了一瓢凉水。 \"压的。\"我声音有点发干，\"跟刻的不一样。\" \"刻的是明账，压的是暗账。\"老头把烟头在石头上按灭，\"镜是眼，罐是口，锅是肚，契是名。四样凑齐了，一个人才算立得住。\" 我把阴契和镜子一样一样收好，手心还是湿的。 \"还有一样。\"我说，\"我们掌柜的让我先来，是把话说全。\" \"说。\" 我就把鹰嘴沟石室里那一晚，捡要紧的说了。五口锅倒扣着，西南空一个位子，第五块素面无字的银符，还有北墙根那只白纸灯笼。我一句一句说，没添没减。 老头一直没插话，等我说完，才慢慢开口：\"五口扣着，缺一口。那缺的一口，就是空出来的那一口。\" \"是消奴部？\" \"是你手里这口。\"他下巴朝台心一抬，\"你们把它从沟里背出来，那个位子就空了。空位子，山记得住。\" 我心里一沉。原来我们取锅那一趟，不是从石室里搬走一样东西，是给那间石室留了个空。 \"那台上这圈印子呢？\"我指了指锅底压着的那道圆印，\"这印子里头，还叠着一圈更浅的。\" \"你看见了。\"他语气平平，\"台上先头扣过一口。比你这口大。\" \"那口锅呢？\" \"走了。\" \"自己走的？\" \"这话，我不说。\"他重新摸出一根烟，凑着灯苗点着，\"锅是死物，谁都能搬。可搬得动它，跟搬得走它，是两码事。\" 我又想起石室缝口他——不，是那个人说过的话。锅是死物，谁都能搬。可眼前这个白头发老头，跟沟里那个缺耳的老头，是不是一个人，我到这会儿也没瞧清。 他始终侧着身，脸埋在灯苗那头的暗里，只露着半边白发。 \"明儿日落，\"他抽了口烟，忽然转了话头，\"我在这台上点一盅灯。\" \"点灯做什么？\" \"灯一离地，名分就过明路。\"他说，\"点灯的来验，吹灯的来夺。谁的名分，谁自己站出来接。\" 我心里一跳：\"您是哪一路的？\" \"我是问灯的。\"他说，\"我问了半辈子。谁想点，我问他想清没有；谁想吹，我问他还记不记得自己姓什么。\" \"那您问我什么？\" 他没答，反问我一句：\"你们掌柜的，什么时候到？\" \"天黑前。\"我说，\"他让我先来，把话听全。\" \"话，我这就说全。\"他把烟在指间转了半圈，\"明儿日落，灯一起，你们掌柜的要是上了台，这笔账就记在他名下；他要是不上，账就落你头上。\" \"落我头上，是多大一笔账？\" \"不大。\"他笑了一下，笑得很淡，\"就是往后这山里的路，你走一条，就记一笔。记满了，山要收，你就得还。\" \"我要是不想认呢？\" \"那你今夜就把锅背下山。\"他抬手往坡下指了指，\"谁也不拦你。锅背走，就当没这回事，山里的账另找日子算。\" \"另找哪个日子？\" \"你问不着。\"他说，\"该来的时候，它自己会来。\" 台子上静了半晌。灯苗在风里缩了一下，又立起来。 \"还有一句。\"我咬了咬牙，把压了一路的话问出来，\"五盏灯，四盏有主。剩那一盏，是给我们掌柜留的？\" 老头抽着烟，没看我：\"你们掌柜的，把账算错了。\" \"哪错了？\" \"数灯，不是数人。\"他说，\"是数名分。人有一个，名分可以有两个；名分有一个，人能换好几个。你们数的是人头，山里数的是名分。\" \"那第五盏——\" \"第五盏，不是没主。\"他把烟头弹进台下的林子里，那点红火划了道弧，灭了，\"是主还没认。名分这东西，得有人拿自己的手，按下去才算。\" 他说完，站起来，把台沿上那盏油灯端起来，往台下走。 \"您这就走？\"我追了两步。 \"天亮前，我得下山。\"他头也没回，\"上了年纪的人，怕日头。\" \"我怎么找您？\" \"不用找。\"他的声音从林子里传上来，已经隔了老远，\"灯在我这儿。灯会开的时候，我自然来。\" 那点灯火在獾子道上晃了两晃，往下沉，沉到林子里去，就看不见了。 我站在原地，盯着他坐过的那块平石头。 石沿上，压着一个摁灭的烟头。烟灰压得扁扁的，烟纸卷得很紧，是拿指头一下一下摁进去的，摁完还在石头上蹭了半圈。 跟沟里缝口那个人掐烟的样子，一模一样。 我站在那儿，心里那点说不清的疑影子，又沉了一层。 我在台上站了很久。锅还扣在台心，锅底的纹冲着天。 天蒙蒙亮的时候，我下到护林道口，借老陈屋里的座机给豆芽仔打了个电话。 电话那头，豆芽仔的声音哑得厉害，像是没睡。 \"哥，\"他头一句话就把我钉住了，\"昨儿后半夜，桓仁老周那铺子，叫人把临街的玻璃砸了。\" \"人没事吧？\" \"人没事，老周躲在里屋，吓了一宿。\"豆芽仔咽了口唾沫，\"玻璃碴子里头，压着一张纸，上头写了一行字——'锅再上山，就别下来了'。\" 我捏着话筒，指节发白。 \"把头呢？\" \"把头昨晚进的桓仁，见了老鼠男，带回来一句话。\"豆芽仔顿了顿，\"他说——'台上那盏灯，让他们点；账，不能认。'\" \"他还说什么？\" \"他说天黑前上到台子上，让你在台上等他。\"豆芽仔的声音发飘，\"哥，你们那边，到底要出什么事啊？\" 我没回答。我把话筒搁回去，走出小屋，站在护林道口，往上看。 半坡上，那片青石台子在晨光里泛着白。台上扣着一口锅，锅底朝天。 灯，让他们点。 账，不能认。 我站在那儿，忽然明白把头这两句话是替我挡的——灯点起来，账记在他名下，认账的是他，不是我。他把我推到台前头，是想让我只做\"认字的\"，不沾那笔账。 可昨夜那个白头发老头说得也明白：账主不上台，账就落认名分的人头上。 明儿日落，把头要是上了台，那笔账，就是他的。"}, {"id": "A5-083", "arc": "A5", "num": 83, "title": "对台", "md": "白天，我们在台上守了一天。\n\n鱼哥把老避龙放出来，让鸡在台边的石头堆上刨食。鸡刨得很自在，我心里那根弦却越绷越紧。锅还扣在台心，锅底朝上，那圈鱼尾纹晒着日头，一深一浅，看得久了，像真有一条鱼在锅底上打盹。\n\n晌午，老陈端着两个苞米面饼子上来。\n\n他把饼子搁在台沿上，蹲下，压低了声音：\"今早天没亮，那个瘦高个又来了。\"\n\n我停下咬饼子的嘴：\"又问你石台怎么走？\"\n\n\"他没问。\"老陈说，\"他在我屋门口站了会儿，问我一句'昨儿后晌上去那俩，下来了没有'。我说不知道。他笑笑，就往獾子道那边去了。\"\n\n\"就他一个人？\"\n\n\"就他一个。\"老陈顿了顿，又补一句，\"还有个事，我是听山底下看山货棚的老李说的。昨儿夜里，棚里少了一小桶煤油。\"\n\n煤油。\n\n我拿着饼子的手一紧，抬头看鱼哥。鱼哥正蹲在台角，拿袖子擦一把匕首，闻言没抬头，只把匕首往鞋帮上一插。\n\n\"大叔，\"我说，\"夜里要是有事，您别上来。\"\n\n\"我一个看林的，\"老陈站起来，拍了拍膝盖上的土，\"你们这伙子人，一看就不是来踏青的。我不问你们干啥，只跟你们说一句——这坡上出事，往我屋退。门不锁。\"\n\n他说完就下去了。\n\n老陈下去以后，我坐不住，顺着护林道下到他那间小屋，想给把头打个电话。\n\n座机摇过去，响了半天，没人接。我又摇豆芽仔的手机号，山里信号飘，接通了也是断断续续，只听见豆芽仔在那一头喊\"哥你说啥\"，喊了三遍，就断了。\n\n我把话筒搁回去，站在屋门口，心里发慌。把头从昨儿进桓仁，到现在没个准信。\n\n鱼哥从台上下来找我，站在门口往山下望：\"他要是出事，早出事了。没出事，就是叫人绊住了脚。\"\n\n\"绊住脚，比出事还麻烦。\"\n\n\"那是。\"鱼哥说，\"出事是明的，绊脚是暗的。暗的，不好防。\"\n\n我们俩又上了台。\n\n后晌日头偏西的时候，来了个戴草帽的。\n\n他从护林道正路上来的，走得不快，草帽压得很低，遮着大半张脸，只露一个下巴和脖子上晒出来的黑。他手里捏着一盏白纸灯笼，没糊完的那种，竹篾骨支着，纸面雪白，在日头底下晃得刺眼。\n\n他在台下站住，没上台，冲台上拱了拱手。\n\n\"掌柜的没来。\"他说，嗓子沙哑，\"我来替人说句话。\"\n\n\"哪一路的话？\"\n\n\"点灯的那一路。\"草帽人把灯笼举了举，\"五盏灯，四盏有了主。剩这一盏，是你们掌柜的名分。灯点起来，五灯归位，山里的账就清了。\"\n\n我心里一动。\n\n清账。他说的，跟昨夜那白头发老头说的不一样。\n\n\"你再说一遍。\"我盯着他，\"灯点起来，账怎么了？\"\n\n\"账就清了。\"草帽人说得笃定，\"名分归位，账自然就勾了。\"\n\n\"谁勾的？\"\n\n\"山勾的。\"\n\n我没接话。把头说过，谈价钱的事归他。可这会儿他不在台上，我只能先把话听全，把两种说法都装在心里。\n\n白头发老头说：账跟着名分走，灯起了，账就落到账主或者认名分的人头上，一笔一笔记着，记满了要还。\n\n草帽人说：灯起了，名分归位，账就勾了。\n\n两句话，各说各的。谁对谁错，眼下分不出。\n\n我心里揣着这两句话，像揣着两块不一样的石头。把头不在，我谁也问不得。可我有一样记得清楚——马渡霜留过话，\"别接灯。灯亮一盏，走一个人\"。守线的人让我点灯，白头发老头让我自己拿主意，吹灯的人让我别点。三张嘴，三种说法。\n\n一个\"灯\"字，把三路人全引到这台子上来了。\n\n\"你手里的灯，\"我指了指那盏白纸灯笼，\"是给我点的？\"\n\n\"灯得您自己点。\"草帽人说，\"我是替您掌灯的。您一点，我就把它撑开，山里的眼睛，才都看得见。\"\n\n\"要是我今夜不点呢？\"\n\n\"那就等下一回。\"草帽人把灯笼往怀里一收，\"灯这东西，不催人。催人的是别的。\"\n\n\"催人的是谁？\"\n\n\"您心里有数。\"草帽人把灯笼往怀里又收了收，\"昨儿后半夜，桓仁老周的铺子叫人砸了。再往前，蜂房叫人泼过油。这些，都不是我们干的。\"\n\n\"你们干的是哪一路？\"\n\n\"我们只点灯。\"他说，\"灯点到哪儿，账勾到哪儿。别的，我们不沾。\"\n\n他这话说得干净，可我听得出来，他嘴上说\"不沾\"，手里那盏灯笼，却一直没离手。\n\n他说完，退到台下林子的边上，找了块石头坐下，把草帽往脸上一压，像一截靠着树桩子打盹的枯柴。\n\n日头一寸一寸往下落。\n\n快擦黑的时候，台下那条獾子道，上来两个人。\n\n前头那个矮得邪乎，走石阶贴着地皮；后头那个瘦高个，颧骨高，一双眼睛又冷又亮。两人在林子边上停住，没上台，隔着十几步，站定了。\n\n瘦高个先开了口。他嗓子不高，字咬得清楚：\n\n\"台上那位背锅的。\"\n\n\"有话说话。\"我站在锅边，没动。\n\n\"那口锅，不是你的。\"他说，\"消奴部早绝了两千年，绝了就是绝了。你从沟里拾一口破锅出来，往台上一扣，就成你的名分了？\"\n\n\"名分是我认的。\"\n\n\"认来的名分，也是偷来的。\"他冷笑了一声，\"偷来的东西，山不认。今夜这台上，就两条道——锅自己滚下去，或者，我替山把它吹了。\"\n\n\"吹\"字他咬得很重。\n\n\"你连我是谁都不知道，就要替山吹锅？\"我说。\n\n\"我知道。\"他看着我，一个字一个字地说，\"你叫项云峰，辽阳人。你那个掌柜的，姓王，道上叫他把头。你们从沈阳那批废铁上，就开始沾这条线了。\"\n\n我后脊梁上的汗，一下子凉透了。\n\n他们不是半路撞上来的。他们是早就跟上了。\n\n我盯着他，想把这张脸记住。颧骨高，眼窝深，嘴角一道旧疤，一看就是常年在山里讨生活的人。可他说的是辽阳话，跟我一个口音。\n\n一个辽阳人，跑到桓仁的山上来替人吹锅。这行当，比盗墓还生僻。\n\n我看了看他身后那个矮个。矮个始终低着头，一只手插在裤兜里，兜里鼓鼓囊囊，装着一件硬东西。两人身上的衣裳下摆，都带着一股子味——煤油味，淡淡的，风一吹就散，可鼻子尖的人闻得出来。\n\n他们不是来说理的。他们是来烧台的。\n\n天，黑透了。\n\n就在这时候，獾子道那头，亮起一点黄。\n\n白头发老头提着那盏没罩子的油灯，一步一步走上来。走到台下，他从那两个人身边过去，看都没看他们一眼，径直上了台，把灯搁在台沿正中。\n\n灯苗很小，却立得笔直。\n\n他坐下，还是侧着身，脸埋在暗里。\n\n\"掌柜呢？\"他问。\n\n\"在路上。\"我说。\n\n\"日头落了。\"\n\n\"路上有事，绊住了。\"\n\n\"绊住他的，不是路。\"老头抽出一根烟，没点，就那么叼着，\"是话。有人拿话把他绊在桓仁了。\"\n\n\"您怎么知道？\"\n\n\"猜的。\"他把烟从嘴上拿下来，\"干这行的人，最怕的不是刀子，是话。刀子伤人，话绊人。\"\n\n我心里\"咯噔\"一下。把头在桓仁见的是老鼠男。是老鼠男绊的他？\n\n\"按规矩，\"老头把烟从嘴上拿下来，\"账主不到台，账就不落他头上。认名分的人，接不接这笔账？\"\n\n台下那瘦高个冷笑：\"他接不了。他一个背锅的，拿什么接？\"\n\n老头没理他，只看着我。草帽人也从林子里站了起来，怀里抱着那盏白纸灯笼。\n\n我张了张嘴，没出声。\n\n接，就是把把头替我挡的那笔账，自己扛过来。\n\n不接，就是当着三路人的面，把这口锅背下山，从此再不提名分。\n\n老头等了片刻，见我不说话，便低下头，凑着那盏油灯，从怀里摸出一根捻子。\n\n\"灯，我替你点着。\"他说，\"接不接账，天亮前，给我句话。\"\n\n火折子凑上去，捻子\"噗\"地一声，着了。\n\n就在灯苗亮起来的那一刹那，我看见两样东西——\n\n台下，草帽人把手里的白纸灯笼撑开了，白纸在风里鼓成一个圆；獾子道那头，瘦高个从怀里摸出一只洋铁皮的小桶，桶沿上，沾着一层亮亮的油。\n\n灯苗立着，风在台下打转。\n\n我忽然明白过来——今夜这台子上，谁都不是来看灯的。", "words": 2848, "html": "<p>白天，我们在台上守了一天。<\/p>\n<p>鱼哥把老避龙放出来，让鸡在台边的石头堆上刨食。鸡刨得很自在，我心里那根弦却越绷越紧。锅还扣在台心，锅底朝上，那圈鱼尾纹晒着日头，一深一浅，看得久了，像真有一条鱼在锅底上打盹。<\/p>\n<p>晌午，老陈端着两个苞米面饼子上来。<\/p>\n<p>他把饼子搁在台沿上，蹲下，压低了声音：\"今早天没亮，那个瘦高个又来了。\"<\/p>\n<p>我停下咬饼子的嘴：\"又问你石台怎么走？\"<\/p>\n<p>\"他没问。\"老陈说，\"他在我屋门口站了会儿，问我一句'昨儿后晌上去那俩，下来了没有'。我说不知道。他笑笑，就往獾子道那边去了。\"<\/p>\n<p>\"就他一个人？\"<\/p>\n<p>\"就他一个。\"老陈顿了顿，又补一句，\"还有个事，我是听山底下看山货棚的老李说的。昨儿夜里，棚里少了一小桶煤油。\"<\/p>\n<p>煤油。<\/p>\n<p>我拿着饼子的手一紧，抬头看鱼哥。鱼哥正蹲在台角，拿袖子擦一把匕首，闻言没抬头，只把匕首往鞋帮上一插。<\/p>\n<p>\"大叔，\"我说，\"夜里要是有事，您别上来。\"<\/p>\n<p>\"我一个看林的，\"老陈站起来，拍了拍膝盖上的土，\"你们这伙子人，一看就不是来踏青的。我不问你们干啥，只跟你们说一句——这坡上出事，往我屋退。门不锁。\"<\/p>\n<p>他说完就下去了。<\/p>\n<p>老陈下去以后，我坐不住，顺着护林道下到他那间小屋，想给把头打个电话。<\/p>\n<p>座机摇过去，响了半天，没人接。我又摇豆芽仔的手机号，山里信号飘，接通了也是断断续续，只听见豆芽仔在那一头喊\"哥你说啥\"，喊了三遍，就断了。<\/p>\n<p>我把话筒搁回去，站在屋门口，心里发慌。把头从昨儿进桓仁，到现在没个准信。<\/p>\n<p>鱼哥从台上下来找我，站在门口往山下望：\"他要是出事，早出事了。没出事，就是叫人绊住了脚。\"<\/p>\n<p>\"绊住脚，比出事还麻烦。\"<\/p>\n<p>\"那是。\"鱼哥说，\"出事是明的，绊脚是暗的。暗的，不好防。\"<\/p>\n<p>我们俩又上了台。<\/p>\n<p>后晌日头偏西的时候，来了个戴草帽的。<\/p>\n<p>他从护林道正路上来的，走得不快，草帽压得很低，遮着大半张脸，只露一个下巴和脖子上晒出来的黑。他手里捏着一盏白纸灯笼，没糊完的那种，竹篾骨支着，纸面雪白，在日头底下晃得刺眼。<\/p>\n<p>他在台下站住，没上台，冲台上拱了拱手。<\/p>\n<p>\"掌柜的没来。\"他说，嗓子沙哑，\"我来替人说句话。\"<\/p>\n<p>\"哪一路的话？\"<\/p>\n<p>\"点灯的那一路。\"草帽人把灯笼举了举，\"五盏灯，四盏有了主。剩这一盏，是你们掌柜的名分。灯点起来，五灯归位，山里的账就清了。\"<\/p>\n<p>我心里一动。<\/p>\n<p>清账。他说的，跟昨夜那白头发老头说的不一样。<\/p>\n<p>\"你再说一遍。\"我盯着他，\"灯点起来，账怎么了？\"<\/p>\n<p>\"账就清了。\"草帽人说得笃定，\"名分归位，账自然就勾了。\"<\/p>\n<p>\"谁勾的？\"<\/p>\n<p>\"山勾的。\"<\/p>\n<p>我没接话。把头说过，谈价钱的事归他。可这会儿他不在台上，我只能先把话听全，把两种说法都装在心里。<\/p>\n<p>白头发老头说：账跟着名分走，灯起了，账就落到账主或者认名分的人头上，一笔一笔记着，记满了要还。<\/p>\n<p>草帽人说：灯起了，名分归位，账就勾了。<\/p>\n<p>两句话，各说各的。谁对谁错，眼下分不出。<\/p>\n<p>我心里揣着这两句话，像揣着两块不一样的石头。把头不在，我谁也问不得。可我有一样记得清楚——马渡霜留过话，\"别接灯。灯亮一盏，走一个人\"。守线的人让我点灯，白头发老头让我自己拿主意，吹灯的人让我别点。三张嘴，三种说法。<\/p>\n<p>一个\"灯\"字，把三路人全引到这台子上来了。<\/p>\n<p>\"你手里的灯，\"我指了指那盏白纸灯笼，\"是给我点的？\"<\/p>\n<p>\"灯得您自己点。\"草帽人说，\"我是替您掌灯的。您一点，我就把它撑开，山里的眼睛，才都看得见。\"<\/p>\n<p>\"要是我今夜不点呢？\"<\/p>\n<p>\"那就等下一回。\"草帽人把灯笼往怀里一收，\"灯这东西，不催人。催人的是别的。\"<\/p>\n<p>\"催人的是谁？\"<\/p>\n<p>\"您心里有数。\"草帽人把灯笼往怀里又收了收，\"昨儿后半夜，桓仁老周的铺子叫人砸了。再往前，蜂房叫人泼过油。这些，都不是我们干的。\"<\/p>\n<p>\"你们干的是哪一路？\"<\/p>\n<p>\"我们只点灯。\"他说，\"灯点到哪儿，账勾到哪儿。别的，我们不沾。\"<\/p>\n<p>他这话说得干净，可我听得出来，他嘴上说\"不沾\"，手里那盏灯笼，却一直没离手。<\/p>\n<p>他说完，退到台下林子的边上，找了块石头坐下，把草帽往脸上一压，像一截靠着树桩子打盹的枯柴。<\/p>\n<p>日头一寸一寸往下落。<\/p>\n<p>快擦黑的时候，台下那条獾子道，上来两个人。<\/p>\n<p>前头那个矮得邪乎，走石阶贴着地皮；后头那个瘦高个，颧骨高，一双眼睛又冷又亮。两人在林子边上停住，没上台，隔着十几步，站定了。<\/p>\n<p>瘦高个先开了口。他嗓子不高，字咬得清楚：<\/p>\n<p>\"台上那位背锅的。\"<\/p>\n<p>\"有话说话。\"我站在锅边，没动。<\/p>\n<p>\"那口锅，不是你的。\"他说，\"消奴部早绝了两千年，绝了就是绝了。你从沟里拾一口破锅出来，往台上一扣，就成你的名分了？\"<\/p>\n<p>\"名分是我认的。\"<\/p>\n<p>\"认来的名分，也是偷来的。\"他冷笑了一声，\"偷来的东西，山不认。今夜这台上，就两条道——锅自己滚下去，或者，我替山把它吹了。\"<\/p>\n<p>\"吹\"字他咬得很重。<\/p>\n<p>\"你连我是谁都不知道，就要替山吹锅？\"我说。<\/p>\n<p>\"我知道。\"他看着我，一个字一个字地说，\"你叫项云峰，辽阳人。你那个掌柜的，姓王，道上叫他把头。你们从沈阳那批废铁上，就开始沾这条线了。\"<\/p>\n<p>我后脊梁上的汗，一下子凉透了。<\/p>\n<p>他们不是半路撞上来的。他们是早就跟上了。<\/p>\n<p>我盯着他，想把这张脸记住。颧骨高，眼窝深，嘴角一道旧疤，一看就是常年在山里讨生活的人。可他说的是辽阳话，跟我一个口音。<\/p>\n<p>一个辽阳人，跑到桓仁的山上来替人吹锅。这行当，比盗墓还生僻。<\/p>\n<p>我看了看他身后那个矮个。矮个始终低着头，一只手插在裤兜里，兜里鼓鼓囊囊，装着一件硬东西。两人身上的衣裳下摆，都带着一股子味——煤油味，淡淡的，风一吹就散，可鼻子尖的人闻得出来。<\/p>\n<p>他们不是来说理的。他们是来烧台的。<\/p>\n<p>天，黑透了。<\/p>\n<p>就在这时候，獾子道那头，亮起一点黄。<\/p>\n<p>白头发老头提着那盏没罩子的油灯，一步一步走上来。走到台下，他从那两个人身边过去，看都没看他们一眼，径直上了台，把灯搁在台沿正中。<\/p>\n<p>灯苗很小，却立得笔直。<\/p>\n<p>他坐下，还是侧着身，脸埋在暗里。<\/p>\n<p>\"掌柜呢？\"他问。<\/p>\n<p>\"在路上。\"我说。<\/p>\n<p>\"日头落了。\"<\/p>\n<p>\"路上有事，绊住了。\"<\/p>\n<p>\"绊住他的，不是路。\"老头抽出一根烟，没点，就那么叼着，\"是话。有人拿话把他绊在桓仁了。\"<\/p>\n<p>\"您怎么知道？\"<\/p>\n<p>\"猜的。\"他把烟从嘴上拿下来，\"干这行的人，最怕的不是刀子，是话。刀子伤人，话绊人。\"<\/p>\n<p>我心里\"咯噔\"一下。把头在桓仁见的是老鼠男。是老鼠男绊的他？<\/p>\n<p>\"按规矩，\"老头把烟从嘴上拿下来，\"账主不到台，账就不落他头上。认名分的人，接不接这笔账？\"<\/p>\n<p>台下那瘦高个冷笑：\"他接不了。他一个背锅的，拿什么接？\"<\/p>\n<p>老头没理他，只看着我。草帽人也从林子里站了起来，怀里抱着那盏白纸灯笼。<\/p>\n<p>我张了张嘴，没出声。<\/p>\n<p>接，就是把把头替我挡的那笔账，自己扛过来。<\/p>\n<p>不接，就是当着三路人的面，把这口锅背下山，从此再不提名分。<\/p>\n<p>老头等了片刻，见我不说话，便低下头，凑着那盏油灯，从怀里摸出一根捻子。<\/p>\n<p>\"灯，我替你点着。\"他说，\"接不接账，天亮前，给我句话。\"<\/p>\n<p>火折子凑上去，捻子\"噗\"地一声，着了。<\/p>\n<p>就在灯苗亮起来的那一刹那，我看见两样东西——<\/p>\n<p>台下，草帽人把手里的白纸灯笼撑开了，白纸在风里鼓成一个圆；獾子道那头，瘦高个从怀里摸出一只洋铁皮的小桶，桶沿上，沾着一层亮亮的油。<\/p>\n<p>灯苗立着，风在台下打转。<\/p>\n<p>我忽然明白过来——今夜这台子上，谁都不是来看灯的。<\/p>", "plain": "白天，我们在台上守了一天。 鱼哥把老避龙放出来，让鸡在台边的石头堆上刨食。鸡刨得很自在，我心里那根弦却越绷越紧。锅还扣在台心，锅底朝上，那圈鱼尾纹晒着日头，一深一浅，看得久了，像真有一条鱼在锅底上打盹。 晌午，老陈端着两个苞米面饼子上来。 他把饼子搁在台沿上，蹲下，压低了声音：\"今早天没亮，那个瘦高个又来了。\" 我停下咬饼子的嘴：\"又问你石台怎么走？\" \"他没问。\"老陈说，\"他在我屋门口站了会儿，问我一句'昨儿后晌上去那俩，下来了没有'。我说不知道。他笑笑，就往獾子道那边去了。\" \"就他一个人？\" \"就他一个。\"老陈顿了顿，又补一句，\"还有个事，我是听山底下看山货棚的老李说的。昨儿夜里，棚里少了一小桶煤油。\" 煤油。 我拿着饼子的手一紧，抬头看鱼哥。鱼哥正蹲在台角，拿袖子擦一把匕首，闻言没抬头，只把匕首往鞋帮上一插。 \"大叔，\"我说，\"夜里要是有事，您别上来。\" \"我一个看林的，\"老陈站起来，拍了拍膝盖上的土，\"你们这伙子人，一看就不是来踏青的。我不问你们干啥，只跟你们说一句——这坡上出事，往我屋退。门不锁。\" 他说完就下去了。 老陈下去以后，我坐不住，顺着护林道下到他那间小屋，想给把头打个电话。 座机摇过去，响了半天，没人接。我又摇豆芽仔的手机号，山里信号飘，接通了也是断断续续，只听见豆芽仔在那一头喊\"哥你说啥\"，喊了三遍，就断了。 我把话筒搁回去，站在屋门口，心里发慌。把头从昨儿进桓仁，到现在没个准信。 鱼哥从台上下来找我，站在门口往山下望：\"他要是出事，早出事了。没出事，就是叫人绊住了脚。\" \"绊住脚，比出事还麻烦。\" \"那是。\"鱼哥说，\"出事是明的，绊脚是暗的。暗的，不好防。\" 我们俩又上了台。 后晌日头偏西的时候，来了个戴草帽的。 他从护林道正路上来的，走得不快，草帽压得很低，遮着大半张脸，只露一个下巴和脖子上晒出来的黑。他手里捏着一盏白纸灯笼，没糊完的那种，竹篾骨支着，纸面雪白，在日头底下晃得刺眼。 他在台下站住，没上台，冲台上拱了拱手。 \"掌柜的没来。\"他说，嗓子沙哑，\"我来替人说句话。\" \"哪一路的话？\" \"点灯的那一路。\"草帽人把灯笼举了举，\"五盏灯，四盏有了主。剩这一盏，是你们掌柜的名分。灯点起来，五灯归位，山里的账就清了。\" 我心里一动。 清账。他说的，跟昨夜那白头发老头说的不一样。 \"你再说一遍。\"我盯着他，\"灯点起来，账怎么了？\" \"账就清了。\"草帽人说得笃定，\"名分归位，账自然就勾了。\" \"谁勾的？\" \"山勾的。\" 我没接话。把头说过，谈价钱的事归他。可这会儿他不在台上，我只能先把话听全，把两种说法都装在心里。 白头发老头说：账跟着名分走，灯起了，账就落到账主或者认名分的人头上，一笔一笔记着，记满了要还。 草帽人说：灯起了，名分归位，账就勾了。 两句话，各说各的。谁对谁错，眼下分不出。 我心里揣着这两句话，像揣着两块不一样的石头。把头不在，我谁也问不得。可我有一样记得清楚——马渡霜留过话，\"别接灯。灯亮一盏，走一个人\"。守线的人让我点灯，白头发老头让我自己拿主意，吹灯的人让我别点。三张嘴，三种说法。 一个\"灯\"字，把三路人全引到这台子上来了。 \"你手里的灯，\"我指了指那盏白纸灯笼，\"是给我点的？\" \"灯得您自己点。\"草帽人说，\"我是替您掌灯的。您一点，我就把它撑开，山里的眼睛，才都看得见。\" \"要是我今夜不点呢？\" \"那就等下一回。\"草帽人把灯笼往怀里一收，\"灯这东西，不催人。催人的是别的。\" \"催人的是谁？\" \"您心里有数。\"草帽人把灯笼往怀里又收了收，\"昨儿后半夜，桓仁老周的铺子叫人砸了。再往前，蜂房叫人泼过油。这些，都不是我们干的。\" \"你们干的是哪一路？\" \"我们只点灯。\"他说，\"灯点到哪儿，账勾到哪儿。别的，我们不沾。\" 他这话说得干净，可我听得出来，他嘴上说\"不沾\"，手里那盏灯笼，却一直没离手。 他说完，退到台下林子的边上，找了块石头坐下，把草帽往脸上一压，像一截靠着树桩子打盹的枯柴。 日头一寸一寸往下落。 快擦黑的时候，台下那条獾子道，上来两个人。 前头那个矮得邪乎，走石阶贴着地皮；后头那个瘦高个，颧骨高，一双眼睛又冷又亮。两人在林子边上停住，没上台，隔着十几步，站定了。 瘦高个先开了口。他嗓子不高，字咬得清楚： \"台上那位背锅的。\" \"有话说话。\"我站在锅边，没动。 \"那口锅，不是你的。\"他说，\"消奴部早绝了两千年，绝了就是绝了。你从沟里拾一口破锅出来，往台上一扣，就成你的名分了？\" \"名分是我认的。\" \"认来的名分，也是偷来的。\"他冷笑了一声，\"偷来的东西，山不认。今夜这台上，就两条道——锅自己滚下去，或者，我替山把它吹了。\" \"吹\"字他咬得很重。 \"你连我是谁都不知道，就要替山吹锅？\"我说。 \"我知道。\"他看着我，一个字一个字地说，\"你叫项云峰，辽阳人。你那个掌柜的，姓王，道上叫他把头。你们从沈阳那批废铁上，就开始沾这条线了。\" 我后脊梁上的汗，一下子凉透了。 他们不是半路撞上来的。他们是早就跟上了。 我盯着他，想把这张脸记住。颧骨高，眼窝深，嘴角一道旧疤，一看就是常年在山里讨生活的人。可他说的是辽阳话，跟我一个口音。 一个辽阳人，跑到桓仁的山上来替人吹锅。这行当，比盗墓还生僻。 我看了看他身后那个矮个。矮个始终低着头，一只手插在裤兜里，兜里鼓鼓囊囊，装着一件硬东西。两人身上的衣裳下摆，都带着一股子味——煤油味，淡淡的，风一吹就散，可鼻子尖的人闻得出来。 他们不是来说理的。他们是来烧台的。 天，黑透了。 就在这时候，獾子道那头，亮起一点黄。 白头发老头提着那盏没罩子的油灯，一步一步走上来。走到台下，他从那两个人身边过去，看都没看他们一眼，径直上了台，把灯搁在台沿正中。 灯苗很小，却立得笔直。 他坐下，还是侧着身，脸埋在暗里。 \"掌柜呢？\"他问。 \"在路上。\"我说。 \"日头落了。\" \"路上有事，绊住了。\" \"绊住他的，不是路。\"老头抽出一根烟，没点，就那么叼着，\"是话。有人拿话把他绊在桓仁了。\" \"您怎么知道？\" \"猜的。\"他把烟从嘴上拿下来，\"干这行的人，最怕的不是刀子，是话。刀子伤人，话绊人。\" 我心里\"咯噔\"一下。把头在桓仁见的是老鼠男。是老鼠男绊的他？ \"按规矩，\"老头把烟从嘴上拿下来，\"账主不到台，账就不落他头上。认名分的人，接不接这笔账？\" 台下那瘦高个冷笑：\"他接不了。他一个背锅的，拿什么接？\" 老头没理他，只看着我。草帽人也从林子里站了起来，怀里抱着那盏白纸灯笼。 我张了张嘴，没出声。 接，就是把把头替我挡的那笔账，自己扛过来。 不接，就是当着三路人的面，把这口锅背下山，从此再不提名分。 老头等了片刻，见我不说话，便低下头，凑着那盏油灯，从怀里摸出一根捻子。 \"灯，我替你点着。\"他说，\"接不接账，天亮前，给我句话。\" 火折子凑上去，捻子\"噗\"地一声，着了。 就在灯苗亮起来的那一刹那，我看见两样东西—— 台下，草帽人把手里的白纸灯笼撑开了，白纸在风里鼓成一个圆；獾子道那头，瘦高个从怀里摸出一只洋铁皮的小桶，桶沿上，沾着一层亮亮的油。 灯苗立着，风在台下打转。 我忽然明白过来——今夜这台子上，谁都不是来看灯的。"}, {"id": "A5-084", "arc": "A5", "num": 84, "title": "过火", "md": "那桶煤油泼过来的时候，鱼哥先动的。\n\n瘦高个扬手的动作还没做完，鱼哥已经从我身边蹿了出去，一脚踹在他拿桶的那条胳膊上。铁皮桶飞出去，在半空翻了个个儿，油没泼到台上，泼了半台子外的碎石，哗啦一声，一股呛人的煤油味腾起来。\n\n矮个紧跟着扑上台，直奔台心的锅。\n\n他个子矮，可快得像只狸子，一只手插在裤兜里，另一只已经按在了锅沿上。\n\n我扑过去，一把抱住那口锅。\n\n他的胳膊肘撞在我肩窝上，闷闷一下，眼前直冒金星。我抱着锅不撒手，脚底下一滑，连人带锅往台边滚。他大概没料到我不躲不闪，愣了一下，伸手来掰我的手——那手跟铁钳子似的，我手背上的皮\"嘶\"地就开了。\n\n血珠子一颗一颗冒出来，我顾不上。矮个的另一只手去掀锅沿，我拿肩膀顶住他，两人在台心那块青石上扭成一团。他个子矮，力气却邪乎，膝盖一顶，把我整个人顶得离了地。我抱着锅不撒手，任他把我摔在台上，后脑勺磕在石头上，\"嗡\"的一声，眼前白了一片。\n\n\"松手！\"他嗓子又哑又急。\n\n\"不松。\"\n\n台边上，鱼哥已经跟瘦高个扭在了一处。那瘦高个看着瘦，劲却不小，两人滚在碎石堆里，谁也没占着便宜。鱼哥背上的旧伤被压了一下，闷哼了一声，可手底下没松，一记横肘砸在对方脸上，把瘦高个砸得往后一仰。\n\n瘦高个捂着鼻子，血从指缝里淌下来。他笑了一声，从腰后摸出一把扁扁的撬棍。鱼哥没等他抬起来，抬脚一踹，正踹在他手腕上，撬棍\"当啷\"滚到台下。两人又扭在碎石堆里，滚得一身土。\n\n布兜里的老避龙炸了毛，扑棱棱从兜里挣出来，在台边又扑又叫。\n\n\"台上有人点灯了——\"\n\n草帽人不知什么时候站到了台口，把那盏白纸灯笼高高举起来。白纸灯笼透着一圈暖黄的光，风一吹，晃晃悠悠，却始终没灭。他扯着嗓子喊：\n\n\"山里的眼睛，都看着呢！\"\n\n矮个的手顿了一下。\n\n就这一下，我把锅往怀里一揽，翻身坐起来，背抵着台沿，把锅护在身后。他站在我面前，胸口一起一伏，一双眼睛死死盯着我，盯着我怀里那口锅。\n\n\"你个背锅的，\"他从牙缝里挤出一句，\"命都不要了？\"\n\n我没答话。肩窝那块被他撞的地方，一阵一阵往外冒疼，手背上血顺着指缝往下淌，滴在青石台上，一滴一滴，洇开成小小的黑点。\n\n矮个盯着那几滴血，忽然压着嗓子骂了一句：\"早两年，我就该把这口破锅砸了。\"\n\n我心里一动。两年前，正是五进两出的那一年。\n\n他这话说得没头没尾，可我心里那根弦\"嗡\"地一下绷紧了。五进两出，两年前，一伙人进了鹰嘴沟，只出来一个。这口锅，就是打那回起，才在道上有了名。\n\n矮个没再往下说，只是死死盯着我怀里的锅，像是要把锅看穿。\n\n台底下，瘦高个喊了一声：\"别跟他磨！掀锅！\"\n\n瘦高个从碎石堆里爬起来，抹了一把嘴角的血，走到台前，看着那口锅，忽然笑了。\n\n\"好。\"他说，\"好一个背锅的。\"\n\n他往前一步。\n\n白头发老头动了。\n\n他一直坐在台沿那块平石头上，从我抱锅到这会儿，一动没动，像一截长在石头上的树桩。这会儿他伸出手，把那盏油灯往台心挪了挪，灯苗\"腾\"地往上跳了一下，把台子照得亮堂了些。瘦高个的影子被拉得老长，铺在台口，他一脚踩进去，像踩进一摊黑水，脚下就停住了。\n\n\"这锅，\"他开口，声音不高，却把台下的动静全压住了，\"有主了。\"\n\n瘦高个的脚步停住。\n\n\"它没认。\"他指着锅，\"认名分的还没认账。无主的锅，山不管。\"\n\n\"他抱着呢。\"老头抬了抬下巴，冲我，\"你问他认不认。\"\n\n三路人，六只眼睛，全落到我身上。\n\n台沿上那盏灯苗，把白头发老头的半边脸照出来，又埋进暗里。我到现在也没看清他的耳朵。\n\n我低下头，看怀里那口锅。\n\n锅底冲着地，锅口冲着我。陶胎上还有没擦净的灰。这口锅从鹰嘴沟的石室里出来，跟我走过雨夜，走过石缝，藏过炭窑，埋过偏屋，又让我背着爬了半座五女山。它不是我的，可它认我的手。它认了我认下的那个名分。\n\n王长顺临死前说，爹，锅是空的。\n\n锅是空的，可空锅也得有人背。\n\n\"认。\"我说。\n\n就一个字。\n\n瘦高个脸上的笑僵住了。\n\n\"你说什么？\"\n\n\"我说，账，我认。\"我抬起头，一字一顿，\"灯点起来，名分过明路。这笔账，从今夜起，落我头上。跟我们掌柜的，没关系了。\"\n\n台下静了。\n\n矮个回头去看瘦高个。草帽人举着的灯笼，光晃了一下。鱼哥从碎石堆里站起来，一瘸一拐走到我身边，没说话，就站在我旁边。\n\n我扶着锅站起来，腿肚子发软，后脑勺磕的那块，一阵一阵地跳。可我心里那口气，反倒顺了。\n\n从今往后，这笔账是我的了。我不再是替人背锅的那个，我是这口锅的主。\n\n这话我没说出口，只在心里过了一遍。可过完这一遍，我后背上的汗，反倒干了。\n\n人这一辈子，怕的不是担事，是不知道自己担的是什么事。这会儿我知道了。\n\n台上那盏灯，火苗小小的，照着锅，也照着我。\n\n白头发老头慢慢站起来，走到我面前，低头看了看我护着的那口锅，又看了看我手背上的血。\n\n\"认账的人，\"他说，\"山记得住。\"\n\n他从怀里摸出一样东西，蹲下身，放在台心那盏灯旁边。\n\n是一根捻好的灯芯。白棉线搓的，搓得很紧，绕成一圈，压在一块叠得方方正正的布上。那布是灰的，布角上，补着一小块蓝——\n\n细针脚。一针压着一针，齐得跟拿尺子量过。\n\n我心里\"轰\"地一下。\n\n蜂房炕洞里的铁盒，沟里石室北墙的红布条，老周铺子里那个白头发瘦子的袖口——一样的针脚，一样的蓝。\n\n\"这布，\"我嗓子发干，\"是从哪儿来的？\"\n\n老头没答，只把布往我这边推了推：\"拿着。线头在谁手里，谁就得把线接下去。\"\n\n\"这芯子，我替你捻好了。\"老头说，\"点不点，什么时候点，在你——不在我，也不在那些吹灯的。\"\n\n瘦高个盯着台上，脸上的肉抽了抽。\n\n\"行。\"他退了一步，又退了一步，\"账你认了，好。这笔账，往后就找你要。我等的，就是这一天。\"\n\n他转过身，冲矮个使了个眼色。矮个从台边退开，两人一前一后，顺着獾子道往下走。走了几步，瘦高个回过头，冲台上啐了一口：\n\n\"锅给你留着。账，也给你留着。你背得动锅，未必背得动账。\"\n\n脚步声顺着石阶往下，越走越远，最后化进了林子里。\n\n台上只剩我们三个，还有那盏灯。\n\n草帽人把白纸灯笼收了，冲台上拱了拱手，也退下护林道去了。\n\n他走得很快，白纸灯笼夹在腋下，一晃一晃的，像一只没点着的眼睛。\n\n我冲他背影喊了一声：\"替我谢你们那一路。\"\n\n他没回头，只摆了摆手。\n\n台子上安静下来，只剩风声和林子。\n\n鱼哥低头看了看我手背上的布条，说了一句：\"回去得打破伤风。\"\n\n\"山里哪来的破伤风针。\"我说。\n\n\"那就下山打。\"他把匕首插回鞋帮上，\"这口锅，往后还得你背着。手废了，锅就没人背了。\"\n\n我笑了一下，扯得肩窝生疼。\n\n鱼哥扯了衣裳下摆，给我把手背缠上，缠到一半，忽然停住，抬下巴朝那盏灯努了努嘴。\n\n我顺着看过去。\n\n风是从沟里往上灌的，从台子底下往北坡上吹。台上那棵歪脖老榆的枝条，被吹得哗哗响；台沿上的灰土，一阵一阵往北飘。\n\n可那盏灯的火苗，不往北倒。\n\n它歪着，斜斜地，朝着台心那口锅的方向，直直地倾过去。\n\n灯没动，风没停。\n\n我盯着那点火苗，盯了很久。\n\n它不是被风吹歪的。它是自己朝那口锅，倾过去的。\n\n台下的林子黑沉沉的，风从沟底往上卷，一阵比一阵紧。远处，五女山的崖壁在夜色里立着，像一堵没有门的墙。\n\n我忽然想起老陈说过的话——那老头坐过的石头，雨停了还是干的。\n\n有些事，从今夜起，我怕是躲不开了。", "words": 2834, "html": "<p>那桶煤油泼过来的时候，鱼哥先动的。<\/p>\n<p>瘦高个扬手的动作还没做完，鱼哥已经从我身边蹿了出去，一脚踹在他拿桶的那条胳膊上。铁皮桶飞出去，在半空翻了个个儿，油没泼到台上，泼了半台子外的碎石，哗啦一声，一股呛人的煤油味腾起来。<\/p>\n<p>矮个紧跟着扑上台，直奔台心的锅。<\/p>\n<p>他个子矮，可快得像只狸子，一只手插在裤兜里，另一只已经按在了锅沿上。<\/p>\n<p>我扑过去，一把抱住那口锅。<\/p>\n<p>他的胳膊肘撞在我肩窝上，闷闷一下，眼前直冒金星。我抱着锅不撒手，脚底下一滑，连人带锅往台边滚。他大概没料到我不躲不闪，愣了一下，伸手来掰我的手——那手跟铁钳子似的，我手背上的皮\"嘶\"地就开了。<\/p>\n<p>血珠子一颗一颗冒出来，我顾不上。矮个的另一只手去掀锅沿，我拿肩膀顶住他，两人在台心那块青石上扭成一团。他个子矮，力气却邪乎，膝盖一顶，把我整个人顶得离了地。我抱着锅不撒手，任他把我摔在台上，后脑勺磕在石头上，\"嗡\"的一声，眼前白了一片。<\/p>\n<p>\"松手！\"他嗓子又哑又急。<\/p>\n<p>\"不松。\"<\/p>\n<p>台边上，鱼哥已经跟瘦高个扭在了一处。那瘦高个看着瘦，劲却不小，两人滚在碎石堆里，谁也没占着便宜。鱼哥背上的旧伤被压了一下，闷哼了一声，可手底下没松，一记横肘砸在对方脸上，把瘦高个砸得往后一仰。<\/p>\n<p>瘦高个捂着鼻子，血从指缝里淌下来。他笑了一声，从腰后摸出一把扁扁的撬棍。鱼哥没等他抬起来，抬脚一踹，正踹在他手腕上，撬棍\"当啷\"滚到台下。两人又扭在碎石堆里，滚得一身土。<\/p>\n<p>布兜里的老避龙炸了毛，扑棱棱从兜里挣出来，在台边又扑又叫。<\/p>\n<p>\"台上有人点灯了——\"<\/p>\n<p>草帽人不知什么时候站到了台口，把那盏白纸灯笼高高举起来。白纸灯笼透着一圈暖黄的光，风一吹，晃晃悠悠，却始终没灭。他扯着嗓子喊：<\/p>\n<p>\"山里的眼睛，都看着呢！\"<\/p>\n<p>矮个的手顿了一下。<\/p>\n<p>就这一下，我把锅往怀里一揽，翻身坐起来，背抵着台沿，把锅护在身后。他站在我面前，胸口一起一伏，一双眼睛死死盯着我，盯着我怀里那口锅。<\/p>\n<p>\"你个背锅的，\"他从牙缝里挤出一句，\"命都不要了？\"<\/p>\n<p>我没答话。肩窝那块被他撞的地方，一阵一阵往外冒疼，手背上血顺着指缝往下淌，滴在青石台上，一滴一滴，洇开成小小的黑点。<\/p>\n<p>矮个盯着那几滴血，忽然压着嗓子骂了一句：\"早两年，我就该把这口破锅砸了。\"<\/p>\n<p>我心里一动。两年前，正是五进两出的那一年。<\/p>\n<p>他这话说得没头没尾，可我心里那根弦\"嗡\"地一下绷紧了。五进两出，两年前，一伙人进了鹰嘴沟，只出来一个。这口锅，就是打那回起，才在道上有了名。<\/p>\n<p>矮个没再往下说，只是死死盯着我怀里的锅，像是要把锅看穿。<\/p>\n<p>台底下，瘦高个喊了一声：\"别跟他磨！掀锅！\"<\/p>\n<p>瘦高个从碎石堆里爬起来，抹了一把嘴角的血，走到台前，看着那口锅，忽然笑了。<\/p>\n<p>\"好。\"他说，\"好一个背锅的。\"<\/p>\n<p>他往前一步。<\/p>\n<p>白头发老头动了。<\/p>\n<p>他一直坐在台沿那块平石头上，从我抱锅到这会儿，一动没动，像一截长在石头上的树桩。这会儿他伸出手，把那盏油灯往台心挪了挪，灯苗\"腾\"地往上跳了一下，把台子照得亮堂了些。瘦高个的影子被拉得老长，铺在台口，他一脚踩进去，像踩进一摊黑水，脚下就停住了。<\/p>\n<p>\"这锅，\"他开口，声音不高，却把台下的动静全压住了，\"有主了。\"<\/p>\n<p>瘦高个的脚步停住。<\/p>\n<p>\"它没认。\"他指着锅，\"认名分的还没认账。无主的锅，山不管。\"<\/p>\n<p>\"他抱着呢。\"老头抬了抬下巴，冲我，\"你问他认不认。\"<\/p>\n<p>三路人，六只眼睛，全落到我身上。<\/p>\n<p>台沿上那盏灯苗，把白头发老头的半边脸照出来，又埋进暗里。我到现在也没看清他的耳朵。<\/p>\n<p>我低下头，看怀里那口锅。<\/p>\n<p>锅底冲着地，锅口冲着我。陶胎上还有没擦净的灰。这口锅从鹰嘴沟的石室里出来，跟我走过雨夜，走过石缝，藏过炭窑，埋过偏屋，又让我背着爬了半座五女山。它不是我的，可它认我的手。它认了我认下的那个名分。<\/p>\n<p>王长顺临死前说，爹，锅是空的。<\/p>\n<p>锅是空的，可空锅也得有人背。<\/p>\n<p>\"认。\"我说。<\/p>\n<p>就一个字。<\/p>\n<p>瘦高个脸上的笑僵住了。<\/p>\n<p>\"你说什么？\"<\/p>\n<p>\"我说，账，我认。\"我抬起头，一字一顿，\"灯点起来，名分过明路。这笔账，从今夜起，落我头上。跟我们掌柜的，没关系了。\"<\/p>\n<p>台下静了。<\/p>\n<p>矮个回头去看瘦高个。草帽人举着的灯笼，光晃了一下。鱼哥从碎石堆里站起来，一瘸一拐走到我身边，没说话，就站在我旁边。<\/p>\n<p>我扶着锅站起来，腿肚子发软，后脑勺磕的那块，一阵一阵地跳。可我心里那口气，反倒顺了。<\/p>\n<p>从今往后，这笔账是我的了。我不再是替人背锅的那个，我是这口锅的主。<\/p>\n<p>这话我没说出口，只在心里过了一遍。可过完这一遍，我后背上的汗，反倒干了。<\/p>\n<p>人这一辈子，怕的不是担事，是不知道自己担的是什么事。这会儿我知道了。<\/p>\n<p>台上那盏灯，火苗小小的，照着锅，也照着我。<\/p>\n<p>白头发老头慢慢站起来，走到我面前，低头看了看我护着的那口锅，又看了看我手背上的血。<\/p>\n<p>\"认账的人，\"他说，\"山记得住。\"<\/p>\n<p>他从怀里摸出一样东西，蹲下身，放在台心那盏灯旁边。<\/p>\n<p>是一根捻好的灯芯。白棉线搓的，搓得很紧，绕成一圈，压在一块叠得方方正正的布上。那布是灰的，布角上，补着一小块蓝——<\/p>\n<p>细针脚。一针压着一针，齐得跟拿尺子量过。<\/p>\n<p>我心里\"轰\"地一下。<\/p>\n<p>蜂房炕洞里的铁盒，沟里石室北墙的红布条，老周铺子里那个白头发瘦子的袖口——一样的针脚，一样的蓝。<\/p>\n<p>\"这布，\"我嗓子发干，\"是从哪儿来的？\"<\/p>\n<p>老头没答，只把布往我这边推了推：\"拿着。线头在谁手里，谁就得把线接下去。\"<\/p>\n<p>\"这芯子，我替你捻好了。\"老头说，\"点不点，什么时候点，在你——不在我，也不在那些吹灯的。\"<\/p>\n<p>瘦高个盯着台上，脸上的肉抽了抽。<\/p>\n<p>\"行。\"他退了一步，又退了一步，\"账你认了，好。这笔账，往后就找你要。我等的，就是这一天。\"<\/p>\n<p>他转过身，冲矮个使了个眼色。矮个从台边退开，两人一前一后，顺着獾子道往下走。走了几步，瘦高个回过头，冲台上啐了一口：<\/p>\n<p>\"锅给你留着。账，也给你留着。你背得动锅，未必背得动账。\"<\/p>\n<p>脚步声顺着石阶往下，越走越远，最后化进了林子里。<\/p>\n<p>台上只剩我们三个，还有那盏灯。<\/p>\n<p>草帽人把白纸灯笼收了，冲台上拱了拱手，也退下护林道去了。<\/p>\n<p>他走得很快，白纸灯笼夹在腋下，一晃一晃的，像一只没点着的眼睛。<\/p>\n<p>我冲他背影喊了一声：\"替我谢你们那一路。\"<\/p>\n<p>他没回头，只摆了摆手。<\/p>\n<p>台子上安静下来，只剩风声和林子。<\/p>\n<p>鱼哥低头看了看我手背上的布条，说了一句：\"回去得打破伤风。\"<\/p>\n<p>\"山里哪来的破伤风针。\"我说。<\/p>\n<p>\"那就下山打。\"他把匕首插回鞋帮上，\"这口锅，往后还得你背着。手废了，锅就没人背了。\"<\/p>\n<p>我笑了一下，扯得肩窝生疼。<\/p>\n<p>鱼哥扯了衣裳下摆，给我把手背缠上，缠到一半，忽然停住，抬下巴朝那盏灯努了努嘴。<\/p>\n<p>我顺着看过去。<\/p>\n<p>风是从沟里往上灌的，从台子底下往北坡上吹。台上那棵歪脖老榆的枝条，被吹得哗哗响；台沿上的灰土，一阵一阵往北飘。<\/p>\n<p>可那盏灯的火苗，不往北倒。<\/p>\n<p>它歪着，斜斜地，朝着台心那口锅的方向，直直地倾过去。<\/p>\n<p>灯没动，风没停。<\/p>\n<p>我盯着那点火苗，盯了很久。<\/p>\n<p>它不是被风吹歪的。它是自己朝那口锅，倾过去的。<\/p>\n<p>台下的林子黑沉沉的，风从沟底往上卷，一阵比一阵紧。远处，五女山的崖壁在夜色里立着，像一堵没有门的墙。<\/p>\n<p>我忽然想起老陈说过的话——那老头坐过的石头，雨停了还是干的。<\/p>\n<p>有些事，从今夜起，我怕是躲不开了。<\/p>", "plain": "那桶煤油泼过来的时候，鱼哥先动的。 瘦高个扬手的动作还没做完，鱼哥已经从我身边蹿了出去，一脚踹在他拿桶的那条胳膊上。铁皮桶飞出去，在半空翻了个个儿，油没泼到台上，泼了半台子外的碎石，哗啦一声，一股呛人的煤油味腾起来。 矮个紧跟着扑上台，直奔台心的锅。 他个子矮，可快得像只狸子，一只手插在裤兜里，另一只已经按在了锅沿上。 我扑过去，一把抱住那口锅。 他的胳膊肘撞在我肩窝上，闷闷一下，眼前直冒金星。我抱着锅不撒手，脚底下一滑，连人带锅往台边滚。他大概没料到我不躲不闪，愣了一下，伸手来掰我的手——那手跟铁钳子似的，我手背上的皮\"嘶\"地就开了。 血珠子一颗一颗冒出来，我顾不上。矮个的另一只手去掀锅沿，我拿肩膀顶住他，两人在台心那块青石上扭成一团。他个子矮，力气却邪乎，膝盖一顶，把我整个人顶得离了地。我抱着锅不撒手，任他把我摔在台上，后脑勺磕在石头上，\"嗡\"的一声，眼前白了一片。 \"松手！\"他嗓子又哑又急。 \"不松。\" 台边上，鱼哥已经跟瘦高个扭在了一处。那瘦高个看着瘦，劲却不小，两人滚在碎石堆里，谁也没占着便宜。鱼哥背上的旧伤被压了一下，闷哼了一声，可手底下没松，一记横肘砸在对方脸上，把瘦高个砸得往后一仰。 瘦高个捂着鼻子，血从指缝里淌下来。他笑了一声，从腰后摸出一把扁扁的撬棍。鱼哥没等他抬起来，抬脚一踹，正踹在他手腕上，撬棍\"当啷\"滚到台下。两人又扭在碎石堆里，滚得一身土。 布兜里的老避龙炸了毛，扑棱棱从兜里挣出来，在台边又扑又叫。 \"台上有人点灯了——\" 草帽人不知什么时候站到了台口，把那盏白纸灯笼高高举起来。白纸灯笼透着一圈暖黄的光，风一吹，晃晃悠悠，却始终没灭。他扯着嗓子喊： \"山里的眼睛，都看着呢！\" 矮个的手顿了一下。 就这一下，我把锅往怀里一揽，翻身坐起来，背抵着台沿，把锅护在身后。他站在我面前，胸口一起一伏，一双眼睛死死盯着我，盯着我怀里那口锅。 \"你个背锅的，\"他从牙缝里挤出一句，\"命都不要了？\" 我没答话。肩窝那块被他撞的地方，一阵一阵往外冒疼，手背上血顺着指缝往下淌，滴在青石台上，一滴一滴，洇开成小小的黑点。 矮个盯着那几滴血，忽然压着嗓子骂了一句：\"早两年，我就该把这口破锅砸了。\" 我心里一动。两年前，正是五进两出的那一年。 他这话说得没头没尾，可我心里那根弦\"嗡\"地一下绷紧了。五进两出，两年前，一伙人进了鹰嘴沟，只出来一个。这口锅，就是打那回起，才在道上有了名。 矮个没再往下说，只是死死盯着我怀里的锅，像是要把锅看穿。 台底下，瘦高个喊了一声：\"别跟他磨！掀锅！\" 瘦高个从碎石堆里爬起来，抹了一把嘴角的血，走到台前，看着那口锅，忽然笑了。 \"好。\"他说，\"好一个背锅的。\" 他往前一步。 白头发老头动了。 他一直坐在台沿那块平石头上，从我抱锅到这会儿，一动没动，像一截长在石头上的树桩。这会儿他伸出手，把那盏油灯往台心挪了挪，灯苗\"腾\"地往上跳了一下，把台子照得亮堂了些。瘦高个的影子被拉得老长，铺在台口，他一脚踩进去，像踩进一摊黑水，脚下就停住了。 \"这锅，\"他开口，声音不高，却把台下的动静全压住了，\"有主了。\" 瘦高个的脚步停住。 \"它没认。\"他指着锅，\"认名分的还没认账。无主的锅，山不管。\" \"他抱着呢。\"老头抬了抬下巴，冲我，\"你问他认不认。\" 三路人，六只眼睛，全落到我身上。 台沿上那盏灯苗，把白头发老头的半边脸照出来，又埋进暗里。我到现在也没看清他的耳朵。 我低下头，看怀里那口锅。 锅底冲着地，锅口冲着我。陶胎上还有没擦净的灰。这口锅从鹰嘴沟的石室里出来，跟我走过雨夜，走过石缝，藏过炭窑，埋过偏屋，又让我背着爬了半座五女山。它不是我的，可它认我的手。它认了我认下的那个名分。 王长顺临死前说，爹，锅是空的。 锅是空的，可空锅也得有人背。 \"认。\"我说。 就一个字。 瘦高个脸上的笑僵住了。 \"你说什么？\" \"我说，账，我认。\"我抬起头，一字一顿，\"灯点起来，名分过明路。这笔账，从今夜起，落我头上。跟我们掌柜的，没关系了。\" 台下静了。 矮个回头去看瘦高个。草帽人举着的灯笼，光晃了一下。鱼哥从碎石堆里站起来，一瘸一拐走到我身边，没说话，就站在我旁边。 我扶着锅站起来，腿肚子发软，后脑勺磕的那块，一阵一阵地跳。可我心里那口气，反倒顺了。 从今往后，这笔账是我的了。我不再是替人背锅的那个，我是这口锅的主。 这话我没说出口，只在心里过了一遍。可过完这一遍，我后背上的汗，反倒干了。 人这一辈子，怕的不是担事，是不知道自己担的是什么事。这会儿我知道了。 台上那盏灯，火苗小小的，照着锅，也照着我。 白头发老头慢慢站起来，走到我面前，低头看了看我护着的那口锅，又看了看我手背上的血。 \"认账的人，\"他说，\"山记得住。\" 他从怀里摸出一样东西，蹲下身，放在台心那盏灯旁边。 是一根捻好的灯芯。白棉线搓的，搓得很紧，绕成一圈，压在一块叠得方方正正的布上。那布是灰的，布角上，补着一小块蓝—— 细针脚。一针压着一针，齐得跟拿尺子量过。 我心里\"轰\"地一下。 蜂房炕洞里的铁盒，沟里石室北墙的红布条，老周铺子里那个白头发瘦子的袖口——一样的针脚，一样的蓝。 \"这布，\"我嗓子发干，\"是从哪儿来的？\" 老头没答，只把布往我这边推了推：\"拿着。线头在谁手里，谁就得把线接下去。\" \"这芯子，我替你捻好了。\"老头说，\"点不点，什么时候点，在你——不在我，也不在那些吹灯的。\" 瘦高个盯着台上，脸上的肉抽了抽。 \"行。\"他退了一步，又退了一步，\"账你认了，好。这笔账，往后就找你要。我等的，就是这一天。\" 他转过身，冲矮个使了个眼色。矮个从台边退开，两人一前一后，顺着獾子道往下走。走了几步，瘦高个回过头，冲台上啐了一口： \"锅给你留着。账，也给你留着。你背得动锅，未必背得动账。\" 脚步声顺着石阶往下，越走越远，最后化进了林子里。 台上只剩我们三个，还有那盏灯。 草帽人把白纸灯笼收了，冲台上拱了拱手，也退下护林道去了。 他走得很快，白纸灯笼夹在腋下，一晃一晃的，像一只没点着的眼睛。 我冲他背影喊了一声：\"替我谢你们那一路。\" 他没回头，只摆了摆手。 台子上安静下来，只剩风声和林子。 鱼哥低头看了看我手背上的布条，说了一句：\"回去得打破伤风。\" \"山里哪来的破伤风针。\"我说。 \"那就下山打。\"他把匕首插回鞋帮上，\"这口锅，往后还得你背着。手废了，锅就没人背了。\" 我笑了一下，扯得肩窝生疼。 鱼哥扯了衣裳下摆，给我把手背缠上，缠到一半，忽然停住，抬下巴朝那盏灯努了努嘴。 我顺着看过去。 风是从沟里往上灌的，从台子底下往北坡上吹。台上那棵歪脖老榆的枝条，被吹得哗哗响；台沿上的灰土，一阵一阵往北飘。 可那盏灯的火苗，不往北倒。 它歪着，斜斜地，朝着台心那口锅的方向，直直地倾过去。 灯没动，风没停。 我盯着那点火苗，盯了很久。 它不是被风吹歪的。它是自己朝那口锅，倾过去的。 台下的林子黑沉沉的，风从沟底往上卷，一阵比一阵紧。远处，五女山的崖壁在夜色里立着，像一堵没有门的墙。 我忽然想起老陈说过的话——那老头坐过的石头，雨停了还是干的。 有些事，从今夜起，我怕是躲不开了。"}, {"id": "A5-085", "arc": "A5", "num": 85, "title": "承账", "md": "那一夜，剩下的时辰，是我这辈子过得最慢的一夜。\n\n鱼哥把我的手背缠好，又去收拾台边泼了油的碎石。油味呛人，他用土盖了一层，才压下去大半。台角被溅上的煤油燎了一块，青石面上留着一小片焦黑，像谁在石头上按了个指印。\n\n白头发老头没走。他坐在台沿那块平石头上，守着那盏油灯，一根接一根地抽烟。烟头一明一灭，跟灯苗对着眨眼睛。\n\n我靠在老榆树根上，肩窝一阵一阵地疼。手背上那根布条被血浸透了，风一吹，凉丝丝的。\n\n\"疼不疼？\"老头忽然问。\n\n\"疼。\"\n\n\"疼是好事。\"他把烟头在石头上按灭，\"不疼的人，背不动账。\"\n\n\"我不怕疼。\"我说，\"我怕的是，这笔账认下来，往后的路，就是您说的那条——走一条，记一笔。\"\n\n\"怕就对了。\"老头说，\"不怕的人，走不到头。\"\n\n\"走到头，是什么？\"\n\n\"我要是知道，\"他笑了一下，笑纹在灯苗底下闪了闪，\"我早走过去了。\"\n\n他没再多说。这一夜，他就坐在台沿上，一根接一根地抽烟。我数着台子底下的林涛声，一声一声，数到后来，也数不清了。\n\n我看着他。灯苗的光只够照到他半边脸，另半边埋在暗里，看不清。\n\n\"我问您一句话。\"我说，\"沟里那道缝口，夜里也坐着一个人。灰褂子，黑布鞋，缺了多半截左耳。\"\n\n老头抽烟的动作停了一下。\n\n\"他跟你，什么关系？\"\n\n他把烟从嘴里拿下来，看着灯苗，看了很久。\n\n\"这话，\"他说，\"我不答。你往后自己看。看明白了，比我说一百句都强。\"\n\n我没再追问。有些话，问急了，反而不真。\n\n\"那这个呢？\"我指了指台心那盏灯旁边的灯芯和那块补蓝布，\"您给我这个，是什么意思？\"\n\n\"意思就是，灯在你手里了。\"他说，\"五盏灯，四盏有了主。剩这一盏，我没给你点——我把芯子给你。点不点，什么时候点，你自己拿主意。\"\n\n\"点了会怎么样？\"\n\n\"点了，名分就明。\"他说，\"吹灯的那一路，就再没有'它无主'这句话可讲。到时候，他们要么认你，要么跟你死磕，没有第三条道。\"\n\n\"不点呢？\"\n\n\"不点，名分就压在你身上，压一天，山记一天。\"他站起来，拍了拍褂子上的土，\"账认了，是认了这笔债；灯点不点，是你要不要把这笔债还出去。两码事。\"\n\n\"我还有一句。\"我说，\"点灯的那一路，说灯点起来，账就清了。您说账跟着名分走。两句不一样，我该信哪一句？\"\n\n老头看了我一眼，那一眼在灯苗底下，深得看不见底。\n\n\"信你自己听见的。\"他说，\"别人的话，都是拿嘴说的。账，是拿命记的。\"\n\n我没再问。\n\n我低头看那块补蓝布。布是灰的，蓝补丁不大，针脚细得吓人，一针压着一针，齐得像拿尺子量过。\n\n\"这布，\"我忍不住问，\"是谁缝的？\"\n\n\"老物件了。\"他把油灯端起来，往台下走，\"谁缝的不要紧。要紧的是，缝东西的人，把线头留在了谁手里。\"\n\n他走到台口，停了一下。\n\n\"背锅的，记住我一句话。\"\n\n\"您说。\"\n\n\"承了账，'守'字就上身了。往后这山里的路，你走一条，它记一笔。它要东西，你就得给；给不起，就欠着。欠账的人，走夜路，多留神。\"\n\n说完，那点灯火顺着獾子道，一层一层往下沉，沉进林子里，就没了。\n\n天蒙蒙亮的时候，把头来了。\n\n他是从护林道正路上爬上来的，裤腿上沾满了泥，鞋帮子也湿了半截，一上到台子口，先扶着老榆树喘了半天气，才抬头看台。\n\n他一眼看见那口扣在台心的锅，又看见我手上缠着的布，脸色沉了沉。\n\n\"伤着了？\"\n\n\"皮外伤。\"我说，\"不碍事。\"\n\n他把肩上挎的布包搁下，蹲在台沿上，掏出烟来卷，卷到一半，手指停住了。他从怀里摸出一样东西，搁在台沿上。\n\n是那盒刻着\"灭\"字的火柴。\n\n他又从台心把那根捻好的灯芯和补蓝布拿过来，两样东西，一样一样摆在灯苗的两边。\n\n一边一个\"灭\"，一边一根芯。\n\n\"三路人，都来了。\"他看着这两样东西，慢慢地说，\"点灯的来了，吹灯的来了，问灯的也来了。就我，来晚了。\"\n\n\"您被绊住了？\"\n\n\"老鼠男拉着我说了一下午的灯。\"把头卷好烟，点着，抽了一口，\"从三点说到天擦黑，一句正经话没有，就是不让我动身。等我回过味来，日头已经落了。\"\n\n他顿了顿：\"绊住我的不是路，是话。有人不想让我上台。\"\n\n\"不想让您上台，是不想让账落您头上。\"我说。\n\n\"那账，落谁头上了？\"\n\n我看着他，没吭声。\n\n把头也不催我。他抽着烟，把台子上上下下扫了一遍——焦黑的台角、泼了油的碎石、台心那口锅，最后，目光落在我脸上。\n\n\"你认了？\"\n\n\"认了。\"\n\n烟在他指间烧了一截，灰掉在台沿上。\n\n我原以为他要骂我。他没骂。他把烟在鞋底上摁灭，站起来，走到我身边，伸手在我肩上拍了拍，拍得很轻。\n\n\"认账，不丢人。\"他说，\"赖账，才丢人。你从沟里把锅背出来那天，这笔账就早晚得有人认。你不认，就得我认。你抢在前头，是你的孝心。下回别抢，你还年轻。\"\n\n他这话说得平淡，我鼻子却有点发酸。\n\n\"您早知道会这样？\"我问。\n\n\"我要是早知道，\"把头把烟灰弹在台沿外头，\"就不该让你先上来。\"\n\n\"那您还让我来。\"\n\n\"因为这话，得你自己听。\"他看着我，\"我要是替你把话听了，账认在你身上，你也只是个背锅的。你自己听的，自己认的，往后才立得住。\"\n\n我点点头。风从台子底下往上吹，把台心的灯苗吹得晃了一晃，又立住了。\n\n\"灯呢？\"他问。\n\n\"没点。\"我说，\"芯子留在我这儿了。\"\n\n\"留得好。\"把头点点头，\"灯一明，这山里就再没安稳日子。芯子在咱们手里，什么时候点，咱们说了算。这一点，比什么都强。\"\n\n太阳从东边升起来，照在五女山的青石崖上，把台子照得亮堂堂的。\n\n鱼哥蹲在台边，把散在地上的碎石一块一块归拢。他忽然说：\"昨儿夜里，那矮个使的是北派的擒拿路子。\"\n\n\"北派？\"\n\n\"嗯。\"他拍了拍手上的土，\"跟我师傅一路。可他们不认我。\"\n\n他说这话的时候语气很平，可我听出点别的意思来。\n\n我们收拾东西下山。我把锅从台上抱起来，往背上一勒——\n\n就在锅离开台心的那一刹那，我看见印子里多了一样东西。\n\n那道圆印的印心，多了一道新鲜的划痕。不长，寸把长，直直的，像是有人拿硬物的尖儿，在石头上一划到底。石屑还是新的，白生生地嵌在印子里。\n\n我愣了一下，蹲下去，伸手摸了摸那道痕。\n\n不是锅压的。锅底是圆的，压不出这么直的线。\n\n昨夜这台子上，从点灯到过火到散场，我、鱼哥、白头发老头、草帽人、瘦高个、矮个——六个人，谁都没拿硬物在台心划过。\n\n那这道痕，是谁划的？\n\n我把锅背起来，站在台边，往四下里看。晨光里，护林道是空的，獾子道是空的，北坡的林子安安静静。\n\n下到护林道口，老陈正蹲在屋门口劈柴。他抬头看见我手上缠的布，眼皮抬了抬，什么也没多问。\n\n\"台子上出事了？\"他只问了这一句。\n\n\"出了点。\"我说，\"烧了半台子，人没事。\"\n\n\"锅呢？\"\n\n\"锅好好的。\"\n\n老陈\"嗯\"了一声，把劈好的柴往墙根一摞：\"锅好好的就行。别的，我一个看林的，管不着。\"\n\n他顿了顿，又补一句：\"往后那老头要是再来，我还给你们捎信。\"\n\n我谢了他，进屋打电话。电话那头，豆芽仔压着嗓子，说了一句话，把刚下山的一点轻松全给我抽走了。\n\n\"哥，\"他说，\"今儿一早，草帽人又去老周店了。他让老周给你们带句话——\"\n\n\"什么话？\"\n\n\"他说，'账接了，灯会就开在五月节前。到那天，五部的东西，散的，都得回来。'\"\n\n我握着话筒，半天没出声。\n\n五月。\n\n沟里那个缺耳的白发老头，说他没有提过五月。\n\n可如今，有人把\"五月\"两个字，明明白白地摆到了我面前。\n\n我把话筒放回去，站在屋门口，往上看。\n\n半坡上，扣锅台被日头照着，青石泛白。台边那棵歪脖老榆，风一吹，枝条哗啦啦地响，像有人在台上翻纸。\n\n我忽然想起沟里那道缝口，想起缺耳老头说的那句话——\"我没说五月，你听岔了。\"\n\n他说他没说。\n\n可这世上，知道\"五月\"的，不止他一个。", "words": 2978, "html": "<p>那一夜，剩下的时辰，是我这辈子过得最慢的一夜。<\/p>\n<p>鱼哥把我的手背缠好，又去收拾台边泼了油的碎石。油味呛人，他用土盖了一层，才压下去大半。台角被溅上的煤油燎了一块，青石面上留着一小片焦黑，像谁在石头上按了个指印。<\/p>\n<p>白头发老头没走。他坐在台沿那块平石头上，守着那盏油灯，一根接一根地抽烟。烟头一明一灭，跟灯苗对着眨眼睛。<\/p>\n<p>我靠在老榆树根上，肩窝一阵一阵地疼。手背上那根布条被血浸透了，风一吹，凉丝丝的。<\/p>\n<p>\"疼不疼？\"老头忽然问。<\/p>\n<p>\"疼。\"<\/p>\n<p>\"疼是好事。\"他把烟头在石头上按灭，\"不疼的人，背不动账。\"<\/p>\n<p>\"我不怕疼。\"我说，\"我怕的是，这笔账认下来，往后的路，就是您说的那条——走一条，记一笔。\"<\/p>\n<p>\"怕就对了。\"老头说，\"不怕的人，走不到头。\"<\/p>\n<p>\"走到头，是什么？\"<\/p>\n<p>\"我要是知道，\"他笑了一下，笑纹在灯苗底下闪了闪，\"我早走过去了。\"<\/p>\n<p>他没再多说。这一夜，他就坐在台沿上，一根接一根地抽烟。我数着台子底下的林涛声，一声一声，数到后来，也数不清了。<\/p>\n<p>我看着他。灯苗的光只够照到他半边脸，另半边埋在暗里，看不清。<\/p>\n<p>\"我问您一句话。\"我说，\"沟里那道缝口，夜里也坐着一个人。灰褂子，黑布鞋，缺了多半截左耳。\"<\/p>\n<p>老头抽烟的动作停了一下。<\/p>\n<p>\"他跟你，什么关系？\"<\/p>\n<p>他把烟从嘴里拿下来，看着灯苗，看了很久。<\/p>\n<p>\"这话，\"他说，\"我不答。你往后自己看。看明白了，比我说一百句都强。\"<\/p>\n<p>我没再追问。有些话，问急了，反而不真。<\/p>\n<p>\"那这个呢？\"我指了指台心那盏灯旁边的灯芯和那块补蓝布，\"您给我这个，是什么意思？\"<\/p>\n<p>\"意思就是，灯在你手里了。\"他说，\"五盏灯，四盏有了主。剩这一盏，我没给你点——我把芯子给你。点不点，什么时候点，你自己拿主意。\"<\/p>\n<p>\"点了会怎么样？\"<\/p>\n<p>\"点了，名分就明。\"他说，\"吹灯的那一路，就再没有'它无主'这句话可讲。到时候，他们要么认你，要么跟你死磕，没有第三条道。\"<\/p>\n<p>\"不点呢？\"<\/p>\n<p>\"不点，名分就压在你身上，压一天，山记一天。\"他站起来，拍了拍褂子上的土，\"账认了，是认了这笔债；灯点不点，是你要不要把这笔债还出去。两码事。\"<\/p>\n<p>\"我还有一句。\"我说，\"点灯的那一路，说灯点起来，账就清了。您说账跟着名分走。两句不一样，我该信哪一句？\"<\/p>\n<p>老头看了我一眼，那一眼在灯苗底下，深得看不见底。<\/p>\n<p>\"信你自己听见的。\"他说，\"别人的话，都是拿嘴说的。账，是拿命记的。\"<\/p>\n<p>我没再问。<\/p>\n<p>我低头看那块补蓝布。布是灰的，蓝补丁不大，针脚细得吓人，一针压着一针，齐得像拿尺子量过。<\/p>\n<p>\"这布，\"我忍不住问，\"是谁缝的？\"<\/p>\n<p>\"老物件了。\"他把油灯端起来，往台下走，\"谁缝的不要紧。要紧的是，缝东西的人，把线头留在了谁手里。\"<\/p>\n<p>他走到台口，停了一下。<\/p>\n<p>\"背锅的，记住我一句话。\"<\/p>\n<p>\"您说。\"<\/p>\n<p>\"承了账，'守'字就上身了。往后这山里的路，你走一条，它记一笔。它要东西，你就得给；给不起，就欠着。欠账的人，走夜路，多留神。\"<\/p>\n<p>说完，那点灯火顺着獾子道，一层一层往下沉，沉进林子里，就没了。<\/p>\n<p>天蒙蒙亮的时候，把头来了。<\/p>\n<p>他是从护林道正路上爬上来的，裤腿上沾满了泥，鞋帮子也湿了半截，一上到台子口，先扶着老榆树喘了半天气，才抬头看台。<\/p>\n<p>他一眼看见那口扣在台心的锅，又看见我手上缠着的布，脸色沉了沉。<\/p>\n<p>\"伤着了？\"<\/p>\n<p>\"皮外伤。\"我说，\"不碍事。\"<\/p>\n<p>他把肩上挎的布包搁下，蹲在台沿上，掏出烟来卷，卷到一半，手指停住了。他从怀里摸出一样东西，搁在台沿上。<\/p>\n<p>是那盒刻着\"灭\"字的火柴。<\/p>\n<p>他又从台心把那根捻好的灯芯和补蓝布拿过来，两样东西，一样一样摆在灯苗的两边。<\/p>\n<p>一边一个\"灭\"，一边一根芯。<\/p>\n<p>\"三路人，都来了。\"他看着这两样东西，慢慢地说，\"点灯的来了，吹灯的来了，问灯的也来了。就我，来晚了。\"<\/p>\n<p>\"您被绊住了？\"<\/p>\n<p>\"老鼠男拉着我说了一下午的灯。\"把头卷好烟，点着，抽了一口，\"从三点说到天擦黑，一句正经话没有，就是不让我动身。等我回过味来，日头已经落了。\"<\/p>\n<p>他顿了顿：\"绊住我的不是路，是话。有人不想让我上台。\"<\/p>\n<p>\"不想让您上台，是不想让账落您头上。\"我说。<\/p>\n<p>\"那账，落谁头上了？\"<\/p>\n<p>我看着他，没吭声。<\/p>\n<p>把头也不催我。他抽着烟，把台子上上下下扫了一遍——焦黑的台角、泼了油的碎石、台心那口锅，最后，目光落在我脸上。<\/p>\n<p>\"你认了？\"<\/p>\n<p>\"认了。\"<\/p>\n<p>烟在他指间烧了一截，灰掉在台沿上。<\/p>\n<p>我原以为他要骂我。他没骂。他把烟在鞋底上摁灭，站起来，走到我身边，伸手在我肩上拍了拍，拍得很轻。<\/p>\n<p>\"认账，不丢人。\"他说，\"赖账，才丢人。你从沟里把锅背出来那天，这笔账就早晚得有人认。你不认，就得我认。你抢在前头，是你的孝心。下回别抢，你还年轻。\"<\/p>\n<p>他这话说得平淡，我鼻子却有点发酸。<\/p>\n<p>\"您早知道会这样？\"我问。<\/p>\n<p>\"我要是早知道，\"把头把烟灰弹在台沿外头，\"就不该让你先上来。\"<\/p>\n<p>\"那您还让我来。\"<\/p>\n<p>\"因为这话，得你自己听。\"他看着我，\"我要是替你把话听了，账认在你身上，你也只是个背锅的。你自己听的，自己认的，往后才立得住。\"<\/p>\n<p>我点点头。风从台子底下往上吹，把台心的灯苗吹得晃了一晃，又立住了。<\/p>\n<p>\"灯呢？\"他问。<\/p>\n<p>\"没点。\"我说，\"芯子留在我这儿了。\"<\/p>\n<p>\"留得好。\"把头点点头，\"灯一明，这山里就再没安稳日子。芯子在咱们手里，什么时候点，咱们说了算。这一点，比什么都强。\"<\/p>\n<p>太阳从东边升起来，照在五女山的青石崖上，把台子照得亮堂堂的。<\/p>\n<p>鱼哥蹲在台边，把散在地上的碎石一块一块归拢。他忽然说：\"昨儿夜里，那矮个使的是北派的擒拿路子。\"<\/p>\n<p>\"北派？\"<\/p>\n<p>\"嗯。\"他拍了拍手上的土，\"跟我师傅一路。可他们不认我。\"<\/p>\n<p>他说这话的时候语气很平，可我听出点别的意思来。<\/p>\n<p>我们收拾东西下山。我把锅从台上抱起来，往背上一勒——<\/p>\n<p>就在锅离开台心的那一刹那，我看见印子里多了一样东西。<\/p>\n<p>那道圆印的印心，多了一道新鲜的划痕。不长，寸把长，直直的，像是有人拿硬物的尖儿，在石头上一划到底。石屑还是新的，白生生地嵌在印子里。<\/p>\n<p>我愣了一下，蹲下去，伸手摸了摸那道痕。<\/p>\n<p>不是锅压的。锅底是圆的，压不出这么直的线。<\/p>\n<p>昨夜这台子上，从点灯到过火到散场，我、鱼哥、白头发老头、草帽人、瘦高个、矮个——六个人，谁都没拿硬物在台心划过。<\/p>\n<p>那这道痕，是谁划的？<\/p>\n<p>我把锅背起来，站在台边，往四下里看。晨光里，护林道是空的，獾子道是空的，北坡的林子安安静静。<\/p>\n<p>下到护林道口，老陈正蹲在屋门口劈柴。他抬头看见我手上缠的布，眼皮抬了抬，什么也没多问。<\/p>\n<p>\"台子上出事了？\"他只问了这一句。<\/p>\n<p>\"出了点。\"我说，\"烧了半台子，人没事。\"<\/p>\n<p>\"锅呢？\"<\/p>\n<p>\"锅好好的。\"<\/p>\n<p>老陈\"嗯\"了一声，把劈好的柴往墙根一摞：\"锅好好的就行。别的，我一个看林的，管不着。\"<\/p>\n<p>他顿了顿，又补一句：\"往后那老头要是再来，我还给你们捎信。\"<\/p>\n<p>我谢了他，进屋打电话。电话那头，豆芽仔压着嗓子，说了一句话，把刚下山的一点轻松全给我抽走了。<\/p>\n<p>\"哥，\"他说，\"今儿一早，草帽人又去老周店了。他让老周给你们带句话——\"<\/p>\n<p>\"什么话？\"<\/p>\n<p>\"他说，'账接了，灯会就开在五月节前。到那天，五部的东西，散的，都得回来。'\"<\/p>\n<p>我握着话筒，半天没出声。<\/p>\n<p>五月。<\/p>\n<p>沟里那个缺耳的白发老头，说他没有提过五月。<\/p>\n<p>可如今，有人把\"五月\"两个字，明明白白地摆到了我面前。<\/p>\n<p>我把话筒放回去，站在屋门口，往上看。<\/p>\n<p>半坡上，扣锅台被日头照着，青石泛白。台边那棵歪脖老榆，风一吹，枝条哗啦啦地响，像有人在台上翻纸。<\/p>\n<p>我忽然想起沟里那道缝口，想起缺耳老头说的那句话——\"我没说五月，你听岔了。\"<\/p>\n<p>他说他没说。<\/p>\n<p>可这世上，知道\"五月\"的，不止他一个。<\/p>", "plain": "那一夜，剩下的时辰，是我这辈子过得最慢的一夜。 鱼哥把我的手背缠好，又去收拾台边泼了油的碎石。油味呛人，他用土盖了一层，才压下去大半。台角被溅上的煤油燎了一块，青石面上留着一小片焦黑，像谁在石头上按了个指印。 白头发老头没走。他坐在台沿那块平石头上，守着那盏油灯，一根接一根地抽烟。烟头一明一灭，跟灯苗对着眨眼睛。 我靠在老榆树根上，肩窝一阵一阵地疼。手背上那根布条被血浸透了，风一吹，凉丝丝的。 \"疼不疼？\"老头忽然问。 \"疼。\" \"疼是好事。\"他把烟头在石头上按灭，\"不疼的人，背不动账。\" \"我不怕疼。\"我说，\"我怕的是，这笔账认下来，往后的路，就是您说的那条——走一条，记一笔。\" \"怕就对了。\"老头说，\"不怕的人，走不到头。\" \"走到头，是什么？\" \"我要是知道，\"他笑了一下，笑纹在灯苗底下闪了闪，\"我早走过去了。\" 他没再多说。这一夜，他就坐在台沿上，一根接一根地抽烟。我数着台子底下的林涛声，一声一声，数到后来，也数不清了。 我看着他。灯苗的光只够照到他半边脸，另半边埋在暗里，看不清。 \"我问您一句话。\"我说，\"沟里那道缝口，夜里也坐着一个人。灰褂子，黑布鞋，缺了多半截左耳。\" 老头抽烟的动作停了一下。 \"他跟你，什么关系？\" 他把烟从嘴里拿下来，看着灯苗，看了很久。 \"这话，\"他说，\"我不答。你往后自己看。看明白了，比我说一百句都强。\" 我没再追问。有些话，问急了，反而不真。 \"那这个呢？\"我指了指台心那盏灯旁边的灯芯和那块补蓝布，\"您给我这个，是什么意思？\" \"意思就是，灯在你手里了。\"他说，\"五盏灯，四盏有了主。剩这一盏，我没给你点——我把芯子给你。点不点，什么时候点，你自己拿主意。\" \"点了会怎么样？\" \"点了，名分就明。\"他说，\"吹灯的那一路，就再没有'它无主'这句话可讲。到时候，他们要么认你，要么跟你死磕，没有第三条道。\" \"不点呢？\" \"不点，名分就压在你身上，压一天，山记一天。\"他站起来，拍了拍褂子上的土，\"账认了，是认了这笔债；灯点不点，是你要不要把这笔债还出去。两码事。\" \"我还有一句。\"我说，\"点灯的那一路，说灯点起来，账就清了。您说账跟着名分走。两句不一样，我该信哪一句？\" 老头看了我一眼，那一眼在灯苗底下，深得看不见底。 \"信你自己听见的。\"他说，\"别人的话，都是拿嘴说的。账，是拿命记的。\" 我没再问。 我低头看那块补蓝布。布是灰的，蓝补丁不大，针脚细得吓人，一针压着一针，齐得像拿尺子量过。 \"这布，\"我忍不住问，\"是谁缝的？\" \"老物件了。\"他把油灯端起来，往台下走，\"谁缝的不要紧。要紧的是，缝东西的人，把线头留在了谁手里。\" 他走到台口，停了一下。 \"背锅的，记住我一句话。\" \"您说。\" \"承了账，'守'字就上身了。往后这山里的路，你走一条，它记一笔。它要东西，你就得给；给不起，就欠着。欠账的人，走夜路，多留神。\" 说完，那点灯火顺着獾子道，一层一层往下沉，沉进林子里，就没了。 天蒙蒙亮的时候，把头来了。 他是从护林道正路上爬上来的，裤腿上沾满了泥，鞋帮子也湿了半截，一上到台子口，先扶着老榆树喘了半天气，才抬头看台。 他一眼看见那口扣在台心的锅，又看见我手上缠着的布，脸色沉了沉。 \"伤着了？\" \"皮外伤。\"我说，\"不碍事。\" 他把肩上挎的布包搁下，蹲在台沿上，掏出烟来卷，卷到一半，手指停住了。他从怀里摸出一样东西，搁在台沿上。 是那盒刻着\"灭\"字的火柴。 他又从台心把那根捻好的灯芯和补蓝布拿过来，两样东西，一样一样摆在灯苗的两边。 一边一个\"灭\"，一边一根芯。 \"三路人，都来了。\"他看着这两样东西，慢慢地说，\"点灯的来了，吹灯的来了，问灯的也来了。就我，来晚 const $ = s => document.querySelector(s);
const KEY = 'bpdx_reader_v1';
let chapters = DATA.slice().sort((a,b)=> (a.arc<b.arc?-1:a.arc>b.arc?1:0) || a.num-b.num);
let cur = 0, hits = [];
const DEF = {theme:'light', fs:'18px', lh:'1.9', pw:'760px', ch:null, y:0, fold:false};
let S = Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY)||'{}'));
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function applySettings(){
  document.body.classList.toggle('toc-fold', !!S.fold);
  $('#fold').textContent = S.fold ? '⇥' : '⇤';
  document.documentElement.setAttribute('data-theme', S.theme);
  document.documentElement.style.setProperty('--fs', S.fs);
  document.documentElement.style.setProperty('--lh', S.lh);
  document.documentElement.style.setProperty('--pw', S.pw);
  $('#theme').textContent = S.theme==='dark' ? '☀️' : '🌙';
  $('#fs').value=S.fs; $('#lh').value=S.lh; $('#pw').value=S.pw;
}
$('#theme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';applySettings();save();};
$('#fs').onchange=e=>{S.fs=e.target.value;applySettings();save();};
$('#lh').onchange=e=>{S.lh=e.target.value;applySettings();save();};
$('#pw').onchange=e=>{S.pw=e.target.value;applySettings();save();};
$('#fold').onclick=()=>{S.fold=!S.fold;applySettings();save();};
$('#tocbtn').onclick=()=>document.body.classList.toggle('toc-open');
$('#backdrop').onclick=()=>document.body.classList.remove('toc-open');
function renderToc(){
  $('#toclist').innerHTML = chapters.map((c,i)=>`<a href="#" data-i="${i}"><span style="color:var(--muted);font-size:13px;margin-right:6px">第${c.num}章</span>${c.title}</a>`).join('');
  $('#toclist').querySelectorAll('a').forEach(a=>{a.onclick=e=>{e.preventDefault();go(+a.dataset.i,true);document.body.classList.remove('toc-open');};});
  document.querySelectorAll('#toc a').forEach(a=>a.classList.toggle('on',+a.dataset.i===cur));
}
function render(){
  const c=chapters[cur];
  document.title=`第${c.num}章 ${c.title} · 北派续写`;
  $('#chapter').innerHTML=`<h2>第${c.num}章　${c.title}</h2><div class="meta">${c.words}字</div>`+c.html;
  $('#prev').disabled=cur<=0; $('#next').disabled=cur>=chapters.length-1;
  renderToc();
  if(hits.length) highlight($('#q').value);
}
function go(i,top){cur=Math.max(0,Math.min(chapters.length-1,i));S.ch=chapters[cur].id;S.y=0;save();render();window.scrollTo(0,0);updateProg();}
$('#prev').onclick=()=>go(cur-1,true);
$('#next').onclick=()=>go(cur+1,true);
$('#fold').onclick=()=>{S.fold=!S.fold;applySettings();save();};
function updateProg(){const h=document.documentElement.scrollHeight-window.innerHeight;$('#prog').style.width=(h>0?(window.scrollY/h*100):0)+'%';}
window.addEventListener('scroll',()=>{updateProg();if(S.ch===chapters[cur].id){S.y=window.scrollY;save();}},{passive:true});
function clearMarks(){document.querySelectorAll('#chapter mark').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));$('#chapter').normalize();}
function highlight(q){clearMarks();q=(q||'').trim();if(!q)return;const root=$('#chapter');const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];let n;while(n=w.nextNode())ns.push(n);
ns.forEach(node=>{const idx=node.nodeValue.toLowerCase().indexOf(q.toLowerCase());if(idx<0)return;const f=document.createDocumentFragment();if(idx>0)f.appendChild(document.createTextNode(node.nodeValue.slice(0,idx)));
const mk=document.createElement('mark');mk.textContent=node.nodeValue.slice(idx,idx+q.length);f.appendChild(mk);if(idx+q.length<node.nodeValue.length)f.appendChild(document.createTextNode(node.nodeValue.slice(idx+q.length)));node.replaceWith(f);});
const first=root.querySelector('mark');if(first)first.scrollIntoView({block:'center'});}
let timer;
$('#q').oninput=e=>{clearTimeout(timer);const v=e.target.value;timer=setTimeout(()=>search(v),220);};
$('#q').onkeydown=e=>{if(e.key==='Escape'){e.target.value='';search('');e.target.blur();}};
function search(q){const box=$('#results');q=(q||'').trim();if(!q){box.style.display='none';hits=[];clearMarks();return;}
hits=[];chapters.forEach((c,i)=>{let idx=c.plain.toLowerCase().indexOf(q.toLowerCase());if(idx<0)return;
hits.push({i,title:`第${c.num}章 ${c.title}`,ctx:c.plain.slice(Math.max(0,idx-30),idx+q.length+40)});});
box.style.display='block';box.innerHTML=hits.length?hits.map((h,k)=>`<div class="r" data-k="${k}"><div class="rt">${h.title}</div><div class="rc">…${h.ctx.replace(/</g,'&lt;')}…</div></div>`).join(''):`<div class="empty">没有找到「${q.replace(/</g,'&lt;')}」</div>`;
box.querySelectorAll('.r').forEach(r=>{r.onclick=()=>{go(hits[+r.dataset.k].i,true);setTimeout(()=>highlight(q),30);};});}
document.addEventListener('keydown',e=>{if(/input|select|textarea/i.test(e.target.tagName))return;
if(e.key==='ArrowLeft')go(cur-1,true);if(e.key==='ArrowRight')go(cur+1,true);
if(e.key==='/'){e.preventDefault();$('#q').focus();}if(e.key==='t'||e.key==='T')$('#fold').click();});
applySettings();
let start=chapters.length-1;
if(S.ch){const k=chapters.findIndex(c=>c.id===S.ch);if(k>=0)start=k;}
cur=start;render();
if(S.ch===chapters[start].id&&S.y){window.scrollTo(0,S.y);}else{window.scrollTo(0,0);}
updateProg();
</script>
</body>
</html>
