<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" id="tc" content="#f6f2e9">
<title>北派盗墓笔记 · 续写阅读器</title>
<style>
:root{
  --bg:#f6f2e9; --panel:#fffdf7; --fg:#2b2620; --muted:#8a7f6d;
  --line:#e3dbc9; --accent:#8c2f22; --mark:#ffe08a;
}
html[data-theme="dark"]{
  --bg:#161513; --panel:#1e1c19; --fg:#d9d2c5; --muted:#8b8375;
  --line:#33302a; --accent:#d98b6a; --mark:#6b5320;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:contain;
}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:"Noto Serif CJK SC","Source Han Serif SC","Songti SC","SimSun",Georgia,serif;
  font-size:var(--fs,18px); line-height:var(--lh,1.9);
}
#bar{position:fixed;top:0;left:0;right:0;height:52px;z-index:50;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#bar .brand{font-weight:700;letter-spacing:.5px;white-space:nowrap}
#bar .brand small{color:var(--muted);font-weight:400;margin-left:6px}
#bar .spacer{flex:1}
button,select,input[type=search]{font-family:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
input[type=search]{cursor:text;width:180px}
#prog{position:fixed;top:52px;left:0;height:3px;background:var(--accent);width:0;z-index:60;transition:width .1s}
#tocbtn{display:none}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70;display:none}
body.toc-open #backdrop,body.tools-open #backdrop{display:block}
#toc{position:fixed;top:52px;bottom:0;left:0;width:250px;z-index:75;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:12px 0 40px;transition:transform .2s ease}
body.toc-fold #toc{transform:translateX(-100%)}
body.toc-fold #wrap{margin-left:0}
#fold{position:fixed;top:60px;left:8px;z-index:45;width:26px;height:34px;padding:0;border-radius:0 6px 6px 0;line-height:34px;text-align:center;opacity:.55}
#fold:hover{opacity:1}
#toc h3{margin:6px 16px 10px;font-size:14px;color:var(--muted);font-weight:600;letter-spacing:1px}
#toc a{display:block;padding:9px 16px;color:var(--fg);text-decoration:none;border-left:3px solid transparent;font-size:15px}
#toc a:hover{background:rgba(0,0,0,.04)}
#toc a.on{border-left-color:var(--accent);color:var(--accent);background:rgba(0,0,0,.04)}
#toc a .n{color:var(--muted);font-size:13px;margin-right:6px}
#wrap{margin-left:250px;padding:88px 20px 120px;transition:margin-left .2s ease}
#tools{display:flex;gap:8px;align-items:center}
#tools .ts-head{display:none}
#tools .ts-row{display:flex;align-items:center;gap:6px}
#tools .ts-row label{display:none}
#setbtn{display:none}
body.lock{overflow:hidden}
#chapter{max-width:var(--pw,760px);margin:0 auto}
#chapter h2{font-size:1.5em;margin:0 0 4px}
#chapter .meta{color:var(--muted);font-size:13px;margin-bottom:26px;font-family:system-ui,sans-serif}
#chapter p{text-indent:2em;margin:0 0 1em;text-align:justify}
#chapter blockquote{margin:1.4em 0;padding:.6em 1em;color:var(--muted);border-left:3px solid var(--accent);background:rgba(0,0,0,.03);text-indent:0}
#chapter hr{border:none;border-top:1px solid var(--line);margin:2.4em 0}
#chapter table{border-collapse:collapse;width:100%;font-size:.9em;margin:1.2em 0}
#chapter td{border:1px solid var(--line);padding:6px 10px}
#chapter .loading{color:var(--muted);text-align:center;margin-top:3em}
.hint{max-width:560px;margin:4em auto;padding:1.2em 1.5em;border:1px solid var(--line);border-radius:8px;color:var(--muted);line-height:1.8}
mark{background:var(--mark);color:inherit;border-radius:2px}
#pager{max-width:var(--pw,760px);margin:60px auto 0;display:flex;gap:10px;justify-content:space-between}
#pager button{padding:10px 16px}
#pager button:disabled{opacity:.35;cursor:default}
#results{position:fixed;top:52px;right:0;bottom:0;width:360px;z-index:90;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px;display:none}
#results .r{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
#results .r:hover{background:rgba(0,0,0,.04)}
#results .rt{font-size:13px;color:var(--accent);margin-bottom:3px}
#results .rc{font-size:13px;color:var(--muted);line-height:1.6}
#results .empty{color:var(--muted);font-size:14px;padding:10px}
@media (max-width:860px){
  #toc{transform:translateX(-100%)}
  body.toc-open #toc{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  #wrap{margin-left:0;padding-bottom:200px}
  #tocbtn{display:inline-block}
  #fold{display:none}
  #bar{padding:0 10px;gap:8px}
  #bar .brand small{display:none}
  button,select{height:38px}
  #q{flex:1;min-width:0;font-size:16px;height:38px}
  #setbtn{display:inline-block;min-width:44px;font-size:15px}
  #tools{display:none;position:fixed;left:0;right:0;bottom:0;z-index:95;flex-direction:column;align-items:stretch;gap:14px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.2)}
  body.tools-open #tools{display:flex}
  #tools .ts-head{display:flex;justify-content:space-between;align-items:center;font-family:system-ui,sans-serif}
  #tools .ts-head b{font-size:15px;white-space:nowrap}
  #tools .ts-head button{width:auto;flex:0 0 auto;height:36px;padding:0 16px;font-size:14px;background:var(--accent);color:#fff;border:none;border-radius:6px}
  #tools .ts-row{display:flex;align-items:center;gap:12px;min-width:0}
  #tools .ts-row label{display:block;flex:0 0 3.5em;font-size:15px;color:var(--muted);font-family:system-ui,sans-serif}
  #tools .ts-row select,#tools .ts-row button{width:auto;flex:1 1 auto;min-width:0}
  #tools select,#tools>button{width:100%;font-size:16px;height:44px}
  #pager{position:fixed;left:0;right:0;bottom:0;max-width:none;margin:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);gap:12px}
  #pager button{flex:1;height:44px;font-size:15px}
  #toc a{padding:12px 16px;font-size:16px}
  #results{width:100%;z-index:90}
}
</style>
</head>
<body>
<div id="bar">
  <button id="tocbtn">☰</button>
  <span class="brand">北派盗墓笔记</span>
  <span class="spacer"></span>
  <input type="search" id="q" placeholder="搜索全库…">
  <button id="setbtn">Aa</button>
  <div id="tools">
    <div class="ts-head"><b>显示设置</b><button id="tsdone">完成</button></div>
    <div class="ts-row"><label>字号</label>
      <select id="fs">
        <option value="16px">字小（16px）</option><option value="18px">字中（18px）</option><option value="21px">字大（21px）</option><option value="24px">字特大（24px）</option>
      </select>
    </div>
    <div class="ts-row"><label>行距</label>
      <select id="lh">
        <option value="1.7">行紧（1.7）</option><option value="1.9">行中（1.9）</option><option value="2.2">行松（2.2）</option>
      </select>
    </div>
    <div class="ts-row"><label>页宽</label>
      <select id="pw">
        <option value="680px">窄（680px）</option><option value="760px">中（760px）</option><option value="900px">宽（900px）</option>
      </select>
    </div>
    <button id="theme">🌙 夜间 / 日间模式切换</button>
  </div>
</div>
<div id="prog"></div>
<div id="backdrop"></div>
<button id="fold" title="收起/展开目录">⇤</button>
<nav id="toc"><h3>目录</h3><div id="toclist"></div></nav>
<main id="wrap">
  <article id="chapter"></article>
  <div id="pager">
    <button id="prev">← 上一章</button>
    <button id="next">下一章 →</button>
  </div>
</main>
<div id="results"></div>

<script>
const $ = s => document.querySelector(s);
const KEY = 'bpdx_reader_v1';
const DEF = {
  theme: (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light',
  fs:'18px', lh:'1.9', pw:'760px', ch:null, y:0, fold:false
};
let S = Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY)||'{}'));
let catalog = [], cur = -1;
const cache = {}; let allLoaded = false; let hits = [];

/* ---------- 隐私友好的访问统计（配置占位时自动关闭） ---------- */
const GOATCOUNTER_ENDPOINT = 'https://YOURCODE.goatcounter.com/count';
function setupAnalytics(){
  if(!GOATCOUNTER_ENDPOINT || GOATCOUNTER_ENDPOINT.includes('YOURCODE')) return;
  window.goatcounter = {
    referrer: function(){
      const u = new URL(location.href);
      const campaign = ['utm_source','utm_medium','utm_campaign','utm_content']
        .map(k => u.searchParams.get(k) ? `${k}=${u.searchParams.get(k)}` : '')
        .filter(Boolean).join('&');
      return campaign ? `campaign:${campaign}` : document.referrer;
    }
  };
  const s = document.createElement('script');
  s.async = true;
  s.src = 'https://gc.zgo.at/count.js';
  s.dataset.goatcounter = GOATCOUNTER_ENDPOINT;
  document.head.appendChild(s);
}
function trackChapter(c){
  if(!c || GOATCOUNTER_ENDPOINT.includes('YOURCODE')) return;
  const vars = {path:`/chapter/${c.id}`, title:`第${c.num}章 ${c.title}`};
  let tries = 0;
  const send = ()=>{
    if(window.goatcounter && typeof window.goatcounter.count === 'function'){
      window.goatcounter.count(vars); return;
    }
    if(++tries < 20) setTimeout(send, 100);
  };
  send();
}

function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function applySettings(){
  document.body.classList.toggle('toc-fold', !!S.fold);
  $('#fold').textContent = S.fold ? '⇥' : '⇤';
  document.documentElement.setAttribute('data-theme', S.theme);
  const tc = document.querySelector('#tc');
  if(tc) tc.setAttribute('content', S.theme==='dark' ? '#161513' : '#f6f2e9');
  document.documentElement.style.setProperty('--fs', S.fs);
  document.documentElement.style.setProperty('--lh', S.lh);
  document.documentElement.style.setProperty('--pw', S.pw);
  $('#theme').textContent = S.theme==='dark' ? '☀️' : '🌙';
  $('#fs').value = S.fs; $('#lh').value = S.lh; $('#pw').value = S.pw;
}
$('#theme').onclick = ()=>{ S.theme = S.theme==='dark'?'light':'dark'; applySettings(); save(); };
$('#fs').onchange = e=>{ S.fs=e.target.value; applySettings(); save(); };
$('#lh').onchange = e=>{ S.lh=e.target.value; applySettings(); save(); };
$('#pw').onchange = e=>{ S.pw=e.target.value; applySettings(); save(); };
$('#fold').onclick = ()=>{ S.fold = !S.fold; applySettings(); save(); };
$('#tocbtn').onclick = ()=> document.body.classList.toggle('toc-open');
function toggleSheet(force){
  const open = (force !== undefined) ? force : !document.body.classList.contains('tools-open');
  document.body.classList.toggle('tools-open', open);
  document.body.classList.toggle('lock', open);
}
$('#setbtn').onclick = ()=> toggleSheet();
$('#tsdone').onclick = ()=> toggleSheet(false);
$('#backdrop').onclick = ()=>{ toggleSheet(false); document.body.classList.remove('toc-open'); };

/* ---------- 移动端滑动翻章 ---------- */
let tx=0, ty=0, tt=0;
document.addEventListener('touchstart', e=>{
  if(/input|select|textarea|button/i.test(e.target.tagName)) return;
  const t = e.touches[0]; tx = t.clientX; ty = t.clientY; tt = Date.now();
}, {passive:true});
document.addEventListener('touchend', e=>{
  if(/input|select|textarea|button/i.test(e.target.tagName)) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - tx, dy = t.clientY - ty;
  if(Date.now()-tt < 600 && Math.abs(dx) > 90 && Math.abs(dy) < 50 && Math.abs(dx) > Math.abs(dy)*1.5){
    if(dx < 0 && cur < catalog.length-1) loadChapter(cur+1);
    else if(dx > 0 && cur > 0) loadChapter(cur-1);
  }
}, {passive:true});

function renderToc(){
  $('#toclist').innerHTML = catalog.map((c,i)=>
    `<a href="#" data-i="${i}"><span class="n">第${c.num}章</span>${c.title}</a>`).join('');
  $('#toclist').querySelectorAll('a').forEach(a=>{
    a.onclick = e=>{ e.preventDefault(); go(+a.dataset.i); document.body.classList.remove('toc-open'); };
  });
  markToc();
}
function markToc(){
  document.querySelectorAll('#toc a').forEach(a=>{
    a.classList.toggle('on', +a.dataset.i===cur);
    a.style.borderLeftColor = (+a.dataset.i===cur)?'':'';
  });
}

async function loadCatalog(){
  try{
    const r = await fetch('data/catalog.json');
    if(!r.ok) throw new Error(r.status);
    catalog = await r.json();
    renderToc();
    let k = catalog.length-1;
    if(S.ch){ const i = catalog.findIndex(c=>c.id===S.ch); if(i>=0) k=i; }
    cur = k;
    await loadChapter(k, {restore: !!S.ch});
  }catch(e){
    document.title = '离线提示 · 续写阅读器';
    $('#chapter').innerHTML =
      `<div class="hint"><strong>无法加载章节目录。</strong><br>
       如果你是直接双击打开的本文件：浏览器出于安全限制不允许 file:// 页面读取本地数据文件。<br>
       请运行 <code>python tools/build_reader.py --serve</code> 后访问本地服务。</div>`;
  }
}

async function loadChapter(i, opts={}){
  if(i<0 || i>=catalog.length) return;
  cur = i;
  const c = catalog[i];
  S.ch = c.id; save();
  markToc();
  $('#chapter').innerHTML = '<p class="loading">加载中…</p>';
  let ch = cache[c.id];
  if(!ch){
    const r = await fetch(`data/${c.id}.json`);
    if(!r.ok) throw new Error(r.status);
    ch = await r.json();
    cache[c.id] = ch;
  }
  document.title = `第${ch.num}章 ${ch.title} · 北派续写`;
  $('#chapter').innerHTML =
    `<h2>第${ch.num}章　${ch.title}</h2>` +
    `<div class="meta">${ch.words}字</div>` + ch.html;
  $('#prev').disabled = i<=0;
  $('#next').disabled = i>=catalog.length-1;
  if(opts.restore && S.y){ window.scrollTo(0, S.y); }
  else { S.y = 0; window.scrollTo(0,0); }
  updateProg();
  if($('#q').value.trim()) highlight($('#q').value.trim());
  trackChapter(ch);
}
function go(i){ loadChapter(i); }
$('#prev').onclick = ()=> loadChapter(cur-1);
$('#next').onclick = ()=> loadChapter(cur+1);

function updateProg(){
  const h = document.documentElement.scrollHeight - window.innerHeight;
  $('#prog').style.width = (h>0 ? (window.scrollY/h*100) : 0) + '%';
}
window.addEventListener('scroll', ()=>{
  updateProg();
  if(cur>=0 && S.ch===catalog[cur].id){ S.y = window.scrollY; save(); }
}, {passive:true});

/* ---------- 搜索：按需拉全量 ---------- */
function plainOf(ch){
  if(ch._plain) return ch._plain;
  const d = document.createElement('div');
  d.innerHTML = ch.html;
  ch._plain = d.textContent.replace(/\s+/g,' ').trim();
  return ch._plain;
}
async function ensureAll(){
  if(allLoaded) return;
  const todo = catalog.filter(c=>!cache[c.id]);
  const ph = $('#q').placeholder;
  for(let k=0;k<todo.length;k++){
    $('#q').placeholder = `正在索引 ${k+1}/${todo.length} …`;
    try{ const r = await fetch(`data/${todo[k].id}.json`); cache[todo[k].id] = await r.json(); }catch(e){}
  }
  $('#q').placeholder = ph;
  allLoaded = true;
}
function clearMarks(){
  document.querySelectorAll('#chapter mark').forEach(m=>{
    m.replaceWith(document.createTextNode(m.textContent));
  });
  $('#chapter').normalize();
}
function highlight(q){
  clearMarks();
  q = (q||'').trim();
  if(!q) return;
  const root = $('#chapter');
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; let n;
  while(n = walker.nextNode()) nodes.push(n);
  nodes.forEach(node=>{
    const idx = node.nodeValue.toLowerCase().indexOf(q.toLowerCase());
    if(idx < 0) return;
    const frag = document.createDocumentFragment();
    if(idx>0) frag.appendChild(document.createTextNode(node.nodeValue.slice(0,idx)));
    const mk = document.createElement('mark');
    mk.textContent = node.nodeValue.slice(idx, idx+q.length);
    frag.appendChild(mk);
    if(idx+q.length<node.nodeValue.length) frag.appendChild(document.createTextNode(node.nodeValue.slice(idx+q.length)));
    node.replaceWith(frag);
  });
  const first = root.querySelector('mark');
  if(first) first.scrollIntoView({block:'center'});
}
let timer;
$('#q').oninput = e=>{ clearTimeout(timer); const v=e.target.value; timer=setTimeout(()=>doSearch(v), 250); };
$('#q').onkeydown = e=>{ if(e.key==='Escape'){ e.target.value=''; doSearch(''); e.target.blur(); } };

async function doSearch(q){
  q = (q||'').trim();
  const box = $('#results');
  if(!q){ box.style.display='none'; hits=[]; clearMarks(); return; }
  if(!allLoaded){ box.style.display='block'; box.innerHTML='<div class="empty">正在建立索引…</div>'; await ensureAll(); }
  hits = [];
  catalog.forEach((c,i)=>{
    const ch = cache[c.id];
    if(!ch) return;
    const idx = plainOf(ch).toLowerCase().indexOf(q.toLowerCase());
    if(idx<0) return;
    hits.push({i, title:`第${c.num}章 ${c.title}`,
      ctx: plainOf(ch).slice(Math.max(0,idx-30), idx+q.length+40)});
  });
  box.style.display='block';
  box.innerHTML = hits.length
    ? hits.map((h,k)=>`<div class="r" data-k="${k}"><div class="rt">${h.title}</div><div class="rc">…${h.ctx.replace(/</g,'&lt;')}…</div></div>`).join('')
    : `<div class="empty">没有找到「${q.replace(/</g,'&lt;')}」</div>`;
  box.querySelectorAll('.r').forEach(r=>{
    r.onclick = async ()=>{
      await loadChapter(hits[+r.dataset.k].i);
      highlight(q);
    };
  });
}

document.addEventListener('keydown', e=>{
  if(/input|select|textarea/i.test(e.target.tagName)) return;
  if(e.key==='ArrowLeft') loadChapter(cur-1);
  if(e.key==='ArrowRight') loadChapter(cur+1);
  if(e.key==='/'){ e.preventDefault(); $('#q').focus(); }
  if(e.key==='t'||e.key==='T') $('#fold').click();
  if(e.key==='Escape') toggleSheet(false);
});

/* ---------- 修复层叠上下文：窄屏时面板挂到body下，脱离顶栏的z-index隔离 ---------- */
const toolsEl = $('#tools');
const toolsMq = window.matchMedia('(max-width:860px)');
function placeTools(){
  if(toolsMq.matches){ document.body.appendChild(toolsEl); }
  else { $('#bar').appendChild(toolsEl); }
}
if(toolsMq.addEventListener) toolsMq.addEventListener('change', placeTools);
else if(toolsMq.addListener) toolsMq.addListener(placeTools);
placeTools();

applySettings();
setupAnalytics();
loadCatalog();
</script>
</body>
</html>
